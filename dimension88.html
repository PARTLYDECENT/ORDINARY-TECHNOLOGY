            initializeWorldObjects3D(); // Additional setup if needed (e.g. non-road checks not really needed if generation is smart)

            spawnInitialEnemies(30); // Spawns enemies with 3D meshes
            spawnVehicles(10);    // Spawns vehicles with 3D meshes

            updateHUD(); // Initial HUD update
            window.addEventListener('resize', handleResize);
            handleResize(); // Initial sizing
            if (gameState.playerState === 'driving') startEngineNoise(); // Start engine if driving initially
            gameLoop();
            console.log("Game Loop Started.");
        }


        function createWorldElements3D() {
            // Roads (as textured planes)
            roads.forEach(roadData => {
                const dx = roadData.x2 - roadData.x1;
                const dz = roadData.z2 - roadData.z1;
                const length = Math.sqrt(dx * dx + dz * dz);
                if (length === 0) return;

                const roadGeo = new THREE.PlaneGeometry(gameState.world.roadWidth, length);
                //const roadMat = new THREE.MeshLambertMaterial({ color: gameState.world.roadColor });
                const roadMat = new THREE.MeshLambertMaterial({ map: roadTexture, color: gameState.world.roadColor });
                roadMat.map.repeat.set(1, length / gameState.world.roadWidth); // Repeat texture along length


                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.rotation.x = -Math.PI / 2;
                roadMesh.position.set(roadData.x1 + dx / 2, 0.01, roadData.z1 + dz / 2); // Midpoint, slightly above ground
                roadMesh.rotation.z = -Math.atan2(dz, dx) + Math.PI/2; // Align with road direction (Plane's length is along its local Y)
                scene.add(roadMesh);
            });

            // Buildings
            for (let i = 0; i < 20; i++) {
                const width = 5 + Math.random() * 8; // 3D units
                const depth = 5 + Math.random() * 8;
                const height = 8 + Math.random() * 12;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                const color = (Math.random() * 0.5 + 0.2) * 0xffffff; // Greyish random

                const geo = new THREE.BoxGeometry(width, height, depth);
                const mat = new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random()*0.1+0.05, 0.1, Math.random()*0.3+0.3) });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, height / 2, z); // Centered on ground
                const buildingLogic = {x, z, width, depth, height, color, mesh, boundingBox: new THREE.Box3().setFromObject(mesh)};

                if(!isOnRoad3D(buildingLogic.boundingBox)) { // Basic check
                    scene.add(mesh);
                    gameState.world.buildings.push(buildingLogic);
                }
            }

            // Trees (simple cylinders and spheres)
            for (let i = 0; i < 100; i++) {
                const trunkRadius = 0.2 + Math.random() * 0.3;
                const trunkHeight = 2 + Math.random() * 3;
                const leavesRadius = trunkRadius * (3 + Math.random() * 2);
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;

                const group = new THREE.Group();
                const trunkGeo = new THREE.CylinderGeometry(trunkRadius*0.7, trunkRadius, trunkHeight, 8);
                const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Brown
                const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
                trunkMesh.position.y = trunkHeight / 2;
                group.add(trunkMesh);

                const leavesGeo = new THREE.SphereGeometry(leavesRadius, 8, 6); // Low poly sphere
                const leavesMat = new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(0.2 + Math.random()*0.15, 0.5, Math.random()*0.2+0.2) }); // Greenish
                const leavesMesh = new THREE.Mesh(leavesGeo, leavesMat);
                leavesMesh.position.y = trunkHeight + leavesRadius * 0.6;
                group.add(leavesMesh);

                group.position.set(x, 0, z);
                const treeLogic = {x, z, trunkRadius, trunkHeight, leavesRadius, mesh: group, boundingBox: new THREE.Box3().setFromObject(group)};

                 if(!isOnRoad3D(treeLogic.boundingBox)) {
                    scene.add(group);
                    gameState.world.trees.push(treeLogic);
                 }
            }


            // Obstacles (rocks)
            for (let i = 0; i < 100; i++) {
                const size = 0.5 + Math.random() * 1.5; // Average size
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;

                const geo = new THREE.DodecahedronGeometry(size, 0); // Irregular shape
                const mat = new THREE.MeshLambertMaterial({ color: 0x777777 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, size / 2, z);
                mesh.rotation.set(Math.random() * Math.PI,Math.random() * Math.PI,Math.random() * Math.PI);
                const obsLogic = {x,z,width:size,depth:size,height:size, mesh, boundingBox: new THREE.Box3().setFromObject(mesh)};
                if(!isOnRoad3D(obsLogic.boundingBox)) {
                    scene.add(mesh);
                    gameState.world.obstacles.push(obsLogic);
                }
            }

            // Gas Stations
            for (let i = 0; i < 5; i++) {
                const width = 4, depth = 5, height = 3;
                const x = 40 + Math.random() * (gameState.world.width - 80);
                const z = 40 + Math.random() * (gameState.world.height - 80);

                const geo = new THREE.BoxGeometry(width, height, depth);
                const mat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x + width/2, height / 2, z + depth/2); // Original code used top-left anchors
                const stationLogic = {x, z, width, depth, height, color: 0xcc0000, mesh, boundingBox: new THREE.Box3().setFromObject(mesh)};
                // Ensure not on road before adding. AABB of mesh vs road AABBs
                // Simplified: no check, gas stations might be on roads. Fine for wasteland.
                scene.add(mesh);
                gameState.world.gasStations.push(stationLogic);

                // Add a little pump
                const pumpGeo = new THREE.BoxGeometry(0.5,1.2,0.5);
                const pumpMat = new THREE.MeshLambertMaterial({color:0x990000});
                const pumpMesh = new THREE.Mesh(pumpGeo,pumpMat);
                pumpMesh.position.set(x+width/2 - width*0.3, 1.2/2, z+depth/2 + depth*0.6); // In front
                scene.add(pumpMesh);
                // Note: this pump isn't part of gasStation boundingBox used in refuel check
            }
            // Impassable zones (visual representation)
            gameState.world.impassableZones.forEach(zoneData => {
                 const geo = new THREE.BoxGeometry(zoneData.width, zoneData.height, zoneData.depth);
                 const mat = new THREE.MeshLambertMaterial({ color: zoneData.color, transparent: true, opacity: 0.4 });
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.position.set(zoneData.x + zoneData.width/2, zoneData.height/2, zoneData.z + zoneData.depth/2);
                 scene.add(mesh);
                 zoneData.mesh = mesh; // Store mesh
                 zoneData.boundingBox = new THREE.Box3().setFromObject(mesh); // Store BB
            });

        }
        function isOnRoad3D(objectBoundingBox, buffer = 1.0) {
             for (const roadData of roads) {
                 const dx = roadData.x2 - roadData.x1;
                 const dz = roadData.z2 - roadData.z1;
                 const length = Math.sqrt(dx*dx + dz*dz);
                 if (length === 0) continue;

                 // Create a bounding box for the road segment
                 const roadCenterX = roadData.x1 + dx / 2;
                 const roadCenterZ = roadData.z1 + dz / 2;
                 const angle = Math.atan2(dz, dx);

                 // Create a temporary box geometry for the road (not added to scene)
                 const roadBox = new THREE.Box3();
                 // This is tricky because Box3 is axis-aligned.
                 // A simple AABB for the road overall. For more precision, OBB vs AABB needed.
                 const minX = Math.min(roadData.x1, roadData.x2) - gameState.world.roadWidth / 2 - buffer;
                 const maxX = Math.max(roadData.x1, roadData.x2) + gameState.world.roadWidth / 2 + buffer;
                 const minZ = Math.min(roadData.z1, roadData.z2) - gameState.world.roadWidth / 2 - buffer;
                 const maxZ = Math.max(roadData.z1, roadData.z2) + gameState.world.roadWidth / 2 + buffer;
                 roadBox.set(new THREE.Vector3(minX, -1, minZ), new THREE.Vector3(maxX, 1, maxZ)); // Y irrelevant

                 if (objectBoundingBox.intersectsBox(roadBox)) {
                     return true; // Overlaps with the road's broader AABB
                 }
             }
             return false;
        }


        function initializeWorldObjects3D() {
            console.log(`3D World Initialized: ${gameState.world.trees.length} Trees, ${gameState.world.buildings.length} Buildings, ${gameState.world.obstacles.length} Obstacles`);
        }


        function spawnInitialEnemies(count) {
            let spawned = 0; let attempts = 0;
            while (spawned < count && attempts < count * 10) {
                attempts++;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height; // Z in 3D
                const dx = x - gameState.player.x;
                const dz = z - gameState.player.z; // Z in 3D
                if (dx*dx + dz*dz < 50*50) continue; // Min spawn dist (3D units)

                const enemyTestBB = new THREE.Box3( // Approximate BB for test spawn location
                    new THREE.Vector3(x - ENEMY_WIDTH/2, 0, z - ENEMY_WIDTH/2),
                    new THREE.Vector3(x + ENEMY_WIDTH/2, ENEMY_HEIGHT, z + ENEMY_WIDTH/2)
                );

                if (isOnRoad3D(enemyTestBB, ENEMY_WIDTH)) continue;

                let inObject = false;
                const staticObjects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                for (const obj of staticObjects) {
                    if (enemyTestBB.intersectsBox(obj.boundingBox)) {
                        inObject = true; break;
                    }
                }
                if (inObject) continue;

                spawnEnemy(x, z);
                spawned++;
            }
            console.log(`Spawned ${spawned} enemies.`);
        }


        function spawnVehicles(count) {
            let spawned = 0; let attempts = 0;
            const vehicleTypes = Object.keys(VEHICLE_TYPES);
            while (spawned < count && attempts < count * 20) {
                attempts++;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                const dx = x - gameState.player.x;
                const dz = z - gameState.player.z;
                if (dx * dx + dz * dz < 30 * 30) continue; // Spawn further

                const randomVehicleType = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
                const vehicleProps = VEHICLE_TYPES[randomVehicleType];

                const vehicleMesh = createVehicleMesh(randomVehicleType, vehicleProps.color);
                vehicleMesh.position.set(x, vehicleProps.height / 2, z);
                vehicleMesh.rotation.y = Math.random() * Math.PI * 2;
                const vehicleBB = new THREE.Box3().setFromObject(vehicleMesh);


                let inObject = false;
                const staticObjects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                for (const obj of staticObjects) {
                    if (vehicleBB.intersectsBox(obj.boundingBox)) { inObject = true; break; }
                }
                if (isOnRoad3D(vehicleBB, vehicleProps.width)) {
                    //Allow spawn on road for vehicles
                } else if(inObject) {
                    continue; //Don't spawn in other objects if not on road
                }


                const vehicleLogic = {
                    x: x, z: z,
                    width: vehicleProps.width, height: vehicleProps.height, depth: vehicleProps.depth,
                    angle: vehicleMesh.rotation.y, color: vehicleProps.color,
                    maxSpeed: vehicleProps.maxSpeed, acceleration: vehicleProps.acceleration,
                    deceleration: vehicleProps.deceleration, handling: vehicleProps.handling,
                    fuelConsumption: vehicleProps.fuelConsumption, fuelLevel: 100,
                    type: randomVehicleType,
                    mesh: vehicleMesh,
                    boundingBox: vehicleBB
                };

                gameState.world.vehicles.push(vehicleLogic);
                threeObjects.vehicles.push(vehicleMesh); // Track the mesh
                scene.add(vehicleMesh);
                spawned++;
            }
            console.log(`Spawned ${spawned} vehicles.`);
        }


        function handleResize() {
            const gameContainer = document.getElementById('game-container');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            // Keep original canvas aspect ratio for 3D view
            const aspectRatio = gameCanvasWidth / gameCanvasHeight;

            let newWidth = windowWidth * 0.98;
            let newHeight = newWidth / aspectRatio;
            if (newHeight > windowHeight * 0.98) {
                newHeight = windowHeight * 0.98;
                newWidth = newHeight * aspectRatio;
            }
            gameContainer.style.width = `${newWidth}px`;
            gameContainer.style.height = `${newHeight}px`;

            // Renderer size should match its canvas element style size for sharp picture
            // but game internal dimensions (gameCanvasWidth/Height) define the world scale on screen
            if(renderer && camera){
                // Update renderer size for drawing buffer
                renderer.setSize(newWidth, newHeight); // Use the actual display size
                // If you want to maintain internal resolution fixed and just scale output:
                // renderer.setSize(gameCanvasWidth, gameCanvasHeight);
                // renderer.domElement.style.width = `${newWidth}px`;
                // renderer.domElement.style.height = `${newHeight}px`;

                camera.aspect = newWidth / newHeight; // Use newWidth/newHeight for aspect
                camera.updateProjectionMatrix();
            }
        }

        window.onload = initGame;
    </script>
