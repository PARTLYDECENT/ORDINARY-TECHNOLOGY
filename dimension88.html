<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 1-Style Action Sim V3</title>
    <style>
        /* CSS remains the same */
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; }
        #gameCanvas { border: 2px solid #444; background-color: #000; display: block; image-rendering: pixelated; cursor: crosshair; }
        #hud { position: absolute; color: #fff; padding: 8px; font-size: 13px; text-align: left; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.7); border-radius: 5px; border: 1px solid #444; z-index: 10; }
        #hud div { margin-bottom: 4px; }
        #fuel-bar { width: 90px; height: 8px; background-color: #333; margin: 3px 0; border: 1px solid #555; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #fuel-level { height: 100%; background-color: #3f3; width: 100%; transition: width 0.5s ease-out; }
        #health-bar { width: 90px; height: 8px; background-color: #500; margin: 3px 0; border: 1px solid #722; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #health-level { height: 100%; background-color: #f33; width: 100%; transition: width 0.2s linear; }
        #location { margin-top: 4px; }
        #mini-map { position: absolute; top: 10px; right: 10px; width: 120px; height: 120px; background-color: rgba(0, 0, 0, 0.75); border: 1px solid #444; border-radius: 5px; z-index: 10; overflow: hidden; }
        #mini-map canvas { display: block; }
        #controls-display { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #bbb; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #444; z-index: 10; white-space: nowrap; }
        #mission-text, #stats { display: none; } /* Hide placeholders */
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud">
             <div id="health-line">HP: <div id="health-bar"><div id="health-level"></div></div></div>
             <div id="speed-line">SPD: <span id="speed">0</span></div>
             <div id="fuel-line">FUEL: <div id="fuel-bar"><div id="fuel-level"></div></div></div>
             <div id="location">LOCATION: UNKNOWN</div>
             <div id="enemy-count">ENEMIES: <span id="enemies-left">0</span></div>
         </div>
         <div id="mini-map"></div>
         <div id="controls-display">
             WASD/Arrows: Move | E: Enter/Exit | F: Refuel | SPACE: Handbrake | SHIFT: Fire
         </div>
        <div id="mission-text"></div>
        <div id="stats"></div>
    </div>

    <script>
        // --- Canvas and Context ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniMapContainer = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMapContainer.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120; miniMapCtx.canvas.height = 120;

        // --- Constants ---
        // Player Ped Size
        const PLAYER_PED_WIDTH = 6;
        const PLAYER_PED_HEIGHT = 9;
        // Enemy Size (Matches Player Ped)
        const ENEMY_WIDTH = PLAYER_PED_WIDTH;
        const ENEMY_HEIGHT = PLAYER_PED_HEIGHT;

        const PROJECTILE_SPEED = 8;
        const PROJECTILE_LIFESPAN = 60;
        const PROJECTILE_DAMAGE_PLAYER = 12; // Enemy damage to player
        const PROJECTILE_DAMAGE_ENEMY = 18; // Player damage to enemy
        const ENEMY_HEALTH = 50; // Increased health slightly
        const ENEMY_SPEED = 1.3;
        const ENEMY_CHASE_DIST = 350;
        const ENEMY_SHOOT_DIST = 250; // Range at which enemies start shooting
        const ENEMY_FIRE_RATE = 45; // Frames between enemy shots
        const ENEMY_BULLET_SPREAD = 5; // Enemy accuracy spread
        const PLAYER_ENTER_VEHICLE_RANGE = 30;
        const ANIM_SPEED = 6; // Lower = faster animation

        // --- Game State ---
        const gameState = {
            playerState: 'driving',
            player: {
                x: 1500, y: 1500, width: 20, height: 36, speed: 0, maxSpeed: 5,
                acceleration: 0.1, deceleration: 0.05, handling: 3.5, angle: 0,
                fuelLevel: 100, fuelConsumption: 0.02, color: '#0066cc',
                health: 100, maxHealth: 100,
                pedWidth: PLAYER_PED_WIDTH, pedHeight: PLAYER_PED_HEIGHT, pedSpeed: 1.5,
                isMoving: false, // Renamed from isWalking for clarity
                animTimer: 0, animFrame: 0, // 0-3 for 4 frames
                animSpeed: ANIM_SPEED,
                fireCooldown: 0, fireRate: 10, // Faster player fire rate
                bulletSpread: 3
            },
            camera: { x: 0, y: 0, width: canvas.width, height: canvas.height },
            controls: { /* ... */ up: false, down: false, left: false, right: false, handbrake: false, refuel: false, fire: false, enterExit: false, enterExitProcessed: false },
            world: {
                width: 3000, height: 3000, roadWidth: 60, grassColor: '#1a3d0c',
                roadColor: '#333', lineColor: '#fff', lineWidth: 2,
                trees: [], buildings: [], obstacles: [], gasStations: [],
                vehicles: [], enemies: [], projectiles: [],
                impassableZones: [ /* ... */ { type: 'water', x: 2200, y: 2200, width: 500, height: 600, color: 'rgba(50, 80, 150, 0.6)' }, { type: 'restricted', x: 100, y: 100, width: 400, height: 500, color: 'rgba(100, 100, 100, 0.4)' } ],
                startTime: Date.now()
            },
            fx: { /* ... */ skidMarks: [], dustParticles: [], explosions: [], muzzleFlashes: [], hitSparks: [] },
            zones: [ /* ... */ {name: "DOWNTOWN", x: 1000, y: 1000, radius: 600}, {name: "FOREST HILLS", x: 600, y: 2200, radius: 500}, {name: "EASTERN PLAINS", x: 2200, y: 1800, radius: 400}, {name: "INDUSTRIAL PARK", x: 2000, y: 500, radius: 350} ],
            gameOver: false
        };

        // --- Roads Data ---
        const roads = [ /* ... */ {x1: 0, y1: 1000, x2: gameState.world.width, y2: 1000}, {x1: 0, y1: 2000, x2: gameState.world.width, y2: 2000}, {x1: 1000, y1: 0, x2: 1000, y2: gameState.world.height}, {x1: 2000, y1: 0, x2: 2000, y2: gameState.world.height}, {x1: 500, y1: 500, x2: 1500, y2: 1500}, {x1: 2500, y1: 500, x2: 1500, y2: 1500}, {x1: 500, y1: 2500, x2: 1500, y2: 1500}, {x1: 2500, y1: 2500, x2: 1500, y2: 1500}, {x1: 200, y1: 1000, x2: 500, y2: 1200}, {x1: 2800, y1: 1000, x2: 2500, y2: 1200}, {x1: 200, y1: 2000, x2: 500, y2: 1800}, {x1: 2800, y1: 2000, x2: 2500, y2: 1800} ];

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => { handleKeyInput(e, true); });
        window.addEventListener('keyup', (e) => { handleKeyInput(e, false); });
        function handleKeyInput(e, isPressed) { /* ... Same ... */ const key = e.key.toLowerCase(); switch(key) { case 'arrowup': case 'w': gameState.controls.up = isPressed; break; case 'arrowdown': case 's': gameState.controls.down = isPressed; break; case 'arrowleft': case 'a': gameState.controls.left = isPressed; break; case 'arrowright': case 'd': gameState.controls.right = isPressed; break; case ' ': gameState.controls.handbrake = isPressed; break; case 'f': gameState.controls.refuel = isPressed; break; case 'shift': gameState.controls.fire = isPressed; break; case 'e': if (isPressed && !gameState.controls.enterExitProcessed) { gameState.controls.enterExit = true; gameState.controls.enterExitProcessed = true; } else if (!isPressed) { gameState.controls.enterExitProcessed = false; } break; } if ((key === ' ' || key === 'shift' || key.startsWith('arrow')) && isPressed) e.preventDefault(); }

        // --- Enter/Exit Vehicle Logic ---
        function handleEnterExitAction() { /* ... Same ... */ if (!gameState.controls.enterExit) return; if (gameState.playerState === 'driving') { const parkedCar = { x: gameState.player.x, y: gameState.player.y, width: gameState.player.width, height: gameState.player.height, angle: gameState.player.angle, color: gameState.player.color, maxSpeed: gameState.player.maxSpeed, handling: gameState.player.handling, fuelLevel: gameState.player.fuelLevel }; gameState.world.vehicles.push(parkedCar); gameState.playerState = 'onFoot'; const exitOffset = (gameState.player.width / 2) + 5 + gameState.player.pedWidth / 2; const exitAngleRad = (gameState.player.angle - 90) * Math.PI / 180; gameState.player.x += Math.cos(exitAngleRad) * exitOffset; gameState.player.y += Math.sin(exitAngleRad) * exitOffset; gameState.player.speed = 0; } else if (gameState.playerState === 'onFoot') { let closestCar = null; let minDistanceSq = PLAYER_ENTER_VEHICLE_RANGE * PLAYER_ENTER_VEHICLE_RANGE; for (let i = gameState.world.vehicles.length - 1; i >= 0; i--) { const car = gameState.world.vehicles[i]; const dx = gameState.player.x - car.x; const dy = gameState.player.y - car.y; const distanceSq = dx * dx + dy * dy; if (distanceSq < minDistanceSq) { minDistanceSq = distanceSq; closestCar = car; closestCar.index = i; } } if (closestCar) { gameState.playerState = 'driving'; gameState.player.x = closestCar.x; gameState.player.y = closestCar.y; gameState.player.width = closestCar.width; gameState.player.height = closestCar.height; gameState.player.angle = closestCar.angle; gameState.player.color = closestCar.color; gameState.player.maxSpeed = closestCar.maxSpeed; gameState.player.handling = closestCar.handling; gameState.player.fuelLevel = closestCar.fuelLevel; gameState.player.speed = 0; gameState.world.vehicles.splice(closestCar.index, 1); } } gameState.controls.enterExit = false; }

        // --- Player Firing Logic ---
        function handlePlayerFiring() { /* ... Same, uses spread ... */ if (gameState.playerState === 'onFoot' && gameState.controls.fire && gameState.player.fireCooldown <= 0) { const spreadRad = (Math.random() - 0.5) * gameState.player.bulletSpread * (Math.PI / 180); const fireAngleRad = gameState.player.angle * Math.PI / 180 + spreadRad; const muzzleOffsetX = Math.sin(fireAngleRad) * (gameState.player.pedWidth); const muzzleOffsetY = -Math.cos(fireAngleRad) * (gameState.player.pedHeight); const startX = gameState.player.x + muzzleOffsetX; const startY = gameState.player.y + muzzleOffsetY; gameState.world.projectiles.push({ x: startX, y: startY, vx: Math.sin(fireAngleRad) * PROJECTILE_SPEED, vy: -Math.cos(fireAngleRad) * PROJECTILE_SPEED, lifespan: PROJECTILE_LIFESPAN, owner: 'player', damage: PROJECTILE_DAMAGE_ENEMY, color: '#ff0' }); createMuzzleFlash(startX, startY); gameState.player.fireCooldown = gameState.player.fireRate; } if (gameState.player.fireCooldown > 0) gameState.player.fireCooldown--; }

        // --- Game Loop ---
        function gameLoop() { /* ... Same ... */ if (gameState.gameOver) { drawGameOver(); requestAnimationFrame(gameLoop); return; } handleEnterExitAction(); handlePlayerFiring(); updateGame(); renderGame(); requestAnimationFrame(gameLoop); }

        // --- Update Logic ---
        function updateGame() { /* ... Same ... */ updatePlayerPosition(); updateEnemies(); updateProjectiles(); updateCamera(); updateParticlesAndEffects(); updateHUD(); checkGameOverCondition(); }

        // --- Player Update ---
        function updatePlayerPosition() { /* ... Same structure ... */ const oldX = gameState.player.x; const oldY = gameState.player.y; if (gameState.playerState === 'driving') { updateDrivingPhysics(); checkGasStations(); } else if (gameState.playerState === 'onFoot') { updateWalkingPhysics(); } checkCollisions(oldX, oldY, gameState.player, gameState.playerState); }
        function updateDrivingPhysics() { /* ... Same ... */ if (gameState.controls.up && gameState.player.fuelLevel > 0) { gameState.player.speed += gameState.player.acceleration; gameState.player.fuelLevel -= gameState.player.fuelConsumption * (0.5 + Math.abs(gameState.player.speed) / gameState.player.maxSpeed); if (Math.random() > 0.7 && Math.abs(gameState.player.speed) > 1) createDustParticle(true); } else if (gameState.controls.down) { if (gameState.player.speed > 0.1) gameState.player.speed -= gameState.player.deceleration * 3; else { gameState.player.speed -= gameState.player.acceleration / 1.5; if (gameState.player.fuelLevel > 0) gameState.player.fuelLevel -= gameState.player.fuelConsumption * 0.5; } } else { if (Math.abs(gameState.player.speed) < gameState.player.deceleration) gameState.player.speed = 0; else if (gameState.player.speed > 0) gameState.player.speed -= gameState.player.deceleration; else gameState.player.speed += gameState.player.deceleration; } if (gameState.player.speed > gameState.player.maxSpeed) gameState.player.speed = gameState.player.maxSpeed; const maxReverseSpeed = gameState.player.maxSpeed / 2; if (gameState.player.speed < -maxReverseSpeed) gameState.player.speed = -maxReverseSpeed; if (Math.abs(gameState.player.speed) > 0.5) { let steeringFactor = gameState.player.handling * (gameState.controls.handbrake ? 1.7 : 1); let speedModifier = 1.0 - (Math.abs(gameState.player.speed) / (gameState.player.maxSpeed * 1.5)); speedModifier = Math.max(0.3, speedModifier); let turnDirection = gameState.player.speed >= 0 ? 1 : -1; if (gameState.controls.left) { gameState.player.angle -= steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } if (gameState.controls.right) { gameState.player.angle += steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } } if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > 0.5) { gameState.player.speed *= 0.94; if (Math.random() > 0.4) createSkidMark(); } if (gameState.player.fuelLevel < 0) gameState.player.fuelLevel = 0; if (Math.abs(gameState.player.speed) > 0.01) { const radians = gameState.player.angle * Math.PI / 180; gameState.player.x += Math.sin(radians) * gameState.player.speed; gameState.player.y -= Math.cos(radians) * gameState.player.speed; } }
        function updateWalkingPhysics() { /* ... Uses 4-frame animation cycle ... */
             let moveX = 0; let moveY = 0; const speed = gameState.player.pedSpeed;
             if (gameState.controls.up) moveY -= speed; if (gameState.controls.down) moveY += speed;
             if (gameState.controls.left) moveX -= speed; if (gameState.controls.right) moveX += speed;
             gameState.player.isMoving = (Math.abs(moveX) > 0.01 || Math.abs(moveY) > 0.01);
             if (moveX !== 0 && moveY !== 0) { const factor = speed / Math.sqrt(moveX * moveX + moveY * moveY); moveX *= factor; moveY *= factor; }
             if (gameState.player.isMoving) { gameState.player.angle = (Math.atan2(moveX, -moveY) * 180 / Math.PI); }
             gameState.player.x += moveX; gameState.player.y += moveY;
             // --- Update 4-Frame Animation ---
             if (gameState.player.isMoving) {
                 gameState.player.animTimer++;
                 if (gameState.player.animTimer >= gameState.player.animSpeed) {
                     gameState.player.animTimer = 0;
                     gameState.player.animFrame = (gameState.player.animFrame + 1) % 4; // Cycle 0, 1, 2, 3
                 }
             } else {
                 gameState.player.animFrame = 0; // Idle frame
                 gameState.player.animTimer = 0;
             }
        }

        // --- Enemy Logic (With Shooting) ---
        function spawnEnemy(x, y) {
            gameState.world.enemies.push({
                x: x, y: y, health: ENEMY_HEALTH, maxHealth: ENEMY_HEALTH,
                width: ENEMY_WIDTH, height: ENEMY_HEIGHT, speed: ENEMY_SPEED, angle: 0,
                color: `hsl(${Math.random() * 60}, 70%, 50%)`, state: 'idle',
                aiTimer: Math.random() * 120,
                // Shooting properties
                fireCooldown: ENEMY_FIRE_RATE / 2 + Math.random() * ENEMY_FIRE_RATE, // Stagger initial shots
                fireRate: ENEMY_FIRE_RATE,
                bulletSpread: ENEMY_BULLET_SPREAD,
                // Animation properties (same as player)
                isMoving: false, animTimer: 0, animFrame: 0, animSpeed: ANIM_SPEED
            });
        }

        function updateEnemies() {
            for (let i = gameState.world.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.world.enemies[i];
                const oldX = enemy.x; const oldY = enemy.y;
                const dxPlayer = gameState.player.x - enemy.x; const dyPlayer = gameState.player.y - enemy.y;
                const distSqPlayer = dxPlayer * dxPlayer + dyPlayer * dyPlayer;

                let targetAngleRad = Math.atan2(dyPlayer, dxPlayer);
                enemy.isMoving = false; // Assume not moving initially

                // --- State Logic ---
                if (enemy.state === 'idle') {
                    enemy.aiTimer--;
                    if (distSqPlayer < ENEMY_CHASE_DIST * ENEMY_CHASE_DIST) {
                        enemy.state = 'chasing';
                    } else if (enemy.aiTimer <= 0) {
                        enemy.aiTimer = 120 + Math.random() * 120;
                    }
                } else if (enemy.state === 'chasing') {
                    if (distSqPlayer > (ENEMY_CHASE_DIST + 50) * (ENEMY_CHASE_DIST + 50)) { // Lose player
                        enemy.state = 'idle'; enemy.aiTimer = 60;
                    } else {
                        // Aim towards player
                        enemy.angle = targetAngleRad * 180 / Math.PI + 90;
                        // Move if not too close
                        if (distSqPlayer > (ENEMY_SHOOT_DIST * 0.5) * (ENEMY_SHOOT_DIST * 0.5)) { // Don't crowd too much
                             enemy.x += Math.cos(targetAngleRad) * enemy.speed;
                             enemy.y += Math.sin(targetAngleRad) * enemy.speed;
                             enemy.isMoving = true;
                        }

                        // --- Enemy Shooting ---
                        if (distSqPlayer < ENEMY_SHOOT_DIST * ENEMY_SHOOT_DIST && enemy.fireCooldown <= 0) {
                            // Basic Line of Sight Check (very simple: check midpoint)
                            const midX = (enemy.x + gameState.player.x) / 2;
                            const midY = (enemy.y + gameState.player.y) / 2;
                            let canSeePlayer = true;
                            const worldGeometry = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                            for(const obj of worldGeometry) {
                                if (midX > obj.x && midX < obj.x + obj.width && midY > obj.y && midY < obj.y + obj.height) {
                                    canSeePlayer = false; break;
                                }
                            }

                            if (canSeePlayer) {
                                const spreadRad = (Math.random() - 0.5) * enemy.bulletSpread * (Math.PI / 180);
                                const fireAngleRad = targetAngleRad + spreadRad; // Already calculated angle to player
                                const muzzleOffsetX = Math.sin(fireAngleRad) * (enemy.width);
                                const muzzleOffsetY = Math.cos(fireAngleRad) * (enemy.height); // Use cos here? Check angle usage
                                const startX = enemy.x + muzzleOffsetX;
                                const startY = enemy.y + muzzleOffsetY; // Adjust offset logic if needed

                                gameState.world.projectiles.push({
                                    x: startX, y: startY,
                                    vx: Math.cos(fireAngleRad) * PROJECTILE_SPEED, // Use cos for x velocity based on atan2 result
                                    vy: Math.sin(fireAngleRad) * PROJECTILE_SPEED, // Use sin for y velocity
                                    lifespan: PROJECTILE_LIFESPAN, owner: 'enemy', // Mark owner
                                    damage: PROJECTILE_DAMAGE_PLAYER, color: '#f66' // Red enemy bullets
                                });
                                createMuzzleFlash(startX, startY);
                                enemy.fireCooldown = enemy.fireRate;
                            }
                        }
                    }
                }

                 // Update enemy animation frame (same as player)
                 if (enemy.isMoving) {
                     enemy.animTimer++;
                     if (enemy.animTimer >= enemy.animSpeed) {
                         enemy.animTimer = 0;
                         enemy.animFrame = (enemy.animFrame + 1) % 4; // Cycle 0, 1, 2, 3
                     }
                 } else {
                     enemy.animFrame = 0; // Idle frame
                     enemy.animTimer = 0;
                 }

                // Update cooldown
                if (enemy.fireCooldown > 0) enemy.fireCooldown--;

                // Collision check for enemy
                checkCollisions(oldX, oldY, enemy, 'enemy');

                // Check health
                if (enemy.health <= 0) {
                    createExplosion(enemy.x, enemy.y, enemy.color, 0.8); // Slightly smaller explosion
                    gameState.world.enemies.splice(i, 1);
                }
            }
        }

        // --- Projectile Logic (Handles owner) ---
        function updateProjectiles() {
             for (let i = gameState.world.projectiles.length - 1; i >= 0; i--) {
                 const p = gameState.world.projectiles[i];
                 p.x += p.vx; p.y += p.vy; p.lifespan--;
                 let hit = false; let hitWall = false;

                 // Collision check depends on owner
                 if (p.owner === 'player') {
                     // Check vs Enemies
                     for (let j = gameState.world.enemies.length - 1; j >= 0; j--) { /* ... same hit check ... */ const enemy = gameState.world.enemies[j]; const dx = p.x - enemy.x; const dy = p.y - enemy.y; const hitRadius = Math.max(enemy.width, enemy.height) * 0.7; if (dx * dx + dy * dy < hitRadius * hitRadius) { enemy.health -= p.damage; hit = true; break; } }
                 } else if (p.owner === 'enemy') {
                     // Check vs Player (on foot only for now)
                     if (gameState.playerState === 'onFoot') {
                          const dx = p.x - gameState.player.x;
                          const dy = p.y - gameState.player.y;
                          const hitRadius = Math.max(gameState.player.pedWidth, gameState.player.pedHeight) * 0.7;
                          if (dx * dx + dy * dy < hitRadius * hitRadius) {
                              gameState.player.health -= p.damage;
                              hit = true;
                              // Add hit feedback? Screen shake? Red flash?
                              console.log("Player Hit! Health:", gameState.player.health);
                          }
                     }
                     // Add check vs player vehicle later if desired
                 }

                 // Check collision with world geometry (if not already hit)
                 if (!hit) { const worldGeometry = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones]; for(const obj of worldGeometry) { if (p.x > obj.x && p.x < obj.x + obj.width && p.y > obj.y && p.y < obj.y + obj.height) { hit = true; hitWall = true; break; } } }
                 // Check world boundaries
                 if (p.x < 0 || p.x > gameState.world.width || p.y < 0 || p.y > gameState.world.height) { hit = true; hitWall = true; }

                 // Remove projectile
                 if (p.lifespan <= 0 || hit) { if (hitWall) { createHitSparks(p.x, p.y); } else if (hit && p.owner === 'player') { createExplosion(p.x, p.y, '#ff0', 0.4); /* Enemy hit splash */ } else if (hit && p.owner === 'enemy') { createExplosion(p.x, p.y, '#f66', 0.4); /* Player hit splash */ } gameState.world.projectiles.splice(i, 1); }
             }
         }

        // --- Collision ---
        function checkCollisions(oldX, oldY, entity, entityType) { /* ... Same as previous (uses impassableZones) ... */ const isDriving = entityType === 'driving'; const isPlayer = entityType === 'driving' || entityType === 'onFoot'; const isEnemy = entityType === 'enemy'; const pW = isDriving ? entity.width : (isPlayer ? entity.pedWidth : entity.width); const pH = isDriving ? entity.height : (isPlayer ? entity.pedHeight : entity.height); const entityRect = { x: entity.x - pW / 2, y: entity.y - pH / 2, width: pW, height: pH }; let collisionOccurred = false; let bounced = false; if (entityRect.x < 0) { entityRect.x = 0; bounced = true; } if (entityRect.y < 0) { entityRect.y = 0; bounced = true; } if (entityRect.x + pW > gameState.world.width) { entityRect.x = gameState.world.width - pW; bounced = true; } if (entityRect.y + pH > gameState.world.height) { entityRect.y = gameState.world.height - pH; bounced = true; } entity.x = entityRect.x + pW / 2; entity.y = entityRect.y + pH / 2; if (bounced && isDriving) entity.speed *= -0.4; else if (bounced && isEnemy) entity.state = 'idle'; const objects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones]; for (const obj of objects) { const objRect = { x: obj.x, y: obj.y, width: obj.width, height: obj.height }; if (isCollidingAABB(entityRect, objRect)) { collisionOccurred = true; entity.x = oldX; entity.y = oldY; if (isDriving) { entity.speed *= -0.5; createDustParticle(false); createDustParticle(false); } else if (isEnemy) { entity.state = 'idle'; } break; } } return collisionOccurred; }
        function isCollidingAABB(rect1, rect2) { /* ... Same ... */ return ( rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y ); }

        // Draw Player / Enemy (Shared logic for 4-frame animation)
        function drawCharacter(entity, isPlayer) {
            const width = isPlayer ? entity.pedWidth : entity.width;

            const bodyHeight = height * 0.6;
            const legHeight = height * 0.4;

            const legY = -height / 2 + bodyHeight;

            // Torso

            ctx.fillRect(-width / 2, -height / 2, width, bodyHeight);

            ctx.beginPath();
            ctx.arc(0, -height / 2 + headRadius * 0.8, headRadius, 0, Math.PI * 2); // Slightly lower head
            ctx.fill();

            // Legs (Animated)
            ctx.fillStyle = '#555'; // Grey pants for all
            const frame = entity.animFrame;

            // Define leg shapes/positions for each frame (relative to entity center)
            // [leftX, leftY, leftW, leftH, rightX, rightY, rightW, rightH]
             const legPos = [
                 // Frame 0: Idle / Mid-stride 1
                 [-width / 2 + 0.25, legY, legWidth, legHeight * 0.95,   0.25, legY, legWidth, legHeight * 0.95],
                 // Frame 1: Left forward
                 [-width / 2 + 0.25, legY, legWidth, legHeight,           0.25, legY + 1, legWidth, legHeight * 0.7],
                 // Frame 2: Idle / Mid-stride 2
                 [-width / 2 + 0.25, legY, legWidth, legHeight * 0.95,   0.25, legY, legWidth, legHeight * 0.95],
                 // Frame 3: Right forward
                 [-width / 2 + 0.25, legY + 1, legWidth, legHeight * 0.7,   0.25, legY, legWidth, legHeight]
             ];


            if (!entity.isMoving) {
                // Idle Stance (Frame 0 slightly modified)
                ctx.fillRect(-width / 2 + 0.5, legY, width - 1, legHeight);
            } else {
                // Walking Frames
                 const currentLegs = legPos[frame];
                 // Draw Left Leg
                 ctx.fillRect(currentLegs[0], currentLegs[1], currentLegs[2], currentLegs[3]);
                 // Draw Right Leg
                 ctx.fillRect(currentLegs[4], currentLegs[5], currentLegs[6], currentLegs[7]);
            }
        }

        // --- Initialization & Utilities ---
        function initGame() { /* ... Same ... */ console.log("Initializing Game..."); createWorldElements(); initializeWorldObjects(); spawnInitialEnemies(10); updateHUD(); window.addEventListener('resize', handleResize); handleResize(); gameLoop(); console.log("Game Loop Started."); } // Spawn more enemies
        function createWorldElements() { /* ... Same ... */ for (let i = 0; i < 200; i++) { gameState.world.trees.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, radius: 5 + Math.random() * 10, color: `hsl(${100 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${20 + Math.random() * 20}%)` }); } for (let i = 0; i < 45; i++) { gameState.world.buildings.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, width: 40 + Math.random() * 100, height: 40 + Math.random() * 100, color: `hsl(${200 + Math.random() * 40}, ${20 + Math.random() * 20}%, ${40 + Math.random() * 30}%)` }); } for (let i = 0; i < 60; i++) { gameState.world.obstacles.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, width: 10 + Math.random() * 20, height: 10 + Math.random() * 20, color: '#777' }); } for (let i = 0; i < 5; i++) { gameState.world.gasStations.push({ x: 400 + Math.random() * (gameState.world.width - 800), y: 400 + Math.random() * (gameState.world.height - 800), width: 50, height: 60, color: '#c00' }); } }
        function initializeWorldObjects() { /* ... Same ... */ const validTrees = []; gameState.world.trees.forEach(tree => { if (!isOnRoad(tree.x, tree.y, tree.radius * 1.5)) { validTrees.push(tree); } }); gameState.world.trees = validTrees.slice(0, 200); const validBuildings = []; gameState.world.buildings.forEach(b => { if (!isOnRoad(b.x + b.width/2, b.y + b.height/2, Math.max(b.width, b.height) * 0.7)) { validBuildings.push(b); } }); gameState.world.buildings = validBuildings.slice(0, 40); const validObstacles = []; gameState.world.obstacles.forEach(o => { if (!isOnRoad(o.x + o.width/2, o.y + o.height/2, Math.max(o.width, o.height))) { validObstacles.push(o); } }); gameState.world.obstacles = validObstacles.slice(0, 60); console.log(`World Initialized: ${gameState.world.trees.length} Trees, ${gameState.world.buildings.length} Buildings, ${gameState.world.obstacles.length} Obstacles`); }
        function isOnRoad(x, y, buffer) { /* ... Same ... */ for (const road of roads) { const dx = road.x2 - road.x1, dy = road.y2 - road.y1; const lenSq = dx*dx + dy*dy; if (lenSq === 0) continue; let t = ((x - road.x1) * dx + (y - road.y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); const closestX = road.x1 + t * dx; const closestY = road.y1 + t * dy; const distSq = (x - closestX)**2 + (y - closestY)**2; if (distSq < (gameState.world.roadWidth / 2 + buffer)**2) return true; } return false; }
        function spawnInitialEnemies(count) { /* ... Same ... */ let spawned = 0; let attempts = 0; while (spawned < count && attempts < count * 10) { attempts++; const x = Math.random() * gameState.world.width; const y = Math.random() * gameState.world.height; const dx = x - gameState.player.x; const dy = y - gameState.player.y; if (dx*dx + dy*dy < 500*500) continue; if (isOnRoad(x, y, 20)) continue; let inObject = false; const worldGeometry = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones]; for (const obj of worldGeometry) { if (x > obj.x && x < obj.x + obj.width && y > obj.y && y < obj.y + obj.height) { inObject = true; break; } } if (inObject) continue; spawnEnemy(x, y); spawned++; } console.log(`Spawned ${spawned} enemies.`); }
        function handleResize() { /* ... Same ... */ const gameContainer = document.getElementById('game-container'); const windowWidth = window.innerWidth; const windowHeight = window.innerHeight; const aspectRatio = canvas.width / canvas.height; let newWidth = windowWidth * 0.98; let newHeight = newWidth / aspectRatio; if (newHeight > windowHeight * 0.98) { newHeight = windowHeight * 0.98; newWidth = newHeight * aspectRatio; } gameContainer.style.width = `${newWidth}px`; gameContainer.style.height = `${newHeight}px`; }

        // --- Start Game ---
        window.onload = initGame;

    </script>
