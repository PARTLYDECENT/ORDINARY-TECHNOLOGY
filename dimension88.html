            miniMapCtx.beginPath();
            miniMapCtx.moveTo(playerMapX, playerMapZ);
            miniMapCtx.lineTo(playerMapX + Math.sin(gameState.player.angle) * dirLen,
                              playerMapZ + Math.cos(gameState.player.angle) * dirLen);
            miniMapCtx.stroke();

            // Simplified frustum
             miniMapCtx.strokeStyle = 'rgba(200, 200, 255, 0.4)';
             const miniCamWidth = gameCanvasWidth/gameState.world.width * miniMapCtx.canvas.width /12;
             const miniCamHeight = gameCanvasHeight/gameState.world.height * miniMapCtx.canvas.height /12;
             miniMapCtx.strokeRect(playerMapX - miniCamWidth/2, playerMapZ - miniCamHeight/2, miniCamWidth, miniCamHeight);
        }
        function drawGameOver() {
            const gameContainer = document.getElementById('game-container');
            let gameOverDiv = document.getElementById('game-over-screen');
            if (!gameOverDiv) {
                gameOverDiv = document.createElement('div');
                gameOverDiv.id = 'game-over-screen';
                gameOverDiv.style.position = 'absolute';
                gameOverDiv.style.top = '0'; gameOverDiv.style.left = '0';
                gameOverDiv.style.width = '100%'; gameOverDiv.style.height = '100%';
                gameOverDiv.style.backgroundColor = 'rgba(10,0,20,0.8)'; // Darker purple
                gameOverDiv.style.color = '#FF3333'; // Bright Red
                gameOverDiv.style.display = 'flex'; gameOverDiv.style.flexDirection = 'column';
                gameOverDiv.style.justifyContent = 'center'; gameOverDiv.style.alignItems = 'center';
                gameOverDiv.style.fontFamily = "'Courier New', monospace";
                gameOverDiv.style.zIndex = '100';
                gameOverDiv.innerHTML = `
                    <div style="font-size: 40px; text-shadow: 0 0 10px #FF0000;">CONNECTION SEVERED</div>
                    <div style="font-size: 20px; color: #CCAAFF; margin-top: 20px;">Re-initialize sequence (Refresh)</div>
                    <div style="font-size: 16px; color: #CCAAFF; margin-top: 10px;">Anomalies Neutralized: ${gameState.player.killedEnemiesCount}</div>
                `;
                gameContainer.appendChild(gameOverDiv);
            }
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(gameState.world.grassColor);
            scene.fog = new THREE.Fog(gameState.world.grassColor, 30, 120); // Denser fog

            camera = new THREE.PerspectiveCamera(70, gameCanvasWidth / gameCanvasHeight, 0.1, 1000); // Slightly narrower FOV
            camera.position.set(gameState.player.x, 25, gameState.player.z + 35);
            camera.lookAt(gameState.player.x, 0, gameState.player.z);
            camera.userData = {}; // For storing camera specific lerp targets

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(gameCanvasWidth, gameCanvasHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);
            renderer.domElement.id = "gameCanvas3D";

            clock = new THREE.Clock();

            const ambientLight = new THREE.AmbientLight(0x7755AA, 0.7); // Purplish ambient
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xAACCFF, 0.9); // Cool directional
            directionalLight.position.set(40, 60, 30);
            scene.add(directionalLight);
            // Optional: Point light for more localized highlights, e.g. a dim "moon"
            const pointLight = new THREE.PointLight(0x553377, 0.5, 200);
            pointLight.position.set(-50, 80, -50);
            scene.add(pointLight);


            const groundGeometry = new THREE.PlaneGeometry(gameState.world.width, gameState.world.height);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: gameState.world.grassColor });
            groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = 0;
            scene.add(groundPlane);
        }

        function initGame() {
            console.log("Initializing Xenoscape Drifter...");
            initThreeJS();

            if (gameState.playerState === 'driving') {
                gameState.player.mesh = createVehicleMesh(gameState.player.currentVehicleType, gameState.player.color);
                gameState.player.mesh.position.set(gameState.player.x, VEHICLE_TYPES[gameState.player.currentVehicleType].height / 2, gameState.player.z);
            } else {
                gameState.player.mesh = createCharacterMesh(true);
                gameState.player.mesh.position.set(gameState.player.x, PLAYER_PED_HEIGHT / 2, gameState.player.z);
            }
            gameState.player.mesh.rotation.y = gameState.player.angle;
            scene.add(gameState.player.mesh);
            gameState.player.boundingBox.setFromObject(gameState.player.mesh);

            // This will get the Shard Disruptor by default for testing
            gameState.player.hasMachineGun = true;


            createWorldElements3D();
            initializeWorldObjects3D();

            spawnInitialEnemies(35); // More anomalies
            spawnVehicles(12);    // More drifters

            updateHUD();
            window.addEventListener('resize', handleResize);
            handleResize();
            if (gameState.playerState === 'driving') startEngineNoise();
            gameLoop();
            console.log("Xenoscape simulation active.");
        }

        function createWorldElements3D() {
            // Roads (Alien Pathways)
            roads.forEach(roadData => {
                const dx = roadData.x2 - roadData.x1;
                const dz = roadData.z2 - roadData.z1;
                const length = Math.sqrt(dx * dx + dz * dz);
                if (length === 0) return;

                const roadGeo = new THREE.PlaneGeometry(gameState.world.roadWidth, length);
                const roadMat = new THREE.MeshLambertMaterial({ map: roadTexture, color: gameState.world.roadColor });
                roadMat.map.repeat.set(1, Math.max(1, Math.floor(length / (gameState.world.roadWidth*2)))); // Texture repeat based on length vs width ratio

                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.rotation.x = -Math.PI / 2;
                roadMesh.position.set(roadData.x1 + dx / 2, 0.015, roadData.z1 + dz / 2); // Slightly more elevated
                roadMesh.rotation.z = -Math.atan2(dz, dx) + Math.PI/2;
                scene.add(roadMesh);
            });

            // Alien Structures (Buildings)
            for (let i = 0; i < 25; i++) { // More structures
                const type = Math.floor(Math.random() * 3);
                let structureMesh;
                let height, baseWidth, baseDepth;

                switch(type) {
                    case 0: // Spire
                        baseWidth = 2 + Math.random() * 4;
                        height = 10 + Math.random() * 15;
                        structureMesh = new THREE.Mesh(
                            new THREE.ConeGeometry(baseWidth, height, 5 + Math.floor(Math.random()*4)),
                            new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(0.6 + Math.random()*0.1, 0.3, Math.random()*0.2+0.15), shininess: 10 }) // Blues/Purples
                        );
                        baseDepth = baseWidth;
                        break;
                    case 1: // Crystalline Cluster
                        baseWidth = 4 + Math.random() * 6;
                        baseDepth = baseWidth;
                        height = 6 + Math.random() * 8;
                        structureMesh = new THREE.Group();
                        for(let j=0; j<3+Math.random()*4; j++){
                            const shardHeight = height * (0.5 + Math.random()*0.5);
                            const shard = new THREE.Mesh(
                                new THREE.CylinderGeometry(0.1 + Math.random()*0.3, 0.3+Math.random()*0.5, shardHeight, 3+Math.floor(Math.random()*3)),
                                new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(0.7 + Math.random()*0.2, 0.5, Math.random()*0.3+0.4), shininess:60, transparent:true, opacity:0.7+Math.random()*0.2 }) // Lighter crystals
                            );
                            shard.position.set((Math.random()-0.5)*baseWidth*0.6, shardHeight/2 - height/3, (Math.random()-0.5)*baseDepth*0.6);
                            shard.rotation.set((Math.random()-0.5)*0.5, Math.random()*Math.PI*2, (Math.random()-0.5)*0.5);
                            structureMesh.add(shard);
                        }
                        break;
                    case 2: // Organic Mound/Pod
                        baseWidth = 5 + Math.random() * 10;
                        baseDepth = baseWidth * (0.7 + Math.random()*0.6);
                        height = 4 + Math.random() * 6;
                        structureMesh = new THREE.Mesh(
                            new THREE.SphereGeometry(baseWidth/2, 10, 7), // Low poly sphere
                            new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(0.1 + Math.random()*0.1, 0.2, Math.random()*0.15+0.1) }) // Browns/Greens
                        );
                        structureMesh.scale.y = height / baseWidth; // Squish/stretch sphere
                        break;
                }
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                structureMesh.position.set(x, height / 2, z);
                const buildingLogic = {x, z, width:baseWidth, depth:baseDepth, height, mesh: structureMesh, boundingBox: new THREE.Box3().setFromObject(structureMesh)};

                if(!isOnRoad3D(buildingLogic.boundingBox,2.0)) {
                    scene.add(structureMesh);
                    gameState.world.buildings.push(buildingLogic);
                }
            }

            // Alien Flora (Trees)
            for (let i = 0; i < 120; i++) { // More flora
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                const group = new THREE.Group();

                const trunkHeight = 1.5 + Math.random() * 4;
                const trunkRadius = 0.15 + Math.random() * 0.25;
                const trunkGeo = new THREE.CylinderGeometry(trunkRadius*0.6, trunkRadius, trunkHeight, 5); // Angled trunk
                const trunkMat = new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(0.8, 0.2, 0.1 + Math.random()*0.1) }); // Dark purplish/brown
                const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
                trunkMesh.position.y = trunkHeight / 2;
                group.add(trunkMesh);

                const numOrbs = 2 + Math.floor(Math.random()*4);
                for(let j=0; j<numOrbs; j++){
                    const orbRadius = trunkRadius * (2 + Math.random() * 3);
                    const orbGeo = new THREE.IcosahedronGeometry(orbRadius, 0); // Crystalline orbs
                    const orbMat = new THREE.MeshPhongMaterial({
                        color: Math.random() > 0.5 ? 0x33FF99 : 0xFF33CC, // Glowing green or pink
                        emissive: Math.random() > 0.5 ? 0x11AA66 : 0xAA1188,
                        shininess: 70, transparent: true, opacity: 0.6 + Math.random()*0.3
                    });
                    const orbMesh = new THREE.Mesh(orbGeo, orbMat);
                    orbMesh.position.y = trunkHeight + (Math.random()-0.5)*orbRadius*0.5;
                    orbMesh.position.x = (Math.random()-0.5)*orbRadius*0.8;
                    orbMesh.position.z = (Math.random()-0.5)*orbRadius*0.8;
                    group.add(orbMesh);
                }

                group.position.set(x, 0, z);
                const treeLogic = {x, z, trunkRadius, trunkHeight, mesh: group, boundingBox: new THREE.Box3().setFromObject(group)};
                 if(!isOnRoad3D(treeLogic.boundingBox, 1.0)) {
                    scene.add(group);
                    gameState.world.trees.push(treeLogic);
                 }
            }

            // Alien Obstacles (Crystals/Formations)
            for (let i = 0; i < 150; i++) { // More obstacles
                const size = 0.6 + Math.random() * 1.8;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;

                const geo = Math.random() > 0.5 ? new THREE.DodecahedronGeometry(size, 0) : new THREE.IcosahedronGeometry(size,0);
                const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(0.65, 0.1, 0.2 + Math.random()*0.15), shininess: 5 }); // Dark slate blue/purple
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, size / 2 - (Math.random()*size*0.2), z); // Some slightly buried
                mesh.rotation.set(Math.random() * Math.PI,Math.random() * Math.PI,Math.random() * Math.PI);
                const obsLogic = {x,z,width:size,depth:size,height:size, mesh, boundingBox: new THREE.Box3().setFromObject(mesh)};
                if(!isOnRoad3D(obsLogic.boundingBox, 0.5)) {
                    scene.add(mesh);
                    gameState.world.obstacles.push(obsLogic);
                }
            }

            // Energy Pylons (Gas Stations)
            for (let i = 0; i < 6; i++) {
                const pylonHeight = 4 + Math.random()*3;
                const pylonRadius = 0.3 + Math.random()*0.2;
                const x = 40 + Math.random() * (gameState.world.width - 80);
                const z = 40 + Math.random() * (gameState.world.height - 80);

                const group = new THREE.Group();
                const pylonGeo = new THREE.CylinderGeometry(pylonRadius*0.8, pylonRadius, pylonHeight, 7);
                const pylonMat = new THREE.MeshPhongMaterial({color: 0x666688, shininess:30}); // Metallic blue-grey
                const pylonMesh = new THREE.Mesh(pylonGeo, pylonMat);
                pylonMesh.position.y = pylonHeight/2;
                group.add(pylonMesh);

                const energyOrbGeo = new THREE.SphereGeometry(pylonRadius*2.5, 8,6);
                const energyOrbMat = new THREE.MeshPhongMaterial({
                    color:0xFFCC00, emissive:0xEEAA00, transparent:true, opacity:0.8, shininess:80
                });
                const energyOrbMesh = new THREE.Mesh(energyOrbGeo, energyOrbMat);
                energyOrbMesh.position.y = pylonHeight + pylonRadius*1.5;
                group.add(energyOrbMesh);

                group.position.set(x,0,z); // Group is positioned at base
                const stationLogic = {x, z, width: pylonRadius*3, depth: pylonRadius*3, height: pylonHeight + pylonRadius*3, mesh:group, boundingBox: new THREE.Box3().setFromObject(group)};
                scene.add(group);
                gameState.world.gasStations.push(stationLogic);
            }

            gameState.world.impassableZones.forEach(zoneData => {
                 const geo = new THREE.BoxGeometry(zoneData.width, zoneData.height, zoneData.depth);
                 const mat = new THREE.MeshLambertMaterial({ color: zoneData.color, transparent: true, opacity: 0.3 }); // More subtle
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.position.set(zoneData.x + zoneData.width/2, zoneData.height/2, zoneData.z + zoneData.depth/2);
                 scene.add(mesh);
                 zoneData.mesh = mesh;
                 zoneData.boundingBox = new THREE.Box3().setFromObject(mesh);
            });
        }
        function isOnRoad3D(objectBoundingBox, buffer = 1.0) {
             for (const roadData of roads) {
                 const dx = roadData.x2 - roadData.x1;
                 const dz = roadData.z2 - roadData.z1;
                 const length = Math.sqrt(dx*dx + dz*dz);
                 if (length === 0) continue;

                 const roadCenterX = roadData.x1 + dx / 2;
                 const roadCenterZ = roadData.z1 + dz / 2;

                 // Create an AABB for the road segment (conservative check)
                 const roadBuffer = gameState.world.roadWidth / 2 + buffer;
                 const minX = Math.min(roadData.x1, roadData.x2) - roadBuffer;
                 const maxX = Math.max(roadData.x1, roadData.x2) + roadBuffer;
                 const minZ = Math.min(roadData.z1, roadData.z2) - roadBuffer;
                 const maxZ = Math.max(roadData.z1, roadData.z2) + roadBuffer;
                 const roadBox = new THREE.Box3(new THREE.Vector3(minX, -1, minZ), new THREE.Vector3(maxX, 1, maxZ));

                 if (objectBoundingBox.intersectsBox(roadBox)) {
                    // More precise check for point inside rotated rectangle would be better, but this is usually ok for spawning
                    // For simplicity, if AABBs intersect, assume it might be on the road.
                     return true;
                 }
             }
             return false;
        }

        function initializeWorldObjects3D() {
            console.log(`Xenoscape Populated: ${gameState.world.trees.length} Flora, ${gameState.world.buildings.length} Structures, ${gameState.world.obstacles.length} Formations`);
        }

        function spawnInitialEnemies(count) { // Spawn Anomalies
            let spawned = 0; let attempts = 0;
            while (spawned < count && attempts < count * 10) {
                attempts++;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                const dx = x - gameState.player.x;
                const dz = z - gameState.player.z;
                if (dx*dx + dz*dz < 60*60) continue; // Spawn further from player

                const enemyTestBB = new THREE.Box3(
                    new THREE.Vector3(x - ENEMY_WIDTH, 0, z - ENEMY_WIDTH), // Wider test box for amorphous anomalies
                    new THREE.Vector3(x + ENEMY_WIDTH, ENEMY_HEIGHT, z + ENEMY_WIDTH)
                );

                if (isOnRoad3D(enemyTestBB, ENEMY_WIDTH*1.5)) continue; // Keep anomalies off roads

                let inObject = false;
                const staticObjects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                for (const obj of staticObjects) {
                    if (enemyTestBB.intersectsBox(obj.boundingBox)) {
                        inObject = true; break;
                    }
                }
                if (inObject) continue;

                spawnEnemy(x, z);
                spawned++;
            }
            console.log(`Spawned ${spawned} anomalies.`);
        }

        function spawnVehicles(count) { // Spawn Drifters
            let spawned = 0; let attempts = 0;
            const vehicleTypes = Object.keys(VEHICLE_TYPES);
            while (spawned < count && attempts < count * 20) {
                attempts++;
                const x = Math.random() * gameState.world.width;
                const z = Math.random() * gameState.world.height;
                const dx = x - gameState.player.x;
                const dz = z - gameState.player.z;
                if (dx * dx + dz * dz < 40 * 40) continue;

                const randomVehicleType = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
                const vehicleProps = VEHICLE_TYPES[randomVehicleType];

                const vehicleMesh = createVehicleMesh(randomVehicleType, vehicleProps.color);
                vehicleMesh.position.set(x, vehicleProps.height / 2, z);
                vehicleMesh.rotation.y = Math.random() * Math.PI * 2;
                const vehicleBB = new THREE.Box3().setFromObject(vehicleMesh);

                let inObject = false;
                const staticObjects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                for (const obj of staticObjects) {
                    if (vehicleBB.intersectsBox(obj.boundingBox)) { inObject = true; break; }
                }
                if (!isOnRoad3D(vehicleBB, vehicleProps.width * 0.8) && inObject) { // Prefer roads, but allow off-road if not in object
                    continue;
                }

                const vehicleLogic = {
                    x: x, z: z,
                    width: vehicleProps.width, height: vehicleProps.height, depth: vehicleProps.depth,
                    angle: vehicleMesh.rotation.y, color: vehicleProps.color,
                    maxSpeed: vehicleProps.maxSpeed, acceleration: vehicleProps.acceleration,
                    deceleration: vehicleProps.deceleration, handling: vehicleProps.handling,
                    fuelConsumption: vehicleProps.fuelConsumption, fuelLevel: 70 + Math.random()*30, // Varied fuel
                    type: randomVehicleType,
                    mesh: vehicleMesh,
                    boundingBox: vehicleBB
                };

                gameState.world.vehicles.push(vehicleLogic);
                threeObjects.vehicles.push(vehicleMesh);
                scene.add(vehicleMesh);
                spawned++;
            }
            console.log(`Spawned ${spawned} derelict drifters.`);
        }

        function handleResize() {
            const gameContainer = document.getElementById('game-container');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const aspectRatio = gameCanvasWidth / gameCanvasHeight;

            let newWidth = windowWidth * 0.98;
            let newHeight = newWidth / aspectRatio;
            if (newHeight > windowHeight * 0.98) {
                newHeight = windowHeight * 0.98;
                newWidth = newHeight * aspectRatio;
            }
            gameContainer.style.width = `${newWidth}px`;
            gameContainer.style.height = `${newHeight}px`;

            if(renderer && camera){
                renderer.setSize(newWidth, newHeight);
                camera.aspect = newWidth / newHeight;
                camera.updateProjectionMatrix();
            }
        }

        window.onload = initGame;
    </script>
</body>
