<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Video Player v3 - Filter Madness</title>
    <style>
        :root {
            --primary-glow: #00ffff;
            --secondary-glow: #ff00ff;
            --background-start: #0d0d2b;
            --background-end: #050018;
            --border-color: #00ffff;
            --text-color: #00ffff;
            --button-active-bg: rgba(255, 0, 255, 0.3);
            --button-active-border: #ff00ff;
        }
        body {
            margin: 0;
            background: radial-gradient(circle, var(--background-start), var(--background-end));
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif; /* Assuming Orbitron font is linked elsewhere or system available */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; /* Prevent matrix overflow issues */
        }
        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        button {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            padding: 0.5rem 1rem;
            font-size: 0.9rem; /* Slightly smaller */
            font-family: inherit; /* Use body font */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px var(--primary-glow);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.95) translateY(0);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem); /* Responsive font size */
            text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--secondary-glow);
            text-align: center;
            flex-grow: 1; /* Allow title to take space */
        }
        main {
            width: 95%; /* Slightly wider */
            max-width: 1000px;
            margin-bottom: 20px;
        }
        .video-wrapper { /* Added wrapper for visualizer */
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }
        .video-container {
            width: 100%;
            background: #000;
            border: 4px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }
        .video-container video {
            width: 100%;
            display: block;
            transition: filter 0.5s ease; /* For filter effect */
        }
        /* --- Added Filter Classes --- */
        .video-container video.filter-none { filter: none; }
        .video-container video.filter-grayscale { filter: grayscale(1); }
        .video-container video.filter-sepia { filter: sepia(1); }
        .video-container video.filter-invert { filter: invert(1); }
        .video-container video.filter-hue-rotate-90 { filter: hue-rotate(90deg); }
        .video-container video.filter-hue-rotate-180 { filter: hue-rotate(180deg); }
        .video-container video.filter-contrast-saturate { filter: contrast(1.5) saturate(2); }
        .video-container video.filter-blur-bright { filter: blur(2px) brightness(1.3); }
        .video-container video.filter-vintage { filter: sepia(0.8) contrast(1.1) brightness(0.9); }
        .video-container video.filter-xray { filter: invert(1) contrast(1.5) brightness(0.8); }
        .video-container video.filter-saturated-bright { filter: saturate(3) brightness(1.1); }
        /* --- End Filter Classes --- */

        #audioVisualizer { /* Visualizer styles */
            position: absolute;
            bottom: 4px; /* Position above bottom border */
            left: 4px;
            width: calc(100% - 8px);
            height: 50px; /* Adjust height */
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }
        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 8px 12px; /* Adjusted padding */
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .video-title {
            font-size: 1.1rem;
            color: var(--secondary-glow);
            text-shadow: 0 0 5px var(--primary-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .video-counter {
            font-size: 1rem;
            color: var(--secondary-glow);
            white-space: nowrap;
        }
        .control-panel {
            margin-top: 15px; /* Increased margin */
            display: flex;
            flex-direction: column; /* Stack panels */
            align-items: center;
            gap: 15px; /* Space between panels */
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        .video-navigation, .speed-panel, .feature-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px; /* Consistent gap */
            width: 100%;
        }
        .active-button {
            background: var(--button-active-bg);
            border-color: var(--button-active-border);
            box-shadow: 0 0 10px var(--button-active-border);
        }
        .tooltip { /* Simple tooltip for keyboard shortcuts */
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #555;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .current-filter-display { /* Style for filter name */
             margin-left: 10px;
             font-size: 0.8rem;
             color: var(--secondary-glow);
             text-transform: uppercase;
             letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>
    <header>
        <button class="back-button" onclick="goBack()">BACK</button>
        <h1>ALIEN PLAYER</h1> </header>
    <main>
        <div class="video-wrapper">
            <div class="video-container">
                <video id="cyclicVideo" autoplay loop controls crossorigin="anonymous"></video> </div>
            <canvas id="audioVisualizer"></canvas> </div>
        <div class="video-info">
            <div class="video-title" id="videoTitle">Video 1</div>
            <div class="video-counter">
                <span id="videoCounter">1</span> / <span id="videoTotal">20</span>
            </div>
        </div>
        <div class="control-panel">
            <div class="video-navigation">
                <button id="prevVideo">Prev</button>
                <button id="nextVideo">Next</button>
                <button id="downloadBtn">Download</button>
            </div>
            <div class="speed-panel">
                 Speed: <button data-speed="0.5">0.5x</button>
                <button data-speed="0.75">0.75x</button>
                <button data-speed="1.0" class="active-button">1.0x</button> <button data-speed="1.5">1.5x</button>
                <button data-speed="2.0">2.0x</button>
            </div>
            <div class="feature-panel">
                 Features: <button id="shuffleBtn">Shuffle</button>
                <button id="repeatBtn">Repeat: Off</button>
                <button id="filterBtn">Next Filter</button> <span id="currentFilterDisplay" class="current-filter-display">FILTER: NONE</span> </div>
        </div>
    </main>
    <div id="keyboardTooltip" class="tooltip">Space: Play/Pause | ←/→: Prev/Next | S: Shuffle | R: Repeat | F: Filter</div>

    <script>
        // --- Matrix Background ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        const matrixFontSize = 16;
        const matrixColumns = matrixCanvas.width / matrixFontSize;
        const matrixDrops = Array(Math.floor(matrixColumns)).fill(1);

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#00ff00'; // Green matrix color
            matrixCtx.font = matrixFontSize + 'px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = String.fromCharCode(Math.random() * 128);
                matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 50); // Adjusted speed slightly

        // --- Video Player Setup ---
        const videoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`); // Ensure you have 20 videos or adjust length
        let originalVideoOrder = [...videoSources]; // Keep original order for unshuffle
        let currentVideoIndex = 0;
        let isShuffled = false;
        let repeatMode = false; // false = off, true = repeat current video

        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const videoTotal = document.getElementById("videoTotal");
        const speedButtons = document.querySelectorAll('.speed-panel button');
        const downloadBtn = document.getElementById("downloadBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const filterBtn = document.getElementById("filterBtn");
        const keyboardTooltip = document.getElementById("keyboardTooltip");
        const currentFilterDisplay = document.getElementById("currentFilterDisplay"); // Get filter display element

        // --- Filter Setup ---
        const filters = [ // Array matching CSS class suffixes
            { name: 'NONE', class: 'filter-none' },
            { name: 'GRAYSCALE', class: 'filter-grayscale' },
            { name: 'SEPIA', class: 'filter-sepia' },
            { name: 'INVERT', class: 'filter-invert' },
            { name: 'ALIEN', class: 'filter-hue-rotate-90' }, // Renamed for clarity
            { name: 'PSYCHEDELIC', class: 'filter-hue-rotate-180' },
            { name: 'VIBRANT', class: 'filter-contrast-saturate' },
            { name: 'BLURRY', class: 'filter-blur-bright' },
            { name: 'VINTAGE', class: 'filter-vintage' },
            { name: 'X-RAY', class: 'filter-xray' },
            { name: 'OVERDRIVE', class: 'filter-saturated-bright' }
        ];
        let currentFilterIndex = 0; // Start with no filter

        // --- Audio Visualizer Setup ---
        const visualizerCanvas = document.getElementById('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext;
        let analyser;
        let sourceNode;
        let visualizerAnimationId;
        const numBars = 64; // Number of visualizer bars

        function setupAudioVisualizer() {
            if (audioContext) return; // Already initialized

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = Math.pow(2, 7); // 128 for numBars=64
                sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizerCanvas.height = 50; // Set canvas size
                visualizerCanvas.width = visualizerCanvas.offsetWidth; // Match container width
                drawVisualizer(); // Start drawing
            } catch (e) {
                console.error("Web Audio API setup failed:", e);
                visualizerCanvas.style.display = 'none';
            }
        }

        function drawVisualizer() {
            if (!analyser) return; // Stop if analyser not ready

            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const barWidth = visualizerCanvas.width / numBars;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height;
                const hue = (i / numBars) * 360; // Cycle hue across bars
                visualizerCtx.fillStyle = `hsla(${hue}, 100%, 50%, 0.8)`; // Use HSL for easy color cycling
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        function stopVisualizer() {
             if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
             }
        }

        // --- UI Update Function ---
        function updateUI(playVideo = true) {
            if (currentVideoIndex < 0 || currentVideoIndex >= videoSources.length) {
                 console.error("Invalid video index:", currentVideoIndex);
                 currentVideoIndex = 0;
            }
            const videoPath = videoSources[currentVideoIndex];
            videoTitle.textContent = `Video ${currentVideoIndex + 1}`;
            videoCounter.textContent = currentVideoIndex + 1;
            videoTotal.textContent = videoSources.length;

             if (cyclicVideo.currentSrc.split('/').pop() !== videoPath.split('/').pop()) {
                 cyclicVideo.src = videoPath;
                 cyclicVideo.load();
             }

            if (playVideo) {
                 cyclicVideo.play().catch(e => console.warn("Autoplay possibly prevented:", e));
                 if (!audioContext && cyclicVideo.readyState >= 2) {
                     setupAudioVisualizer();
                 } else if (analyser && audioContext.state === 'suspended') {
                      audioContext.resume();
                 }
            }
             speedButtons.forEach(btn => {
                btn.classList.toggle('active-button', parseFloat(btn.dataset.speed) === cyclicVideo.playbackRate);
            });
            shuffleBtn.classList.toggle('active-button', isShuffled);
             repeatBtn.textContent = `Repeat: ${repeatMode ? 'On' : 'Off'}`;
             repeatBtn.classList.toggle('active-button', repeatMode);
             cyclicVideo.loop = repeatMode;

             // Update filter display
             applyFilterClass(); // Ensure correct class is applied
             currentFilterDisplay.textContent = `FILTER: ${filters[currentFilterIndex].name}`;

        }

        // --- Apply Filter Function ---
        function applyFilterClass() {
            // Remove all possible filter classes first
            filters.forEach(filter => cyclicVideo.classList.remove(filter.class));
            // Add the current one
            cyclicVideo.classList.add(filters[currentFilterIndex].class);
             filterBtn.classList.toggle('active-button', currentFilterIndex !== 0); // Active if not 'NONE'
        }

        // --- Cycle Filter Function ---
        function cycleFilter() {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            updateUI(false); // Update display without restarting video
        }

        // --- Event Listeners ---
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                cyclicVideo.playbackRate = parseFloat(this.dataset.speed);
                updateUI(false);
            });
        });

        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI();
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI();
        });

        downloadBtn.addEventListener("click", function() {
            const a = document.createElement('a');
            a.href = videoSources[currentVideoIndex];
            const filename = videoSources[currentVideoIndex].split('/').pop() || `video-${currentVideoIndex + 1}.mp4`;
            a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

         shuffleBtn.addEventListener("click", function() {
            isShuffled = !isShuffled;
            if (isShuffled) {
                const currentVideo = videoSources.splice(currentVideoIndex, 1)[0];
                for (let i = videoSources.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [videoSources[i], videoSources[j]] = [videoSources[j], videoSources[i]];
                }
                videoSources.unshift(currentVideo);
                currentVideoIndex = 0;
            } else {
                 const currentVideoPath = videoSources[currentVideoIndex];
                 videoSources = [...originalVideoOrder];
                 currentVideoIndex = videoSources.findIndex(src => src === currentVideoPath);
                 if (currentVideoIndex === -1) currentVideoIndex = 0;
            }
            updateUI(false);
        });

         repeatBtn.addEventListener("click", function() {
             repeatMode = !repeatMode;
             updateUI(false);
         });

        filterBtn.addEventListener("click", cycleFilter); // Use cycle function

         cyclicVideo.addEventListener('ended', () => {
            if (!repeatMode) {
                 currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
                 updateUI();
            }
         });

         cyclicVideo.addEventListener('play', () => {
             if (!audioContext) { setupAudioVisualizer(); }
             else if (audioContext.state === 'suspended') { audioContext.resume(); }
             if (visualizerAnimationId === null && analyser) { drawVisualizer(); }
         });
         cyclicVideo.addEventListener('pause', stopVisualizer);


        function goBack() { window.history.back(); }

        document.addEventListener('keydown', (e) => {
             if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
             let handled = true; // Assume handled to prevent default if matched
             switch (e.code) {
                case 'Space': cyclicVideo.paused ? cyclicVideo.play() : cyclicVideo.pause(); break;
                case 'ArrowRight': document.getElementById("nextVideo").click(); break;
                case 'ArrowLeft': document.getElementById("prevVideo").click(); break;
                 case 'KeyS': shuffleBtn.click(); break;
                 case 'KeyR': repeatBtn.click(); break;
                 case 'KeyF': cycleFilter(); break; // Use cycle function
                 default: handled = false; // Not handled
            }
             if (handled) e.preventDefault(); // Prevent default actions like page scroll
        });

        let tooltipTimeout;
        function showTooltip() {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.style.opacity = '1';
            tooltipTimeout = setTimeout(() => { keyboardTooltip.style.opacity = '0'; }, 3000);
        }
         document.addEventListener('keydown', showTooltip);
         showTooltip(); // Show on load

        window.addEventListener('resize', function() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const newColumns = matrixCanvas.width / matrixFontSize;
            matrixDrops.length = Math.floor(newColumns);
            for (let i = 0; i < matrixDrops.length; i++) if (matrixDrops[i] === undefined) matrixDrops[i] = 1;

             if (visualizerCanvas.style.display !== 'none' && audioContext) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
             }
        });

        // --- Initial Load ---
        updateUI(); // Load first video and set initial states

    </script>
</body>
</html>
