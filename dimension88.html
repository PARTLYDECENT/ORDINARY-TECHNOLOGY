<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	 <meta property="og:image" content="https://partlydecent.github.io/ORDINARY-TECHNOLOGY/banner2.jpg">
  <meta property="og:image:alt" content="DRIVING GAME VERSION 3">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:url" content="https://partlydecent.github.io/ORDINARY-TECHNOLOGY/">
  <meta property="og:type" content="website">

    <title>Pixel Cruiser: Open World Driving</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', monospace;
        }
        
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        #game-canvas {
            border: 2px solid #444;
            background-color: #000;
            image-rendering: pixelated;
        }
        
        #hud {
            position: absolute;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            text-align: left;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid #444;
        }
        
        #fuel-bar {
            width: 100px;
            height: 10px;
            background-color: #333;
            margin: 5px 0;
        }
        
        #fuel-level {
            height: 100%;
            background-color: #3f3;
            width: 100%;
            transition: width 0.5s;
        }
        
        #mini-map {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 120px;
            height: 120px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            border-radius: 5px;
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px; 
            font-size: 12px;
            text-align: center;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="hud">
            <div>SPEED: <span id="speed">0</span> MPH</div>
            <div>FUEL:</div>
            <div id="fuel-bar"><div id="fuel-level"></div></div>
            <div id="location">LOCATION: DOWNTOWN</div>
        </div>
        <div id="mini-map"></div>
        <div id="controls">
            WASD or ARROWS to drive | SPACE to handbrake | F to refuel at gas stations
        </div>
    </div>

    <script>
        // Game canvas setup
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const miniMap = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMap.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120;
        miniMapCtx.canvas.height = 120;
        
        // Game state
        const gameState = {
            player: {
                x: 1500,
                y: 1500,
                width: 20,
                height: 36,
                speed: 0,
                maxSpeed: 5,
                acceleration: 0.1,
                deceleration: 0.05,
                handling: 3.5,
                angle: 0,
                fuelLevel: 100,
                fuelConsumption: 0.02
            },
            camera: {
                x: 0,
                y: 0,
                width: canvas.width,
                height: canvas.height
            },
            controls: {
                up: false,
                down: false,
                left: false,
                right: false,
                handbrake: false,
                refuel: false
            },
            world: {
                width: 3000,
                height: 3000,
                roadWidth: 60,
                grassColor: '#1a3d0c',
                roadColor: '#333',
                lineColor: '#fff',
                lineWidth: 2,
                trees: [],
                buildings: [],
                obstacles: [],
                gasStations: [],
                startTime: Date.now()
            },
            fx: {
                skidMarks: [],
                dustParticles: []
            },
            zones: [
                {name: "DOWNTOWN", x: 1000, y: 1000, radius: 600},
                {name: "FOREST HILLS", x: 600, y: 2200, radius: 500},
                {name: "EASTERN PLAINS", x: 2200, y: 1800, radius: 400},
                {name: "INDUSTRIAL PARK", x: 2000, y: 500, radius: 350}
            ]
        };
        
        // Create trees (smaller dots on the map)
        for (let i = 0; i < 200; i++) {
            gameState.world.trees.push({
                x: Math.random() * gameState.world.width,
                y: Math.random() * gameState.world.height,
                radius: 5 + Math.random() * 10,
                color: `hsl(${100 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${20 + Math.random() * 20}%)`
            });
        }
        
        // Create buildings
        for (let i = 0; i < 40; i++) {
            gameState.world.buildings.push({
                x: Math.random() * gameState.world.width,
                y: Math.random() * gameState.world.height,
                width: 30 + Math.random() * 70,
                height: 30 + Math.random() * 70,
                color: `hsl(${200 + Math.random() * 40}, ${20 + Math.random() * 20}%, ${40 + Math.random() * 30}%)`
            });
        }
        
        // Create obstacles
        for (let i = 0; i < 60; i++) {
            gameState.world.obstacles.push({
                x: Math.random() * gameState.world.width,
                y: Math.random() * gameState.world.height,
                width: 10 + Math.random() * 20,
                height: 10 + Math.random() * 20,
                color: '#777'
            });
        }
        
        // Create gas stations
        for (let i = 0; i < 5; i++) {
            gameState.world.gasStations.push({
                x: 400 + Math.random() * (gameState.world.width - 800),
                y: 400 + Math.random() * (gameState.world.height - 800),
                width: 50,
                height: 60,
                color: '#c00'
            });
        }
        
        // Game roads
        const roads = [
            // Main horizontal roads
            {x1: 0, y1: 1000, x2: gameState.world.width, y2: 1000},
            {x1: 0, y1: 2000, x2: gameState.world.width, y2: 2000},
            
            // Main vertical roads
            {x1: 1000, y1: 0, x2: 1000, y2: gameState.world.height},
            {x1: 2000, y1: 0, x2: 2000, y2: gameState.world.height},
            
            // Diagonal roads
            {x1: 500, y1: 500, x2: 1500, y2: 1500},
            {x1: 2500, y1: 500, x2: 1500, y2: 1500},
            {x1: 500, y1: 2500, x2: 1500, y2: 1500},
            {x1: 2500, y1: 2500, x2: 1500, y2: 1500},
            
            // Curved road segments (represented as straight lines)
            {x1: 200, y1: 1000, x2: 500, y2: 1200},
            {x1: 2800, y1: 1000, x2: 2500, y2: 1200},
            {x1: 200, y1: 2000, x2: 500, y2: 1800},
            {x1: 2800, y1: 2000, x2: 2500, y2: 1800}
        ];
        
        // Event listeners for controls
        window.addEventListener('keydown', (e) => {
            handleKeyInput(e, true);
        });
        
        window.addEventListener('keyup', (e) => {
            handleKeyInput(e, false);
        });
        
        function handleKeyInput(e, isPressed) {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                    gameState.controls.up = isPressed;
                    break;
                case 'ArrowDown':
                case 's':
                    gameState.controls.down = isPressed;
                    break;
                case 'ArrowLeft':
                case 'a':
                    gameState.controls.left = isPressed;
                    break;
                case 'ArrowRight':
                case 'd':
                    gameState.controls.right = isPressed;
                    break;
                case ' ':
                    gameState.controls.handbrake = isPressed;
                    break;
                case 'f':
                    gameState.controls.refuel = isPressed;
                    break;
            }
        }
        
        // Main game loop
        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }
        
        function updateGame() {
            updatePlayerPosition();
            updateCamera();
            updateParticles();
            checkGasStations();
            checkLocation();
        }
        
        function updatePlayerPosition() {
            // Handle acceleration and deceleration
            if (gameState.controls.up && gameState.player.fuelLevel > 0) {
                gameState.player.speed += gameState.player.acceleration;
                gameState.player.fuelLevel -= gameState.player.fuelConsumption * (0.5 + gameState.player.speed / gameState.player.maxSpeed);
                
                // Create dust particles while accelerating
                if (Math.random() > 0.7) {
                    createDustParticle();
                }
            } else if (gameState.controls.down) {
                if (gameState.player.speed > 0) {
                    gameState.player.speed -= gameState.player.deceleration * 2;
                } else {
                    gameState.player.speed -= gameState.player.acceleration / 2;
                }
                
                if (gameState.player.speed < -gameState.player.maxSpeed / 2) {
                    gameState.player.speed = -gameState.player.maxSpeed / 2;
                }
                
                if (gameState.player.fuelLevel > 0) {
                    gameState.player.fuelLevel -= gameState.player.fuelConsumption * 0.3;
                }
            } else {
                // Natural deceleration
                if (Math.abs(gameState.player.speed) < gameState.player.deceleration) {
                    gameState.player.speed = 0;
                } else if (gameState.player.speed > 0) {
                    gameState.player.speed -= gameState.player.deceleration;
                } else {
                    gameState.player.speed += gameState.player.deceleration;
                }
            }
            
            // Cap maximum speed
            if (gameState.player.speed > gameState.player.maxSpeed) {
                gameState.player.speed = gameState.player.maxSpeed;
            }
            
            // Handle steering
            if (Math.abs(gameState.player.speed) > 0.1) {
                let steeringFactor = gameState.player.handling * (gameState.controls.handbrake ? 1.5 : 1);
                
                if (gameState.controls.left) {
                    gameState.player.angle -= steeringFactor * (gameState.player.speed / gameState.player.maxSpeed);
                    
                    // Create skid marks during hard turns with handbrake
                    if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 2) {
                        createSkidMark();
                    }
                }
                
                if (gameState.controls.right) {
                    gameState.player.angle += steeringFactor * (gameState.player.speed / gameState.player.maxSpeed);
                    
                    // Create skid marks during hard turns with handbrake
                    if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 2) {
                        createSkidMark();
                    }
                }
            }
            
            // Apply handbrake
            if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > 0.5) {
                gameState.player.speed *= 0.95;
                
                // Create skid marks when handbraking
                if (Math.random() > 0.6) {
                    createSkidMark();
                }
            }
            
            // Update player position based on angle and speed
            if (Math.abs(gameState.player.speed) > 0) {
                const radians = gameState.player.angle * Math.PI / 180;
                const dx = Math.sin(radians) * gameState.player.speed;
                const dy = -Math.cos(radians) * gameState.player.speed;
                
                const newX = gameState.player.x + dx;
                const newY = gameState.player.y + dy;
                
                // Check for collision with world boundaries
                if (newX > 0 && newX < gameState.world.width) {
                    gameState.player.x = newX;
                } else {
                    gameState.player.speed *= -0.5; // Bounce off boundaries
                }
                
                if (newY > 0 && newY < gameState.world.height) {
                    gameState.player.y = newY;
                } else {
                    gameState.player.speed *= -0.5; // Bounce off boundaries
                }
                
                // Check for collisions with obstacles
                checkCollisions();
            }
            
            // Update fuel gauge display
            document.getElementById('fuel-level').style.width = `${gameState.player.fuelLevel}%`;
            document.getElementById('speed').textContent = Math.abs(Math.round(gameState.player.speed * 20));
        }
        
        function checkCollisions() {
            // Check buildings
            for (const building of gameState.world.buildings) {
                if (isColliding(gameState.player, building)) {
                    gameState.player.speed *= -0.5; // Bounce off buildings
                    createDustParticle();
                    createDustParticle(); // Extra particles for collision
                    break;
                }
            }
            
            // Check obstacles
            for (const obstacle of gameState.world.obstacles) {
                if (isColliding(gameState.player, obstacle)) {
                    gameState.player.speed *= -0.3; // Bounce off obstacles
                    createDustParticle();
                    break;
                }
            }
        }
        
        function isColliding(a, b) {
            // Simple rectangle collision
            return (
                a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y
            );
        }
        
        function checkGasStations() {
            if (gameState.controls.refuel) {
                for (const station of gameState.world.gasStations) {
                    // Check if player is near a gas station
                    const dx = gameState.player.x - station.x;
                    const dy = gameState.player.y - station.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 80) {
                        // Refuel the car
                        gameState.player.fuelLevel += 1;
                        if (gameState.player.fuelLevel > 100) {
                            gameState.player.fuelLevel = 100;
                        }
                        break;
                    }
                }
            }
        }
        
        function checkLocation() {
            let currentZone = null;
            let closestDistance = Infinity;
            
            for (const zone of gameState.zones) {
                const dx = gameState.player.x - zone.x;
                const dy = gameState.player.y - zone.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < zone.radius && distance < closestDistance) {
                    closestDistance = distance;
                    currentZone = zone;
                }
            }
            
            if (currentZone) {
                document.getElementById('location').textContent = `LOCATION: ${currentZone.name}`;
            } else {
                document.getElementById('location').textContent = 'LOCATION: COUNTRYSIDE';
            }
        }
        
        function createSkidMark() {
            const radians = gameState.player.angle * Math.PI / 180;
            gameState.fx.skidMarks.push({
                x: gameState.player.x - Math.sin(radians) * 10,
                y: gameState.player.y + Math.cos(radians) * 10,
                angle: gameState.player.angle,
                alpha: 0.8,
                width: 2 + Math.abs(gameState.player.speed)
            });
            
            // Limit the number of skid marks
            if (gameState.fx.skidMarks.length > 100) {
                gameState.fx.skidMarks.shift();
            }
        }
        
        function createDustParticle() {
            const radians = gameState.player.angle * Math.PI / 180;
            const offX = Math.random() * 10 - 5;
            const offY = Math.random() * 10 - 5;
            
            gameState.fx.dustParticles.push({
                x: gameState.player.x - Math.sin(radians) * 20 + offX,
                y: gameState.player.y + Math.cos(radians) * 20 + offY,
                size: 2 + Math.random() * 5,
                alpha: 0.7,
                life: 30 + Math.random() * 30,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1
            });
        }
        
        function updateParticles() {
            // Update dust particles
            for (let i = gameState.fx.dustParticles.length - 1; i >= 0; i--) {
                const particle = gameState.fx.dustParticles[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 1;
                particle.alpha -= 0.02;
                
                if (particle.life <= 0 || particle.alpha <= 0) {
                    gameState.fx.dustParticles.splice(i, 1);
                }
            }
            
            // Fade out skid marks over time
            for (let i = gameState.fx.skidMarks.length - 1; i >= 0; i--) {
                const skid = gameState.fx.skidMarks[i];
                skid.alpha -= 0.001;
                
                if (skid.alpha <= 0) {
                    gameState.fx.skidMarks.splice(i, 1);
                }
            }
        }
        
        function updateCamera() {
            // Camera follows the player
            gameState.camera.x = gameState.player.x - canvas.width / 2;
            gameState.camera.y = gameState.player.y - canvas.height / 2;
            
            // Keep camera within world bounds
            if (gameState.camera.x < 0) gameState.camera.x = 0;
            if (gameState.camera.y < 0) gameState.camera.y = 0;
            if (gameState.camera.x > gameState.world.width - canvas.width)
                gameState.camera.x = gameState.world.width - canvas.width;
            if (gameState.camera.y > gameState.world.height - canvas.height)
                gameState.camera.y = gameState.world.height - canvas.height;
        }
        
        function renderGame() {
            // Clear canvas
            ctx.fillStyle = gameState.world.grassColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw the world
            drawRoads();
            drawBuildings();
            drawTrees();
            drawObstacles();
            drawGasStations();
            drawSkidMarks();
            drawDustParticles();
            drawPlayer();
            
            // Draw mini-map
            drawMiniMap();
        }
        
        function drawRoads() {
            roads.forEach(road => {
                // Transform road coordinates to screen coordinates
                const x1 = road.x1 - gameState.camera.x;
                const y1 = road.y1 - gameState.camera.y;
                const x2 = road.x2 - gameState.camera.x;
                const y2 = road.y2 - gameState.camera.y;
                
                // Calculate the angle of the road
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const length = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                
                // Draw the road as a rectangle
                ctx.save();
                ctx.translate(x1, y1);
                ctx.rotate(angle);
                
                // Road background
                ctx.fillStyle = gameState.world.roadColor;
                ctx.fillRect(0, -gameState.world.roadWidth / 2, length, gameState.world.roadWidth);
                
                // Road center line
                ctx.fillStyle = gameState.world.lineColor;
                ctx.fillRect(0, -gameState.world.lineWidth / 2, length, gameState.world.lineWidth);
                
                // Dashed lines on both sides
                ctx.setLineDash([20, 20]);
                ctx.strokeStyle = gameState.world.lineColor;
                ctx.lineWidth = gameState.world.lineWidth;
                ctx.beginPath();
                ctx.moveTo(0, -gameState.world.roadWidth / 4);
                ctx.lineTo(length, -gameState.world.roadWidth / 4);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, gameState.world.roadWidth / 4);
                ctx.lineTo(length, gameState.world.roadWidth / 4);
                ctx.stroke();
                
                ctx.restore();
            });
        }
        
        function drawBuildings() {
            gameState.world.buildings.forEach(building => {
                const screenX = building.x - gameState.camera.x;
                const screenY = building.y - gameState.camera.y;
                
                // Only draw if visible on screen
                if (
                    screenX + building.width >= 0 &&
                    screenX <= canvas.width &&
                    screenY + building.height >= 0 &&
                    screenY <= canvas.height
                ) {
                    ctx.fillStyle = building.color;
                    ctx.fillRect(screenX, screenY, building.width, building.height);
                    
                    // Draw building details
                    ctx.fillStyle = '#222';
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            if (Math.random() > 0.5) {
                                ctx.fillRect(
                                    screenX + 5 + (building.width / 3) * i,
                                    screenY + 5 + (building.height / 3) * j,
                                    building.width / 4,
                                    building.height / 4
                                );
                            }
                        }
                    }
                }
            });
        }
        
        function drawTrees() {
            gameState.world.trees.forEach(tree => {
                const screenX = tree.x - gameState.camera.x;
                const screenY = tree.y - gameState.camera.y;
                
                // Only draw if visible on screen
                if (
                    screenX + tree.radius >= 0 &&
                    screenX - tree.radius <= canvas.width &&
                    screenY + tree.radius >= 0 &&
                    screenY - tree.radius <= canvas.height
                ) {
                    // Draw tree trunk
                    ctx.fillStyle = '#643200';
                    ctx.fillRect(screenX - tree.radius / 4, screenY - tree.radius / 4, tree.radius / 2, tree.radius / 2);
                    
                    // Draw tree top
                    ctx.fillStyle = tree.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY - tree.radius / 2, tree.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }
        
        function drawObstacles() {
            gameState.world.obstacles.forEach(obstacle => {
                const screenX = obstacle.x - gameState.camera.x;
                const screenY = obstacle.y - gameState.camera.y;
                
                // Only draw if visible on screen
                if (
                    screenX + obstacle.width >= 0 &&
                    screenX <= canvas.width &&
                    screenY + obstacle.height >= 0 &&
                    screenY <= canvas.height
                ) {
                    ctx.fillStyle = obstacle.color;
                    ctx.fillRect(screenX, screenY, obstacle.width, obstacle.height);
                }
            });
        }
        
        function drawGasStations() {
            gameState.world.gasStations.forEach(station => {
                const screenX = station.x - gameState.camera.x;
                const screenY = station.y - gameState.camera.y;
                
                // Only draw if visible on screen
                if (
                    screenX + station.width >= 0 &&
                    screenX <= canvas.width &&
                    screenY + station.height >= 0 &&
                    screenY <= canvas.height
                ) {
                    // Draw gas station base
                    ctx.fillStyle = '#777';
                    ctx.fillRect(screenX - 10, screenY - 10, station.width + 20, station.height + 20);
                    
                    // Draw gas pump
                    ctx.fillStyle = station.color;
                    ctx.fillRect(screenX, screenY, station.width, station.height);
                    
                    // Draw gas symbol
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('⛽', screenX + station.width / 2, screenY + station.height / 2 + 5);
                }
            });
        }
        
        function drawSkidMarks() {
            gameState.fx.skidMarks.forEach(skid => {
                const screenX = skid.x - gameState.camera.x;
                const screenY = skid.y - gameState.camera.y;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(skid.angle * Math.PI / 180);
                
                ctx.fillStyle = `rgba(0, 0, 0, ${skid.alpha})`;
                ctx.fillRect(-skid.width / 2, -2, skid.width, 4);
                
                ctx.restore();
            });
        }
        
        function drawDustParticles() {
            gameState.fx.dustParticles.forEach(particle => {
                const screenX = particle.x - gameState.camera.x;
                const screenY = particle.y - gameState.camera.y;
                
                ctx.fillStyle = `rgba(210, 180, 140, ${particle.alpha})`;
                ctx.beginPath();
                ctx.arc(screenX, screenY, particle.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawPlayer() {
            // Transform to player position and rotation
            ctx.save();
            
            const screenX = gameState.player.x - gameState.camera.x;
            const screenY = gameState.player.y - gameState.camera.y;
            
            ctx.translate(screenX, screenY);
            ctx.rotate(gameState.player.angle * Math.PI / 180);
            
            // Draw car body
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(-gameState.player.width / 2, -gameState.player.height / 2, gameState.player.width, gameState.player.height);
            
            // Draw windows
            ctx.fillStyle = '#99ccff';
            ctx.fillRect(-gameState.player.width / 2 + 3, -gameState.player.height / 2 + 3, gameState.player.width - 6, 8);
            ctx.fillRect(-gameState.player.width / 2 + 3, gameState.player.height / 2 - 12, gameState.player.width - 6, 9);
            
            // Draw wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-gameState.player.width / 2 - 2, -gameState.player.height / 2 + 5, 4, 8);
            ctx.fillRect(gameState.player.width / 2 - 2, -gameState.player.height / 2 + 5, 4, 8);
            ctx.fillRect(-gameState.player.width / 2 - 2, gameState.player.height / 2 - 13, 4, 8);
            ctx.fillRect(gameState.player.width / 2 - 2, gameState.player.height / 2 - 13, 4, 8);
            
            ctx.restore();
        }
        
        function drawMiniMap() {
            const mapScale = miniMapCtx.canvas.width / gameState.world.width;
            
            // Clear mini-map
            miniMapCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            miniMapCtx.fillRect(0, 0, miniMapCtx.canvas.width, miniMapCtx.canvas.height);
            
            // Draw roads
            roads.forEach(road => {
                miniMapCtx.strokeStyle = '#555';
                miniMapCtx.lineWidth = 2
				miniMapCtx.strokeStyle = '#555';
miniMapCtx.lineWidth = 2;
miniMapCtx.beginPath();
miniMapCtx.moveTo(road.x1 * mapScale, road.y1 * mapScale);
miniMapCtx.lineTo(road.x2 * mapScale, road.y2 * mapScale);
miniMapCtx.stroke();
});

// Draw gas stations on mini-map
gameState.world.gasStations.forEach(station => {
    miniMapCtx.fillStyle = '#ff0000';
    miniMapCtx.fillRect(
        station.x * mapScale - 2,

    );
});

// Draw player on mini-map
miniMapCtx.fillStyle = '#00ff00';

// Draw player direction indicator

const dirY = gameState.player.y - Math.cos(gameState.player.angle * Math.PI / 180) * 10;

}

// Initialize trees that are not on roads
function initializeWorldObjects() {
    // Clear existing trees and reassign
    gameState.world.trees = [];
    for (let i = 0; i < 200; i++) {
        const x = Math.random() * gameState.world.width;
        const y = Math.random() * gameState.world.height;
        
        // Check if the tree is on a road
        if (!isOnRoad(x, y, 20)) {
            gameState.world.trees.push({
                x: x,
                y: y,
                radius: 5 + Math.random() * 10,
                color: `hsl(${100 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${20 + Math.random() * 20}%)`
            });
        }
    }
    
    // Clear existing buildings and reassign
    gameState.world.buildings = [];
    for (let i = 0; i < 40; i++) {
        const width = 30 + Math.random() * 70;
        const height = 30 + Math.random() * 70;
        const x = Math.random() * (gameState.world.width - width);
        const y = Math.random() * (gameState.world.height - height);
        
        // Check if the building is on a road
        if (!isOnRoad(x + width/2, y + height/2, Math.max(width, height) / 2)) {
            gameState.world.buildings.push({
                x: x,
                y: y,
                width: width,
                height: height,
                color: `hsl(${200 + Math.random() * 40}, ${20 + Math.random() * 20}%, ${40 + Math.random() * 30}%)`
            });
        }
    }
}

function isOnRoad(x, y, buffer) {
    for (const road of roads) {
        const roadX1 = road.x1;
        const roadY1 = road.y1;
        const roadX2 = road.x2;
        const roadY2 = road.y2;
        
        // Calculate the distance from point to line segment
        const A = x - roadX1;
        const B = y - roadY1;
        const C = roadX2 - roadX1;
        const D = roadY2 - roadY1;
        
        const dot = A * C + B * D;
        const lenSq = C * C + D * D;
        let param = -1;
        
        if (lenSq !== 0) param = dot / lenSq;
        
        let xx, yy;
        
        if (param < 0) {
            xx = roadX1;
            yy = roadY1;
        } else if (param > 1) {
            xx = roadX2;
            yy = roadY2;
        } else {
            xx = roadX1 + param * C;
            yy = roadY1 + param * D;
        }
        
        const dx = x - xx;
        const dy = y - yy;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance < gameState.world.roadWidth / 2 + buffer) {
            return true;
        }
    }
    
    return false;
}

// Game day/night cycle
function updateDayNightCycle() {
    const cycleTime = 300000; // 5 minutes for full day-night cycle
    const elapsedTime = (Date.now() - gameState.world.startTime) % cycleTime;
    const timeRatio = elapsedTime / cycleTime;
    
    // Calculate brightness level (0 to 1)
    // Using sin wave to transition between day and night
    const brightness = 0.5 + 0.4 * Math.sin(timeRatio * Math.PI * 2);
    
    // Update grass color
    const grassHue = 100; // Green
    const grassSaturation = Math.floor(60 * brightness);
    const grassLightness = Math.floor(26 * brightness);
    gameState.world.grassColor = `hsl(${grassHue}, ${grassSaturation}%, ${grassLightness}%)`;
    
    // Update road color
    const roadLightness = Math.floor(20 * brightness);
    gameState.world.roadColor = `hsl(0, 0%, ${roadLightness}%)`;
    
    // Update sky color (canvas background)
    document.body.style.backgroundColor = `hsl(210, 50%, ${Math.floor(10 + 30 * brightness)}%)`;
}

// Handle window resize
function handleResize() {
    // Keep the game responsive while maintaining the aspect ratio
    const gameContainer = document.getElementById('game-container');
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    const ratio = canvas.width / canvas.height;
    let newWidth = windowWidth * 0.9;
    let newHeight = newWidth / ratio;
    
    if (newHeight > windowHeight * 0.9) {
        newHeight = windowHeight * 0.9;
        newWidth = newHeight * ratio;
    }
    
    canvas.style.width = `${newWidth}px`;
    canvas.style.height = `${newHeight}px`;
}

// Game initialization
function initGame() {
    // Initialize world objects
    initializeWorldObjects();
    
    // Handle window resize
    window.addEventListener('resize', handleResize);
    handleResize();
    
    // Start the game loop
    gameLoop();
    
    // Add day/night cycle update
    setInterval(updateDayNightCycle, 1000); // Update every second
}

// Start the game
initGame();
