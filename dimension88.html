
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenoscape Drifter: Anomaly Purge</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0a0510; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; /* image-rendering: pixelated; affects child canvas if it were 2D */ }
        #gameCanvas3D { display: block; cursor: crosshair; } /* Renamed for clarity */
        #hud { position: absolute; color: #00ffff; padding: 8px; font-size: 13px; text-align: left; top: 10px; left: 10px; background-color: rgba(20, 0, 30, 0.75); border-radius: 5px; border: 1px solid #400060; z-index: 10; }
        #hud div { margin-bottom: 4px; }
        #fuel-bar { width: 90px; height: 8px; background-color: #330033; margin: 3px 0; border: 1px solid #550055; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #fuel-level { height: 100%; background-color: #cc00ff; width: 100%; transition: width 0.5s ease-out; }
        #health-bar { width: 90px; height: 8px; background-color: #400000; margin: 3px 0; border: 1px solid #600000; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #health-level { height: 100%; background-color: #00ccff; width: 100%; transition: width 0.2s linear; }
        #location { margin-top: 4px; }
        #mini-map { position: absolute; top: 10px; right: 10px; width: 120px; height: 120px; background-color: rgba(10, 0, 20, 0.8); border: 1px solid #400060; border-radius: 5px; z-index: 10; overflow: hidden; }
        #mini-map canvas { display: block; }
        #controls-display { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #aaaaff; background-color: rgba(20, 0, 30, 0.75); padding: 4px 8px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #400060; z-index: 10; white-space: nowrap; }
        #mission-text, #stats { display: none; } /* Hide placeholders */
        #weapon-display { position: absolute; bottom: 10px; right: 10px; color: #00ffff; background-color: rgba(20, 0, 30, 0.75); padding: 4px 8px; border-radius: 5px; font-size: 13px; z-index: 10; border: 1px solid #400060;}
        #vehicle-display { position: absolute; top: 40px; left: 10px; color: #00ffff; background-color: rgba(20, 0, 30, 0.75); padding: 4px 8px; border-radius: 5px; font-size: 13px; z-index: 10; display: none; border: 1px solid #400060;}
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
             <div id="health-line">CORE: <div id="health-bar"><div id="health-level"></div></div></div>
             <div id="speed-line">VEL: <span id="speed">0</span></div>
             <div id="fuel-line">X-CELL: <div id="fuel-bar"><div id="fuel-level"></div></div></div>
             <div id="location">SECTOR: UNKNOWN</div>
             <div id="enemy-count">ANOMALIES: <span id="enemies-left">0</span></div>
         </div>
         <div id="mini-map"></div>
         <div id="controls-display">
             WASD/Arrows: Navigate | E: Interface | F: Recharge | SPACE: Inertial Damp | SHIFT/Click: Activate Emitter | Q: Cycle Emitter
         </div>
        <div id="weapon-display">EMITTER: PULSE</div>
        <div id="vehicle-display">DRIFTER: NONE</div>
        <div id="mission-text"></div>
        <div id="stats"></div>
    </div>















    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Three.js Setup ---
        let scene, camera, renderer, clock;
        const gameCanvasWidth = 800;
        const gameCanvasHeight = 600;
        let groundPlane;
        const textureLoader = new THREE.TextureLoader();

        const threeObjects = {
            player: null,
            enemies: [],
            vehicles: [],
            buildings: [],
            trees: [], // Renamed to flora, but variable kept for simplicity
            obstacles: [],
            gasStations: [], // Renamed to energyPylons, variable kept
            projectiles: [],
            skidMarks: [], // Renamed to energyTrails
            dustParticles: null, // Renamed to xenoSpores
            explosions: [],
            muzzleFlashes: [], // Renamed to emitterFlashes
            hitSparks: [] // Renamed to ichorSplats
        };

        const miniMapContainer = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMapContainer.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120; miniMapCtx.canvas.height = 120;

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let engineNoiseOscillator = null;
        let engineNoiseGain = null;

        const PLAYER_PED_WIDTH = 0.7; // Slightly wider for alien physiology
        const PLAYER_PED_HEIGHT = 2.0; // Slightly taller
        const ENEMY_WIDTH = 0.8; // Anomalies might be amorphous
        const ENEMY_HEIGHT = 1.5; // Variable height

        const PROJECTILE_SPEED = 25;
        const PROJECTILE_LIFESPAN = 1.8;
        const PROJECTILE_DAMAGE_PULSE = 20;
        const PROJECTILE_DAMAGE_SHARD = 12;

        const ENEMY_HEALTH = 80;
        const ENEMY_SPEED = 1.0; // Slower, more deliberate
        const ENEMY_CHASE_DIST = 30;
        const ENEMY_ATTACK_DIST = 1.8;
        const ENEMY_ATTACK_COOLDOWN = 70;
        const ENEMY_DAMAGE_MELEE = 10;

        const PLAYER_ENTER_VEHICLE_RANGE = 3.5;
        const ANIM_SPEED = 7;

        const WEAPONS = {
            'pulse_emitter': { fireRate: 12, bulletSpread: 2, damage: PROJECTILE_DAMAGE_PULSE, color: 0x00ffff }, // Cyan
            'shard_disruptor': { fireRate: 4, bulletSpread: 6, damage: PROJECTILE_DAMAGE_SHARD, color: 0xff00ff } // Magenta
        };

        const VEHICLE_TYPES = {
            'phase_skimmer': { // Was sedan
                width: 2.2, height: 1.4, depth: 4.2,
                maxSpeed: 18, acceleration: 3.5, deceleration: 2.2, handling: 1.6,
                fuelConsumption: 0.018, color: 0x6A0DAD // Deep Purple
            },
            'quasar_hauler': { // Was truck
                width: 2.8, height: 2.5, depth: 6.0,
                maxSpeed: 12, acceleration: 2.2, deceleration: 1.2, handling: 0.9,
                fuelConsumption: 0.028, color: 0x8B4513 // SaddleBrown (alien industrial)
            },
            'void_striker': { // Was sportsCar
                width: 2.0, height: 1.2, depth: 4.5,
                maxSpeed: 25, acceleration: 5.5, deceleration: 2.8, handling: 1.9,
                fuelConsumption: 0.022, color: 0x00CED1 // DarkTurquoise
            },
            'dune_wraith': { // Was buggy
                width: 2.1, height: 1.8, depth: 3.5,
                maxSpeed: 20, acceleration: 4.5, deceleration: 1.8, handling: 2.2,
                fuelConsumption: 0.015, color: 0x556B2F // DarkOliveGreen
            }
        };

        const gameState = {
            playerState: 'driving',
            player: {
                x: 150, z: 150, y_height: 0,
                speed: 0, angle: 0,
                fuelLevel: 100, health: 100, maxHealth: 100,
                pedWidth: PLAYER_PED_WIDTH, pedHeight: PLAYER_PED_HEIGHT, pedSpeed: 2.2,
                isMoving: false,
                animTimer: 0, animFrame: 0,
                animSpeed: ANIM_SPEED,
                fireCooldown: 0,
                currentWeapon: 'pulse_emitter',
                hasMachineGun: false, // Renamed to hasShardDisruptor internally
                killedEnemiesCount: 0,
                width: VEHICLE_TYPES.phase_skimmer.width,
                vehicle_height_prop: VEHICLE_TYPES.phase_skimmer.height,
                depth: VEHICLE_TYPES.phase_skimmer.depth,
                maxSpeed: VEHICLE_TYPES.phase_skimmer.maxSpeed,
                acceleration: VEHICLE_TYPES.phase_skimmer.acceleration,
                deceleration: VEHICLE_TYPES.phase_skimmer.deceleration,
                handling: VEHICLE_TYPES.phase_skimmer.handling,
                fuelConsumption: VEHICLE_TYPES.phase_skimmer.fuelConsumption,
                color: VEHICLE_TYPES.phase_skimmer.color,
                currentVehicleType: 'phase_skimmer',
                mesh: null,
                boundingBox: new THREE.Box3()
            },
            controls: { up: false, down: false, left: false, right: false, handbrake: false, refuel: false, fire: false, enterExit: false, enterExitProcessed: false, switchWeapon: false, switchWeaponProcessed: false, mouseFire: false },
            world: {
                width: 300, height: 300,
                roadWidth: 7, // Wider alien pathways
                grassColor: 0x1a0a2a, // Deep violet-blue ground
                roadColor: 0x301040, // Darker purple-grey roads
                lineColor: 0x9900FF, // Bright purple glowing lines
                lineWidth: 0.3, // Thicker lines
                trees: [], buildings: [], obstacles: [], gasStations: [],
                vehicles: [], enemies: [], projectiles: [],
                impassableZones: [ { type: 'crystal_formation', x: 220, z: 220, width: 50, depth: 60, height: 10, color: 0x7030A0 }, { type: 'ancient_ruins', x: 10, z: 10, width: 40, depth: 50, height: 12, color: 0x4A4A70 } ],
                startTime: Date.now()
            },
            fx: {
                skidMarks: [], dustParticlesData: [], explosionsData: [], muzzleFlashesData: [], hitSparksData: []
            },
            zones: [
                {name: "KRYLLIDIAN NESTS", x: 100, z: 100, radius: 60},
                {name: "CRYSTAL SPIRES", x: 60, z: 220, radius: 50},
                {name: "XENOFORM PLAINS", x: 220, z: 180, radius: 40},
                {name: "ANCIENT MYCELIA", x: 200, z: 50, radius: 35}
            ],
            gameOver: false
        };

        const roads = [ // (x1, z1) to (x2, z2) in 3D
            {x1: 0, z1: 100, x2: gameState.world.width, z2: 100},
            {x1: 0, z1: 200, x2: gameState.world.width, z2: 200},
            {x1: 100, z1: 0, x2: 100, z2: gameState.world.height},
            {x1: 200, z1: 0, x2: 200, z2: gameState.world.height},
            {x1: 50, z1: 50, x2: 70, z2: 70}, {x1: 80, z1: 80, x2: 150, z2: 150},
            {x1: 250, z1: 50, x2: 230, z2: 70}, {x1: 220, z1: 80, x2: 150, z2: 150},
            {x1: 50, z1: 250, x2: 70, z2: 230}, {x1: 80, z1: 220, x2: 150, z2: 150},
            {x1: 250, z1: 250, x2: 230, z2: 230}, {x1: 220, z1: 220, x2: 150, z2: 150},
        ];
        const roadTexture = createRoadTexture();


        window.addEventListener('keydown', (e) => { handleKeyInput(e, true); });
        window.addEventListener('keyup', (e) => { handleKeyInput(e, false); });
        document.getElementById('game-container').addEventListener('mousedown', (e) => { if (e.button === 0) gameState.controls.mouseFire = true; });
        document.getElementById('game-container').addEventListener('mouseup', (e) => { if (e.button === 0) gameState.controls.mouseFire = false; });


        function handleKeyInput(e, isPressed) {
            const key = e.key.toLowerCase();
            switch(key) {
                case 'arrowup': case 'w': gameState.controls.up = isPressed; break;
                case 'arrowdown': case 's': gameState.controls.down = isPressed; break;
                case 'arrowleft': case 'a': gameState.controls.left = isPressed; break;
                case 'arrowright': case 'd': gameState.controls.right = isPressed; break;
                case ' ': gameState.controls.handbrake = isPressed; break;
                case 'f': gameState.controls.refuel = isPressed; break;
                case 'shift': gameState.controls.fire = isPressed; break;
                case 'e':
                    if (isPressed && !gameState.controls.enterExitProcessed) {
                        gameState.controls.enterExit = true;
                        gameState.controls.enterExitProcessed = true;
                    } else if (!isPressed) {
                        gameState.controls.enterExitProcessed = false;
                    }
                    break;
                case 'q':
                    if (isPressed && !gameState.controls.switchWeaponProcessed) {
                         gameState.controls.switchWeapon = true;
                         gameState.controls.switchWeaponProcessed = true;
                    } else if (!isPressed) {
                         gameState.controls.switchWeaponProcessed = false;
                    }
                    break;
            }
            if ((key === ' ' || key === 'shift' || key.startsWith('arrow') || ['w','a','s','d','e','f','q'].includes(key)) && isPressed) {
                 e.preventDefault();
            }
        }

        function handleWeaponSwitch() {
            if (!gameState.controls.switchWeapon || gameState.playerState !== 'onFoot') return;
            if (gameState.player.hasMachineGun) { // Internally still 'hasMachineGun'
                gameState.player.currentWeapon = gameState.player.currentWeapon === 'pulse_emitter' ? 'shard_disruptor' : 'pulse_emitter';
            }
            document.getElementById('weapon-display').textContent = `EMITTER: ${gameState.player.currentWeapon.replace('_emitter','').replace('_disruptor','').toUpperCase()}`;
            gameState.controls.switchWeapon = false;
        }

        function handleEnterExitAction() {
            if (!gameState.controls.enterExit) return;
            const delta = clock.getDelta();

            if (gameState.playerState === 'driving') {
                if (gameState.player.mesh) scene.remove(gameState.player.mesh);

                const parkedCarLogic = {
                    x: gameState.player.x, z: gameState.player.z,
                    width: gameState.player.width, height: gameState.player.vehicle_height_prop, depth: gameState.player.depth,
                    angle: gameState.player.angle, color: gameState.player.color,
                    maxSpeed: gameState.player.maxSpeed, handling: gameState.player.handling,
                    fuelLevel: gameState.player.fuelLevel,
                    type: gameState.player.currentVehicleType,
                    mesh: createVehicleMesh(gameState.player.currentVehicleType, gameState.player.color),
                    boundingBox: new THREE.Box3()
                };
                parkedCarLogic.mesh.position.set(parkedCarLogic.x, parkedCarLogic.height / 2, parkedCarLogic.z);
                parkedCarLogic.mesh.rotation.y = parkedCarLogic.angle;
                parkedCarLogic.boundingBox.setFromObject(parkedCarLogic.mesh);
                gameState.world.vehicles.push(parkedCarLogic);
                threeObjects.vehicles.push(parkedCarLogic.mesh);
                scene.add(parkedCarLogic.mesh);

                gameState.playerState = 'onFoot';
                const exitOffset = (gameState.player.width / 2) + 0.5 + gameState.player.pedWidth / 2;
                gameState.player.x += Math.sin(gameState.player.angle) * exitOffset;
                gameState.player.z += Math.cos(gameState.player.angle) * exitOffset;
                gameState.player.speed = 0;

                gameState.player.mesh = createCharacterMesh(true); // Player is type true
                gameState.player.mesh.position.set(gameState.player.x, gameState.player.pedHeight / 2, gameState.player.z);
                gameState.player.mesh.rotation.y = gameState.player.angle;
                scene.add(gameState.player.mesh);

                stopEngineNoise();
                document.getElementById('vehicle-display').style.display = 'none';
            } else if (gameState.playerState === 'onFoot') {
                let closestCarTuple = null;
                let minDistanceSq = PLAYER_ENTER_VEHICLE_RANGE * PLAYER_ENTER_VEHICLE_RANGE;

                for (let i = gameState.world.vehicles.length - 1; i >= 0; i--) {
                    const carLogic = gameState.world.vehicles[i];
                    const dx = gameState.player.x - carLogic.x;
                    const dz = gameState.player.z - carLogic.z;
                    const distanceSq = dx * dx + dz * dz;

                    if (distanceSq < minDistanceSq) {
                        minDistanceSq = distanceSq;
                        closestCarTuple = { logic: carLogic, index: i };
                    }
                }

                if (closestCarTuple) {
                    const closestCar = closestCarTuple.logic;
                    if (gameState.player.mesh) scene.remove(gameState.player.mesh);
                    scene.remove(closestCar.mesh);
                    const meshIndex = threeObjects.vehicles.indexOf(closestCar.mesh);
                    if (meshIndex > -1) threeObjects.vehicles.splice(meshIndex, 1);

                    gameState.playerState = 'driving';
                    gameState.player.x = closestCar.x;
                    gameState.player.z = closestCar.z;
                    gameState.player.width = closestCar.width;
                    gameState.player.vehicle_height_prop = closestCar.height;
                    gameState.player.depth = closestCar.depth;
                    gameState.player.angle = closestCar.angle;
                    gameState.player.color = closestCar.color;
                    gameState.player.maxSpeed = closestCar.maxSpeed;
                    gameState.player.acceleration = VEHICLE_TYPES[closestCar.type].acceleration;
                    gameState.player.deceleration = VEHICLE_TYPES[closestCar.type].deceleration;
                    gameState.player.handling = VEHICLE_TYPES[closestCar.type].handling;
                    gameState.player.fuelLevel = closestCar.fuelLevel;
                    gameState.player.fuelConsumption = VEHICLE_TYPES[closestCar.type].fuelConsumption;
                    gameState.player.speed = 0;
                    gameState.player.currentVehicleType = closestCar.type;

                    gameState.player.mesh = createVehicleMesh(gameState.player.currentVehicleType, gameState.player.color);
                    gameState.player.mesh.position.set(gameState.player.x, gameState.player.vehicle_height_prop / 2, gameState.player.z);
                    gameState.player.mesh.rotation.y = gameState.player.angle;
                    scene.add(gameState.player.mesh);

                    gameState.world.vehicles.splice(closestCarTuple.index, 1);

                    startEngineNoise();
                    document.getElementById('vehicle-display').textContent = `DRIFTER: ${gameState.player.currentVehicleType.replace(/_/g, ' ').toUpperCase()}`;
                    document.getElementById('vehicle-display').style.display = '';
                }
            }
            gameState.controls.enterExit = false;
        }

        function handlePlayerFiring() {
            const currentWeaponProps = WEAPONS[gameState.player.currentWeapon];
            const isFiring = (gameState.controls.fire || gameState.controls.mouseFire) && gameState.playerState === 'onFoot';

            if (isFiring && gameState.player.fireCooldown <= 0) {
                const spreadRad = (Math.random() - 0.5) * currentWeaponProps.bulletSpread * (Math.PI / 180);
                const fireAngleRad = gameState.player.angle + spreadRad;

                const muzzleOffsetX = Math.sin(fireAngleRad) * (PLAYER_PED_WIDTH / 2 + 0.3); // Emitter further out
                const muzzleOffsetZ = Math.cos(fireAngleRad) * (PLAYER_PED_WIDTH / 2 + 0.3);
                const startX = gameState.player.x + muzzleOffsetX;
                const startZ = gameState.player.z + muzzleOffsetZ;
                const startY = gameState.player.pedHeight * 0.7; // Emitter height

                const projectileLogic = {
                    x: startX, y: startY, z: startZ,
                    vx: Math.sin(fireAngleRad) * PROJECTILE_SPEED,
                    vy: 0,
                    vz: Math.cos(fireAngleRad) * PROJECTILE_SPEED,
                    lifespan: PROJECTILE_LIFESPAN,
                    timer: 0,
                    owner: 'player',
                    damage: currentWeaponProps.damage,
                    color: currentWeaponProps.color,
                    mesh: createProjectileMesh(currentWeaponProps.color),
                    boundingBox: new THREE.Box3()
                };
                projectileLogic.mesh.position.set(startX, startY, startZ);
                // Orient projectile
                projectileLogic.mesh.lookAt(startX + projectileLogic.vx, startY, startZ + projectileLogic.vz);
                scene.add(projectileLogic.mesh);
                gameState.world.projectiles.push(projectileLogic);
                threeObjects.projectiles.push(projectileLogic.mesh);

                createMuzzleFlashEffect(startX, startY, startZ, currentWeaponProps.color); // Emitter flash
                playShotSound(gameState.player.currentWeapon);
                gameState.player.fireCooldown = currentWeaponProps.fireRate;
            }

            if (gameState.player.fireCooldown > 0) {
                gameState.player.fireCooldown--;
            }
        }


        function gameLoop() {
            if (gameState.gameOver) {
                drawGameOver();
                requestAnimationFrame(gameLoop);
                return;
            }
            const delta = clock.getDelta();

            handleEnterExitAction();
            handleWeaponSwitch();
            handlePlayerFiring();

            updateGame(delta);
            renderGame3D();
            requestAnimationFrame(gameLoop);
        }

        function updateGame(delta) {
            updatePlayerPosition(delta);
            updateEnemies(delta);
            updateProjectiles(delta);
            updateCamera();
            updateParticlesAndEffects3D(delta);
            updateHUD();
            checkGameOverCondition();
        }

        function updatePlayerPosition(delta) {
            const oldX = gameState.player.x;
            const oldZ = gameState.player.z;

            if (gameState.playerState === 'driving') {
                updateDrivingPhysics(delta);
                checkGasStations(delta); // Check Energy Pylons
                updateEngineNoise(); // Update Drifter hum
            } else if (gameState.playerState === 'onFoot') {
                updateWalkingPhysics(delta);
                stopEngineNoise();
                updateCharacterAnimation(gameState.player, gameState.player.mesh);
            }

            if (gameState.player.mesh) {
                gameState.player.mesh.position.set(gameState.player.x,
                    gameState.playerState === 'driving' ? gameState.player.vehicle_height_prop / 2 : gameState.player.pedHeight / 2,
                    gameState.player.z);
                gameState.player.mesh.rotation.y = gameState.player.angle;
                gameState.player.boundingBox.setFromObject(gameState.player.mesh);
            }

            const collisionResult = checkCollisions(oldX, oldZ, gameState.player, gameState.playerState);
            if(collisionResult.collided){
                 gameState.player.x = collisionResult.newX;
                 gameState.player.z = collisionResult.newZ;
                 if (gameState.player.mesh) {
                    gameState.player.mesh.position.x = collisionResult.newX;
                    gameState.player.mesh.position.z = collisionResult.newZ;
                 }
            }
        }

        function updateDrivingPhysics(delta) {
            const player = gameState.player;
            const controls = gameState.controls;

            if (controls.up && player.fuelLevel > 0) {
                player.speed += player.acceleration * delta;
                player.fuelLevel -= player.fuelConsumption * (0.5 + Math.abs(player.speed) / player.maxSpeed) * delta * 60;
                if (Math.random() > 0.6 && Math.abs(player.speed) > 1) createDustParticleEffect(true); // Xeno Spores
            } else if (controls.down) {
                if (player.speed > 0.1) {
                    player.speed -= player.deceleration * 3 * delta;
                } else {
                    player.speed -= (player.acceleration / 1.5) * delta;
                    if (player.fuelLevel > 0) player.fuelLevel -= player.fuelConsumption * 0.5 * delta * 60;
                }
            } else {
                if (Math.abs(player.speed) < player.deceleration * delta) player.speed = 0;
                else if (player.speed > 0) player.speed -= player.deceleration * delta;
                else player.speed += player.deceleration * delta;
            }

            player.speed = Math.max(-player.maxSpeed / 2, Math.min(player.speed, player.maxSpeed));

            if (Math.abs(player.speed) > 0.1) {
                let steeringFactor = player.handling * (controls.handbrake ? 1.8 : 1.0); // Inertial dampener bonus
                let speedModifier = 1.0 - (Math.abs(player.speed) / (player.maxSpeed * 1.5));
                speedModifier = Math.max(0.25, speedModifier); // More responsive turning at speed
                let turnDirection = player.speed >= 0 ? 1 : -1;

                if (controls.left) {
                    player.angle += steeringFactor * speedModifier * turnDirection * delta;
                    if (controls.handbrake && Math.abs(player.speed) > player.maxSpeed / 3) createSkidMarkEffect(); // Energy Trail
                }
                if (controls.right) {
                    player.angle -= steeringFactor * speedModifier * turnDirection * delta;
                    if (controls.handbrake && Math.abs(player.speed) > player.maxSpeed / 3) createSkidMarkEffect(); // Energy Trail
                }
            }
             if (player.angle > Math.PI) player.angle -= Math.PI * 2;
             if (player.angle < -Math.PI) player.angle += Math.PI * 2;

            if (controls.handbrake && Math.abs(player.speed) > 0.5) { // Inertial Dampener
                player.speed *= (1 - 0.65 * delta);
                if (Math.random() > 0.3) createSkidMarkEffect(); // More frequent trails when damping
            }

            player.fuelLevel = Math.max(0, player.fuelLevel);

            if (Math.abs(player.speed) > 0.01) {
                player.x += Math.sin(player.angle) * player.speed * delta;
                player.z += Math.cos(player.angle) * player.speed * delta;
            }
        }

        function updateWalkingPhysics(delta) {
            const player = gameState.player;
            const controls = gameState.controls;
            let moveX = 0; let moveZ = 0;
            const currentSpeed = player.pedSpeed;

            if (controls.up) moveZ += currentSpeed;
            if (controls.down) moveZ -= currentSpeed;
            if (controls.left) moveX -= currentSpeed;
            if (controls.right) moveX += currentSpeed;

            player.isMoving = (Math.abs(moveX) > 0.01 || Math.abs(moveZ) > 0.01);

            if (moveX !== 0 || moveZ !== 0) {
                 if (moveX !== 0 && moveZ !== 0) {
                    const factor = currentSpeed / Math.sqrt(moveX * moveX + moveZ * moveZ);
                    moveX *= factor; moveZ *= factor;
                 }
                 player.angle = Math.atan2(moveX, moveZ);
            }

            player.x += moveX * delta;
            player.z += moveZ * delta;

            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer >= player.animSpeed) {
                    player.animTimer = 0;
                    player.animFrame = (player.animFrame + 1) % 4; // Alien gait might have different frames
                }
            } else {
                player.animFrame = 0; player.animTimer = 0;
            }
        }

        function updateCharacterAnimation(entityLogic, entityMesh) {
            if (!entityMesh || !entityMesh.getObjectByName) return;

            const leftLeg = entityMesh.getObjectByName('leftLeg');
            const rightLeg = entityMesh.getObjectByName('rightLeg');
            // For anomalies, might have different limb names or more limbs
            const limb1 = entityMesh.getObjectByName('limb1');
            const limb2 = entityMesh.getObjectByName('limb2');
            const limb3 = entityMesh.getObjectByName('limb3');
            const limb4 = entityMesh.getObjectByName('limb4');


            if (leftLeg && rightLeg) { // Player-like animation
                const legYOffset = -entityLogic.pedHeight * 0.35;
                const stride = entityLogic.pedHeight * 0.18;

                if (!entityLogic.isMoving) {
                    leftLeg.position.z = 0; rightLeg.position.z = 0;
                    leftLeg.position.y = legYOffset; rightLeg.position.y = legYOffset;
                } else {
                    const frame = entityLogic.animFrame;
                    const sway = Math.sin(Date.now() * 0.01 * entityLogic.animSpeed) * stride * 0.3;
                    if (frame === 0 || frame === 2) {
                        leftLeg.position.z = sway;        rightLeg.position.z = -sway;
                        leftLeg.position.y = legYOffset; rightLeg.position.y = legYOffset;
                    } else if (frame === 1) {
                        leftLeg.position.z = stride;   rightLeg.position.z = -stride + sway;
                        leftLeg.position.y = legYOffset - stride * 0.2; rightLeg.position.y = legYOffset + stride * 0.1;
                    } else {
                        leftLeg.position.z = -stride + sway;  rightLeg.position.z = stride;
                        leftLeg.position.y = legYOffset + stride * 0.1; rightLeg.position.y = legYOffset - stride * 0.2;
                    }
                }
            } else if (limb1 && limb2 && limb3 && limb4) { // Anomaly animation (example)
                const baseRotSpeed = 0.05 * entityLogic.animSpeed * (entityLogic.isMoving ? 2 : 1);
                const time = Date.now() * 0.001;
                limb1.rotation.x = Math.sin(time * baseRotSpeed + 0) * 0.8;
                limb1.rotation.z = Math.cos(time * baseRotSpeed * 1.2 + 0.5) * 0.6;
                limb2.rotation.x = Math.sin(time * baseRotSpeed + Math.PI/2) * 0.8;
                limb2.rotation.z = Math.cos(time * baseRotSpeed * 1.2 + Math.PI/2 + 0.5) * 0.6;
                limb3.rotation.x = Math.sin(time * baseRotSpeed + Math.PI) * 0.8;
                limb3.rotation.z = Math.cos(time * baseRotSpeed * 1.2 + Math.PI + 0.5) * 0.6;
                limb4.rotation.x = Math.sin(time * baseRotSpeed + 3*Math.PI/2) * 0.8;
                limb4.rotation.z = Math.cos(time * baseRotSpeed * 1.2 + 3*Math.PI/2 + 0.5) * 0.6;

                const bodyCore = entityMesh.getObjectByName('bodyCore');
                if (bodyCore) {
                    bodyCore.rotation.y += 0.01 * (entityLogic.isMoving ? 2:1);
                    bodyCore.scale.setScalar(1 + Math.sin(time * baseRotSpeed * 0.5) * 0.05);
                }
            }
        }

        function spawnEnemy(x, z) { // Spawn Anomaly
            const enemyLogic = {
                x: x, z: z, y_height: ENEMY_HEIGHT / 2,
                health: ENEMY_HEALTH, maxHealth: ENEMY_HEALTH,
                width: ENEMY_WIDTH, height: ENEMY_HEIGHT, speed: ENEMY_SPEED, angle: 0,
                // colorVal: new THREE.Color().setHSL(0.3 + Math.random() * 0.1, 0.7, 0.4).getHex(), // Sickly green hues
                state: 'idle', aiTimer: Math.random() * 120, attackCooldown: ENEMY_ATTACK_COOLDOWN,
                isMoving: false, animTimer: 0, animFrame: 0, animSpeed: ANIM_SPEED * 0.8, // Anomalies animate differently
                mesh: createCharacterMesh(false), // Anomaly is type false
                boundingBox: new THREE.Box3(),
                healthBarMesh: createHealthBarMesh(true) // True for enemy health bar (red)
            };
            enemyLogic.mesh.position.set(x, ENEMY_HEIGHT / 2, z);
            scene.add(enemyLogic.mesh);

            enemyLogic.healthBarMesh.position.set(x, ENEMY_HEIGHT + 0.4, z);
            scene.add(enemyLogic.healthBarMesh);

            gameState.world.enemies.push(enemyLogic);
            threeObjects.enemies.push(enemyLogic.mesh);
        }

        function updateEnemies(delta) { // Update Anomalies
            for (let i = gameState.world.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.world.enemies[i];
                const oldX = enemy.x; const oldZ = enemy.z;

                const dxPlayer = gameState.player.x - enemy.x;
                const dzPlayer = gameState.player.z - enemy.z;
                const distSqPlayer = dxPlayer * dxPlayer + dzPlayer * dzPlayer;
                const distPlayer = Math.sqrt(distSqPlayer);

                let targetAngleRad = Math.atan2(dxPlayer, dzPlayer);
                enemy.isMoving = false;

                if (enemy.state === 'idle') {
                    enemy.aiTimer -= delta * 60;
                    if (distSqPlayer < ENEMY_CHASE_DIST * ENEMY_CHASE_DIST) {
                        enemy.state = 'chasing';
                    } else if (enemy.aiTimer <= 0) {
                        enemy.aiTimer = 120 + Math.random() * 120;
                    }
                } else if (enemy.state === 'chasing') {
                    if (distSqPlayer > (ENEMY_CHASE_DIST + 5) * (ENEMY_CHASE_DIST + 5)) {
                        enemy.state = 'idle'; enemy.aiTimer = 60;
                    } else {
                        enemy.angle = targetAngleRad; // Anomalies might not "face" traditionally but good for movement vector
                        if (distPlayer > ENEMY_ATTACK_DIST * 0.8) {
                            enemy.x += Math.sin(enemy.angle) * enemy.speed * delta;
                            enemy.z += Math.cos(enemy.angle) * enemy.speed * delta;
                            enemy.isMoving = true;
                        }

                        if (distPlayer < ENEMY_ATTACK_DIST && enemy.attackCooldown <= 0 && gameState.playerState === 'onFoot') {
                            gameState.player.health -= ENEMY_DAMAGE_MELEE;
                            enemy.attackCooldown = ENEMY_ATTACK_COOLDOWN / (delta * 60 || 1) ;
                             createHitSparksEffect(gameState.player.x, gameState.player.pedHeight/2, gameState.player.z, 0xff3333); // Player hit, red energy
                        }
                    }
                }
                // Anomalies might always "animate"
                enemy.animTimer++;
                if (enemy.animTimer >= enemy.animSpeed) {
                    enemy.animTimer = 0;
                    enemy.animFrame = (enemy.animFrame + 1) % 4; // Or use for different animation states
                }
                updateCharacterAnimation(enemy, enemy.mesh);

                if (enemy.attackCooldown > 0) enemy.attackCooldown -= delta * 60;

                const collisionResult = checkCollisions(oldX, oldZ, enemy, 'enemy');
                 if(collisionResult.collided){
                    enemy.x = collisionResult.newX;
                    enemy.z = collisionResult.newZ;
                    if (enemy.state === 'chasing') enemy.state = 'idle';
                 }

                enemy.mesh.position.set(enemy.x, enemy.height / 2, enemy.z);
                // enemy.mesh.rotation.y = enemy.angle; // Anomalies might not rotate this way, their body might "look" via internal animation
                enemy.boundingBox.setFromObject(enemy.mesh);

                enemy.healthBarMesh.position.set(enemy.x, enemy.height + 0.4, enemy.z);
                enemy.healthBarMesh.lookAt(camera.position);
                const healthScale = Math.max(0, enemy.health / enemy.maxHealth);
                enemy.healthBarMesh.children[1].scale.x = healthScale;
                enemy.healthBarMesh.children[1].position.x = - (1 - healthScale) * 0.5;


                if (enemy.health <= 0) {
                    createExplosionEffect(enemy.x, enemy.height / 2, enemy.z, 0x7700FF, 0.7); // Violet Anomaly death
                    scene.remove(enemy.mesh);
                    scene.remove(enemy.healthBarMesh);
                    gameState.world.enemies.splice(i, 1);
                    gameState.player.killedEnemiesCount++;
                }
            }
        }

        function updateProjectiles(delta) {
            for (let i = gameState.world.projectiles.length - 1; i >= 0; i--) {
                const p = gameState.world.projectiles[i];
                if (p.owner !== 'player') {
                    scene.remove(p.mesh);
                    gameState.world.projectiles.splice(i, 1);
                    const meshIdx = threeObjects.projectiles.indexOf(p.mesh);
                    if (meshIdx > -1) threeObjects.projectiles.splice(meshIdx,1);
                    continue;
                }

                p.x += p.vx * delta;
                p.y += p.vy * delta;
                p.z += p.vz * delta;
                p.timer += delta;

                p.mesh.position.set(p.x, p.y, p.z);
                // Bounding box for capsule needs to be calculated based on its orientation if precise.
                // For now, simple sphere-like BB.
                if(!p.mesh.userData.bbHelper) p.mesh.userData.bbHelper = new THREE.Box3().setFromObject(p.mesh);
                p.boundingBox.copy(p.mesh.userData.bbHelper).applyMatrix4(p.mesh.matrixWorld);


                let hit = false;
                let hitWall = false;

                for (let j = gameState.world.enemies.length - 1; j >= 0; j--) {
                    const enemy = gameState.world.enemies[j];
                    if (p.boundingBox.intersectsBox(enemy.boundingBox)) {
                        enemy.health -= p.damage;
                        hit = true;
                        createExplosionEffect(p.x, p.y, p.z, p.color, 0.5); // Anomaly hit splash
                        break;
                    }
                }

                if (!hit) {
                    const worldGeometry = [
                        ...gameState.world.buildings.map(b => b.boundingBox),
                        ...gameState.world.obstacles.map(o => o.boundingBox),
                        ...gameState.world.impassableZones.map(iz => iz.boundingBox)
                    ];
                    for (const objBox of worldGeometry) {
                        if (p.boundingBox.intersectsBox(objBox)) {
                            hit = true;
                            hitWall = true;
                            break;
                        }
                    }
                }

                if (p.x < 0 || p.x > gameState.world.width || p.z < 0 || p.z > gameState.world.height) {
                    hit = true;
                    hitWall = true;
                }

                if (p.timer >= p.lifespan || hit) {
                    if (hitWall) {
                        createHitSparksEffect(p.x, p.y, p.z, 0x00AAAA); // Wall hit, cyan energy discharge
                    }
                    scene.remove(p.mesh);
                    gameState.world.projectiles.splice(i, 1);
                    const meshIdx = threeObjects.projectiles.indexOf(p.mesh);
                    if (meshIdx > -1) threeObjects.projectiles.splice(meshIdx,1);
                }
            }
        }

        function checkCollisions(oldX, oldZ, entity, entityType) {
            const isDriving = entityType === 'driving';
            const entityBox = entity.boundingBox;
            let collisionOccurred = false;
            let finalX = entity.x;
            let finalZ = entity.z;

            const halfWidth = (entityBox.max.x - entityBox.min.x) / 2;
            const halfDepth = (entityBox.max.z - entityBox.min.z) / 2;

            if (entity.x - halfWidth < 0) { finalX = halfWidth; collisionOccurred = true;}
            if (entity.z - halfDepth < 0) { finalZ = halfDepth; collisionOccurred = true;}
            if (entity.x + halfWidth > gameState.world.width) { finalX = gameState.world.width - halfWidth; collisionOccurred = true;}
            if (entity.z + halfDepth > gameState.world.height) { finalZ = gameState.world.height - halfDepth; collisionOccurred = true;}

            if (collisionOccurred && isDriving) entity.speed *= -0.5; // Energy shield deflection
            else if (collisionOccurred && entityType === 'enemy') entity.state = 'idle';


            const objectsToTest = [
                ...gameState.world.buildings,
                ...gameState.world.obstacles,
                ...gameState.world.impassableZones
            ];
            const tempBox = entityBox.clone();

            for (const obj of objectsToTest) {
                 tempBox.min.x = entity.x - halfWidth; tempBox.max.x = entity.x + halfWidth;
                 tempBox.min.z = oldZ - halfDepth; tempBox.max.z = oldZ + halfDepth;

                if (tempBox.intersectsBox(obj.boundingBox)) {
                    collisionOccurred = true;
                    finalX = oldX;
                    if (isDriving) entity.speed *= -0.6;
                    else if (entityType === 'enemy') entity.state = 'idle';
                    tempBox.min.x = oldX - halfWidth; tempBox.max.x = oldX + halfWidth;
                }

                tempBox.min.x = finalX - halfWidth; tempBox.max.x = finalX + halfWidth;
                tempBox.min.z = entity.z - halfDepth; tempBox.max.z = entity.z + halfDepth;

                if (tempBox.intersectsBox(obj.boundingBox)) {
                    collisionOccurred = true;
                    finalZ = oldZ;
                    if (isDriving) entity.speed *= -0.6;
                    else if (entityType === 'enemy') entity.state = 'idle';
                }
                if (finalX === oldX && finalZ === oldZ && collisionOccurred) break;
            }
            return { collided: collisionOccurred, newX: finalX, newZ: finalZ };
        }

        function checkGasStations(delta) { // Check Energy Pylons
            if (gameState.playerState !== 'driving' || !gameState.controls.refuel) return;
            for (const station of gameState.world.gasStations) {
                const dx = gameState.player.x - (station.x + station.width / 2);
                const dz = gameState.player.z - (station.z + station.depth / 2);
                const distanceSq = dx * dx + dz * dz;
                const stationInteractionRadius = Math.max(station.width, station.depth) * 1.8; // Larger interaction field
                if (distanceSq < stationInteractionRadius * stationInteractionRadius) {
                    gameState.player.fuelLevel += 2.0 * delta * 60; // Faster recharge
                    if (gameState.player.fuelLevel > 100) gameState.player.fuelLevel = 100;
                    break;
                }
            }
        }

        function checkLocation() {
            let currentZone = null; let closestDistance = Infinity;
            for (const zone of gameState.zones) {
                const dx = gameState.player.x - zone.x;
                const dz = gameState.player.z - zone.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                if (distance < zone.radius && distance < closestDistance) {
                    closestDistance = distance; currentZone = zone;
                }
            }
            document.getElementById('location').textContent = `SECTOR: ${currentZone ? currentZone.name : 'UNCHARTED VOID'}`;
        }
        function checkGameOverCondition() { if (gameState.player.health <= 0 && !gameState.gameOver) { gameState.gameOver = true; stopEngineNoise(); } }

        function createSkidMarkEffect() { // Create Energy Trail
            if (gameState.playerState !== 'driving' || !gameState.player.mesh) return;
            const trailWidth = 0.3;
            const trailLength = 1.8 + Math.abs(gameState.player.speed * 0.06);
            const rearAxleOffset = -gameState.player.depth * 0.45;
            const emitterOffset = gameState.player.width * 0.35 * (Math.random() > 0.5 ? 1 : -1);

            const localTrailPos = new THREE.Vector3(emitterOffset, 0.02, rearAxleOffset); // Slightly above ground
            const worldTrailPos = localTrailPos.applyMatrix4(gameState.player.mesh.matrixWorld);

            const trailGeo = new THREE.PlaneGeometry(trailWidth, trailLength);
            const trailMat = new THREE.MeshBasicMaterial({
                color: 0x00FF88, // Glowing teal
                transparent: true,
                opacity: 0.5 + Math.random() * 0.3,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending // Make it glow
            });
            const trailMesh = new THREE.Mesh(trailGeo, trailMat);
            trailMesh.position.copy(worldTrailPos);
            trailMesh.rotation.x = -Math.PI / 2;
            trailMesh.rotation.z = gameState.player.angle + Math.PI/2;

            scene.add(trailMesh);
            gameState.fx.skidMarks.push({ mesh: trailMesh, life: 120 + Math.random() * 80, initialOpacity: trailMat.opacity });

            if (gameState.fx.skidMarks.length > 40) {
                const oldest = gameState.fx.skidMarks.shift();
                scene.remove(oldest.mesh);
                oldest.mesh.geometry.dispose();
                oldest.mesh.material.dispose();
            }
        }

        function createDustParticleEffect(isDrivingEffect = true) { // Create Xeno Spores
            if (!gameState.player.mesh) return;
            const particleCount = isDrivingEffect ? 6 : 3;
            const basePos = new THREE.Vector3();
            gameState.player.mesh.getWorldPosition(basePos);

            if (isDrivingEffect) {
                const backwardOffset = new THREE.Vector3(0,0, -gameState.player.depth * 0.5).applyQuaternion(gameState.player.mesh.quaternion);
                basePos.add(backwardOffset);
            }
            basePos.y = 0.3;

            for (let i = 0; i < particleCount; i++) {
                gameState.fx.dustParticlesData.push({
                    position: new THREE.Vector3(
                        basePos.x + (Math.random() - 0.5) * (isDrivingEffect ? 1.8 : 0.6),
                        basePos.y + (Math.random() - 0.5) * 0.4,
                        basePos.z + (Math.random() - 0.5) * (isDrivingEffect ? 1.8 : 0.6)
                    ),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * (isDrivingEffect ? 0.4 : 0.15),
                        Math.random() * 0.6 + 0.15, // More floaty
                        (Math.random() - 0.5) * (isDrivingEffect ? 0.4 : 0.15)
                    ),
                    alpha: 0.6 + Math.random() * 0.3,
                    life: 25 + Math.random() * 25,
                    size: isDrivingEffect ? 0.25 + Math.random() * 0.6 : 0.15 + Math.random() * 0.3,
                    color: Math.random() > 0.5 ? new THREE.Color(0xAA44FF) : new THREE.Color(0x44FFAA) // Purple or Cyan spores
                });
            }
            if (gameState.fx.dustParticlesData.length > 180) {
                gameState.fx.dustParticlesData.splice(0, gameState.fx.dustParticlesData.length - 180);
            }
            updateDustParticlesMesh();
        }

        function createExplosionEffect(x, y, z, color = 0x7700FF, scale = 1.0) { // Alien Explosion
             const particleCount = 20 + Math.floor(Math.random() * 12);
             const explosionData = { particles: [], life: 35 + Math.random() * 35, initialLife: 0 };
             explosionData.initialLife = explosionData.life;

             for (let i = 0; i < particleCount; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const elevation = (Math.random() - 0.5) * Math.PI;
                 const speed = (0.6 + Math.random() * 2.5) * scale;
                 explosionData.particles.push({
                     position: new THREE.Vector3(x, y, z),
                     velocity: new THREE.Vector3(
                         Math.cos(angle) * Math.cos(elevation) * speed,
                         Math.sin(elevation) * speed * (1 + Math.random()*0.5), // More vertical spread
                         Math.sin(angle) * Math.cos(elevation) * speed
                     ),
                     alpha: 0.8 + Math.random() * 0.2,
                     size: (0.15 + Math.random() * 0.4) * scale,
                     color: new THREE.Color(color).offsetHSL(0, Math.random()*0.2 - 0.1, Math.random()*0.2 - 0.1) // Slight color variation
                 });
             }
             gameState.fx.explosionsData.push(explosionData);
             if (gameState.fx.explosionsData.length > 15) {
                 gameState.fx.explosionsData.shift();
             }
             updateExplosionParticlesMesh();
        }

        function createMuzzleFlashEffect(x, y, z, color = 0xBBFFFF) { // Emitter Flash
            const flash = {
                position: new THREE.Vector3(x, y, z),
                size: 0.9 + Math.random() * 0.6,
                alpha: 1.0,
                life: 2.5, // Slightly longer for energy effect
                color: new THREE.Color(color)
            };
            gameState.fx.muzzleFlashesData.push(flash);
            if (gameState.fx.muzzleFlashesData.length > 8) {
                gameState.fx.muzzleFlashesData.shift();
            }
            updateMuzzleFlashMesh();
        }

        function createHitSparksEffect(x, y, z, color = 0x00CC00) { // Ichor Splatter / Energy Discharge
            const particleCount = 6 + Math.floor(Math.random() * 6);
             for (let i = 0; i < particleCount; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const elevation = (Math.random() - 0.5) * Math.PI * 0.8; // Less vertical than explosion
                 const speed = 0.7 + Math.random() * 1.2;
                 gameState.fx.hitSparksData.push({
                     position: new THREE.Vector3(x, y, z),
                     velocity: new THREE.Vector3(
                         Math.cos(angle) * Math.cos(elevation) * speed,
                         Math.sin(elevation) * speed + (Math.random()*0.3), // Slight upward pop
                         Math.sin(angle) * Math.cos(elevation) * speed
                     ),
                     alpha: 1.0,
                     life: 12 + Math.random() * 12,
                     size: 0.08 + Math.random() * 0.12,
                     color: new THREE.Color(color)
                 });
             }
             if (gameState.fx.hitSparksData.length > 80) {
                 gameState.fx.hitSparksData.splice(0, gameState.fx.hitSparksData.length - 80);
             }
             updateHitSparksMesh();
        }

        function updateParticlesAndEffects3D(delta) {
            const deltaFrames = delta * 60;

            for (let i = gameState.fx.skidMarks.length - 1; i >= 0; i--) { // Energy Trails
                const trail = gameState.fx.skidMarks[i];
                trail.life -= deltaFrames;
                trail.mesh.material.opacity = trail.initialOpacity * (trail.life / (120 + 70));
                if (trail.life <= 0 || trail.mesh.material.opacity <= 0.01) {
                    scene.remove(trail.mesh);
                    trail.mesh.geometry.dispose();
                    trail.mesh.material.dispose();
                    gameState.fx.skidMarks.splice(i, 1);
                }
            }
            updateDustParticlesMesh(delta);
            updateExplosionParticlesMesh(delta);
            updateMuzzleFlashMesh(delta);
            updateHitSparksMesh(delta);
        }

        function updatePointSystem(pointsDataArray, pointsMeshName, delta, defaultSize = 0.1, dragFactor = 0.98, gravityFactor = 0.0, additiveBlending = false) {
            const positions = [];
            const colors = [];
            const sizes = [];

            for (let i = pointsDataArray.length - 1; i >= 0; i--) {
                const p = pointsDataArray[i];
                p.position.addScaledVector(p.velocity, delta);
                p.velocity.multiplyScalar(Math.pow(dragFactor, delta*60));
                if(gravityFactor !== 0) p.velocity.y -= gravityFactor * delta;

                p.life -= delta * 60;
                p.alpha -= (1 / (p.initialLife || 20)) * delta * 60; // Fade relative to initial life or a default

                if (p.life <= 0 || p.alpha <= 0) {
                    pointsDataArray.splice(i, 1);
                } else {
                    positions.push(p.position.x, p.position.y, p.position.z);
                    colors.push(p.color.r, p.color.g, p.color.b);
                    sizes.push(p.size * Math.max(0, p.alpha));
                }
            }

            let mesh = threeObjects[pointsMeshName];
            if (!mesh && positions.length > 0) {
                const geometry = new THREE.BufferGeometry();
                const material = new THREE.PointsMaterial({
                    size: defaultSize, // This is a fallback if 'size' attribute isn't used by shader
                    vertexColors: true,
                    transparent: true,
                    opacity: 1,
                    sizeAttenuation: true,
                    map: createCircleTexture(),
                    depthWrite: !additiveBlending, // If additive, often don't write to depth
                    blending: additiveBlending ? THREE.AdditiveBlending : THREE.NormalBlending
                });
                mesh = new THREE.Points(geometry, material);
                // Custom shader needed for per-particle size with PointsMaterial or use THREE.Sprite for each
                // For now, this setup will work but all points of *this* system will be `defaultSize` unless a custom shader reads 'size' attribute
                // Hack: we can use the `size` attribute to scale the geometry if we manage particles as individual meshes/sprites, not ideal for many.
                // For Points, rely on sizeAttenuation and the global material.size. The 'size' attribute is mostly for custom shaders.
                // However, passing it won't break; it just might not be used by default PointsMaterial for per-particle sizing.
                threeObjects[pointsMeshName] = mesh;
                scene.add(mesh);
            }

            if (mesh) {
                if (positions.length === 0) {
                    mesh.visible = false;
                } else {
                    mesh.visible = true;
                    mesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    mesh.geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    mesh.geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1)); // For custom shader or if PointsMaterial uses it in future
                    mesh.geometry.attributes.position.needsUpdate = true;
                    mesh.geometry.attributes.color.needsUpdate = true;
                    mesh.geometry.attributes.size.needsUpdate = true;
                }
            }
        }
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            context.beginPath();
            context.arc(32, 32, 30, 0, 2 * Math.PI);

            if (weaponType === 'pulse_emitter') {
                oscillator.type = 'triangle'; // Softer, more sci-fi pulse
                oscillator.frequency.setValueAtTime(660, audioContext.currentTime); // Higher pitch
                oscillator.frequency.exponentialRampToValueAtTime(330, audioContext.currentTime + 0.08);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);
            } else if (weaponType === 'shard_disruptor') {
                 oscillator.type = 'sawtooth'; // Harsher, more disruptive
                 oscillator.frequency.setValueAtTime(550, audioContext.currentTime);

                 gainNode.gain.setValueAtTime(0.06, audioContext.currentTime);
                 gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.06);

        function startEngineNoise() { // Drifter Hum
             if (!engineNoiseOscillator) {

                 harmonicGain.gain.setValueAtTime(0.005, audioContext.currentTime); // Very subtle

                 engineNoiseGain.gain.setValueAtTime(0.04, audioContext.currentTime);
                 engineNoiseOscillator.connect(engineNoiseGain);
                 harmonicOsc.connect(harmonicGain);
                 harmonicGain.connect(engineNoiseGain); // Mix harmonic into main gain

                 engineNoiseGain.connect(audioContext.destination);
                 engineNoiseOscillator.start();

             }

        function updateEngineNoise() { // Drifter Hum Update
             if (engineNoiseOscillator && gameState.playerState === 'driving') {
                 const speedFactor = Math.abs(gameState.player.speed) / gameState.player.maxSpeed;
                 const baseFreq = 60;
                 const frequency = baseFreq + speedFactor * 120; // More pitch variation
                 const volume = 0.03 + speedFactor * 0.08; // Wider volume range
                 engineNoiseOscillator.frequency.linearRampToValueAtTime(frequency, audioContext.currentTime + 0.1);
                 if(engineNoiseOscillator.userData && engineNoiseOscillator.userData.harmonic) {
                     engineNoiseOscillator.userData.harmonic.frequency.linearRampToValueAtTime(frequency * 3, audioContext.currentTime + 0.1);
                     engineNoiseOscillator.userData.harmonicGain.gain.linearRampToValueAtTime(0.005 + speedFactor * 0.01, audioContext.currentTime + 0.1);
                 }
                 engineNoiseGain.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.1);
             }

        function stopEngineNoise() {

            if (!gameState.player.mesh) return;
            const playerPosition = new THREE.Vector3();
            gameState.player.mesh.getWorldPosition(playerPosition);

            let offset;
            let lookAtTarget = playerPosition.clone();

            if (gameState.playerState === 'driving') {
                offset = new THREE.Vector3(0, 9, -14); // Slightly higher/further for alien drifters
            } else {
                offset = new THREE.Vector3(0, 7, -8);
            }

            const rotatedOffset = offset.clone().applyQuaternion(gameState.player.mesh.quaternion);
            const desiredCameraPosition = playerPosition.clone().add(rotatedOffset);
            camera.position.lerp(desiredCameraPosition, 0.08); // Smoother lerp

            const forwardLookOffset = new THREE.Vector3(0, 1.2, gameState.playerState === 'driving' ? 3.5 : 1.5);
            const rotatedLookOffset = forwardLookOffset.applyQuaternion(gameState.player.mesh.quaternion);
            const desiredLookAt = playerPosition.clone().add(rotatedLookOffset);

            // Create a persistent vector for camera target to lerp towards
            if (!camera.userData.lookAtLerpTarget) camera.userData.lookAtLerpTarget = desiredLookAt.clone();
            camera.userData.lookAtLerpTarget.lerp(desiredLookAt, 0.08);
            camera.lookAt(camera.userData.lookAtLerpTarget);

            if (camera.position.y < 0.6) camera.position.y = 0.6;
        }

        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = `#${gameState.world.roadColor.toString(16).padStart(6,'0')}`;
            ctx.fillRect(0, 0, size, size);

            // Solid glowing line
            ctx.strokeStyle = `#${gameState.world.lineColor.toString(16).padStart(6,'0')}`;
            ctx.lineWidth = gameState.world.lineWidth * (size / gameState.world.roadWidth) * 4; // Thicker glowing line
            ctx.shadowColor = `#${gameState.world.lineColor.toString(16).padStart(6,'0')}`;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(size / 2, 0);
            ctx.lineTo(size / 2, size);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.needsUpdate = true;
            return texture;
        }
