<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Drift</title>
    <style>
        /* ... (Keep all CSS styles exactly the same as the previous version) ... */
        body { margin: 0; padding: 0; background-color: #000510; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: -webkit-fill-available; }
        canvas#gameCanvas { border: 1px solid #447; box-shadow: 0 0 15px #447; background-color: #000510; display: block; touch-action: none; max-width: 100%; max-height: calc(100vh - 50px); object-fit: contain; }
        .ui-container { width: 90%; max-width: 600px; display: flex; justify-content: space-between; margin-top: 5px; font-size: 14px; color: #9cf; text-shadow: 0 0 3px #05a; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 5, 16, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; opacity: 0; transition: opacity 0.4s ease-out; pointer-events: none; padding: 15px; box-sizing: border-box; text-align: center; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .overlay h1 { color: #9cf; font-size: 28px; margin-bottom: 15px; text-shadow: 0 0 8px #5af; }
        .overlay p { color: #ccc; line-height: 1.5; font-size: 15px; max-width: 450px; margin-bottom: 20px; }
        .overlay button { background-color: #28a; color: #fff; border: 1px solid #5cf; padding: 10px 25px; font-family: 'Segoe UI', Tahoma; font-size: 16px; margin-top: 15px; cursor: pointer; border-radius: 4px; transition: background-color 0.2s; }
        .overlay button:hover { background-color: #3af; }
        #score, #energy, #wave { min-width: 100px; text-align: left; }
        #energy { text-align: right; }
        #mobile-controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 130px; z-index: 5; pointer-events: none; display: none; user-select: none; -webkit-user-select: none; }
        #joystick-area { position: absolute; left: 15px; bottom: 15px; width: 100px; height: 100px; background-color: rgba(68, 68, 119, 0.15); border-radius: 50%; border: 1px solid rgba(100, 100, 150, 0.4); pointer-events: auto; }
        #joystick-thumb { position: absolute; left: 50%; top: 50%; width: 35px; height: 35px; background-color: rgba(100, 100, 180, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; border: 1px solid rgba(150, 150, 220, 0.6); }
        #action-button { position: absolute; right: 25px; bottom: 25px; width: 65px; height: 65px; background-color: rgba(68, 100, 119, 0.25); border-radius: 50%; border: 1px solid rgba(80, 150, 180, 0.5); pointer-events: auto; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #adf; text-align: center; padding: 5px; box-sizing: border-box; line-height: 1.1; }
        #action-button:active { background-color: rgba(80, 150, 180, 0.5); transform: scale(0.95); }
        .star { position: absolute; background-color: white; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div class="ui-container">
        <div id="score">Score: 0</div>
        <div id="wave">Wave: 1</div>
        <div id="energy">Shield: 100</div>
    </div>

    <div id="start-screen" class="overlay active"> /* ... content ... */ <h1>AETHER DRIFT</h1><p>...</p><button id="start-button">START DRIFTING</button> </div>
    <div id="game-over" class="overlay"> /* ... content ... */ <h1>SYSTEM OFFLINE</h1><p id="final-score">Final Score: 0</p><button id="restart-button">RESTART</button> </div>
    <div id="mobile-controls"> /* ... content ... */ <div id="joystick-area"><div id="joystick-thumb"></div></div> <div id="action-button">SHIELD</div> </div>

    <script>
        // ============= Game Setup =============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const C_WIDTH = canvas.width;
        const C_HEIGHT = canvas.height;

        // Game Constants
        const PLAYER_SIZE = 15; const PLAYER_SPEED = 3.5; const FRAGMENT_SIZE = 6; const FRAGMENT_SCORE = 10;
        const ASTEROID_SIZE_MIN = 10; const ASTEROID_SIZE_MAX = 30; const ASTEROID_SPEED_MIN = 0.5; const ASTEROID_SPEED_MAX = 1.5;
        const SHIELD_COST = 30; const SHIELD_DURATION = 2500; const MAX_ENERGY = 100; const STAR_COUNT = 100;

        // --- Define createInitialState FIRST ---
        const createInitialState = () => ({
            player: null, fragments: [], asteroids: [], stars: [], score: 0, energy: MAX_ENERGY, wave: 1,
            shieldActive: false, shieldTimer: 0, gameOver: false, gameStarted: false, // Start inactive
            keysPressed: new Set(), touchMoveX: 0, touchMoveY: 0, touchActionActive: false, touchActionDown: false, spaceHandled: false,
            lastSpawnTime: 0, spawnInterval: 3000
        });

        // Initialize gameState variable AFTER function definition
        let gameState = createInitialState();

        // ============= Mobile Control State & Setup =============
        // Define variables BEFORE setup function
        const mobileControlsDiv = document.getElementById('mobile-controls');
        const joystickArea = document.getElementById('joystick-area');
        const joystickThumb = document.getElementById('joystick-thumb');
        const actionButton = document.getElementById('action-button');
        let joystickActive = false; let joystickStartX = 0; let joystickStartY = 0; let joystickRadius = 0;

        function setupMobileControls() { /* ... same setupMobileControls function ... */ }
        function handleJoystickStart(event) { /* ... same handler ... */ }
        function handleJoystickMove(event) { /* ... same handler ... */ }
        function handleJoystickEnd(event) { /* ... same handler ... */ }
        function handleActionStart(event) { /* ... same handler ... */ }
        function handleActionEnd(event) { /* ... same handler ... */ }


        // ============= Game Entities =============
        function createPlayer() { return { x: C_WIDTH / 2, y: C_HEIGHT - 50, w: PLAYER_SIZE * 2, h: PLAYER_SIZE * 2, speed: PLAYER_SPEED, trail: [] }; }
        function createFragment() { return { x: Math.random() * C_WIDTH, y: -FRAGMENT_SIZE, w: FRAGMENT_SIZE * 2, h: FRAGMENT_SIZE * 2, speed: 1 + Math.random() * 1.5, color: `hsl(${100 + Math.random()*40}, 100%, 70%)`}; }
        function createAsteroid() { const size = ASTEROID_SIZE_MIN + Math.random() * (ASTEROID_SIZE_MAX - ASTEROID_SIZE_MIN); return { x: Math.random() * C_WIDTH, y: -size, w: size, h: size, speed: ASTEROID_SPEED_MIN + Math.random() * (ASTEROID_SPEED_MAX - ASTEROID_SPEED_MIN), angle: Math.random() * Math.PI * 2, rotation: Math.random() * 0.02 - 0.01 }; }
        function createStar() { return { x: Math.random() * C_WIDTH, y: Math.random() * C_HEIGHT, size: 1 + Math.random() * 1.5, speed: 0.1 + Math.random() * 0.3 }; }

        // ============= Utility Functions =============
        function isColliding(rect1, rect2) { if (!rect1 || !rect2) return false; return rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x && rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y; }
        function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

        // ============= Game Logic Update =============
        function update(dt) { // Renamed from original `update` to avoid conflict if globally scoped
            if (!gameState.gameStarted || gameState.gameOver || !gameState.player) return; // Check player exists
            const now = performance.now();
            // --- Input Processing ---
            let moveX = gameState.touchMoveX; let moveY = gameState.touchMoveY; let actionTriggered = gameState.touchActionDown && !gameState.touchActionActive; gameState.touchActionActive = gameState.touchActionDown;
            if (moveX === 0 && moveY === 0) { if (gameState.keysPressed.has('arrowleft') || gameState.keysPressed.has('a')) moveX = -1; else if (gameState.keysPressed.has('arrowright') || gameState.keysPressed.has('d')) moveX = 1; if (gameState.keysPressed.has('arrowup') || gameState.keysPressed.has('w')) moveY = -1; else if (gameState.keysPressed.has('arrowdown') || gameState.keysPressed.has('s')) moveY = 1; }
            if (gameState.keysPressed.has(' ') && !gameState.spaceHandled) { actionTriggered = true; gameState.spaceHandled = true; }
            // --- Player Movement ---
            gameState.player.x += moveX * gameState.player.speed; gameState.player.y += moveY * gameState.player.speed; gameState.player.x = clamp(gameState.player.x, 0, C_WIDTH - gameState.player.w); gameState.player.y = clamp(gameState.player.y, 0, C_HEIGHT - gameState.player.h);
             gameState.player.trail.push({x: gameState.player.x + gameState.player.w / 2, y: gameState.player.y + gameState.player.h / 2}); if (gameState.player.trail.length > 15) gameState.player.trail.shift();
            // --- Shield Logic ---
            if (actionTriggered && gameState.energy >= SHIELD_COST && !gameState.shieldActive) { gameState.shieldActive = true; gameState.energy -= SHIELD_COST; gameState.shieldTimer = now + SHIELD_DURATION; } if (gameState.shieldActive && now > gameState.shieldTimer) { gameState.shieldActive = false; }
            // --- Update Fragments ---
            for (let i = gameState.fragments.length - 1; i >= 0; i--) { const frag = gameState.fragments[i]; frag.y += frag.speed; if (isColliding(gameState.player, frag)) { gameState.score += FRAGMENT_SCORE; gameState.energy = Math.min(MAX_ENERGY, gameState.energy + FRAGMENT_SCORE / 2); gameState.fragments.splice(i, 1); } else if (frag.y > C_HEIGHT) { gameState.fragments.splice(i, 1); } }
            // --- Update Asteroids ---
            for (let i = gameState.asteroids.length - 1; i >= 0; i--) { const ast = gameState.asteroids[i]; ast.y += ast.speed; ast.angle += ast.rotation; if (isColliding(gameState.player, ast)) { if (!gameState.shieldActive) { gameState.gameOver = true; console.log("Game Over!"); } else { gameState.asteroids.splice(i, 1); } } else if (ast.y > C_HEIGHT + ast.h) { gameState.asteroids.splice(i, 1); } }
            // --- Spawning ---
            if (now - gameState.lastSpawnTime > gameState.spawnInterval) { gameState.lastSpawnTime = now; if (Math.random() < 0.8) gameState.fragments.push(createFragment()); if (Math.random() < 0.3 + gameState.wave * 0.05) gameState.asteroids.push(createAsteroid()); if (gameState.score > gameState.wave * 500) { gameState.wave++; gameState.spawnInterval = Math.max(500, 3000 - gameState.wave * 150); ASTEROID_SPEED_MAX += 0.1; console.log(`Wave ${gameState.wave}!`); } }
             // --- Update Stars ---
             gameState.stars.forEach(star => { star.y += star.speed; if (star.y > C_HEIGHT) { star.y = -star.size; star.x = Math.random() * C_WIDTH; } });
        }

        // ============= Rendering =============
        function render() { // Renamed from original `render` to avoid conflict
            ctx.fillStyle = '#000510'; ctx.fillRect(0, 0, C_WIDTH, C_HEIGHT); // Clear
            // Draw Stars
             ctx.fillStyle = '#ffffff'; gameState.stars.forEach(star => { const alpha = (star.y / C_HEIGHT) * 0.7 + 0.1; ctx.globalAlpha = alpha; ctx.fillRect(star.x - star.size / 2, star.y - star.size / 2, star.size, star.size); }); ctx.globalAlpha = 1.0;
            // Draw Player Trail
            if (gameState.player?.trail.length > 1) { ctx.strokeStyle = 'rgba(100, 180, 255, 0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gameState.player.trail[0].x, gameState.player.trail[0].y); for(let i = 1; i < gameState.player.trail.length; i++){ ctx.lineTo(gameState.player.trail[i].x, gameState.player.trail[i].y); } ctx.stroke(); }
            // Draw Player Ship
            if (gameState.player) { ctx.save(); ctx.translate(gameState.player.x + gameState.player.w / 2, gameState.player.y + gameState.player.h / 2); ctx.beginPath(); ctx.moveTo(0, -gameState.player.h / 2); ctx.lineTo(-gameState.player.w / 2, gameState.player.h / 2); ctx.lineTo(gameState.player.w / 2, gameState.player.h / 2); ctx.closePath(); ctx.fillStyle = '#9cf'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); if (gameState.shieldActive) { const shieldRadius = Math.max(gameState.player.w, gameState.player.h) * 0.8; const shieldPulse = Math.abs(Math.sin(performance.now() * 0.005)) * 0.3 + 0.6; ctx.beginPath(); ctx.arc(0, 0, shieldRadius, 0, Math.PI * 2); ctx.strokeStyle = `rgba(100, 220, 255, ${shieldPulse})`; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = `rgba(50, 150, 255, ${shieldPulse * 0.2})`; ctx.fill(); } ctx.restore(); }
            // Draw Fragments
            gameState.fragments.forEach(frag => { ctx.fillStyle = frag.color; ctx.beginPath(); ctx.arc(frag.x + frag.w / 2, frag.y + frag.h / 2, frag.w / 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = `rgba(255, 255, 150, 0.3)`; ctx.beginPath(); ctx.arc(frag.x + frag.w / 2, frag.y + frag.h / 2, frag.w, 0, Math.PI * 2); ctx.fill(); });
            // Draw Asteroids
            gameState.asteroids.forEach(ast => { ctx.save(); ctx.translate(ast.x + ast.w / 2, ast.y + ast.h / 2); ctx.rotate(ast.angle); ctx.fillStyle = '#886'; ctx.fillRect(-ast.w / 2, -ast.h / 2, ast.w, ast.h); ctx.strokeStyle = '#554'; ctx.lineWidth = 1; ctx.strokeRect(-ast.w / 2, -ast.h / 2, ast.w, ast.h); ctx.restore(); });
            // Draw UI Text
            document.getElementById('score').textContent = `Score: ${gameState.score}`; document.getElementById('energy').textContent = `Shield: ${Math.floor(gameState.energy)}`; document.getElementById('wave').textContent = `Wave: ${gameState.wave}`;
            // Handle Game Over Display
             if (gameState.gameOver) { document.getElementById('final-score').textContent = `Final Score: ${gameState.score}`; document.getElementById('game-over').classList.add('active'); }
             // Add win condition display here if needed
        }

        // ============= Game Loop =============
        let animationFrameId = null;
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
             // Calculate deltaTime robustly
            if (!lastTimestamp) lastTimestamp = timestamp; // Initialize on first frame
            const deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (!gameState.gameStarted || gameState.gameOver) { // Check if we should stop
                console.log(`Game loop stopping. Started: ${gameState.gameStarted}, Over: ${gameState.gameOver}`);
                animationFrameId = null;
                if(gameState.gameOver) { // Ensure game over screen shows if loop stops
                     document.getElementById('final-score').textContent = `Final Score: ${gameState.score}`;
                     document.getElementById('game-over').classList.add('active');
                }
                return;
            }

            update(deltaTime); // Update game state
            render(); // Render the current state

            animationFrameId = requestAnimationFrame(gameLoop); // Continue loop
        }

        // ============= Initialization =============
        function initGame(level = 1) { // Renamed from original `initGame`
            console.log(`Initializing Level ${level}`);
            gameState = createInitialState(); // Get a fresh state object
            gameState.level = level; // Set the level
            // gameState.gameStarted is still false here

            // Create initial entities for the level
            gameState.player = createPlayer();
            gameState.stars = Array.from({ length: STAR_COUNT }, createStar);
            for(let i=0; i<5; i++) gameState.fragments.push(createFragment());

            // Setup/Show mobile controls if needed for this session
            setupMobileControls();

            // Hide all overlays initially, then show start screen
            document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
            document.getElementById('start-screen').classList.add('active');

            // Reset loop ID
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            lastTimestamp = 0; // Reset timer for next loop start
            console.log("initGame finished. Ready for Start button.");
        }

        // ============= Event Listeners =============
        // Keyboard
        window.addEventListener('keydown', (e) => { if(gameState.gameStarted) gameState.keysPressed.add(e.key.toLowerCase()); });
        window.addEventListener('keyup', (e) => { if(gameState.gameStarted) { gameState.keysPressed.delete(e.key.toLowerCase()); if (e.key === ' ') gameState.spaceHandled = false; }});

        // UI Buttons
        document.getElementById('start-button').addEventListener('click', () => {
             // Don't re-init here, initGame already ran or will run on restart
             if (!gameState.gameStarted) {
                 console.log("Start button clicked");
                 gameState.gameStarted = true; // Set game to started
                 gameState.gameOver = false; // Ensure not game over
                 document.getElementById('start-screen').classList.remove('active'); // Hide start screen

                 if (!animationFrameId) { // Start game loop if not already running
                     lastTimestamp = performance.now(); // Reset timer for this run
                     animationFrameId = requestAnimationFrame(gameLoop);
                     console.log("Game Loop Started from Start Button.");
                 }
             }
        });
        document.getElementById('restart-button').addEventListener('click', () => {
             console.log("Restart button clicked");
             document.getElementById('game-over').classList.remove('active');
             initGame(gameState.level); // Re-initialize current level (shows start screen)
        });
        // Remove Next Level / Continue buttons for now to simplify
        // document.getElementById('next-level').addEventListener('click', () => { /* ... */ });
        // document.getElementById('continue-button').addEventListener('click', () => { /* ... */ });

        // --- Initial Call on Page Load ---
        // Call initGame ONCE when the script loads to set up the initial state
        // and show the start screen.
        document.addEventListener('DOMContentLoaded', initGame); // Use DOMContentLoaded

    </script>
</body>
</html>
