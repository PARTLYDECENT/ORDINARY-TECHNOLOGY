<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 1-Style Action Sim V2</title>
    <style>
        /* CSS remains largely the same */
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; /* Adjusted in JS */ }
        #gameCanvas { border: 2px solid #444; background-color: #000; display: block; image-rendering: pixelated; cursor: crosshair; }
        #hud { position: absolute; color: #fff; padding: 8px; font-size: 13px; text-align: left; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.7); border-radius: 5px; border: 1px solid #444; z-index: 10; }
        #hud div { margin-bottom: 4px; }
        #fuel-bar { width: 90px; height: 8px; background-color: #333; margin: 3px 0; border: 1px solid #555; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #fuel-level { height: 100%; background-color: #3f3; width: 100%; transition: width 0.5s ease-out; }
        #health-bar { width: 90px; height: 8px; background-color: #500; margin: 3px 0; border: 1px solid #722; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #health-level { height: 100%; background-color: #f33; width: 100%; transition: width 0.2s linear; }
        #location { margin-top: 4px; }
        #mini-map { position: absolute; top: 10px; right: 10px; width: 120px; height: 120px; background-color: rgba(0, 0, 0, 0.75); border: 1px solid #444; border-radius: 5px; z-index: 10; overflow: hidden; }
        #mini-map canvas { display: block; }
        #controls-display { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #bbb; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #444; z-index: 10; white-space: nowrap; }
        /* Placeholders - Hidden */
        #mission-text { display: none; }
        #stats { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud">
             <div id="health-line">HP: <div id="health-bar"><div id="health-level"></div></div></div>
             <div id="speed-line">SPD: <span id="speed">0</span></div>
             <div id="fuel-line">FUEL: <div id="fuel-bar"><div id="fuel-level"></div></div></div>
             <div id="location">LOCATION: UNKNOWN</div>
             <div id="enemy-count">ENEMIES: <span id="enemies-left">0</span></div>
         </div>
         <div id="mini-map"></div>
         <div id="controls-display">
             WASD/Arrows: Move | E: Enter/Exit | F: Refuel | SPACE: Handbrake | SHIFT: Fire
         </div>
        <div id="mission-text"></div>
        <div id="stats"></div>
    </div>

    <script>
        // --- Canvas and Context ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniMapContainer = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMapContainer.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120; miniMapCtx.canvas.height = 120;

        // --- Game State ---
        const gameState = {
            playerState: 'driving',
            player: {
                x: 1500, y: 1500, width: 20, height: 36, speed: 0, maxSpeed: 5,
                acceleration: 0.1, deceleration: 0.05, handling: 3.5, angle: 0,
                fuelLevel: 100, fuelConsumption: 0.02, color: '#0066cc',
                health: 100, maxHealth: 100,
                // --- Reduced Ped Size ---
                pedWidth: 6, // Halved
                pedHeight: 9, // Halved
                pedSpeed: 1.5,
                isWalking: false, walkAnimTimer: 0, walkAnimFrame: 0, walkAnimSpeed: 8,
                fireCooldown: 0, fireRate: 12, // Slightly faster fire rate
                bulletSpread: 3 // Angle deviation in degrees
            },
            camera: { x: 0, y: 0, width: canvas.width, height: canvas.height },
            controls: { /* ... as before ... */
                up: false, down: false, left: false, right: false,
                handbrake: false, refuel: false, fire: false,
                enterExit: false, enterExitProcessed: false
             },
            world: {
                width: 3000, height: 3000, roadWidth: 60, grassColor: '#1a3d0c',
                roadColor: '#333', lineColor: '#fff', lineWidth: 2,
                trees: [], buildings: [], obstacles: [], gasStations: [],
                vehicles: [], enemies: [], projectiles: [],
                // --- Added Impassable Zones ---
                impassableZones: [
                    // Example: A lake area
                    { type: 'water', x: 2200, y: 2200, width: 500, height: 600, color: 'rgba(50, 80, 150, 0.6)' },
                    // Example: Restricted military base area
                    { type: 'restricted', x: 100, y: 100, width: 400, height: 500, color: 'rgba(100, 100, 100, 0.4)' }
                ],
                startTime: Date.now()
            },
            // --- Added new FX ---
            fx: { skidMarks: [], dustParticles: [], explosions: [], muzzleFlashes: [], hitSparks: [] },
            zones: [ /* ... as before ... */
                {name: "DOWNTOWN", x: 1000, y: 1000, radius: 600}, {name: "FOREST HILLS", x: 600, y: 2200, radius: 500},
                {name: "EASTERN PLAINS", x: 2200, y: 1800, radius: 400}, {name: "INDUSTRIAL PARK", x: 2000, y: 500, radius: 350}
             ],
            gameOver: false
        };

        // --- Constants ---
        const PROJECTILE_SPEED = 8; // Slightly faster
        const PROJECTILE_LIFESPAN = 60; // Slightly shorter life
        const PROJECTILE_DAMAGE = 18; // Slightly more damage
        const ENEMY_HEALTH = 45; // Slightly less health
        // --- Reduced Enemy Size ---
        const ENEMY_WIDTH = 7; // Halved
        const ENEMY_HEIGHT = 11; // Halved
        const ENEMY_SPEED = 1.3;
        const ENEMY_CHASE_DIST = 350; // Larger aggro range
        const ENEMY_SHOOT_DIST = 200;
        const PLAYER_ENTER_VEHICLE_RANGE = 30; // Reduced range due to smaller size

        // --- Roads Data ---
        const roads = [ /* ... as before ... */
             {x1: 0, y1: 1000, x2: gameState.world.width, y2: 1000}, {x1: 0, y1: 2000, x2: gameState.world.width, y2: 2000},
             {x1: 1000, y1: 0, x2: 1000, y2: gameState.world.height}, {x1: 2000, y1: 0, x2: 2000, y2: gameState.world.height},
             {x1: 500, y1: 500, x2: 1500, y2: 1500}, {x1: 2500, y1: 500, x2: 1500, y2: 1500},
             {x1: 500, y1: 2500, x2: 1500, y2: 1500}, {x1: 2500, y1: 2500, x2: 1500, y2: 1500},
             {x1: 200, y1: 1000, x2: 500, y2: 1200}, {x1: 2800, y1: 1000, x2: 2500, y2: 1200},
             {x1: 200, y1: 2000, x2: 500, y2: 1800}, {x1: 2800, y1: 2000, x2: 2500, y2: 1800}
        ];

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => { handleKeyInput(e, true); });
        window.addEventListener('keyup', (e) => { handleKeyInput(e, false); });
        function handleKeyInput(e, isPressed) { /* ... Same as previous ... */
             const key = e.key.toLowerCase(); switch(key) { case 'arrowup': case 'w': gameState.controls.up = isPressed; break; case 'arrowdown': case 's': gameState.controls.down = isPressed; break; case 'arrowleft': case 'a': gameState.controls.left = isPressed; break; case 'arrowright': case 'd': gameState.controls.right = isPressed; break; case ' ': gameState.controls.handbrake = isPressed; break; case 'f': gameState.controls.refuel = isPressed; break; case 'shift': gameState.controls.fire = isPressed; break; case 'e': if (isPressed && !gameState.controls.enterExitProcessed) { gameState.controls.enterExit = true; gameState.controls.enterExitProcessed = true; } else if (!isPressed) { gameState.controls.enterExitProcessed = false; } break; } if ((key === ' ' || key === 'shift' || key.startsWith('arrow')) && isPressed) e.preventDefault();
        }

        // --- Enter/Exit Vehicle Logic ---
        function handleEnterExitAction() { /* ... uses PLAYER_ENTER_VEHICLE_RANGE ... */
            if (!gameState.controls.enterExit) return;
            if (gameState.playerState === 'driving') { /* ... Exit logic same ... */
                const parkedCar = { x: gameState.player.x, y: gameState.player.y, width: gameState.player.width, height: gameState.player.height, angle: gameState.player.angle, color: gameState.player.color, maxSpeed: gameState.player.maxSpeed, handling: gameState.player.handling, fuelLevel: gameState.player.fuelLevel };
                gameState.world.vehicles.push(parkedCar); gameState.playerState = 'onFoot'; const exitOffset = (gameState.player.width / 2) + 5 + gameState.player.pedWidth / 2; const exitAngleRad = (gameState.player.angle - 90) * Math.PI / 180; gameState.player.x += Math.cos(exitAngleRad) * exitOffset; gameState.player.y += Math.sin(exitAngleRad) * exitOffset; gameState.player.speed = 0;
            } else if (gameState.playerState === 'onFoot') {
                let closestCar = null;
                let minDistanceSq = PLAYER_ENTER_VEHICLE_RANGE * PLAYER_ENTER_VEHICLE_RANGE; // Use constant
                for (let i = gameState.world.vehicles.length - 1; i >= 0; i--) {
                    const car = gameState.world.vehicles[i]; const dx = gameState.player.x - car.x; const dy = gameState.player.y - car.y; const distanceSq = dx * dx + dy * dy;
                    if (distanceSq < minDistanceSq) { minDistanceSq = distanceSq; closestCar = car; closestCar.index = i; }
                }
                if (closestCar) { /* ... Enter logic same ... */
                    gameState.playerState = 'driving'; gameState.player.x = closestCar.x; gameState.player.y = closestCar.y; gameState.player.width = closestCar.width; gameState.player.height = closestCar.height; gameState.player.angle = closestCar.angle; gameState.player.color = closestCar.color; gameState.player.maxSpeed = closestCar.maxSpeed; gameState.player.handling = closestCar.handling; gameState.player.fuelLevel = closestCar.fuelLevel; gameState.player.speed = 0; gameState.world.vehicles.splice(closestCar.index, 1);
                }
            }
            gameState.controls.enterExit = false;
        }

        // --- Player Firing Logic (Enhanced) ---
        function handlePlayerFiring() {
            if (gameState.playerState === 'onFoot' && gameState.controls.fire && gameState.player.fireCooldown <= 0) {
                // --- Add Spread ---
                const spreadRad = (Math.random() - 0.5) * gameState.player.bulletSpread * (Math.PI / 180);
                const fireAngleRad = gameState.player.angle * Math.PI / 180 + spreadRad;

                const muzzleOffsetX = Math.sin(fireAngleRad) * (gameState.player.pedWidth); // Offset based on direction
                const muzzleOffsetY = -Math.cos(fireAngleRad) * (gameState.player.pedHeight);

                const startX = gameState.player.x + muzzleOffsetX;
                const startY = gameState.player.y + muzzleOffsetY;

                // Create Projectile
                gameState.world.projectiles.push({
                    x: startX, y: startY,
                    vx: Math.sin(fireAngleRad) * PROJECTILE_SPEED,
                    vy: -Math.cos(fireAngleRad) * PROJECTILE_SPEED,
                    lifespan: PROJECTILE_LIFESPAN, owner: 'player',
                    damage: PROJECTILE_DAMAGE, color: '#ff0'
                });

                // --- Create Muzzle Flash ---
                createMuzzleFlash(startX, startY);

                gameState.player.fireCooldown = gameState.player.fireRate;
            }
            if (gameState.player.fireCooldown > 0) gameState.player.fireCooldown--;
        }

        // --- Game Loop ---
        function gameLoop() { /* ... Same as previous ... */
             if (gameState.gameOver) { drawGameOver(); requestAnimationFrame(gameLoop); return; } handleEnterExitAction(); handlePlayerFiring(); updateGame(); renderGame(); requestAnimationFrame(gameLoop);
        }

        // --- Update Logic ---
        function updateGame() { /* ... Same structure ... */
             updatePlayerPosition(); updateEnemies(); updateProjectiles(); updateCamera(); updateParticlesAndEffects(); updateHUD(); checkGameOverCondition();
        }

        // --- Player Update ---
        function updatePlayerPosition() { /* ... Same structure ... */
             const oldX = gameState.player.x; const oldY = gameState.player.y; if (gameState.playerState === 'driving') { updateDrivingPhysics(); checkGasStations(); } else if (gameState.playerState === 'onFoot') { updateWalkingPhysics(); } checkCollisions(oldX, oldY, gameState.player, gameState.playerState);
        }
        function updateDrivingPhysics() { /* ... Same as previous ... */
             if (gameState.controls.up && gameState.player.fuelLevel > 0) { gameState.player.speed += gameState.player.acceleration; gameState.player.fuelLevel -= gameState.player.fuelConsumption * (0.5 + Math.abs(gameState.player.speed) / gameState.player.maxSpeed); if (Math.random() > 0.7 && Math.abs(gameState.player.speed) > 1) createDustParticle(true); } else if (gameState.controls.down) { if (gameState.player.speed > 0.1) gameState.player.speed -= gameState.player.deceleration * 3; else { gameState.player.speed -= gameState.player.acceleration / 1.5; if (gameState.player.fuelLevel > 0) gameState.player.fuelLevel -= gameState.player.fuelConsumption * 0.5; } } else { if (Math.abs(gameState.player.speed) < gameState.player.deceleration) gameState.player.speed = 0; else if (gameState.player.speed > 0) gameState.player.speed -= gameState.player.deceleration; else gameState.player.speed += gameState.player.deceleration; } if (gameState.player.speed > gameState.player.maxSpeed) gameState.player.speed = gameState.player.maxSpeed; const maxReverseSpeed = gameState.player.maxSpeed / 2; if (gameState.player.speed < -maxReverseSpeed) gameState.player.speed = -maxReverseSpeed; if (Math.abs(gameState.player.speed) > 0.5) { let steeringFactor = gameState.player.handling * (gameState.controls.handbrake ? 1.7 : 1); let speedModifier = 1.0 - (Math.abs(gameState.player.speed) / (gameState.player.maxSpeed * 1.5)); speedModifier = Math.max(0.3, speedModifier); let turnDirection = gameState.player.speed >= 0 ? 1 : -1; if (gameState.controls.left) { gameState.player.angle -= steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } if (gameState.controls.right) { gameState.player.angle += steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } } if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > 0.5) { gameState.player.speed *= 0.94; if (Math.random() > 0.4) createSkidMark(); } if (gameState.player.fuelLevel < 0) gameState.player.fuelLevel = 0; if (Math.abs(gameState.player.speed) > 0.01) { const radians = gameState.player.angle * Math.PI / 180; gameState.player.x += Math.sin(radians) * gameState.player.speed; gameState.player.y -= Math.cos(radians) * gameState.player.speed; }
        }
        function updateWalkingPhysics() { /* ... Same walking + animation logic ... */
             let moveX = 0; let moveY = 0; const speed = gameState.player.pedSpeed; if (gameState.controls.up) moveY -= speed; if (gameState.controls.down) moveY += speed; if (gameState.controls.left) moveX -= speed; if (gameState.controls.right) moveX += speed; gameState.player.isWalking = (Math.abs(moveX) > 0.01 || Math.abs(moveY) > 0.01); if (moveX !== 0 && moveY !== 0) { const factor = speed / Math.sqrt(moveX * moveX + moveY * moveY); moveX *= factor; moveY *= factor; } if (gameState.player.isWalking) { gameState.player.angle = (Math.atan2(moveX, -moveY) * 180 / Math.PI); } gameState.player.x += moveX; gameState.player.y += moveY; if (gameState.player.isWalking) { gameState.player.walkAnimTimer++; if (gameState.player.walkAnimTimer >= gameState.player.walkAnimSpeed) { gameState.player.walkAnimTimer = 0; gameState.player.walkAnimFrame = 1 - gameState.player.walkAnimFrame; } } else { gameState.player.walkAnimFrame = 0; gameState.player.walkAnimTimer = 0; }
        }

        // --- Enemy Logic (Simplified) ---
        function spawnEnemy(x, y) {
            gameState.world.enemies.push({
                x: x, y: y, health: ENEMY_HEALTH, maxHealth: ENEMY_HEALTH,
                width: ENEMY_WIDTH, height: ENEMY_HEIGHT, speed: ENEMY_SPEED, angle: 0,
                color: `hsl(${Math.random() * 60}, 70%, 50%)`, state: 'idle',
                aiTimer: Math.random() * 120
            });
        }
        function updateEnemies() { /* ... Same basic chase logic ... */
             for (let i = gameState.world.enemies.length - 1; i >= 0; i--) { const enemy = gameState.world.enemies[i]; const oldX = enemy.x; const oldY = enemy.y; const dxPlayer = gameState.player.x - enemy.x; const dyPlayer = gameState.player.y - enemy.y; const distSqPlayer = dxPlayer * dxPlayer + dyPlayer * dyPlayer; if (enemy.state === 'idle') { enemy.aiTimer--; if (distSqPlayer < ENEMY_CHASE_DIST * ENEMY_CHASE_DIST) { enemy.state = 'chasing'; } else if (enemy.aiTimer <= 0) { enemy.aiTimer = 120 + Math.random() * 120; } } else if (enemy.state === 'chasing') { if (distSqPlayer > (ENEMY_CHASE_DIST + 50) * (ENEMY_CHASE_DIST + 50)) { enemy.state = 'idle'; enemy.aiTimer = 60; } else { const angleToPlayer = Math.atan2(dyPlayer, dxPlayer); enemy.angle = angleToPlayer * 180 / Math.PI + 90; enemy.x += Math.cos(angleToPlayer) * enemy.speed; enemy.y += Math.sin(angleToPlayer) * enemy.speed; } } checkCollisions(oldX, oldY, enemy, 'enemy'); if (enemy.health <= 0) { createExplosion(enemy.x, enemy.y, enemy.color); gameState.world.enemies.splice(i, 1); } }
        }

        // --- Projectile Logic (Enhanced Hit Check) ---
        function updateProjectiles() {
             for (let i = gameState.world.projectiles.length - 1; i >= 0; i--) {
                 const p = gameState.world.projectiles[i];
                 p.x += p.vx; p.y += p.vy; p.lifespan--;
                 let hit = false; let hitWall = false;

                 // 1. Check collision with enemies
                 if (p.owner === 'player') {
                     for (let j = gameState.world.enemies.length - 1; j >= 0; j--) {
                         const enemy = gameState.world.enemies[j];
                         const dx = p.x - enemy.x; const dy = p.y - enemy.y;
                         const hitRadius = Math.max(enemy.width, enemy.height) * 0.6; // Adjusted hit radius for smaller bodies
                         if (dx * dx + dy * dy < hitRadius * hitRadius) {
                             enemy.health -= p.damage;
                             hit = true; // Hit an enemy
                             break;
                         }
                     }
                 }
                 // 2. Check collision with player (add later if enemies shoot)

                 // 3. Check collision with world geometry (Buildings, Obstacles, Impassable Zones)
                 if (!hit) {
                     const worldGeometry = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones];
                     for(const obj of worldGeometry) {
                          if (p.x > obj.x && p.x < obj.x + obj.width && p.y > obj.y && p.y < obj.y + obj.height) {
                              hit = true;
                              hitWall = true; // Specifically hit geometry
                              break;
                          }
                     }
                 }

                 // 4. Check world boundaries
                 if (p.x < 0 || p.x > gameState.world.width || p.y < 0 || p.y > gameState.world.height) {
                     hit = true; // Hit world boundary
                     hitWall = true;
                 }

                 // Remove projectile if lifespan ends or it hits something
                 if (p.lifespan <= 0 || hit) {
                      if (hitWall) {
                          createHitSparks(p.x, p.y); // Sparks on hitting walls/boundaries
                      } else if (hit) {
                          createExplosion(p.x, p.y, p.color, 0.4); // Small blood/hit effect
                      }
                     gameState.world.projectiles.splice(i, 1);
                 }
             }
         }

        // --- Collision (Includes Impassable Zones) ---
        function checkCollisions(oldX, oldY, entity, entityType) {
            const isDriving = entityType === 'driving'; const isPlayer = entityType === 'driving' || entityType === 'onFoot'; const isEnemy = entityType === 'enemy';
            const pW = isDriving ? entity.width : (isPlayer ? entity.pedWidth : entity.width);
            const pH = isDriving ? entity.height : (isPlayer ? entity.pedHeight : entity.height);
            const entityRect = { x: entity.x - pW / 2, y: entity.y - pH / 2, width: pW, height: pH };
            let collisionOccurred = false; let bounced = false;

            // 1. World Boundaries
            if (entityRect.x < 0) { entityRect.x = 0; bounced = true; } if (entityRect.y < 0) { entityRect.y = 0; bounced = true; }
            if (entityRect.x + pW > gameState.world.width) { entityRect.x = gameState.world.width - pW; bounced = true; } if (entityRect.y + pH > gameState.world.height) { entityRect.y = gameState.world.height - pH; bounced = true; }
            entity.x = entityRect.x + pW / 2; entity.y = entityRect.y + pH / 2;
            if (bounced && isDriving) entity.speed *= -0.4; else if (bounced && isEnemy) entity.state = 'idle';

            // 2. Object Collision (Buildings, Obstacles, Impassable Zones)
            const objects = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones]; // Include impassable
            for (const obj of objects) {
                const objRect = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
                if (isCollidingAABB(entityRect, objRect)) {
                    collisionOccurred = true; entity.x = oldX; entity.y = oldY; // Revert pos
                    if (isDriving) { entity.speed *= -0.5; createDustParticle(false); createDustParticle(false); }
                    else if (isEnemy) { entity.state = 'idle'; }
                    break;
                }
            }
            return collisionOccurred;
        }
        function isCollidingAABB(rect1, rect2) { /* ... Same ... */ return ( rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y ); }
        function checkGasStations() { /* ... Same ... */ if (gameState.playerState !== 'driving') return; if (gameState.controls.refuel) { for (const station of gameState.world.gasStations) { const dx = gameState.player.x - (station.x + station.width / 2); const dy = gameState.player.y - (station.y + station.height / 2); const distanceSq = dx * dx + dy * dy; if (distanceSq < 70 * 70) { gameState.player.fuelLevel += 1.5; if (gameState.player.fuelLevel > 100) gameState.player.fuelLevel = 100; break; } } } }
        function checkLocation() { /* ... Same ... */ let currentZone = null; let closestDistance = Infinity; for (const zone of gameState.zones) { const dx = gameState.player.x - zone.x; const dy = gameState.player.y - zone.y; const distance = Math.sqrt(dx * dx + dy * dy); if (distance < zone.radius && distance < closestDistance) { closestDistance = distance; currentZone = zone; } } document.getElementById('location').textContent = `LOC: ${currentZone ? currentZone.name : 'COUNTRYSIDE'}`; }
        function checkGameOverCondition() {
            if (gameState.player.health <= 0 && !gameState.gameOver) {
                gameState.gameOver = true;
                console.log("GAME OVER");
                // Optional: Add game over sound effect
            }
        }

        // --- Effects (Added Muzzle Flash, Hit Sparks) ---
        function createSkidMark() { /* ... Same ... */ if (gameState.playerState !== 'driving') return; const radians = gameState.player.angle * Math.PI / 180; const wheelOffset = gameState.player.height * 0.3; gameState.fx.skidMarks.push({ x: gameState.player.x - Math.sin(radians) * wheelOffset, y: gameState.player.y + Math.cos(radians) * wheelOffset, angle: gameState.player.angle, alpha: 0.7 + Math.random() * 0.2, width: 2 + Math.abs(gameState.player.speed * 0.5), life: 200 + Math.random() * 100 }); if (gameState.fx.skidMarks.length > 150) gameState.fx.skidMarks.shift(); }
        function createDustParticle(isDrivingEffect = true) { /* ... Same ... */ const pAngle = gameState.player.angle * Math.PI / 180; const offsetDist = isDrivingEffect ? gameState.player.height / 2 : 5; const baseX = gameState.player.x - Math.sin(pAngle) * offsetDist; const baseY = gameState.player.y + Math.cos(pAngle) * offsetDist; gameState.fx.dustParticles.push({ x: baseX + (Math.random() - 0.5) * (isDrivingEffect ? 15 : 5), y: baseY + (Math.random() - 0.5) * (isDrivingEffect ? 15 : 5), size: isDrivingEffect ? 2 + Math.random() * 5 : 1 + Math.random() * 2, alpha: 0.6 + Math.random() * 0.2, life: 25 + Math.random() * 25, vx: (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5), vy: (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5) }); if (gameState.fx.dustParticles.length > 80) gameState.fx.dustParticles.shift(); }

        function initializeWorldObjects() { /* ... Same road avoidance ... */ const validTrees = []; gameState.world.trees.forEach(tree => { if (!isOnRoad(tree.x, tree.y, tree.radius * 1.5)) { validTrees.push(tree); } }); gameState.world.trees = validTrees.slice(0, 200); const validBuildings = []; gameState.world.buildings.forEach(b => { if (!isOnRoad(b.x + b.width/2, b.y + b.height/2, Math.max(b.width, b.height) * 0.7)) { validBuildings.push(b); } }); gameState.world.buildings = validBuildings.slice(0, 40); const validObstacles = []; gameState.world.obstacles.forEach(o => { if (!isOnRoad(o.x + o.width/2, o.y + o.height/2, Math.max(o.width, o.height))) { validObstacles.push(o); } }); gameState.world.obstacles = validObstacles.slice(0, 60); console.log(`World Initialized: ${gameState.world.trees.length} Trees, ${gameState.world.buildings.length} Buildings, ${gameState.world.obstacles.length} Obstacles`); }
        function isOnRoad(x, y, buffer) { /* ... Same ... */ for (const road of roads) { const dx = road.x2 - road.x1, dy = road.y2 - road.y1; const lenSq = dx*dx + dy*dy; if (lenSq === 0) continue; let t = ((x - road.x1) * dx + (y - road.y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); const closestX = road.x1 + t * dx; const closestY = road.y1 + t * dy; const distSq = (x - closestX)**2 + (y - closestY)**2; if (distSq < (gameState.world.roadWidth / 2 + buffer)**2) return true; } return false; }
        function spawnInitialEnemies(count) { /* ... Same spawn logic ... */ let spawned = 0; let attempts = 0; while (spawned < count && attempts < count * 10) { attempts++; const x = Math.random() * gameState.world.width; const y = Math.random() * gameState.world.height; const dx = x - gameState.player.x; const dy = y - gameState.player.y; if (dx*dx + dy*dy < 500*500) continue; if (isOnRoad(x, y, 20)) continue; let inObject = false; const worldGeometry = [...gameState.world.buildings, ...gameState.world.obstacles, ...gameState.world.impassableZones]; for (const obj of worldGeometry) { if (x > obj.x && x < obj.x + obj.width && y > obj.y && y < obj.y + obj.height) { inObject = true; break; } } if (inObject) continue; spawnEnemy(x, y); spawned++; } console.log(`Spawned ${spawned} enemies.`); }
        function handleResize() { /* ... Same aspect ratio logic ... */ const gameContainer = document.getElementById('game-container'); const windowWidth = window.innerWidth; const windowHeight = window.innerHeight; const aspectRatio = canvas.width / canvas.height; let newWidth = windowWidth * 0.98; let newHeight = newWidth / aspectRatio; if (newHeight > windowHeight * 0.98) { newHeight = windowHeight * 0.98; newWidth = newHeight * aspectRatio; } gameContainer.style.width = `${newWidth}px`; gameContainer.style.height = `${newHeight}px`; }

        // --- Start Game ---
        window.onload = initGame;

    </script>
