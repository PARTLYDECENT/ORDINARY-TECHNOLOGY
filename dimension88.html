<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Urban Rampage</title>
  <style>
    body { margin: 0; padding: 0; background: #111; overflow: hidden; }
    canvas { display: block; background: #333; }
    #ui { position: fixed; top: 10px; left: 10px; color: #fff; font-family: Arial, sans-serif; z-index: 10; }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; z-index: 20;
    }
    .overlay button {
      margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="ui">Speed: <span id="speed">0</span> | Score: <span id="score">0</span></div>
  <div id="startScreen" class="overlay">
    <h1>URBAN RAMPAGE</h1>
    <p>Drive hard through the concrete jungle!<br>Use Arrow keys or WASD.</p>
    <button id="startBtn">START</button>
  </div>
  <div id="gameOverScreen" class="overlay" style="display:none;">
    <h1>CRASHED!</h1>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">RESTART</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    // ---- Setup ----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed');
    const scoreEl = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // World settings
    const TILE_SIZE = 50;
    const MAP_COLS = 40, MAP_ROWS = 40;
    const worldWidth = MAP_COLS * TILE_SIZE;
    const worldHeight = MAP_ROWS * TILE_SIZE;
    let map = [];
    for (let row = 0; row < MAP_ROWS; row++) {
      map[row] = [];
      for (let col = 0; col < MAP_COLS; col++) {
        // Roads (0) vs. Buildings (1): more roads near center
        map[row][col] = (Math.random() < 0.3 || (Math.abs(row-MAP_ROWS/2)<3 && Math.abs(col-MAP_COLS/2)<3)) ? 0 : 1;
      }
    }

    // Player
    const player = { x: worldWidth/2, y: worldHeight/2, angle: 0, speed: 0 };

    // NPC vehicles
    let npcs = [];
    function spawnNPC() {
      // Spawn at a random road tile
      let r, c;
      do { r = Math.floor(Math.random()*MAP_ROWS); c = Math.floor(Math.random()*MAP_COLS); } while(map[r][c]!==0);
      npcs.push({ x: c*TILE_SIZE+TILE_SIZE/2, y: r*TILE_SIZE+TILE_SIZE/2, angle: Math.random()*Math.PI*2, speed: 1+Math.random()*1 });
    }
    // Spawn a few NPCs initially
    for (let i=0;i<10;i++) spawnNPC();

    // Input
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let running = false;
    let gameOver = false;
    let score = 0;

    // ---- Game Functions ----
    function update() {
      // Player controls
      if (keys['arrowup'] || keys['w']) player.speed += 0.3;
      else player.speed *= 0.95;
      if (keys['arrowdown'] || keys['s']) player.speed *= 0.9;
      if (keys['arrowleft'] || keys['a']) player.angle -= 0.05;
      if (keys['arrowright'] || keys['d']) player.angle += 0.05;
      player.x += Math.cos(player.angle) * player.speed;
      player.y += Math.sin(player.angle) * player.speed;
      // Wrap-around world
      if (player.x < 0) player.x += worldWidth;
      if (player.x >= worldWidth) player.x -= worldWidth;
      if (player.y < 0) player.y += worldHeight;
      if (player.y >= worldHeight) player.y -= worldHeight;

      // NPC movement: simple wandering
      npcs.forEach(npc => {
        npc.x += Math.cos(npc.angle) * npc.speed;
        npc.y += Math.sin(npc.angle) * npc.speed;
        if (npc.x < 0) npc.x += worldWidth;
        if (npc.x >= worldWidth) npc.x -= worldWidth;
        if (npc.y < 0) npc.y += worldHeight;
        if (npc.y >= worldHeight) npc.y -= worldHeight;
        // Randomly change direction
        if (Math.random() < 0.02) npc.angle += (Math.random()-0.5)*0.5;
      });

      // Check collisions: player with buildings
      let tileCol = Math.floor(player.x / TILE_SIZE);
      let tileRow = Math.floor(player.y / TILE_SIZE);
      if (map[tileRow][tileCol] === 1) {
        gameOver = true;
      }
      // Check collision with NPCs (simple distance check)
      for (let npc of npcs) {
        let dx = player.x - npc.x, dy = player.y - npc.y;
        if (Math.hypot(dx, dy) < 25) gameOver = true;
      }
      // Increase score (distance traveled)
      score += player.speed * 0.1;
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      // Camera offset: center on player
      const offsetX = player.x - canvas.width/2;
      const offsetY = player.y - canvas.height/2;
      // Draw map
      for (let row = 0; row < MAP_ROWS; row++) {
        for (let col = 0; col < MAP_COLS; col++) {
          const screenX = col*TILE_SIZE - offsetX;
          const screenY = row*TILE_SIZE - offsetY;
          if (screenX+TILE_SIZE < 0 || screenX > canvas.width ||
              screenY+TILE_SIZE < 0 || screenY > canvas.height) continue;
          ctx.fillStyle = (map[row][col]===0)? '#222' : '#777';
          ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = '#111';
          ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
        }
      }
      // Draw NPCs as smaller triangles
      npcs.forEach(npc => {
        ctx.save();
        let screenX = npc.x - offsetX, screenY = npc.y - offsetY;
        ctx.translate(screenX, screenY);
        ctx.rotate(npc.angle);
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-10, 7);
        ctx.lineTo(-10, -7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
      // Draw player as a larger triangle
      ctx.save();
      ctx.translate(canvas.width/2, canvas.height/2);
      ctx.rotate(player.angle);
      ctx.fillStyle = '#e44';
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(-20, 12);
      ctx.lineTo(-20, -12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      // Update UI
      speedEl.textContent = player.speed.toFixed(1);
      scoreEl.textContent = Math.floor(score);
    }

    function gameLoop() {
      if (!running) return;
      if (gameOver) {
        finalScoreEl.textContent = `Score: ${Math.floor(score)}`;
        gameOverScreen.style.display = 'flex';
        running = false;
        return;
      }
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ---- Event Listeners ----
    startBtn.addEventListener('click', () => {
      running = true;
      gameOver = false;
      score = 0;
      player.x = worldWidth/2; player.y = worldHeight/2; player.speed = 0; player.angle = 0;
      startScreen.style.display = 'none';
      gameOverScreen.style.display = 'none';
      requestAnimationFrame(gameLoop);
    });
    restartBtn.addEventListener('click', () => {
      running = true;
      gameOver = false;
      score = 0;
      player.x = worldWidth/2; player.y = worldHeight/2; player.speed = 0; player.angle = 0;
      gameOverScreen.style.display = 'none';
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
