<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Drift</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000510; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: -webkit-fill-available; }
        canvas#gameCanvas { border: 1px solid #447; box-shadow: 0 0 15px #447; background-color: #000510; display: block; touch-action: none; max-width: 100%; max-height: calc(100vh - 50px); object-fit: contain; }
        .ui-container { width: 90%; max-width: 600px; display: flex; justify-content: space-between; margin-top: 5px; font-size: 14px; color: #9cf; text-shadow: 0 0 3px #05a; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 5, 16, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; opacity: 0; transition: opacity 0.4s ease-out; pointer-events: none; padding: 15px; box-sizing: border-box; text-align: center; }
        .overlay.active { opacity: 1; pointer-events: all; }
        .overlay h1 { color: #9cf; font-size: 28px; margin-bottom: 15px; text-shadow: 0 0 8px #5af; }
        .overlay p { color: #ccc; line-height: 1.5; font-size: 15px; max-width: 450px; margin-bottom: 20px; }
        .overlay button { background-color: #28a; color: #fff; border: 1px solid #5cf; padding: 10px 25px; font-family: 'Segoe UI', Tahoma; font-size: 16px; margin-top: 15px; cursor: pointer; border-radius: 4px; transition: background-color 0.2s; }
        .overlay button:hover { background-color: #3af; }
        #score, #energy, #wave { min-width: 100px; text-align: left; }
        #energy { text-align: right; }

        /* --- Mobile Controls --- */
        #mobile-controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 130px; z-index: 5; pointer-events: none; display: none; user-select: none; -webkit-user-select: none; }
        #joystick-area { position: absolute; left: 15px; bottom: 15px; width: 100px; height: 100px; background-color: rgba(68, 68, 119, 0.15); border-radius: 50%; border: 1px solid rgba(100, 100, 150, 0.4); pointer-events: auto; }
        #joystick-thumb { position: absolute; left: 50%; top: 50%; width: 35px; height: 35px; background-color: rgba(100, 100, 180, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; border: 1px solid rgba(150, 150, 220, 0.6); }
        #action-button { position: absolute; right: 25px; bottom: 25px; width: 65px; height: 65px; background-color: rgba(68, 100, 119, 0.25); border-radius: 50%; border: 1px solid rgba(80, 150, 180, 0.5); pointer-events: auto; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #adf; text-align: center; padding: 5px; box-sizing: border-box; line-height: 1.1; }
        #action-button:active { background-color: rgba(80, 150, 180, 0.5); transform: scale(0.95); }
        .star { position: absolute; background-color: white; border-radius: 50%; pointer-events: none; } /* For background */
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div class="ui-container">
        <div id="score">Score: 0</div>
        <div id="wave">Wave: 1</div>
        <div id="energy">Shield: 100</div>
    </div>

    <div id="start-screen" class="overlay active">
        <h1>AETHER DRIFT</h1>
        <p>Navigate the nebula. Collect <span style="color:#9f9;">Energy Fragments</span>.<br>Avoid <span style="color:#f99;">Asteroids</span>!<br><br>Use WASD/Arrows or the Joystick to move.<br>Press SPACE or tap SHIELD to activate your energy shield.</p>
        <button id="start-button">START DRIFTING</button>
    </div>
    <div id="game-over" class="overlay">
        <h1>SYSTEM OFFLINE</h1>
        <p id="final-score">Final Score: 0</p>
        <button id="restart-button">RESTART</button>
    </div>

    <div id="mobile-controls">
        <div id="joystick-area"><div id="joystick-thumb"></div></div>
        <div id="action-button">SHIELD</div>
    </div>

    <script>
        // ============= Game Setup =============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const C_WIDTH = canvas.width;
        const C_HEIGHT = canvas.height;

        // Game Constants
        const PLAYER_SIZE = 15;
        const PLAYER_SPEED = 3.5;
        const FRAGMENT_SIZE = 6;
        const FRAGMENT_SCORE = 10;
        const ASTEROID_SIZE_MIN = 10;
        const ASTEROID_SIZE_MAX = 30;
        const ASTEROID_SPEED_MIN = 0.5;
        const ASTEROID_SPEED_MAX = 1.5;
        const SHIELD_COST = 30;
        const SHIELD_DURATION = 2500; // ms
        const MAX_ENERGY = 100;
        const STAR_COUNT = 100;

        // Game State
        let gameState = {
            player: null,
            fragments: [],
            asteroids: [],
            stars: [], // For background parallax
            score: 0,
            energy: MAX_ENERGY,
            wave: 1,
            shieldActive: false,
            shieldTimer: 0,
            gameOver: false,
            gameStarted: false,
            keysPressed: new Set(),
            touchMoveX: 0, touchMoveY: 0, touchActionActive: false, touchActionDown: false,
            lastSpawnTime: 0,
            spawnInterval: 3000 // ms
        };

        // ============= Mobile Control State & Setup =============
        const mobileControlsDiv = document.getElementById('mobile-controls');
        const joystickArea = document.getElementById('joystick-area');
        const joystickThumb = document.getElementById('joystick-thumb');
        const actionButton = document.getElementById('action-button');
        let joystickActive = false; let joystickStartX = 0; let joystickStartY = 0; let joystickRadius = 0;

        function setupMobileControls() {
            if (!joystickArea || !joystickThumb || !actionButton || !mobileControlsDiv) return;
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                mobileControlsDiv.style.display = 'block'; joystickRadius = joystickArea.offsetWidth / 2;
                joystickArea.addEventListener('touchstart', (e) => { e.preventDefault(); joystickActive = true; const r=joystickArea.getBoundingClientRect(); joystickStartX = r.left+joystickRadius; joystickStartY = r.top+joystickRadius; handleJoystickMove(e);}, { passive: false });
                joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
                joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });
                joystickArea.addEventListener('touchcancel', handleJoystickEnd, { passive: false });
                actionButton.addEventListener('touchstart', handleActionStart, { passive: false });
                actionButton.addEventListener('touchend', handleActionEnd, { passive: false });
                actionButton.addEventListener('touchcancel', handleActionEnd, { passive: false });
            } else { mobileControlsDiv.style.display = 'none'; }
        }
        function handleJoystickMove(event) { if (!joystickActive) return; event.preventDefault(); const touch = event.touches[0]; const currentX = touch.clientX; const currentY = touch.clientY; const deltaX = currentX - joystickStartX; const deltaY = currentY - joystickStartY; const distance = Math.hypot(deltaX, deltaY); const maxDist = joystickRadius - (joystickThumb.offsetWidth / 2); const clampedDist = Math.min(distance, maxDist); const angle = Math.atan2(deltaY, deltaX); const thumbX = Math.cos(angle) * clampedDist; const thumbY = Math.sin(angle) * clampedDist; joystickThumb.style.transform = `translate(-50%, -50%) translate(${thumbX}px, ${thumbY}px)`; const deadZone = joystickRadius * 0.15; if (distance > deadZone) { const sensitivity = 1.2; gameState.touchMoveX = Math.max(-1, Math.min(1, (deltaX / maxDist) * sensitivity)); gameState.touchMoveY = Math.max(-1, Math.min(1, (deltaY / maxDist) * sensitivity)); } else { gameState.touchMoveX = 0; gameState.touchMoveY = 0; } }
        function handleJoystickEnd(event) { if (!joystickActive) return; event.preventDefault(); joystickActive = false; gameState.touchMoveX = 0; gameState.touchMoveY = 0; joystickThumb.style.transform = 'translate(-50%, -50%)'; }
        function handleActionStart(event) { event.preventDefault(); gameState.touchActionDown = true; actionButton.style.backgroundColor = 'rgba(80, 150, 180, 0.6)'; }
        function handleActionEnd(event) { event.preventDefault(); gameState.touchActionDown = false; gameState.touchActionActive = false; actionButton.style.backgroundColor = 'rgba(68, 100, 119, 0.25)'; } // Reset state AND color


        // ============= Game Entities =============
        function createPlayer() { return { x: C_WIDTH / 2, y: C_HEIGHT - 50, w: PLAYER_SIZE * 2, h: PLAYER_SIZE * 2, speed: PLAYER_SPEED, trail: [] }; }
        function createFragment() { return { x: Math.random() * C_WIDTH, y: -FRAGMENT_SIZE, w: FRAGMENT_SIZE * 2, h: FRAGMENT_SIZE * 2, speed: 1 + Math.random() * 1.5, color: `hsl(${100 + Math.random()*40}, 100%, 70%)`}; }
        function createAsteroid() { const size = ASTEROID_SIZE_MIN + Math.random() * (ASTEROID_SIZE_MAX - ASTEROID_SIZE_MIN); return { x: Math.random() * C_WIDTH, y: -size, w: size, h: size, speed: ASTEROID_SPEED_MIN + Math.random() * (ASTEROID_SPEED_MAX - ASTEROID_SPEED_MIN), angle: Math.random() * Math.PI * 2, rotation: Math.random() * 0.02 - 0.01 }; }
        function createStar() { return { x: Math.random() * C_WIDTH, y: Math.random() * C_HEIGHT, size: 1 + Math.random() * 1.5, speed: 0.1 + Math.random() * 0.3 }; }

        // ============= Utility Functions =============
        function isColliding(rect1, rect2) { return rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x && rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y; }
        function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

        // ============= Game Logic Update =============
        function update(dt) {
            if (!gameState.gameStarted || gameState.gameOver) return;
            const now = performance.now();

            // --- Input Processing ---
            let moveX = gameState.touchMoveX;
            let moveY = gameState.touchMoveY;
            let actionTriggered = gameState.touchActionDown && !gameState.touchActionActive; // Trigger on initial press
            gameState.touchActionActive = gameState.touchActionDown; // Update continuous state

            if (moveX === 0 && moveY === 0) { // Use keyboard if no touch movement
                if (gameState.keysPressed.has('arrowleft') || gameState.keysPressed.has('a')) moveX = -1;
                else if (gameState.keysPressed.has('arrowright') || gameState.keysPressed.has('d')) moveX = 1;
                if (gameState.keysPressed.has('arrowup') || gameState.keysPressed.has('w')) moveY = -1;
                else if (gameState.keysPressed.has('arrowdown') || gameState.keysPressed.has('s')) moveY = 1;
            }
            if (gameState.keysPressed.has(' ') && !gameState.spaceHandled) {
                actionTriggered = true;
                gameState.spaceHandled = true; // Prevent holding space from spamming shield
            }

            // --- Player Movement ---
            gameState.player.x += moveX * gameState.player.speed;
            gameState.player.y += moveY * gameState.player.speed;
            gameState.player.x = clamp(gameState.player.x, 0, C_WIDTH - gameState.player.w); // Boundary check
            gameState.player.y = clamp(gameState.player.y, 0, C_HEIGHT - gameState.player.h); // Boundary check

             // Add current pos to trail, limit length
             gameState.player.trail.push({x: gameState.player.x + gameState.player.w / 2, y: gameState.player.y + gameState.player.h / 2});
             if (gameState.player.trail.length > 15) gameState.player.trail.shift();

            // --- Shield Logic ---
            if (actionTriggered && gameState.energy >= SHIELD_COST && !gameState.shieldActive) {
                gameState.shieldActive = true;
                gameState.energy -= SHIELD_COST;
                gameState.shieldTimer = now + SHIELD_DURATION;
                // console.log("Shield Activated!");
            }
            if (gameState.shieldActive && now > gameState.shieldTimer) {
                gameState.shieldActive = false;
                // console.log("Shield Deactivated");
            }

            // --- Update Fragments ---
            for (let i = gameState.fragments.length - 1; i >= 0; i--) {
                const frag = gameState.fragments[i];
                frag.y += frag.speed;
                if (isColliding(gameState.player, frag)) {
                    gameState.score += FRAGMENT_SCORE;
                    gameState.energy = Math.min(MAX_ENERGY, gameState.energy + FRAGMENT_SCORE / 2); // Gain some energy
                    gameState.fragments.splice(i, 1);
                } else if (frag.y > C_HEIGHT) {
                    gameState.fragments.splice(i, 1); // Remove if off-screen
                }
            }

            // --- Update Asteroids ---
            for (let i = gameState.asteroids.length - 1; i >= 0; i--) {
                const ast = gameState.asteroids[i];
                ast.y += ast.speed;
                ast.angle += ast.rotation;
                // Collision Check
                if (isColliding(gameState.player, ast)) {
                    if (!gameState.shieldActive) {
                        gameState.gameOver = true;
                        console.log("Game Over!");
                    } else {
                        // Shield hit - bounce asteroid away? or destroy? Let's destroy.
                         gameState.asteroids.splice(i, 1);
                         // Maybe cost extra energy for shield hit?
                         // gameState.energy = Math.max(0, gameState.energy - 5);
                    }
                } else if (ast.y > C_HEIGHT + ast.h) { // Check bottom edge
                    gameState.asteroids.splice(i, 1);
                }
            }

            // --- Spawning ---
            if (now - gameState.lastSpawnTime > gameState.spawnInterval) {
                gameState.lastSpawnTime = now;
                // Spawn fragment
                if (Math.random() < 0.8) gameState.fragments.push(createFragment());
                // Spawn asteroid
                if (Math.random() < 0.3 + gameState.wave * 0.05) gameState.asteroids.push(createAsteroid()); // Increase chance with wave

                // Increase difficulty over time/waves (simple example)
                if (gameState.score > gameState.wave * 500) {
                     gameState.wave++;
                     gameState.spawnInterval = Math.max(500, 3000 - gameState.wave * 150); // Faster spawns
                     ASTEROID_SPEED_MAX += 0.1; // Faster asteroids
                     console.log(`Wave ${gameState.wave}! Spawn Interval: ${gameState.spawnInterval.toFixed(0)}ms`);
                }
            }

             // --- Update Stars ---
             gameState.stars.forEach(star => {
                 star.y += star.speed;
                 if (star.y > C_HEIGHT) { // Reset star if it goes off bottom
                     star.y = -star.size;
                     star.x = Math.random() * C_WIDTH;
                 }
             });
        }

        // ============= Rendering =============
        function render() {
            // Clear canvas
            ctx.fillStyle = '#000510';
            ctx.fillRect(0, 0, C_WIDTH, C_HEIGHT);

             // Draw Stars
             ctx.fillStyle = '#ffffff';
             gameState.stars.forEach(star => {
                 const alpha = (star.y / C_HEIGHT) * 0.7 + 0.1; // Fade in/out slightly
                 ctx.globalAlpha = alpha;
                 ctx.fillRect(star.x - star.size / 2, star.y - star.size / 2, star.size, star.size);
             });
             ctx.globalAlpha = 1.0; // Reset alpha

            // Draw Player Trail
            if (gameState.player?.trail.length > 1) {
                ctx.strokeStyle = 'rgba(100, 180, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(gameState.player.trail[0].x, gameState.player.trail[0].y);
                for(let i = 1; i < gameState.player.trail.length; i++){
                    ctx.lineTo(gameState.player.trail[i].x, gameState.player.trail[i].y);
                }
                ctx.stroke();
            }

            // Draw Player Ship (Triangle)
            if (gameState.player) {
                 ctx.save();
                 ctx.translate(gameState.player.x + gameState.player.w / 2, gameState.player.y + gameState.player.h / 2);
                 // Simple triangle shape
                 ctx.beginPath();
                 ctx.moveTo(0, -gameState.player.h / 2);
                 ctx.lineTo(-gameState.player.w / 2, gameState.player.h / 2);
                 ctx.lineTo(gameState.player.w / 2, gameState.player.h / 2);
                 ctx.closePath();
                 ctx.fillStyle = '#9cf';
                 ctx.fill();
                 ctx.strokeStyle = '#fff';
                 ctx.lineWidth = 1;
                 ctx.stroke();

                 // Draw Shield
                 if (gameState.shieldActive) {
                     const shieldRadius = Math.max(gameState.player.w, gameState.player.h) * 0.8;
                     const shieldPulse = Math.abs(Math.sin(performance.now() * 0.005)) * 0.3 + 0.6; // Pulse alpha
                     ctx.beginPath();
                     ctx.arc(0, 0, shieldRadius, 0, Math.PI * 2);
                     ctx.strokeStyle = `rgba(100, 220, 255, ${shieldPulse})`;
                     ctx.lineWidth = 2;
                     ctx.stroke();
                      ctx.fillStyle = `rgba(50, 150, 255, ${shieldPulse * 0.2})`; // Inner glow
                      ctx.fill();
                 }
                 ctx.restore();
            }

            // Draw Fragments
            gameState.fragments.forEach(frag => {
                ctx.fillStyle = frag.color;
                ctx.beginPath();
                ctx.arc(frag.x + frag.w / 2, frag.y + frag.h / 2, frag.w / 2, 0, Math.PI * 2);
                ctx.fill();
                // Add glow
                 ctx.fillStyle = `rgba(255, 255, 150, 0.3)`;
                 ctx.beginPath();
                 ctx.arc(frag.x + frag.w / 2, frag.y + frag.h / 2, frag.w, 0, Math.PI * 2);
                 ctx.fill();
            });

            // Draw Asteroids (Rotated Rectangles)
            gameState.asteroids.forEach(ast => {
                ctx.save();
                ctx.translate(ast.x + ast.w / 2, ast.y + ast.h / 2); // Translate to center
                ctx.rotate(ast.angle); // Rotate
                ctx.fillStyle = '#886';
                ctx.fillRect(-ast.w / 2, -ast.h / 2, ast.w, ast.h); // Draw centered rect
                 ctx.strokeStyle = '#554';
                 ctx.lineWidth = 1;
                 ctx.strokeRect(-ast.w / 2, -ast.h / 2, ast.w, ast.h);
                ctx.restore();
            });

            // Draw UI Text
            document.getElementById('score').textContent = `Score: ${gameState.score}`;
            document.getElementById('energy').textContent = `Shield: ${Math.floor(gameState.energy)}`;
            document.getElementById('wave').textContent = `Wave: ${gameState.wave}`;

            // Handle Game Over / Win Display
             if (gameState.gameOver) {
                  document.getElementById('final-score').textContent = `Final Score: ${gameState.score}`;
                  document.getElementById('game-over').classList.add('active');
             }
             // Add win condition logic if needed (e.g., reach wave X)
             /* else if (gameState.gameWon) {
                  document.getElementById('game-complete').classList.add('active');
             } */
        }

        // ============= Game Loop =============
        let animationFrameId = null;
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
             if (!gameState.gameStarted) {
                 animationFrameId = requestAnimationFrame(gameLoop); // Keep checking if started
                 return;
             }
            const deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            update(deltaTime);
            render();

            if (!gameState.gameOver) { // Continue loop if game not over
                animationFrameId = requestAnimationFrame(gameLoop);
            } else {
                 console.log("Stopping game loop due to Game Over.");
                 animationFrameId = null;
            }
        }

        // ============= Initialization =============
        function initGame() {
            console.log("Initializing Game...");
            gameState = createInitialState(); // Reset state
            gameState.player = createPlayer();
            gameState.stars = Array.from({ length: STAR_COUNT }, createStar); // Create stars
            lastTimestamp = performance.now(); // Reset timer
            // Spawn initial items maybe?
            for(let i=0; i<5; i++) gameState.fragments.push(createFragment());
            // Hide all overlays except start screen (if restarting)
            document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
            document.getElementById('start-screen').classList.add('active');
            setupMobileControls(); // Setup controls UI
        }

        // ============= Event Listeners =============
        window.addEventListener('keydown', (e) => {
            if(gameState.gameStarted) gameState.keysPressed.add(e.key.toLowerCase());
        });
        window.addEventListener('keyup', (e) => {
            if(gameState.gameStarted) {
                 gameState.keysPressed.delete(e.key.toLowerCase());
                 if (e.key === ' ') gameState.spaceHandled = false; // Reset space handled on key up
            }
        });

        document.getElementById('start-button').addEventListener('click', () => {
             if (!gameState.gameStarted) {
                 console.log("Start button clicked");
                 gameState.gameStarted = true;
                 gameState.gameOver = false; // Ensure not game over
                 document.getElementById('start-screen').classList.remove('active');
                 if (!animationFrameId) { // Start loop only if not already running
                     lastTimestamp = performance.now();
                     animationFrameId = requestAnimationFrame(gameLoop);
                     console.log("Game Loop Started.");
                 }
             }
        });

        document.getElementById('restart-button').addEventListener('click', () => {
            console.log("Restart button clicked");
            document.getElementById('game-over').classList.remove('active');
            initGame(); // Re-initialize
            // Game loop will be started by the 'start-button' logic again after initGame resets state
            document.getElementById('start-screen').classList.add('active'); // Show start screen again
        });

        // Initial call to set up
        initGame();

    </script>
</body>
</html>
