<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Zombie Survival 3D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; /* image-rendering: pixelated; affects child canvas if it were 2D */ }
        #gameCanvas3D { display: block; cursor: crosshair; } /* Renamed for clarity */
        #hud { position: absolute; color: #fff; padding: 8px; font-size: 13px; text-align: left; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.7); border-radius: 5px; border: 1px solid #444; z-index: 10; }
        #hud div { margin-bottom: 4px; }
        #fuel-bar { width: 90px; height: 8px; background-color: #333; margin: 3px 0; border: 1px solid #555; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #fuel-level { height: 100%; background-color: #3f3; width: 100%; transition: width 0.5s ease-out; }
        #health-bar { width: 90px; height: 8px; background-color: #500; margin: 3px 0; border: 1px solid #722; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #health-level { height: 100%; background-color: #f33; width: 100%; transition: width 0.2s linear; }
        #location { margin-top: 4px; }
        #mini-map { position: absolute; top: 10px; right: 10px; width: 120px; height: 120px; background-color: rgba(0, 0, 0, 0.75); border: 1px solid #444; border-radius: 5px; z-index: 10; overflow: hidden; }
        #mini-map canvas { display: block; }
        #controls-display { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #bbb; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #444; z-index: 10; white-space: nowrap; }
        #mission-text, #stats { display: none; } /* Hide placeholders */
        #weapon-display { position: absolute; bottom: 10px; right: 10px; color: #fff; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 13px; z-index: 10; }
        #vehicle-display { position: absolute; top: 40px; left: 10px; color: #fff; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 13px; z-index: 10; display: none;}
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 2D Canvas is no longer primary, 3D renderer's canvas will be appended here -->
        <!-- <canvas id="gameCanvas" width="800" height="600"></canvas> -->
        <div id="hud">
             <div id="health-line">HP: <div id="health-bar"><div id="health-level"></div></div></div>
             <div id="speed-line">SPD: <span id="speed">0</span></div>
             <div id="fuel-line">FUEL: <div id="fuel-bar"><div id="fuel-level"></div></div></div>
             <div id="location">LOCATION: UNKNOWN</div>
             <div id="enemy-count">ZOMBIES: <span id="enemies-left">0</span></div>
         </div>
         <div id="mini-map"></div>
         <div id="controls-display">
             WASD/Arrows: Move | E: Enter/Exit | F: Refuel | SPACE: Handbrake | SHIFT/Click: Fire | Q: Switch Weapon
         </div>
        <div id="weapon-display">WEAPON: PISTOL</div>
        <div id="vehicle-display">VEHICLE: NONE</div> <div id="mission-text"></div>
        <div id="stats"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Three.js Setup ---
        let scene, camera, renderer, clock;
        const gameCanvasWidth = 800;
        const gameCanvasHeight = 600;
        let groundPlane;
        const textureLoader = new THREE.TextureLoader();

        // Object to hold Three.js meshes associated with game objects
        const threeObjects = {
            player: null,
            enemies: [], // Will store { gameLogicEnemy, mesh }
            vehicles: [], // Will store { gameLogicVehicle, mesh }
            buildings: [],
            trees: [],
            obstacles: [],
            gasStations: [],
            projectiles: [],
            skidMarks: [],
            dustParticles: null, // Will be a THREE.Points object
            explosions: [], // Array of THREE.Points objects
            muzzleFlashes: [],
            hitSparks: []
        };

        const miniMapContainer = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMapContainer.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120; miniMapCtx.canvas.height = 120;

        // --- Audio Context --- (Kept from original)
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let engineNoiseOscillator = null;
        let engineNoiseGain = null;

        // --- Constants --- (Mostly kept, some values might need 3D adjustments)
        const PLAYER_PED_WIDTH = 0.6; // 3D units
        const PLAYER_PED_HEIGHT = 1.8; // 3D units (human height)
        const ENEMY_WIDTH = PLAYER_PED_WIDTH;
        const ENEMY_HEIGHT = PLAYER_PED_HEIGHT;

        const PROJECTILE_SPEED = 20; // 3D units per second (needs to relate to game speed)
        const PROJECTILE_LIFESPAN = 1.5; // Seconds
        const PROJECTILE_DAMAGE_PISTOL = 18;
        const PROJECTILE_DAMAGE_MACHINEGUN = 10;

        const ENEMY_HEALTH = 70;
        const ENEMY_SPEED = 1.2; // 3D units per second
        const ENEMY_CHASE_DIST = 25; // 3D units
        const ENEMY_ATTACK_DIST = 1.5; // 3D units
        const ENEMY_ATTACK_COOLDOWN = 60;
        const ENEMY_DAMAGE_MELEE = 8;

        const PLAYER_ENTER_VEHICLE_RANGE = 3; // 3D units
        const ANIM_SPEED = 8; // Original anim speed, adjust if needed

        const WEAPONS = {
            'pistol': { fireRate: 10, bulletSpread: 3, damage: PROJECTILE_DAMAGE_PISTOL, color: 0xffff00 },
            'machinegun': { fireRate: 5, bulletSpread: 8, damage: PROJECTILE_DAMAGE_MACHINEGUN, color: 0xffa500 }
        };

        const VEHICLE_TYPES = {
            'sedan': {
                width: 2, height: 1.5, depth: 4.0, // 3D dimensions (width, height, length/depth)
                maxSpeed: 15, acceleration: 3, deceleration: 2, handling: 1.5, // Units/sec^2, Radians/sec
                fuelConsumption: 0.02, color: 0x0066cc
            },
            'truck': {
                width: 2.5, height: 2.2, depth: 5.5,
                maxSpeed: 10, acceleration: 2, deceleration: 1, handling: 1.0,
                fuelConsumption: 0.03, color: 0x8b4513
            },
            'sportsCar': {
                width: 1.8, height: 1.3, depth: 3.8,
                maxSpeed: 22, acceleration: 5, deceleration: 2.5, handling: 1.8,
                fuelConsumption: 0.025, color: 0xdc143c
            },
            'buggy': {
                width: 1.9, height: 1.6, depth: 3.2,
                maxSpeed: 18, acceleration: 4, deceleration: 1.5, handling: 2.0,
                fuelConsumption: 0.018, color: 0x9acd32
            }
        };


        // --- Game State --- (Modified to include 3D specifics like Y-up)
        const gameState = {
            playerState: 'driving', // 'driving' or 'onFoot'
            player: {
                x: 150, z: 150, y_height: 0, // Use x, z for ground plane; y_height for vertical position if needed
                speed: 0, angle: 0, // Angle in radians for 3D
                fuelLevel: 100, health: 100, maxHealth: 100,
                pedWidth: PLAYER_PED_WIDTH, pedHeight: PLAYER_PED_HEIGHT, pedSpeed: 2.0, // m/s
                isMoving: false,
                animTimer: 0, animFrame: 0,
                animSpeed: ANIM_SPEED,
                fireCooldown: 0,
                currentWeapon: 'pistol',
                hasMachineGun: false,
                killedEnemiesCount: 0,
                // Current Vehicle Properties (copied when entering)
                // These dimensions are for 3D
                width: VEHICLE_TYPES.sedan.width,
                vehicle_height_prop: VEHICLE_TYPES.sedan.height, // Use specific name to avoid conflict
                depth: VEHICLE_TYPES.sedan.depth,
                maxSpeed: VEHICLE_TYPES.sedan.maxSpeed,
                acceleration: VEHICLE_TYPES.sedan.acceleration,
                deceleration: VEHICLE_TYPES.sedan.deceleration,
                handling: VEHICLE_TYPES.sedan.handling,
                fuelConsumption: VEHICLE_TYPES.sedan.fuelConsumption,
                color: VEHICLE_TYPES.sedan.color,
                currentVehicleType: 'sedan',
                mesh: null, // Will hold the THREE.Group for the player
                boundingBox: new THREE.Box3()
            },
            // Camera object in gameState.camera might not be needed if Three.js camera is global
            controls: { up: false, down: false, left: false, right: false, handbrake: false, refuel: false, fire: false, enterExit: false, enterExitProcessed: false, switchWeapon: false, switchWeaponProcessed: false, mouseFire: false },
            world: {
                width: 300, height: 300, // World dimensions in 3D units
                roadWidth: 6, grassColor: 0x8B8467,
                roadColor: 0x5A5240, lineColor: 0xA09888, lineWidth: 0.2,
                trees: [], buildings: [], obstacles: [], gasStations: [],
                vehicles: [], enemies: [], projectiles: [],
                impassableZones: [ { type: 'rocky', x: 220, z: 220, width: 50, depth: 60, height: 5, color: 0x5a5046 }, { type: 'ruins', x: 10, z: 10, width: 40, depth: 50, height: 8, color: 0x786e64 } ],
                startTime: Date.now()
            },
            fx: { // These will now hold data for 3D effects
                skidMarks: [], dustParticlesData: [], explosionsData: [], muzzleFlashesData: [], hitSparksData: []
            },
            zones: [ {name: "SCRAPYARD", x: 100, z: 100, radius: 60}, {name: "CAYON PASS", x: 60, z: 220, radius: 50}, {name: "DUST FLATS", x: 220, z: 180, radius: 40}, {name: "BROKEN CITY", x: 200, z: 50, radius: 35} ],
            gameOver: false
        };

        const roads = [ // (x1, z1) to (x2, z2) in 3D
            {x1: 0, z1: 100, x2: gameState.world.width, z2: 100},
            {x1: 0, z1: 200, x2: gameState.world.width, z2: 200},
            {x1: 100, z1: 0, x2: 100, z2: gameState.world.height},
            {x1: 200, z1: 0, x2: 200, z2: gameState.world.height},
            {x1: 50, z1: 50, x2: 70, z2: 70}, {x1: 80, z1: 80, x2: 150, z2: 150},
            {x1: 250, z1: 50, x2: 230, z2: 70}, {x1: 220, z1: 80, x2: 150, z2: 150},
            {x1: 50, z1: 250, x2: 70, z2: 230}, {x1: 80, z1: 220, x2: 150, z2: 150},
            {x1: 250, z1: 250, x2: 230, z2: 230}, {x1: 220, z1: 220, x2: 150, z2: 150},
        ];
        const roadTexture = createRoadTexture();

        // --- Input Handling --- (Largely the same, document listens to events)
        window.addEventListener('keydown', (e) => { handleKeyInput(e, true); });
        window.addEventListener('keyup', (e) => { handleKeyInput(e, false); });
        // Mouse fire needs re-evaluation in 3D, for now, same logic for onFoot player facing
        document.getElementById('game-container').addEventListener('mousedown', (e) => { if (e.button === 0) gameState.controls.mouseFire = true; });
        document.getElementById('game-container').addEventListener('mouseup', (e) => { if (e.button === 0) gameState.controls.mouseFire = false; });


        function handleKeyInput(e, isPressed) {
            const key = e.key.toLowerCase();
            switch(key) {
                case 'arrowup': case 'w': gameState.controls.up = isPressed; break;
                case 'arrowdown': case 's': gameState.controls.down = isPressed; break;
                case 'arrowleft': case 'a': gameState.controls.left = isPressed; break;
                case 'arrowright': case 'd': gameState.controls.right = isPressed; break;
                case ' ': gameState.controls.handbrake = isPressed; break;
                case 'f': gameState.controls.refuel = isPressed; break;
                case 'shift': gameState.controls.fire = isPressed; break;
                case 'e':
                    if (isPressed && !gameState.controls.enterExitProcessed) {
                        gameState.controls.enterExit = true;
                        gameState.controls.enterExitProcessed = true;
                    } else if (!isPressed) {
                        gameState.controls.enterExitProcessed = false;
                    }
                    break;
                case 'q':
                    if (isPressed && !gameState.controls.switchWeaponProcessed) {
                         gameState.controls.switchWeapon = true;
                         gameState.controls.switchWeaponProcessed = true;
                    } else if (!isPressed) {
                         gameState.controls.switchWeaponProcessed = false;
                    }
                    break;
            }
            if ((key === ' ' || key === 'shift' || key.startsWith('arrow') || ['w','a','s','d','e','f','q'].includes(key)) && isPressed) {
                 e.preventDefault();
            }
        }

        function handleWeaponSwitch() {
            if (!gameState.controls.switchWeapon || gameState.playerState !== 'onFoot') return;
            if (gameState.player.hasMachineGun) {
                gameState.player.currentWeapon = gameState.player.currentWeapon === 'pistol' ? 'machinegun' : 'pistol';
            }
            document.getElementById('weapon-display').textContent = `WEAPON: ${gameState.player.currentWeapon.toUpperCase()}`;
            gameState.controls.switchWeapon = false;
        }

        function handleEnterExitAction() {
            if (!gameState.controls.enterExit) return;
            const delta = clock.getDelta();

            if (gameState.playerState === 'driving') {
                // Remove old player vehicle mesh
                if (gameState.player.mesh) scene.remove(gameState.player.mesh);

                const parkedCarLogic = {
                    x: gameState.player.x, z: gameState.player.z,
                    width: gameState.player.width, height: gameState.player.vehicle_height_prop, depth: gameState.player.depth,
                    angle: gameState.player.angle, color: gameState.player.color,
                    maxSpeed: gameState.player.maxSpeed, handling: gameState.player.handling,
                    fuelLevel: gameState.player.fuelLevel,
                    type: gameState.player.currentVehicleType,
                    mesh: createVehicleMesh(gameState.player.currentVehicleType, gameState.player.color),
                    boundingBox: new THREE.Box3()
                };
                parkedCarLogic.mesh.position.set(parkedCarLogic.x, parkedCarLogic.height / 2, parkedCarLogic.z);
                parkedCarLogic.mesh.rotation.y = parkedCarLogic.angle;
                parkedCarLogic.boundingBox.setFromObject(parkedCarLogic.mesh);
                gameState.world.vehicles.push(parkedCarLogic);
                threeObjects.vehicles.push(parkedCarLogic.mesh);
                scene.add(parkedCarLogic.mesh);

                gameState.playerState = 'onFoot';
                const exitOffset = (gameState.player.width / 2) + 0.5 + gameState.player.pedWidth / 2;
                gameState.player.x += Math.sin(gameState.player.angle) * exitOffset;
                gameState.player.z += Math.cos(gameState.player.angle) * exitOffset; // Player angle 0 is +Z in 3D world for car
                gameState.player.speed = 0;

                // Create pedestrian mesh
                gameState.player.mesh = createCharacterMesh(true);
                gameState.player.mesh.position.set(gameState.player.x, gameState.player.pedHeight / 2, gameState.player.z);
                gameState.player.mesh.rotation.y = gameState.player.angle; // Initial orientation same as car
                scene.add(gameState.player.mesh);

                stopEngineNoise();
                document.getElementById('vehicle-display').style.display = 'none';
            } else if (gameState.playerState === 'onFoot') {
                let closestCarTuple = null;
                let minDistanceSq = PLAYER_ENTER_VEHICLE_RANGE * PLAYER_ENTER_VEHICLE_RANGE;

                for (let i = gameState.world.vehicles.length - 1; i >= 0; i--) {
                    const carLogic = gameState.world.vehicles[i];
                    const dx = gameState.player.x - carLogic.x;
                    const dz = gameState.player.z - carLogic.z;
                    const distanceSq = dx * dx + dz * dz;

                    if (distanceSq < minDistanceSq) {
                        minDistanceSq = distanceSq;
                        closestCarTuple = { logic: carLogic, index: i };
                    }
                }

                if (closestCarTuple) {
                    const closestCar = closestCarTuple.logic;
                    // Remove old player ped mesh
                    if (gameState.player.mesh) scene.remove(gameState.player.mesh);
                    // Remove parked car mesh from scene and tracking
                    scene.remove(closestCar.mesh);
                    const meshIndex = threeObjects.vehicles.indexOf(closestCar.mesh);
                    if (meshIndex > -1) threeObjects.vehicles.splice(meshIndex, 1);


                    gameState.playerState = 'driving';
                    gameState.player.x = closestCar.x;
                    gameState.player.z = closestCar.z;
                    gameState.player.width = closestCar.width;
                    gameState.player.vehicle_height_prop = closestCar.height;
                    gameState.player.depth = closestCar.depth;
                    gameState.player.angle = closestCar.angle;
                    gameState.player.color = closestCar.color;
                    gameState.player.maxSpeed = closestCar.maxSpeed;
                    gameState.player.acceleration = VEHICLE_TYPES[closestCar.type].acceleration;
                    gameState.player.deceleration = VEHICLE_TYPES[closestCar.type].deceleration;
                    gameState.player.handling = VEHICLE_TYPES[closestCar.type].handling;
                    gameState.player.fuelLevel = closestCar.fuelLevel;
                    gameState.player.fuelConsumption = VEHICLE_TYPES[closestCar.type].fuelConsumption;
                    gameState.player.speed = 0;
                    gameState.player.currentVehicleType = closestCar.type;

                    // Create new player vehicle mesh
                    gameState.player.mesh = createVehicleMesh(gameState.player.currentVehicleType, gameState.player.color);
                    gameState.player.mesh.position.set(gameState.player.x, gameState.player.vehicle_height_prop / 2, gameState.player.z);
                    gameState.player.mesh.rotation.y = gameState.player.angle;
                    scene.add(gameState.player.mesh);

                    gameState.world.vehicles.splice(closestCarTuple.index, 1);

                    startEngineNoise();
                    document.getElementById('vehicle-display').textContent = `VEHICLE: ${gameState.player.currentVehicleType.toUpperCase()}`;
                    document.getElementById('vehicle-display').style.display = '';
                }
            }
            gameState.controls.enterExit = false;
        }

        function handlePlayerFiring() {
            const currentWeaponProps = WEAPONS[gameState.player.currentWeapon];
            const isFiring = (gameState.controls.fire || gameState.controls.mouseFire) && gameState.playerState === 'onFoot';

            if (isFiring && gameState.player.fireCooldown <= 0) {
                const spreadRad = (Math.random() - 0.5) * currentWeaponProps.bulletSpread * (Math.PI / 180);
                const fireAngleRad = gameState.player.angle + spreadRad; // Player angle is already in radians

                // Muzzle position relative to player center
                const muzzleOffsetX = Math.sin(fireAngleRad) * (PLAYER_PED_WIDTH / 2 + 0.2);
                const muzzleOffsetZ = Math.cos(fireAngleRad) * (PLAYER_PED_WIDTH / 2 + 0.2); // For Z depth
                const startX = gameState.player.x + muzzleOffsetX;
                const startZ = gameState.player.z + muzzleOffsetZ;
                const startY = gameState.player.pedHeight * 0.75; // Muzzle height

                const projectileLogic = {
                    x: startX, y: startY, z: startZ,
                    vx: Math.sin(fireAngleRad) * PROJECTILE_SPEED,
                    vy: 0, // Projectiles are horizontal for now
                    vz: Math.cos(fireAngleRad) * PROJECTILE_SPEED,
                    lifespan: PROJECTILE_LIFESPAN, // seconds
                    timer: 0,
                    owner: 'player',
                    damage: currentWeaponProps.damage,
                    color: currentWeaponProps.color,
                    mesh: createProjectileMesh(currentWeaponProps.color),
                    boundingBox: new THREE.Box3()
                };
                projectileLogic.mesh.position.set(startX, startY, startZ);
                scene.add(projectileLogic.mesh);
                gameState.world.projectiles.push(projectileLogic);
                threeObjects.projectiles.push(projectileLogic.mesh);


                createMuzzleFlashEffect(startX, startY, startZ); // Pass 3D coords
                playShotSound(gameState.player.currentWeapon);
                gameState.player.fireCooldown = currentWeaponProps.fireRate;
            }

            if (gameState.player.fireCooldown > 0) {
                gameState.player.fireCooldown--;
            }
        }


        // --- Game Loop ---
        function gameLoop() {
            if (gameState.gameOver) {
                drawGameOver(); // This is HTML overlay, still fine
                requestAnimationFrame(gameLoop);
                return;
            }
            const delta = clock.getDelta(); // Time since last frame in seconds

            handleEnterExitAction(); // Needs delta if animations are involved
            handleWeaponSwitch();
            handlePlayerFiring(); // Needs delta if fire rate is time-based

            updateGame(delta);
            renderGame3D(); // New 3D render function
            requestAnimationFrame(gameLoop);
        }

        // --- Update Logic ---
        function updateGame(delta) { // Pass delta time
            updatePlayerPosition(delta);
            updateEnemies(delta);
            updateProjectiles(delta);
            updateCamera(); // Camera follows player mesh
            updateParticlesAndEffects3D(delta);
            updateHUD();
            checkGameOverCondition();
        }


        function updatePlayerPosition(delta) {
            const oldX = gameState.player.x;
            const oldZ = gameState.player.z;

            if (gameState.playerState === 'driving') {
                updateDrivingPhysics(delta);
                checkGasStations(delta); // Needs delta if fuel consumption is per second
                updateEngineNoise();
            } else if (gameState.playerState === 'onFoot') {
                updateWalkingPhysics(delta);
                stopEngineNoise();
                updateCharacterAnimation(gameState.player, gameState.player.mesh);
            }

            // Update player mesh position and rotation
            if (gameState.player.mesh) {
                gameState.player.mesh.position.set(gameState.player.x,
                    gameState.playerState === 'driving' ? gameState.player.vehicle_height_prop / 2 : gameState.player.pedHeight / 2,
                    gameState.player.z);
                gameState.player.mesh.rotation.y = gameState.player.angle;

                // Update bounding box for collisions
                gameState.player.boundingBox.setFromObject(gameState.player.mesh);
            }

            // Check collisions (pass delta if collision response depends on it)
            const collisionResult = checkCollisions(oldX, oldZ, gameState.player, gameState.playerState);
            if(collisionResult.collided){
                 gameState.player.x = collisionResult.newX;
                 gameState.player.z = collisionResult.newZ;
                 if (gameState.player.mesh) {
                    gameState.player.mesh.position.x = collisionResult.newX;
                    gameState.player.mesh.position.z = collisionResult.newZ;
                 }
            }
        }

        function updateDrivingPhysics(delta) {
            const player = gameState.player;
            const controls = gameState.controls;

            if (controls.up && player.fuelLevel > 0) {
                player.speed += player.acceleration * delta;
                player.fuelLevel -= player.fuelConsumption * (0.5 + Math.abs(player.speed) / player.maxSpeed) * delta * 60; // Scale factor based on original assumption of 60FPS
                if (Math.random() > 0.7 && Math.abs(player.speed) > 1) createDustParticleEffect(true);
            } else if (controls.down) {
                if (player.speed > 0.1) {
                    player.speed -= player.deceleration * 3 * delta;
                } else {
                    player.speed -= (player.acceleration / 1.5) * delta;
                    if (player.fuelLevel > 0) player.fuelLevel -= player.fuelConsumption * 0.5 * delta * 60;
                }
            } else {
                if (Math.abs(player.speed) < player.deceleration * delta) player.speed = 0;
                else if (player.speed > 0) player.speed -= player.deceleration * delta;
                else player.speed += player.deceleration * delta;
            }

            player.speed = Math.max(-player.maxSpeed / 2, Math.min(player.speed, player.maxSpeed));

            if (Math.abs(player.speed) > 0.1) { // Threshold to allow turning
                let steeringFactor = player.handling * (controls.handbrake ? 1.7 : 1.0);
                let speedModifier = 1.0 - (Math.abs(player.speed) / (player.maxSpeed * 1.5));
                speedModifier = Math.max(0.3, speedModifier);
                let turnDirection = player.speed >= 0 ? 1 : -1;

                if (controls.left) {
                    player.angle += steeringFactor * speedModifier * turnDirection * delta;
                    if (controls.handbrake && Math.abs(player.speed) > player.maxSpeed / 3) createSkidMarkEffect();
                }
                if (controls.right) {
                    player.angle -= steeringFactor * speedModifier * turnDirection * delta;
                    if (controls.handbrake && Math.abs(player.speed) > player.maxSpeed / 3) createSkidMarkEffect();
                }
            }
             if (player.angle > Math.PI) player.angle -= Math.PI * 2;
             if (player.angle < -Math.PI) player.angle += Math.PI * 2;


            if (controls.handbrake && Math.abs(player.speed) > 0.5) {
                player.speed *= (1 - 0.6 * delta); // More gradual braking
                if (Math.random() > 0.4) createSkidMarkEffect();
            }

            player.fuelLevel = Math.max(0, player.fuelLevel);

            if (Math.abs(player.speed) > 0.01) {
                player.x += Math.sin(player.angle) * player.speed * delta;
                player.z += Math.cos(player.angle) * player.speed * delta; // +Z is forward for angle 0
            }
        }


        function updateWalkingPhysics(delta) {
            const player = gameState.player;
            const controls = gameState.controls;
            let moveX = 0;
            let moveZ = 0; // Z for depth in 3D
            const currentSpeed = player.pedSpeed;

            if (controls.up) moveZ += currentSpeed;
            if (controls.down) moveZ -= currentSpeed;
            if (controls.left) moveX -= currentSpeed;
            if (controls.right) moveX += currentSpeed;

            player.isMoving = (Math.abs(moveX) > 0.01 || Math.abs(moveZ) > 0.01);

            if (moveX !== 0 || moveZ !== 0) { // Normalize for diagonal movement
                 if (moveX !== 0 && moveZ !== 0) {
                    const factor = currentSpeed / Math.sqrt(moveX * moveX + moveZ * moveZ);
                    moveX *= factor;
                    moveZ *= factor;
                 }
                 // Determine angle based on input relative to world, not camera
                 player.angle = Math.atan2(moveX, moveZ); // atan2(x, z) gives angle for y-rotation
            }


            player.x += moveX * delta;
            player.z += moveZ * delta;


            // Animation timer (original logic for frame indexing)
            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer >= player.animSpeed) {
                    player.animTimer = 0;
                    player.animFrame = (player.animFrame + 1) % 4;
                }
            } else {
                player.animFrame = 0;
                player.animTimer = 0;
            }
        }


        function updateCharacterAnimation(entityLogic, entityMesh) {
            if (!entityMesh || !entityMesh.getObjectByName) return; // Mesh not ready or not a character mesh

            const leftLeg = entityMesh.getObjectByName('leftLeg');
            const rightLeg = entityMesh.getObjectByName('rightLeg');
            if (!leftLeg || !rightLeg) return;

            const legYOffset = -entityLogic.pedHeight * 0.3; // Base Y position for legs
            const stride = entityLogic.pedHeight * 0.15; // How far a leg moves

            if (!entityLogic.isMoving) {
                leftLeg.position.z = 0;
                rightLeg.position.z = 0;
                leftLeg.position.y = legYOffset;
                rightLeg.position.y = legYOffset;
            } else {
                const frame = entityLogic.animFrame;
                // Simplified: 0 & 2 are "together", 1 is left forward, 3 is right forward
                if (frame === 0 || frame === 2) {
                    leftLeg.position.z = 0;        rightLeg.position.z = 0;
                    leftLeg.position.y = legYOffset; rightLeg.position.y = legYOffset;
                } else if (frame === 1) { // Left leg forward
                    leftLeg.position.z = stride;   rightLeg.position.z = -stride;
                    leftLeg.position.y = legYOffset - stride * 0.2; rightLeg.position.y = legYOffset + stride * 0.1;

                } else { // Frame 3: Right leg forward
                    leftLeg.position.z = -stride;  rightLeg.position.z = stride;
                    leftLeg.position.y = legYOffset + stride * 0.1; rightLeg.position.y = legYOffset - stride * 0.2;
                }
            }
        }

        function spawnEnemy(x, z) {
            const enemyLogic = {
                x: x, z: z, y_height: ENEMY_HEIGHT / 2,
                health: ENEMY_HEALTH, maxHealth: ENEMY_HEALTH,
                width: ENEMY_WIDTH, height: ENEMY_HEIGHT, speed: ENEMY_SPEED, angle: 0,
                colorVal: Math.random() * 0xffffff, // Random color for the mesh
                state: 'idle', aiTimer: Math.random() * 120, attackCooldown: ENEMY_ATTACK_COOLDOWN,
                isMoving: false, animTimer: 0, animFrame: 0, animSpeed: ANIM_SPEED,
                mesh: createCharacterMesh(false, Math.floor(0x66ff66 * Math.random() + 0x226622)), // Greenish hue
                boundingBox: new THREE.Box3(),
                healthBarMesh: createHealthBarMesh()
            };
            enemyLogic.mesh.position.set(x, ENEMY_HEIGHT / 2, z);
            scene.add(enemyLogic.mesh);

            // Health bar positioning
            enemyLogic.healthBarMesh.position.set(x, ENEMY_HEIGHT + 0.3, z); // Above head
            scene.add(enemyLogic.healthBarMesh);

            gameState.world.enemies.push(enemyLogic);
            threeObjects.enemies.push(enemyLogic.mesh); // For easy removal from scene if needed elsewhere
        }


        function updateEnemies(delta) {
            for (let i = gameState.world.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.world.enemies[i];
                const oldX = enemy.x; const oldZ = enemy.z;

                const dxPlayer = gameState.player.x - enemy.x;
                const dzPlayer = gameState.player.z - enemy.z;
                const distSqPlayer = dxPlayer * dxPlayer + dzPlayer * dzPlayer;
                const distPlayer = Math.sqrt(distSqPlayer);

                let targetAngleRad = Math.atan2(dxPlayer, dzPlayer); // Angle towards player
                enemy.isMoving = false;

                if (enemy.state === 'idle') {
                    enemy.aiTimer -= delta * 60; // Scale timer based on original 60FPS assumption
                    if (distSqPlayer < ENEMY_CHASE_DIST * ENEMY_CHASE_DIST) {
                        enemy.state = 'chasing';
                    } else if (enemy.aiTimer <= 0) {
                        enemy.aiTimer = 120 + Math.random() * 120;
                    }
                } else if (enemy.state === 'chasing') {
                    if (distSqPlayer > (ENEMY_CHASE_DIST + 5) * (ENEMY_CHASE_DIST + 5)) {
                        enemy.state = 'idle'; enemy.aiTimer = 60;
                    } else {
                        enemy.angle = targetAngleRad;
                        if (distPlayer > ENEMY_ATTACK_DIST * 0.8) {
                            enemy.x += Math.sin(enemy.angle) * enemy.speed * delta;
                            enemy.z += Math.cos(enemy.angle) * enemy.speed * delta;
                            enemy.isMoving = true;
                        }

                        if (distPlayer < ENEMY_ATTACK_DIST && enemy.attackCooldown <= 0 && gameState.playerState === 'onFoot') {
                            gameState.player.health -= ENEMY_DAMAGE_MELEE;
                            enemy.attackCooldown = ENEMY_ATTACK_COOLDOWN / (delta * 60 || 1) ; // Time based cooldown
                             createHitSparksEffect(gameState.player.x, gameState.player.pedHeight/2, gameState.player.z, 0xff0000); // Player hit spark
                        }
                    }
                }

                if (enemy.isMoving) {
                    enemy.animTimer++;
                    if (enemy.animTimer >= enemy.animSpeed) {
                        enemy.animTimer = 0;
                        enemy.animFrame = (enemy.animFrame + 1) % 4;
                    }
                } else {
                    enemy.animFrame = 0; enemy.animTimer = 0;
                }
                updateCharacterAnimation(enemy, enemy.mesh);


                if (enemy.attackCooldown > 0) enemy.attackCooldown -= delta * 60;


                const collisionResult = checkCollisions(oldX, oldZ, enemy, 'enemy');
                 if(collisionResult.collided){
                    enemy.x = collisionResult.newX;
                    enemy.z = collisionResult.newZ;
                    if (enemy.state === 'chasing') enemy.state = 'idle'; // Stop if hit wall
                 }


                enemy.mesh.position.set(enemy.x, enemy.height / 2, enemy.z);
                enemy.mesh.rotation.y = enemy.angle;
                enemy.boundingBox.setFromObject(enemy.mesh);

                // Update health bar
                enemy.healthBarMesh.position.set(enemy.x, enemy.height + 0.3, enemy.z);
                enemy.healthBarMesh.lookAt(camera.position); // Make it face the camera
                const healthScale = Math.max(0, enemy.health / enemy.maxHealth);
                enemy.healthBarMesh.children[1].scale.x = healthScale; // children[1] is the green part
                enemy.healthBarMesh.children[1].position.x = - (1 - healthScale) * 0.5; // Keep left aligned


                if (enemy.health <= 0) {
                    createExplosionEffect(enemy.x, enemy.height / 2, enemy.z, 0x8B0000, 0.6);
                    scene.remove(enemy.mesh);
                    scene.remove(enemy.healthBarMesh);
                    gameState.world.enemies.splice(i, 1);
                    // Note: threeObjects.enemies still holds reference, ideally clean this too
                    gameState.player.killedEnemiesCount++;
                }
            }
        }

        function updateProjectiles(delta) {
            for (let i = gameState.world.projectiles.length - 1; i >= 0; i--) {
                const p = gameState.world.projectiles[i];
                if (p.owner !== 'player') {
                    // Cleanup non-player projectiles (if any introduced later)
                    scene.remove(p.mesh);
                    gameState.world.projectiles.splice(i, 1);
                    // Also remove from threeObjects.projectiles
                    const meshIdx = threeObjects.projectiles.indexOf(p.mesh);
                    if (meshIdx > -1) threeObjects.projectiles.splice(meshIdx,1);
                    continue;
                }

                p.x += p.vx * delta;
                p.y += p.vy * delta; // For potential vertical movement later
                p.z += p.vz * delta;
                p.timer += delta;

                p.mesh.position.set(p.x, p.y, p.z);
                p.boundingBox.setFromObject(p.mesh); // Assuming projectile mesh defines its bounds

                let hit = false;
                let hitWall = false;

                // Collision vs Enemies
                for (let j = gameState.world.enemies.length - 1; j >= 0; j--) {
                    const enemy = gameState.world.enemies[j];
                    if (p.boundingBox.intersectsBox(enemy.boundingBox)) {
                        enemy.health -= p.damage;
                        hit = true;
                        createExplosionEffect(p.x, p.y, p.z, p.color, 0.4); // Enemy hit splash
                        break;
                    }
                }

                // Collision vs World Geometry
                if (!hit) {
                    const worldGeometry = [
                        ...gameState.world.buildings.map(b => b.boundingBox),
                        ...gameState.world.obstacles.map(o => o.boundingBox),
                        ...gameState.world.impassableZones.map(iz => iz.boundingBox)
                    ];
                    for (const objBox of worldGeometry) {
                        if (p.boundingBox.intersectsBox(objBox)) {
                            hit = true;
                            hitWall = true;
                            break;
                        }
                    }
                }

                // World boundaries
                if (p.x < 0 || p.x > gameState.world.width || p.z < 0 || p.z > gameState.world.height) {
                    hit = true;
                    hitWall = true;
                }

                if (p.timer >= p.lifespan || hit) {
                    if (hitWall) {
                        createHitSparksEffect(p.x, p.y, p.z);
                    }
                    scene.remove(p.mesh);
                    gameState.world.projectiles.splice(i, 1);
                    const meshIdx = threeObjects.projectiles.indexOf(p.mesh);
                    if (meshIdx > -1) threeObjects.projectiles.splice(meshIdx,1);
                }
            }
        }


        // --- Collision ---
        function checkCollisions(oldX, oldZ, entity, entityType) {
            const isDriving = entityType === 'driving';
            const isPed = entityType === 'onFoot' || entityType === 'enemy';

            // Use entity's current boundingBox, assuming it's updated
            const entityBox = entity.boundingBox;
            let collisionOccurred = false;
            let finalX = entity.x;
            let finalZ = entity.z;

            // World boundaries (simple clamping for now)
            const halfWidth = (entityBox.max.x - entityBox.min.x) / 2;
            const halfDepth = (entityBox.max.z - entityBox.min.z) / 2;

            if (entity.x - halfWidth < 0) { finalX = halfWidth; collisionOccurred = true;}
            if (entity.z - halfDepth < 0) { finalZ = halfDepth; collisionOccurred = true;}
            if (entity.x + halfWidth > gameState.world.width) { finalX = gameState.world.width - halfWidth; collisionOccurred = true;}
            if (entity.z + halfDepth > gameState.world.height) { finalZ = gameState.world.height - halfDepth; collisionOccurred = true;}

            if (collisionOccurred && isDriving) entity.speed *= -0.4;
            else if (collisionOccurred && entityType === 'enemy') entity.state = 'idle';


            const objectsToTest = [
                ...gameState.world.buildings,
                ...gameState.world.obstacles,
                ...gameState.world.impassableZones
            ];

            // Temporarily update entity's box to its new potential position for checking
            const tempBox = entityBox.clone(); // Use current entity box
                                            // no need to translate, its already updated from entity.x, entity.z
                                            // (in updatePlayer and updateEnemy BEFORE this function)


            for (const obj of objectsToTest) {
                 // Check X-axis collision
                 tempBox.min.x = entity.x - halfWidth; tempBox.max.x = entity.x + halfWidth;
                 tempBox.min.z = oldZ - halfDepth; tempBox.max.z = oldZ + halfDepth; // Keep Z old for X check

                if (tempBox.intersectsBox(obj.boundingBox)) {
                    collisionOccurred = true;
                    finalX = oldX; // Revert X
                    if (isDriving) entity.speed *= -0.5; // Bounce effect
                    else if (entityType === 'enemy') entity.state = 'idle'; // Stop enemy
                    // For player, the calling function will handle position reversion if needed
                    // but good to signal the reversion requirement
                    // Update tempBox to reflect reversion for Z check.
                    tempBox.min.x = oldX - halfWidth; tempBox.max.x = oldX + halfWidth;
                }

                // Check Z-axis collision
                tempBox.min.x = finalX - halfWidth; tempBox.max.x = finalX + halfWidth; // Use potentially reverted X
                tempBox.min.z = entity.z - halfDepth; tempBox.max.z = entity.z + halfDepth;

                if (tempBox.intersectsBox(obj.boundingBox)) {
                    collisionOccurred = true;
                    finalZ = oldZ; // Revert Z
                    if (isDriving) entity.speed *= -0.5;
                    else if (entityType === 'enemy') entity.state = 'idle';
                }
                if (finalX === oldX && finalZ === oldZ && collisionOccurred) break; // Full stop if reverted on both axes due to one object
            }
            return { collided: collisionOccurred, newX: finalX, newZ: finalZ };
        }


        function checkGasStations(delta) {
            if (gameState.playerState !== 'driving' || !gameState.controls.refuel) return;
            for (const station of gameState.world.gasStations) {
                const dx = gameState.player.x - (station.x + station.width / 2);
                const dz = gameState.player.z - (station.z + station.depth / 2); // Use depth for Z
                const distanceSq = dx * dx + dz * dz;
                // Station effective radius, somewhat larger than its visual box
                const stationInteractionRadius = Math.max(station.width, station.depth) * 1.5;
                if (distanceSq < stationInteractionRadius * stationInteractionRadius) {
                    gameState.player.fuelLevel += 1.5 * delta * 60; // Rate of refueling
                    if (gameState.player.fuelLevel > 100) gameState.player.fuelLevel = 100;
                    break;
                }
            }
        }

        function checkLocation() {
            let currentZone = null; let closestDistance = Infinity;
            for (const zone of gameState.zones) {
                const dx = gameState.player.x - zone.x;
                const dz = gameState.player.z - zone.z; // Z for 3D
                const distance = Math.sqrt(dx * dx + dz * dz);
                if (distance < zone.radius && distance < closestDistance) {
                    closestDistance = distance; currentZone = zone;
                }
            }
            document.getElementById('location').textContent = `LOC: ${currentZone ? currentZone.name : 'WASTELAND'}`;
        }
        function checkGameOverCondition() { if (gameState.player.health <= 0 && !gameState.gameOver) { gameState.gameOver = true; stopEngineNoise(); } }

        // --- Effects ---
        function createSkidMarkEffect() {
            if (gameState.playerState !== 'driving' || !gameState.player.mesh) return;
            // Skid mark position slightly behind one of the rear wheels
            const skidWidth = 0.2;
            const skidLength = 1.5 + Math.abs(gameState.player.speed * 0.05);
            const rearAxleOffset = -gameState.player.depth * 0.4; // Offset from car center to rear axle
            const wheelTrackOffset = gameState.player.width * 0.4 * (Math.random() > 0.5 ? 1 : -1); // Left or right wheel

            const localSkidPos = new THREE.Vector3(wheelTrackOffset, 0.01, rearAxleOffset); // Slight Y offset to avoid z-fighting
            const worldSkidPos = localSkidPos.applyMatrix4(gameState.player.mesh.matrixWorld);

            const skidGeo = new THREE.PlaneGeometry(skidWidth, skidLength);
            const skidMat = new THREE.MeshBasicMaterial({
                color: 0x111111,
                transparent: true,
                opacity: 0.4 + Math.random() * 0.2,
                side: THREE.DoubleSide
            });
            const skidMesh = new THREE.Mesh(skidGeo, skidMat);
            skidMesh.position.copy(worldSkidPos);
            skidMesh.rotation.x = -Math.PI / 2; // Align with ground
            skidMesh.rotation.z = gameState.player.angle + Math.PI/2; // Orient with car. Note: Car's Y rotation is player.angle


            scene.add(skidMesh);
            gameState.fx.skidMarks.push({ mesh: skidMesh, life: 150 + Math.random() * 100, initialOpacity: skidMat.opacity }); // Life in frames

            if (gameState.fx.skidMarks.length > 50) { // Limit total skid marks
                const oldest = gameState.fx.skidMarks.shift();
                scene.remove(oldest.mesh);
                oldest.mesh.geometry.dispose();
                oldest.mesh.material.dispose();
            }
        }


        function createDustParticleEffect(isDrivingEffect = true) {
            if (!gameState.player.mesh) return;

            const particleCount = isDrivingEffect ? 5 : 2;
            const basePos = new THREE.Vector3();
            gameState.player.mesh.getWorldPosition(basePos); // Get world position of player/vehicle center

            // Offset particles slightly behind if driving
            if (isDrivingEffect) {
                const backwardOffset = new THREE.Vector3(0,0, -gameState.player.depth * 0.6).applyQuaternion(gameState.player.mesh.quaternion);
                basePos.add(backwardOffset);
            }
            basePos.y = 0.2; // Dust rises from ground

            for (let i = 0; i < particleCount; i++) {
                gameState.fx.dustParticlesData.push({
                    position: new THREE.Vector3(
                        basePos.x + (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5),
                        basePos.y + (Math.random() - 0.5) * 0.3,
                        basePos.z + (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5)
                    ),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * (isDrivingEffect ? 0.5 : 0.2),
                        Math.random() * 0.5 + 0.1, // Upwards
                        (Math.random() - 0.5) * (isDrivingEffect ? 0.5 : 0.2)
                    ),
                    alpha: 0.5 + Math.random() * 0.3,
                    life: 20 + Math.random() * 20, // frames
                    size: isDrivingEffect ? 0.2 + Math.random() * 0.5 : 0.1 + Math.random() * 0.2,
                    color: new THREE.Color(0xA08C6E) // Wasteland dust color
                });
            }
            if (gameState.fx.dustParticlesData.length > 200) { // Limit total particles
                gameState.fx.dustParticlesData.splice(0, gameState.fx.dustParticlesData.length - 200);
            }
            updateDustParticlesMesh();
        }


        function createExplosionEffect(x, y, z, color = 0xffa500, scale = 1.0) {
             const particleCount = 15 + Math.floor(Math.random() * 10);
             const explosionData = { particles: [], life: 30 + Math.random() * 30, initialLife: 0 }; // frames
             explosionData.initialLife = explosionData.life;

             for (let i = 0; i < particleCount; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const elevation = (Math.random() - 0.5) * Math.PI; // Spread in 3D
                 const speed = (0.5 + Math.random() * 2) * scale;
                 explosionData.particles.push({
                     position: new THREE.Vector3(x, y, z),
                     velocity: new THREE.Vector3(
                         Math.cos(angle) * Math.cos(elevation) * speed,
                         Math.sin(elevation) * speed,
                         Math.sin(angle) * Math.cos(elevation) * speed
                     ),
                     alpha: 0.7 + Math.random() * 0.3,
                     size: (0.1 + Math.random() * 0.3) * scale,
                     color: new THREE.Color(color)
                 });
             }
             gameState.fx.explosionsData.push(explosionData);
             if (gameState.fx.explosionsData.length > 20) { // Max concurrent explosions
                 gameState.fx.explosionsData.shift();
             }
             updateExplosionParticlesMesh(); // This will manage one THREE.Points for all explosions
        }


        function createMuzzleFlashEffect(x, y, z) {
            const flash = {
                position: new THREE.Vector3(x, y, z),
                size: 0.8 + Math.random() * 0.5,
                alpha: 1.0,
                life: 2, // Very short life in frames
                color: new THREE.Color(0xffdc96)
            };
            gameState.fx.muzzleFlashesData.push(flash);
            if (gameState.fx.muzzleFlashesData.length > 10) {
                gameState.fx.muzzleFlashesData.shift();
            }
            updateMuzzleFlashMesh();
        }


        function createHitSparksEffect(x, y, z, color = 0xffda99) {
            const particleCount = 5 + Math.floor(Math.random() * 5);
             for (let i = 0; i < particleCount; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const elevation = (Math.random() - 0.5) * Math.PI;
                 const speed = 0.8 + Math.random() * 1.5;
                 gameState.fx.hitSparksData.push({
                     position: new THREE.Vector3(x, y, z),
                     velocity: new THREE.Vector3(
                         Math.cos(angle) * Math.cos(elevation) * speed,
                         Math.sin(elevation) * speed,
                         Math.sin(angle) * Math.cos(elevation) * speed
                     ),
                     alpha: 1.0,
                     life: 10 + Math.random() * 10, // frames
                     size: 0.05 + Math.random() * 0.1,
                     color: new THREE.Color(color)
                 });
             }
             if (gameState.fx.hitSparksData.length > 100) {
                 gameState.fx.hitSparksData.splice(0, gameState.fx.hitSparksData.length - 100);
             }
             updateHitSparksMesh();
        }


        function updateParticlesAndEffects3D(delta) {
            const deltaFrames = delta * 60; // Approximate frames passed

            // Skid Marks
            for (let i = gameState.fx.skidMarks.length - 1; i >= 0; i--) {
                const skid = gameState.fx.skidMarks[i];
                skid.life -= deltaFrames;
                skid.mesh.material.opacity = skid.initialOpacity * (skid.life / (150 + 80)); // Fade out
                if (skid.life <= 0 || skid.mesh.material.opacity <= 0) {
                    scene.remove(skid.mesh);
                    skid.mesh.geometry.dispose();
                    skid.mesh.material.dispose();
                    gameState.fx.skidMarks.splice(i, 1);
                }
            }
            // Dust, Explosions, MuzzleFlashes, HitSparks call their respective update mesh functions
            // These functions will handle their own particle data updates and mesh rebuilds
            updateDustParticlesMesh(delta);
            updateExplosionParticlesMesh(delta);
            updateMuzzleFlashMesh(delta);
            updateHitSparksMesh(delta);
        }


        // Functions to update THREE.Points meshes (called from updateParticlesAndEffects3D)
        function updatePointSystem(pointsDataArray, pointsMeshName, delta, defaultSize = 0.1, dragFactor = 0.98, gravityFactor = 0.0) {
            const positions = [];
            const colors = [];
            const sizes = [];

            for (let i = pointsDataArray.length - 1; i >= 0; i--) {
                const p = pointsDataArray[i];
                p.position.addScaledVector(p.velocity, delta);
                p.velocity.multiplyScalar(Math.pow(dragFactor, delta*60));
                if(gravityFactor !== 0) p.velocity.y -= gravityFactor * delta;


                p.life -= delta * 60; // Assuming 60fps base for life
                p.alpha -= 0.03 * delta * 60; // Fade rate

                if (p.life <= 0 || p.alpha <= 0) {
                    pointsDataArray.splice(i, 1);
                } else {
                    positions.push(p.position.x, p.position.y, p.position.z);
                    colors.push(p.color.r, p.color.g, p.color.b);
                    sizes.push(p.size * (p.alpha > 0 ? p.alpha : 0)); // Scale size by alpha for fadeout
                }
            }

            let mesh = threeObjects[pointsMeshName];
            if (!mesh && positions.length > 0) { // Create mesh if it doesn't exist
                const geometry = new THREE.BufferGeometry();
                const material = new THREE.PointsMaterial({
                    size: defaultSize,
                    vertexColors: true,
                    transparent: true,
                    opacity: 1, // Opacity is handled by alpha in color/size
                    sizeAttenuation: true,
                    // map: createCircleTexture(), // Optional: use a texture for rounder particles
                    // depthWrite: false, // If transparency issues
                    // blending: THREE.AdditiveBlending // For bright effects like sparks
                });
                mesh = new THREE.Points(geometry, material);
                threeObjects[pointsMeshName] = mesh;
                scene.add(mesh);
            }

            if (mesh) {
                if (positions.length === 0) { // No particles, hide mesh
                    mesh.visible = false;
                } else {
                    mesh.visible = true;
                    mesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    mesh.geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    mesh.geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1)); // Custom attribute for shader
                    mesh.geometry.attributes.position.needsUpdate = true;
                    mesh.geometry.attributes.color.needsUpdate = true;
                    mesh.geometry.attributes.size.needsUpdate = true; // If using custom shader for size

                    // For PointsMaterial standard size handling, update material.size if it's uniform,
                    // or ensure sizeAttenuation correctly uses 'size' attribute if you have a custom shader.
                    // If not using a custom shader for size, you may need to remove the 'size' attribute
                    // or manage particle sizes differently. Standard PointsMaterial has one 'size' for all points.
                    // To have per-particle size without custom shader, one would typically create separate
                    // THREE.Points objects or use sprites. Here, we use the attribute, assuming it can be leveraged

        // Re-paste sound functions because they were large and identical
        function playShotSound(weaponType) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);

            if (weaponType === 'pistol') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            } else if (weaponType === 'machinegun') {
                 oscillator.type = 'square';
                 oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                 gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
            }

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.15);
        }
        function startEngineNoise() {
             if (!engineNoiseOscillator) {
                 engineNoiseOscillator = audioContext.createOscillator();
                 engineNoiseGain = audioContext.createGain();
                 engineNoiseOscillator.type = 'sawtooth';
                 engineNoiseOscillator.frequency.setValueAtTime(100, audioContext.currentTime);
                 engineNoiseGain.gain.setValueAtTime(0.05, audioContext.currentTime);
                 engineNoiseOscillator.connect(engineNoiseGain);
                 engineNoiseGain.connect(audioContext.destination);
                 engineNoiseOscillator.start();
             }
        }
        function updateEngineNoise() {
             if (engineNoiseOscillator && gameState.playerState === 'driving') {
                 const speedFactor = Math.abs(gameState.player.speed) / gameState.player.maxSpeed;
                 const frequency = 100 + speedFactor * 200;
                 const volume = 0.05 + speedFactor * 0.1;
                 engineNoiseOscillator.frequency.linearRampToValueAtTime(frequency, audioContext.currentTime + 0.1);
                 engineNoiseGain.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.1);
             }
        }
        function stopEngineNoise() {
             if (engineNoiseOscillator) {
                 engineNoiseGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
                 engineNoiseOscillator.stop(audioContext.currentTime + 0.5);
                 engineNoiseOscillator = null; engineNoiseGain = null;
             }
        }


        // --- Camera ---
        function updateCamera() {
            if (!gameState.player.mesh) return;
            const playerPosition = new THREE.Vector3();
            gameState.player.mesh.getWorldPosition(playerPosition);

            // Desired camera offset based on player state and orientation
            let offset;
            let lookAtTarget = playerPosition.clone();

            if (gameState.playerState === 'driving') {
                offset = new THREE.Vector3(0, 8, -12); // Higher and further back for cars
            } else { // onFoot
                offset = new THREE.Vector3(0, 6, -7);  // Closer for pedestrian view
            }

            // Apply player's rotation to the offset vector
            const rotatedOffset = offset.clone().applyQuaternion(gameState.player.mesh.quaternion);
            const desiredCameraPosition = playerPosition.clone().add(rotatedOffset);

            // Smoothly interpolate camera position
            camera.position.lerp(desiredCameraPosition, 0.1);

            // Smoothly interpolate lookAt target (e.g., a point slightly in front of the player)
            const forwardLookOffset = new THREE.Vector3(0, 1, gameState.playerState === 'driving' ? 3 : 1);
            const rotatedLookOffset = forwardLookOffset.applyQuaternion(gameState.player.mesh.quaternion);
            const desiredLookAt = playerPosition.clone().add(rotatedLookOffset);

            // It's common to have camera.target be a Vector3 you lerp, then call camera.lookAt(camera.target)
            // For simplicity here, just lerping the target point for lookAt directly.
            const currentLookAt = new THREE.Vector3(); // Need a persistent variable if you want to lerp this too.
                                                      // For now, look directly or with simple lerp:
            const lerpedLookAtTarget = lookAtTarget.lerp(desiredLookAt, 0.1);
            camera.lookAt(lerpedLookAtTarget);


            // Prevent camera from going below ground (simple y clamping)
            if (camera.position.y < 0.5) {
                camera.position.y = 0.5;
            }
        }

             // Shadow plane

            const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 });

        function createVehicleMesh(type, color) {
            const props = VEHICLE_TYPES[type];
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({ color: color });

            // Main body
            const bodyGeo = new THREE.BoxGeometry(props.width, props.height, props.depth);
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(bodyMesh);

            // Simple cabin for sedans/trucks
            if (type === 'sedan' || type === 'truck' || type === 'sportsCar') {
                const cabinHeight = props.height * 0.6;
                const cabinWidth = props.width * 0.8;
                const cabinDepth = props.depth * (type === 'truck' ? 0.4 : 0.5);
                const cabinGeo = new THREE.BoxGeometry(cabinWidth, cabinHeight, cabinDepth);
                const cabinMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(color).offsetHSL(0,0,0.1) }); // Slightly lighter/darker
                const cabinMesh = new THREE.Mesh(cabinGeo, cabinMat);
                cabinMesh.position.y = props.height / 2 - cabinHeight / 2 +0.1; // On top of main body
                cabinMesh.position.z = props.depth * (type === 'truck' ? 0.25 : 0.1); // Shifted forward
                group.add(cabinMesh);

                // Windows (simple dark planes or boxes)
                const windowMat = new THREE.MeshBasicMaterial({color: 0x111122, transparent: true, opacity: 0.5});
                const windshieldGeo = new THREE.BoxGeometry(cabinWidth*0.9, cabinHeight*0.7, 0.1);
                const windshield = new THREE.Mesh(windshieldGeo, windowMat);
                windshield.position.set(cabinMesh.position.x, cabinMesh.position.y, cabinMesh.position.z + cabinDepth/2);
                windshield.rotation.x = -0.3; // Slanted
                group.add(windshield);
            }
            if (type === 'buggy'){
                const rollCageMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
                const barGeo = new THREE.CylinderGeometry(0.05, 0.05, props.depth*0.8, 6);

                const topFrontBar = new THREE.Mesh(barGeo, rollCageMat);
                topFrontBar.position.set(0, props.height * 0.8, props.depth * 0.1);
                topFrontBar.scale.x = props.width / (props.depth * 0.8); // Hacky way to get width from length
                topFrontBar.rotation.z = Math.PI/2;

                const barGeoSide = new THREE.CylinderGeometry(0.05, 0.05, props.height, 6);
                const leftBar = new THREE.Mesh(barGeoSide, rollCageMat);
                leftBar.position.set(-props.width/2 *0.8, props.height*0.3, 0);
                leftBar.rotation.z = 0.3;
                group.add(leftBar);
                const rightBar = leftBar.clone();
                rightBar.position.x *= -1;
                rightBar.rotation.z *= -1;
                group.add(rightBar);


                group.add(topFrontBar);
            }


            // Wheels
            const wheelRadius = Math.min(props.width, props.height) * 0.3;
            const wheelWidth = wheelRadius * 0.5;
            const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelWidth, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });

            const wheelPositions = [
                new THREE.Vector3(props.width / 2 + wheelWidth/2, -props.height/2 + wheelRadius, props.depth / 2 * 0.7), // Front-Right
                new THREE.Vector3(-props.width / 2 - wheelWidth/2, -props.height/2+ wheelRadius, props.depth / 2 * 0.7), // Front-Left
                new THREE.Vector3(props.width / 2+ wheelWidth/2, -props.height/2+ wheelRadius, -props.depth / 2 * 0.7), // Rear-Right
                new THREE.Vector3(-props.width / 2- wheelWidth/2, -props.height/2+ wheelRadius, -props.depth / 2 * 0.7)  // Rear-Left
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.copy(pos);
                wheel.rotation.z = Math.PI / 2; // Orient cylinder to roll along Z axis of car
                group.add(wheel);
            });

            // Shadow plane
            const shadowGeo = new THREE.PlaneGeometry(props.width * 1.2, props.depth * 1.2);
            const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 });
            const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
            shadowMesh.rotation.x = -Math.PI / 2;
            shadowMesh.position.y = -props.height / 2 + 0.01; // Slightly above ground for the vehicle group
            group.add(shadowMesh);


            return group;
        }

        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            const size = 128; // Texture size
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = `#${gameState.world.roadColor.toString(16).padStart(6,'0')}`;
            ctx.fillRect(0, 0, size, size);

            // Dashed line
            ctx.strokeStyle = `#${gameState.world.lineColor.toString(16).padStart(6,'0')}`;
            ctx.lineWidth = gameState.world.lineWidth * (size / gameState.world.roadWidth) * 3; // Scale line width
            ctx.setLineDash([15, 15]); // Dashes
            ctx.beginPath();
            ctx.moveTo(size / 2, 0);
            ctx.lineTo(size / 2, size);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }



        function drawMiniMap() { /* ... original, but use entity.x, entity.z ... */
            const mapScaleX = miniMapCtx.canvas.width / gameState.world.width;
            const mapScaleZ = miniMapCtx.canvas.height / gameState.world.height; // Use height for Z scale if world not square

            miniMapCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            miniMapCtx.fillRect(0, 0, miniMapCtx.canvas.width, miniMapCtx.canvas.height);

            // Impassable Zones
            gameState.world.impassableZones.forEach(zone => {
                miniMapCtx.fillStyle = `#${zone.color.toString(16).padStart(6,'0')}${Math.floor(0.6*255).toString(16).padStart(2,'0')}`; // Original uses rgba string
                miniMapCtx.fillRect(zone.x * mapScaleX, zone.z * mapScaleZ, zone.width * mapScaleX, zone.depth * mapScaleZ);
            });

            // Roads
            miniMapCtx.strokeStyle = `#${gameState.world.lineColor.toString(16).padStart(6,'0')}`;
            miniMapCtx.lineWidth = 1.5;
            roads.forEach(road => {
                miniMapCtx.beginPath();
                miniMapCtx.moveTo(road.x1 * mapScaleX, road.z1 * mapScaleZ);
                miniMapCtx.lineTo(road.x2 * mapScaleX, road.z2 * mapScaleZ);
                miniMapCtx.stroke();
            });

            // Gas Stations
            miniMapCtx.fillStyle = '#ff3333';
            gameState.world.gasStations.forEach(s => {
                miniMapCtx.fillRect(s.x * mapScaleX - 1.5, s.z * mapScaleZ - 1.5, 3, 3);
            });

            // Parked Vehicles
            miniMapCtx.fillStyle = '#aaa';
            gameState.world.vehicles.forEach(car => { // these are logic objects
                miniMapCtx.fillRect(car.x * mapScaleX - 1, car.z * mapScaleZ - 1, 2, 2);
            });

            // Enemies
            miniMapCtx.fillStyle = '#008000';
            gameState.world.enemies.forEach(e => { // these are logic objects
                miniMapCtx.fillRect(e.x * mapScaleX -1, e.z * mapScaleZ -1, 2, 2);
            });

            // Player
            const playerMapX = gameState.player.x * mapScaleX;
            const playerMapZ = gameState.player.z * mapScaleZ;
            miniMapCtx.fillStyle = gameState.playerState === 'driving' ? '#0f0' : '#ff0';
            if (gameState.playerState === 'driving') {
                miniMapCtx.beginPath();
                miniMapCtx.arc(playerMapX, playerMapZ, 2.5, 0, Math.PI * 2);
                miniMapCtx.fill();
            } else {
                miniMapCtx.fillRect(playerMapX - 1, playerMapZ - 1, 2, 2);
            }

            // Player direction (angle 0 is +Z)
            const dirLen = 4;
            miniMapCtx.strokeStyle = miniMapCtx.fillStyle;
            miniMapCtx.lineWidth = 1;
            miniMapCtx.beginPath();
            miniMapCtx.moveTo(playerMapX, playerMapZ);
            miniMapCtx.lineTo(playerMapX + Math.sin(gameState.player.angle) * dirLen,
                              playerMapZ + Math.cos(gameState.player.angle) * dirLen);
            miniMapCtx.stroke();

            // Camera view frustum approximation (very simplified)
            const camFOVRadians = camera.fov * (Math.PI / 180);
            const camAspect = camera.aspect;
            // This is very rough. A proper frustum projection is more complex.
            const viewWidthAtPlayer = 2 * (camera.position.y / Math.cos(camera.rotation.x)) * Math.tan(camFOVRadians / 2) * camAspect /2 ; // Estimate on ground plane
            const viewDepthAtPlayer = viewWidthAtPlayer / camAspect / 2;

            // Position of what camera is looking at (roughly)
            const lookVec = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const distToGround = camera.position.y / Math.max(0.01, -lookVec.y); // project to y=0
            const cameraFocusMapX = (camera.position.x + lookVec.x * distToGround) * mapScaleX;
            const cameraFocusMapZ = (camera.position.z + lookVec.z * distToGround) * mapScaleZ;


            miniMapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            miniMapCtx.lineWidth = 1;
            // Simplified view rect center at player, size based on original logic's canvas dimensions scaled.
            const miniCamWidth = gameCanvasWidth/gameState.world.width * miniMapCtx.canvas.width /10; // Example scale
            const miniCamHeight = gameCanvasHeight/gameState.world.height * miniMapCtx.canvas.height /10; // Example scale

            miniMapCtx.strokeRect(
                 playerMapX - miniCamWidth/2,
                 playerMapZ - miniCamHeight/2,
                 miniCamWidth,
                 miniCamHeight
            );
        }
