<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://partlydecent.github.io/ORDINARY-TECHNOLOGY/banner2.jpg">
    <meta property="og:image:alt" content="GTA 1 Style Driving Game">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:url" content="https://partlydecent.github.io/ORDINARY-TECHNOLOGY/">
    <meta property="og:type" content="website">
    <title>GTA 1-Style Action Sim</title>
    <style>
        /* CSS remains largely the same as the previous version */
        body { margin: 0; padding: 0; background-color: #111; overflow: hidden; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; /* Adjusted in JS */ }
        #gameCanvas { border: 2px solid #444; background-color: #000; display: block; image-rendering: pixelated; cursor: crosshair; /* Cursor for shooting */ }
        #hud { position: absolute; color: #fff; padding: 8px; font-size: 13px; text-align: left; top: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.65); border-radius: 5px; border: 1px solid #444; z-index: 10; }
        #hud div { margin-bottom: 4px; }
        #fuel-bar { width: 90px; height: 8px; background-color: #333; margin: 3px 0; border: 1px solid #555; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #fuel-level { height: 100%; background-color: #3f3; width: 100%; transition: width 0.5s ease-out; }
        #health-bar { width: 90px; height: 8px; background-color: #500; /* Red background */ margin: 3px 0; border: 1px solid #722; overflow: hidden; border-radius: 2px; display: inline-block; vertical-align: middle; }
        #health-level { height: 100%; background-color: #f33; /* Bright red health */ width: 100%; transition: width 0.2s linear; }
        #location { margin-top: 4px; }
        #mini-map { position: absolute; top: 10px; right: 10px; width: 120px; height: 120px; background-color: rgba(0, 0, 0, 0.75); border: 1px solid #444; border-radius: 5px; z-index: 10; overflow: hidden; }
        #mini-map canvas { display: block; }
        #controls-display { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #bbb; background-color: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 5px; font-size: 11px; text-align: center; border: 1px solid #444; z-index: 10; white-space: nowrap; }
        /* Placeholders - Hidden by default unless needed */
        #mission-text { display: none; position: absolute; bottom: 40px; left: 10px; color: white; background-color: rgba(0, 0, 0, 0.7); padding: 5px 10px; font-size: 14px; max-width: 780px; z-index: 10; border-radius: 5px; }
        #stats { display: none; position: absolute; top: 140px; right: 10px; color: white; font-size: 14px; text-align: right; background-color: rgba(0, 0, 0, 0.6); padding: 5px; border-radius: 5px; border: 1px solid #444; z-index: 10; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="hud">
             <div id="health-line">HP: <div id="health-bar"><div id="health-level"></div></div></div>
             <div id="speed-line">SPD: <span id="speed">0</span></div>
             <div id="fuel-line">FUEL: <div id="fuel-bar"><div id="fuel-level"></div></div></div>
             <div id="location">LOCATION: UNKNOWN</div>
             <div id="enemy-count">ENEMIES: <span id="enemies-left">0</span></div>
         </div>
         <div id="mini-map"></div>
         <div id="controls-display">
             WASD/Arrows: Move | E: Enter/Exit | F: Refuel | SPACE: Handbrake | SHIFT: Fire
         </div>

        <div id="mission-text"></div>
        <div id="stats"></div>
    </div>

    <script>
        // --- Canvas and Context ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniMapContainer = document.getElementById('mini-map');
        const miniMapCtx = document.createElement('canvas').getContext('2d');
        miniMapContainer.appendChild(miniMapCtx.canvas);
        miniMapCtx.canvas.width = 120; miniMapCtx.canvas.height = 120;

        // --- Game State ---
        const gameState = {
            playerState: 'driving', // 'driving' or 'onFoot'
            player: {
                x: 1500, y: 1500, width: 20, height: 36, speed: 0, maxSpeed: 5,
                acceleration: 0.1, deceleration: 0.05, handling: 3.5, angle: 0,
                fuelLevel: 100, fuelConsumption: 0.02, color: '#0066cc',
                health: 100, maxHealth: 100, // Added health
                pedWidth: 10, pedHeight: 15, pedSpeed: 1.5,
                isWalking: false, walkAnimTimer: 0, walkAnimFrame: 0, walkAnimSpeed: 8,
                fireCooldown: 0, fireRate: 15 // Fire every 15 frames
            },
            camera: { x: 0, y: 0, width: canvas.width, height: canvas.height },
            controls: {
                up: false, down: false, left: false, right: false,
                handbrake: false, refuel: false, fire: false, // Added fire control
                enterExit: false, enterExitProcessed: false
            },
            world: {
                width: 3000, height: 3000, roadWidth: 60, grassColor: '#1a3d0c',
                roadColor: '#333', lineColor: '#fff', lineWidth: 2,
                trees: [], buildings: [], obstacles: [], gasStations: [],
                vehicles: [], enemies: [], projectiles: [], // Added enemies and projectiles
                startTime: Date.now()
            },
            fx: { skidMarks: [], dustParticles: [], explosions: [] }, // Added explosions
            zones: [ /* ... zone data ... */
                {name: "DOWNTOWN", x: 1000, y: 1000, radius: 600},
                {name: "FOREST HILLS", x: 600, y: 2200, radius: 500},
                {name: "EASTERN PLAINS", x: 2200, y: 1800, radius: 400},
                {name: "INDUSTRIAL PARK", x: 2000, y: 500, radius: 350}
             ],
            gameOver: false
        };

        // --- Constants ---
        const PROJECTILE_SPEED = 7;
        const PROJECTILE_LIFESPAN = 70; // Frames
        const PROJECTILE_DAMAGE = 15;
        const ENEMY_HEALTH = 50;
        const ENEMY_SPEED = 1.2;
        const ENEMY_CHASE_DIST = 300;
        const ENEMY_SHOOT_DIST = 200; // Enemies don't shoot in this version yet

        // --- Roads Data ---
        const roads = [ /* ... road data ... */
             {x1: 0, y1: 1000, x2: gameState.world.width, y2: 1000}, {x1: 0, y1: 2000, x2: gameState.world.width, y2: 2000},
             {x1: 1000, y1: 0, x2: 1000, y2: gameState.world.height}, {x1: 2000, y1: 0, x2: 2000, y2: gameState.world.height},
             {x1: 500, y1: 500, x2: 1500, y2: 1500}, {x1: 2500, y1: 500, x2: 1500, y2: 1500},
             {x1: 500, y1: 2500, x2: 1500, y2: 1500}, {x1: 2500, y1: 2500, x2: 1500, y2: 1500},
             {x1: 200, y1: 1000, x2: 500, y2: 1200}, {x1: 2800, y1: 1000, x2: 2500, y2: 1200},
             {x1: 200, y1: 2000, x2: 500, y2: 1800}, {x1: 2800, y1: 2000, x2: 2500, y2: 1800}
        ];

        // --- Input Handling ---
        window.addEventListener('keydown', (e) => { handleKeyInput(e, true); });
        window.addEventListener('keyup', (e) => { handleKeyInput(e, false); });
        // Use 'shift' for firing
        function handleKeyInput(e, isPressed) {
            const key = e.key.toLowerCase();
            switch(key) {
                case 'arrowup': case 'w': gameState.controls.up = isPressed; break;
                case 'arrowdown': case 's': gameState.controls.down = isPressed; break;
                case 'arrowleft': case 'a': gameState.controls.left = isPressed; break;
                case 'arrowright': case 'd': gameState.controls.right = isPressed; break;
                case ' ': gameState.controls.handbrake = isPressed; break;
                case 'f': gameState.controls.refuel = isPressed; break;
                case 'shift': gameState.controls.fire = isPressed; break; // Fire key
                case 'e':
                    if (isPressed && !gameState.controls.enterExitProcessed) {
                        gameState.controls.enterExit = true; gameState.controls.enterExitProcessed = true;
                    } else if (!isPressed) { gameState.controls.enterExitProcessed = false; }
                    break;
            }
            if ((key === ' ' || key === 'shift' || key.startsWith('arrow')) && isPressed) e.preventDefault();
        }

        // --- Enter/Exit Vehicle Logic ---
        function handleEnterExitAction() { /* ... Same as previous version ... */
             if (!gameState.controls.enterExit) return;
             if (gameState.playerState === 'driving') {
                 const parkedCar = { x: gameState.player.x, y: gameState.player.y, width: gameState.player.width, height: gameState.player.height, angle: gameState.player.angle, color: gameState.player.color, maxSpeed: gameState.player.maxSpeed, handling: gameState.player.handling, fuelLevel: gameState.player.fuelLevel };
                 gameState.world.vehicles.push(parkedCar);
                 gameState.playerState = 'onFoot';
                 const exitOffset = (gameState.player.width / 2) + 5 + gameState.player.pedWidth / 2;
                 const exitAngleRad = (gameState.player.angle - 90) * Math.PI / 180;
                 gameState.player.x += Math.cos(exitAngleRad) * exitOffset;
                 gameState.player.y += Math.sin(exitAngleRad) * exitOffset;
                 gameState.player.speed = 0;
             } else if (gameState.playerState === 'onFoot') {
                 let closestCar = null; let minDistanceSq = 40 * 40;
                 for (let i = gameState.world.vehicles.length - 1; i >= 0; i--) {
                     const car = gameState.world.vehicles[i];
                     const dx = gameState.player.x - car.x; const dy = gameState.player.y - car.y;
                     const distanceSq = dx * dx + dy * dy;
                     if (distanceSq < minDistanceSq) { minDistanceSq = distanceSq; closestCar = car; closestCar.index = i; }
                 }
                 if (closestCar) {
                     gameState.playerState = 'driving';
                     gameState.player.x = closestCar.x; gameState.player.y = closestCar.y; gameState.player.width = closestCar.width; gameState.player.height = closestCar.height; gameState.player.angle = closestCar.angle; gameState.player.color = closestCar.color; gameState.player.maxSpeed = closestCar.maxSpeed; gameState.player.handling = closestCar.handling; gameState.player.fuelLevel = closestCar.fuelLevel; gameState.player.speed = 0;
                     gameState.world.vehicles.splice(closestCar.index, 1);
                 }
             }
             gameState.controls.enterExit = false;
        }

        // --- Player Firing Logic ---
        function handlePlayerFiring() {
            if (gameState.playerState === 'onFoot' && gameState.controls.fire && gameState.player.fireCooldown <= 0) {
                const angleRad = gameState.player.angle * Math.PI / 180;
                const muzzleOffsetX = Math.sin(angleRad) * (gameState.player.pedWidth / 2 + 5);
                const muzzleOffsetY = -Math.cos(angleRad) * (gameState.player.pedHeight / 2 + 5);

                gameState.world.projectiles.push({
                    x: gameState.player.x + muzzleOffsetX,
                    y: gameState.player.y + muzzleOffsetY,
                    vx: Math.sin(angleRad) * PROJECTILE_SPEED,
                    vy: -Math.cos(angleRad) * PROJECTILE_SPEED,
                    lifespan: PROJECTILE_LIFESPAN,
                    owner: 'player',
                    damage: PROJECTILE_DAMAGE,
                    color: '#ff0' // Yellow bullets
                });
                gameState.player.fireCooldown = gameState.player.fireRate;
                // Add optional firing sound effect here
            }
            // Decrease cooldown timer
            if (gameState.player.fireCooldown > 0) {
                gameState.player.fireCooldown--;
            }
        }

        // --- Game Loop ---
        function gameLoop() {
            if (gameState.gameOver) {
                drawGameOver();
                requestAnimationFrame(gameLoop); // Keep loop running for potential restart
                return;
            }
            handleEnterExitAction();
            handlePlayerFiring();
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        // --- Update Logic ---
        function updateGame() {
            updatePlayerPosition();
            updateEnemies(); // Update AI
            updateProjectiles(); // Update bullets
            updateCamera();
            updateParticlesAndEffects(); // Combined particle/explosion updates
            updateHUD();
            // checkGameOver(); // Check win/loss conditions
        }

        // --- Player Update ---
        function updatePlayerPosition() { /* ... Includes walking animation update from previous step ... */
            const oldX = gameState.player.x; const oldY = gameState.player.y;
            if (gameState.playerState === 'driving') { updateDrivingPhysics(); checkGasStations(); }
            else if (gameState.playerState === 'onFoot') { updateWalkingPhysics(); }
            checkCollisions(oldX, oldY, gameState.player, gameState.playerState); // Pass entity for collision
        }

        function updateDrivingPhysics() { /* ... Same as previous version ... */
             if (gameState.controls.up && gameState.player.fuelLevel > 0) { gameState.player.speed += gameState.player.acceleration; gameState.player.fuelLevel -= gameState.player.fuelConsumption * (0.5 + Math.abs(gameState.player.speed) / gameState.player.maxSpeed); if (Math.random() > 0.7 && Math.abs(gameState.player.speed) > 1) createDustParticle(true); }
             else if (gameState.controls.down) { if (gameState.player.speed > 0.1) gameState.player.speed -= gameState.player.deceleration * 3; else { gameState.player.speed -= gameState.player.acceleration / 1.5; if (gameState.player.fuelLevel > 0) gameState.player.fuelLevel -= gameState.player.fuelConsumption * 0.5; } }
             else { if (Math.abs(gameState.player.speed) < gameState.player.deceleration) gameState.player.speed = 0; else if (gameState.player.speed > 0) gameState.player.speed -= gameState.player.deceleration; else gameState.player.speed += gameState.player.deceleration; }
             if (gameState.player.speed > gameState.player.maxSpeed) gameState.player.speed = gameState.player.maxSpeed; const maxReverseSpeed = gameState.player.maxSpeed / 2; if (gameState.player.speed < -maxReverseSpeed) gameState.player.speed = -maxReverseSpeed;
             if (Math.abs(gameState.player.speed) > 0.5) { let steeringFactor = gameState.player.handling * (gameState.controls.handbrake ? 1.7 : 1); let speedModifier = 1.0 - (Math.abs(gameState.player.speed) / (gameState.player.maxSpeed * 1.5)); speedModifier = Math.max(0.3, speedModifier); let turnDirection = gameState.player.speed >= 0 ? 1 : -1; if (gameState.controls.left) { gameState.player.angle -= steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } if (gameState.controls.right) { gameState.player.angle += steeringFactor * speedModifier * turnDirection; if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > gameState.player.maxSpeed / 3) createSkidMark(); } }
             if (gameState.controls.handbrake && Math.abs(gameState.player.speed) > 0.5) { gameState.player.speed *= 0.94; if (Math.random() > 0.4) createSkidMark(); }
             if (gameState.player.fuelLevel < 0) gameState.player.fuelLevel = 0;
             if (Math.abs(gameState.player.speed) > 0.01) { const radians = gameState.player.angle * Math.PI / 180; gameState.player.x += Math.sin(radians) * gameState.player.speed; gameState.player.y -= Math.cos(radians) * gameState.player.speed; }
        }

        function updateWalkingPhysics() { /* ... Includes animation timer update ... */
             let moveX = 0; let moveY = 0; const speed = gameState.player.pedSpeed;
             if (gameState.controls.up) moveY -= speed; if (gameState.controls.down) moveY += speed; if (gameState.controls.left) moveX -= speed; if (gameState.controls.right) moveX += speed;
             gameState.player.isWalking = (Math.abs(moveX) > 0.01 || Math.abs(moveY) > 0.01);
             if (moveX !== 0 && moveY !== 0) { const factor = speed / Math.sqrt(moveX * moveX + moveY * moveY); moveX *= factor; moveY *= factor; }
             if (gameState.player.isWalking) { gameState.player.angle = (Math.atan2(moveX, -moveY) * 180 / Math.PI); }
             gameState.player.x += moveX; gameState.player.y += moveY;
             if (gameState.player.isWalking) { gameState.player.walkAnimTimer++; if (gameState.player.walkAnimTimer >= gameState.player.walkAnimSpeed) { gameState.player.walkAnimTimer = 0; gameState.player.walkAnimFrame = 1 - gameState.player.walkAnimFrame; } }
             else { gameState.player.walkAnimFrame = 0; gameState.player.walkAnimTimer = 0; }
        }

        // --- Enemy Logic (Simplified) ---
        function spawnEnemy(x, y) {
            gameState.world.enemies.push({
                x: x, y: y, health: ENEMY_HEALTH, maxHealth: ENEMY_HEALTH,
                width: 12, height: 18, speed: ENEMY_SPEED, angle: 0,
                color: `hsl(${Math.random() * 60}, 70%, 50%)`, // Red/Orange/Yellow hues
                state: 'idle', // 'idle', 'chasing'
                aiTimer: Math.random() * 120 // Timer for state changes/actions
            });
        }

        function updateEnemies() {
            for (let i = gameState.world.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.world.enemies[i];
                const oldX = enemy.x; const oldY = enemy.y;

                const dxPlayer = gameState.player.x - enemy.x;
                const dyPlayer = gameState.player.y - enemy.y;
                const distSqPlayer = dxPlayer * dxPlayer + dyPlayer * dyPlayer;

                // State transitions
                if (enemy.state === 'idle') {
                    enemy.aiTimer--;
                    if (distSqPlayer < ENEMY_CHASE_DIST * ENEMY_CHASE_DIST) {
                        enemy.state = 'chasing';
                    } else if (enemy.aiTimer <= 0) {
                        // Optional: Wander slightly? For now, just stay idle.
                        enemy.aiTimer = 120 + Math.random() * 120;
                    }
                } else if (enemy.state === 'chasing') {
                    if (distSqPlayer > (ENEMY_CHASE_DIST + 50) * (ENEMY_CHASE_DIST + 50)) { // Lose player
                        enemy.state = 'idle';
                        enemy.aiTimer = 60;
                    } else {
                        // Move towards player (no obstacle avoidance)
                        const angleToPlayer = Math.atan2(dyPlayer, dxPlayer);
                        enemy.angle = angleToPlayer * 180 / Math.PI + 90; // Point towards player
                        enemy.x += Math.cos(angleToPlayer) * enemy.speed;
                        enemy.y += Math.sin(angleToPlayer) * enemy.speed;
                        // Enemy shooting logic would go here if implemented
                    }
                }

                // Collision check for enemy
                checkCollisions(oldX, oldY, enemy, 'enemy');

                 // Check health
                 if (enemy.health <= 0) {
                     createExplosion(enemy.x, enemy.y, enemy.color); // Simple death effect
                     gameState.world.enemies.splice(i, 1); // Remove dead enemy
                 }
            }
        }

        // --- Projectile Logic ---
        function updateProjectiles() {
             for (let i = gameState.world.projectiles.length - 1; i >= 0; i--) {
                 const p = gameState.world.projectiles[i];
                 p.x += p.vx;
                 p.y += p.vy;
                 p.lifespan--;

                 let hit = false;

                 // Check collision with enemies (if shot by player)
                 if (p.owner === 'player') {
                     for (let j = gameState.world.enemies.length - 1; j >= 0; j--) {
                         const enemy = gameState.world.enemies[j];
                         const dx = p.x - enemy.x;
                         const dy = p.y - enemy.y;
                         // Simple distance check to enemy center
                         if (dx * dx + dy * dy < (enemy.width * 0.8) * (enemy.width * 0.8)) { // Generous hit radius
                             enemy.health -= p.damage;
                             hit = true;
                             break; // Projectile hits one enemy
                         }
                     }
                 }
                 // Add check for collision with player (if shot by enemy - not implemented yet)
                 /* else if (p.owner === 'enemy') { ... } */

                 // Check collision with buildings/obstacles (basic)
                 if (!hit) {
                     for(const building of gameState.world.buildings) {
                          if (p.x > building.x && p.x < building.x + building.width && p.y > building.y && p.y < building.y + building.height) {
                              hit = true; break;
                          }
                     }
                     if (!hit) {
                         for(const obstacle of gameState.world.obstacles) {
                              if (p.x > obstacle.x && p.x < obstacle.x + obstacle.width && p.y > obstacle.y && p.y < obstacle.y + obstacle.height) {
                                  hit = true; break;
                              }
                         }
                     }
                 }


                 // Remove projectile if lifespan ends or it hits something
                 if (p.lifespan <= 0 || hit) {
                      if (hit) createExplosion(p.x, p.y, p.color, 0.5); // Smaller explosion on hit
                     gameState.world.projectiles.splice(i, 1);
                 }
             }
         }

        // --- Collision (Refactored) ---
        function checkCollisions(oldX, oldY, entity, entityType) {
            // Define bounds based on type
            const isDriving = entityType === 'driving';
            const isPlayer = entityType === 'driving' || entityType === 'onFoot';
            const isEnemy = entityType === 'enemy';

            const pW = isDriving ? entity.width : (isPlayer ? entity.pedWidth : entity.width);
            const pH = isDriving ? entity.height : (isPlayer ? entity.pedHeight : entity.height);

            const entityRect = { x: entity.x - pW / 2, y: entity.y - pH / 2, width: pW, height: pH };

            let collisionOccurred = false;

            // 1. World Boundaries
            let bounced = false;
            if (entityRect.x < 0) { entityRect.x = 0; bounced = true; }
            if (entityRect.y < 0) { entityRect.y = 0; bounced = true; }
            if (entityRect.x + pW > gameState.world.width) { entityRect.x = gameState.world.width - pW; bounced = true; }
            if (entityRect.y + pH > gameState.world.height) { entityRect.y = gameState.world.height - pH; bounced = true; }

            entity.x = entityRect.x + pW / 2;
            entity.y = entityRect.y + pH / 2;

            if (bounced && isDriving) {
                entity.speed *= -0.4;
            } else if (bounced && isEnemy) {
                // Enemy might need different boundary behavior (e.g., change direction)
                entity.state = 'idle'; // Simple reset
            }


            // 2. Object Collision (Buildings, Obstacles)
            const objects = [...gameState.world.buildings, ...gameState.world.obstacles];
            for (const obj of objects) {
                const objRect = { x: obj.x, y: obj.y, width: obj.width, height: obj.height };
                if (isCollidingAABB(entityRect, objRect)) {
                    collisionOccurred = true;
                     // Revert position to before collision
                     entity.x = oldX;
                     entity.y = oldY;
                    if (isDriving) {
                        entity.speed *= -0.5; // Bounce car
                        createDustParticle(false); createDustParticle(false);
                    } else if (isPlayer || isEnemy) {
                        // Pedestrian/Enemy simple stop (already reverted position)
                         if (isEnemy) entity.state = 'idle'; // Force idle if stuck
                    }
                    break;
                }
            }
             return collisionOccurred;
        }

        function isCollidingAABB(rect1, rect2) { /* ... Same as previous ... */
             return ( rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y );
        }
        function checkGasStations() { /* ... Same as previous ... */
             if (gameState.playerState !== 'driving') return; if (gameState.controls.refuel) { for (const station of gameState.world.gasStations) { const dx = gameState.player.x - (station.x + station.width / 2); const dy = gameState.player.y - (station.y + station.height / 2); const distanceSq = dx * dx + dy * dy; if (distanceSq < 70 * 70) { gameState.player.fuelLevel += 1.5; if (gameState.player.fuelLevel > 100) gameState.player.fuelLevel = 100; break; } } }
        }
        function checkLocation() { /* ... Same as previous ... */
             let currentZone = null; let closestDistance = Infinity; for (const zone of gameState.zones) { const dx = gameState.player.x - zone.x; const dy = gameState.player.y - zone.y; const distance = Math.sqrt(dx * dx + dy * dy); if (distance < zone.radius && distance < closestDistance) { closestDistance = distance; currentZone = zone; } } document.getElementById('location').textContent = `LOC: ${currentZone ? currentZone.name : 'COUNTRYSIDE'}`;
        }

        // --- Effects ---
        function createSkidMark() { /* ... Same as previous ... */
             if (gameState.playerState !== 'driving') return; const radians = gameState.player.angle * Math.PI / 180; const wheelOffset = gameState.player.height * 0.3; gameState.fx.skidMarks.push({ x: gameState.player.x - Math.sin(radians) * wheelOffset, y: gameState.player.y + Math.cos(radians) * wheelOffset, angle: gameState.player.angle, alpha: 0.7 + Math.random() * 0.2, width: 2 + Math.abs(gameState.player.speed * 0.5), life: 200 + Math.random() * 100 }); if (gameState.fx.skidMarks.length > 150) gameState.fx.skidMarks.shift();
        }
        function createDustParticle(isDrivingEffect = true) { /* ... Same as previous ... */
             const pAngle = gameState.player.angle * Math.PI / 180; const offsetDist = isDrivingEffect ? gameState.player.height / 2 : 5; const baseX = gameState.player.x - Math.sin(pAngle) * offsetDist; const baseY = gameState.player.y + Math.cos(pAngle) * offsetDist; gameState.fx.dustParticles.push({ x: baseX + (Math.random() - 0.5) * (isDrivingEffect ? 15 : 5), y: baseY + (Math.random() - 0.5) * (isDrivingEffect ? 15 : 5), size: isDrivingEffect ? 2 + Math.random() * 5 : 1 + Math.random() * 2, alpha: 0.6 + Math.random() * 0.2, life: 25 + Math.random() * 25, vx: (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5), vy: (Math.random() - 0.5) * (isDrivingEffect ? 1.5 : 0.5) }); if (gameState.fx.dustParticles.length > 80) gameState.fx.dustParticles.shift();
        }
        function createExplosion(x, y, color = '#ffa500', scale = 1.0) {
            const particles = 15 + Math.floor(Math.random() * 10);
             for (let i = 0; i < particles; i++) {
                 const angle = Math.random() * Math.PI * 2;
                 const speed = 1 + Math.random() * 3 * scale;
                 gameState.fx.explosions.push({
                     x: x, y: y,
                     vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                     size: (2 + Math.random() * 4) * scale,
                     alpha: 0.8 + Math.random() * 0.2,
                     life: 20 + Math.random() * 20, // Shorter life for explosions
                     color: color
                 });
             }
        }

        function updateParticlesAndEffects() {
            // Dust
            for (let i = gameState.fx.dustParticles.length - 1; i >= 0; i--) { const p = gameState.fx.dustParticles[i]; p.x += p.vx; p.y += p.vy; p.life--; p.alpha -= 0.025; if (p.life <= 0 || p.alpha <= 0) gameState.fx.dustParticles.splice(i, 1); }
            // Skids
            for (let i = gameState.fx.skidMarks.length - 1; i >= 0; i--) { const s = gameState.fx.skidMarks[i]; s.alpha -= 0.002; s.life--; if (s.alpha <= 0 || s.life <= 0) gameState.fx.skidMarks.splice(i, 1); }
             // Explosions
             for (let i = gameState.fx.explosions.length - 1; i >= 0; i--) {
                 const p = gameState.fx.explosions[i];
                 p.x += p.vx; p.y += p.vy;
                 p.vx *= 0.97; p.vy *= 0.97; // Slow down
                 p.life--; p.alpha -= 0.04; // Fade faster
                 if (p.life <= 0 || p.alpha <= 0) gameState.fx.explosions.splice(i, 1);
             }
        }

        // --- Camera ---
        function updateCamera() { /* ... Same smooth lerp as previous ... */
             const targetX = gameState.player.x - canvas.width / 2; const targetY = gameState.player.y - canvas.height / 2; const lerpFactor = 0.1; gameState.camera.x += (targetX - gameState.camera.x) * lerpFactor; gameState.camera.y += (targetY - gameState.camera.y) * lerpFactor; gameState.camera.x = Math.max(0, Math.min(gameState.camera.x, gameState.world.width - canvas.width)); gameState.camera.y = Math.max(0, Math.min(gameState.camera.y, gameState.world.height - canvas.height));
        }

        // --- HUD Update ---
        function updateHUD() {
            // Player Health
            document.getElementById('health-level').style.width = `${Math.max(0, (gameState.player.health / gameState.player.maxHealth) * 100)}%`;
            // Speed/Fuel only if driving
             const showDrivingUI = gameState.playerState === 'driving';
             document.getElementById('speed-line').style.display = showDrivingUI ? '' : 'none';
             document.getElementById('fuel-line').style.display = showDrivingUI ? '' : 'none';
             if (showDrivingUI) {
                 document.getElementById('speed').textContent = Math.abs(Math.round(gameState.player.speed * 20));
                 document.getElementById('fuel-level').style.width = `${Math.max(0, gameState.player.fuelLevel)}%`;
             }
            checkLocation();
            // Enemy Count
            document.getElementById('enemies-left').textContent = gameState.world.enemies.length;
        }

        // --- Rendering ---
        function renderGame() {
            ctx.fillStyle = gameState.world.grassColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-gameState.camera.x, -gameState.camera.y);
            // Draw world elements
            drawRoads(); drawBuildings(); drawTrees(); drawObstacles(); drawGasStations();
            drawVehicles(); // Parked cars
            drawEnemies(); // Enemies
            drawSkidMarks(); drawDustParticles(); drawExplosions(); drawProjectiles();
            drawPlayer(); // Active player/car
            ctx.restore();
            drawMiniMap();
        }

        // --- Drawing Functions ---
        function drawRoads() { /* ... Same as previous ... */
             roads.forEach(road => { const x1 = road.x1, y1 = road.y1, x2 = road.x2, y2 = road.y2; const midX = (x1+x2)/2, midY = (y1+y2)/2; const length = Math.sqrt((x2-x1)**2 + (y2-y1)**2); if (midX + length < gameState.camera.x || midX - length > gameState.camera.x + canvas.width || midY + length < gameState.camera.y || midY - length > gameState.camera.y + canvas.height) return; const angle = Math.atan2(y2 - y1, x2 - x1); ctx.save(); ctx.translate(x1, y1); ctx.rotate(angle); ctx.fillStyle = gameState.world.roadColor; ctx.fillRect(0, -gameState.world.roadWidth / 2, length, gameState.world.roadWidth); ctx.fillStyle = gameState.world.lineColor; ctx.fillRect(0, -gameState.world.lineWidth / 2, length, gameState.world.lineWidth); ctx.restore(); });
        }
        function drawBuildings() { /* ... Same as previous ... */
             gameState.world.buildings.forEach(b => { if (b.x + b.width < gameState.camera.x || b.x > gameState.camera.x + canvas.width || b.y + b.height < gameState.camera.y || b.y > gameState.camera.y + canvas.height) return; ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.width, b.height); ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; for (let wy = b.y + 5; wy < b.y + b.height - 5; wy += 15) { for (let wx = b.x + 5; wx < b.x + b.width - 5; wx += 15) { ctx.fillRect(wx, wy, 7, 7); } } });
        }
        function drawTrees() { /* ... Same as previous ... */
             gameState.world.trees.forEach(t => { if (t.x + t.radius < gameState.camera.x || t.x - t.radius > gameState.camera.x + canvas.width || t.y + t.radius < gameState.camera.y || t.y - t.radius > gameState.camera.y + canvas.height) return; ctx.fillStyle = '#643200'; ctx.fillRect(t.x - t.radius * 0.2, t.y - t.radius * 0.1, t.radius * 0.4, t.radius * 0.6); ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y - t.radius * 0.4, t.radius, 0, Math.PI * 2); ctx.fill(); });
        }
        function drawObstacles() { /* ... Same as previous ... */
             gameState.world.obstacles.forEach(o => { if (o.x + o.width < gameState.camera.x || o.x > gameState.camera.x + canvas.width || o.y + o.height < gameState.camera.y || o.y > gameState.camera.y + canvas.height) return; ctx.fillStyle = o.color; ctx.fillRect(o.x, o.y, o.width, o.height); });
        }
        function drawGasStations() { /* ... Same as previous ... */
             gameState.world.gasStations.forEach(s => { if (s.x + s.width < gameState.camera.x || s.x > gameState.camera.x + canvas.width || s.y + s.height < gameState.camera.y || s.y > gameState.camera.y + canvas.height) return; ctx.fillStyle = '#666'; ctx.fillRect(s.x - 5, s.y - 5, s.width + 10, s.height + 10); ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.width, s.height); ctx.fillStyle = '#fff'; ctx.font = '24px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⛽', s.x + s.width / 2, s.y + s.height / 2); });
        }
        function drawVehicles() { /* ... Same as previous ... */
            gameState.world.vehicles.forEach(car => { const CULL_MARGIN = Math.max(car.width, car.height) * 1.5; if (car.x + CULL_MARGIN < gameState.camera.x || car.x - CULL_MARGIN > gameState.camera.x + canvas.width || car.y + CULL_MARGIN < gameState.camera.y || car.y - CULL_MARGIN > gameState.camera.y + canvas.height) return; ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle * Math.PI / 180); ctx.fillStyle = car.color; ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height); ctx.fillStyle = 'rgba(153, 204, 255, 0.7)'; ctx.fillRect(-car.width / 2 + 3, -car.height / 2 + 3, car.width - 6, 8); ctx.fillRect(-car.width / 2 + 3, car.height / 2 - 12, car.width - 6, 9); ctx.fillStyle = '#1a1a1a'; const wheelW = 4, wheelH = 8; ctx.fillRect(-car.width / 2 - wheelW/2, -car.height / 2 + 5, wheelW, wheelH); ctx.fillRect(car.width / 2 - wheelW/2, -car.height / 2 + 5, wheelW, wheelH); ctx.fillRect(-car.width / 2 - wheelW/2, car.height / 2 - 13, wheelW, wheelH); ctx.fillRect(car.width / 2 - wheelW/2, car.height / 2 - 13, wheelW, wheelH); ctx.restore(); });
        }
        function drawSkidMarks() { /* ... Same as previous ... */
             gameState.fx.skidMarks.forEach(skid => { const CULL_MARGIN = skid.width * 2; if (skid.x + CULL_MARGIN < gameState.camera.x || skid.x - CULL_MARGIN > gameState.camera.x + canvas.width || skid.y + CULL_MARGIN < gameState.camera.y || skid.y - CULL_MARGIN > gameState.camera.y + canvas.height) return; ctx.save(); ctx.translate(skid.x, skid.y); ctx.rotate(skid.angle * Math.PI / 180); ctx.fillStyle = `rgba(0, 0, 0, ${skid.alpha * 0.6})`; ctx.fillRect(-skid.width / 2, -1.5, skid.width, 3); ctx.restore(); });
        }
        function drawDustParticles() { /* ... Same as previous ... */
            gameState.fx.dustParticles.forEach(p => { const CULL_MARGIN = p.size * 2; if (p.x + CULL_MARGIN < gameState.camera.x || p.x - CULL_MARGIN > gameState.camera.x + canvas.width || p.y + CULL_MARGIN < gameState.camera.y || p.y - CULL_MARGIN > gameState.camera.y + canvas.height) return; ctx.fillStyle = `rgba(160, 140, 110, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
        }
        function drawExplosions() {
             gameState.fx.explosions.forEach(p => {
                  if (p.x < gameState.camera.x || p.x > gameState.camera.x + canvas.width || p.y < gameState.camera.y || p.y > gameState.camera.y + canvas.height) return; // Basic culling
                 ctx.fillStyle = `rgba(255, ${Math.random()*150 + 100}, 0, ${p.alpha})`; // Orange/Yellow flashing
                 ctx.beginPath();
                 ctx.arc(p.x, p.y, p.size * (1 + p.life * 0.05), 0, Math.PI * 2); // Expand slightly
                 ctx.fill();
             });
         }
        function drawProjectiles() {
             gameState.world.projectiles.forEach(p => {
                 if (p.x < gameState.camera.x || p.x > gameState.camera.x + canvas.width || p.y < gameState.camera.y || p.y > gameState.camera.y + canvas.height) return; // Basic culling
                 ctx.fillStyle = p.color;
                 ctx.beginPath();
                 ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); // Slightly larger bullets
                 ctx.fill();
             });
         }
        function drawEnemies() {
            gameState.world.enemies.forEach(enemy => {
                 const CULL_MARGIN = Math.max(enemy.width, enemy.height) * 1.5;
                 if (enemy.x + CULL_MARGIN < gameState.camera.x || enemy.x - CULL_MARGIN > gameState.camera.x + canvas.width || enemy.y + CULL_MARGIN < gameState.camera.y || enemy.y - CULL_MARGIN > gameState.camera.y + canvas.height) return;

                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                 ctx.rotate(enemy.angle * Math.PI / 180); // Rotate enemy to face direction
                 // Simple rectangle enemy
                 ctx.fillStyle = enemy.color;
                 ctx.fillRect(-enemy.width / 2, -enemy.height / 2, enemy.width, enemy.height);
                 // Head indicator
                 ctx.fillStyle = 'rgba(0,0,0,0.5)';
                 ctx.fillRect(-enemy.width * 0.2, -enemy.height * 0.5 - 2, enemy.width * 0.4, 3);
                 ctx.restore();

                 // Optional: Draw simple health bar above enemy
                 const barWidth = 20; const barHeight = 3;
                 const barX = enemy.x - barWidth / 2; const barY = enemy.y - enemy.height / 2 - 8;
                 ctx.fillStyle = '#500'; ctx.fillRect(barX, barY, barWidth, barHeight);
                 ctx.fillStyle = '#f33'; ctx.fillRect(barX, barY, barWidth * (enemy.health / enemy.maxHealth), barHeight);
            });
        }
        function drawPlayer() { /* ... Uses updated version with leg animation ... */
             ctx.save(); ctx.translate(gameState.player.x, gameState.player.y); ctx.rotate(gameState.player.angle * Math.PI / 180);
             if (gameState.playerState === 'driving') { const carW = gameState.player.width; const carH = gameState.player.height; ctx.fillStyle = gameState.player.color; ctx.fillRect(-carW / 2, -carH / 2, carW, carH); ctx.fillStyle = 'rgba(153, 204, 255, 0.7)'; ctx.fillRect(-carW / 2 + 3, -carH / 2 + 3, carW - 6, 8); ctx.fillRect(-carW / 2 + 3, carH / 2 - 12, carW - 6, 9); ctx.fillStyle = '#1a1a1a'; const wheelW = 4, wheelH = 8; ctx.fillRect(-carW / 2 - wheelW/2, -carH / 2 + 5, wheelW, wheelH); ctx.fillRect(carW / 2 - wheelW/2, -carH / 2 + 5, wheelW, wheelH); ctx.fillRect(-carW / 2 - wheelW/2, carH / 2 - 13, wheelW, wheelH); ctx.fillRect(carW / 2 - wheelW/2, carH / 2 - 13, wheelW, wheelH); }
             else { const pedW = gameState.player.pedWidth; const pedH = gameState.player.pedHeight; const bodyHeight = pedH * 0.6; const legHeight = pedH * 0.4; const legWidth = pedW / 2 - 1; ctx.fillStyle = '#3498db'; ctx.fillRect(-pedW / 2, -pedH / 2, pedW, bodyHeight); ctx.fillStyle = '#2980b9'; ctx.beginPath(); ctx.arc(0, -pedH / 2 + 2, pedW / 3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#555'; const legY = -pedH / 2 + bodyHeight; if (!gameState.player.isWalking) { ctx.fillRect(-pedW / 2 + 1, legY, pedW - 2, legHeight); } else { if (gameState.player.walkAnimFrame === 0) { ctx.fillRect(-pedW / 2 + 0.5, legY, legWidth, legHeight); ctx.fillRect(0.5, legY + 1, legWidth, legHeight * 0.8); } else { ctx.fillRect(-pedW / 2 + 0.5, legY + 1, legWidth, legHeight * 0.8); ctx.fillRect(0.5, legY, legWidth, legHeight); } } }
             ctx.restore();
        }
        function drawMiniMap() { /* ... Same as previous ... */
             const mapScale = miniMapCtx.canvas.width / gameState.world.width; miniMapCtx.fillStyle = 'rgba(0, 0, 0, 0.8)'; miniMapCtx.fillRect(0, 0, miniMapCtx.canvas.width, miniMapCtx.canvas.height); miniMapCtx.strokeStyle = '#666'; miniMapCtx.lineWidth = 1.5; roads.forEach(road => { miniMapCtx.beginPath(); miniMapCtx.moveTo(road.x1 * mapScale, road.y1 * mapScale); miniMapCtx.lineTo(road.x2 * mapScale, road.y2 * mapScale); miniMapCtx.stroke(); }); miniMapCtx.fillStyle = '#ff3333'; gameState.world.gasStations.forEach(s => { miniMapCtx.fillRect(s.x * mapScale - 1.5, s.y * mapScale - 1.5, 3, 3); }); miniMapCtx.fillStyle = '#aaa'; gameState.world.vehicles.forEach(car => { miniMapCtx.fillRect(car.x * mapScale - 1, car.y * mapScale - 1, 2, 2); }); miniMapCtx.fillStyle = '#f00'; gameState.world.enemies.forEach(e => { miniMapCtx.fillRect(e.x*mapScale -1, e.y*mapScale-1, 2, 2); }); /* Draw Player */ const playerMapX = gameState.player.x * mapScale; const playerMapY = gameState.player.y * mapScale; if (gameState.playerState === 'driving') { miniMapCtx.fillStyle = '#0f0'; miniMapCtx.beginPath(); miniMapCtx.arc(playerMapX, playerMapY, 2.5, 0, Math.PI * 2); miniMapCtx.fill(); } else { miniMapCtx.fillStyle = '#ff0'; miniMapCtx.fillRect(playerMapX - 1.5, playerMapY - 1.5, 3, 3); } /* Direction */ const angleRad = gameState.player.angle * Math.PI / 180; const dirLen = 5; miniMapCtx.strokeStyle = miniMapCtx.fillStyle; miniMapCtx.lineWidth = 1; miniMapCtx.beginPath(); miniMapCtx.moveTo(playerMapX, playerMapY); miniMapCtx.lineTo(playerMapX + Math.sin(angleRad) * dirLen, playerMapY - Math.cos(angleRad) * dirLen); miniMapCtx.stroke(); /* Camera */ miniMapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; miniMapCtx.lineWidth = 1; miniMapCtx.strokeRect( gameState.camera.x * mapScale, gameState.camera.y * mapScale, gameState.camera.width * mapScale, gameState.camera.height * mapScale );
        }
        function drawGameOver() {
             ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
             ctx.fillRect(0, 0, canvas.width, canvas.height);
             ctx.font = "40px 'Courier New', monospace";
             ctx.fillStyle = "red";
             ctx.textAlign = "center";
             ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
             ctx.font = "20px 'Courier New', monospace";
              ctx.fillStyle = "white";
             ctx.fillText("Refresh to Restart", canvas.width / 2, canvas.height / 2 + 20);
        }


        // --- Initialization & Utilities ---
        function initGame() {
            console.log("Initializing Game...");
            createWorldElements(); // Basic random placement
            initializeWorldObjects(); // Refine placement away from roads
            spawnInitialEnemies(5); // Spawn initial enemies
            updateHUD();
            window.addEventListener('resize', handleResize); handleResize();
            gameLoop();
            console.log("Game Loop Started.");
        }

        function createWorldElements() { /* ... Same basic generation ... */
             for (let i = 0; i < 200; i++) { gameState.world.trees.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, radius: 5 + Math.random() * 10, color: `hsl(${100 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${20 + Math.random() * 20}%)` }); } for (let i = 0; i < 40; i++) { gameState.world.buildings.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, width: 30 + Math.random() * 70, height: 30 + Math.random() * 70, color: `hsl(${200 + Math.random() * 40}, ${20 + Math.random() * 20}%, ${40 + Math.random() * 30}%)` }); } for (let i = 0; i < 60; i++) { gameState.world.obstacles.push({ x: Math.random() * gameState.world.width, y: Math.random() * gameState.world.height, width: 10 + Math.random() * 20, height: 10 + Math.random() * 20, color: '#777' }); } for (let i = 0; i < 5; i++) { gameState.world.gasStations.push({ x: 400 + Math.random() * (gameState.world.width - 800), y: 400 + Math.random() * (gameState.world.height - 800), width: 50, height: 60, color: '#c00' }); }
        }
        function initializeWorldObjects() { /* ... Same road avoidance logic ... */
             const validTrees = []; gameState.world.trees.forEach(tree => { if (!isOnRoad(tree.x, tree.y, tree.radius * 1.5)) { validTrees.push(tree); } }); gameState.world.trees = validTrees.slice(0, 200); const validBuildings = []; gameState.world.buildings.forEach(b => { if (!isOnRoad(b.x + b.width/2, b.y + b.height/2, Math.max(b.width, b.height) * 0.7)) { validBuildings.push(b); } }); gameState.world.buildings = validBuildings.slice(0, 40); const validObstacles = []; gameState.world.obstacles.forEach(o => { if (!isOnRoad(o.x + o.width/2, o.y + o.height/2, Math.max(o.width, o.height))) { validObstacles.push(o); } }); gameState.world.obstacles = validObstacles.slice(0, 60); console.log(`World Initialized: ${gameState.world.trees.length} Trees, ${gameState.world.buildings.length} Buildings, ${gameState.world.obstacles.length} Obstacles`);
        }
        function isOnRoad(x, y, buffer) { /* ... Same logic ... */
             for (const road of roads) { const dx = road.x2 - road.x1, dy = road.y2 - road.y1; const lenSq = dx*dx + dy*dy; if (lenSq === 0) continue; let t = ((x - road.x1) * dx + (y - road.y1) * dy) / lenSq; t = Math.max(0, Math.min(1, t)); const closestX = road.x1 + t * dx; const closestY = road.y1 + t * dy; const distSq = (x - closestX)**2 + (y - closestY)**2; if (distSq < (gameState.world.roadWidth / 2 + buffer)**2) return true; } return false;
        }
         function spawnInitialEnemies(count) {
             let spawned = 0;
             let attempts = 0;
             while (spawned < count && attempts < count * 10) {
                  attempts++;
                  const x = Math.random() * gameState.world.width;
                  const y = Math.random() * gameState.world.height;
                  // Avoid spawning too close to player start or on roads/buildings
                  const dx = x - gameState.player.x; const dy = y - gameState.player.y;
                  if (dx*dx + dy*dy < 500*500) continue; // Too close to player start
                  if (isOnRoad(x, y, 20)) continue;

                  let inBuilding = false;
                  for (const b of gameState.world.buildings) {
                      if (x > b.x && x < b.x + b.width && y > b.y && y < b.y + b.height) {
                          inBuilding = true; break;
                      }
                  }
                  if (inBuilding) continue;

                  spawnEnemy(x, y);
                  spawned++;
             }
             console.log(`Spawned ${spawned} enemies.`);
         }
        function handleResize() { /* ... Same aspect ratio logic ... */
             const gameContainer = document.getElementById('game-container'); const windowWidth = window.innerWidth; const windowHeight = window.innerHeight; const aspectRatio = canvas.width / canvas.height; let newWidth = windowWidth * 0.98; let newHeight = newWidth / aspectRatio; if (newHeight > windowHeight * 0.98) { newHeight = windowHeight * 0.98; newWidth = newHeight * aspectRatio; } gameContainer.style.width = `${newWidth}px`; gameContainer.style.height = `${newHeight}px`;
        }

        // --- Start Game ---
        window.onload = initGame;

    </script>
