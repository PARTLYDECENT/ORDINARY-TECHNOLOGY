<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Simple Downloadable Shaders</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Styling */
        :root {
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #00bfff; /* Blue accent */
            --input-bg: #333;
            --input-border: #555;
            /* Status Colors */
            --status-recording: #ff4500;
            --status-processing: #ffd700;
            --status-success: #32cd32;
            --status-error: #ff0000;
            --status-recording-rgb: 255, 69, 0;
            --status-processing-rgb: 255, 215, 0;
            --status-success-rgb: 50, 205, 50;
            --status-error-rgb: 255, 0, 0;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .main-container {
            max-width: 800px; /* Adjusted width */
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 2rem;
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .shader-container {
            margin-bottom: 30px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .shader-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: var(--text-primary);
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
         .shader-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 5px 0 15px 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 4px;
            border: 1px solid #444;
            margin-bottom: 15px;
        }

        /* Controls Styling */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }
        .control-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            flex-grow: 1; /* Allow group to take space */
        }

        button, select {
            padding: 9px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #007bff, #0056b3); /* Simpler button gradient */
            border: none;
            color: white;
            font-weight: 500;
            min-width: 180px;
            transition: background 0.2s ease;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0088ff, #0062cc);
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.7;
        }

        select {
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22292.4%22 height%3D%22292.4%22%3E%3Cpath fill%3D%22%23cccccc%22 d%3D%22M287 69.4a17.6 17.6 0 0 0-13.1-6.4H18.5c-5.4 0-10.7 2-14.1 5.9-3.2 3.5-5.1 8.3-5.1 13.3 0 6.2 2.3 11.4 6.9 16l125.9 127.9c3.5 3.5 8 5.6 12.8 5.6s9.2-2.1 12.8-5.6L287 101.4c4.6-4.6 6.9-10 6.9-16 0-5.1-1.9-9.9-5.1-13.3z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
            min-width: 150px;
        }
        select:hover { border-color: var(--accent-color); }

        .status-indicator {
            font-size: 0.9rem;
            font-weight: 500;
            padding: 7px 12px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid transparent;
            flex-shrink: 0;
        }
        .status-recording { background-color: rgba(var(--status-recording-rgb), 0.2); color: var(--status-recording); border-color: var(--status-recording); }
        .status-processing { background-color: rgba(var(--status-processing-rgb), 0.2); color: var(--status-processing); border-color: var(--status-processing); }
        .status-success { background-color: rgba(var(--status-success-rgb), 0.2); color: var(--status-success); border-color: var(--status-success); }
        .status-error { background-color: rgba(var(--status-error-rgb), 0.2); color: var(--status-error); border-color: var(--status-error); }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 1.8rem; }
            .intro-text { font-size: 0.9rem; }
            .shader-container { padding: 15px; }
            .shader-title { font-size: 1.3rem; }
            .controls { flex-direction: column; align-items: stretch; }
            .control-group { flex-direction: column; align-items: stretch; }
            button, select { width: 100%; box-sizing: border-box; }
            .status-indicator { width: 100%; box-sizing: border-box; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>3 Simple Downloadable Shaders</h1>
        <p class="intro-text">Here are 3 basic WebGL shaders. You can record a 1-minute video clip of each and download it using the controls below.</p>

        <div id="shadersList">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r163/three.min.js"></script>

    <script>
        // ========================================================================
        // SHADER DEFINITIONS (Exactly 3 Simple Ones)
        // ========================================================================
        const shaders = [
            {
                id: 'simple-gradient',
                title: 'Animated Gradient',
                description: 'Colors shifting based on screen position and time.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    void main() {
                        vec3 color = vec3(
                            0.5 + 0.5 * cos(time * 0.8 + vUv.x * 6.0), // Faster Red
                            0.5 + 0.5 * sin(time * 0.7 + vUv.y * 5.0), // Faster Green
                            0.6 + 0.4 * cos(time * 0.9)              // Faster Blue
                        );
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            },
            {
                id: 'pulsing-circle',
                title: 'Pulsing Circle',
                description: 'A circle that grows and shrinks over time.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    void main() {
                        vec2 centerUv = vUv - 0.5;
                        centerUv.x *= resolution.x / resolution.y; // Aspect ratio correction
                        float dist = length(centerUv);
                        float radius = 0.15 + 0.1 * (1.0 + sin(time * 2.5)); // Pulse between 0.15 and 0.35
                        float circle = 1.0 - smoothstep(radius - 0.008, radius + 0.008, dist); // Slightly softer edge
                        vec3 color = vec3(circle) * vec3(1.0, 0.4, 0.2); // Orange circle
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            },
            {
                id: 'basic-noise',
                title: 'Simple Noise',
                description: 'Basic moving pseudo-random noise pattern.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    // Simple hash function
                    float hash(vec2 p) {
                        // Simpler hash variant
                        return fract(sin(p.x*12.9898 + p.y*78.233) * 43758.5453);
                    }

                    void main() {
                        // Noise based on screen position, animated offset
                        float noiseValue = hash(vUv * 25.0 + time * 0.5); // Scale noise, simple time offset

                        gl_FragColor = vec4(vec3(noiseValue), 1.0); // Grayscale noise
                    }
                `
            }
        ];

        // ========================================================================
        // Shader Renderer Class (Handles Display & Recording)
        // ========================================================================
         class ShaderRenderer {
            constructor(canvas, fragmentShader) {
                this.canvas = canvas;
                this.fragmentShader = fragmentShader;
                this.time = Math.random() * 100;
                this.isActive = false;
                this.animationFrameId = null;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordingMimeType = '';
                this.recordingFileExtension = '';
                this.preRecordingRendererSize = new THREE.Vector2();
                this.renderer = null;
                this.scene = null;
                this.camera = null;
                this.material = null;

                this.handleResize = this.handleResize.bind(this);
                this.render = this.render.bind(this);

                this.init();
                if(this.renderer) this.start();
            }

            init() {
                try {
                    const context = this.canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true }); // Use WebGL1 for wider compatibility with simple shaders
                    if (!context) throw new Error("Could not create WebGL context.");

                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas, context: context, preserveDrawingBuffer: true
                    });
                    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limit pixel ratio for performance

                    this.scene = new THREE.Scene();
                    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                    this.material = new THREE.ShaderMaterial({
                        uniforms: {
                            time: { value: this.time },
                            resolution: { value: new THREE.Vector2() }
                        },
                        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                        fragmentShader: this.fragmentShader,
                        depthWrite: false, depthTest: false
                    });
                    const geometry = new THREE.PlaneGeometry(2, 2);
                    const mesh = new THREE.Mesh(geometry, this.material);
                    this.scene.add(mesh);
                    this.resize();
                    window.addEventListener('resize', this.handleResize);
                } catch (error) {
                    console.error("ShaderRenderer Init Error:", error);
                    this.drawErrorText(`Renderer Init Failed: ${error.message}`);
                    this.renderer = null;
                }
            }

            drawErrorText(message) { /* ... same fallback drawing logic ... */
                  const ctx = this.canvas.getContext('2d');
                  if(ctx) {
                      this.canvas.width = this.canvas.clientWidth || 300;
                      this.canvas.height = this.canvas.clientHeight || 150;
                      ctx.fillStyle = '#111'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                      ctx.fillStyle = 'red'; ctx.font = '14px Roboto, sans-serif';
                      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                      ctx.fillText(message, this.canvas.width / 2, this.canvas.height / 2);
                  }
            }

            resize() {
                if (!this.renderer || (this.mediaRecorder && this.mediaRecorder.state === 'recording')) return; // Don't resize during recording

                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                const pixelRatio = this.renderer.getPixelRatio();
                const displayWidth = Math.floor(width * pixelRatio);
                const displayHeight = Math.floor(height * pixelRatio);

                if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                    this.setRendererSize(displayWidth, displayHeight);
                }
            }

            handleResize() { this.resize(); } // Simple immediate resize

            setRendererSize(width, height) {
                if (this.renderer && this.material?.uniforms.resolution) {
                    this.renderer.setSize(width, height, false);
                    this.material.uniforms.resolution.value.set(width, height);
                }
            }

             start() { if (!this.isActive && this.renderer) { this.isActive = true; this.render(); } }
             stop() { this.isActive = false; if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId); window.removeEventListener('resize', this.handleResize); }

             render() {
                 if (!this.isActive) return;
                 this.time += 0.016; // Simple time update
                 if (this.material?.uniforms.time) this.material.uniforms.time.value = this.time;
                 this.renderer.render(this.scene, this.camera);
                 this.animationFrameId = requestAnimationFrame(this.render);
             }

            // --- Recording Logic ---
            async startRecording(duration = 60, recordingResolution = 'canvas') {
                 return new Promise(async (resolve, reject) => {
                     if (!this.canvas || !this.renderer) return reject(new Error("Renderer not ready."));
                     if (!this.canvas.captureStream) return reject(new Error("captureStream not supported"));
                     if (this.mediaRecorder?.state === 'recording') return reject(new Error("Recording in progress"));

                     this.renderer.getSize(this.preRecordingRendererSize);
                     console.log(`Pre-recording size: ${this.preRecordingRendererSize.x}x${this.preRecordingRendererSize.y}`);

                     let targetWidth, targetHeight;
                     if (recordingResolution === 'canvas') {
                         targetWidth = this.preRecordingRendererSize.x; targetHeight = this.preRecordingRendererSize.y;
                     } else {
                         targetWidth = recordingResolution.width; targetHeight = recordingResolution.height;
                         this.setRendererSize(targetWidth, targetHeight); // Temp resize
                         await new Promise(requestAnimationFrame); // Wait frame
                         if (this.material?.uniforms.time) this.material.uniforms.time.value = this.time;
                         this.renderer.render(this.scene, this.camera);
                         await new Promise(requestAnimationFrame);
                     }
                     console.log(`Recording at ${targetWidth}x${targetHeight}`);

                     const supportedTypes = [ /* Standard preferred types */
                        { mime: 'video/mp4;codecs=avc1', extension: 'mp4' }, { mime: 'video/webm;codecs=vp9', extension: 'webm' },
                        { mime: 'video/webm;codecs=vp8', extension: 'webm' }, { mime: 'video/webm', extension: 'webm' } ];
                     const selectedType = supportedTypes.find(type => MediaRecorder.isTypeSupported(type.mime));

                     if (!selectedType) {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore
                         return reject(new Error("No supported video format found"));
                     }
                     this.recordingMimeType = selectedType.mime; this.recordingFileExtension = selectedType.extension;

                     try {
                         const stream = this.canvas.captureStream(30); // Target 30 FPS
                         this.mediaRecorder = new MediaRecorder(stream, { mimeType: this.recordingMimeType, videoBitsPerSecond: 10000000 }); // 10 Mbps
                     } catch (error) {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore
                         return reject(new Error(`Recorder creation failed: ${error.message}`));
                     }

                     this.recordedChunks = [];
                     this.mediaRecorder.ondataavailable = (e) => e.data.size > 0 && this.recordedChunks.push(e.data);
                     this.mediaRecorder.onstop = () => {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore on stop
                         resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                     };
                     this.mediaRecorder.onerror = (e) => {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore on error
                         reject(new Error(`Recorder error: ${e.error?.name || 'Unknown'}`));
                     };
                     this.mediaRecorder.start();
                     setTimeout(() => this.mediaRecorder?.state === 'recording' && this.mediaRecorder.stop(), duration * 1000);
                 });
            }

            saveRecordedVideo(filename = 'shader_video') {
                 if (!this.recordedChunks?.length || !this.recordingMimeType) return false;
                 try {
                     const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                     const url = URL.createObjectURL(blob); const a = document.createElement('a');
                     a.style.display = 'none'; a.href = url; a.download = `${filename}.${this.recordingFileExtension}`;
                     document.body.appendChild(a); a.click();
                     setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                     this.recordedChunks = []; this.recordingMimeType = ''; // Clear after success
                     return true;
                 } catch (error) {
                     console.error("Save Error:", error); alert(`Save failed: ${error.message}`);
                     this.recordedChunks = []; this.recordingMimeType = ''; // Clear on error
                     return false;
                 }
             }
        }

        // ========================================================================
        // Main Setup Logic
        // ========================================================================
        window.addEventListener('load', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {};
            const recordingDuration = 60;

            const availableResolutions = [ // Standard resolutions
                 { id: 'canvas', label: 'Canvas Size' },
                 { id: '480p', label: '480p (640x480)', width: 640, height: 480 },
                 { id: '720p', label: '720p (1280x720)', width: 1280, height: 720 },
                 { id: '1080p', label: '1080p (1920x1080)', width: 1920, height: 1080 }
            ];

            // --- Capability & Setup ---
            if (typeof THREE === 'undefined') { displayError("THREE.js library failed to load!"); return; }
            const supportsCaptureStream = 'captureStream' in HTMLCanvasElement.prototype;
            if (!supportsCaptureStream) displayError("Video recording not supported by browser.", false);

            let maxCanvasSize = { width: 4096, height: 4096 }; // Estimate max size (simple version)
            try { const ctx = document.createElement('canvas').getContext('webgl'); if(ctx) maxCanvasSize.width = maxCanvasSize.height = ctx.getParameter(ctx.MAX_TEXTURE_SIZE);} catch(e){}

            // --- Create UI for each shader ---
            shaders.forEach(shader => {
                const container = document.createElement('div');
                container.className = 'shader-container';
                // Simplified innerHTML structure
                container.innerHTML = `
                    <h3 class="shader-title">${shader.title}</h3>
                    <p class="shader-description">${shader.description}</p>
                    <canvas id="canvas-${shader.id}"></canvas>
                    <div class="controls">
                        <div class="control-group">
                            <button id="button-${shader.id}" data-id="${shader.id}">Record (${recordingDuration}s)</button>
                            <select id="resolution-${shader.id}" title="Recording Resolution"></select>
                        </div>
                        <span id="status-${shader.id}" class="status-indicator" style="display: none;"></span>
                    </div>`;
                shadersListDiv.appendChild(container);

                const canvas = container.querySelector('canvas');
                const button = container.querySelector('button');
                const resolutionSelect = container.querySelector('select');
                const statusSpan = container.querySelector('span');

                // Populate resolution dropdown
                availableResolutions.forEach(res => {
                    if (res.width > maxCanvasSize.width || res.height > maxCanvasSize.height) return; // Skip if too large
                    const opt = new Option(res.label, res.id); // Use Option constructor
                    if (res.width) { opt.dataset.width = res.width; opt.dataset.height = res.height; }
                    resolutionSelect.appendChild(opt);
                });

                // Initialize Shader Display
                try {
                    const instance = new ShaderRenderer(canvas, shader.fragmentShader);
                    if (!instance.renderer) throw new Error("Renderer init failed.");
                    shaderInstances[shader.id] = instance;
                } catch (error) { // Handle init failure for this specific shader
                    console.error(`Init fail ${shader.id}:`, error);
                    const errP = document.createElement('p'); errP.textContent = `❌ Error Initializing Shader`; errP.style.color='red';
                    canvas.parentNode.insertBefore(errP, canvas.nextSibling);
                    button.disabled = true; resolutionSelect.disabled = true;
                    return; // Skip event listener setup for this broken one
                }

                // Disable controls if recording not supported
                if (!supportsCaptureStream) { button.disabled = true; resolutionSelect.disabled = true; button.textContent = 'Record N/A'; }

                // --- Recording Button Logic ---
                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const currentRenderer = shaderInstances[shaderId];
                    const status = statusSpan; // Direct reference
                    const selectElement = resolutionSelect;
                    const selectedOption = selectElement.options[selectElement.selectedIndex];
                    let recordingResolutionOpt = 'canvas';

                    if (!currentRenderer || currentRenderer.mediaRecorder?.state === 'recording') return;

                    if (selectedOption.value !== 'canvas') {
                        const width = parseInt(selectedOption.dataset.width, 10); const height = parseInt(selectedOption.dataset.height, 10);
                        if (!isNaN(width) && !isNaN(height)) { recordingResolutionOpt = { width, height }; }
                        else { updateStatus(status, '❌ Invalid Res', 'error', 3000); return; }
                    }

                    button.disabled = true; selectElement.disabled = true;
                    let elapsedSeconds = 0; updateStatus(status, `Recording (0s)...`, 'recording');
                    const timerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (currentRenderer.mediaRecorder?.state === 'recording') updateStatus(status, `Recording (${elapsedSeconds}s)...`, 'recording');
                        else clearInterval(timerInterval);
                    }, 1000);

                    try {
                        await currentRenderer.startRecording(recordingDuration, recordingResolutionOpt);
                        clearInterval(timerInterval); updateStatus(status, 'Processing...', 'processing');
                        const success = currentRenderer.saveRecordedVideo(`${shader.id}_${selectedOption.value}`);
                        updateStatus(status, success ? '✅ Downloading...' : '❌ Failed', success ? 'success' : 'error', 3000);
                    } catch (error) {
                        clearInterval(timerInterval); updateStatus(status, `❌ Error: ${error.message || 'Unknown'}`, 'error', 5000);
                    } finally {
                        setTimeout(() => {
                           if(supportsCaptureStream) { button.disabled = false; selectElement.disabled = false; }
                           button.textContent = `Record (${recordingDuration}s)`;
                        }, 3000); // Allow status message to show
                    }
                }); // End button click

            }); // End forEach shader

            // --- Helper Functions ---
            let statusTimeout = null;
            function updateStatus(element, message, type = 'info', duration = null) {
                 clearTimeout(statusTimeout); element.textContent = message; element.className = `status-indicator status-${type}`; element.style.display = 'inline-block';
                 if (duration !== null) statusTimeout = setTimeout(() => { element.style.display = 'none'; element.className = 'status-indicator'; }, duration);
            }
            function displayError(message, isFatal = true) { /* ... same function as before ... */
                 const targetDiv = document.getElementById('shadersList') || document.body;
                 if (isFatal && targetDiv.id === 'shadersList') { targetDiv.innerHTML = ''; document.querySelector('h1').textContent = 'Error'; }
                 const errorDiv = document.createElement('p'); errorDiv.textContent = message;
                 errorDiv.style.color = 'red'; errorDiv.style.backgroundColor='rgba(255,0,0,0.1)'; errorDiv.style.border='1px solid red';
                 errorDiv.style.padding='10px'; errorDiv.style.textAlign='center'; errorDiv.style.margin='10px 0';
                 targetDiv.parentNode.insertBefore(errorDiv, targetDiv);
            }

            // Cleanup
            window.addEventListener('beforeunload', () => Object.values(shaderInstances).forEach(inst => inst?.stop()));

        }); // End window.onload
    </script>

</body>
</html>
