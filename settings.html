<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Showcase | 1-Minute Clips</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #121212; /* Return to a slightly softer dark */
            --card-bg: #1e1e1e; /* Standard dark card */
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent-blue: #007bff; /* Clean blue */
            --accent-purple: #673ab7; /* Muted purple */
            --status-recording: #f44336; /* Red */
            --status-processing: #ff9800; /* Orange */
            --status-success: #4caf50; /* Green */
            --status-error: #f44336; /* Red */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-y: auto;
            min-height: 100vh;
             /* Subtle, non-epileptic background texture */
             background-image: radial-gradient(rgba(255,255,255,0.05) 0.5px, transparent 0.5px), radial-gradient(rgba(255,255,255,0.05) 0.5px, transparent 0.5px);
             background-size: 20px 20px;
             background-position: 0 0, 10px 10px;
        }
         /* Removed background pan animation */

        /* Custom Scrollbar - Return to cleaner look */
        body::-webkit-scrollbar {
            width: 10px;
        }
        body::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        body::-webkit-scrollbar-thumb {
            background-color: var(--accent-blue);
            border-radius: 5px;
            border: 2px solid var(--card-bg);
             box-shadow: none; /* Remove glow */
        }
         body::-webkit-scrollbar-thumb:hover {
             background-color: #0056b3; /* Darker blue on hover */
             box-shadow: none;
         }
        body { scrollbar-color: var(--accent-blue) var(--card-bg); }


        .main-container {
            max-width: 1000px; /* Back to reasonable width */
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-weight: 700; /* Bolder, not blackest */
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            background: linear-gradient(to right, #6a11cb, #2575fc); /* Original gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem; /* Slightly smaller */
             text-shadow: none; /* Remove glow */
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
             font-style: normal; /* No more italics */
        }

        .shader-container {
            margin-bottom: 40px;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); /* Softer shadow */
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Smoother transition */
            position: relative;
            overflow: hidden;
        }
         /* Removed animated borders */
         .shader-container::before, .shader-container::after { display: none; }
         @keyframes border-scan { /* Keep keyframes but they won't be used by these elements */
             0% { background-position: -100% 0; }
             100% { background-position: 100% 0; }
         }


         .shader-container:hover {
             transform: translateY(-3px); /* Subtle lift effect */
             box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
         }

        .shader-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .shader-info {
            flex-grow: 1;
            min-width: 200px;
        }
        .shader-title {
            font-size: 2rem;
            font-weight: 600; /* Bolder, not blackest */
            margin: 0;
            color: var(--text-primary);
            line-height: 1.2;
             text-shadow: none; /* Remove glow */
        }
         .shader-description {
             font-size: 0.95rem;
             color: var(--text-secondary);
             margin-top: 8px;
             border-left: 4px solid var(--accent-purple); /* Accent line */
             padding-left: 12px;
             font-style: normal;
         }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #444;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
             animation: none; /* Remove canvas border pulse */
        }
         @keyframes border-pulse { /* Keep keyframes but won't be used */
             0% { border-color: #555; }
             100% { border-color: #777; }
         }


        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
             justify-content: flex-start; /* Align controls to left */
        }
        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 25px; /* Standard padding */
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
            min-width: 220px; /* Ensure consistent width */
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0056b3, #512da8); /* Darker hover */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px); /* Subtle lift */
        }
        button:active:not(:disabled) {
             transform: translateY(0);
             box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
            transform: none;
        }
        .status-indicator {
            font-style: normal;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            min-width: 150px;
            text-align: center;
             letter-spacing: normal; /* Default spacing */
             animation: none; /* Remove pulse/flicker from status */
        }
         @keyframes pulse-status { /* Keep keyframes but won't be used */
             0% { transform: scale(1); opacity: 1; }
             100% { transform: scale(1.05); opacity: 0.8; }
         }
         @keyframes flicker { /* Keep keyframes but won't be used */
             0% { opacity: 1; }
             50% { opacity: 0.7; }
             100% { opacity: 1; }
         }

        .status-recording {
            background-color: rgba(var(--status-recording-rgb, 244, 67, 54), 0.2);
            color: var(--status-recording);
            border: 1px solid var(--status-recording);
        }
        .status-processing {
            background-color: rgba(var(--status-processing-rgb, 255, 152, 0), 0.2);
            color: var(--status-processing);
            border: 1px solid var(--status-processing);
        }
        .status-success {
            background-color: rgba(var(--status-success-rgb, 76, 175, 80), 0.2);
            color: var(--status-success);
            border: 1px solid var(--status-success);
        }
        .status-error {
            background-color: rgba(var(--status-error-rgb, 244, 67, 54), 0.2);
            color: var(--status-error);
            border: 1px solid var(--status-error);
        }

        /* Helper for defining RGB vars from hex */
        .status-recording { --status-recording-rgb: 244, 67, 54; }
        .status-processing { --status-processing-rgb: 255, 152, 0; }
        .status-success { --status-success-rgb: 76, 175, 80; }
        .status-error { --status-error-rgb: 244, 67, 54; }


         /* Responsive Adjustments (Adjusted to fit cleaner look) */
        @media (max-width: 1000px) {
             .main-container { margin: 30px auto; }
             h1 { font-size: 2rem; letter-spacing: 1.5px; }
             .intro-text { margin-bottom: 30px; font-size: 0.95rem; }
             .shader-container { padding: 25px; margin-bottom: 30px; }
             .shader-header { gap: 15px; margin-bottom: 15px; }
             .shader-title { font-size: 1.8rem; }
             .shader-description { font-size: 0.85rem; }
             canvas { margin-bottom: 15px; }
             .controls { gap: 15px; }
             button { padding: 10px 20px; font-size: 1rem; min-width: 200px; }
             .status-indicator { padding: 6px 12px; font-size: 0.9rem; min-width: 120px; }
        }

        @media (max-width: 768px) {
             .main-container { padding: 0 10px; }
             h1 { font-size: 1.6rem; letter-spacing: 1px; }
             .intro-text { margin-bottom: 25px; font-size: 0.9rem; }
             .shader-container { padding: 15px; margin-bottom: 25px; }
             .shader-header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 10px;}
             .shader-info { min-width: auto; }
             .shader-title { font-size: 1.5rem; }
             .shader-description { font-size: 0.8rem; padding-left: 8px; border-left-width: 3px;}
             canvas { margin-bottom: 10px; }
             .controls { flex-direction: column; gap: 8px; align-items: stretch;}
             button { padding: 10px 20px; font-size: 0.9rem; min-width: auto; width: 100%;}
             .status-indicator { padding: 5px 10px; font-size: 0.85rem; min-width: auto; width: 100%; }
        }


    </style>
</head>
<body>

    <div class="main-container">
        <h1>Generative Art Showcase</h1>
        <p class="intro-text">Explore these real-time procedural visual experiences. Click "Record & Download" to capture a <strong>1-minute</strong> video clip of any shader. Recording format (MP4/WEBM) depends on your browser. Please allow time for processing and download.</p>

        <div id="shadersList">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ========================================================================
        // SHADER DEFINITIONS - AMAZING SHOWCASES
        // ========================================================================
        // These shaders are designed for intricate patterns, smooth motion,
        // and visually stunning effects without excessive flashing or jarring movement.
        // ========================================================================

        const wallpapers = [

            // --- Shader: Ethereal Ocean ---
            {
                id: 'ethereal-ocean',
                title: 'Ethereal Ocean',
                description: 'Calm, flowing liquid metal waves with soft highlights and deep reflections.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Smooth, slow waves
                        float wave1 = sin(uv.x * 15.0 + time * 0.5) * 0.04;
                        float wave2 = cos(uv.x * 12.0 - time * 0.4 + uv.y * 6.0) * 0.03;
                        float wave3 = sin(uv.y * 20.0 + time * 0.6) * 0.05;
                        float y = uv.y + wave1 + wave2 + wave3;

                        // Color palette: Metallic blues and purples, soft highlights
                        vec3 color = mix( vec3(0.1, 0.1, 0.3), vec3(0.2, 0.2, 0.6), smoothstep(0.3, 0.7, y) ); // Dark base to blue
                         color = mix(color, vec3(0.4, 0.2, 0.7), smoothstep(0.5, 0.8, y + sin(time*2.0)*0.05) ); // Add purple layer
                         color = mix(color, vec3(0.8, 0.8, 1.0), smoothstep(0.7, 1.0, y + cos(time*2.5)*0.08) ); // Add silver highlights

                        // Soft, shifting highlights (simulating reflections)
                        float highlightNoise = sin(uv.x * 30.0 + time * 3.0 + uv.y * 15.0);
                        float highlight = smoothstep(0.45 + highlightNoise * 0.03, 0.55 + highlightNoise * 0.03, y);
                        color = mix(color, vec3(1.0, 1.0, 1.0), highlight * 0.5); // White highlights

                        // Subtle foam/edge detail
                        float foamNoise = sin(uv.x * 80.0 + time * 5.0 + uv.y * 20.0);
                         foamNoise = smoothstep(0.7, 0.9, foamNoise);
                        color = mix(color, vec3(0.9, 0.9, 1.0), foamNoise * smoothstep(0.5, 0.6, y) * 0.2); // Soft foam

                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Ethereal Ocean ---


            // --- Shader: Galactic Whisper (Nebula Remorphed) ---
            {
                id: 'galactic-whisper',
                title: 'Galactic Whisper',
                description: 'A vast, slowly unfolding cosmic tapestry of gas and light.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
                    float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); float a = hash(i + vec2(0.0, 0.0)); float b = hash(i + vec2(1.0, 0.0)); float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0)); return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); }
                    float fbm(vec2 p) { float total = 0.0; float amplitude = 0.5; float frequency = 2.0; int octaves = 6; for (int i = 0; i < octaves; i++) { total += noise(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; } return total; }

                    void main() {
                         vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
                         vec2 p = uv * 1.5;
                         vec2 motion = vec2(time * 0.02, time * 0.015); /* Slower motion */

                         float n = fbm(p + motion);
                         float n2 = fbm(p * 1.8 + motion * 0.5 + 5.0);

                         // Color palette: Deep space blues, soft purples, warm oranges
                         vec3 col1 = vec3(0.05, 0.02, 0.15); // Very dark blue/purple
                         vec3 col2 = vec3(0.2, 0.1, 0.5); // Deep Purple
                         vec3 col3 = vec3(0.1, 0.3, 0.6); // Medium Blue
                         vec3 col4 = vec3(0.8, 0.4, 0.1); // Orange

                         vec3 color = mix(col1, col2, smoothstep(0.3, 0.6, n));
                         color = mix(color, col3, smoothstep(0.4, 0.7, n2));
                         color = mix(color, col4, smoothstep(0.7, 0.8, n * n2)); // Combine noise for complexity

                         // Add fine details with a higher frequency FBM
                         float detailNoise = fbm(p * 5.0 - motion * 0.1);
                         color += detailNoise * 0.05 * smoothstep(0.5, 1.0, length(uv)); // More detail further out


                         // Softer vignette
                         float vignette = smoothstep(1.2, 0.0, length(uv));
                         color *= vignette;

                         // Subtler starfield
                         float starDensity = 150.0; // Fewer stars
                         vec2 gridUV = fract(uv * starDensity);
                         vec2 id = floor(uv * starDensity);
                         float starHash = hash(id + sin(time * 0.03 + id.y * 0.05)); /* Slower twinkle */

                         float star = 0.0;
                         if (starHash > 0.998) { // Higher threshold
                             float size = fract(starHash * 100.0) * 0.005 + 0.001; // Smaller size range
                             float falloff = smoothstep(size, 0.0, length(gridUV - 0.5));
                              star = falloff * (fract(starHash * 10.0) * 0.3 + 0.7); // Subtler twinkle
                         }
                         color = mix(color, color + vec3(star), star); // Add stars


                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Galactic Whisper ---


            // --- Shader: Serene Plasma (Swirling Plasma Remorphed) ---
            {
                 id: 'serene-plasma',
                 title: 'Serene Plasma',
                 description: 'A calm, swirling sea of gentle energy with smooth color transitions.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(123.4, 567.8))) * 43758.5453); }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i);
                        float b = hash(i + vec2(1, 0));
                        float c = hash(i + vec2(0, 1));
                        float d = hash(i + vec2(1, 1));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 1.0;
                        for (int i = 0; i < 6; i++) {
                            v += noise(p) * a;
                            p = p * 2.0 + 1.0;
                            a *= 0.5;
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;

                        // Smooth swirl effect
                        float angle = time * 0.1; // Slower base rotation
                        float swirlIntensity = fbm(uv * 1.0 + vec2(time * 0.05, time * 0.03)) * 1.0; // Lower intensity, slower noise
                        vec2 rotated_uv = vec2(
                            uv.x * cos(angle + swirlIntensity) - uv.y * sin(angle + swirlIntensity),
                            uv.x * sin(angle + swirlIntensity) + uv.y * cos(angle + swirlIntensity)
                        );

                        // Plasma pattern using FBM on rotated coordinates
                        float plasma = fbm(rotated_uv * 3.0 + vec2(time * 0.1)); // Slower frequency

                        // Add another layer of slower noise
                        float slowPlasma = fbm(rotated_uv * 5.0 - vec2(time * 0.08) + 10.0); // Slower layer

                        // Combine smoothly
                        float finalPlasma = plasma + slowPlasma * 0.5;
                         finalPlasma += sin(time * 1.0) * 0.05; // Subtle pulse, slower


                        // Color mapping (Soothing, natural gradients)
                        vec3 color = vec3(0.0);
                        color = mix(color, vec3(0.1, 0.3, 0.6), smoothstep(0.0, 0.5, finalPlasma)); // Blue
                        color = mix(color, vec3(0.2, 0.6, 0.4), smoothstep(0.3, 0.7, finalPlasma)); // Greenish-blue
                        color = mix(color, vec3(0.8, 0.5, 0.1), smoothstep(0.6, 0.9, finalPlasma)); // Orange
                         color = mix(color, vec3(1.0, 0.8, 0.5), smoothstep(0.8, 1.0, finalPlasma)); // Lighter orange/yellow


                        // Apply a soft vignette
                        float vignette = smoothstep(1.5, 0.0, length(uv));
                        color *= vignette;

                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
            }, // --- End Shader: Serene Plasma ---


            // --- Shader: Chronos Aperture (Fractal Tunnel Remorphed) ---
             // Note: Raymarching shaders can be more computationally expensive.
            {
                 id: 'chronos-aperture',
                 title: 'Chronos Aperture',
                 description: 'Journey through a stable, unfolding fractal structure beyond time.',
                 fragmentShader: `
                    precision highp float; // Use high precision

                    uniform float time;
                    uniform vec2 resolution;

                    #define MAX_STEPS 120 // More steps for detail
                    #define MAX_DIST 80.0 // Longer view distance
                    #define SURF_DIST 0.0008 // Tighter hit distance for smoother surfaces

                    // Rotation Matrices
                    mat3 rotationY(float angle) { float c = cos(angle), s = sin(angle); return mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c); }
                    mat3 rotationX(float angle) { float c = cos(angle), s = sin(angle); return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c); }

                    // Basic 3D noise function
                     float hash3d(vec3 p) { vec3 q = dot(p, vec3(123.4, 567.8, 901.2)) + time * 0.5; return fract(sin(q.x + q.y + q.z) * 87654.321); } // Slower time influence
                     float noise3d(vec3 p) {
                         vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
                         float n = i.x + i.y*157.0 + i.z*113.0;
                         return mix(mix(mix(hash3d(i+vec3(0,0,0)), hash3d(i+vec3(1,0,0)),f.x), mix(hash3d(i+vec3(0,1,0)), hash3d(i+vec3(1,1,0)),f.x),f.y),
                                mix(mix(hash3d(i+vec3(0,0,1)), hash3d(i+vec3(1,0,1)),f.x), mix(hash3d(i+vec3(0,1,1)), hash3d(i+vec3(1,1,1)),f.x),f.z);
                     }
                     float fbm3d(vec3 p) { float total = 0.0; float amplitude = 0.5; float frequency = 1.0; for(int i=0; i<4; i++) { total += noise3d(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; } return total; }


                    // Fractal SDF - Smoother folding/scaling
                    float fractalSDF(vec3 p) {
                         vec3 ap = abs(p);
                         if (ap.x < ap.y) p.xy = p.yx;
                         if (ap.x < ap.z) p.xz = p.zx;
                         if (ap.y < ap.z) p.yz = p.zy;

                         p = p * 1.8 - vec3(0.9); // Slower scaling, centered

                         // Add subtle noise-driven distortion
                         p += fbm3d(p * 1.0 + time * 0.1) * 0.1; // Subtle noise distortion


                         float d = length(p) - 1.0; // Base shape

                         return d / 1.8; // Scale distance less aggressively
                    }

                    // Scene SDF - combines fractal repeats with gentle twisting
                    float sceneSDF(vec3 p) {
                         // Gentle twisting down the tunnel
                         float twistAngle = p.z * 0.2 + time * 0.2; // Slower twist
                         vec2 twisted_xy = vec2(
                             p.x * cos(twistAngle) - p.y * sin(twistAngle),
                             p.x * sin(twistAngle) + p.y * cos(twistAngle)
                         );
                         p.xy = twisted_xy;

                         // Repeat the fractal shape along the Z axis
                         vec3 q = p;
                         q.z = mod(p.z, 5.0) - 2.5; // Repeat every 5 units


                         return fractalSDF(q);
                    }

                    // Raymarching
                    float rayMarch(vec3 ro, vec3 rd) {
                        float dist = 0.0;
                        for (int i = 0; i < MAX_STEPS; i++) {
                            vec3 pos = ro + rd * dist;
                            float dS = sceneSDF(pos);
                            if (dS < SURF_DIST) return dist;
                            dist += dS;
                            if (dist >= MAX_DIST) break;
                        }
                        return MAX_DIST;
                    }

                    // Estimate normal
                    vec3 estimateNormal(vec3 p) {
                        float d = sceneSDF(p);
                        vec2 e = vec2(0.001, 0.0);
                        vec3 n = d - vec3(
                            sceneSDF(p - e.xyy),
                            sceneSDF(p - e.yxy),
                            sceneSDF(p - e.yyx)
                        );
                        return normalize(n);
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;

                        // Camera moving smoothly down the tunnel
                        vec3 ro = vec3(sin(time * 0.2) * 0.2, cos(time * 0.25) * 0.2, time * 2.0); // Slower movement, subtle bob
                        vec3 rd = normalize(vec3(uv, 1.0));

                        // Apply camera rotation and position based on time
                        mat3 camRot = rotationY(time * 0.1); // Slower camera spin
                         rd = camRot * rd;
                         ro = camRot * ro;


                        float dist = rayMarch(ro, rd);

                        vec3 col = vec3(0.0); // Background color
                        if (dist < MAX_DIST) {
                            // Surface hit
                            vec3 p = ro + rd * dist;
                            vec3 normal = estimateNormal(p);
                            vec3 lightDir = normalize(vec3(sin(time * 0.3), 0.5, cos(time * 0.4))); // Slower, smoother light
                            float diff = clamp(dot(normal, lightDir), 0.0, 1.0);

                            // Sophisticated lighting and colors
                             vec3 materialColor = vec3(0.1, 0.4, 0.6); // Base material color
                             vec3 ambientColor = vec3(0.05, 0.1, 0.15); // Dark ambient light
                             vec3 lightColor = vec3(0.8, 0.7, 0.5); // Warm light source
                             vec3 specularColor = vec3(1.0); // White specular highlight

                            // Ambient, Diffuse, Specular lighting
                             vec3 litColor = ambientColor + materialColor * diff * lightColor;
                             float spec = pow(clamp(dot(reflect(-lightDir, normal), normalize(ro - p)), 0.0, 1.0), 32.0); // Sharper specular
                             litColor += specularColor * spec;

                            // Add color variation based on position and time
                             litColor += sin(p * 0.3 + time * 0.5) * 0.08 + 0.08; // Subtle color pulse


                            col = litColor;

                            // Apply smooth fog based on distance
                            float fog = exp(-dist * 0.1); // Softer fog density
                             col = mix(vec3(0.02, 0.02, 0.05), col, fog); // Mix with deep blue/black


                        } else {
                            // Background - deep space
                             col = mix(vec3(0.0), vec3(0.02, 0.02, 0.08), smoothstep(0.0, 1.0, length(uv))); // Gentle radial gradient
                        }

                         // Final color adjustments
                         col = clamp(col, 0.0, 1.0);
                         col = pow(col, vec3(0.4545));


                        gl_FragColor = vec4(col, 1.0);
                    }
                 `
             }, // --- End Shader: Chronos Aperture ---

             // --- Shader: Bio-Luminescent Grid (Circuit Grid Remorphed) ---
             {
                 id: 'bio-luminescent-grid',
                 title: 'Bio-Luminescent Grid',
                 description: 'An organic, flowing network of glowing energy pathways.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(654.32, 210.98))) * 98765.4321); }
                    float noise(vec2 st) {
                        vec2 i = floor(st); vec2 f = fract(st); f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i + vec2(0.0, 0.0)); float b = hash(i + vec2(1.0, 0.0));
                        float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }
                     float fbm(vec2 st) {
                        float value = 0.0; float amplitude = 0.5; float frequency = 2.0;
                        for (int i = 0; i < 5; i++) { value += amplitude * noise(st * frequency); st *= 2.0; amplitude *= 0.5; } return value; // Fewer octaves
                    }


                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Moderate, organic tiling
                        vec2 tiled_uv = uv * vec2(40.0, 30.0); // Less dense tiling

                        // Add smooth noise distortion to the UV coordinates
                        vec2 noiseDistortion = vec2(
                            fbm(uv * 4.0 + time * 0.5), // Slower noise
                            fbm(uv * 4.5 - time * 0.4)
                        ) * 0.1; // Softer distortion intensity
                        tiled_uv += noiseDistortion * vec2(10.0, 10.0); // Apply distortion scaled by tiling

                        // Calculate grid lines - softer and glowing
                        vec2 grid = abs(fract(tiled_uv) - 0.5);
                        float lines = max(grid.x, grid.y);
                        lines = 1.0 - smoothstep(0.49, 0.5, lines); // Soft transition


                        // Add smooth, organic glow
                        float glow = pow(lines, 2.0); // Softer falloff
                         glow += pow(lines, 5.0); // Brighter core


                        // Animate lines flowing smoothly
                        vec2 animated_tiled_uv = uv * vec2(30.0, 25.0);
                        animated_tiled_uv.x += time * 0.08; // Slower flow
                        animated_tiled_uv.y += sin(time * 1.0 + uv.x * 8.0) * 0.03; // Gentler vertical wave
                         animated_tiled_uv += noiseDistortion * vec2(5.0, 5.0); // Apply distortion


                        vec2 animated_grid = abs(fract(animated_tiled_uv) - 0.5);
                        float animated_lines = max(animated_grid.x, animated_grid.y);
                        animated_lines = 1.0 - smoothstep(0.49, 0.5, animated_lines);

                        float animated_glow = pow(animated_lines, 2.0);


                        // Combine static grid and animated glow
                        float final_lines = max(lines, animated_glow);


                        // Color palette: Bio-luminescent greens, blues, soft transitions
                        vec3 grid_color_1 = vec3(0.2, 0.8, 0.2); // Soft green
                        vec3 grid_color_2 = vec3(0.2, 0.2, 0.8); // Soft blue
                         vec3 highlight_color = vec3(0.8, 1.0, 0.8); // Lighter highlight

                        vec3 bg_color = vec3(0.05, 0.05, 0.1); // Dark blueish base

                        // Mix colors based on final line intensity and noise/time
                        vec3 color = mix(bg_color, grid_color_1, smoothstep(0.0, 0.8, final_lines) * (sin(time * 0.5)*0.2 + 0.8)); // Green pulse
                         color = mix(color, grid_color_2, pow(final_lines, 3.0) * (cos(time * 0.6)*0.3 + 0.7)); // Blue highlights pulse
                         color = mix(color, highlight_color, pow(final_lines, 8.0) * (sin(time * 0.8)*0.4 + 0.6)); // Soft highlight pulse


                        // Add subtle, slow noise/texture overlay
                        float staticNoise = fract(sin(dot(uv * 50.0 - time * 0.5, vec2(1.0, 2.0))) * 123.45);
                        color += staticNoise * 0.05; // Subtle static


                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
             }, // --- End Shader: Bio-Luminescent Grid ---

             // --- Shader: Toxic Bloom (Acidic Rain Remorphed) ---
             {
                 id: 'toxic-bloom',
                 title: 'Toxic Bloom',
                 description: 'Organic tendrils of toxic energy blooming in a vibrant, unsettling atmosphere.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float rand(vec2 co) {
                        return fract(sin(dot(co.xy, vec2(876.54, 321.09))) * 54321.6789);
                    }
                     float noise(vec2 st) {
                         vec2 i = floor(st); vec2 f = fract(st); f = f*f*(3.0-2.0*f);
                         float a = rand(i + vec2(0.0, 0.0)); float b = rand(i + vec2(1.0, 0.0));
                         float c = rand(i + vec2(0.0, 1.0)); float d = rand(i + vec2(1.0, 1.0));
                         return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                     }
                     float fbm(vec2 st) {
                         float value = 0.0; float amplitude = 0.5; float frequency = 2.0;
                         for (int i = 0; i < 5; i++) { value += amplitude * noise(st * frequency); st *= 2.0; amplitude *= 0.5; } return value;
                     }


                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Create flowing tendrils (simulated rain/particles)
                        float bloomAmount = 0.0;
                        float speed = 0.8; // Slower flow
                        float density = 80.0; // Moderate density

                        for(float i = 0.0; i < density; i++) {
                            // Calculate the position of the tendril/particle
                            float linePos = fract(uv.x * 10.0 + i / density + time * speed + rand(vec2(i, 0.0)) * 2.0); // Moderate horizontal offset
                            float lineFall = fract(uv.y * 15.0 + time * speed * 1.2 + rand(vec2(i, 1.0)) * 1.5); // Moderate fall

                            // Shape the tendril - soft, organic
                            float dropShape = smoothstep(0.0, 0.05, abs(linePos - 0.5)); // Softer center
                            dropShape *= smoothstep(0.0, 0.3, lineFall) * smoothstep(1.0, 0.7, lineFall); // Softer length and fade

                            bloomAmount += dropShape;
                        }

                        bloomAmount = clamp(bloomAmount, 0.0, 1.0) * 0.6; // Clamp and reduce intensity


                        // Background colors - vibrant, toxic bloom
                        vec3 bgColor = vec3(0.1, 0.05, 0.1); // Dark base
                        vec3 accentColor = vec3(0.3, 1.0, 0.3); // Vibrant green
                         vec3 secondaryAccent = vec3(0.8, 0.2, 1.0); // Vibrant purple


                        // Mix colors based on bloom amount and noise/time
                        vec3 color = mix(bgColor, accentColor, smoothstep(0.0, 0.7, bloomAmount) * (sin(time * 0.8)*0.3 + 0.7)); // Green pulse
                         color = mix(color, secondaryAccent, smoothstep(0.3, 1.0, bloomAmount) * (cos(time * 0.9)*0.4 + 0.6)); // Purple pulse


                        // Add a layer of smooth, warping distortion
                         vec2 distorted_uv = uv;
                         distorted_uv.y += sin(uv.x * 8.0 + time * 1.0) * 0.03; // Gentle wave
                         distorted_uv.x += cos(uv.y * 7.0 + time * 0.9) * 0.02; // Gentle vertical wave


                         // Add subtle, slow noise/texture
                         float staticNoise = fract(sin(dot(uv * 40.0 - time * 0.1, vec2(1.0, 2.0))) * 123.45);
                         color += staticNoise * 0.03; // Very subtle static


                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
             } // --- End Shader: Toxic Bloom ---


            /*
            // --- Template for Adding MORE Amazing Shaders ---
            ,{
                id: 'my-masterpiece', // MUST be unique
                title: 'Procedural Masterpiece',
                description: 'A stunning example of generative art.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;
                    // Remember uniforms time and resolution are available.
                    // Focus on complex patterns, smooth motion, and harmonious colors.
                    // Avoid rapid flashing or excessive random jumps.

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;
                        // Your most amazing shader logic...
                        // Example: A smooth, evolving noise pattern with color cycles
                        vec2 p = uv * 3.0;
                        float n = fbm(p + vec2(time*0.1, time*0.05)); // Use FBM or similar noise

                        vec3 color = vec3(0.0);
                        color.r = smoothstep(0.4, 0.7, n + sin(time*0.5)*0.1);
                        color.g = smoothstep(0.3, 0.6, n + cos(time*0.6)*0.1);
                        color.b = smoothstep(0.5, 0.8, n + sin(time*0.7)*0.1);

                        gl_FragColor = vec4(color, 1.0);
                    }
                     // You would need hash and fbm functions defined within this shader string.
                     // Copy them from other shaders if needed.
                `
            } // --- End Shader: Template ---
            */

        ]; // ================== End of Shader Definitions ==================


        // ========================================================================
        // Shader Renderer Class (Handles WebGL and Recording)
        // (This class remains the same as the previous version, it's already modular)
        // ========================================================================
        class ShaderRenderer {
            constructor(canvas, fragmentShader) {
                this.canvas = canvas;
                this.fragmentShader = fragmentShader;
                this.time = Math.random() * 100; // Start time from a random point
                this.isActive = false;
                this.animationFrameId = null;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordingMimeType = '';
                this.recordingFileExtension = '';
                this.resizeTimeout = null;
                this.handleResize = this.handleResize.bind(this);
                this.render = this.render.bind(this);
                this.init();
            }

            init() {
                if (!window.WebGLRenderingContext) {
                     console.error("WebGL is not supported in your browser.");
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                         ctx.fillStyle = '#f44336';
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('WebGL Not Supported', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null;
                     return;
                }

                try {
                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        preserveDrawingBuffer: true,
                        antialias: true
                    });
                    this.renderer.setPixelRatio(window.devicePixelRatio * 0.75);

                } catch (error) {
                     console.error("Error creating WebGL Renderer:", error);
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                         ctx.fillStyle = '#f44336';
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('Renderer Init Failed', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null;
                     return;
                }

                this.scene = new THREE.Scene();
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: this.time },
                        resolution: { value: new THREE.Vector2(this.canvas.width, this.canvas.height) }
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                    fragmentShader: this.fragmentShader,
                    depthWrite: false, depthTest: false
                });

                const geometry = new THREE.PlaneGeometry(2, 2);
                const mesh = new THREE.Mesh(geometry, this.material);
                this.scene.add(mesh);

                this.resize();
                window.addEventListener('resize', this.handleResize);
            }

            resize() {
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                const devicePixelRatio = window.devicePixelRatio * 0.75;
                const displayWidth = Math.floor(width * devicePixelRatio);
                const displayHeight = Math.floor(height * devicePixelRatio);

                if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                    if (this.renderer) {
                        this.renderer.setSize(displayWidth, displayHeight, false);
                        if (this.material && this.material.uniforms.resolution) {
                             this.material.uniforms.resolution.value.set(displayWidth, displayHeight);
                        }
                    }
                }
            }

            handleResize() {
                clearTimeout(this.resizeTimeout);
                this.resizeTimeout = setTimeout(() => {
                    this.resize();
                }, 150);
            }

            render() {
                if (!this.isActive || !this.renderer) {
                    if (this.animationFrameId) {
                        cancelAnimationFrame(this.animationFrameId);
                        this.animationFrameId = null;
                    }
                    return;
                }

                this.animationFrameId = requestAnimationFrame(this.render);

                this.time += 0.016;
                 if (this.material && this.material.uniforms.time) {
                    this.material.uniforms.time.value = this.time;
                 }

                try {
                    this.renderer.render(this.scene, this.camera);
                } catch (renderError) {
                    console.error("Error during WebGL rendering:", renderError);
                    this.stop();
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                          ctx.fillStyle = '#f44336';
                          ctx.font = '14px Roboto, sans-serif';
                          ctx.textAlign = 'center';
                           ctx.fillText('Render Error', this.canvas.width / 2, this.canvas.height / 2);
                     }
                }
            }

            start() {
                if (this.isActive || !this.renderer) return;
                this.isActive = true;
                this.resize();
                this.render();
            }

            stop() {
                this.isActive = false;
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                window.removeEventListener('resize', this.handleResize);
            }

            // --- Recording Logic ---
            async startRecording(duration = 60) {
                 return new Promise(async (resolve, reject) => {
                    if (!this.canvas || !this.isActive || !this.renderer) {
                        console.error("Cannot record: Renderer not active or canvas not found.");
                        return reject("Renderer not active or canvas missing");
                    }
                    if (!this.canvas.captureStream) {
                        console.error("canvas.captureStream() not supported.");
                        alert("Video recording is not supported in your browser (canvas.captureStream missing).");
                        return reject("captureStream not supported");
                    }
                    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                        console.warn("Recording already in progress.");
                        return reject("Recording in progress");
                    }

                    const supportedTypes = [
                        { mime: 'video/mp4', extension: 'mp4' },
                        { mime: 'video/webm;codecs=vp9', extension: 'webm' },
                        { mime: 'video/webm;codecs=vp8', extension: 'webm' },
                        { mime: 'video/webm', extension: 'webm' }
                    ];
                    let selectedType = null;
                    for (const typeInfo of supportedTypes) {
                        if (MediaRecorder.isTypeSupported(typeInfo.mime)) {
                            selectedType = typeInfo;
                            console.log(`Using MIME type: ${selectedType.mime}`);
                            break;
                        }
                    }

                    if (!selectedType) {
                        console.error("No supported MIME type found for MediaRecorder (MP4 or WEBM).");
                        alert("Video recording failed: No supported video format (MP4/WEBM) found in your browser.");
                        return reject("No supported MIME type");
                    }

                    this.recordingMimeType = selectedType.mime;
                    this.recordingFileExtension = selectedType.extension;

                    try {
                        const stream = this.canvas.captureStream(30);
                        this.mediaRecorder = new MediaRecorder(stream, {
                            mimeType: this.recordingMimeType,
                            videoBitsPerSecond: 10000000 // Higher bitrate
                        });
                    } catch (error) {
                        console.error("Failed to create MediaRecorder:", error);
                        alert(`Video recording failed: Could not create recorder. Error: ${error.message}`);
                        return reject(`MediaRecorder creation failed: ${error.message}`);
                    }

                    this.recordedChunks = [];
                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                        } else {
                             console.warn(">>> ondataavailable fired with empty data chunk.");
                        }
                    };

                    this.mediaRecorder.onstop = () => {
                        console.log(`Recording stopped. Final chunks count: ${this.recordedChunks.length}`);
                        resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                    };

                    this.mediaRecorder.onerror = (e) => {
                        console.error("MediaRecorder error:", e.error);
                        alert(`Video recording error: ${e.error.name} - ${e.error.message}`);
                        reject(`MediaRecorder error: ${e.error.name}`);
                    };

                    this.mediaRecorder.start(1000);
                    console.log(`Recording started for ${duration} seconds (${this.recordingMimeType})...`);

                    setTimeout(() => {
                        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                            this.mediaRecorder.stop();
                        }
                    }, duration * 1000);
                });
            }

            saveRecordedVideo(filename = 'shader_video') {
                 if (!this.recordedChunks || this.recordedChunks.length === 0) {
                    console.error("No recorded data to save.");
                    return false;
                }
                 if (!this.recordingMimeType || !this.recordingFileExtension) {
                     console.error("Missing recording format information.");
                     return false;
                 }

                const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `${filename}.${this.recordingFileExtension}`;

                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    this.recordedChunks = [];
                    this.recordingMimeType = '';
                    this.recordingFileExtension = '';
                }, 100);

                return true;
            }
        }


        // ========================================================================
        // Main Application Logic
        // ========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {};

            if (!window.WebGLRenderingContext) {
                 shadersListDiv.innerHTML = '<p style="color: red; text-align: center; font-size: 1.2rem;">Your browser does not support WebGL. This showcase requires WebGL.</p>';
                 document.querySelector('h1').textContent = 'WebGL Required';
                 document.querySelector('.intro-text').textContent = 'Please use a modern browser like Chrome, Firefox, Edge, or Safari.';
                 return;
            }


            wallpapers.forEach(wallpaper => {
                const container = document.createElement('div');
                container.className = 'shader-container';
                container.dataset.id = wallpaper.id;

                const headerDiv = document.createElement('div');
                headerDiv.className = 'shader-header';

                 const shaderInfoDiv = document.createElement('div');
                 shaderInfoDiv.className = 'shader-info';

                const title = document.createElement('h2');
                title.className = 'shader-title';
                title.textContent = wallpaper.title;
                 shaderInfoDiv.appendChild(title);

                const description = document.createElement('p');
                description.className = 'shader-description';
                description.textContent = wallpaper.description;
                 shaderInfoDiv.appendChild(description);

                 headerDiv.appendChild(shaderInfoDiv);
                 container.appendChild(headerDiv);

                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${wallpaper.id}`;
                container.appendChild(canvas);

                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'controls';

                const button = document.createElement('button');
                button.id = `button-${wallpaper.id}`;
                const recordingDuration = 60;
                button.textContent = `Record & Download (${recordingDuration}s)`;
                button.dataset.id = wallpaper.id;


                const statusSpan = document.createElement('span');
                statusSpan.id = `status-${wallpaper.id}`;
                statusSpan.className = 'status-indicator';
                statusSpan.style.display = 'none';


                controlsDiv.appendChild(button);
                controlsDiv.appendChild(statusSpan);
                container.appendChild(controlsDiv);
                shadersListDiv.appendChild(container);

                setTimeout(() => {
                    try {
                        const renderer = new ShaderRenderer(canvas, wallpaper.fragmentShader);
                        shaderInstances[wallpaper.id] = renderer;
                        renderer.start();
                    } catch (error) {
                        console.error(`Failed to initialize renderer for ${wallpaper.id}:`, error);
                         button.disabled = true;
                         button.textContent = 'Renderer Failed';
                         statusSpan.textContent = 'Error initializing shader.';
                         statusSpan.className = 'status-indicator status-error';
                         statusSpan.style.display = 'inline-block';
                    }
                }, 100);


                let recordingTimerInterval = null;

                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const renderer = shaderInstances[shaderId];
                    const status = document.getElementById(`status-${shaderId}`);

                    if (!renderer || renderer.mediaRecorder?.state === 'recording') {
                        console.warn("Renderer not initialized or already recording.");
                        return;
                    }

                    button.disabled = true;
                    status.style.display = 'inline-block';
                    status.className = 'status-indicator status-recording';
                    status.textContent = `Recording (0/${recordingDuration}s)...`;

                    let elapsedSeconds = 0;
                    recordingTimerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (elapsedSeconds <= recordingDuration) {
                             status.textContent = `Recording (${elapsedSeconds}/${recordingDuration}s)...`;
                        } else {
                            clearInterval(recordingTimerInterval);
                            recordingTimerInterval = null;
                        }
                    }, 1000);


                    try {
                        await renderer.startRecording(recordingDuration);

                        clearInterval(recordingTimerInterval);
                        recordingTimerInterval = null;

                        status.textContent = 'Processing...';
                        status.className = 'status-indicator status-processing';

                        const success = renderer.saveRecordedVideo(`${shaderId}_video_${recordingDuration}s`);

                        if (success) {
                            status.textContent = '✅ Download Started!';
                            status.className = 'status-indicator status-success';
                        } else {
                            status.textContent = '❌ Download Failed';
                            status.className = 'status-indicator status-error';
                        }

                    } catch (error) {
                        console.error(`Recording or saving failed for ${shaderId}:`, error);
                        clearInterval(recordingTimerInterval);
                        recordingTimerInterval = null;
                        status.textContent = `❌ Error: ${error.message || error}`;
                        status.className = 'status-indicator status-error';

                    } finally {
                        setTimeout(() => {
                            button.disabled = false;
                            button.textContent = `Record & Download (${recordingDuration}s)`;
                            status.style.display = 'none';
                            status.className = 'status-indicator';
                        }, 3000);
                    }
                });
            });

            window.addEventListener('beforeunload', () => {
                Object.values(shaderInstances).forEach(renderer => {
                    if (renderer) { renderer.stop(); }
                });
            });
        });
    </script>
