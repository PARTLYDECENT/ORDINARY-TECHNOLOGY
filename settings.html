<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Shader Recorder | 1-Minute Clips</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent-blue: #007bff;
            --accent-purple: #673ab7;
            --status-recording: #f44336; /* Red */
            --status-processing: #ff9800; /* Orange */
            --status-success: #4caf50; /* Green */
            --status-error: #f44336; /* Red */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-y: auto; /* Allow scrolling */
             min-height: 100vh; /* Ensure body takes at least full viewport height */
        }

        /* Custom Scrollbar */
        body::-webkit-scrollbar {
            width: 12px;
        }
        body::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        body::-webkit-scrollbar-thumb {
            background-color: var(--accent-blue);
            border-radius: 6px;
            border: 3px solid var(--card-bg);
        }
        body { scrollbar-color: var(--accent-blue) var(--card-bg); }


        .main-container {
            max-width: 1000px; /* Wider container */
            margin: 40px auto; /* Center and add vertical margin */
            padding: 0 20px; /* Add horizontal padding on smaller screens */
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-weight: 700; /* Bolder title */
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            /* Gradient text effect */
            background: linear-gradient(to right, #6a11cb, #2575fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
            max-width: 700px; /* Limit width for readability */
            margin-left: auto;
            margin-right: auto;
        }

        .shader-container {
            margin-bottom: 40px;
            padding: 30px; /* Increased padding */
            background-color: var(--card-bg);
            border-radius: 12px; /* More rounded corners */
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); /* Stronger shadow */
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Add transitions */
        }
         .shader-container:hover {
             transform: translateY(-5px); /* Subtle lift effect */
             box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
         }

        .shader-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Align titles to the top */
            margin-bottom: 20px; /* More space */
            flex-wrap: wrap;
            gap: 20px; /* Increased gap */
        }
        .shader-info {
            flex-grow: 1; /* Allow info block to take space */
            min-width: 200px; /* Ensure it doesn't collapse */
        }
        .shader-title {
            font-size: 2rem; /* Larger title */
            font-weight: 700; /* Bolder title */
            margin: 0;
            color: var(--text-primary);
            line-height: 1.2; /* Tighter line height for large titles */
        }
         .shader-description {
             font-size: 0.95rem;
             color: var(--text-secondary);
             margin-top: 8px; /* Space below title */
             border-left: 4px solid var(--accent-purple); /* Thicker accent line */
             padding-left: 12px;
         }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px; /* More rounded corners */
            border: 2px solid #444; /* More prominent border */
             box-shadow: inset 0 0 15px rgba(0,0,0,0.8); /* Inner shadow */
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 20px; /* Increased space */
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px 30px; /* Larger padding */
            border-radius: 8px; /* More rounded corners */
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 250px; /* Ensure consistent width */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
             text-transform: uppercase; /* Uppercase button text */
             letter-spacing: 0.5px;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0056b3, #512da8); /* Darker hover */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px); /* More pronounced lift */
        }
        button:active:not(:disabled) {
             transform: translateY(0); /* Press down */
             box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.7; /* Dim opacity */
            box-shadow: none;
             transform: none;
        }
        .status-indicator {
            font-style: normal;
            font-weight: 500;
            padding: 8px 15px; /* More padding */
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease;
             min-width: 150px; /* Give status space */
             text-align: center;
        }
        .status-recording {
            background-color: rgba(var(--status-recording-rgb, 244, 67, 54), 0.2); /* Use rgba for transparency */
            color: var(--status-recording);
             border: 1px solid var(--status-recording); /* Add border */
        }
        .status-processing {
            background-color: rgba(var(--status-processing-rgb, 255, 152, 0), 0.2);
            color: var(--status-processing);
             border: 1px solid var(--status-processing);
        }
        .status-success {
            background-color: rgba(var(--status-success-rgb, 76, 175, 80), 0.2);
            color: var(--status-success);
             border: 1px solid var(--status-success);
        }
        .status-error {
            background-color: rgba(var(--status-error-rgb, 244, 67, 54), 0.2);
            color: var(--status-error);
             border: 1px solid var(--status-error);
        }

        /* Helper for defining RGB vars from hex */
        .status-recording { --status-recording-rgb: 244, 67, 54; }
        .status-processing { --status-processing-rgb: 255, 152, 0; }
        .status-success { --status-success-rgb: 76, 175, 80; }
        .status-error { --status-error-rgb: 244, 67, 54; }


         /* Responsive Adjustments */
        @media (max-width: 768px) {
             .main-container {
                 margin: 20px auto;
                 padding: 0 10px;
             }
             .shader-container {
                 padding: 20px;
             }
             .shader-title {
                 font-size: 1.5rem;
             }
             .shader-description {
                 font-size: 0.9rem;
             }
             button {
                 padding: 10px 20px;
                 font-size: 1rem;
                 min-width: 180px;
             }
             .status-indicator {
                  padding: 6px 12px;
                  font-size: 0.9rem;
                  min-width: 120px;
             }
             .controls {
                 gap: 10px;
             }
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>Advanced Shader Recorder</h1>
        <p class="intro-text">Explore real-time generative art. Click "Record & Download" to capture a **1-minute** video clip of any shader below. Recording format (MP4 or WEBM) depends on your browser. Please allow time for processing, especially for complex shaders.</p>

        <div id="shadersList">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ========================================================================
        // SHADER DEFINITIONS
        // ========================================================================
        // Add, remove, or comment out shader objects below to change the list.
        // Each object needs:
        // - id: A unique string (e.g., 'waves', 'my-shader').
        // - title: Text displayed as the heading.
        // - description: Text displayed below the title.
        // - fragmentShader: The GLSL code for the shader (use backticks ``).
        // ========================================================================

        const wallpapers = [

            // --- Shader: Nebula Realm ---
            {
                id: 'nebula-realm',
                title: 'Nebula Realm',
                description: 'Deep space cosmic clouds with subtle motion and vibrant colors, optimized for atmosphere.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    // Simple hash function for noise
                    float hash(vec2 p) {
                        p = fract(p * vec2(123.34, 456.21));
                        p += dot(p, p + 45.32);
                        return fract(p.x * p.y);
                    }

                    // Value noise
                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f); // Smooth interpolation
                        float a = hash(i);
                        float b = hash(i + vec2(1.0, 0.0));
                        float c = hash(i + vec2(0.0, 1.0));
                        float d = hash(i + vec2(1.0, 1.0));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    // Fractal Brownian Motion (FBM)
                    float fbm(vec2 p) {
                        float total = 0.0;
                        float amplitude = 0.5;
                        float frequency = 1.0;
                        for (int i = 0; i < 5; i++) { // Fewer octaves for performance/style
                            total += noise(p * frequency) * amplitude;
                            frequency *= 2.0;
                            amplitude *= 0.5;
                        }
                        return total;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;
                        vec2 p = uv * 1.5;

                        // Subtle motion effect
                        vec2 motion = vec2(time * 0.05, time * 0.03);

                        // Generate two layers of FBM for clouds
                        float n1 = fbm(p + motion);
                        float n2 = fbm(p * 1.8 + motion * 0.7 + 5.0);

                        // Mix colors based on noise values
                        vec3 col1 = vec3(0.1, 0.0, 0.3);     // Deep Violet
                        vec3 col2 = vec3(0.8, 0.1, 0.4);     // Magenta
                        vec3 col3 = vec3(0.0, 0.4, 0.7);     // Cyan
                        vec3 col4 = vec3(0.9, 0.7, 0.2);     // Gold

                        vec3 color = mix(col1, col2, smoothstep(0.3, 0.6, n1));
                        color = mix(color, col3, smoothstep(0.4, 0.7, n2));
                        color = mix(color, col4, smoothstep(0.6, 0.8, n1 * n2)); // Combine noise for complexity

                        // Add some subtle stars (more efficient than per-pixel check)
                        float starNoise = fract(sin(dot(uv * 500.0, vec2(12.9898, 78.233) + time * 0.1)) * 43758.5453);
                         if (starNoise > 0.995) { // Threshold for stars
                             color += vec3(1.0) * smoothstep(0.995, 1.0, starNoise) * 0.5; // White stars
                         }

                        // Apply a soft vignette
                        float vignette = smoothstep(1.2, 0.0, length(uv));
                        color *= vignette;

                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Nebula Realm ---


            // --- Shader: Circuit Grid ---
            {
                 id: 'circuit-grid',
                 title: 'Circuit Grid',
                 description: 'An abstract, animated grid pattern resembling a futuristic circuit board with glowing lines.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Tile the UV space
                        vec2 tiled_uv = uv * vec2(50.0, 30.0); // Adjust tiling density

                        // Calculate grid lines using fractional part
                        vec2 grid = abs(fract(tiled_uv) - 0.5);

                        // Create horizontal and vertical lines
                        float lines = max(grid.x, grid.y);
                        lines = 1.0 - smoothstep(0.48, 0.5, lines); // Sharper lines

                        // Add some glow/thickness based on distance to grid center
                        float glow = pow(lines, 5.0); // Make glow falloff faster
                        glow += pow(lines, 20.0); // Add a bright core

                        // Animate lines flowing/shifting
                        vec2 animated_tiled_uv = uv * vec2(40.0, 25.0);
                        animated_tiled_uv.x += time * 0.1; // Flow horizontally
                        animated_tiled_uv.y += sin(time * 0.5 + uv.x * 5.0) * 0.05; // Subtle vertical wave

                        vec2 animated_grid = abs(fract(animated_tiled_uv) - 0.5);
                        float animated_lines = max(animated_grid.x, animated_grid.y);
                        animated_lines = 1.0 - smoothstep(0.48, 0.5, animated_lines);

                        float animated_glow = pow(animated_lines, 5.0);

                        // Combine static grid and animated glow
                        float final_lines = max(lines, animated_glow);


                        // Color the grid lines and background
                        vec3 grid_color = vec3(0.2, 0.8, 1.0); // Bright cyan
                        vec3 bg_color = vec3(0.05, 0.0, 0.1); // Dark blue/purple background

                        vec3 color = mix(bg_color, grid_color, final_lines);

                        // Add subtle noise or static
                        float noise = fract(sin(dot(uv * 100.0 + time * 5.0, vec2(12.9898, 78.233))) * 43758.5453);
                        color += noise * 0.02; // Add subtle noise

                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
            }, // --- End Shader: Circuit Grid ---


            // --- Shader: Swirling Plasma ---
            {
                 id: 'swirling-plasma',
                 title: 'Swirling Plasma',
                 description: 'Hypnotic, colorful plasma effect with smooth, swirling motion and pulsing energy.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(123.4, 567.8))) * 43758.5453); }

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i);
                        float b = hash(i + vec2(1, 0));
                        float c = hash(i + vec2(0, 1));
                        float d = hash(i + vec2(1, 1));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 1.0;
                        for (int i = 0; i < 6; i++) {
                            v += noise(p) * a;
                            p = p * 2.0 + 1.0; // Increase frequency and offset
                            a *= 0.5; // Decrease amplitude
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;

                        // Swirl effect
                        float angle = time * 0.3; // Base rotation speed
                        float swirlIntensity = fbm(uv * 1.5 + vec2(time * 0.1, time * 0.05)) * 2.0; // Noise-driven intensity
                        vec2 rotated_uv = vec2(
                            uv.x * cos(angle + swirlIntensity) - uv.y * sin(angle + swirlIntensity),
                            uv.x * sin(angle + swirlIntensity) + uv.y * cos(angle + swirlIntensity)
                        );

                        // Plasma pattern using FBM on rotated coordinates
                        float plasma = fbm(rotated_uv * 4.0 + vec2(time * 0.2));

                        // Add another layer of faster noise
                        float fastPlasma = fbm(rotated_uv * 8.0 - vec2(time * 0.3) + 10.0);

                        // Combine and modulate for pulsing effect
                        float finalPlasma = plasma + fastPlasma * 0.5;
                        finalPlasma += sin(time * 2.0) * 0.1; // Subtle pulse

                        // Color mapping (Psychedelic gradient)
                        vec3 color = vec3(0.0);
                        color = mix(color, vec3(0.1, 0.2, 0.8), smoothstep(0.0, 0.4, finalPlasma)); // Deep Blue
                        color = mix(color, vec3(0.8, 0.1, 0.5), smoothstep(0.4, 0.6, finalPlasma)); // Pink/Purple
                        color = mix(color, vec3(1.0, 0.5, 0.0), smoothstep(0.6, 0.8, finalPlasma)); // Orange
                        color = mix(color, vec3(1.0, 1.0, 0.2), smoothstep(0.8, 1.0, finalPlasma)); // Yellow

                        // Apply a subtle vignette
                        float vignette = smoothstep(1.5, 0.0, length(uv));
                        color *= vignette;

                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
            }, // --- End Shader: Swirling Plasma ---


            // --- Shader: Fractal Tunnel (Raymarching) ---
             // Note: Raymarching shaders can be more computationally expensive.
            {
                 id: 'fractal-tunnel',
                 title: 'Fractal Tunnel',
                 description: 'Enter a hypnotic fractal tunnel rendered using raymarching, with twisting geometry and dynamic lighting.',
                 fragmentShader: `
                    precision highp float; // Use high precision

                    uniform float time;
                    uniform vec2 resolution;

                    #define MAX_STEPS 100
                    #define MAX_DIST 50.0
                    #define SURF_DIST 0.005 // Increased surface distance slightly

                    // Basic 3D noise function
                    float noise3d(vec3 p) {
                        vec3 i = floor(p);
                        vec3 f = fract(p);
                        f = f*f*(3.0-2.0*f);
                        float n = i.x + i.y*157.0 + i.z*113.0;
                        return mix(mix(mix(hash(n+0.0), hash(n+1.0), f.x),
                                   mix(hash(n+157.0), hash(n+158.0), f.x), f.y),
                               mix(mix(hash(n+113.0), hash(n+114.0), f.x),
                                   mix(hash(n+270.0), hash(n+271.0), f.x), f.y), f.z);
                    }
                     // Helper hash for 3D noise
                     float hash(float n) { return fract(sin(n) * 43758.5453); }


                    // Signed Distance Function for a repeating fractal shape (basic Mandelbox-like structure)
                    float fractalSDF(vec3 p) {
                         vec3 ap = abs(p);
                         // Folding and scaling (simplified fractal iteration)
                         if (ap.x < ap.y) p.xy = p.yx;
                         if (ap.x < ap.z) p.xz = p.zx;
                         if (ap.y < ap.z) p.yz = p.zy;

                         p = p * 2.0 - vec3(1.0); // Scale and offset

                         float d = length(p) - 1.0; // Base sphere

                         // Apply some noise-driven distortion
                         float distortion = noise3d(p * 0.8 + time * 0.2) * 0.5;
                         d += distortion;

                         return d / 2.0; // Scale distance for fractal effect
                    }

                    // Scene SDF - combines a few fractal repeats to form a tunnel
                    float sceneSDF(vec3 p) {
                         // Twist the space as we move down the tunnel (+Z)
                         float twistAngle = p.z * 0.5 + time * 0.5;
                         vec2 twisted_xy = vec2(
                             p.x * cos(twistAngle) - p.y * sin(twistAngle),
                             p.x * sin(twistAngle) + p.y * cos(twistAngle)
                         );
                         p.xy = twisted_xy;

                         // Repeat the fractal shape along the Z axis
                         vec3 q = mod(p, vec3(4.0)) - vec3(2.0); // Repeat every 4 units
                         return fractalSDF(q);
                    }

                    // Raymarching function
                    float rayMarch(vec3 ro, vec3 rd) {
                        float dist = 0.0;
                        for (int i = 0; i < MAX_STEPS; i++) {
                            vec3 pos = ro + rd * dist;
                            float dS = sceneSDF(pos);
                            if (dS < SURF_DIST) return dist; // Hit
                            dist += dS;
                            if (dist >= MAX_DIST) break; // Miss
                        }
                        return MAX_DIST; // No hit
                    }

                    // Estimate normal for lighting
                    vec3 estimateNormal(vec3 p) {
                        float d = sceneSDF(p);
                        vec2 e = vec2(0.001, 0.0);
                        vec3 n = d - vec3(
                            sceneSDF(p - e.xyy),
                            sceneSDF(p - e.yxy),
                            sceneSDF(p - e.yyx)
                        );
                        return normalize(n);
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;

                        // Camera position and direction (moving down the tunnel)
                        vec3 ro = vec3(0.0, 0.0, time * 2.0); // Move along Z
                        vec3 rd = normalize(vec3(uv, 1.0)); // Look down Z

                        // Raymarch the scene
                        float dist = rayMarch(ro, rd);

                        vec3 col = vec3(0.0); // Background color
                        if (dist < MAX_DIST) {
                            // Surface hit
                            vec3 p = ro + rd * dist;
                            vec3 normal = estimateNormal(p);
                            vec3 lightDir = normalize(vec3(sin(time * 0.5), 0.5, cos(time * 0.5))); // Moving light
                            float diff = clamp(dot(normal, lightDir), 0.0, 1.0);

                            // Basic color based on position/normal/light
                            col = vec3(0.1, 0.2, 0.4) * diff; // Base color
                            col += vec3(0.8, 0.5, 0.1) * pow(diff, 8.0); // Specular-like highlight

                            // Add color variation based on position
                            col += sin(p * 0.5 + time) * 0.1 + 0.1; // Pulsing color

                            // Apply fog based on distance
                            float fog = exp(-dist * 0.1); // Adjust fog density
                            col = mix(vec3(0.05, 0.05, 0.1), col, fog); // Mix with dark/foggy color

                        } else {
                            // Background - subtle cosmic effect or darkness
                            col = vec3(0.0); // Black background
                             // Or a faint starfield/noise:
                             // float backgroundNoise = fract(sin(dot(uv * 100.0 + time * 0.01, vec2(1.0, 2.0))) * 345.67);
                             // col += backgroundNoise * 0.05;
                        }

                         // Final color adjustments
                         col = clamp(col, 0.0, 1.0); // Clamp colors
                         col = pow(col, vec3(0.4545)); // Gamma correction


                        gl_FragColor = vec4(col, 1.0);
                    }
                 `
            }, // --- End Shader: Fractal Tunnel ---

             // --- Shader: Acidic Rain ---
             {
                 id: 'acid-rain',
                 title: 'Acidic Rain',
                 description: 'A chaotic, vertical rain effect with a sickly green and purple color scheme, giving a sense of toxic atmosphere.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float rand(vec2 co) {
                        return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
                    }

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Create vertical lines (rain)
                        float rainAmount = 0.0;
                        float speed = 2.0; // Speed of rain
                        float density = 50.0; // Density of rain lines

                        for(float i = 0.0; i < density; i++) {
                            // Calculate the position of the rain drop
                            float linePos = fract(uv.x * 10.0 + i / density + time * speed + rand(vec2(i, 0.0))); // Random horizontal offset
                            float lineFall = fract(uv.y * 20.0 + time * speed * 1.5 + rand(vec2(i, 1.0))); // Faster fall

                            // Shape the rain drop (elongated circle)
                            float dropShape = smoothstep(0.0, 0.02, abs(linePos - 0.5));
                            dropShape *= smoothstep(0.0, 0.1, lineFall) * smoothstep(1.0, 0.9, lineFall); // Length and fade

                            // Add to the total rain amount
                            rainAmount += dropShape;
                        }

                        // Clamp and brighten the rain effect
                        rainAmount = clamp(rainAmount, 0.0, 1.0) * 0.8;

                        // Background colors
                        vec3 bgColor = vec3(0.1, 0.05, 0.15); // Dark reddish-purple
                        vec3 accentColor = vec3(0.3, 0.8, 0.1); // Sickly green accent

                        // Mix background and rain color
                        vec3 color = mix(bgColor, accentColor, rainAmount);

                        // Add a subtle horizontal wave/distortion to the rain
                         vec2 distorted_uv = uv;
                         distorted_uv.y += sin(uv.x * 10.0 + time) * 0.05;

                         float distortedRain = 0.0;
                         for(float i = 0.0; i < density; i++) {
                            float linePos = fract(distorted_uv.x * 10.0 + i / density + time * speed + rand(vec2(i, 0.0)));
                            float lineFall = fract(distorted_uv.y * 20.0 + time * speed * 1.5 + rand(vec2(i, 1.0)));
                            float dropShape = smoothstep(0.0, 0.02, abs(linePos - 0.5));
                            dropShape *= smoothstep(0.0, 0.1, lineFall) * smoothstep(1.0, 0.9, lineFall);
                            distortedRain += dropShape;
                         }
                         distortedRain = clamp(distortedRain, 0.0, 1.0) * 0.8;

                         // Add the distorted rain with a different color/intensity
                         vec3 distortedRainColor = vec3(0.5, 0.2, 0.7); // Purpleish
                         color = mix(color, distortedRainColor, distortedRain * 0.5);


                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
             } // --- End Shader: Acidic Rain ---


            /*
            // --- Template for Adding a New Shader ---
            ,{
                id: 'my-unique-id', // MUST be unique
                title: 'My Awesome Shader',
                description: 'A brief description of what it does.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;
                    // You might need: varying vec2 vUv; depending on how you use the vertex shader
                    // The default vertex shader for the plane geometry provides vUv directly.

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;
                        // Your shader logic...
                        // Example: Simple color gradient
                        vec3 color = vec3(uv.x, uv.y, abs(sin(time)));

                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            } // --- End Shader: Template ---
            */

        ]; // ================== End of Shader Definitions ==================


        // ========================================================================
        // Shader Renderer Class (Handles WebGL and Recording)
        // ========================================================================
        class ShaderRenderer {
            constructor(canvas, fragmentShader) {
                this.canvas = canvas;
                this.fragmentShader = fragmentShader;
                // Start time from a random point for variation on load
                this.time = Math.random() * 100;
                this.isActive = false; // Controls animation loop
                this.animationFrameId = null; // Stores requestAnimationFrame ID

                // MediaRecorder related properties
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordingMimeType = '';
                this.recordingFileExtension = '';

                // Debounce for resize
                this.resizeTimeout = null;
                this.handleResize = this.handleResize.bind(this); // Bind handler to instance

                // Bind render method
                this.render = this.render.bind(this);

                this.init(); // Initialize Three.js scene
            }

            init() {
                // Check for WebGL support early
                if (!window.WebGLRenderingContext) {
                     console.error("WebGL is not supported in your browser.");
                     const ctx = this.canvas.getContext('2d'); // Try to draw a fallback message
                     if(ctx) {
                         ctx.fillStyle = '#f44336';
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('WebGL Not Supported', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null; // Explicitly null renderer if creation fails
                     return; // Stop initialization if no WebGL
                }

                try {
                    // Create WebGLRenderer instance
                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        preserveDrawingBuffer: true, // Important for capturing frames
                        antialias: true // Smooth edges
                    });
                    // Use device pixel ratio for sharpness, but maybe scale down for performance
                     this.renderer.setPixelRatio(window.devicePixelRatio * 0.75); // Render at 75% of device pixel ratio

                } catch (error) {
                     console.error("Error creating WebGL Renderer:", error);
                     // Fallback message on canvas if renderer creation fails
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                         ctx.fillStyle = '#f44336';
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('Renderer Init Failed', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null; // Ensure renderer is null on failure
                     return; // Stop initialization
                }

                // Setup Three.js scene
                this.scene = new THREE.Scene();
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); // Standard setup for 2D shaders

                // Create the shader material
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: this.time },
                        resolution: { value: new THREE.Vector2(this.canvas.width, this.canvas.height) }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: this.fragmentShader,
                    depthWrite: false, // Not needed for 2D shaders
                    depthTest: false // Not needed for 2D shaders
                });

                // Create a plane that fills the screen
                const geometry = new THREE.PlaneGeometry(2, 2);
                const mesh = new THREE.Mesh(geometry, this.material);
                this.scene.add(mesh);

                // Initial resize and attach resize listener
                this.resize();
                 window.addEventListener('resize', this.handleResize);
            }

            // Adjust canvas size and renderer viewport
            resize() {
                 // Get the display size of the canvas (CSS pixels)
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;

                // Calculate the size needed for rendering (incorporating pixel ratio)
                const devicePixelRatio = window.devicePixelRatio * 0.75; // Use scaled DP
                const displayWidth = Math.floor(width * devicePixelRatio);
                const displayHeight = Math.floor(height * devicePixelRatio);

                // Check if the canvas needs resizing
                if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                    // Resize the renderer and update the resolution uniform
                     if (this.renderer) { // Check if renderer exists
                        this.renderer.setSize(displayWidth, displayHeight, false); // false means don't update canvas style
                        if (this.material && this.material.uniforms.resolution) { // Check if material and uniform exist
                             this.material.uniforms.resolution.value.set(displayWidth, displayHeight);
                        }
                     }
                }
            }

            // Debounced resize handler
            handleResize() {
                clearTimeout(this.resizeTimeout);
                this.resizeTimeout = setTimeout(() => {
                    this.resize();
                }, 150); // Adjust debounce time as needed
            }

            // Render loop
            render() {
                 // Only render if active and renderer exists
                if (!this.isActive || !this.renderer) {
                    // Clear any pending animation frame request if not active
                    if (this.animationFrameId) {
                        cancelAnimationFrame(this.animationFrameId);
                        this.animationFrameId = null;
                    }
                    return;
                }

                // Request next frame
                this.animationFrameId = requestAnimationFrame(this.render);

                // Update time uniform
                this.time += 0.016; // Assuming 60fps (approx)
                 if (this.material && this.material.uniforms.time) { // Check if material and uniform exist
                    this.material.uniforms.time.value = this.time;
                 }


                // Render the scene
                try {
                    this.renderer.render(this.scene, this.camera);
                } catch (renderError) {
                    console.error("Error during WebGL rendering:", renderError);
                    // Attempt to stop animation and perhaps show an error on canvas
                    this.stop();
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); // Clear previous frame
                          ctx.fillStyle = '#f44336';
                          ctx.font = '14px Roboto, sans-serif';
                          ctx.textAlign = 'center';
                           ctx.fillText('Render Error', this.canvas.width / 2, this.canvas.height / 2);
                     }
                }
            }

            // Start the animation loop
            start() {
                 // Only start if not already active and renderer exists
                if (this.isActive || !this.renderer) return;
                this.isActive = true;
                this.resize(); // Ensure correct size before rendering
                this.render(); // Start the rendering loop
            }

            // Stop the animation loop and remove event listeners
            stop() {
                this.isActive = false;
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                 // Remove the resize listener when stopping
                window.removeEventListener('resize', this.handleResize);

                 // Clean up renderer and scene if needed (for full removal, not just pause)
                 // this.renderer.dispose();
                 // this.material.dispose();
                 // this.scene = null;
                 // this.camera = null;
                 // this.renderer = null;
                 // this.material = null;
            }

            // --- Recording Logic ---
            async startRecording(duration = 60) {
                 return new Promise(async (resolve, reject) => {
                    if (!this.canvas || !this.isActive || !this.renderer) {
                        console.error("Cannot record: Renderer not active or canvas not found.");
                        return reject("Renderer not active or canvas missing");
                    }
                    if (!this.canvas.captureStream) {
                        console.error("canvas.captureStream() not supported.");
                        alert("Video recording is not supported in your browser (canvas.captureStream missing).");
                        return reject("captureStream not supported");
                    }
                    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                        console.warn("Recording already in progress.");
                        return reject("Recording in progress");
                    }

                    // Determine supported MIME type (MP4 preferred)
                    const supportedTypes = [
                        { mime: 'video/mp4', extension: 'mp4' },
                        { mime: 'video/webm;codecs=vp9', extension: 'webm' },
                        { mime: 'video/webm;codecs=vp8', extension: 'webm' },
                        { mime: 'video/webm', extension: 'webm' }
                    ];
                    let selectedType = null;
                    for (const typeInfo of supportedTypes) {
                        if (MediaRecorder.isTypeSupported(typeInfo.mime)) {
                            selectedType = typeInfo;
                            console.log(`Using MIME type: ${selectedType.mime}`);
                            break; // Use the first supported type found
                        }
                    }

                    if (!selectedType) {
                        console.error("No supported MIME type found for MediaRecorder (MP4 or WEBM).");
                        alert("Video recording failed: No supported video format (MP4/WEBM) found in your browser.");
                        return reject("No supported MIME type");
                    }

                    this.recordingMimeType = selectedType.mime;
                    this.recordingFileExtension = selectedType.extension;

                    try {
                        // Create MediaRecorder from the canvas stream
                        const stream = this.canvas.captureStream(30); // 30 frames per second
                        this.mediaRecorder = new MediaRecorder(stream, {
                            mimeType: this.recordingMimeType,
                            videoBitsPerSecond: 8000000 // Higher bitrate for better quality (adjust as needed)
                             // audioBitsPerSecond: 128000 // Add if capturing audio from somewhere
                        });
                    } catch (error) {
                        console.error("Failed to create MediaRecorder:", error);
                        alert(`Video recording failed: Could not create recorder. Error: ${error.message}`);
                        return reject(`MediaRecorder creation failed: ${error.message}`);
                    }

                    // Event handlers for MediaRecorder
                    this.recordedChunks = [];
                    this.mediaRecorder.ondataavailable = (e) => {
                         // console.log(`>>> ondataavailable event fired. Data size: ${e.data.size}`);
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                            // console.log(`>>> Chunk added. Total chunks: ${this.recordedChunks.length}`);
                        } else {
                             console.warn(">>> ondataavailable fired with empty data chunk.");
                        }
                    };

                    this.mediaRecorder.onstop = () => {
                        console.log(`Recording stopped. Final chunks count: ${this.recordedChunks.length}`);
                        // Resolve the promise when recording is successfully stopped
                        resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                    };

                    this.mediaRecorder.onerror = (e) => {
                        console.error("MediaRecorder error:", e.error);
                        alert(`Video recording error: ${e.error.name} - ${e.error.message}`);
                         // Reject the promise on error
                        reject(`MediaRecorder error: ${e.error.name}`);
                    };

                    // Start the recording
                    this.mediaRecorder.start(1000); // Collect data every 1000ms (1 second)
                    console.log(`Recording started for ${duration} seconds (${this.recordingMimeType})...`);

                    // Stop recording after the specified duration
                    setTimeout(() => {
                        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                            this.mediaRecorder.stop();
                        }
                    }, duration * 1000); // duration is in seconds, setTimeout uses milliseconds
                });
            }

            saveRecordedVideo(filename = 'shader_video') {
                 if (!this.recordedChunks || this.recordedChunks.length === 0) {
                    console.error("No recorded data to save.");
                    // alert("Could not save video: No recording data found."); // Alert handled in UI logic
                    return false;
                }
                 if (!this.recordingMimeType || !this.recordingFileExtension) {
                     console.error("Missing recording format information.");
                     // alert("Could not save video: Recording format unknown."); // Alert handled in UI logic
                     return false;
                 }

                // Create a Blob from the recorded chunks
                const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                const url = URL.createObjectURL(blob);

                // Create a temporary anchor element to trigger download
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `${filename}.${this.recordingFileExtension}`;

                // Append to body, click, and remove
                document.body.appendChild(a);
                a.click();

                // Clean up the temporary element and the object URL
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url); // Release the object URL
                    // Reset chunks and format info after saving
                    this.recordedChunks = [];
                    this.recordingMimeType = '';
                    this.recordingFileExtension = '';
                }, 100); // Short delay to ensure download starts

                return true; // Indicate that save attempt was initiated
            }
        } // ================== End Shader Renderer Class ==================


        // ========================================================================
        // Main Application Logic
        // ========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {}; // Object to hold ShaderRenderer instances

            // Check if WebGL is supported before proceeding with UI creation
            if (!window.WebGLRenderingContext) {
                 shadersListDiv.innerHTML = '<p style="color: red; text-align: center;">Your browser does not support WebGL, which is required to display these shaders.</p>';
                 document.querySelector('h1').textContent = 'WebGL Not Supported'; // Update main title
                 document.querySelector('.intro-text').textContent = 'Please try a modern browser like Chrome, Firefox, Edge, or Safari.';
                 return; // Stop execution
            }


            // Dynamically create UI elements for each shader defined in the wallpapers array
            wallpapers.forEach(wallpaper => {
                // Create container div for the shader module
                const container = document.createElement('div');
                container.className = 'shader-container';
                container.dataset.id = wallpaper.id; // Add ID to container for easy reference

                // Create header div (contains title and future button)
                const headerDiv = document.createElement('div');
                headerDiv.className = 'shader-header';

                 // Shader Info block (title and description)
                 const shaderInfoDiv = document.createElement('div');
                 shaderInfoDiv.className = 'shader-info';

                // Add title
                const title = document.createElement('h2');
                title.className = 'shader-title';
                title.textContent = wallpaper.title;
                 shaderInfoDiv.appendChild(title);

                // Add description
                const description = document.createElement('p');
                description.className = 'shader-description';
                description.textContent = wallpaper.description;
                 shaderInfoDiv.appendChild(description);

                 headerDiv.appendChild(shaderInfoDiv); // Add info block to header
                 container.appendChild(headerDiv); // Add header to container


                // Create Canvas element
                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${wallpaper.id}`;
                // Set initial aspect ratio via CSS, let JS handle actual size
                container.appendChild(canvas);

                // Create Controls Area (Button + Status)
                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'controls';

                // Create Record Button
                const button = document.createElement('button');
                button.id = `button-${wallpaper.id}`;
                const recordingDuration = 60; // Recording duration in seconds
                button.textContent = `Record & Download (${recordingDuration}s)`;
                button.dataset.id = wallpaper.id; // Store shader ID on button


                // Create Status Indicator span
                const statusSpan = document.createElement('span');
                statusSpan.id = `status-${wallpaper.id}`;
                statusSpan.className = 'status-indicator';
                statusSpan.style.display = 'none'; // Initially hidden


                // Add button and status to controls div
                controlsDiv.appendChild(button);
                controlsDiv.appendChild(statusSpan);

                // Add controls div to the shader container
                container.appendChild(controlsDiv);

                // Add the completed shader container to the main list
                shadersListDiv.appendChild(container);

                // --- Initialize Shader Renderer ---
                // Delay initialization slightly to give the DOM time to settle and calculate canvas size
                setTimeout(() => {
                    try {
                        const renderer = new ShaderRenderer(canvas, wallpaper.fragmentShader);
                        shaderInstances[wallpaper.id] = renderer; // Store the renderer instance
                        renderer.start(); // Start the animation loop for this shader
                    } catch (error) {
                        console.error(`Failed to initialize renderer for ${wallpaper.id}:`, error);
                         // If init fails, disable the button and show an error status
                         button.disabled = true;
                         button.textContent = 'Renderer Failed';
                         statusSpan.textContent = 'Error initializing shader.';
                         statusSpan.className = 'status-indicator status-error';
                         statusSpan.style.display = 'inline-block';
                    }
                }, 100); // Short delay


                // --- Add Button Event Listener ---
                let recordingTimerInterval = null; // To manage the countdown timer display

                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const renderer = shaderInstances[shaderId];
                    const status = document.getElementById(`status-${shaderId}`);

                    // Prevent starting if renderer doesn't exist or recording is already active
                    if (!renderer || renderer.mediaRecorder?.state === 'recording') {
                        console.warn("Renderer not initialized or already recording.");
                        return;
                    }

                    // --- Start Recording Process ---
                    button.disabled = true; // Disable button during recording/processing
                    status.style.display = 'inline-block'; // Show status indicator
                    status.className = 'status-indicator status-recording';
                    status.textContent = `Recording (0/${recordingDuration}s)...`;

                    // Start the countdown timer display
                    let elapsedSeconds = 0;
                    recordingTimerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (elapsedSeconds <= recordingDuration) {
                             status.textContent = `Recording (${elapsedSeconds}/${recordingDuration}s)...`;
                        } else {
                            // Should be stopped by the main timeout, but clear interval just in case
                            clearInterval(recordingTimerInterval);
                            recordingTimerInterval = null;
                        }
                    }, 1000); // Update timer every second


                    try {
                        // Call the async startRecording method
                        await renderer.startRecording(recordingDuration);

                        // --- Recording Finished (Promise resolved) ---
                        clearInterval(recordingTimerInterval); // Stop the timer display
                        recordingTimerInterval = null; // Clear the interval ID

                        status.textContent = 'Processing...';
                        status.className = 'status-indicator status-processing'; // Switch to processing state

                        // Attempt to save the recorded video
                        const success = renderer.saveRecordedVideo(`${shaderId}_video_${recordingDuration}s`);

                        if (success) {
                            status.textContent = '✅ Download Started!';
                            status.className = 'status-indicator status-success'; // Indicate success
                        } else {
                            status.textContent = '❌ Download Failed';
                            status.className = 'status-indicator status-error'; // Indicate failure
                        }

                    } catch (error) {
                        // --- Recording or Saving Failed (Promise rejected) ---
                        console.error(`Recording or saving failed for ${shaderId}:`, error);
                        clearInterval(recordingTimerInterval); // Stop timer on error
                        recordingTimerInterval = null;
                        status.textContent = `❌ Error: ${error.message || error}`; // Display error message
                        status.className = 'status-indicator status-error'; // Indicate error

                    } finally {
                        // --- Final Cleanup ---
                        // Reset button and hide status after a short delay
                        setTimeout(() => {
                            button.disabled = false;
                            button.textContent = `Record & Download (${recordingDuration}s)`;
                            status.style.display = 'none'; // Hide status
                            status.className = 'status-indicator'; // Reset class
                        }, 3000); // Hide message after 3 seconds
                    }
                });
            });

            // --- Cleanup on page unload ---
            window.addEventListener('beforeunload', () => {
                 // Iterate through all shader instances and stop their animation loops
                Object.values(shaderInstances).forEach(renderer => {
                    if (renderer) {
                        renderer.stop(); // Stop the renderer's animation frame loop and remove resize listener
                        // Further cleanup of Three.js resources could be added here if needed
                        // renderer.renderer.dispose();
                        // renderer.material.dispose();
                    }
                });
            });
        });
        // ================= End Main Application Logic ===================
    </script>
