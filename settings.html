             border-left: 3px solid #c471ed; /* Accent line */
             padding-left: 10px;
        }
        canvas {
            display: block;
            width: 100%;

            margin-bottom: 20px;
            border-radius: 6px;

             display: flex;

             gap: 15px; /* Space between button and status */
             flex-wrap: wrap;
        }

            background: linear-gradient(135deg, #1e63c2, #764ba2); /* New gradient */
            color: white;
            border: none;

        }

             font-style: normal; /* Not italic */

             padding: 5px 10px;
             border-radius: 4px;
             display: inline-block; /* Allows padding */

        }
        .status-success {
             background-color: rgba(76, 175, 80, 0.2); /* Green background */

        }
        .status-error {
             background-color: rgba(244, 67, 54, 0.2); /* Error red background */

        }

                    float fbm(vec2 p) { float total = 0.0; float amplitude = 0.5; float frequency = 2.0; int octaves = 6; for (int i = 0; i < octaves; i++) { total += noise(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; } return total; }
                    void main() { vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y); vec2 p = uv * 1.5; vec2 motion = vec2(time * 0.03, time * 0.02); /* Slower motion for longer duration */ float n = fbm(p + motion); float n2 = fbm(p * 1.8 + motion * 0.5 + 5.0); vec3 col1 = vec3(0.1, 0.0, 0.3); vec3 col2 = vec3(0.8, 0.1, 0.4); vec3 col3 = vec3(0.0, 0.4, 0.7); vec3 col4 = vec3(0.9, 0.7, 0.2); vec3 color = mix(col1, col2, smoothstep(0.3, 0.6, n)); color = mix(color, col3, smoothstep(0.4, 0.7, n2)); color = mix(color, col4, smoothstep(0.7, 0.8, n * n2)); color *= smoothstep(1.5, 0.8, length(uv)); float starDensity = 200.0; vec2 gridUV = fract(uv * starDensity); vec2 id = floor(uv * starDensity); float starHash = hash(id + sin(time * 0.05 + id.y * 0.1)); /* Slower twinkle */ float star = 0.0; if (starHash > 0.99) { float size = fract(starHash * 100.0) * 0.01 + 0.002; float falloff = smoothstep(size, 0.0, length(gridUV - 0.5)); star = falloff * (fract(starHash * 10.0) * 0.5 + 0.5); } color = mix(color, color + vec3(star), star); gl_FragColor = vec4(color, 1.0); }

{
    id: 'nebula',
    title: 'Cosmic Nebula',
    description: 'A swirling, dynamic nebula effect with vibrant gas clouds, twinkling star fields, and a hidden gravitational lens distortion near the center.',
    fragmentShader: `
        uniform float time;
        uniform vec2 resolution;
        
        // 2D pseudo-random generator
        float rand(vec2 co) {
            return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
        }
        
        // Basic noise function for turbulence
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = rand(i);
            float b = rand(i + vec2(1.0, 0.0));
            float c = rand(i + vec2(0.0, 1.0));
            float d = rand(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        
        // Fractal Brownian Motion for complex patterns
        float fbm(vec2 st) {
            float value = 0.0;
            float amplitude = 0.5;
            for (int i = 0; i < 5; i++) {
                value += amplitude * noise(st);
                st *= 2.0;
                amplitude *= 0.5;
            }
            return value;
        }
        
        // 2D rotation matrix for a swirling effect
        mat2 rotate(float angle) {
            float s = sin(angle);
            float c = cos(angle);
            return mat2(c, -s, s, c);
        }
        
        void main() {
            // Normalize and center the pixel coordinates,
            // scaling based on the smaller dimension (resolution.y) for consistency.
            vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;
            
            // Create a swirling distortion based on FBM and time to simulate nebula rotation
            float swirlAngle = fbm(uv * 3.0 + time * 0.5) * 3.1415;
            uv = rotate(swirlAngle) * uv;
            
            // Generate a dynamic star field using high-frequency noise.
            float starField = step(0.995, fbm(uv * 20.0 + time));
            vec3 starColor = vec3(1.0, 1.0, 0.8);
            
            // Build the cosmic nebula background using fbm for a complex texture.
            float nebulaPattern = fbm(uv * 2.0 - vec2(time * 0.2));
            vec3 nebulaColor = mix(vec3(0.0, 0.0, 0.1), vec3(0.3, 0.0, 0.5), nebulaPattern);
            
            // Overlay dynamic, shifting gas clouds using sine-based color oscillations.
            vec3 gasOverlay = vec3(
                0.4 + 0.6 * sin(time + uv.x * 4.0),
                0.2 + 0.8 * sin(time + uv.y * 3.0),
                0.5 + 0.5 * sin(time + uv.x + uv.y)
            );
            vec3 color = mix(nebulaColor, gasOverlay, 0.5);
            
            // Inject the twinkling stars into the scene.
            color += starField * starColor;
            
            // Apply a soft vignette to darken the edges and focus the view.
            float vignette = smoothstep(1.2, 0.0, length(uv));
            color *= vignette;
            
            // --- Hidden Gravitational Lens Effect ---
            // A subtle lens distortion appears near the center when within a small radius,
            // simulating a gravitational anomaly bending the cosmic light.
            if (length(uv) < 0.2) {
                float lensEffect = smoothstep(0.2, 0.0, length(uv));
                color = mix(color, vec3(1.0, 0.8, 0.5), lensEffect * 0.3);
            }
            // --- End Hidden Effect ---
            
            gl_FragColor = vec4(color, 1.0);
        }
    `

// --- Shader: Cosmic Dancing Flames with Hidden Element ---
{
    id: 'fire_wild',
    title: 'Cosmic Dancing Flames',
    description: 'An insane, noise-driven fire simulation with a hidden cosmic easter egg lurking somewhere in the chaos.',
    fragmentShader: `
        uniform float time;
        uniform vec2 resolution;

        // Random function for pseudo-noise
        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }

        // Simple noise function
        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = random(i + vec2(0.0, 0.0));
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }

        #define OCTAVES 6
        float fbm(vec2 st) {
            float value = 0.0;
            float amplitude = 0.5;
            float frequency = 2.0;
            for (int i = 0; i < OCTAVES; i++) {
                value += amplitude * noise(st * frequency);
                st *= 2.0;
                amplitude *= 0.5;
            }
            return value;
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            // Adjust UV space to stretch the fire, adding extra wild distortion
            vec2 q = uv;
            q.x *= 1.2;
            q.y *= 1.5;

            float timeScaled = time * 0.3; // Slow down the temporal evolution for a lava-like crawl
            float noiseOffset = noise(vec2(q.x * 2.0, timeScaled * 0.5));
            q.y += timeScaled;
            q.x += (noise(vec2(q.y * 0.5, timeScaled * 0.8)) - 0.5) * 0.2;

            // Fire intensity using fractal noise
            float fbmVal = fbm(q + noiseOffset * 0.5);
            float fireShape = smoothstep(0.0, 1.0, 1.0 - uv.y * 1.2);
            float fireIntensity = fbmVal * fireShape;
            fireIntensity = pow(max(0.0, fireIntensity), 1.5);

            // Color palette: from black to raging yellow, through red & orange
            vec3 black  = vec3(0.0, 0.0, 0.0);
            vec3 red    = vec3(0.7, 0.1, 0.0);
            vec3 orange = vec3(1.0, 0.4, 0.0);
            vec3 yellow = vec3(1.0, 0.9, 0.2);
            vec3 color  = black;

            color = mix(color, red, smoothstep(0.0, 0.3, fireIntensity));
            color = mix(color, orange, smoothstep(0.3, 0.6, fireIntensity));
            color = mix(color, yellow, smoothstep(0.6, 0.8, fireIntensity));

            // Add slower, swirling smoke to intensify the mood
            float smokeNoise = fbm(q * 0.8 + vec2(0.0, -time * 0.1));
            smokeNoise = smoothstep(0.5, 0.7, smokeNoise);
            color = mix(color, black, smokeNoise * fireShape * 0.3);

            // --- Hidden Element ---
            // A secret cosmic burst drops in if you hit the jackpot UV space!
            // When the pixel is within a tiny radius from our secret coordinate (0.8, 0.2),
            // a hidden pulsating color effect appears to add an extra dimension to this madness.
            vec2 secretPos = vec2(0.8, 0.2);
            if (length(uv - secretPos) < 0.03) {
                vec3 hiddenBurst = vec3(
                    0.5 + 0.5 * sin(time * 50.0),
                    0.5 + 0.5 * cos(time * 40.0),
                    0.5 + 0.5 * sin(time * 30.0)
                );
                // Mix hidden burst into the color with extra intensity for that small area
                color = mix(color, hiddenBurst, 0.8);
            }
            // --- End Hidden Element ---

            gl_FragColor = vec4(color, 1.0);
        }
    `
}, // --- End Shader: Cosmic Dancing Flames with Hidden Element ---





















// --- Shader: Wicked High End Render ---
// Description: A high-end raymarching shader that renders a dynamic, fractal-inspired scene with
// advanced lighting, ambient occlusion, and fog. Time-driven rotations and noise provide an ever-evolving, surreal experience.

{
    id: 'wicked_highend',
    title: 'Wicked High End Render',
    description: 'A state-of-the-art raymarching shader combining fractal SDFs, dynamic lighting, and volumetric effects.',
    fragmentShader: `
        precision highp float;
        uniform float time;
        uniform vec2 resolution;
        
        #define MAX_STEPS 100
        #define MAX_DIST 100.0
        #define SURF_DIST 0.001

        //----------------------------------------------------------------------------------
        // Rotation Matrices for camera and scene transformation
        //----------------------------------------------------------------------------------
        mat3 rotationY(float angle) {
            float c = cos(angle), s = sin(angle);
            return mat3(
                vec3(c, 0.0, s),
                vec3(0.0, 1.0, 0.0),
                vec3(-s, 0.0, c)
            );
        }
        
        mat3 rotationX(float angle) {
            float c = cos(angle), s = sin(angle);
            return mat3(
                vec3(1.0, 0.0, 0.0),
                vec3(0.0, c, -s),
                vec3(0.0, s, c)
            );
        }
        
        //----------------------------------------------------------------------------------
        // Signed Distance Functions (SDFs) for primitives.
        //----------------------------------------------------------------------------------
        float sdSphere(vec3 p, float s) {
            return length(p) - s;
        }
        
        float sdBox(vec3 p, vec3 b) {
            vec3 d = abs(p) - b;
            return min(max(d.x, max(d.y, d.z)), 0.0) + length(max(d, 0.0));
        }
        
        // Union operation for SDFs.
        float opUnion(float d1, float d2) {
            return min(d1, d2);
        }
        
        //----------------------------------------------------------------------------------
        // Scene SDF: Combines a fractal-like sphere repetition with a box element.
        //----------------------------------------------------------------------------------
        float sceneSDF(vec3 p) {
            // Rotate space to add dynamic swirl.
            p *= rotationY(time * 0.3);
            p *= rotationX(time * 0.2);
            
            // Primary sphere.
            float d = sdSphere(p, 1.0);
            
            // Repeated small spheres to add fractal detail.
            vec3 q = mod(p + 2.0, 4.0) - 2.0;
            d = min(d, sdSphere(q, 0.5));
            
            // Add a box to create contrast.
            d = opUnion(d, sdBox(p - vec3(0.0, -1.0, 0.0), vec3(0.5, 0.5, 0.5)));
            return d;
        }
        
        //----------------------------------------------------------------------------------
        // Estimate the normal at point p.
        //----------------------------------------------------------------------------------
        vec3 estimateNormal(vec3 p) {
            float d = sceneSDF(p);
            vec2 e = vec2(0.001, 0.0);
            vec3 n = d - vec3(
                sceneSDF(p - e.xyy),
                sceneSDF(p - e.yxy),
                sceneSDF(p - e.yyx)
            );
            return normalize(n);
        }
        
        //----------------------------------------------------------------------------------
        // Ambient occlusion computation.
        //----------------------------------------------------------------------------------
        float ambientOcclusion(vec3 p, vec3 n) {
            float occ = 0.0;
            float sca = 1.0;
            for (int i = 0; i < 5; i++) {
                float h = 0.01 + 0.12 * float(i) / 4.0;
                float d = sceneSDF(p + n * h);
                occ += (h - d) * sca;
                sca *= 0.95;
            }
            return clamp(1.0 - occ, 0.0, 1.0);
        }
        
        //----------------------------------------------------------------------------------
        // Raymarching algorithm.
        //----------------------------------------------------------------------------------
        float rayMarch(vec3 ro, vec3 rd) {
            float dist = 0.0;
            for (int i = 0; i < MAX_STEPS; i++) {
                vec3 pos = ro + rd * dist;
                float dS = sceneSDF(pos);
                if (dS < SURF_DIST) return dist;
                dist += dS;
                if (dist >= MAX_DIST) break;
            }
            return MAX_DIST;
        }
        
        //----------------------------------------------------------------------------------
        // Main rendering function.
        //----------------------------------------------------------------------------------
        void main() {
            // Normalized pixel coordinates (adjusted for aspect ratio).
            vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;
            
            // Camera setup.
            vec3 ro = vec3(0.0, 0.0, -5.0);
            vec3 rd = normalize(vec3(uv, 1.5));
            
            // Apply a subtle camera rotation based on time.
            mat3 camRot = rotationY(time * 0.2);
            rd = camRot * rd;
            ro = camRot * ro;
            
            // Execute raymarching.
            float dist = rayMarch(ro, rd);
            vec3 p = ro + rd * dist;
            
            // Default background color.
            vec3 col = vec3(0.0);
            if (dist < MAX_DIST) {
                // Surface hit: compute normal, light and occlusion.
                vec3 normal = estimateNormal(p);
                vec3 lightDir = normalize(vec3(0.5, 0.8, -0.6));
                float diff = clamp(dot(normal, lightDir), 0.0, 1.0);
                float ao = ambientOcclusion(p, normal);
                
                // Specular highlight.
                vec3 viewDir = normalize(ro - p);
                float spec = pow(clamp(dot(reflect(-lightDir, normal), viewDir), 0.0, 1.0), 16.0);
                // Rim lighting for extra edge definition.
                float rim = pow(1.0 - clamp(dot(viewDir, normal), 0.0, 1.0), 2.0);
                
                // Combine lighting components.
                col = vec3(0.1, 0.3, 0.6) * diff * ao + vec3(1.0) * spec + vec3(0.2, 0.2, 0.5) * rim;
                
                // Apply fog based on distance.
                float fog = exp(-dist * 0.2);
                col = mix(vec3(0.05, 0.05, 0.1), col, fog);
            } else {
                // Background gradient.
                col = vec3(0.0, 0.0, 0.05) + 0.5 * vec3(uv.y);
            }
            
            // Gamma correction.
            col = pow(col, vec3(0.4545));
            gl_FragColor = vec4(col, 1.0);
        }
    `
}

                    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, preserveDrawingBuffer: true, antialias: true });
                     this.renderer.setPixelRatio(window.devicePixelRatio * 0.75);
                } catch (error) { console.error("Error creating WebGL Renderer:", error); try { const ctx = this.canvas.getContext('2d'); if(ctx) { ctx.fillStyle = 'white'; ctx.font = '12px Arial'; ctx.fillText('WebGL init failed.', 10, 20); } } catch(e){} return; }
                this.scene = new THREE.Scene();
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.material = new THREE.ShaderMaterial({
                    uniforms: { time: { value: this.time }, resolution: { value: new THREE.Vector2(this.canvas.width, this.canvas.height) } },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                    fragmentShader: this.fragmentShader,
                    depthWrite: false, depthTest: false
                });
                const geometry = new THREE.PlaneGeometry(2, 2);
                const mesh = new THREE.Mesh(geometry, this.material);
                this.scene.add(mesh);
                this.resize();
                 window.addEventListener('resize', this.handleResize);
            }
            resize() {
                const width = this.canvas.clientWidth; const height = this.canvas.clientHeight;
                const devicePixelRatio = window.devicePixelRatio * 0.75;
                const displayWidth = Math.floor(width * devicePixelRatio); const displayHeight = Math.floor(height * devicePixelRatio);
                if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                     if (this.renderer) {
                         this.renderer.setSize(displayWidth, displayHeight, false);
                         if (this.material) { this.material.uniforms.resolution.value.set(displayWidth, displayHeight); }
                     }
                 }
             }
            handleResize() { clearTimeout(this.resizeTimeout); this.resizeTimeout = setTimeout(() => { this.resize(); }, 150); }
            render() {
                if (!this.isActive || !this.renderer) return;
                this.animationFrameId = requestAnimationFrame(this.render);
                this.time += 0.016;
                if (this.material) { this.material.uniforms.time.value = this.time; }
                 try { this.renderer.render(this.scene, this.camera); }
                 catch (renderError) { console.error("Error during rendering:", renderError); this.stop(); }
            }
            start() { if (this.isActive || !this.renderer) return; this.isActive = true; this.resize(); this.render(); }
            stop() { this.isActive = false; if (this.animationFrameId) { cancelAnimationFrame(this.animationFrameId); this.animationFrameId = null; } window.removeEventListener('resize', this.handleResize); }

            // --- Recording Logic (Duration argument is used in listener below) ---
            startRecording(duration = 60) { // Default set to 60 but overridden below
                 // (Method content is identical to previous version, includes debug logs)
                return new Promise((resolve, reject) => {
                    if (!this.canvas || !this.isActive || !this.renderer) { console.error("Cannot record: Renderer not active or canvas not found."); return reject("Renderer not active"); }
                    if (!this.canvas.captureStream) { console.error("canvas.captureStream() not supported."); alert("Video recording is not supported in your browser (canvas.captureStream missing)."); return reject("captureStream not supported"); }
                    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') { console.warn("Recording already in progress."); return reject("Recording in progress"); }
                    const supportedTypes = [ { mime: 'video/mp4', extension: 'mp4' }, { mime: 'video/webm;codecs=vp9', extension: 'webm' }, { mime: 'video/webm;codecs=vp8', extension: 'webm' }, { mime: 'video/webm', extension: 'webm' } ];
                    let selectedType = null;
                    for (const typeInfo of supportedTypes) { if (MediaRecorder.isTypeSupported(typeInfo.mime)) { selectedType = typeInfo; console.log(`Using MIME type: ${selectedType.mime}`); break; } }
                    if (!selectedType) { console.error("No supported MIME type found for MediaRecorder (MP4 or WEBM)."); alert("Video recording failed: No supported video format (MP4/WEBM) found in your browser."); return reject("No supported MIME type"); }
                    this.recordingMimeType = selectedType.mime; this.recordingFileExtension = selectedType.extension;
                    try { const stream = this.canvas.captureStream(30); this.mediaRecorder = new MediaRecorder(stream, { mimeType: this.recordingMimeType, videoBitsPerSecond: 5000000 }); }
                    catch (error) { console.error("Failed to create MediaRecorder:", error); alert(`Video recording failed: Could not create recorder. Error: ${error.message}`); return reject(`MediaRecorder creation failed: ${error.message}`); }
                    this.recordedChunks = [];
                    this.mediaRecorder.ondataavailable = (e) => { console.log(`>>> ondataavailable event fired. Data size: ${e.data.size}`); if (e.data.size > 0) { this.recordedChunks.push(e.data); console.log(`>>> Chunk added. Total chunks: ${this.recordedChunks.length}`); } else { console.warn(">>> ondataavailable fired with empty data chunk."); } };
                    this.mediaRecorder.onstop = () => { console.log(`Recording stopped. Final chunks count: ${this.recordedChunks.length}`); resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension }); };
                    this.mediaRecorder.onerror = (e) => { console.error("MediaRecorder error:", e.error); alert(`Video recording error: ${e.error.name} - ${e.error.message}`); reject(`MediaRecorder error: ${e.error.name}`); };
                    this.mediaRecorder.start(100); console.log(`Recording started for ${duration} seconds (${this.recordingMimeType})...`);
                    setTimeout(() => { if (this.mediaRecorder && this.mediaRecorder.state === 'recording') { this.mediaRecorder.stop(); } }, duration * 1000);
                });
            }
            saveRecordedVideo(filename = 'shader_video') {
                // (Method content is identical to previous version)
                 if (!this.recordedChunks || this.recordedChunks.length === 0) { console.error("No recorded data to save."); alert("Could not save video: No recording data found."); return false; }
                 if (!this.recordingMimeType || !this.recordingFileExtension) { console.error("Missing recording format information."); alert("Could not save video: Recording format unknown."); return false; }
                const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType }); const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `${filename}.${this.recordingFileExtension}`;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); this.recordedChunks = []; this.recordingMimeType = ''; this.recordingFileExtension = ''; }, 100);
                return true;
            }
        } // ================== End Shader Renderer Class ==================


        // ========================================================================
        // Main Application Logic
        // ========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {}; // Keep track of renderers

            // Create UI for each wallpaper defined above
            wallpapers.forEach(wallpaper => {
                // Create container
                const container = document.createElement('div');
                container.className = 'shader-container';

                // Add title
                const title = document.createElement('h2');
                title.className = 'shader-title';
                title.textContent = wallpaper.title;
                container.appendChild(title);

                 // Add description
                 const description = document.createElement('p');
                 description.className = 'shader-description';
                 description.textContent = wallpaper.description;
                 container.appendChild(description);

                // Create Canvas
                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${wallpaper.id}`;
                container.appendChild(canvas);

                 // Create Controls Area (Button + Status)
                 const controlsDiv = document.createElement('div');
                 controlsDiv.className = 'controls';

                // Create Button
                const button = document.createElement('button');
                button.id = `button-${wallpaper.id}`;
                button.textContent = 'Record & Download (60s)'; // Updated text
                button.dataset.id = wallpaper.id;

                 // Create Status Indicator
                const statusSpan = document.createElement('span');
                 statusSpan.id = `status-${wallpaper.id}`;
                 statusSpan.className = 'status-indicator';
                 statusSpan.style.display = 'none'; // Initially hidden

                 controlsDiv.appendChild(button);
                 controlsDiv.appendChild(statusSpan);
                 container.appendChild(controlsDiv); // Add controls div to container

                shadersListDiv.appendChild(container); // Add container to main list

                 // --- Initialize Renderer ---
                 try {
                    const renderer = new ShaderRenderer(canvas, wallpaper.fragmentShader);
                    shaderInstances[wallpaper.id] = renderer;
                    renderer.start();
                 } catch (error) {
                     console.error(`Failed to initialize renderer for ${wallpaper.id}:`, error);
                     const errorMsg = document.createElement('p');
                     errorMsg.style.color = 'red'; errorMsg.textContent = 'Error initializing shader.';
                     container.insertBefore(errorMsg, controlsDiv); // Show error before controls
                 }

                // --- Add Button Event Listener with Timer ---
                let recordingIntervalId = null; // To store the timer interval ID
                const recordingDuration = 60; // Set duration in seconds

                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const renderer = shaderInstances[shaderId];
                    const status = document.getElementById(`status-${shaderId}`);

                    if (!renderer || renderer.mediaRecorder?.state === 'recording') {
                        console.warn("Renderer not found or already recording.");
                        return;
                    }

                    // Clear previous timer if any
                    if (recordingIntervalId) clearInterval(recordingIntervalId);
                    let elapsedSeconds = 0;

                    // Update UI for recording state
                    button.disabled = true;
                    status.textContent = `Recording (0/${recordingDuration}s)...`; // Initial timer text
                    status.className = 'status-indicator status-recording'; // Set class for styling
                    status.style.display = 'inline-block';

                     // Start the timer interval (updates status every second)
                     recordingIntervalId = setInterval(() => {
                         elapsedSeconds++;
                         if (elapsedSeconds <= recordingDuration) {
                              status.textContent = `Recording (${elapsedSeconds}/${recordingDuration}s)...`;
                         } else {
                              // Should be stopped by timeout, but clear just in case
                              clearInterval(recordingIntervalId);
                              recordingIntervalId = null;
                         }
                     }, 1000); // Update every second


                    try {
                        // Start recording (pass the duration)
                        await renderer.startRecording(recordingDuration);

                        // --- Recording Finished ---
                         clearInterval(recordingIntervalId); // Stop timer
                         recordingIntervalId = null;
                         status.textContent = 'Processing...';
                         status.className = 'status-indicator status-processing'; // Set class

                        // Directly attempt to save after recording stops
                        const success = renderer.saveRecordedVideo(`${shaderId}_video_${recordingDuration}s`); // Add duration to filename

                         if (success) {
                              status.textContent = '✅ Download Started!';
                              status.className = 'status-indicator status-success';
                         } else {
                              status.textContent = '❌ Download Failed';
                              status.className = 'status-indicator status-error';
                         }

                    } catch (error) {
                        console.error(`Recording or saving failed for ${shaderId}:`, error);
                         clearInterval(recordingIntervalId); // Stop timer on error
                         recordingIntervalId = null;
                        status.textContent = `❌ Error: ${error}`;
                        status.className = 'status-indicator status-error';
                        // Keep button disabled on error? Or re-enable? Let's re-enable.
                        // button.disabled = false;
                        // button.textContent = `Record & Download (${recordingDuration}s)`;
                    } finally {
                         // Reset button and hide status after a delay
                         setTimeout(() => {
                              button.disabled = false;
                              button.textContent = `Record & Download (${recordingDuration}s)`;
                              status.style.display = 'none';
                              status.className = 'status-indicator'; // Reset class
                         }, 3000); // Hide status message after 3 seconds
                    }
                });
            });

             // Cleanup on page unload
             window.addEventListener('beforeunload', () => {
                 Object.values(shaderInstances).forEach(renderer => {
                     if (renderer) { renderer.stop(); }
                 });
             });
        });
        // ================= End Main Application Logic ===================
    </script>
