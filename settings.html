<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Shader Showcase | Time-lapse Simulation</title>
    <style>
        /* Basic page styling */
        body {
            margin: 0;
            overflow: hidden;
            /* Prevent scrollbars */
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Inter', 'Outfit', sans-serif;
            /* Modern, clean typography */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Subtle animated background gradient as a fallback/base */
            background: linear-gradient(45deg, #050505, #111, #0a0a0a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Canvas takes full screen */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            /* Ensure it's behind overlays */
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Container for all overlay UI elements - Glassmorphism style */
        .ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .ui-container:hover {
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 200, 0.05);
        }

        /* Styling for groups within the UI container */
        .ui-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ui-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .ui-group h4 {
            margin: 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Timer display */
        .timer {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin: 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
            /* Glowing text effect */
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            background: linear-gradient(135deg, #fff 0%, #00ffcc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Container for buttons */
        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        /* General button styling - Sleek Tech */
        button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 10px 14px;
            text-align: center;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        /* Button micro-interaction pseudo-element */
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-20deg);
            transition: all 0.5s ease;
        }

        button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        button:hover::before {
            left: 150%;
        }

        button:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Style for the active shader button */
        button.active-shader {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border-color: rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
        }

        button.active-shader:hover {
            background: rgba(0, 255, 204, 0.15);
            border-color: rgba(0, 255, 204, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
        }

        /* Primary action button (Download) */
        #downloadBtn {
            grid-column: 1 / -1;
            /* Span full width if in grid */
            background: linear-gradient(135deg, rgba(40, 40, 60, 0.6), rgba(20, 20, 30, 0.6));
            color: #fff;
            border-color: rgba(100, 150, 255, 0.3);
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 14px;
        }

        #downloadBtn:hover {
            border-color: rgba(100, 150, 255, 0.6);
            box-shadow: 0 5px 20px rgba(100, 150, 255, 0.2);
        }

        /* Style for the download button when complete */
        #downloadBtn.completed {
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 150, 255, 0.2));
            border-color: rgba(0, 255, 170, 0.8);
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        #downloadBtn.completed:hover {
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.3), rgba(0, 150, 255, 0.3));
            border-color: #00ffaa;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(0, 255, 170, 0.2), inset 0 0 10px rgba(0, 255, 170, 0.1);
            }

            50% {
                box-shadow: 0 0 25px rgba(0, 255, 170, 0.5), inset 0 0 20px rgba(0, 255, 170, 0.2);
            }
        }

        /* Info box at the bottom - Glassmorphism */
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 450px;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .info:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .info h3 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .info p {
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Grid layout specifically for shader selection to make them stack nicely if needed */
        #shaderSelection .button-container {
            grid-template-columns: 1fr;
        }
    </style>
</head>

<body>
    <canvas id="glCanvas"></canvas>

    <div class="ui-container">
        <div class="ui-group">
            <h4>Time-lapse Progress</h4>
            <div class="timer" id="timer">60</div>
        </div>

        <div class="ui-group" id="playerControls">
            <h4>Controls</h4>
            <div class="button-container">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
                <button id="restartBtn">Restart</button>
            </div>
        </div>

        <div class="ui-group" id="shaderSelection">
            <h4>Select Shader</h4>
            <div class="button-container">
            </div>
        </div>

        <div class="ui-group">
            <h4>Download</h4>
            <button id="downloadBtn">Download Current Shader</button>
        </div>
    </div>

    <div class="info">
        <h3 id="shaderTitle">Shader Showcase</h3>
        <p id="shaderDescription">Select a shader visualization above. The simulation runs for 60 seconds, showing
            accelerated effects. Use player controls to manage the animation.</p>
    </div>

    <script>
        //======================================================================
        // Shaders Definition
        //======================================================================

        // --- Vertex Shader (Common for all fragment shaders) ---
        // This shader simply passes the vertex position through.
        const vsSource = `
            // Attribute receiving vertex positions from the buffer
            attribute vec4 aVertexPosition;

            // The main function executed for each vertex
            void main() {
                // gl_Position is a special variable that holds the final position
                gl_Position = aVertexPosition;
            }
        `;

        // --- Fragment Shader 1: Neural Nexus (3D Raymarching SDF) ---
        const fsSource1 = `
            precision highp float;

            uniform float uTime;
            uniform vec2 uResolution;

            // Rotation matrix
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // SDF operations
            float smax(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(a, b, h) + k * h * (1.0 - h);
            }

            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Map function: Defines the SDF scene
            vec2 map(vec3 p) {
                vec3 p2 = p;
                
                // Infinite repetition with domain warping
                float timeOffset = uTime * 0.5;
                p.z += timeOffset * 2.0;
                
                // Add some twisting to the space
                p.xy *= rot(p.z * 0.1);
                
                vec3 q = p;
                float s = 2.0;
                q = mod(p + s * 0.5, s) - s * 0.5;
                
                // Central organic core structure
                float core = length(q) - (0.3 + 0.1 * sin(uTime * 2.0 + p.z * 3.0 + p.x * 2.0));
                
                // Connecting tendrils/synapses
                vec3 t = q;
                t.xy *= rot(uTime * 0.2);
                t.xz *= rot(uTime * 0.3);
                
                float tendrilX = length(t.yz) - 0.03;
                float tendrilY = length(t.xz) - 0.03;
                float tendrilZ = length(t.xy) - 0.03;
                
                // Combine tendrils smoothly
                float tendrils = smin(tendrilX, smin(tendrilY, tendrilZ, 0.1), 0.1);
                
                // Blend core and tendrils
                float d = smin(core, tendrils, 0.4);
               
                // Add a flowing energy field outer shell
                float shell = length(q) - 0.8;
                float shellDistort = sin(p.x * 8.0) * sin(p.y * 8.0) * sin(p.z * 8.0) * 0.1;
                shell += shellDistort;
                
                d = smax(d, -shell, 0.2); // Hollow out the inside of the shell slightly

                // Material ID
                float m = 1.0; 
                if (core < tendrils) m = 2.0; // Different material for core

                return vec2(d * 0.5, m); // Multiply by 0.5 to prevent stepping too far
            }

            // Normal calculation
            vec3 calcNormal(vec3 p) {
                vec2 e = vec2(0.001, 0.0);
                return normalize(vec3(
                    map(p + e.xyy).x - map(p - e.xyy).x,
                    map(p + e.yxy).x - map(p - e.yxy).x,
                    map(p + e.yyx).x - map(p - e.yyx).x
                ));
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;

                // Camera setup
                vec3 ro = vec3(0.0, 0.0, -2.5); // Ray origin
                ro.x += sin(uTime * 0.2) * 0.5; // Slight camera sway
                ro.y += cos(uTime * 0.15) * 0.5;
                
                vec3 rd = normalize(vec3(uv, 1.0)); // Ray direction
                
                // Optional: Camera rotation
                rd.xy *= rot(sin(uTime * 0.1) * 0.2);
                rd.xz *= rot(cos(uTime * 0.1) * 0.2);

                // Raymarching loop
                float t = 0.0;
                float tMax = 20.0;
                float glow = 0.0;
                vec2 res;

                for (int i = 0; i < 100; i++) {
                    vec3 p = ro + rd * t;
                    res = map(p);
                    
                    // Accumulate glow based on proximity to surface
                    glow += 0.02 / (0.01 + abs(res.x));
                    
                    if (res.x < 0.001 || t > tMax) break;
                    t += res.x;
                }

                vec3 col = vec3(0.0);

                if (t < tMax) {
                    vec3 p = ro + rd * t;
                    vec3 n = calcNormal(p);
                    
                    // Lighting
                    vec3 lightDir = normalize(vec3(sin(uTime), 1.0, cos(uTime)));
                    float diff = max(dot(n, lightDir), 0.0);
                    
                    // base color (dark tech)
                    col = vec3(0.05, 0.08, 0.1); 
                    
                    // Add some diffuse light
                    col += vec3(0.1, 0.2, 0.3) * diff * 0.5;
                    
                    // Fresnel edge glow
                    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
                    col += vec3(0.0, 1.0, 0.8) * fresnel * 2.0;
                    
                    // Material specific colors
                    if (res.y == 2.0) {
                        // Core pulses
                        col += vec3(1.0, 0.0, 0.5) * (0.5 + 0.5 * sin(uTime * 5.0 + p.z * 10.0));
                    }
                }

                // Add accumulated volumetric glow
                col += vec3(0.0, 0.3, 0.5) * glow * 0.015;
                col += vec3(0.6, 0.0, 0.8) * glow * 0.005; // Inner purple glow

                // Exponential fog to hide distant artifacts
                col = mix(col, vec3(0.02, 0.02, 0.04), 1.0 - exp(-0.05 * t * t));
                
                // Vignette
                vec2 q = gl_FragCoord.xy / uResolution.xy;
                col *= 0.5 + 0.5 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.25);

                // Tone mapping (ACES approx)
                col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // --- Fragment Shader 2: Quantum Anomaly (Black Hole Distortion) ---
        const fsSource2 = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            // Simple 2D rotation
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Hash function for noise
            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            // 2D Value Noise
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                
                float a = hash(i);
                float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0));
                float d = hash(i + vec2(1.0, 1.0));
                
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            // FBM for the accretion disk
            float fbm(vec2 p) {
                float v = 0.0;
                float a = 0.5;
                mat2 r = rot(0.5);
                for(int i = 0; i < 5; i++) {
                    v += a * noise(p);
                    p = r * p * 2.0;
                    a *= 0.5;
                }
                return v;
            }

            void main() {
                // Centered coordinates, aspect corrected (-1 to 1 on shorter axis)
                vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
                
                // Base background color (deep space)
                vec3 col = vec3(0.0);
                
                // Black hole parameters
                float bhRadius = 0.15; // Event horizon radius
                
                // Calculate distance to center
                float d = length(uv);
                
                // 1. Gravitational Lensing (Space distortion)
                // The distortion intensity decreases with distance (1/r)
                vec2 distortedUV = uv;
                if (d > bhRadius) {
                    float distortion = bhRadius * bhRadius / (d * d);
                    // Bending the light rays around the event horizon
                    distortedUV = uv * (1.0 - distortion);
                }
                
                // 2. Background Starfield (Distorted by lensing)
                // We sample stars using the distorted coordinates
                vec2 starUV = distortedUV * rot(uTime * 0.02) * 5.0; // Slow space rotation
                float starNoise = noise(starUV * 20.0);
                // Create sharp, tiny stars
                starNoise = smoothstep(0.9, 1.0, starNoise);
                
                // Add some variation in star color and brightness
                vec3 starColor = mix(vec3(0.5, 0.7, 1.0), vec3(1.0, 0.8, 0.5), hash(floor(starUV * 20.0)));
                col += starColor * starNoise * smoothstep(bhRadius, bhRadius + 0.1, d); // fade out near hole

                // 3. Accretion Disk
                // We want the disk to look like it's swirling into the center
                // Convert distorted UV to polar coordinates
                float angle = atan(distortedUV.y, distortedUV.x);
                float radius = length(distortedUV);
                
                // Swirl effect: offset angle based on distance and time
                // The closer to the center, the faster it swirls
                float swirl = angle - uTime * 2.0 - 5.0 / (radius + 0.1);
                
                // Create polar coordinates for noise sampling
                vec2 polarUV = vec2(swirl, radius * 8.0);
                
                // Get FBM noise for the disk texture
                float diskNoise = fbm(polarUV + vec2(uTime * 0.5, 0.0));
                
                // Shape the disk: Only visible outside the event horizon, fading out at a distance
                float diskShape = smoothstep(bhRadius + 0.01, bhRadius + 0.05, radius) * 
                                  smoothstep(1.2, 0.3, radius);
                                  
                // Enhance inner ring brightness
                float innerEdge = smoothstep(bhRadius + 0.15, bhRadius + 0.02, radius);
                
                // Combine noise and shape to get disk intensity
                float diskIntensity = diskNoise * diskShape;
                
                // Add hot inner edge
                diskIntensity += innerEdge * diskShape * pow(diskNoise, 2.0) * 1.5;

                // Color mapping for the disk (Orange/Red/White)
                vec3 diskColorBase = mix(vec3(1.0, 0.1, 0.0), vec3(1.0, 0.6, 0.1), diskIntensity);
                vec3 diskColorHot = mix(diskColorBase, vec3(1.0, 0.9, 0.8), pow(diskIntensity, 3.0));
                
                // Apply the disk to the final color
                col += diskColorHot * diskIntensity * 2.5;
                
                // 4. Photon Sphere (Bright ring just outside Event Horizon)
                float photonSphere = smoothstep(0.01, 0.0, abs(radius - bhRadius * 1.1));
                col += vec3(1.0, 0.7, 0.3) * photonSphere * 1.5;

                // 5. The Event Horizon (The black hole itself)
                // Force absolute black inside the radius
                col *= smoothstep(bhRadius * 0.98, bhRadius * 1.02, radius);
                
                // Optional: Volumetric glow around the black hole
                float outerGlow = smoothstep(1.5, 0.0, radius);
                col += vec3(0.1, 0.02, 0.0) * outerGlow * 0.5;

                // Tone mapping (simple exposure)
                col = vec3(1.0) - exp(-col * 1.5);
                
                // Vignette based on original screen coordinates, not distorted
                float v = length((gl_FragCoord.xy / uResolution.xy) - 0.5);
                col *= smoothstep(0.8, 0.2, v);

                gl_FragColor = vec4(col, 1.0);
            }
        `;


        // --- Fragment Shader 3: Cyber-Grid Override (Holographic Tech) ---
        const fsSource3 = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            // Pseudo-random noise
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            // 2D Rotation
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Box signed distance
            float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
            }

            // Scene distance function
            vec2 map(vec3 p) {
                vec3 pOrig = p;
                
                // Domain repetition for an endless grid city
                float s = 1.0;
                vec3 q = p;
                q.x = mod(p.x + s/2.0, s) - s/2.0;
                q.z = mod(p.z + s/2.0, s) - s/2.0;
                
                // Get a unique ID for each grid cell
                vec2 id = floor(pOrig.xz / s);
                
                // Random height based on ID
                float h = 0.2 + 0.8 * random(id);
                // Animate building height
                h *= 0.5 + 0.5 * sin(uTime * 2.0 + id.x * 2.0 + id.y * 3.0);
                
                // Main building blocks
                float d1 = sdBox(q - vec3(0.0, h/2.0, 0.0), vec3(0.3, h/2.0, 0.3));
                
                // Horizontal connecting beams
                vec3 beamP = q;
                beamP.y = mod(p.y, 0.5) - 0.25;
                float d2 = sdBox(beamP, vec3(0.6, 0.02, 0.02));
                float d3 = sdBox(beamP, vec3(0.02, 0.02, 0.6));
                
                // Floating data cubes
                vec3 fcP = p;
                fcP.y -= 1.5 + sin(uTime + id.y) * 0.5;
                fcP.x = mod(p.x + s/2.0, s) - s/2.0;
                fcP.z = mod(p.z + s/2.0, s) - s/2.0;
                fcP.xz *= rot(uTime * 2.0 + id.x);
                fcP.xy *= rot(uTime * 1.5 + id.y);
                float d4 = sdBox(fcP, vec3(0.05));
                
                // Minimum distance of all objects
                float d = min(d1, min(d2, d3));
                float finalD = min(d, d4);
                
                // Material IDs: 1 for buildings/beams, 2 for floating cubes
                float m = (finalD == d4) ? 2.0 : 1.0;
                
                return vec2(finalD, m);
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                
                // Camera
                vec3 ro = vec3(0.0, 1.0, uTime * 2.0); // Move forward
                ro.x += sin(uTime * 0.5) * 0.5; // Slight sway
                
                // Look direction
                vec3 ta = ro + vec3(sin(uTime * 0.3)*0.5, -0.2, 1.0);
                
                // Camera matrix
                vec3 cw = normalize(ta - ro);
                vec3 cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0)));
                vec3 cv = cross(cu, cw);
                vec3 rd = normalize(uv.x * cu + uv.y * cv + 1.2 * cw);

                // Raymarching
                float t = 0.0;
                float tMax = 20.0;
                vec2 res;
                for(int i = 0; i < 80; i++) {
                    res = map(ro + rd * t);
                    if(res.x < 0.001 || t > tMax) break;
                    t += res.x * 0.8;
                }

                // Base color - Dark wireframe background
                vec3 col = vec3(0.05, 0.0, 0.08);

                if(t < tMax) {
                    vec3 p = ro + rd * t;
                    
                    // Holographic scanline effect based on Y height and time
                    float scanline = sin(p.y * 50.0 - uTime * 20.0) * 0.5 + 0.5;
                    scanline = pow(scanline, 4.0);
                    
                    // Grid outline effect on structures
                    vec3 grid3D = abs(fract(p * 4.0) - 0.5);
                    float edge = 1.0 - smoothstep(0.4, 0.45, max(grid3D.x, max(grid3D.y, grid3D.z)));
                    
                    if (res.y == 1.0) {
                        // Buildings
                        col = mix(vec3(0.1, 0.0, 0.2), vec3(0.0, 1.0, 0.8), edge * 0.5);
                        col += vec3(0.0, 0.8, 1.0) * scanline * 0.3; // Cyan scanlines
                    } else if (res.y == 2.0) {
                        // Floating cubes (Red/Magenta glitch cores)
                        col = vec3(1.0, 0.2, 0.6) * (1.0 + scanline * 2.0);
                        // Add pulsing glow to cubes
                        col *= 1.5 + 0.5 * sin(uTime * 10.0 + p.z);
                    }
                    
                    // Distance fade (fog)
                    float fog = exp(-t * 0.15 - t * t * 0.01);
                    col = mix(vec3(0.05, 0.0, 0.08), col, fog);
                }

                // 2D Post-Processing Effects
                
                // Digital Glitch
                float glitchAmount = smoothstep(0.95, 1.0, sin(uTime * 5.0)) * 
                                     smoothstep(0.9, 1.0, random(vec2(uTime)));
                if (glitchAmount > 0.0) {
                    // Chromatic aberration split and coordinate shifting
                    float shiftX = (random(vec2(uv.y, uTime)) - 0.5) * 0.1 * glitchAmount;
                    
                    // Re-sample color channels with shifted coordinates (approximate without full multi-pass)
                    // We just distort the existing color slightly based on screen position
                    col.r *= 1.0 + shiftX * 20.0; 
                    col.b *= 1.0 - shiftX * 20.0;
                    
                    // White noise bands
                    if (random(vec2(uv.y * 10.0, uTime)) > 0.8) {
                         col += vec3(glitchAmount * 0.5);
                    }
                }

                // Vignette
                float v = length(uv * 1.5);
                col *= smoothstep(1.5, 0.6, v);

                // CRT Scanlines (Screen space)
                float screenScanline = sin(gl_FragCoord.y * 1.5) * 0.04;
                col -= screenScanline;

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // Store shaders in an array for easy access
        const shaders = [
            { name: "Neural_Nexus", fsSource: fsSource1, title: "Neural Nexus (3D SDF)", description: "Raymarched 3D scene mapping organic, neural pathways firing energy pulses through an endless central core." },
            { name: "Quantum_Anomaly", fsSource: fsSource2, title: "Quantum Anomaly", description: "Gravitational lensing and extreme space-time distortion around a theoretical singularity, with a glowing, turbulent accretion disk." },
            { name: "Cyber_Grid", fsSource: fsSource3, title: "Cyber-Grid Override", description: "Procedural holographic cityscape rendering data cubes and digital scanning layers. Includes post-process chromatic glitch mechanics." }
        ];

        //======================================================================
        // Global Variables
        //======================================================================
        let gl;                     // WebGL rendering context
        let programInfo;            // Holds shader program, attribute/uniform locations
        let buffers;                // Holds vertex buffer object
        let animationFrameId = null; // ID returned by requestAnimationFrame
        let startTime = 0;          // Simulation start time (in seconds)
        let lastRenderTime = 0;     // Time of the last rendered frame (for pause)
        let pausedElapsedTime = 0;  // How much time elapsed while paused
        let isPlaying = true;       // Animation loop state flag
        let timeLimit = 60;         // Duration of the time-lapse in seconds
        let currentShaderIndex = 0; // Index of the currently selected shader

        // --- DOM Elements ---
        const canvas = document.getElementById('glCanvas');
        const timerDisplay = document.getElementById('timer');
        const downloadBtn = document.getElementById('downloadBtn');
        const shaderSelectionDiv = document.getElementById('shaderSelection').querySelector('.button-container');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const shaderTitleEl = document.getElementById('shaderTitle');
        const shaderDescriptionEl = document.getElementById('shaderDescription');

        //======================================================================
        // WebGL Initialization and Setup
        //======================================================================

        /**
         * Initializes the WebGL context, shaders, buffers, and starts the render loop.
         */
        function initWebGL() {
            gl = canvas.getContext('webgl');
            if (!gl) {
                alert('Unable to initialize WebGL. Your browser may not support it.');
                return false;
            }

            // Set initial canvas size and add resize listener
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Initialize buffers (only needs to happen once)
            buffers = initBuffers(gl);

            // Load the default shader (index 0)
            if (!loadShaderByIndex(currentShaderIndex)) {
                return false; // Stop if shader loading fails
            }

            // Populate shader selection buttons
            createShaderButtons();

            // Add event listeners for controls
            setupEventListeners();

            // Reset and start the simulation
            restartSimulation();

            return true;
        }

        /**
         * Resizes the canvas to match the window size and sets the WebGL viewport.
         */
        function resizeCanvas() {
            const displayWidth = window.innerWidth;
            const displayHeight = window.innerHeight;

            if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
                canvas.width = displayWidth;
                canvas.height = displayHeight;
                // Update viewport only if gl context exists
                if (gl) {
                    gl.viewport(0, 0, canvas.width, canvas.height);
                }
            }
        }

        /**
         * Compiles and links the vertex and fragment shaders into a WebGL program.
         * @param {WebGLRenderingContext} gl - The WebGL context.
         * @param {string} vsSrc - The vertex shader source code.
         * @param {string} fsSrc - The fragment shader source code.
         * @returns {WebGLProgram|null} The linked shader program or null on failure.
         */
        function initShaderProgram(gl, vsSrc, fsSrc) {
            const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSrc);
            const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSrc);

            if (!vertexShader || !fragmentShader) return null;

            const shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, vertexShader);
            gl.attachShader(shaderProgram, fragmentShader);
            gl.linkProgram(shaderProgram);

            if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
                alert('Unable to initialize the shader program: ' + gl.getProgramInfoLog(shaderProgram));
                // Clean up shaders if linking failed
                gl.deleteShader(vertexShader);
                gl.deleteShader(fragmentShader);
                gl.deleteProgram(shaderProgram);
                return null;
            }

            // No need to keep shaders after linking
            gl.deleteShader(vertexShader);
            gl.deleteShader(fragmentShader);


            return shaderProgram;
        }

        /**
         * Compiles a single shader.
         * @param {WebGLRenderingContext} gl - The WebGL context.
         * @param {number} type - gl.VERTEX_SHADER or gl.FRAGMENT_SHADER.
         * @param {string} source - The shader source code.
         * @returns {WebGLShader|null} The compiled shader or null on failure.
         */
        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                alert(`An error occurred compiling the ${type === gl.VERTEX_SHADER ? 'vertex' : 'fragment'} shader: ${gl.getShaderInfoLog(shader)}`);
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        /**
         * Creates and populates the vertex buffer for a fullscreen quad.
         * @param {WebGLRenderingContext} gl - The WebGL context.
         * @returns {object} An object containing the position buffer.
         */
        function initBuffers(gl) {
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

            // A simple quad covering the entire clip space
            const positions = [
                -1.0, -1.0, // bottom left
                1.0, -1.0, // bottom right
                -1.0, 1.0, // top left
                1.0, 1.0, // top right
            ];
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

            return {
                position: positionBuffer,
            };
        }

        /**
        * Loads, compiles, and sets up the shader program for the specified index.
        * @param {number} index - The index of the shader in the `shaders` array.
        * @returns {boolean} True if successful, false otherwise.
        */
        function loadShaderByIndex(index) {
            if (index < 0 || index >= shaders.length) {
                console.error("Invalid shader index:", index);
                return false;
            }

            const selectedShader = shaders[index];

            // Compile and link the new shader program
            const newShaderProgram = initShaderProgram(gl, vsSource, selectedShader.fsSource);
            if (!newShaderProgram) {
                console.error("Failed to compile shader:", selectedShader.name);
                // Optionally revert to a default or previous shader?
                // For now, just return false.
                return false;
            }

            // If a previous program exists, delete it to free resources
            if (programInfo && programInfo.program) {
                gl.deleteProgram(programInfo.program);
            }


            // Store information about the new program
            programInfo = {
                program: newShaderProgram,
                attribLocations: {
                    vertexPosition: gl.getAttribLocation(newShaderProgram, 'aVertexPosition'),
                },
                uniformLocations: {
                    time: gl.getUniformLocation(newShaderProgram, 'uTime'),
                    resolution: gl.getUniformLocation(newShaderProgram, 'uResolution'),
                    // Add other common uniforms here if needed
                },
            };

            currentShaderIndex = index;

            // Update UI elements
            updateShaderInfo(selectedShader);
            updateActiveShaderButton();

            console.log(`Shader "${selectedShader.name}" loaded.`);
            return true;
        }

        //======================================================================
        // Rendering Loop
        //======================================================================

        /**
         * The main rendering function, called repeatedly by requestAnimationFrame.
         * @param {DOMHighResTimeStamp} now - The current time provided by requestAnimationFrame.
         */
        function render(now) {
            if (!isPlaying) {
                // If paused, store the current time to calculate paused duration later
                lastRenderTime = now;
                return; // Don't request another frame
            }

            // If resuming from pause, calculate the time spent paused
            if (lastRenderTime > 0) {
                pausedElapsedTime += (now - lastRenderTime) / 1000.0; // Convert ms to seconds
                lastRenderTime = 0; // Reset last render time
            }


            now *= 0.001; // Convert time to seconds

            // Calculate current simulation time, accounting for pauses
            const currentTime = now - startTime - pausedElapsedTime;

            // Calculate time remaining and update display
            const timeRemaining = Math.max(0, timeLimit - Math.floor(currentTime));
            timerDisplay.textContent = timeRemaining;

            // Draw the scene with the current time
            drawScene(gl, programInfo, buffers, currentTime);

            // Check if the simulation time limit has been reached
            if (currentTime >= timeLimit) {
                console.log("Time-lapse complete.");
                isPlaying = false; // Stop the animation
                timerDisplay.textContent = 0; // Ensure timer shows 0
                downloadBtn.classList.add('completed');
                downloadBtn.textContent = 'Time-lapse Complete - Download';
                cancelAnimationFrame(animationFrameId); // Explicitly cancel
                animationFrameId = null;
            } else {
                // Request the next frame only if playing and within time limit
                animationFrameId = requestAnimationFrame(render);
            }
        }

        /**
         * Clears the canvas and draws the scene using the current shader and time.
         * @param {WebGLRenderingContext} gl - The WebGL context.
         * @param {object} progInfo - Contains program and locations.
         * @param {object} bufs - Contains vertex buffers.
         * @param {number} currentTime - The current simulation time in seconds.
         */
        function drawScene(gl, progInfo, bufs, currentTime) {
            // --- Prepare drawing ---
            gl.clearColor(0.0, 0.0, 0.0, 1.0); // Clear to black
            gl.clearDepth(1.0);                // Clear everything
            gl.enable(gl.DEPTH_TEST);          // Enable depth testing
            gl.depthFunc(gl.LEQUAL);           // Near things obscure far things
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            // --- Set up attributes ---
            gl.bindBuffer(gl.ARRAY_BUFFER, bufs.position);
            gl.vertexAttribPointer(
                progInfo.attribLocations.vertexPosition,
                2,        // numComponents (x, y)
                gl.FLOAT, // type
                false,    // normalize
                0,        // stride
                0         // offset
            );
            gl.enableVertexAttribArray(progInfo.attribLocations.vertexPosition);

            // --- Use the program and set uniforms ---
            gl.useProgram(progInfo.program);
            gl.uniform1f(progInfo.uniformLocations.time, currentTime);
            gl.uniform2f(progInfo.uniformLocations.resolution, gl.canvas.width, gl.canvas.height);

            // --- Draw the quad ---
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); // 4 vertices for a strip quad
        }

        //======================================================================
        // Player Controls and Simulation Management
        //======================================================================

        /** Starts or resumes the animation loop. */
        function playSimulation() {
            if (!isPlaying) {
                console.log("Resuming simulation.");
                isPlaying = true;
                // Restart the animation loop if it wasn't already running
                if (!animationFrameId) {
                    animationFrameId = requestAnimationFrame(render);
                }
            }
        }

        /** Pauses the animation loop. */
        function pauseSimulation() {
            if (isPlaying) {
                console.log("Pausing simulation.");
                isPlaying = false;
                // The render loop will stop requesting frames when isPlaying is false
                // We don't cancel the *current* frame request, just prevent future ones
            }
        }

        /** Resets the simulation timer and state, then starts playing. */
        function restartSimulation() {
            console.log("Restarting simulation.");
            isPlaying = false; // Stop current loop temporarily
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            // Reset time variables
            const now = performance.now();
            startTime = now * 0.001; // Reset start time (in seconds)
            lastRenderTime = 0;        // Reset pause time tracking
            pausedElapsedTime = 0;     // Reset accumulated pause time

            // Reset UI elements
            timerDisplay.textContent = timeLimit;
            downloadBtn.classList.remove('completed');
            // Set button text based on current shader name
            downloadBtn.textContent = `Download ${shaders[currentShaderIndex].name}`;


            // Ensure it starts playing
            isPlaying = true;
            animationFrameId = requestAnimationFrame(render); // Start the loop immediately
        }

        //======================================================================
        // UI Interaction and Helpers
        //======================================================================

        /** Creates shader selection buttons dynamically. */
        function createShaderButtons() {
            shaderSelectionDiv.innerHTML = ''; // Clear existing buttons
            shaders.forEach((shader, index) => {
                const button = document.createElement('button');
                button.textContent = shader.name.replace(/_/g, ' '); // Make name more readable
                button.dataset.shaderIndex = index; // Store index on button
                button.addEventListener('click', handleShaderSelection);
                shaderSelectionDiv.appendChild(button);
            });
            updateActiveShaderButton(); // Highlight the default active button
        }

        /** Handles clicking on a shader selection button. */
        function handleShaderSelection(event) {
            const selectedIndex = parseInt(event.target.dataset.shaderIndex, 10);
            if (selectedIndex !== currentShaderIndex) {
                console.log(`Switching to shader index: ${selectedIndex}`);
                if (loadShaderByIndex(selectedIndex)) {
                    restartSimulation(); // Restart simulation when shader changes
                } else {
                    alert("Failed to load the selected shader. Please check the console for errors.");
                }
            }
        }

        /** Updates the visual style of the active shader button. */
        function updateActiveShaderButton() {
            const buttons = shaderSelectionDiv.querySelectorAll('button');
            buttons.forEach(button => {
                const index = parseInt(button.dataset.shaderIndex, 10);
                if (index === currentShaderIndex) {
                    button.classList.add('active-shader');
                } else {
                    button.classList.remove('active-shader');
                }
            });
            // Update download button text when shader changes
            downloadBtn.textContent = `Download ${shaders[currentShaderIndex].name}`;
            downloadBtn.classList.remove('completed'); // Ensure completed state is reset
        }

        /** Updates the info box with the current shader's title and description. */
        function updateShaderInfo(shader) {
            shaderTitleEl.textContent = shader.title;
            shaderDescriptionEl.textContent = shader.description;
        }


        /** Sets up event listeners for player controls and download button. */
        function setupEventListeners() {
            playBtn.addEventListener('click', playSimulation);
            pauseBtn.addEventListener('click', pauseSimulation);
            restartBtn.addEventListener('click', restartSimulation);
            downloadBtn.addEventListener('click', downloadCurrentShader);
        }

        /**
         * Creates a downloadable file containing the current shader's source code.
         */
        function downloadCurrentShader() {
            if (currentShaderIndex < 0 || currentShaderIndex >= shaders.length) return;

            const currentShader = shaders[currentShaderIndex];
            const shaderCode = `// Shader: ${currentShader.name}
// Generated on: ${new Date().toISOString()}

// --- Vertex Shader ---
${vsSource}

// --- Fragment Shader (${currentShader.name}) ---
${currentShader.fsSource}
`;
            // Create a Blob (binary large object) containing the text data
            const blob = new Blob([shaderCode], { type: 'text/plain;charset=utf-8' });
            // Create a URL for the Blob
            const url = URL.createObjectURL(blob);

            // Create a temporary link element
            const a = document.createElement('a');
            a.href = url;
            // Sanitize name for filename
            const filename = `shader-${currentShader.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.glsl`;
            a.download = filename;

            // Programmatically click the link to trigger download
            document.body.appendChild(a);
            a.click();

            // Clean up: remove the link and revoke the URL
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            console.log(`Downloading shader: ${filename}`);
        }


        //======================================================================
        // Start the application when the page loads
        //======================================================================
        window.onload = () => {
            if (!initWebGL()) {
                console.error("WebGL initialization failed. Application cannot start.");
                // Optionally display a user-friendly error message on the page
            }
        };

    </script>
