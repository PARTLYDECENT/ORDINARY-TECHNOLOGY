<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shader Demos w/ Recording</title> <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* === Base Styles & Variables === */
        :root {
            --dark-bg: #0A0A0A;
            --card-bg: #150f15;
            --text-primary: #f0eaf0;
            --text-secondary: #b5acb5;
            --accent-blue: #00bfff; /* Deep Sky Blue */
            --accent-purple: #9932cc; /* Dark Orchid */
            --status-recording: #ff4500; /* Orange-Red */
            --status-processing: #ffd700; /* Gold */
            --status-success: #32cd32; /* Lime Green */
            --status-error: #ff0000; /* Pure Red */
            --input-bg: #2a2a2a;
            --input-border: #4a4a4a;

            /* RGB versions for alpha backgrounds */
            --status-recording-rgb: 255, 69, 0;
            --status-processing-rgb: 255, 215, 0;
            --status-success-rgb: 50, 205, 50;
            --status-error-rgb: 255, 0, 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-y: auto;
            min-height: 100vh;
            background-image: radial-gradient(rgba(255,255,255,0.03) 0.5px, transparent 0.5px), radial-gradient(rgba(255,255,255,0.03) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            scrollbar-color: var(--accent-purple) var(--card-bg); /* Standard scrollbar styling */
            scrollbar-width: thin; /* Standard scrollbar styling */
        }

        /* Custom Scrollbar (Webkit) */
        body::-webkit-scrollbar { width: 10px; }
        body::-webkit-scrollbar-track { background: var(--card-bg); }
        body::-webkit-scrollbar-thumb {
            background-color: var(--accent-purple);
            border-radius: 5px;
            border: 2px solid var(--card-bg);
        }
        body::-webkit-scrollbar-thumb:hover { background-color: var(--accent-blue); }

        /* === Layout === */
        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            background-clip: text; /* Standard property */
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .shader-container {
            margin-bottom: 40px;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden; /* Contain potential overflows */
        }
        .shader-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .shader-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Align items to the top */
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .shader-info {
            flex-grow: 1;
            min-width: 200px; /* Prevent excessive shrinking */
        }
        .shader-title { /* Adjusted from H3 back to H2 for consistency */
            font-size: 1.8rem; /* Slightly smaller than original H1 */
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-primary);
            line-height: 1.2;
            padding-bottom: 5px; /* Added padding */
            border-bottom: 1px solid #444; /* Added border */
        }
        .shader-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 5px 0 15px 0; /* Added margin */
            border-left: 4px solid var(--accent-blue); /* Added border */
            padding-left: 12px; /* Added padding */
        }

        canvas {
            display: block;
            width: 100%;
            height: auto; /* Maintain aspect ratio via CSS */
            aspect-ratio: 16 / 9; /* Modern way to set aspect ratio */
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #444;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* === Controls === */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: flex-start; /* Default alignment */
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap; /* Allow wrapping within the group */
        }

        button { /* Restoring button styles */
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
            min-width: 220px; /* Suggest minimum width */
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00aeee, #8a2be2); /* Slightly brighter hover */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
            transform: none;
        }

        select { /* Restoring select styles */
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            appearance: none; /* Remove default appearance */
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22292.4%22 height%3D%22292.4%22%3E%3Cpath fill%3D%22%23e0e0e0%22 d%3D%22M287 69.4a17.6 17.6 0 0 0-13.1-6.4H18.5c-5.4 0-10.7 2-14.1 5.9-3.2 3.5-5.1 8.3-5.1 13.3 0 6.2 2.3 11.4 6.9 16l125.9 127.9c3.5 3.5 8 5.6 12.8 5.6s9.2-2.1 12.8-5.6L287 101.4c4.6-4.6 6.9-10 6.9-16 0-5.1-1.9-9.9-5.1-13.3z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 12px auto;
            padding-right: 30px; /* Space for arrow */
        }
        select:hover { border-color: var(--accent-blue); }

        .status-indicator { /* Restoring status styles */
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            min-width: 150px; /* Suggest minimum width */
            text-align: center;
            flex-shrink: 0; /* Prevent shrinking in flex layout */
            border: 1px solid transparent; /* Base border */
        }
        .status-recording {
            background-color: rgba(var(--status-recording-rgb), 0.2);
            color: var(--status-recording);
            border-color: var(--status-recording);
        }
        .status-processing {
            background-color: rgba(var(--status-processing-rgb), 0.2);
            color: var(--status-processing);
            border-color: var(--status-processing);
        }
        .status-success {
            background-color: rgba(var(--status-success-rgb), 0.2);
            color: var(--status-success);
            border-color: var(--status-success);
        }
        .status-error {
            background-color: rgba(var(--status-error-rgb), 0.2);
            color: var(--status-error);
            border-color: var(--status-error);
        }

        /* === Responsive Adjustments === */
         @media (max-width: 1000px) { /* Larger tablets / Small laptops */
             .main-container { margin: 30px auto; }
             h1 { font-size: 2rem; }
             .intro-text { font-size: 0.95rem; }
             .shader-container { padding: 25px; }
             .shader-title { font-size: 1.6rem; } /* Adjusted */
             .shader-description { font-size: 0.9rem; }
             button { padding: 10px 20px; font-size: 0.95rem; min-width: 200px; }
             select { padding: 9px; font-size: 0.95rem; }
             .status-indicator { padding: 7px 14px; font-size: 0.9rem; min-width: 140px; }
         }

         @media (max-width: 768px) { /* Tablets and smaller */
              .main-container { padding: 0 15px; margin: 20px auto; }
              h1 { font-size: 1.8rem; letter-spacing: 1px; }
              .intro-text { margin-bottom: 25px; font-size: 0.9rem; }
              .shader-container { padding: 20px; }
              .shader-header { flex-direction: column; align-items: stretch; gap: 10px; }
              .shader-title { font-size: 1.4rem; } /* Adjusted */
              .shader-description { font-size: 0.85rem; border-left-width: 3px; padding-left: 10px;}
              canvas { margin-bottom: 15px; }
              .controls { flex-direction: column; gap: 15px; align-items: stretch;} /* Stack controls */
              .control-group { flex-direction: column; gap: 10px; align-items: stretch; } /* Stack button/select */
              button, select { width: 100%; min-width: auto; box-sizing: border-box; } /* Full width */
              .status-indicator { width: 100%; min-width: auto; box-sizing: border-box; padding: 8px 12px; font-size: 0.9rem;}
         }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>Simple Shader Demos w/ Recording</h1> <p class="intro-text">Basic real-time WebGL shaders. Select a recording resolution and click "Record & Download" to capture a <strong>1-minute</strong> video clip. Recording format (MP4/WEBM) depends on your browser. Please allow time for processing and download.</p> <div id="shadersList">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r163/three.min.js"></script>

    <script>
        // ========================================================================
        // SIMPLIFIED SHADER DEFINITIONS (GLSL for WebGL 1)
        // Using the simple shaders from the previous step.
        // ========================================================================
        const shaders = [
             {
                id: 'simple-gradient',
                title: 'Simple Gradient',
                description: 'A basic animated color gradient based on screen coordinates and time.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv; // Received from vertex shader

                    void main() {
                        vec3 color = vec3(
                            0.5 + 0.5 * cos(time + vUv.x * 5.0),
                            0.5 + 0.5 * sin(time + vUv.y * 4.0),
                            0.6 + 0.4 * cos(time)
                        );
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            },
            {
                id: 'basic-noise',
                title: 'Basic Noise',
                description: 'Simple pseudo-random noise pattern using a hash function.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
                    }

                    void main() {
                        float noiseValue = hash(vUv * 15.0 + vec2(sin(time*0.2), cos(time*0.2)) );
                        gl_FragColor = vec4(vec3(noiseValue), 1.0);
                    }
                `
            },
            {
                id: 'pulsing-circle',
                title: 'Pulsing Circle',
                description: 'A simple circle whose radius animates using sine wave.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    void main() {
                        vec2 centerUv = vUv - 0.5;
                        centerUv.x *= resolution.x / resolution.y;
                        float dist = length(centerUv);
                        float radius = 0.2 + 0.1 * sin(time * 2.0);
                        float circle = 1.0 - smoothstep(radius - 0.01, radius + 0.01, dist);
                        vec3 color = vec3(circle) * vec3(0.1, 0.5, 1.0);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            },
             {
                id: 'simple-grid',
                title: 'Simple Grid',
                description: 'Basic grid lines with animated color.',
                fragmentShader: `
                    precision highp float;
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;

                    void main() {
                        float spacing = 20.0;
                        vec2 gridUv = fract(vUv * spacing);
                        vec2 distToLine = abs(gridUv - 0.5);
                        float minDist = min(distToLine.x, distToLine.y);
                        float lineThickness = 0.01 * spacing;
                        float gridValue = smoothstep(lineThickness, lineThickness + 0.02, minDist);
                        vec3 lineColor = vec3(
                            0.8 + 0.2 * sin(time * 0.5),
                            0.5,
                            0.8 + 0.2 * cos(time * 0.7)
                        );
                        gl_FragColor = vec4(vec3(1.0 - gridValue) * lineColor, 1.0);
                    }
                `
            }
        ];

        // ========================================================================
        // Shader Renderer Class (Re-integrating Recording Logic)
        // ========================================================================
         class ShaderRenderer { // Renamed back from SimpleShaderDisplay
            constructor(canvas, fragmentShader) {
                this.canvas = canvas;
                this.fragmentShader = fragmentShader;
                this.time = Math.random() * 100;
                this.isActive = false;
                this.animationFrameId = null;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordingMimeType = '';
                this.recordingFileExtension = '';

                this.livePreviewResolution = new THREE.Vector2();
                this.preRecordingRendererSize = new THREE.Vector2();

                this.resizeTimeout = null;
                this.handleResize = this.handleResize.bind(this);
                this.render = this.render.bind(this);

                this.init();

                if(this.renderer) {
                    this.start();
                }
            }

             init() {
                 // Same init logic as the first revised version (with recording)
                if (!window.WebGLRenderingContext) {
                    console.error("WebGL is not supported.");
                    this.drawErrorText('WebGL Not Supported');
                    this.renderer = null; return;
                }
                try {
                    const context = this.canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true }) ||
                                    this.canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true });
                    if (!context) throw new Error("Could not create WebGL context.");

                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas, context: context, preserveDrawingBuffer: true
                    });
                    this.renderer.setPixelRatio(window.devicePixelRatio * 0.75); // Lower ratio for preview performance

                } catch (error) {
                    console.error("Error creating WebGL Renderer:", error);
                    this.drawErrorText(`Renderer Init Failed: ${error.message}`);
                    this.renderer = null; return;
                }

                this.scene = new THREE.Scene();
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: this.time },
                        resolution: { value: new THREE.Vector2() }
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                    fragmentShader: this.fragmentShader,
                    depthWrite: false, depthTest: false
                });
                const geometry = new THREE.PlaneGeometry(2, 2);
                const mesh = new THREE.Mesh(geometry, this.material);
                this.scene.add(mesh);
                this.resize();
                window.addEventListener('resize', this.handleResize);
             }

             drawErrorText(message) {
                  const ctx = this.canvas.getContext('2d');
                  if(ctx) {
                      this.canvas.width = this.canvas.clientWidth || 300;
                      this.canvas.height = this.canvas.clientHeight || 150;
                      ctx.fillStyle = 'black';
                      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--status-error').trim() || 'red';
                      ctx.font = '14px Roboto, sans-serif';
                      ctx.textAlign = 'center';
                      ctx.textBaseline = 'middle';
                      ctx.fillText(message, this.canvas.width / 2, this.canvas.height / 2);
                  }
             }

            resize() {
                 // Same resize logic as the first revised version (handling recording state)
                if (!this.renderer) return;

                const isRecording = this.mediaRecorder && this.mediaRecorder.state === 'recording';
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                const devicePixelRatio = window.devicePixelRatio * (isRecording ? 1.0 : 0.75); // Use full ratio if recording, else scaled
                const displayWidth = Math.floor(width * devicePixelRatio);
                const displayHeight = Math.floor(height * devicePixelRatio);

                // Store intended live size even if not resizing renderer during recording
                 const liveWidth = Math.floor(width * (window.devicePixelRatio * 0.75));
                 const liveHeight = Math.floor(height * (window.devicePixelRatio * 0.75));
                 this.livePreviewResolution.set(liveWidth, liveHeight);

                 // Only resize renderer if NOT recording OR if the target size differs
                 if (!isRecording) {
                    if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                        this.setRendererSize(displayWidth, displayHeight);
                    }
                 }
            }

             handleResize() {
                 clearTimeout(this.resizeTimeout);
                 this.resizeTimeout = setTimeout(() => this.resize(), 150);
             }

            setRendererSize(width, height) {
                if (this.renderer && this.material?.uniforms.resolution) {
                    this.renderer.setSize(width, height, false);
                    this.material.uniforms.resolution.value.set(width, height);
                    // console.log(`Renderer size set to ${width}x${height}.`);
                }
            }

             start() {
                 if (this.isActive || !this.renderer) return;
                 this.isActive = true;
                 this.resize();
                 this.render();
             }

             stop() {
                 this.isActive = false;
                 if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
                 this.animationFrameId = null;
                 window.removeEventListener('resize', this.handleResize);
             }

             render() {
                 if (!this.isActive || !this.renderer) return;
                 this.time += 0.016;
                 if (this.material?.uniforms.time) this.material.uniforms.time.value = this.time;
                 this.renderer.render(this.scene, this.camera);
                 this.animationFrameId = requestAnimationFrame(this.render);
             }

            // --- Recording Logic (Restored) ---
            async startRecording(duration = 60, recordingResolution = 'canvas') {
                 return new Promise(async (resolve, reject) => {
                     if (!this.canvas || !this.renderer) return reject(new Error("Renderer not ready."));
                     if (!this.canvas.captureStream) return reject(new Error("captureStream not supported"));
                     if (this.mediaRecorder?.state === 'recording') return reject(new Error("Recording in progress"));

                     this.start();
                     this.renderer.getSize(this.preRecordingRendererSize);
                     console.log(`Pre-recording size: ${this.preRecordingRendererSize.x}x${this.preRecordingRendererSize.y}`);

                     let targetWidth, targetHeight;
                     if (recordingResolution === 'canvas') {
                         targetWidth = this.preRecordingRendererSize.x;
                         targetHeight = this.preRecordingRendererSize.y;
                         console.log(`Recording at canvas resolution: ${targetWidth}x${targetHeight}`);
                     } else {
                         targetWidth = recordingResolution.width;
                         targetHeight = recordingResolution.height;
                         console.log(`Recording at specified resolution: ${targetWidth}x${targetHeight}`);
                         this.setRendererSize(targetWidth, targetHeight); // Temporarily resize
                         await new Promise(requestAnimationFrame); // Wait a frame
                         if (this.material?.uniforms.time) this.material.uniforms.time.value = this.time;
                         this.renderer.render(this.scene, this.camera); // Render one frame at new size
                         await new Promise(requestAnimationFrame);
                     }

                     const supportedTypes = [ /* ... same supported types array as before ... */
                        { mime: 'video/mp4;codecs=avc1', extension: 'mp4' },
                        { mime: 'video/webm;codecs=vp9', extension: 'webm' },
                        { mime: 'video/webm;codecs=vp8', extension: 'webm' },
                        { mime: 'video/webm', extension: 'webm' }
                     ];
                     const selectedType = supportedTypes.find(type => MediaRecorder.isTypeSupported(type.mime));

                     if (!selectedType) {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Reset size
                         return reject(new Error("No supported MIME type"));
                     }
                     this.recordingMimeType = selectedType.mime;
                     this.recordingFileExtension = selectedType.extension;

                     try {
                         const stream = this.canvas.captureStream(30); // Target 30 FPS
                         this.mediaRecorder = new MediaRecorder(stream, {
                             mimeType: this.recordingMimeType, videoBitsPerSecond: 15000000
                         });
                     } catch (error) {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Reset size
                         return reject(new Error(`MediaRecorder creation failed: ${error.message}`));
                     }

                     this.recordedChunks = [];
                     this.mediaRecorder.ondataavailable = (e) => e.data.size > 0 && this.recordedChunks.push(e.data);
                     this.mediaRecorder.onstop = () => {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore size
                         resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                     };
                     this.mediaRecorder.onerror = (e) => {
                         this.setRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y); // Restore size
                         reject(new Error(`MediaRecorder error: ${e.error?.name || 'Unknown'}`));
                     };
                     this.mediaRecorder.start();
                     setTimeout(() => this.mediaRecorder?.state === 'recording' && this.mediaRecorder.stop(), duration * 1000);
                 });
            }

            saveRecordedVideo(filename = 'shader_video') {
                 // Same save logic as the first revised version
                 if (!this.recordedChunks?.length) return false;
                 if (!this.recordingMimeType || !this.recordingFileExtension) return false;
                 try {
                     const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                     const url = URL.createObjectURL(blob);
                     const a = document.createElement('a');
                     a.style.display = 'none'; a.href = url; a.download = `${filename}.${this.recordingFileExtension}`;
                     document.body.appendChild(a); a.click();
                     setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
                     this.recordedChunks = []; this.recordingMimeType = ''; this.recordingFileExtension = ''; // Clear after initiating
                     return true;
                 } catch (error) {
                     console.error("Error saving video:", error); alert(`Failed to save video: ${error.message}`);
                     this.recordedChunks = []; this.recordingMimeType = ''; this.recordingFileExtension = ''; // Clear on error
                     return false;
                 }
             }
        }

        // ========================================================================
        // Main Application Logic (Re-integrating Recording UI)
        // ========================================================================
        window.addEventListener('load', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {};
            const recordingDuration = 60; // 1 minute

            const availableResolutions = [ /* ... same availableResolutions array as before ... */
                 { id: 'canvas', label: 'Canvas Size' },
                 { id: '720p', label: '720p (1280x720)', width: 1280, height: 720 },
                 { id: '1080p', label: '1080p (1920x1080)', width: 1920, height: 1080 },
                 { id: '1440p', label: '1440p (2560x1440)', width: 2560, height: 1440 },
                 { id: '4k', label: '4K (3840x2160)', width: 3840, height: 2160 }
            ];

            // Capability Checks
            if (typeof THREE === 'undefined') {
                displayError("THREE.js failed to load!"); return;
            }
            const supportsCaptureStream = 'captureStream' in HTMLCanvasElement.prototype;
            if (!supportsCaptureStream) {
                displayError("Video recording not supported by browser.", false);
            }

            function displayError(message, isFatal = true) { /* ... same displayError function ... */
                 if (isFatal) {
                     shadersListDiv.innerHTML = `<p style="color: var(--status-error, red); text-align: center; font-size: 1.2rem;">${message}</p>`;
                     document.querySelector('h1').textContent = 'Error';
                     document.querySelector('.intro-text').style.display = 'none';
                 } else {
                     const errorDiv = document.createElement('div');
                     errorDiv.innerHTML = `<p style="color: var(--status-error, red); background-color: rgba(var(--status-error-rgb), 0.1); border: 1px solid var(--status-error); padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 20px;">${message}</p>`;
                     shadersListDiv.parentNode.insertBefore(errorDiv, shadersListDiv);
                 }
            }

            let maxCanvasSize = { width: 4096, height: 4096 }; // Estimate Max Size
            try { /* ... same maxCanvasSize estimation logic ... */
                const testCanvas = document.createElement('canvas');
                const context = testCanvas.getContext('webgl2') || testCanvas.getContext('webgl');
                if (context) {
                    const maxDim = context.getParameter(context.MAX_TEXTURE_SIZE);
                    const maxRbSize = context.getParameter(context.MAX_RENDERBUFFER_SIZE);
                    const limit = Math.min(maxDim, maxRbSize, 16384);
                    maxCanvasSize = { width: limit, height: limit };
                    console.log(`Estimated Max WebGL Dimension: ${limit}px`);
                }
            } catch (e) { console.warn("Could not estimate max canvas size.", e); }

            // Build Shader UI (Adding controls back)
            shaders.forEach(shader => {
                const container = document.createElement('div');
                container.className = 'shader-container';
                container.dataset.id = shader.id;

                // Re-add controls HTML structure
                container.innerHTML = `
                    <div class="shader-header">
                        <div class="shader-info">
                            <h2 class="shader-title">${shader.title}</h2>
                            <p class="shader-description">${shader.description}</p>
                        </div>
                    </div>
                    <canvas id="canvas-${shader.id}"></canvas>
                    <div class="controls">
                        <div class="control-group">
                            <button id="button-${shader.id}" data-id="${shader.id}">Record & Download (${recordingDuration}s)</button>
                            <select id="resolution-${shader.id}" title="Select Recording Resolution"></select>
                        </div>
                        <span id="status-${shader.id}" class="status-indicator" style="display: none;"></span>
                    </div>
                `;
                shadersListDiv.appendChild(container);

                const canvas = container.querySelector('canvas');
                const button = container.querySelector('button');
                const resolutionSelect = container.querySelector('select');
                const statusSpan = container.querySelector('span');

                // Populate resolution selector
                availableResolutions.forEach(res => {
                    if (res.width > maxCanvasSize.width || res.height > maxCanvasSize.height) return;
                    const option = document.createElement('option');
                    option.value = res.id; option.textContent = res.label;
                    if (res.width) option.dataset.width = res.width;
                    if (res.height) option.dataset.height = res.height;
                    resolutionSelect.appendChild(option);
                });

                // Initialize Renderer
                let renderer = null;
                 try {
                     renderer = new ShaderRenderer(canvas, shader.fragmentShader); // Use restored class
                     if (!renderer.renderer) throw new Error("Renderer internal init failed.");
                     shaderInstances[shader.id] = renderer;
                 } catch (error) {
                     console.error(`Failed init for ${shader.id}:`, error);
                     container.querySelector('.shader-header').insertAdjacentHTML('afterend', `<p class="status-indicator status-error" style="display:block; width: 100%; box-sizing: border-box; margin-bottom: 15px;">❌ Failed to initialize shader: ${error.message}</p>`);
                     button.disabled = true; resolutionSelect.disabled = true; statusSpan.style.display = 'none';
                     return;
                 }

                // Disable recording if not supported
                if (!supportsCaptureStream) {
                    button.disabled = true; button.textContent = 'Recording N/A'; resolutionSelect.disabled = true;
                }

                // Button Click Handler (Restored)
                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const currentRenderer = shaderInstances[shaderId];
                    const status = document.getElementById(`status-${shaderId}`);
                    const selectElement = document.getElementById(`resolution-${shaderId}`);
                    const selectedOption = selectElement.options[selectElement.selectedIndex];
                    const resolutionId = selectedOption.value;
                    let recordingResolutionOpt = 'canvas';

                    if (!currentRenderer || currentRenderer.mediaRecorder?.state === 'recording') return;

                    if (resolutionId !== 'canvas') {
                        const width = parseInt(selectedOption.dataset.width, 10);
                        const height = parseInt(selectedOption.dataset.height, 10);
                        if (!isNaN(width) && !isNaN(height)) { recordingResolutionOpt = { width, height }; }
                        else { updateStatus(status, '❌ Invalid Resolution', 'error', 3000); return; }
                    }

                    button.disabled = true; selectElement.disabled = true;
                    let elapsedSeconds = 0;
                    updateStatus(status, `Recording (0/${recordingDuration}s)...`, 'recording');
                    const timerInterval = setInterval(() => { /* ... same timer logic ... */
                        elapsedSeconds++;
                        if (currentRenderer.mediaRecorder?.state === 'recording') {
                             updateStatus(status, `Recording (${elapsedSeconds}/${recordingDuration}s)...`, 'recording');
                        } else { clearInterval(timerInterval); }
                    }, 1000);

                    try {
                        await currentRenderer.startRecording(recordingDuration, recordingResolutionOpt);
                        clearInterval(timerInterval); updateStatus(status, 'Processing...', 'processing');
                        const success = currentRenderer.saveRecordedVideo(`${shader.id}_${resolutionId}`);
                        updateStatus(status, success ? '✅ Download Started!' : '❌ Download Failed', success ? 'success' : 'error', 3000);
                    } catch (error) {
                        clearInterval(timerInterval);
                        updateStatus(status, `❌ Error: ${error.message || error}`, 'error', 5000);
                    } finally {
                        setTimeout(() => { /* ... same finally logic to re-enable controls ... */
                           if(supportsCaptureStream) { button.disabled = false; selectElement.disabled = false; }
                           button.textContent = `Record & Download (${recordingDuration}s)`;
                        }, 3000);
                    }
                }); // End button click listener

            }); // End shaders.forEach

            // Helper to update status indicator (Restored)
            let statusTimeout = null;
            function updateStatus(element, message, type = 'info', duration = null) {
                 clearTimeout(statusTimeout);
                 element.textContent = message; element.className = `status-indicator status-${type}`; element.style.display = 'inline-block';
                 if (duration !== null) {
                     statusTimeout = setTimeout(() => { element.style.display = 'none'; element.className = 'status-indicator'; }, duration);
                 }
            }

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                Object.values(shaderInstances).forEach(renderer => renderer?.stop());
            });
        }); // End window.onload

    </script>

</body>
</html>
