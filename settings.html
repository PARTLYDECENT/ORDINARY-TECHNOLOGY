<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sublime Shader Archives | Enhanced Reality</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #0A0A0A; /* Even darker */
            --card-bg: #150f15; /* Dark, slightly purple/grey tint */
            --text-primary: #f0eaf0; /* Near white with a cool tint */
            --text-secondary: #b5acb5; /* Muted text */
            --accent-blue: #00bfff; /* Deep Sky Blue */
            --accent-purple: #9932cc; /* Dark Orchid */
            --status-recording: #ff4500; /* Orange-Red */
            --status-processing: #ffd700; /* Gold */
            --status-success: #32cd32; /* Lime Green */
            --status-error: #ff0000; /* Pure Red */
            --input-bg: #2a2a2a;
            --input-border: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-y: auto;
            min-height: 100vh;
            background-image: radial-gradient(rgba(255,255,255,0.03) 0.5px, transparent 0.5px), radial-gradient(rgba(255,255,255,0.03) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* Custom Scrollbar */
        body::-webkit-scrollbar { width: 10px; }
        body::-webkit-scrollbar-track { background: var(--card-bg); }
        body::-webkit-scrollbar-thumb {
            background-color: var(--accent-purple);
            border-radius: 5px;
            border: 2px solid var(--card-bg);
        }
        body::-webkit-scrollbar-thumb:hover { background-color: var(--accent-blue); }
        body { scrollbar-color: var(--accent-purple) var(--dark-bg); }

        .main-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            font-style: normal;
        }

        .shader-container {
            margin-bottom: 40px;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .shader-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .shader-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .shader-info {
            flex-grow: 1;
            min-width: 200px;
        }
        .shader-title {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .shader-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 8px;
            border-left: 4px solid var(--accent-blue);
            padding-left: 12px;
            font-style: normal;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto; /* Maintain aspect ratio */
            aspect-ratio: 16 / 9;
            background-color: #000;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #444;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            animation: none; /* Ensure no CSS animations interfere with rendering */
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
            min-width: 220px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0056b3, #512da8);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
            transform: none;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 width%3D%22292.4%22 height%3D%22292.4%22%3E%3Cpath fill%3D%22%23e0e0e0%22 d%3D%22M287 69.4a17.6 17.6 0 0 0-13.1-6.4H18.5c-5.4 0-10.7 2-14.1 5.9-3.2 3.5-5.1 8.3-5.1 13.3 0 6.2 2.3 11.4 6.9 16l125.9 127.9c3.5 3.5 8 5.6 12.8 5.6s9.2-2.1 12.8-5.6L287 101.4c4.6-4.6 6.9-10 6.9-16 0-5.1-1.9-9.9-5.1-13.3z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 12px auto;
            padding-right: 30px;
        }

        select:hover { border-color: var(--accent-blue); }

        .status-indicator {
            font-style: normal;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 6px;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            min-width: 150px;
            text-align: center;
            letter-spacing: normal;
            animation: none;
            flex-shrink: 0; /* Prevent shrinking */
        }

        .status-recording {
            background-color: rgba(var(--status-recording-rgb, 255, 69, 0), 0.2); /* Adjusted to match variable */
            color: var(--status-recording);
            border: 1px solid var(--status-recording);
        }
        .status-processing {
            background-color: rgba(var(--status-processing-rgb, 255, 215, 0), 0.2); /* Adjusted */
            color: var(--status-processing);
            border: 1px solid var(--status-processing);
        }
        .status-success {
            background-color: rgba(var(--status-success-rgb, 50, 205, 50), 0.2); /* Adjusted */
            color: var(--status-success);
            border: 1px solid var(--status-success);
        }
        .status-error {
            background-color: rgba(var(--status-error-rgb, 255, 0, 0), 0.2); /* Adjusted */
            color: var(--status-error);
            border: 1px solid var(--status-error);
        }

        /* Helper for defining RGB vars from hex */
        .status-recording { --status-recording-rgb: 255, 69, 0; }
        .status-processing { --status-processing-rgb: 255, 215, 0; }
        .status-success { --status-success-rgb: 50, 205, 50; }
        .status-error { --status-error-rgb: 255, 0, 0; }


        /* Responsive Adjustments */
        @media (max-width: 1000px) {
            .main-container { margin: 30px auto; }
            h1 { font-size: 2rem; letter-spacing: 1.5px; }
            .intro-text { margin-bottom: 30px; font-size: 0.95rem; }
            .shader-container { padding: 25px; margin-bottom: 30px; }
            .shader-header { gap: 15px; margin-bottom: 15px; }
            .shader-title { font-size: 1.8rem; }
            .shader-description { font-size: 0.85rem; }
            canvas { margin-bottom: 15px; }
            .controls { gap: 15px; }
            button { padding: 10px 20px; font-size: 1rem; min-width: 180px; }
            select { padding: 8px; font-size: 0.9rem; padding-right: 25px; background-size: 10px auto; }
            .status-indicator { padding: 6px 12px; font-size: 0.9rem; min-width: 120px; }
        }

        @media (max-width: 768px) {
            .main-container { padding: 0 10px; }
            h1 { font-size: 1.6rem; letter-spacing: 1px; }
            .intro-text { margin-bottom: 25px; font-size: 0.9rem; }
            .shader-container { padding: 15px; margin-bottom: 25px; }
            .shader-header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 10px;}
            .shader-info { min-width: auto; }
            .shader-title { font-size: 1.5rem; }
            .shader-description { font-size: 0.8rem; padding-left: 8px; border-left-width: 3px;}
            canvas { margin-bottom: 10px; }
            .controls { flex-direction: column; gap: 8px; align-items: stretch;}
            .control-group { flex-direction: column; gap: 8px; align-items: stretch; }
            button { padding: 10px 20px; font-size: 0.9rem; min-width: auto; width: 100%;}
            select { padding: 8px; font-size: 0.9rem; min-width: auto; width: 100%; padding-right: 25px; background-size: 10px auto; }
            .status-indicator { padding: 5px 10px; font-size: 0.85rem; min-width: auto; width: 100%; }
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>Sublime Shader Archives</h1>
        <p class="intro-text">Explore these real-time procedural visual experiences. Select a recording resolution and click "Record & Download" to capture a <strong>1-minute</strong> video clip. Recording format (MP4/WEBM) depends on your browser. Please allow time for processing and download.</p>

        <div id="shadersList">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ========================================================================
        // SHADER DEFINITIONS - WICKEDLY AMAZING SHOWCASES (REVISED)
        // ========================================================================
        // These shaders are designed for intricate patterns, smooth motion,
        // and visually stunning effects without excessive flashing or jarring movement.
        // They now incorporate more complex or atmospheric elements.
        // ========================================================================

        const wallpapers = [

            // --- Shader: Abyssal Shimmer (Ocean Remorphed) ---
            {
                id: 'abyssal-shimmer',
                title: 'Abyssal Shimmer',
                description: 'A deep, dark liquid surface hiding unseen movements and mysterious light.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    // Simple hash function
                    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                    // 2D Simplex noise (approximation)
                    vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
                    float snoise(vec2 v){
                        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                        vec2 i = floor(v + dot(v, C.xx) );
                        vec2 x0 = v - i + dot(i, C.yy) ;
                        vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                        vec4 x12 = x0.xyxy + C.xxyy;
                        x12.xy -= i1.xy;
                        vec3 i3 = permute(permute( i.x + vec3(0.0, i1.x, 1.0 )) + i.y + vec3(0.0, i1.y, 1.0 ));
                        vec3 gd = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                        gd = gd*gd; gd=gd*gd;
                        vec3 g = vec3(dot(x0, permute(i3).zw ), dot(x12.xy, permute(i3 + vec3(i1.y, i1.x, 0.0)).zw ), dot(x12.zw, permute(i3 + vec3(1.0)).zw ));
                        return dot(gd, g) * 40.0;
                    }
                    float fsnoise(vec2 p) {
                        float total = 0.0; float amplitude = 0.5; float frequency = 1.0;
                        for (int i = 0; i < 4; i++) { total += snoise(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; }
                        return total;
                    }

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Smooth, deep waves with layered noise
                        float wave1 = snoise(uv * 8.0 + vec2(time * 0.3, time * 0.2)) * 0.05;
                        float wave2 = snoise(uv * 10.0 - vec2(time * 0.4, time * 0.3) + uv.y * 5.0) * 0.04;
                        float wave3 = snoise(uv * 12.0 + vec2(time * 0.5, time * 0.4)) * 0.06;
                        float y = uv.y + wave1 + wave2 + wave3;

                        // Color palette: Deep indigos, midnight blues, and subtle, shimmering highlights
                        vec3 color = mix( vec3(0.05, 0.05, 0.1), vec3(0.1, 0.1, 0.3), smoothstep(0.2, 0.6, y) ); // Very dark base
                        color = mix(color, vec3(0.15, 0.15, 0.45), smoothstep(0.4, 0.7, y + snoise(uv*3.0+time*0.1)*0.05) ); // Darker blue layer
                        color = mix(color, vec3(0.2, 0.2, 0.5), smoothstep(0.6, 0.9, y + snoise(uv*4.0-time*0.15)*0.08) ); // Richer blue layer


                        // Subtle, shimmering highlights (less intense, more spread out)
                        float highlightNoise = fsnoise(uv * 20.0 + vec2(time * 1.0, time * 1.1));
                        float highlight = smoothstep(0.5 + highlightNoise * 0.05, 0.6 + highlightNoise * 0.05, y);
                        color = mix(color, vec3(0.8, 0.9, 1.0), highlight * 0.4); // Soft blue/white highlights


                        // Add deeper, moving currents or shadows with FBM
                        float currentNoise = fsnoise(uv * 3.0 + vec2(time * 0.05, time * 0.08));
                        color *= (1.0 - currentNoise * 0.2); // Darken areas based on noise


                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Abyssal Shimmer ---


            // --- Shader: Cosmic Genesis (Nebula Remorphed) ---
            {
                id: 'cosmic-genesis',
                title: 'Cosmic Genesis',
                description: 'Witness the birth of a galaxy - swirling cosmic dust, embryonic stars, and vast energy fields.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
                    float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); float a = hash(i + vec2(0.0, 0.0)); float b = hash(i + vec2(1.0, 0.0)); float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0)); return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); }
                    float fbm(vec2 p) { float total = 0.0; float amplitude = 0.5; float frequency = 2.0; int octaves = 6; for (int i = 0; i < octaves; i++) { total += noise(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; } return total; }

                    void main() {
                         vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
                         vec2 p = uv * 1.5;
                         vec2 motion = vec2(time * 0.01, time * 0.008); /* Very slow motion */

                         // Generate complex, layered FBM for nebula structure
                         float n = fbm(p * 1.2 + motion);
                         float n2 = fbm(p * 2.5 + motion * 0.7 + 10.0);
                         float n3 = fbm(p * 0.8 - motion * 0.5 + 5.0);

                         // Color palette: Deep space colors, vibrant gas clouds, subtle metallic dust
                         vec3 col1 = vec3(0.03, 0.01, 0.08); // Near black
                         vec3 col2 = vec3(0.1, 0.05, 0.25); // Deep space purple
                         vec3 col3 = vec3(0.05, 0.2, 0.4); // Nebula blue
                         vec3 col4 = vec3(0.6, 0.3, 0.05); // Nebula orange/red
                         vec3 col5 = vec3(0.1, 0.4, 0.1); // Nebula green

                         vec3 color = mix(col1, col2, smoothstep(0.2, 0.5, n));
                         color = mix(color, col3, smoothstep(0.3, 0.6, n2));
                         color = mix(color, col4, smoothstep(0.5, 0.7, n * n2 + n3*0.5)); // Combine noise layers
                         color = mix(color, col5, smoothstep(0.6, 0.8, n2 * n3));

                         // Add subtle, moving dust lanes or filaments
                         float dustNoise = fbm(p * 4.0 + vec2(time * 0.02, time * 0.01));
                         color += vec3(dustNoise) * 0.03 * smoothstep(0.3, 1.0, length(uv));

                         // Softer vignette
                         float vignette = smoothstep(1.2, 0.0, length(uv));
                         color *= vignette;

                         // Intricate, varied starfield
                         float starDensity = 200.0;
                         vec2 gridUV = fract(uv * starDensity);
                         vec2 id = floor(uv * starDensity);
                         float starHash = hash(id + sin(time * 0.02 + id.y * 0.03));

                         float star = 0.0;
                         if (starHash > 0.99) {
                             float size = fract(starHash * 100.0) * 0.01 + 0.003; // Slightly larger size range
                             float falloff = smoothstep(size, 0.0, length(gridUV - 0.5));
                             star = falloff * (fract(starHash * 10.0) * 0.4 + 0.6); // Moderate twinkle

                             // Add color variation to stars based on their hash
                             vec3 starColor = mix(vec3(1.0, 0.8, 0.5), vec3(0.8, 0.9, 1.0), fract(starHash * 5.0)); // Warm or cool stars
                             color = mix(color, color + starColor * star, star * 1.2); // Add colored stars
                         }

                         gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Cosmic Genesis ---


            // --- Shader: Neural Convergence (Swirling Plasma Remorphed) ---
            {
                 id: 'neural-convergence',
                 title: 'Neural Convergence',
                 description: 'Visualizing the complex, interconnected pathways of advanced thought.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(123.4, 567.8))) * 43758.5453); }
                    float noise(vec2 p) {
                        vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i); float b = hash(i + vec2(1, 0));
                        float c = hash(i + vec2(0, 1)); float d = hash(i + vec2(1, 1));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }
                    float fbm(vec2 p) {
                        float v = 0.0; float a = 1.0;
                        for (int i = 0; i < 7; i++) { // More octaves
                            v += noise(p) * a;
                            p = p * 2.1 + 1.0; // Slight frequency adjust
                            a *= 0.48; // Slight amplitude adjust
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;

                        // Smooth, controlled swirl effect
                        float angle = time * 0.08; // Slower base rotation
                        float swirlIntensity = fbm(uv * 0.8 + vec2(time * 0.03, time * 0.02)) * 0.8; // Lower intensity, slower noise
                        vec2 rotated_uv = vec2(
                            uv.x * cos(angle + swirlIntensity) - uv.y * sin(angle + swirlIntensity),
                            uv.x * sin(angle + swirlIntensity) + uv.y * cos(angle + swirlIntensity)
                        );

                        // Plasma pattern with more defined structures
                        float plasma = fbm(rotated_uv * 3.5 + vec2(time * 0.08)); // Moderate frequency
                        float slowPlasma = fbm(rotated_uv * 5.5 - vec2(time * 0.06) + 20.0); // Moderate layer

                        // Combine smoothly with subtle pulsing
                        float finalPlasma = smoothstep(0.3, 0.7, plasma) + smoothstep(0.4, 0.8, slowPlasma * 0.6);
                         finalPlasma += sin(time * 0.8) * 0.03; // Very subtle pulse


                        // Color mapping (Complex, interconnected neurological colors)
                        vec3 color = vec3(0.05); // Dark base
                        color = mix(color, vec3(0.1, 0.1, 0.4), smoothstep(0.0, 0.4, finalPlasma)); // Deep Blue
                        color = mix(color, vec3(0.4, 0.1, 0.6), smoothstep(0.3, 0.6, finalPlasma)); // Purple
                        color = mix(color, vec3(0.1, 0.6, 0.2), smoothstep(0.5, 0.8, finalPlasma)); // Neural Green
                         color = mix(color, vec3(0.9, 0.8, 0.1), smoothstep(0.7, 1.0, finalPlasma)); // Golden highlights


                        // Add fine, interconnected tendrils or lines
                         float lineNoise = fbm(uv * 10.0 - vec2(time * 0.05));
                         float lines = smoothstep(0.5, 0.55, lineNoise);
                         color = mix(color, vec3(0.8, 0.9, 1.0), lines * 0.3 * smoothstep(0.5, 1.0, finalPlasma)); // White/blue lines on brighter plasma


                        // Apply a soft vignette
                        float vignette = smoothstep(1.5, 0.0, length(uv));
                        color *= vignette;

                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
            }, // --- End Shader: Neural Convergence ---


            // --- Shader: Event Horizon (Fractal Tunnel Remorphed) ---
             // Note: Raymarching shaders can be more computationally expensive.
            {
                 id: 'event-horizon',
                 title: 'Event Horizon',
                 description: 'Approaching a point of no return - spacetime warps around a hidden singularity.',
                 fragmentShader: `
                    precision highp float;

                    uniform float time;
                    uniform vec2 resolution;

                    #define MAX_STEPS 150 // More steps for detail
                    #define MAX_DIST 100.0 // Longer view distance
                    #define SURF_DIST 0.001 // Standard hit distance

                    // Rotation Matrices
                    mat3 rotationY(float angle) { float c = cos(angle), s = sin(angle); return mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c); }
                    mat3 rotationX(float angle) { float c = cos(angle), s = sin(angle); return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c); }

                    // Basic 3D noise function - CORRECTED HASH3D
                    float hash3d(vec3 p) { float q_val = dot(p, vec3(123.4, 567.8, 901.2)) + time * 0.3; return fract(sin(q_val) * 87654.321); } // Slower time influence
                    float noise3d(vec3 p) {
                        vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
                        float n = i.x + i.y*157.0 + i.z*113.0;
                        return mix(mix(mix(hash3d(i+vec3(0,0,0)), hash3d(i+vec3(1,0,0)),f.x), mix(hash3d(i+vec3(0,1,0)), hash3d(i+vec3(1,1,0)),f.x),f.y),

                         alert(`Video recording failed: Could not create recorder. Error: ${error.message}`);
                         // Reset renderer size on failure to create recorder
                         this.resetRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y);
                         return reject(`MediaRecorder creation failed: ${error.message}`);
                     }

                     this.recordedChunks = [];
                     this.mediaRecorder.ondataavailable = (e) => {
                         if (e.data.size > 0) {
                             this.recordedChunks.push(e.data);
                         } else {
                              console.warn(">>> ondataavailable fired with empty data chunk.");
                         }
                     };

                     this.mediaRecorder.onstop = () => {
                         console.log(`Recording stopped. Final chunks count: ${this.recordedChunks.length}`);
                         // Reset renderer size AFTER recording stops and before resolving
                         this.resetRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y);
                         resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                     };

                     this.mediaRecorder.onerror = (e) => {
                         console.error("MediaRecorder error:", e.error);
                         alert(`Video recording error: ${e.error.name} - ${e.error.message}`);
                         // Reset renderer size on error
                         this.resetRendererSize(this.preRecordingRendererSize.x, this.preRecordingRendererSize.y);
                         reject(`MediaRecorder error: ${e.error.name}`);
                     };

                     this.mediaRecorder.start(1000); // Collect data chunks every 1 second
                     console.log(`MediaRecorder started for ${duration} seconds.`);

                     // Stop recording after the specified duration
                     setTimeout(() => {
                         if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                             console.log("Recording duration elapsed, stopping MediaRecorder.");
                             this.mediaRecorder.stop();
                         }
                     }, duration * 1000);
                 });
            }

            saveRecordedVideo(filename = 'shader_video') {
                if (!this.recordedChunks || this.recordedChunks.length === 0) {
                    console.error("No recorded data to save.");
                    return false;
                }
                if (!this.recordingMimeType || !this.recordingFileExtension) {
                     console.error("Missing recording format information.");
                     return false;
                }

                const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `${filename}.${this.recordingFileExtension}`;

                document.body.appendChild(a);
                a.click();

                // Clean up the link and revoke the blob URL after a short delay
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    // Clear chunks and format info after download
                    this.recordedChunks = [];
                    this.recordingMimeType = '';
                    this.recordingFileExtension = '';
                    console.log("Blob URL revoked and recorded chunks cleared.");
                }, 100);

                return true;
            }
        }


        // ========================================================================
        // Main Application Logic
        // ========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const shadersListDiv = document.getElementById('shadersList');
            const shaderInstances = {}; // Map shader ID to ShaderRenderer instance
            const availableResolutions = [
                { id: 'canvas', label: 'Canvas Size' },
                { id: '720p', label: '720p (1280x720)', width: 1280, height: 720 },
                { id: '1080p', label: '1080p (1920x1080)', width: 1920, height: 1080 },
                 { id: '1440p', label: '1440p (2560x1440)', width: 2560, height: 1440 },
                 { id: '4k', label: '4K (3840x2160)', width: 3840, height: 2160 }
            ];


            if (!window.WebGLRenderingContext) {
                 shadersListDiv.innerHTML = '<p style="color: var(--status-error, red); text-align: center; font-size: 1.2rem;">Your browser does not support WebGL. This showcase requires WebGL.</p>';
                 document.querySelector('h1').textContent = 'WebGL Required';
                 document.querySelector('.intro-text').textContent = 'Please use a modern browser that supports WebGL (Chrome, Firefox, Edge, Safari, etc.).';
                 return;
            }
             if (!HTMLCanvasElement.prototype.captureStream) {
                  shadersListDiv.innerHTML = '<p style="color: var(--status-error, red); text-align: center; font-size: 1.2rem;">Your browser does not support Canvas video capture (captureStream API). Video downloading is not available.</p>';
                  // Still render shaders if WebGL is supported, but disable buttons
             }


            wallpapers.forEach(wallpaper => {
                const container = document.createElement('div');
                container.className = 'shader-container';
                container.dataset.id = wallpaper.id;

                const headerDiv = document.createElement('div');
                headerDiv.className = 'shader-header';

                 const shaderInfoDiv = document.createElement('div');
                 shaderInfoDiv.className = 'shader-info';

                const title = document.createElement('h2');
                title.className = 'shader-title';
                title.textContent = wallpaper.title;
                 shaderInfoDiv.appendChild(title);

                const description = document.createElement('p');
                description.className = 'shader-description';
                description.textContent = wallpaper.description;
                 shaderInfoDiv.appendChild(description);

                 headerDiv.appendChild(shaderInfoDiv);
                 container.appendChild(headerDiv);

                const canvas = document.createElement('canvas');
                canvas.id = `canvas-${wallpaper.id}`;
                container.appendChild(canvas);

                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'controls';

                // Control Group for Button and Select
                const controlGroupDiv = document.createElement('div');
                controlGroupDiv.className = 'control-group';

                const button = document.createElement('button');
                button.id = `button-${wallpaper.id}`;
                const recordingDuration = 60; // 1 minute
                button.textContent = `Record & Download (${recordingDuration}s)`;
                button.dataset.id = wallpaper.id;

                // Resolution Selector
                const resolutionSelect = document.createElement('select');
                resolutionSelect.id = `resolution-${wallpaper.id}`;
                availableResolutions.forEach(res => {
                     // Check if 4K is available resolution is too big for the current screen / browser limits
                     if (res.id === '4k' || res.id === '1440p') {
                         const maxCanvasSize = getMaxCanvasSize();
                         if (res.width > maxCanvasSize.width || res.height > maxCanvasSize.height) {
                              console.warn(`Skipping resolution ${res.label} as it exceeds estimated maximum canvas size.`);
                             return; // Skip this option
                         }
                     }

                    const option = document.createElement('option');
                    option.value = res.id;
                    option.textContent = res.label;
                    if (res.width && res.height) {
                        option.dataset.width = res.width;
                        option.dataset.height = res.height;
                    }
                    resolutionSelect.appendChild(option);
                });

                controlGroupDiv.appendChild(button);
                controlGroupDiv.appendChild(resolutionSelect);

                const statusSpan = document.createElement('span');
                statusSpan.id = `status-${wallpaper.id}`;
                statusSpan.className = 'status-indicator';
                statusSpan.style.display = 'none'; // Hide by default


                controlsDiv.appendChild(controlGroupDiv);
                controlsDiv.appendChild(statusSpan);
                container.appendChild(controlsDiv);
                shadersListDiv.appendChild(container);

                // Initialize the renderer for this shader
                 let renderer = null;
                 try {
                     renderer = new ShaderRenderer(canvas, wallpaper.fragmentShader);
                     shaderInstances[wallpaper.id] = renderer;
                     // The renderer.start() is now called inside the constructor if init was successful.
                 } catch (error) {
                     console.error(`Failed to initialize renderer for ${wallpaper.id}:`, error);
                      button.disabled = true;
                      button.textContent = 'Renderer Failed';
                      resolutionSelect.disabled = true;
                      statusSpan.textContent = 'Error initializing shader.';
                      statusSpan.className = 'status-indicator status-error';
                      statusSpan.style.display = 'inline-block';
                      // No need for setTimeout cleanup here, error is persistent
                 }

                 // Disable buttons if captureStream is not supported
                 if (!HTMLCanvasElement.prototype.captureStream && renderer) {
                     button.disabled = true;
                     button.textContent = 'Recording Not Supported';
                     resolutionSelect.disabled = true;
                 }


                let recordingTimerInterval = null;

                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const currentRenderer = shaderInstances[shaderId]; // Use a local variable
                    const status = document.getElementById(`status-${shaderId}`);
                    const selectElement = document.getElementById(`resolution-${shaderId}`);
                    const selectedOption = selectElement.options[selectElement.selectedIndex];
                    const resolutionId = selectedOption.value;

                    let recordingResolution = 'canvas';
                    if (resolutionId !== 'canvas') {
                         const width = parseInt(selectedOption.dataset.width, 10);
                         const height = parseInt(selectedOption.dataset.height, 10);
                         if (!isNaN(width) && !isNaN(height)) {
                             recordingResolution = { width, height };
                         } else {
                             console.error("Invalid resolution data attributes.");
                             status.textContent = '❌ Invalid Resolution Selected';
                             status.className = 'status-indicator status-error';
                             status.style.display = 'inline-block';
                             setTimeout(() => status.style.display = 'none', 3000);
                             return;
                         }
                    }

                    if (!currentRenderer || currentRenderer.mediaRecorder?.state === 'recording') {
                        console.warn("Renderer not initialized or already recording.");
                        return;
                    }

                    // Disable controls and update status
                    button.disabled = true;
                    selectElement.disabled = true;
                    status.style.display = 'inline-block';
                    status.className = 'status-indicator status-recording';
                    status.textContent = `Recording (0/${recordingDuration}s)...`;

                    // Start recording timer UI
                    let elapsedSeconds = 0;
                    recordingTimerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (elapsedSeconds <= recordingDuration) {
                             status.textContent = `Recording (${elapsedSeconds}/${recordingDuration}s)...`;
                        } else {
                             // Timer UI might go slightly past duration if processing takes time
                             clearInterval(recordingTimerInterval);
                             recordingTimerInterval = null;
                        }
                    }, 1000);

                    try {
                        // startRecording handles renderer resizing internally
                        await currentRenderer.startRecording(recordingDuration, recordingResolution);

                        // Recording finished, processing starts
                         if (recordingTimerInterval) {
                             clearInterval(recordingTimerInterval);
                             recordingTimerInterval = null;
                         }
                        status.textContent = 'Processing...';
                        status.className = 'status-indicator status-processing';

                        // Save the video blob
                        const success = currentRenderer.saveRecordedVideo(`${wallpaper.id}_${resolutionId}_${recordingDuration}s`);

                        if (success) {
                            status.textContent = '✅ Download Started!';
                            status.className = 'status-indicator status-success';
                        } else {
                            status.textContent = '❌ Download Failed';
                            status.className = 'status-indicator status-error';
                        }

                    } catch (error) {
                        console.error(`Recording or saving failed for ${shaderId}:`, error);
                        // Ensure timer is cleared on error
                         if (recordingTimerInterval) {
                            clearInterval(recordingTimerInterval);
                            recordingTimerInterval = null;
                         }
                        status.textContent = `❌ Error: ${error.message || error}`;
                        status.className = 'status-indicator status-error';

                    } finally {
                        // Re-enable controls and hide status after a delay
                        setTimeout(() => {
                            button.disabled = false;
                            selectElement.disabled = false;
                            button.textContent = `Record & Download (${recordingDuration}s)`;
                            status.style.display = 'none';
                            status.className = 'status-indicator'; // Reset class
                        }, 3000); // Show final status for 3 seconds
                    }
                });
            });

             // Helper to estimate maximum canvas size supported by the browser
             function getMaxCanvasSize() {
                 const testCanvas = document.createElement('canvas');
                 const context = testCanvas.getContext('webgl2') || testCanvas.getContext('webgl');
                 if (context) {
                     const maxTextureSize = context.getParameter(context.MAX_TEXTURE_SIZE);
                      console.log("Estimated Max Texture Size (WebGL):", maxTextureSize);
                      // A common constraint is MAX_TEXTURE_SIZE, though actual limits might vary
                      // Let's use a slightly conservative estimate
                      const max = Math.min(maxTextureSize, 8192); // Cap at 8192 or the texture limit
                      return { width: max, height: max };
                 }
                 console.warn("Could not get WebGL context to estimate max canvas size. Using a default limit.");
                 return { width: 4096, height: 4096 }; // Default conservative limit
             }


            // Cleanup renderers on page unload
            window.addEventListener('beforeunload', () => {
                Object.values(shaderInstances).forEach(renderer => {
                    if (renderer) { renderer.stop(); } // Stop animation frame and listeners
                     // More thorough cleanup if needed: renderer.renderer.dispose();
                });
            });
        });
    </script>
