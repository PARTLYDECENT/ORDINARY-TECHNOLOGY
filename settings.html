<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Chaotic Shader Recorder | Maximum Madness</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #080808; /* Even darker */
            --card-bg: #1a0a1a; /* Dark purple tint */
            --text-primary: #f0e0f0; /* Lighter purple-white */
            --text-secondary: #c0a0c0; /* Muted purple */
            --accent-blue: #00ffff; /* Cyan */
            --accent-purple: #ff00ff; /* Magenta */
            --status-recording: #ff0000; /* Pure Red */
            --status-processing: #ffff00; /* Yellow */
            --status-success: #00ff00; /* Green */
            --status-error: #ff0000; /* Red */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-y: auto;
            min-height: 100vh;
             /* Add a subtle, unsettling background pattern */
             background-image: radial-gradient(var(--card-bg) 1px, transparent 1px), radial-gradient(var(--card-bg) 1px, transparent 1px);
             background-size: 40px 40px;
             background-position: 0 0, 20px 20px;
             animation: background-pan 60s linear infinite;
        }
         @keyframes background-pan {
             0% { background-position: 0 0, 20px 20px; }
             100% { background-position: 40px 40px, 60px 60px; }
         }

        /* Custom Scrollbar - Make it glitchy/vibrant */
        body::-webkit-scrollbar {
            width: 14px; /* Wider */
        }
        body::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        body::-webkit-scrollbar-thumb {
            background-color: var(--accent-purple); /* Magenta thumb */
            border-radius: 0px; /* Sharp */
            border: 3px solid var(--dark-bg);
            box-shadow: 0 0 8px var(--accent-purple);
             transition: background-color 0.3s ease;
        }
         body::-webkit-scrollbar-thumb:hover {
             background-color: var(--accent-blue); /* Cyan on hover */
             box-shadow: 0 0 12px var(--accent-blue);
         }
        body { scrollbar-color: var(--accent-purple) var(--dark-bg); }


        .main-container {
            max-width: 1200px; /* Much Wider container */
            margin: 50px auto; /* More vertical margin */
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            font-weight: 900; /* Blackest bold */
            letter-spacing: 3px; /* Wider */
            margin-bottom: 15px;
            background: linear-gradient(to right, #8a2be2, #ff1493, #00bfff); /* Wild gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem; /* Much larger */
             text-shadow: 0 0 15px rgba(255, 0, 255, 0.5); /* Magenta glow */
        }
        .intro-text {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 60px; /* More space */
            font-size: 1.1rem; /* Slightly larger */
            max-width: 800px; /* Wider readable area */
            margin-left: auto;
            margin-right: auto;
             font-style: italic; /* Hint of madness */
        }

        .shader-container {
            margin-bottom: 50px; /* More space between modules */
            padding: 40px; /* Much increased padding */
            background-color: var(--card-bg);
            border-radius: 16px; /* Even more rounded corners */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); /* Stronger shadow */
            border: 2px solid #444; /* More prominent border */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Smoother/bouncier transition */
             position: relative; /* For pseudo-elements */
             overflow: hidden; /* Clip animated borders */
        }
         .shader-container::before, .shader-container::after {
             content: '';
             position: absolute;
             left: 0;
             right: 0;
             height: 3px;
             background: linear-gradient(90deg, transparent, var(--accent-blue), var(--accent-purple), var(--accent-blue), transparent);
             background-size: 200% 100%;
             animation: border-scan 3s linear infinite;
         }
         .shader-container::before { top: 0; }
         .shader-container::after { bottom: 0; animation-delay: 1.5s; } /* Stagger */

         @keyframes border-scan {
             0% { background-position: -100% 0; }
             100% { background-position: 100% 0; }
         }


         .shader-container:hover {
             transform: translateY(-8px); /* More pronounced lift */
             box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8); /* Stronger shadow */
         }

        .shader-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px; /* More space */
            flex-wrap: wrap;
            gap: 30px; /* Larger gap */
        }
        .shader-info {
            flex-grow: 1;
            min-width: 250px; /* Ensure it doesn't collapse */
        }
        .shader-title {
            font-size: 2.5rem; /* Larger title */
            font-weight: 900; /* Blackest bold */
            margin: 0;
            color: var(--text-primary);
            line-height: 1.1;
             text-shadow: 0 0 10px rgba(0, 255, 255, 0.4); /* Cyan glow */
        }
         .shader-description {
             font-size: 1rem;
             color: var(--text-secondary);
             margin-top: 10px;
             border-left: 5px solid var(--accent-purple); /* Thicker accent line */
             padding-left: 15px;
             font-style: normal;
         }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background-color: #000;
            margin-bottom: 30px; /* More space */
            border-radius: 10px; /* More rounded corners */
            border: 3px solid #555; /* Thicker border */
             box-shadow: inset 0 0 20px rgba(0,0,0,0.9); /* Stronger inner shadow */
             /* Add subtle animation to canvas border */
             animation: border-pulse 5s infinite ease-in-out alternate;
        }
         @keyframes border-pulse {
             0% { border-color: #555; }
             100% { border-color: #777; }
         }


        .controls {
            display: flex;
            align-items: center;
            gap: 30px; /* Much increased space */
            flex-wrap: wrap;
             justify-content: center; /* Center controls on small screens */
        }
        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 16px 35px; /* Much larger padding */
            border-radius: 10px; /* More rounded corners */
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem; /* Larger font */
            font-weight: 700; /* Bolder */
            min-width: 280px; /* Wider button */
            text-align: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px; /* More spacing */
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00bfff, #ff1493); /* More vibrant hover */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transform: translateY(-4px); /* More pronounced lift */
        }
        button:active:not(:disabled) {
             transform: translateY(0);
             box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        button:disabled {
            background: #333; /* Darker disabled */
            color: #666;
            cursor: not-allowed;
            opacity: 0.8;
            box-shadow: none;
            transform: none;
        }
        .status-indicator {
            font-style: normal;
            font-weight: 700; /* Bolder status */
            padding: 10px 20px; /* More padding */
            border-radius: 8px;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            min-width: 180px; /* Wider status */
            text-align: center;
             letter-spacing: 0.5px;
        }
        .status-recording {
            background-color: rgba(var(--status-recording-rgb, 255, 0, 0), 0.3);
            color: var(--status-recording);
            border: 2px solid var(--status-recording); /* Thicker border */
             animation: pulse-status 1s infinite alternate; /* Add pulse */
        }
         @keyframes pulse-status {
             0% { transform: scale(1); opacity: 1; }
             100% { transform: scale(1.05); opacity: 0.8; }
         }
        .status-processing {
            background-color: rgba(var(--status-processing-rgb, 255, 255, 0), 0.3);
            color: var(--status-processing);
            border: 2px solid var(--status-processing);
             animation: flicker 0.5s infinite steps(1); /* Add flicker */
        }
         @keyframes flicker {
             0% { opacity: 1; }
             50% { opacity: 0.7; }
             100% { opacity: 1; }
         }
        .status-success {
            background-color: rgba(var(--status-success-rgb, 0, 255, 0), 0.3);
            color: var(--status-success);
            border: 2px solid var(--status-success);
        }
        .status-error {
            background-color: rgba(var(--status-error-rgb, 255, 0, 0), 0.3);
            color: var(--status-error);
            border: 2px solid var(--status-error);
             animation: pulse-status 1s infinite alternate; /* Reuse pulse */
        }

        /* Helper for defining RGB vars from hex */
        .status-recording { --status-recording-rgb: 255, 0, 0; }
        .status-processing { --status-processing-rgb: 255, 255, 0; }
        .status-success { --status-success-rgb: 0, 255, 0; }
        .status-error { --status-error-rgb: 255, 0, 0; }


         /* Responsive Adjustments */
        @media (max-width: 1000px) {
             .main-container {
                 margin: 30px auto;
             }
             h1 { font-size: 2rem; letter-spacing: 2px; }
             .intro-text { margin-bottom: 40px; font-size: 1rem; }
             .shader-container { padding: 30px; margin-bottom: 40px; }
             .shader-header { gap: 20px; margin-bottom: 20px; }
             .shader-title { font-size: 2rem; }
             .shader-description { font-size: 0.9rem; }
             canvas { margin-bottom: 20px; }
             .controls { gap: 20px; }
             button { padding: 14px 30px; font-size: 1.1rem; min-width: 240px; }
             .status-indicator { padding: 8px 15px; font-size: 1rem; min-width: 150px; }
        }

        @media (max-width: 768px) {
             .main-container { padding: 0 10px; }
             h1 { font-size: 1.8rem; letter-spacing: 1.5px; }
             .intro-text { margin-bottom: 30px; font-size: 0.9rem; }
             .shader-container { padding: 20px; margin-bottom: 30px; }
             .shader-header { flex-direction: column; align-items: stretch; gap: 15px; margin-bottom: 15px;}
             .shader-info { min-width: auto; }
             .shader-title { font-size: 1.8rem; }
             .shader-description { font-size: 0.85rem; padding-left: 10px; border-left-width: 3px;}
             canvas { margin-bottom: 15px; }
             .controls { flex-direction: column; gap: 10px; align-items: stretch;}
             button { padding: 12px 25px; font-size: 1rem; min-width: auto; width: 100%;}
             .status-indicator { padding: 6px 12px; font-size: 0.9rem; min-width: auto; width: 100%; }
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>Hyper-Chaotic Shader Recorder</h1>
        <p class="intro-text">Warning: These shaders are not for the faint of mind. Engage with caution. Click "Record & Download" to capture a <strong>1-minute</strong> video clip (MP4/WEBM). Processing requires processing power. Be patient. Or don't.</p>

        <div id="shadersList">
            </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ========================================================================
        // SHADER DEFINITIONS - NOW CERTIFIED INSANE
        // ========================================================================
        // Proceed with extreme caution. These shaders are unstable and may cause
        // existential dread or spontaneous combustion.
        // ========================================================================

        const wallpapers = [

            // --- Shader: Quantum Foam Ocean (Waves Remorphed) ---
            {
                id: 'quantum-foam-ocean',
                title: 'Quantum Foam Ocean',
                description: 'A violently churning sea of probability and error. Waves of pure data distortion.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    void main() {
                        vec2 uv = gl_FragCoord.xy / resolution.xy;

                        // Hyper-fast, multi-layered waves of pure chaos
                        float wave1 = sin(uv.x * 50.0 + time * 20.0 + uv.y * 10.0) * 0.1;
                        float wave2 = cos(uv.x * 30.0 - time * 15.0 + uv.y * 15.0) * 0.08;
                        float wave3 = sin(uv.y * 40.0 + time * 25.0) * 0.12;
                        float y = uv.y + wave1 + wave2 + wave3;

                        // Color palette: Acidic green, volatile magenta, glitchy cyan
                        vec3 color = mix( vec3(0.1, 0.0, 0.1), vec3(0.0, 0.8, 0.2), smoothstep(0.2, 0.8, y) ); // Dark base to green
                         color = mix(color, vec3(0.8, 0.0, 0.8), smoothstep(0.4, 0.9, y + sin(time*10.0)*0.1) ); // Add magenta layer with pulse
                         color = mix(color, vec3(0.0, 1.0, 1.0), smoothstep(0.6, 1.0, y + cos(time*12.0)*0.15) ); // Add cyan highlights with faster pulse


                        // Intense, flickering highlights and "foam" (data noise)
                        float highlightNoise = sin(uv.x * 100.0 + time * 50.0 + uv.y * 30.0);
                        float highlight = smoothstep(0.4 + highlightNoise * 0.1, 0.6 + highlightNoise * 0.1, y);
                        color = mix(color, vec3(1.0, 1.0, 1.0), highlight * 0.8); // White highlights

                        float foamNoise = sin(uv.x * 200.0 + time * 70.0 + uv.y * 50.0);
                         foamNoise = smoothstep(0.5, 0.9, foamNoise + sin(time*80.0)*0.2); // Flicker foam
                        color = mix(color, vec3(1.0, 0.5, 0.0), foamNoise * smoothstep(0.5, 0.7, y) * 0.5); // Orange "error" foam

                         // Add screen-wide color pulsing
                         color *= (sin(time * 5.0) * 0.1 + 0.9); // Subtle brightness pulse


                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Quantum Foam Ocean ---


            // --- Shader: Galactic Core Meltdown (Nebula Remorphed) ---
            {
                id: 'core-meltdown',
                title: 'Galactic Core Meltdown',
                description: 'The universe is unraveling. Swirling cosmic energy feeding on itself.',
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    // Higher frequency noise
                    float hash(vec2 p) { p = fract(p * vec2(423.34, 856.21)); p += dot(p, p + 75.32); return fract(p.x * p.y); }
                    float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); float a = hash(i + vec2(0.0, 0.0)); float b = hash(i + vec2(1.0, 0.0)); float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0)); return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); }
                    float fbm(vec2 p) { float total = 0.0; float amplitude = 0.5; float frequency = 3.0; int octaves = 7; for (int i = 0; i < octaves; i++) { total += noise(p * frequency) * amplitude; frequency *= 2.5; amplitude *= 0.45; } return total; } // More octaves, higher frequency multiplier

                    void main() {
                         vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
                         vec2 p = uv * 2.0; // Zoom in slightly
                         vec2 motion = vec2(time * 0.1, time * 0.08); /* Faster, more turbulent motion */

                         // Add chaotic distortion based on time and noise
                         float distort1 = sin(time * 5.0 + uv.x * 10.0) * 0.1;
                         float distort2 = cos(time * 6.0 + uv.y * 12.0) * 0.1;
                         p += vec2(distort1, distort2);


                         float n = fbm(p + motion + vec2(distort2, distort1)); // Add distortion to FBM inputs
                         float n2 = fbm(p * 2.5 + motion * 0.8 + 15.0 + vec2(distort1, distort2)*0.5); // Faster, more offset FBM

                         // Color palette: Violent purples, searing reds, toxic greens, blinding yellows
                         vec3 col1 = vec3(0.3, 0.0, 0.5); // Deep Purple
                         vec3 col2 = vec3(1.0, 0.1, 0.1); // Searing Red
                         vec3 col3 = vec3(0.1, 0.8, 0.2); // Toxic Green
                         vec3 col4 = vec3(1.0, 1.0, 0.0); // Blinding Yellow

                         vec3 color = mix(col1, col2, smoothstep(0.2, 0.7, n)); // Wider transition
                         color = mix(color, col3, smoothstep(0.3, 0.8, n2 + sin(time*7.0)*0.1)); // Add pulsing green
                         color = mix(color, col4, smoothstep(0.7, 1.0, n * n2 + cos(time*9.0)*0.2)); // Add strong pulsing yellow

                         // Stronger vignette
                         float vignette = smoothstep(1.5, 0.5, length(uv)); // Less falloff distance
                         color *= vignette;

                         // More chaotic starfield
                         float starDensity = 500.0; // More stars
                         vec2 gridUV = fract(uv * starDensity);
                         vec2 id = floor(uv * starDensity);
                         float starHash = hash(id + sin(time * 2.0 + id.y * 0.5)); /* Faster twinkle */

                         float star = 0.0;
                         if (starHash > 0.9) { // Lower threshold for more stars
                             float size = fract(starHash * 100.0) * 0.02 + 0.005; // Larger size range
                             float falloff = smoothstep(size, 0.0, length(gridUV - 0.5));
                              star = falloff * (fract(starHash * 20.0) * 0.8 + 0.2); // Stronger, faster twinkle
                         }
                         color = mix(color, color + vec3(star * 1.5), star); // Make stars brighter


                         gl_FragColor = vec4(color, 1.0);
                    }
                `
            }, // --- End Shader: Galactic Core Meltdown ---


            // --- Shader: Psycho-Kinetic Feedback (Swirling Plasma Remorphed) ---
            {
                 id: 'psychokinetic-feedback',
                 title: 'Psycho-Kinetic Feedback',
                 description: 'Raw mental energy overloading the sensors. Unstable, violent, and possibly sentient.',
                 fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;

                    float hash(vec2 p) { return fract(sin(dot(p, vec2(543.21, 987.65))) * 87654.321); } // Different hash

                    float noise(vec2 p) {
                        vec2 i = floor(p);
                        vec2 f = fract(p);
                        f = f * f * (3.0 - 2.0 * f);
                        float a = hash(i);
                        float b = hash(i + vec2(1, 0));
                        float c = hash(i + vec2(0, 1));
                        float d = hash(i + vec2(1, 1));
                        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
                    }

                    float fbm(vec2 p) {
                        float v = 0.0;
                        float a = 1.0;
                        for (int i = 0; i < 8; i++) { // More octaves
                            v += noise(p) * a;
                            p = p * 2.2 + vec2(1.5, 0.5); // Faster frequency, different offset
                            a *= 0.4; // Faster amplitude decay
                        }
                        return v;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;

                        // Hyper-aggressive swirl effect
                        float angle = time * 1.5; // Much faster base rotation
                        float swirlIntensity = fbm(uv * 3.0 + vec2(time * 0.8, time * 0.6)) * 5.0; // Higher intensity, faster noise
                        vec2 rotated_uv = vec2(
                            uv.x * cos(angle + swirlIntensity) - uv.y * sin(angle + swirlIntensity),
                            uv.x * sin(angle + swirlIntensity) + uv.y * cos(angle + swirlIntensity)
                        );

                        // Chaotic Plasma pattern
                        float plasma = fbm(rotated_uv * 6.0 + vec2(time * 1.5)); // Faster, higher frequency
                        float fastPlasma = fbm(rotated_uv * 12.0 - vec2(time * 2.0) + 30.0); // Even faster layer

                        // Combine with violent pulsing and sharp steps
                        float finalPlasma = smoothstep(0.3, 0.7, plasma) + smoothstep(0.4, 0.8, fastPlasma * 0.8);
                         finalPlasma += sin(time * 10.0) * 0.3; // Much stronger, faster pulse
                         finalPlasma = fract(finalPlasma * 1.5); // Add stepping/banding


                        // Color mapping (Violent, clashing gradients)
                        vec3 color = vec3(0.0);
                        color = mix(color, vec3(0.5, 0.0, 1.0), smoothstep(0.0, 0.3, finalPlasma)); // Deep Purple
                        color = mix(color, vec3(1.0, 0.0, 0.0), smoothstep(0.3, 0.5, finalPlasma + sin(time*15.0)*0.1)); // Searing Red pulse
                        color = mix(color, vec3(1.0, 1.0, 0.0), smoothstep(0.5, 0.7, finalPlasma + cos(time*18.0)*0.2)); // Yellow pulse
                        color = mix(color, vec3(0.0, 1.0, 0.0), smoothstep(0.7, 1.0, finalPlasma * finalPlasma + sin(time*20.0)*0.3)); // Toxic Green pulse

                         // Multiply color for extra intensity
                         color *= 1.5;

                        // Stronger, sharper vignette
                        float vignette = smoothstep(1.0, 0.0, length(uv)); // Faster falloff
                        color *= vignette;

                        gl_FragColor = vec4(color, 1.0);
                    }
                 `
            }, // --- End Shader: Psycho-Kinetic Feedback ---


            // --- Shader: Reality Fracture (Fractal Tunnel Remorphed) ---
             // Warning: This raymarching shader is complex and may be slow on some devices.
            {
                 id: 'reality-fracture',
                 title: 'Reality Fracture',
                 description: 'Peer into the collapsing structure of spacetime. Unstable fractal geometry tearing itself apart.',
                 fragmentShader: `
                    precision highp float;

                    uniform float time;
                    uniform vec2 resolution;

                    #define MAX_STEPS 80 // Fewer steps for speed, might look blockier
                    #define MAX_DIST 30.0 // Shorter view distance
                    #define SURF_DIST 0.002 // Tighter hit distance

                    // Rotation Matrices
                    mat3 rotationY(float angle) { float c = cos(angle), s = sin(angle); return mat3(c, 0.0, s, 0.0, 1.0, 0.0, -s, 0.0, c); }
                    mat3 rotationX(float angle) { float c = cos(angle), s = sin(angle); return mat3(1.0, 0.0, 0.0, 0.0, c, -s, 0.0, s, c); }

                    // 3D noise for distortion
                     float hash3d(vec3 p) { vec3 q = dot(p, vec3(123.4, 567.8, 901.2)) + time * 5.0; return fract(sin(q.x + q.y + q.z) * 87654.321); }
                     float noise3d(vec3 p) {
                         vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);
                         float n = i.x + i.y*157.0 + i.z*113.0;
                         return mix(mix(mix(hash3d(i+vec3(0,0,0)), hash3d(i+vec3(1,0,0)),f.x), mix(hash3d(i+vec3(0,1,0)), hash3d(i+vec3(1,1,0)),f.x),f.y),
                                mix(mix(hash3d(i+vec3(0,0,1)), hash3d(i+vec3(1,0,1)),f.x), mix(hash3d(i+vec3(0,1,1)), hash3d(i+vec3(1,1,1)),f.x),f.y),f.z);
                     }
                     float fbm3d(vec3 p) { float total = 0.0; float amplitude = 0.5; float frequency = 1.0; for(int i=0; i<4; i++) { total += noise3d(p * frequency) * amplitude; frequency *= 2.0; amplitude *= 0.5; } return total; }


                    // Fractal SDF - More aggressive folding/scaling
                    float fractalSDF(vec3 p) {
                         vec3 ap = abs(p);
                         if (ap.x < ap.y) p.xy = p.yx;
                         if (ap.x < ap.z) p.xz = p.zx;
                         if (ap.y < ap.z) p.yz = p.zy;

                         p = p * 2.5 - vec3(1.2); // Faster scaling, different offset

                         // Add chaotic noise distortion directly to position
                         p += fbm3d(p * 3.0 + time * 0.8) * 0.3; // Stronger noise distortion

                         float d = length(p) - 0.8; // Smaller base shape

                         return d / 2.2; // Scale distance more aggressively
                    }

                    // Scene SDF - combines fractal repeats with violent twisting
                    float sceneSDF(vec3 p) {

        // ========================================================================
        // Shader Renderer Class (Handles WebGL and Recording)
        // (This class remains the same as the previous version, it's already modular)
        // ========================================================================
        class ShaderRenderer {
            constructor(canvas, fragmentShader) {
                this.canvas = canvas;
                this.fragmentShader = fragmentShader;
                this.time = Math.random() * 100; // Start time from a random point
                this.isActive = false;
                this.animationFrameId = null;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordingMimeType = '';
                this.recordingFileExtension = '';
                this.resizeTimeout = null;
                this.handleResize = this.handleResize.bind(this);
                this.render = this.render.bind(this);
                this.init();
            }

            init() {
                if (!window.WebGLRenderingContext) {
                     console.error("WebGL is not supported in your browser.");
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                         ctx.fillStyle = '#ff0000'; // Red error text
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('WebGL Not Supported', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null;
                     return;
                }

                try {
                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        preserveDrawingBuffer: true,
                        antialias: true
                    });
                    this.renderer.setPixelRatio(window.devicePixelRatio * 0.75); // Scaled DP

                } catch (error) {
                     console.error("Error creating WebGL Renderer:", error);
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                         ctx.fillStyle = '#ff0000'; // Red error text
                         ctx.font = '14px Roboto, sans-serif';
                         ctx.textAlign = 'center';
                         ctx.fillText('Renderer Init Failed', this.canvas.width / 2, this.canvas.height / 2);
                     }
                     this.renderer = null;
                     return;
                }

                this.scene = new THREE.Scene();
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: this.time },
                        resolution: { value: new THREE.Vector2(this.canvas.width, this.canvas.height) }
                    },
                    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                    fragmentShader: this.fragmentShader,
                    depthWrite: false, depthTest: false
                });

                const geometry = new THREE.PlaneGeometry(2, 2);
                const mesh = new THREE.Mesh(geometry, this.material);
                this.scene.add(mesh);

                this.resize();
                window.addEventListener('resize', this.handleResize);
            }

            resize() {
                const width = this.canvas.clientWidth;
                const height = this.canvas.clientHeight;
                const devicePixelRatio = window.devicePixelRatio * 0.75;
                const displayWidth = Math.floor(width * devicePixelRatio);
                const displayHeight = Math.floor(height * devicePixelRatio);

                if (this.canvas.width !== displayWidth || this.canvas.height !== displayHeight) {
                    if (this.renderer) {
                        this.renderer.setSize(displayWidth, displayHeight, false);
                        if (this.material && this.material.uniforms.resolution) {
                             this.material.uniforms.resolution.value.set(displayWidth, displayHeight);
                        }
                    }
                }
            }

            handleResize() {
                clearTimeout(this.resizeTimeout);
                this.resizeTimeout = setTimeout(() => {
                    this.resize();
                }, 150);
            }

            render() {
                if (!this.isActive || !this.renderer) {
                    if (this.animationFrameId) {
                        cancelAnimationFrame(this.animationFrameId);
                        this.animationFrameId = null;
                    }
                    return;
                }

                this.animationFrameId = requestAnimationFrame(this.render);

                this.time += 0.016;
                 if (this.material && this.material.uniforms.time) {
                    this.material.uniforms.time.value = this.time;
                 }

                try {
                    this.renderer.render(this.scene, this.camera);
                } catch (renderError) {
                    console.error("Error during WebGL rendering:", renderError);
                    this.stop();
                     const ctx = this.canvas.getContext('2d');
                     if(ctx) {
                          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                          ctx.fillStyle = '#ff0000';
                          ctx.font = '14px Roboto, sans-serif';
                          ctx.textAlign = 'center';
                           ctx.fillText('Render Error', this.canvas.width / 2, this.canvas.height / 2);
                     }
                }
            }

            start() {
                if (this.isActive || !this.renderer) return;
                this.isActive = true;
                this.resize();
                this.render();
            }

            stop() {
                this.isActive = false;
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                window.removeEventListener('resize', this.handleResize);
            }

            // --- Recording Logic ---
            async startRecording(duration = 60) {
                 return new Promise(async (resolve, reject) => {
                    if (!this.canvas || !this.isActive || !this.renderer) {
                        console.error("Cannot record: Renderer not active or canvas not found.");
                        return reject("Renderer not active or canvas missing");
                    }
                    if (!this.canvas.captureStream) {
                        console.error("canvas.captureStream() not supported.");
                        alert("Video recording is not supported in your browser (canvas.captureStream missing).");
                        return reject("captureStream not supported");
                    }
                    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                        console.warn("Recording already in progress.");
                        return reject("Recording in progress");
                    }

                    const supportedTypes = [
                        { mime: 'video/mp4', extension: 'mp4' },
                        { mime: 'video/webm;codecs=vp9', extension: 'webm' },
                        { mime: 'video/webm;codecs=vp8', extension: 'webm' },
                        { mime: 'video/webm', extension: 'webm' }
                    ];
                    let selectedType = null;
                    for (const typeInfo of supportedTypes) {
                        if (MediaRecorder.isTypeSupported(typeInfo.mime)) {
                            selectedType = typeInfo;
                            console.log(`Using MIME type: ${selectedType.mime}`);
                            break;
                        }
                    }

                    if (!selectedType) {
                        console.error("No supported MIME type found for MediaRecorder (MP4 or WEBM).");
                        alert("Video recording failed: No supported video format (MP4/WEBM) found in your browser.");
                        return reject("No supported MIME type");
                    }

                    this.recordingMimeType = selectedType.mime;
                    this.recordingFileExtension = selectedType.extension;

                    try {
                        const stream = this.canvas.captureStream(30);
                        this.mediaRecorder = new MediaRecorder(stream, {
                            mimeType: this.recordingMimeType,
                            videoBitsPerSecond: 10000000 // Higher bitrate for MAXIMUM quality
                        });
                    } catch (error) {
                        console.error("Failed to create MediaRecorder:", error);
                        alert(`Video recording failed: Could not create recorder. Error: ${error.message}`);
                        return reject(`MediaRecorder creation failed: ${error.message}`);
                    }

                    this.recordedChunks = [];
                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                        } else {
                             console.warn(">>> ondataavailable fired with empty data chunk.");
                        }
                    };

                    this.mediaRecorder.onstop = () => {
                        console.log(`Recording stopped. Final chunks count: ${this.recordedChunks.length}`);
                        resolve({ mimeType: this.recordingMimeType, extension: this.recordingFileExtension });
                    };

                    this.mediaRecorder.onerror = (e) => {
                        console.error("MediaRecorder error:", e.error);
                        alert(`Video recording error: ${e.error.name} - ${e.error.message}`);
                        reject(`MediaRecorder error: ${e.error.name}`);
                    };

                    this.mediaRecorder.start(1000);
                    console.log(`Recording started for ${duration} seconds (${this.recordingMimeType})...`);

                    setTimeout(() => {
                        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                            this.mediaRecorder.stop();
                        }
                    }, duration * 1000);
                });
            }

            saveRecordedVideo(filename = 'shader_video') {
                 if (!this.recordedChunks || this.recordedChunks.length === 0) {
                    console.error("No recorded data to save.");
                    return false;
                }
                 if (!this.recordingMimeType || !this.recordingFileExtension) {
                     console.error("Missing recording format information.");
                     return false;
                 }

                const blob = new Blob(this.recordedChunks, { type: this.recordingMimeType });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `${filename}.${this.recordingFileExtension}`;

                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    this.recordedChunks = [];
                    this.recordingMimeType = '';
                    this.recordingFileExtension = '';
                }, 100);

                return true;
            }
        }

                controlsDiv.appendChild(statusSpan);
                container.appendChild(controlsDiv);
                shadersListDiv.appendChild(container);

                setTimeout(() => {
                    try {
                        const renderer = new ShaderRenderer(canvas, wallpaper.fragmentShader);
                        shaderInstances[wallpaper.id] = renderer;
                        renderer.start();
                    } catch (error) {
                        console.error(`Failed to initialize renderer for ${wallpaper.id}:`, error);
                         button.disabled = true;
                         button.textContent = 'Renderer Failed';
                         statusSpan.textContent = 'Error initializing shader.';
                         statusSpan.className = 'status-indicator status-error';
                         statusSpan.style.display = 'inline-block';
                    }
                }, 100);


                let recordingTimerInterval = null;

                button.addEventListener('click', async () => {
                    const shaderId = button.dataset.id;
                    const renderer = shaderInstances[shaderId];
                    const status = document.getElementById(`status-${shaderId}`);

                    if (!renderer || renderer.mediaRecorder?.state === 'recording') {
                        console.warn("Renderer not initialized or already recording.");
                        return;
                    }

                    button.disabled = true;
                    status.style.display = 'inline-block';
                    status.className = 'status-indicator status-recording';
                    status.textContent = `Recording (0/${recordingDuration}s)...`;

                    let elapsedSeconds = 0;
                    recordingTimerInterval = setInterval(() => {
                        elapsedSeconds++;
                        if (elapsedSeconds <= recordingDuration) {
                             status.textContent = `Recording (${elapsedSeconds}/${recordingDuration}s)...`;
                        } else {
                            clearInterval(recordingTimerInterval);
                            recordingTimerInterval = null;
                        }
                    }, 1000);


                    try {
                        await renderer.startRecording(recordingDuration);

                        clearInterval(recordingTimerInterval);
                        recordingTimerInterval = null;

                        status.textContent = 'Processing...';
                        status.className = 'status-indicator status-processing';

                        const success = renderer.saveRecordedVideo(`${shaderId}_video_${recordingDuration}s`);

                        if (success) {
                            status.textContent = '✅ Download Started!';
                            status.className = 'status-indicator status-success';
                        } else {
                            status.textContent = '❌ Download Failed';
                            status.className = 'status-indicator status-error';
                        }

                    } catch (error) {
                        console.error(`Recording or saving failed for ${shaderId}:`, error);
                        clearInterval(recordingTimerInterval);
                        recordingTimerInterval = null;
                        status.textContent = `❌ Error: ${error.message || error}`;
                        status.className = 'status-indicator status-error';

                    } finally {
                        setTimeout(() => {
                            button.disabled = false;
                            button.textContent = `Record & Download (${recordingDuration}s)`;
                            status.style.display = 'none';
                            status.className = 'status-indicator';
                        }, 3000);
                    }
                });
            });

            window.addEventListener('beforeunload', () => {
                Object.values(shaderInstances).forEach(renderer => {
                    if (renderer) { renderer.stop(); }
                });
            });
        });
    </script>

</body>
</html>
