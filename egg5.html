<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperreal Terrain Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(ellipse at center, #0f0f23 0%, #000 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffd93d);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .control-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #4ecdc4;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccc;
        }
        
        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .value-display {
            font-weight: bold;
            color: #4ecdc4;
            background: rgba(0,0,0,0.3);
            padding: 3px 8px;
            border-radius: 5px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            outline: none;
            transition: opacity .2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #4ecdc4;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #4ecdc4;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .generate-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }
        .generate-btn:disabled {
             background: #555;
             cursor: wait;
             opacity: 0.7;
        }

        .download-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }

        .download-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(78, 205, 196, 0.6);
        }

        .download-btn:disabled {
            background: #333;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #canvas-container {
             position: relative;
             width: 100%;
             height: 600px;
        }

        #canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 5px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            width: 0%;
            transition: width 0.3s ease-out;
        }
        
        .progress-text {
            color: #fff;
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
            text-shadow: 1px 1px 2px #000;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .biome-legend, .terrain-stats {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
        }

        .legend-title, .stats-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #4ecdc4;
        }

        .biome-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .biome-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .biome-item:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.1);
        }

        .biome-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .stats-content {
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .info-panel {
                grid-template-columns: 1fr;
            }
            .title {
                font-size: 2.5rem;
            }
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">HYPERREAL TERRAIN GENERATOR</h1>
        </div>
        
        <div class="controls-panel">
            <div class="control-section">
                <div class="section-title">🌍 Terrain Parameters</div>
                <div class="control-group">
                    <label for="resolution">Resolution:</label>
                    <select id="resolution">
                        <option value="128">128x128 (Fast)</option>
                        <option value="256" selected>256x256 (Balanced)</option>
                        <option value="512">512x512 (High Quality)</option>
                    </select>
                </div>
                <div class="control-group">
                     <div class="label-container">
                        <label for="heightScale">Height Amplification:</label>
                        <span id="heightScaleValue" class="value-display"></span>
                    </div>
                    <input type="range" id="heightScale" min="20" max="200" value="75" step="1">
                </div>
                <div class="control-group">
                    <label for="seed">World Seed:</label>
                    <input type="text" id="seed" value="paradise">
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">🏔️ Geological Features</div>
                 <div class="control-group">
                    <div class="label-container">
                        <label for="seaLevel">Sea Level:</label>
                        <span id="seaLevelValue" class="value-display"></span>
                    </div>
                    <input type="range" id="seaLevel" min="-0.4" max="0.4" value="0.0" step="0.01">
                </div>
                <div class="control-group">
                    <div class="label-container">
                        <label for="terrainRoughness">Terrain Roughness:</label>
                        <span id="terrainRoughnessValue" class="value-display"></span>
                    </div>
                    <input type="range" id="terrainRoughness" min="0" max="1" value="0.5" step="0.01">
                </div>
                 <div class="control-group">
                    <div class="label-container">
                        <label for="detailScale">Feature Size:</label>
                        <span id="detailScaleValue" class="value-display"></span>
                    </div>
                    <input type="range" id="detailScale" min="50" max="500" value="250" step="1">
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">🌡️ Climate System</div>
                <div class="control-group">
                     <div class="label-container">
                        <label for="temperature">Global Temperature:</label>
                        <span id="temperatureValue" class="value-display"></span>
                    </div>
                    <input type="range" id="temperature" min="-1" max="1" value="0.0" step="0.01">
                </div>
                <div class="control-group">
                    <div class="label-container">
                        <label for="humidity">Global Humidity:</label>
                        <span id="humidityValue" class="value-display"></span>
                    </div>
                    <input type="range" id="humidity" min="0" max="1" value="0.5" step="0.01">
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">⚙️ Noise Settings</div>
                <div class="control-group">
                     <div class="label-container">
                        <label for="octaves">Noise Octaves:</label>
                        <span id="octavesValue" class="value-display"></span>
                    </div>
                    <input type="range" id="octaves" min="1" max="10" value="7" step="1">
                </div>
                <div class="control-group">
                    <div class="label-container">
                        <label for="lacunarity">Lacunarity:</label>
                        <span id="lacunarityValue" class="value-display"></span>
                    </div>
                    <input type="range" id="lacunarity" min="1.5" max="3.5" value="2.0" step="0.01">
                </div>
                <div class="control-group">
                    <div class="label-container">
                        <label for="persistence">Persistence:</label>
                        <span id="persistenceValue" class="value-display"></span>
                    </div>
                    <input type="range" id="persistence" min="0.1" max="0.9" value="0.5" step="0.01">
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn generate-btn" id="generateBtn" onclick="generateHyperTerrain()">🚀 GENERATE WORLD</button>
            <button class="btn download-btn" id="downloadBtn" onclick="downloadPLY()" disabled>💾 EXPORT PLY</button>
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="progress-container" id="progressContainer">
                 <div class="progress-bar">
                    <div class="progress-fill" id="progressBar"></div>
                 </div>
                 <div class="progress-text" id="progressText">Generating...</div>
            </div>
        </div>


        <div class="info-panel">
            <div class="biome-legend">
                <div class="legend-title">🎨 Biome Legend</div>
                <div class="biome-grid" id="biomeGrid">
                    </div>
            </div>

            <div class="terrain-stats">
                <div class="stats-title">📊 World Statistics</div>
                <div class="stats-content" id="terrainStats">
                    Click "Generate World" to create a new terrain...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>


    <script>
        let scene, camera, renderer, terrainMesh, waterMesh;
        let worldData = null;
        let isGenerating = false;
        let controls; // OrbitControls

        const SEA_LEVEL_BASE = 15;

        // Biome definitions based on Whittaker diagram (Temp vs Precip/Humidity)
        const BIOMES = {
            ocean:          { color: 0x1a237e, name: 'Ocean' },
            beach:          { color: 0xf5e0c5, name: 'Beach' },
            scorched:       { color: 0x555555, name: 'Scorched' },
            bare:           { color: 0x999999, name: 'Bare Rock' },
            tundra:         { color: 0xacbfa7, name: 'Tundra' },
            snow:           { color: 0xfafafa, name: 'Snow Cap' },
            desert:         { color: 0xedc9af, name: 'Desert' },
            savanna:        { color: 0xc4a464, name: 'Savanna' },
            grassland:      { color: 0x93c54b, name: 'Grassland' },
            shrubland:      { color: 0x889e47, name: 'Shrubland' },
            taiga:          { color: 0x5a7d6d, name: 'Taiga Forest' },
            forest:         { color: 0x48783d, name: 'Temperate Forest' },
            rainforest:     { color: 0x335c2e, name: 'Rainforest' },
        };
        
        // --- NOISE HELPERS ---
        function createNoiseFunction(seed) {
            const simplex = new SimplexNoise(seed);
            return (x, y) => simplex.noise2D(x, y);
        }

        function FBM(noiseFunc, x, y, octaves, lacunarity, persistence) {
            let total = 0;
            let frequency = 1;
            let amplitude = 1;
            let maxValue = 0;
            for (let i = 0; i < octaves; i++) {
                total += noiseFunc(x * frequency, y * frequency) * amplitude;
                maxValue += amplitude;
                amplitude *= persistence;
                frequency *= lacunarity;
            }
            return total / maxValue;
        }
        
        // String to seed conversion
        function stringToSeed(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0; // Convert to 32bit integer
            }
            return hash;
        }
        
        function updateSliderValues() {
            document.getElementById('heightScaleValue').textContent = document.getElementById('heightScale').value;
            document.getElementById('seaLevelValue').textContent = (parseFloat(document.getElementById('seaLevel').value)).toFixed(2);
            document.getElementById('terrainRoughnessValue').textContent = parseFloat(document.getElementById('terrainRoughness').value).toFixed(2);
            document.getElementById('detailScaleValue').textContent = document.getElementById('detailScale').value;
            document.getElementById('temperatureValue').textContent = parseFloat(document.getElementById('temperature').value).toFixed(2);
            document.getElementById('humidityValue').textContent = parseFloat(document.getElementById('humidity').value).toFixed(2);
            document.getElementById('octavesValue').textContent = document.getElementById('octaves').value;
            document.getElementById('lacunarityValue').textContent = parseFloat(document.getElementById('lacunarity').value).toFixed(2);
            document.getElementById('persistenceValue').textContent = parseFloat(document.getElementById('persistence').value).toFixed(2);
        }

        function initThreeJS() {
            const canvasContainer = document.getElementById('canvas-container');
            const canvas = document.getElementById('canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.003);

            camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0x404080, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffddaa, 1.5);
            sunLight.position.set(250, 500, 150);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 1000;
            sunLight.shadow.camera.left = -300;
            sunLight.shadow.camera.right = 300;
            sunLight.shadow.camera.top = 300;
            sunLight.shadow.camera.bottom = -300;
            scene.add(sunLight);
            
            // Skybox
            const loader = new THREE.CubeTextureLoader();
            const texture = loader.load([
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/pos-x.jpg',
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/neg-x.jpg',
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/pos-y.jpg',
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/neg-y.jpg',
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/pos-z.jpg',
                'https://threejsfundamentals.org/threejs/resources/images/cubemaps/computer-history-museum/neg-z.jpg',
            ]);
            scene.background = texture;

            camera.position.set(200, 150, 200);
            
            // --- OrbitControls (need to be dynamically imported for module support) ---
            const orbitScript = document.createElement('script');
            orbitScript.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
            document.head.appendChild(orbitScript);
            orbitScript.onload = () => {
                 controls = new THREE.OrbitControls(camera, renderer.domElement);
                 controls.enableDamping = true;
                 controls.dampingFactor = 0.05;
                 controls.screenSpacePanning = false;
                 controls.minDistance = 50;
                 controls.maxDistance = 1000;
                 controls.maxPolarAngle = Math.PI / 2.1;
                 controls.target.set(0, 0, 0);
            };

            function animate() {
                requestAnimationFrame(animate);
                if(controls) controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        // Biome logic based on elevation, temp, humidity
        function getBiome(e, m, t) {
            // e = elevation (0-1), m = moisture/humidity (0-1), t = temperature (0-1)
            const seaLevel = parseFloat(document.getElementById('seaLevel').value);
            
            if (e < seaLevel + 0.015) return BIOMES.beach;
            if (e < seaLevel) return BIOMES.ocean;
            
            if (t > 0.8) {
                if (m < 0.2) return BIOMES.desert;
                if (m < 0.5) return BIOMES.savanna;
                return BIOMES.rainforest;
            }
            if (t > 0.5) {
                if (m < 0.1) return BIOMES.desert;
                if (m < 0.4) return BIOMES.grassland;
                if (m < 0.7) return BIOMES.forest;
                return BIOMES.rainforest;
            }
            if (t > 0.2) {
                if (m < 0.3) return BIOMES.shrubland;
                if (m < 0.7) return BIOMES.taiga;
                return BIOMES.forest;
            }
            
            if (e > 0.7) return BIOMES.snow;
            if (e > 0.5) return BIOMES.bare;

            return BIOMES.tundra;
        }

        async function generateHyperTerrain() {
            if (isGenerating) return;
            isGenerating = true;
            
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            generateBtn.textContent = '🔄 GENERATING...';
            generateBtn.disabled = true;
            downloadBtn.disabled = true;
            progressContainer.style.opacity = '1';

            // --- Get Parameters ---
            const resolution = parseInt(document.getElementById('resolution').value);
            const heightScale = parseFloat(document.getElementById('heightScale').value);
            const seed = stringToSeed(document.getElementById('seed').value);
            const seaLevel = parseFloat(document.getElementById('seaLevel').value);
            const terrainRoughness = parseFloat(document.getElementById('terrainRoughness').value);
            const detailScale = parseFloat(document.getElementById('detailScale').value);
            const globalTemp = parseFloat(document.getElementById('temperature').value);
            const globalHumid = parseFloat(document.getElementById('humidity').value);
            const octaves = parseInt(document.getElementById('octaves').value);
            const lacunarity = parseFloat(document.getElementById('lacunarity').value);
            const persistence = parseFloat(document.getElementById('persistence').value);

            // --- Initialize Noise ---
            const baseNoise = createNoiseFunction(seed);
            const ridgeNoise = createNoiseFunction(seed + 1);
            const tempNoise = createNoiseFunction(seed + 2);
            const humidNoise = createNoiseFunction(seed + 3);
            const warpNoiseX = createNoiseFunction(seed + 4);
            const warpNoiseZ = createNoiseFunction(seed + 5);

            // Clear existing meshes
            if (terrainMesh) scene.remove(terrainMesh);
            if (waterMesh) scene.remove(waterMesh);

            const mapSize = 500; // The size of the terrain plane in world units
            const geometry = new THREE.PlaneGeometry(mapSize, mapSize, resolution - 1, resolution - 1);
            
            const vertices = geometry.attributes.position.array;
            const colors = [];
            const biomeStats = {};
            
            // --- Main Generation Loop ---
            for (let i = 0, j = 0; i < vertices.length; i += 3, j++) {
                
                if (j % Math.floor(resolution / 10) === 0) {
                     const percent = (j / (resolution * resolution)) * 100;
                     progressBar.style.width = `${percent}%`;
                     progressText.textContent = `Generating Vertices: ${Math.round(percent)}%`;
                     await new Promise(resolve => setTimeout(resolve, 0));
                }

                const u = (j % resolution) / (resolution - 1);
                const v = Math.floor(j / resolution) / (resolution - 1);

                // --- 1. Domain Warping ---
                // Distorting the input coordinates creates more natural, flowing patterns.
                const warpStrength = 80;
                const warpedX = u + warpNoiseX(u * 2, v * 2) * (warpStrength / detailScale);
                const warpedZ = v + warpNoiseZ(u * 2, v * 2) * (warpStrength / detailScale);
                
                const nx = warpedX * detailScale / 100;
                const nz = warpedZ * detailScale / 100;

                // --- 2. Base Elevation (fBm) ---
                // A mix of smooth noise and ridged noise for varied terrain.
                let smooth = FBM(baseNoise, nx, nz, octaves, lacunarity, persistence);
                let ridged = 1 - Math.abs(FBM(ridgeNoise, nx * 1.5, nz * 1.5, octaves - 2, lacunarity, persistence));
                ridged = ridged * ridged; // Square to sharpen ridges
                
                let e = THREE.MathUtils.lerp(smooth, ridged, terrainRoughness);
                
                // --- 3. Continental Shaping ---
                // Use very low frequency noise to define landmasses vs oceans.
                let continent = FBM(baseNoise, nx * 0.2, nz * 0.2, 3, 2.0, 0.6);
                e = (e + continent) / 2; // Blend base elevation with continental shapes

                // --- 4. Final Height Calculation ---
                // Normalize and apply scale
                let finalHeight = e * heightScale;
                vertices[i + 1] = finalHeight;

                // --- 5. Climate & Biome Calculation ---
                let elevationNormalized = (e + 1) / 2; // Normalize elevation to 0-1
                
                // Temp decreases with height
                let temp = (FBM(tempNoise, nx * 0.5, nz * 0.5, 4, 2.0, 0.6) + 1) / 2;
                temp = THREE.MathUtils.clamp(temp + globalTemp - (elevationNormalized * 0.6), 0, 1);
                
                // Humidity
                let humid = (FBM(humidNoise, nx * 0.7, nz * 0.7, 4, 2.0, 0.5) + 1) / 2;
                humid = THREE.MathUtils.clamp(humid * (globalHumid * 2), 0, 1);
                
                const biome = getBiome(elevationNormalized, humid, temp);
                biomeStats[biome.name] = (biomeStats[biome.name] || 0) + 1;
                
                // Color with subtle random variation
                const biomeColor = new THREE.Color(biome.color);
                biomeColor.r += (Math.random() - 0.5) * 0.05;
                biomeColor.g += (Math.random() - 0.5) * 0.05;
                biomeColor.b += (Math.random() - 0.5) * 0.05;

                colors.push(biomeColor.r, biomeColor.g, biomeColor.b);
            }

            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();

            // --- Create Terrain Mesh ---
            const material = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.x = -Math.PI / 2;
            terrainMesh.receiveShadow = true;
            terrainMesh.castShadow = true;
            scene.add(terrainMesh);

            // --- Create Water Mesh ---
            const seaHeight = seaLevel * heightScale + SEA_LEVEL_BASE;
            const waterGeometry = new THREE.PlaneGeometry(mapSize, mapSize, 1, 1);
            const waterMaterial = new THREE.MeshPhongMaterial({
                color: 0x4682B4,
                transparent: true,
                opacity: 0.7,
                shininess: 80,
                reflectivity: 0.8
            });
            waterMesh = new THREE.Mesh(waterGeometry, waterMaterial);
            waterMesh.rotation.x = -Math.PI / 2;
            waterMesh.position.y = seaHeight;
            waterMesh.receiveShadow = true;
            scene.add(waterMesh);

            // --- Store data for export ---
            worldData = {
                vertices: geometry.attributes.position.array,
                colors: colors,
                indices: geometry.index.array,
                resolution: resolution,
                biomeStats: biomeStats
            };

            updateTerrainStats();
            updateBiomeLegend(biomeStats);
            
            progressText.textContent = `Done!`;
            setTimeout(() => {
                progressContainer.style.opacity = '0';
                generateBtn.textContent = '🚀 GENERATE WORLD';
                generateBtn.disabled = false;
                downloadBtn.disabled = false;
                isGenerating = false;
            }, 1000);
        }

        function updateTerrainStats() {
            if (!worldData) return;
            
            const totalCells = worldData.resolution * worldData.resolution;
            const totalVertices = worldData.vertices.length / 3;
            const totalFaces = worldData.indices.length / 3;
            
            let minHeight = Infinity, maxHeight = -Infinity, avgHeight = 0;
            for (let i = 1; i < worldData.vertices.length; i += 3) {
                const h = worldData.vertices[i];
                minHeight = Math.min(minHeight, h);
                maxHeight = Math.max(maxHeight, h);
                avgHeight += h;
            }
            avgHeight /= totalVertices;

            let statsHtml = `
                <div style="font-size: 0.9rem; line-height: 1.8;">
                    <div style="color: #4ecdc4; font-weight: bold; margin-bottom: 10px;">WORLD METRICS</div>
                    Resolution: ${worldData.resolution}×${worldData.resolution}<br>
                    Vertices: ${totalVertices.toLocaleString()}<br>
                    Triangles: ${totalFaces.toLocaleString()}<br>
                    Min Height: ${minHeight.toFixed(1)}m<br>
                    Max Height: ${maxHeight.toFixed(1)}m<br>
                    Avg Height: ${avgHeight.toFixed(1)}m<br>
                    <br>
                    <div style="color: #4ecdc4; font-weight: bold; margin-bottom: 10px;">BIOME COVERAGE</div>
            `;

            Object.entries(worldData.biomeStats)
                .sort(([,a], [,b]) => b - a)
                .forEach(([biomeName, count]) => {
                    const percentage = ((count / totalCells) * 100).toFixed(1);
                    statsHtml += `${biomeName.padEnd(16, ' ')}: ${percentage}%<br>`;
                });

            statsHtml += `</div>`;
            document.getElementById('terrainStats').innerHTML = statsHtml;
        }
        
        function updateBiomeLegend(biomeStats) {
            const grid = document.getElementById('biomeGrid');
            grid.innerHTML = '';
            for (const biomeKey in BIOMES) {
                const biome = BIOMES[biomeKey];
                 if(biomeStats && !biomeStats[biome.name] && biome.name !== 'Ocean') continue;

                const item = document.createElement('div');
                item.className = 'biome-item';
                const colorDiv = document.createElement('div');
                colorDiv.className = 'biome-color';
                colorDiv.style.background = `#${new THREE.Color(biome.color).getHexString()}`;
                item.appendChild(colorDiv);
                item.appendChild(document.createTextNode(biome.name));
                grid.appendChild(item);
            }
        }


        function downloadPLY() {
            if (!worldData) return;
            
            const vertices = terrainMesh.geometry.attributes.position.array;
            const colors = terrainMesh.geometry.attributes.color.array;
            const indices = terrainMesh.geometry.index.array;
            const normals = terrainMesh.geometry.attributes.normal.array;

            const vertexCount = vertices.length / 3;
            const faceCount = indices.length / 3;

            let plyContent = `ply\nformat ascii 1.0\n`;
            plyContent += `comment Generated by Hyperreal Terrain Generator\n`;
            plyContent += `element vertex ${vertexCount}\n`;
            plyContent += `property float x\nproperty float y\nproperty float z\n`;
            plyContent += `property float nx\nproperty float ny\nproperty float nz\n`;
            plyContent += `property uchar red\nproperty uchar green\nproperty uchar blue\n`;
            plyContent += `element face ${faceCount}\n`;
            plyContent += `property list uchar int vertex_indices\nend_header\n`;
            
            // Vertices
            for (let i = 0; i < vertexCount; i++) {
                const i3 = i * 3;
                const pos = new THREE.Vector3(vertices[i3], vertices[i3 + 1], vertices[i3 + 2]).applyMatrix4(terrainMesh.matrixWorld);
                const norm = new THREE.Vector3(normals[i3], normals[i3 + 1], normals[i3 + 2]).transformDirection(terrainMesh.matrixWorld);
                const r = Math.floor(colors[i3] * 255);
                const g = Math.floor(colors[i3 + 1] * 255);
                const b = Math.floor(colors[i3 + 2] * 255);
                plyContent += `${pos.x.toFixed(4)} ${pos.y.toFixed(4)} ${pos.z.toFixed(4)} ${norm.x.toFixed(6)} ${norm.y.toFixed(6)} ${norm.z.toFixed(6)} ${r} ${g} ${b}\n`;
            }
            
            // Faces
            for (let i = 0; i < faceCount; i++) {
                const i3 = i * 3;
                plyContent += `3 ${indices[i3]} ${indices[i3 + 1]} ${indices[i3 + 2]}\n`;
            }

            const blob = new Blob([plyContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
            const seed = document.getElementById('seed').value;
            a.download = `terrain_seed-${seed}_${timestamp}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // --- Initialize ---
        window.addEventListener('load', () => {
            initThreeJS();
            updateSliderValues();
            updateBiomeLegend();
            
            const sliders = ['heightScale', 'seaLevel', 'terrainRoughness', 'detailScale', 'temperature', 'humidity', 'octaves', 'lacunarity', 'persistence'];
            sliders.forEach(id => {
                document.getElementById(id).addEventListener('input', updateSliderValues);
            });
            
            // Auto-generate on first load
            setTimeout(() => {
                document.getElementById('generateBtn').click();
            }, 500);
        });

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        });
    </script>
</body>
