<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Environment PLY Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #0f0f1a;
            color: #ddd;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #8af;
            text-align: center;
        }
        canvas {
            border: 1px solid #444;
            display: block;
            margin: 0 auto;
            background-color: #000;
        }
        .controls {
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .control-group {
            background-color: #1a1a2a;
            padding: 10px;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8af;
        }
        input, select {
            width: 100%;
            padding: 5px;
            background-color: #252540;
            border: 1px solid #444;
            color: #fff;
            border-radius: 3px;
        }
        button {
            padding: 10px 15px;
            background-color: #4a80b0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #5a90c0;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .preview-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alien Environment PLY Generator</h1>
        
        <div class="preview-container">
            <canvas id="preview" width="600" height="400"></canvas>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="mapWidth">Map Width:</label>
                <input type="number" id="mapWidth" value="64" min="16" max="256">
                
                <label for="mapHeight">Map Height:</label>
                <input type="number" id="mapHeight" value="64" min="16" max="256">
            </div>
            
            <div class="control-group">
                <label for="noiseScale">Noise Scale:</label>
                <input type="range" id="noiseScale" min="1" max="100" value="30">
                
                <label for="iterations">Iterations:</label>
                <input type="number" id="iterations" value="3" min="1" max="10">
            </div>
            
            <div class="control-group">
                <label for="alienFeatures">Alien Features:</label>
                <select id="alienFeatures">
                    <option value="minimal">Minimal</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="extreme">Extreme</option>
                </select>
                
                <label for="seed">Seed (0 for random):</label>
                <input type="number" id="seed" value="0">
            </div>
            
            <div class="control-group">
                <label for="resolution">Resolution:</label>
                <select id="resolution">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>
        
        <div class="buttons">
            <button id="generateBtn">Generate Alien Map</button>
            <button id="downloadBtn" disabled>Download PLY</button>
        </div>
    </div>

    <script>
        // PRNG with seed support
        class PRNG {
            constructor(seed = Math.floor(Math.random() * 10000)) {
                this.seed = seed || Math.floor(Math.random() * 10000);
            }
            
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
            
            // Return value in range [min, max)
            nextRange(min, max) {
                return min + this.next() * (max - min);
            }
            
            // Integer in range [min, max]
            nextInt(min, max) {
                return Math.floor(this.nextRange(min, max + 1));
            }
        }

        // Noise generation function
        function generateNoise(width, height, scale, seed) {
            const prng = new PRNG(seed);
            const noise = new Array(height);
            
            for (let y = 0; y < height; y++) {
                noise[y] = new Array(width);
                for (let x = 0; x < width; x++) {
                    // Simple value noise
                    noise[y][x] = prng.next();
                }
            }
            
            // Smooth the noise
            const smoothedNoise = new Array(height);
            for (let y = 0; y < height; y++) {
                smoothedNoise[y] = new Array(width);
                for (let x = 0; x < width; x++) {
                    let sum = 0;
                    let count = 0;
                    
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                sum += noise[ny][nx];
                                count++;
                            }
                        }
                    }
                    
                    smoothedNoise[y][x] = sum / count;
                }
            }
            
            return smoothedNoise;
        }
        
        // Apply cellular automata to make patterns more alien
        function applyAlienPatterns(heightMap, iterations, alienFactor) {
            const width = heightMap[0].length;
            const height = heightMap.length;
            
            for (let iter = 0; iter < iterations; iter++) {
                const newMap = JSON.parse(JSON.stringify(heightMap));
                
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        let neighbors = 0;
                        let neighborSum = 0;
                        
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                neighborSum += heightMap[y + dy][x + dx];
                                if (heightMap[y + dy][x + dx] > 0.5) neighbors++;
                            }
                        }
                        
                        const neighborAvg = neighborSum / 8;
                        
                        // Apply cellular automata rules for alien patterns
                        if (alienFactor === 'extreme') {
                            // More extreme patterns
                            if (neighbors > 4) {
                                newMap[y][x] = Math.min(1, heightMap[y][x] + 0.3);
                            } else if (neighbors < 3) {
                                newMap[y][x] = Math.max(0, heightMap[y][x] - 0.3);
                            } else {
                                newMap[y][x] = neighborAvg;
                            }
                        } else if (alienFactor === 'moderate') {
                            // Moderate patterns
                            if (neighbors > 4) {
                                newMap[y][x] = Math.min(1, heightMap[y][x] + 0.2);
                            } else if (neighbors < 3) {
                                newMap[y][x] = Math.max(0, heightMap[y][x] - 0.2);
                            }
                        } else {
                            // Minimal patterns
                            if (neighbors > 5) {
                                newMap[y][x] = Math.min(1, heightMap[y][x] + 0.1);
                            } else if (neighbors < 2) {
                                newMap[y][x] = Math.max(0, heightMap[y][x] - 0.1);
                            }
                        }
                    }
                }
                
                heightMap = newMap;
            }
            
            return heightMap;
        }
        
        // Add alien-specific features
        function addAlienFeatures(heightMap, alienFactor, prng) {
            const width = heightMap[0].length;
            const height = heightMap.length;
            
            // Add floating islands
            if (alienFactor !== 'minimal') {
                const islandCount = alienFactor === 'extreme' ? 7 : 3;
                
                for (let i = 0; i < islandCount; i++) {
                    const centerX = prng.nextInt(width * 0.2, width * 0.8);
                    const centerY = prng.nextInt(height * 0.2, height * 0.8);
                    const radius = prng.nextInt(3, width * 0.15);
                    
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const distance = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                            
                            if (distance < radius) {
                                const factor = 1 - (distance / radius);
                                heightMap[y][x] = Math.min(1, heightMap[y][x] + factor * 0.6);
                            }
                        }
                    }
                }
            }
            
            // Add alien crevices
            if (alienFactor === 'extreme') {
                const creviceCount = prng.nextInt(2, 5);
                
                for (let i = 0; i < creviceCount; i++) {
                    const startX = prng.nextInt(0, width - 1);
                    const startY = prng.nextInt(0, height - 1);
                    let curX = startX;
                    let curY = startY;
                    
                    const length = prng.nextInt(width / 4, width / 2);
                    
                    for (let j = 0; j < length; j++) {
                        // Random walk
                        const dx = prng.nextInt(-1, 1);
                        const dy = prng.nextInt(-1, 1);
                        
                        curX = Math.max(1, Math.min(width - 2, curX + dx));
                        curY = Math.max(1, Math.min(height - 2, curY + dy));
                        
                        // Create crevice
                        heightMap[curY][curX] = 0;
                        
                        // Affect surrounding cells
                        for (let sy = -1; sy <= 1; sy++) {
                            for (let sx = -1; sx <= 1; sx++) {
                                if (sx === 0 && sy === 0) continue;
                                
                                const nx = curX + sx;
                                const ny = curY + sy;
                                
                                if (nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1) {
                                    heightMap[ny][nx] = Math.max(0, heightMap[ny][nx] - 0.5);
                                }
                            }
                        }
                    }
                }
            }
            
            return heightMap;
        }
        
        // Create 3D mesh from heightmap
        function createMesh(heightMap, resolution) {
            const width = heightMap[0].length;
            const height = heightMap.length;
            
            // Set resolution factor
            let step = 1;
            if (resolution === 'low') step = 4;
            else if (resolution === 'medium') step = 2;
            
            // Calculate vertices, faces, and colors
            const vertices = [];
            const faces = [];
            const colors = [];
            
            // Generate vertices
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    // Vertex position
                    vertices.push(
                        x - width / 2,          // X
                        heightMap[y][x] * 10,   // Y (height)
                        y - height / 2          // Z
                    );
                    
                    // Vertex color based on height
                    const h = heightMap[y][x];
                    if (h < 0.2) {
                        // Deep terrain - dark purple
                        colors.push(0.2, 0, 0.3);
                    } else if (h < 0.4) {
                        // Medium terrain - blue/purple
                        colors.push(0.1, 0.2, 0.6);
                    } else if (h < 0.6) {
                        // Hills - green/blue
                        colors.push(0, 0.5, 0.5);
                    } else if (h < 0.8) {
                        // Mountains - orange/red
                        colors.push(0.8, 0.4, 0.2);
                    } else {
                        // Peaks - bright yellow/white
                        colors.push(1, 0.9, 0.7);
                    }
                }
            }
            
            // Generate faces
            const vertsPerRow = Math.floor(width / step);
            
            for (let y = 0; y < Math.floor(height / step) - 1; y++) {
                for (let x = 0; x < vertsPerRow - 1; x++) {
                    const topLeft = y * vertsPerRow + x;
                    const topRight = topLeft + 1;
                    const bottomLeft = (y + 1) * vertsPerRow + x;
                    const bottomRight = bottomLeft + 1;
                    
                    // Add two triangles to create a quad
                    faces.push(topLeft, bottomLeft, topRight);
                    faces.push(topRight, bottomLeft, bottomRight);
                }
            }
            
            return { vertices, faces, colors };
        }
        
        // Convert mesh to PLY format
        function generatePLY(mesh) {
            const { vertices, faces, colors } = mesh;
            const vertexCount = vertices.length / 3;
            const faceCount = faces.length / 3;
            
            let plyHeader = `ply
format ascii 1.0
comment Generated by Alien Environment PLY Generator
element vertex ${vertexCount}
property float x
property float y
property float z
property float red
property float green
property float blue
element face ${faceCount}
property list uchar int vertex_indices
end_header
`;
            
            let plyContent = plyHeader;
            
            // Add vertices with colors
            for (let i = 0; i < vertexCount; i++) {
                const vx = vertices[i * 3];
                const vy = vertices[i * 3 + 1];
                const vz = vertices[i * 3 + 2];
                
                const r = colors[i * 3];
                const g = colors[i * 3 + 1];
                const b = colors[i * 3 + 2];
                
                plyContent += `${vx} ${vy} ${vz} ${r} ${g} ${b}\n`;
            }
            
            // Add faces
            for (let i = 0; i < faceCount; i++) {
                const a = faces[i * 3];
                const b = faces[i * 3 + 1];
                const c = faces[i * 3 + 2];
                
                plyContent += `3 ${a} ${b} ${c}\n`;
            }
            
            return plyContent;
        }
        
        // Render heightmap to canvas
        function renderPreview(heightMap) {
            const canvas = document.getElementById('preview');
            const ctx = canvas.getContext('2d');
            const width = heightMap[0].length;
            const height = heightMap.length;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Calculate scale to fit canvas
            const scaleX = canvas.width / width;
            const scaleY = canvas.height / height;
            
            // Draw heightmap
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const h = heightMap[y][x];
                    
                    // Convert height to color
                    let r, g, b;
                    
                    if (h < 0.2) {
                        // Deep terrain - dark purple
                        r = 50; g = 0; b = 80;
                    } else if (h < 0.4) {
                        // Medium terrain - blue/purple
                        r = 30; g = 50; b = 150;
                    } else if (h < 0.6) {
                        // Hills - green/blue
                        r = 0; g = 130; b = 130;
                    } else if (h < 0.8) {
                        // Mountains - orange/red
                        r = 200; g = 100; b = 50;
                    } else {
                        // Peaks - bright yellow/white
                        r = 255; g = 230; b = 180;
                    }
                    
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(x * scaleX, y * scaleY, scaleX, scaleY);
                }
            }
        }
        
        // Main generation function
        function generateAlienMap() {
            // Get parameters from UI
            const mapWidth = parseInt(document.getElementById('mapWidth').value);
            const mapHeight = parseInt(document.getElementById('mapHeight').value);
            const noiseScale = parseInt(document.getElementById('noiseScale').value) / 100;
            const iterations = parseInt(document.getElementById('iterations').value);
            const alienFeatures = document.getElementById('alienFeatures').value;
            const resolution = document.getElementById('resolution').value;
            let seed = parseInt(document.getElementById('seed').value);
            
            if (seed === 0) {
                seed = Math.floor(Math.random() * 10000);
                document.getElementById('seed').value = seed;
            }
            
            const prng = new PRNG(seed);
            
            // Generate base heightmap
            let heightMap = generateNoise(mapWidth, mapHeight, noiseScale, seed);
            
            // Apply cellular automata for alien patterns
            heightMap = applyAlienPatterns(heightMap, iterations, alienFeatures);
            
            // Add alien-specific features
            heightMap = addAlienFeatures(heightMap, alienFeatures, prng);
            
            // Create 3D mesh
            const mesh = createMesh(heightMap, resolution);
            
            // Create PLY content
            const plyContent = generatePLY(mesh);
            
            // Store PLY content for download
            window.plyData = plyContent;
            
            // Render preview
            renderPreview(heightMap);
            
            // Enable download button
            document.getElementById('downloadBtn').disabled = false;
        }
        
        // Download PLY file
        function downloadPLY() {
            if (!window.plyData) return;
            
            const blob = new Blob([window.plyData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `alien_environment_${new Date().getTime()}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Set up event listeners
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('generateBtn').addEventListener('click', generateAlienMap);
            document.getElementById('downloadBtn').addEventListener('click', downloadPLY);
            
            // Generate initial preview
            generateAlienMap();
        });
    </script>
</body>
</html>
