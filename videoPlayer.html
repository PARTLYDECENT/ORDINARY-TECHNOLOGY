<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Video Player v2</title>
    <style>
        :root {
            --primary-glow: #00ffff;
            --secondary-glow: #ff00ff;
            --background-start: #0d0d2b;
            --background-end: #050018;
            --border-color: #00ffff;
            --text-color: #00ffff;
            --button-active-bg: rgba(255, 0, 255, 0.3);
            --button-active-border: #ff00ff;
        }
        body {
            margin: 0;
            background: radial-gradient(circle, var(--background-start), var(--background-end));
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif; /* Assuming Orbitron font is linked elsewhere or system available */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; /* Prevent matrix overflow issues */
        }
        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        button {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            padding: 0.5rem 1rem;
            font-size: 0.9rem; /* Slightly smaller */
            font-family: inherit; /* Use body font */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px var(--primary-glow);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.95) translateY(0);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem); /* Responsive font size */
            text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--secondary-glow);
            text-align: center;
            flex-grow: 1; /* Allow title to take space */
        }
        main {
            width: 95%; /* Slightly wider */
            max-width: 1000px;
            margin-bottom: 20px;
        }
        .video-wrapper { /* Added wrapper for visualizer */
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }
        .video-container {
            width: 100%;
            background: #000;
            border: 4px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }
        .video-container video {
            width: 100%;
            display: block;
            transition: filter 0.5s ease; /* For filter effect */
        }
        .video-container video.alien-vision {
             filter: hue-rotate(120deg) saturate(2.5) contrast(1.2);
        }
        #audioVisualizer { /* Visualizer styles */
            position: absolute;
            bottom: 4px; /* Position above bottom border */
            left: 4px;
            width: calc(100% - 8px);
            height: 50px; /* Adjust height */
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }
        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 8px 12px; /* Adjusted padding */
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .video-title {
            font-size: 1.1rem;
            color: var(--secondary-glow);
            text-shadow: 0 0 5px var(--primary-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .video-counter {
            font-size: 1rem;
            color: var(--secondary-glow);
            white-space: nowrap;
        }
        .control-panel {
            margin-top: 15px; /* Increased margin */
            display: flex;
            flex-direction: column; /* Stack panels */
            align-items: center;
            gap: 15px; /* Space between panels */
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        .video-navigation, .speed-panel, .feature-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px; /* Consistent gap */
            width: 100%;
        }
        .active-button {
            background: var(--button-active-bg);
            border-color: var(--button-active-border);
            box-shadow: 0 0 10px var(--button-active-border);
        }
        .tooltip { /* Simple tooltip for keyboard shortcuts */
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #555;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>
    <header>
        <button class="back-button" onclick="goBack()">BACK</button>
        <h1>ALIEN PLAYER</h1> </header>
    <main>
        <div class="video-wrapper">
            <div class="video-container">
                <video id="cyclicVideo" autoplay loop controls crossorigin="anonymous"></video> </div>
            <canvas id="audioVisualizer"></canvas> </div>
        <div class="video-info">
            <div class="video-title" id="videoTitle">Video 1</div>
            <div class="video-counter">
                <span id="videoCounter">1</span> / <span id="videoTotal">20</span>
            </div>
        </div>
        <div class="control-panel">
            <div class="video-navigation">
                <button id="prevVideo">Prev</button>
                <button id="nextVideo">Next</button>
                <button id="downloadBtn">Download</button>
            </div>
            <div class="speed-panel">
                 Speed: <button data-speed="0.5">0.5x</button>
                <button data-speed="0.75">0.75x</button>
                <button data-speed="1.0" class="active-button">1.0x</button> <button data-speed="1.5">1.5x</button>
                <button data-speed="2.0">2.0x</button>
            </div>
            <div class="feature-panel">
                 Features: <button id="shuffleBtn">Shuffle</button>
                <button id="repeatBtn">Repeat: Off</button>
                <button id="filterBtn">Alien Vision</button>
            </div>
        </div>
    </main>
    <div id="keyboardTooltip" class="tooltip">Space: Play/Pause | ←/→: Prev/Next | S: Shuffle | R: Repeat | F: Filter</div>

    <script>
        // --- Matrix Background ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        const matrixFontSize = 16;
        const matrixColumns = matrixCanvas.width / matrixFontSize;
        const matrixDrops = Array(Math.floor(matrixColumns)).fill(1);

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#00ff00'; // Green matrix color
            matrixCtx.font = matrixFontSize + 'px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = String.fromCharCode(Math.random() * 128);
                matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 50); // Adjusted speed slightly

        // --- Video Player Setup ---
        const videoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`); // Ensure you have 20 videos or adjust length
        let originalVideoOrder = [...videoSources]; // Keep original order for unshuffle
        let currentVideoIndex = 0;
        let isShuffled = false;
        let repeatMode = false; // false = off, true = repeat current video

        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const videoTotal = document.getElementById("videoTotal");
        const speedButtons = document.querySelectorAll('.speed-panel button');
        const downloadBtn = document.getElementById("downloadBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const filterBtn = document.getElementById("filterBtn");
        const keyboardTooltip = document.getElementById("keyboardTooltip");

        // --- Audio Visualizer Setup ---
        const visualizerCanvas = document.getElementById('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext;
        let analyser;
        let sourceNode;
        let visualizerAnimationId;
        const numBars = 64; // Number of visualizer bars

        function setupAudioVisualizer() {
            if (audioContext) return; // Already initialized

            try {
                 // Important: Create AudioContext after user interaction (like clicking play or a button)
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = Math.pow(2, 7); // 128 for numBars=64
                sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizerCanvas.height = 50; // Set canvas size
                visualizerCanvas.width = visualizerCanvas.offsetWidth; // Match container width
                drawVisualizer(); // Start drawing
            } catch (e) {
                console.error("Web Audio API setup failed:", e);
                // Hide visualizer if setup fails
                visualizerCanvas.style.display = 'none';
            }
        }

        function drawVisualizer() {
            if (!analyser) return; // Stop if analyser not ready

            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount; // Should be numBars (fftSize/2)
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const barWidth = visualizerCanvas.width / numBars;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height;

                // Gradient color for bars
                const gradient = visualizerCtx.createLinearGradient(0, visualizerCanvas.height, 0, visualizerCanvas.height - barHeight);
                gradient.addColorStop(0, `hsl(${i / numBars * 360}, 100%, 30%)`); // Vary hue, dark base
                gradient.addColorStop(0.6, `hsl(${i / numBars * 360}, 100%, 50%)`); // Brighter mid
                gradient.addColorStop(1, `hsl(${i / numBars * 360}, 100%, 70%)`); // Light top

                visualizerCtx.fillStyle = gradient;
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth - 1, barHeight); // -1 for slight gap
                x += barWidth;
            }
        }

        // Stop visualizer when not needed
        function stopVisualizer() {
             if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
             }
        }

        // --- UI Update Function ---
        function updateUI(playVideo = true) {
            if (currentVideoIndex < 0 || currentVideoIndex >= videoSources.length) {
                 console.error("Invalid video index:", currentVideoIndex);
                 currentVideoIndex = 0; // Reset to first video
            }

            // Update video source and title
            const videoPath = videoSources[currentVideoIndex];
            videoTitle.textContent = `Video ${currentVideoIndex + 1}`; // Simple title for now
            videoCounter.textContent = currentVideoIndex + 1;
            videoTotal.textContent = videoSources.length;

             // Only change src if it's different to avoid unnecessary reloads
             if (cyclicVideo.currentSrc.split('/').pop() !== videoPath.split('/').pop()) {
                 cyclicVideo.src = videoPath;
                 cyclicVideo.load();
             }

            if (playVideo) {
                 cyclicVideo.play().catch(e => console.warn("Autoplay possibly prevented:", e));
                 // Initialize AudioContext on first play attempt after user interaction
                 if (!audioContext && cyclicVideo.readyState >= 2) { // readyState >= 2 means metadata loaded
                     setupAudioVisualizer();
                 } else if (analyser && audioContext.state === 'suspended') {
                      audioContext.resume(); // Resume if suspended
                 }
            }
             // Update active speed button
             speedButtons.forEach(btn => {
                btn.classList.toggle('active-button', parseFloat(btn.dataset.speed) === cyclicVideo.playbackRate);
            });
            // Update shuffle button state
            shuffleBtn.classList.toggle('active-button', isShuffled);
             // Update repeat button state
             repeatBtn.textContent = `Repeat: ${repeatMode ? 'On' : 'Off'}`;
             repeatBtn.classList.toggle('active-button', repeatMode);
             cyclicVideo.loop = repeatMode; // Set video loop property

             // Update filter button state
             filterBtn.classList.toggle('active-button', cyclicVideo.classList.contains('alien-vision'));

        }

        // --- Event Listeners ---

        // Speed control
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                const speed = parseFloat(this.dataset.speed);
                cyclicVideo.playbackRate = speed;
                updateUI(false); // Update buttons without restarting video
            });
        });

        // Navigation buttons
        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI();
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI();
        });

        // Download button
        downloadBtn.addEventListener("click", function() {
            const a = document.createElement('a');
            a.href = videoSources[currentVideoIndex];
            // Extract filename more reliably
            const filename = videoSources[currentVideoIndex].split('/').pop() || `video-${currentVideoIndex + 1}.mp4`;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Shuffle button
         shuffleBtn.addEventListener("click", function() {
            isShuffled = !isShuffled;
            if (isShuffled) {
                // Shuffle the playlist, keeping the current video at index 0
                const currentVideo = videoSources.splice(currentVideoIndex, 1)[0];
                for (let i = videoSources.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [videoSources[i], videoSources[j]] = [videoSources[j], videoSources[i]];
                }
                videoSources.unshift(currentVideo); // Put current video back at the start
                currentVideoIndex = 0; // We are now at index 0 of the shuffled list
            } else {
                 // Restore original order, find where the current video is
                 const currentVideoPath = videoSources[currentVideoIndex];
                 videoSources = [...originalVideoOrder];
                 currentVideoIndex = videoSources.findIndex(src => src === currentVideoPath);
                 if (currentVideoIndex === -1) currentVideoIndex = 0; // Fallback
            }
            updateUI(false); // Update button state
        });

         // Repeat button
         repeatBtn.addEventListener("click", function() {
             repeatMode = !repeatMode;
             updateUI(false); // Update button state and video loop property
         });

        // Filter button
        filterBtn.addEventListener("click", function() {
             cyclicVideo.classList.toggle('alien-vision');
             updateUI(false); // Update button state
        });

        // Video ended listener (for non-repeat playlist advance)
         cyclicVideo.addEventListener('ended', () => {
            if (!repeatMode) { // Only advance if repeat is off
                 currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
                 updateUI();
            }
             // If repeatMode is true, the browser's native loop attribute handles it
         });

         // Start visualizer when video plays (and ensure context is running)
         cyclicVideo.addEventListener('play', () => {
             if (!audioContext) { // Attempt setup if not done yet (e.g., after initial user interaction)
                 setupAudioVisualizer();
             } else if (audioContext.state === 'suspended') {
                 audioContext.resume();
             }
             if (visualizerAnimationId === null && analyser) { // Start drawing if stopped
                drawVisualizer();
             }
         });
         // Stop visualizer when video pauses
         cyclicVideo.addEventListener('pause', stopVisualizer);


        // Back button function
        function goBack() {
            window.history.back();
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
             // Ignore if user is typing in an input field
             if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

             switch (e.code) {
                case 'Space':
                    e.preventDefault(); // Prevent page scroll
                    if (cyclicVideo.paused) {
                        cyclicVideo.play().catch(e => console.warn("Autoplay prevented:", e));
                        if (!audioContext) setupAudioVisualizer(); // Init audio context on manual play
                        else if (audioContext.state === 'suspended') audioContext.resume();
                    } else {
                        cyclicVideo.pause();
                    }
                    break;
                case 'ArrowRight':
                     document.getElementById("nextVideo").click(); // Trigger button click
                    break;
                case 'ArrowLeft':
                     document.getElementById("prevVideo").click(); // Trigger button click
                    break;
                 case 'KeyS':
                     shuffleBtn.click();
                     break;
                 case 'KeyR':
                     repeatBtn.click();
                     break;
                 case 'KeyF':
                     filterBtn.click();
                     break;
                // Add more shortcuts if needed (e.g., volume up/down)
            }
        });

         // Show/Hide Keyboard Tooltip
        let tooltipTimeout;
        function showTooltip() {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.style.opacity = '1';
            tooltipTimeout = setTimeout(() => {
                keyboardTooltip.style.opacity = '0';
            }, 3000); // Hide after 3 seconds
        }
         document.addEventListener('keydown', showTooltip); // Show on any keydown initially
         showTooltip(); // Show once on load

        // Handle window resize
        window.addEventListener('resize', function() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            // Recalculate matrix drops if needed
            const newColumns = matrixCanvas.width / matrixFontSize;
            if (newColumns > matrixDrops.length) {
                 for (let i = matrixDrops.length; i < newColumns; i++) matrixDrops[i] = 1;
            } else {
                 matrixDrops.length = Math.floor(newColumns);
            }

             // Resize visualizer canvas
             if (visualizerCanvas.style.display !== 'none' && audioContext) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
             }
        });

    </script>
</body>
</html>
