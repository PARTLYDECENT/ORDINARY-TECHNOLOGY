<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM Player // 2026 Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* ---===[ Configuration & Theming ]===--- */
        :root {
            /* Primary Colors */
            --hue-primary: 180; /* Cyan */
            --hue-secondary: 280; /* Magenta/Purple */
            --hue-tertiary: 120; /* Green (Matrix) */

            /* Calculated Theme Colors */
            --glow-primary: hsl(var(--hue-primary), 100%, 50%);
            --glow-secondary: hsl(var(--hue-secondary), 100%, 60%);
            --glow-tertiary: hsl(var(--hue-tertiary), 100%, 50%);

            --text-primary: hsl(var(--hue-primary), 100%, 85%);
            --text-secondary: hsl(var(--hue-primary), 50%, 70%);
            --text-muted: hsl(var(--hue-primary), 30%, 50%);

            --bg-deep: #020408;
            --bg-medium: #0a0d14;
            --bg-panel: rgba(10, 13, 20, 0.75); /* Semi-transparent panel bg */
            --blur-panel: 10px;

            --border-color: hsla(var(--hue-primary), 100%, 50%, 0.4);
            --border-active: var(--glow-primary);

            --button-active-bg: hsla(var(--hue-secondary), 100%, 60%, 0.2);
            --button-active-border: var(--glow-secondary);

            --slider-thumb-bg: var(--glow-secondary);
            --slider-track-bg: hsla(var(--hue-primary), 100%, 50%, 0.25);

            /* Layout Variables */
            --padding-base: 15px;
            --panel-width: 280px; /* Playlist width */
            --controls-width: 60px; /* Vertical controls width */
            --header-height: 50px;
            --bottom-panel-height: 140px; /* Adjust as needed for features */
            --transition-speed: 0.35s;
        }

        /* ---===[ Base & Reset ]===--- */
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif; /* Cleaner base font */
            font-weight: 300;
            font-size: 14px;
            min-height: 100vh;
            overflow: hidden; /* Prevent body scroll */
            display: flex; /* Enable flex for layout */
            transition: padding-left var(--transition-speed) ease-in-out,
                        padding-right var(--transition-speed) ease-in-out;
        }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; font-weight: 700; margin: 0; }
        button, select, input { font-family: inherit; font-size: inherit; }

        /* ---===[ Background Effects ]===--- */
        #matrixCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; opacity: 1;
            transition: opacity 0.5s ease;
        }
        #matrixCanvas.hidden { opacity: 0; }

        /* ---===[ Main Layout Structure ]===--- */
        .player-container {
            display: flex;
            flex-direction: column; /* Stack header, video, bottom panel */
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative; /* For absolute positioning inside */
        }

        /* --- Header --- */
        .player-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 var(--padding-base);
            height: var(--header-height);
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            flex-shrink: 0;
            position: relative; z-index: 30; /* Above panels */
        }
        .player-header h1 { font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--text-primary); text-shadow: 0 0 8px var(--glow-primary); letter-spacing: 2px; }
        .header-button { /* Smaller buttons for header */
            background: none; border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; text-transform: uppercase; transition: all 0.2s ease;
        }
        .header-button:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-active); background: rgba(0,0,0,0.3); }
        .header-button.active-button { color: var(--bg-deep); background: var(--glow-secondary); border-color: var(--glow-secondary); box-shadow: 0 0 8px var(--glow-secondary);}

        /* --- Video Area --- */
        .video-area {
            flex-grow: 1; /* Takes remaining vertical space */
            position: relative; /* Context for visualizer */
            display: flex; /* For centering video */
            justify-content: center; align-items: center;
            overflow: hidden; /* Clip visualizer if needed */
            background-color: #000; /* Black background behind video */
        }
        #cyclicVideo {
            display: block;
            max-width: 100%; max-height: 100%; /* Scales within container */
            object-fit: contain;
            transition: filter 0.4s ease;
            z-index: 1; /* Below visualizer */
        }
        /* Filters (remain the same) */
        #cyclicVideo.filter-none { filter: none; } #cyclicVideo.filter-grayscale { filter: grayscale(1); }
        #cyclicVideo.filter-sepia { filter: sepia(1); } #cyclicVideo.filter-invert { filter: invert(1); }
        #cyclicVideo.filter-hue-rotate-90 { filter: hue-rotate(90deg); } #cyclicVideo.filter-hue-rotate-180 { filter: hue-rotate(180deg); }
        #cyclicVideo.filter-contrast-saturate { filter: contrast(1.5) saturate(2); } #cyclicVideo.filter-blur-bright { filter: blur(2px) brightness(1.3); }
        #cyclicVideo.filter-vintage { filter: sepia(0.8) contrast(1.1) brightness(0.9); } #cyclicVideo.filter-xray { filter: invert(1) contrast(1.5) brightness(0.8); }
        #cyclicVideo.filter-saturated-bright { filter: saturate(3) brightness(1.1); }

        #audioVisualizer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; /* Slightly taller */
            pointer-events: none; z-index: 2; opacity: 0.65; transition: opacity 0.3s; mix-blend-mode: screen; /* Blend with video */
        }
        #audioVisualizer.hidden { opacity: 0; }

        /* ---===[ Sliding Panels ]===--- */
        .slide-panel {
            position: fixed; top: 0; height: 100vh;
            background: var(--bg-panel);
            backdrop-filter: blur(var(--blur-panel));
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 100; /* Above main content */
            transition: transform var(--transition-speed) ease-in-out;
            display: flex; flex-direction: column;
        }

        /* Playlist Panel (Left) */
        #playlistPanel {
            left: 0; width: var(--panel-width);
            transform: translateX(-100%);
            border-right: 1px solid var(--border-color);
            padding: var(--padding-base);
            padding-top: calc(var(--header-height) + var(--padding-base)); /* Account for header */
        }
        body.playlist-open #playlistPanel { transform: translateX(0); }
        #playlistPanel h3 { color: var(--glow-secondary); margin-bottom: var(--padding-base); border-bottom: 1px solid var(--button-active-border); padding-bottom: 10px; }
        #playlist { list-style: none; padding: 0; margin: 0; }
        #playlist li { padding: 8px 10px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; color: var(--text-secondary); transition: background-color 0.2s, color 0.2s; border: 1px solid transparent; }
        #playlist li:hover { background-color: hsla(var(--hue-primary), 100%, 50%, 0.1); color: var(--text-primary); }
        #playlist li.playing { background-color: var(--button-active-bg); color: var(--glow-secondary); border-color: var(--button-active-border); font-weight: bold; }
        /* Custom Scrollbar for Playlist */
        #playlistPanel::-webkit-scrollbar { width: 6px; }
        #playlistPanel::-webkit-scrollbar-track { background: transparent; }
        #playlistPanel::-webkit-scrollbar-thumb { background-color: hsla(var(--hue-secondary), 100%, 60%, 0.5); border-radius: 3px; }

        /* Main Controls Panel (Right - Vertical) */
        #mainControlsPanel {
            right: 0; width: var(--controls-width);
            transform: translateX(100%);
            border-left: 1px solid var(--border-color);
            padding: var(--padding-base) 8px;
            padding-top: calc(var(--header-height) + var(--padding-base));
            align-items: center; justify-content: flex-start; gap: 20px;
        }
        body.controls-open #mainControlsPanel { transform: translateX(0); }
        /* Override button styles for vertical bar */
        #mainControlsPanel button { width: 40px; height: 40px; padding: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        #mainControlsPanel .seek-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        #mainControlsPanel #seekBar { width: 8px; height: 150px; /* Adjust height */ writing-mode: bt-lr; /* Vertical */ -webkit-appearance: slider-vertical; appearance: slider-vertical; margin: 10px 0; }
        #mainControlsPanel .time-display { font-size: 0.8rem; flex-direction: column; margin-top: 5px; }
        #mainControlsPanel .volume-control { flex-direction: column; align-items: center; }
        #mainControlsPanel #volumeSlider { width: 8px; height: 80px; writing-mode: bt-lr; -webkit-appearance: slider-vertical; appearance: slider-vertical; margin-top: 8px; }

        /* Feature Controls Panel (Bottom) */
        #featurePanel {
            position: fixed; /* Use fixed for bottom panel */
            bottom: 0; left: 0; width: 100%;
            height: auto; /* Adjust height based on content */
            max-height: var(--bottom-panel-height);
            transform: translateY(100%); /* Start hidden below */
            border-top: 1px solid var(--border-color);
            padding: var(--padding-base);
            align-items: center; justify-content: center; gap: 10px;
            flex-direction: row; /* Arrange rows horizontally */
            flex-wrap: wrap;
            overflow-y: auto; /* Allow scroll if needed */
            z-index: 90; /* Below side panels */
             transition: transform var(--transition-speed) ease-in-out, max-height var(--transition-speed) ease-in-out;
        }
        body.features-open #featurePanel { transform: translateY(0); }
        .feature-group { display: flex; align-items: center; gap: 8px; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 5px; }
        .feature-group label { font-size: 0.8rem; color: var(--text-secondary); margin-right: 5px; }
        .feature-group button, .feature-group select { font-size: 0.8rem; padding: 4px 8px; }

        /* Adjust main content padding when panels are open */
        body.playlist-open .player-container { padding-left: calc(var(--panel-width) + var(--padding-base)); }
        body.controls-open .player-container { padding-right: calc(var(--controls-width) + var(--padding-base)); }
        /* Don't double-pad left on mobile when playlist opens */
        @media (max-width: 768px) { body.playlist-open .player-container { padding-left: var(--padding-base); } }

        /* ---===[ Individual Controls Styling ]===--- */
        .active-button { background: var(--button-active-bg) !important; /* Important to override hover */ border-color: var(--button-active-border) !important; box-shadow: 0 0 10px var(--button-active-border); }

        /* Sliders (Keep basic styles, vertical handled above) */
        input[type="range"] { cursor: pointer; background: var(--slider-track-bg); border-radius: 4px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--slider-thumb-bg); border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px var(--glow-secondary); margin-top: -4px; /* Adjust thumb position */ }
        input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--slider-thumb-bg); border-radius: 50%; cursor: pointer; border: none; box-shadow: 0 0 8px var(--glow-secondary); }


        /* --- Tooltip --- */
        .tooltip { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); color: #ccc; padding: 8px 15px; border-radius: 4px; font-size: 0.8rem; border: 1px solid #555; z-index: 110; opacity: 0; transition: opacity 0.5s; pointer-events: none; white-space: nowrap; }

        /* ---===[ Responsive Design ]===--- */
        @media (max-width: 768px) {
            :root {
                --panel-width: 220px; /* Narrower playlist */
                --controls-width: 0; /* Hide vertical controls bar */
                --bottom-panel-height: auto; /* Allow bottom panel to grow */
                 --header-height: 45px;
                 --padding-base: 10px;
            }
             body { font-size: 13px; }
             body.controls-open .player-container { padding-right: var(--padding-base); } /* Remove right padding */

            /* Make Playlist an Overlay */
             #playlistPanel { width: var(--panel-width); transform: translateX(-100%); }
             body.playlist-open #playlistPanel { transform: translateX(0); }

            /* Hide Desktop Vertical Controls */
             #mainControlsPanel { display: none; }

             /* Restyle Bottom Panel for Mobile Controls */
             #featurePanel {
                 max-height: none; /* Allow full height if needed */
                 flex-direction: column; /* Stack groups vertically */
                 align-items: stretch; /* Stretch groups */
                 padding: 10px;
                 overflow-y: auto;
                 transform: translateY( calc(100% - 40px) ); /* Peek state */
                 height: auto; /* Allow content height */
                 max-height: 50vh; /* Limit max height */
                 border-top: 1px solid var(--border-color);
                 box-shadow: 0 -5px 15px rgba(0,0,0,0.4);
                 background: linear-gradient(to top, var(--bg-panel), rgba(10, 13, 20, 0.9)); /* Gradient */
             }
             #featurePanel::before { /* Add handle bar */
                 content: ''; display: block; width: 50px; height: 5px; background: var(--border-color); border-radius: 3px; margin: 0 auto 10px; opacity: 0.5; flex-shrink: 0; cursor: pointer;
             }
             body.features-open #featurePanel { transform: translateY(0); }
             .feature-group { flex-direction: row; justify-content: center; flex-wrap: wrap; background: none; padding: 0; margin-bottom: 10px; }
             .feature-group label { display: none; } /* Hide labels */

             /* Add Mobile Main Controls to Feature Panel */
             .mobile-main-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; border-bottom: 1px solid var(--control-border); padding-bottom: 15px; }
             .mobile-seek-time { display: flex; align-items: center; gap: 8px; width: 100%; }
             .mobile-seek-time .time-display { font-size: 0.8rem; }
             .mobile-seek-time input[type="range"] { height: 6px; margin: 0; }
             .mobile-play-nav { display: flex; justify-content: space-around; align-items: center; width: 100%; }
             .mobile-play-nav button { font-size: 1.1rem; padding: 8px; width: 45px; height: 45px; }
             .mobile-volume { display: flex; align-items: center; justify-content: center; width: 100%; }
             .mobile-volume button { padding: 4px 8px; }
             .mobile-volume input[type="range"] { height: 6px; max-width: 120px; }

             .tooltip { left: 10px; transform: none; width: calc(100% - 20px); text-align: center; white-space: normal; bottom: 5px; }
        }

    </style>
</head>

<body > <canvas id="matrixCanvas"></canvas>

    <div id="playlistPanel" class="slide-panel">
        <h3>Playlist</h3>
        <ul id="playlist"></ul>
    </div>

    <div class="player-container">
        <header class="player-header">
            <button id="togglePlaylistBtn" class="header-button" title="Toggle Playlist (Tab)">☰</button>
            <h1>AXIOM PLAYER</h1>
            <div> <button id="toggleMatrixBtn" class="header-button" title="Toggle Matrix (G)">Matrix</button>
                 <button id="toggleFeaturesBtn" class="header-button" title="Toggle Features (C)">⚙</button> {/* Added Features Toggle */}
                 <button id="toggleControlsBtn" class="header-button" title="Toggle Controls (V)">Ctrls</button> {/* Added Controls Toggle */}
            </div>
        </header>

        <main class="video-area">
            <div id="videoWrapper" class="video-wrapper"> {/* Renamed for clarity */}
                <video id="cyclicVideo" loop controlslist="nodownload" crossorigin="anonymous" playsinline></video> {/* Added playsinline */}
                <canvas id="audioVisualizer"></canvas>
            </div>
        </main>

        <div id="featurePanel" class="slide-panel">
            <div class="mobile-main-controls"></div>

             <div class="feature-group">
                <label>Speed:</label>
                <button data-speed="0.5">0.5x</button>
                <button data-speed="0.75">0.75x</button>
                <button data-speed="1.0" class="active-button">1.0x</button>
                <button data-speed="1.5">1.5x</button>
                <button data-speed="2.0">2.0x</button>
            </div>
            <div class="feature-group">
                <label for="filterSelect">Filter:</label>
                <select id="filterSelect" title="Video Filter"></select>
            </div>
             <div class="feature-group">
                 <label for="visualizerSelect">Viz:</label>
                 <select id="visualizerSelect" title="Visualizer Style">
                     <option value="bars">Bars</option>
                     <option value="line">Line</option>
                     <option value="off">Off</option>
                 </select>
             </div>
            <div class="feature-group">
                <button id="shuffleBtn" title="Toggle Shuffle (S)">Shuffle</button>
                <button id="repeatBtn" title="Toggle Repeat (R)">Repeat: Off</button>
            </div>
            <div class="feature-group">
                <button id="pipBtn" title="Picture-in-Picture (P)">PiP</button>
                <button id="fullscreenBtn" title="Fullscreen">Full</button>
                <button id="downloadBtn" title="Download Video">DL</button>
            </div>
        </div>

    </div><div id="mainControlsPanel" class="slide-panel">
         <button id="playPauseBtn" title="Play/Pause (Space)">▶</button> {/* Use Icon/Symbol */}
         <button id="prevVideo" title="Previous (←)">«</button>
         <button id="nextVideo" title="Next (→)">»</button>
         <div class="seek-container">
             <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" title="Seek">
             <div class="time-display">
                 <span id="currentTime">0:00</span>
                 <span>/</span>
                 <span id="duration">0:00</span>
             </div>
         </div>
         <div class="volume-control">
             <button id="muteBtn" title="Mute (M)">Vol</button> {/* Replace text w/ Icon? */}
             <input type="range" id="volumeSlider" min="0" max="1" value="1" step="0.01" title="Volume (↑/↓)">
         </div>
    </div>

    <div id="keyboardTooltip" class="tooltip">Loading shortcuts...</div>

    <script>
        // Wrap in IIFE
        (function() {
            "use strict"; // Enforce stricter parsing and error handling

            // ---===[ State Variables & Constants ]===---
            const videoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`); // Ensure paths are correct!
            const filters = [
                { name: 'NONE', class: 'filter-none' }, { name: 'GRAYSCALE', class: 'filter-grayscale' }, { name: 'SEPIA', class: 'filter-sepia' },
                { name: 'INVERT', class: 'filter-invert' }, { name: 'ALIEN', class: 'filter-hue-rotate-90' }, { name: 'PSYCHEDELIC', class: 'filter-hue-rotate-180' },
                { name: 'VIBRANT', class: 'filter-contrast-saturate' }, { name: 'BLURRY', class: 'filter-blur-bright' }, { name: 'VINTAGE', class: 'filter-vintage' },
                { name: 'X-RAY', class: 'filter-xray' }, { name: 'OVERDRIVE', class: 'filter-saturated-bright' }
            ];
            const originalVideoOrder = [...videoSources];
            let currentVideoSources = [...videoSources];
            let currentVideoIndex = 0;
            let audioContext, analyser, sourceNode, gainNode, dataArray, visualizerAnimationId;
            let matrixInterval, matrixColumns, matrixDrops, matrixCtx, matrixCanvas;
            let matrixFontSize = 16;
            let baseMatrixIntervalTime = 50;
            let currentMatrixIntervalTime = baseMatrixIntervalTime;
            let wasPausedBeforeSeek = false;
            let tooltipTimeout;

            // Load persistent states
            let isShuffled = localStorage.getItem('isShuffled') === 'true';
            let repeatMode = localStorage.getItem('repeatMode') === 'true';
            let savedVolume = parseFloat(localStorage.getItem('playerVolume'));
            if (isNaN(savedVolume)) savedVolume = 0.8; // Default volume slightly lower
            let isMuted = localStorage.getItem('isMuted') === 'true';
            let savedFilterIndex = parseInt(localStorage.getItem('filterIndex')) || 0;
            let matrixActive = localStorage.getItem('matrixActive') !== 'false';
            let currentVisualizerStyle = localStorage.getItem('visualizerStyle') || 'bars';
            let currentFilterIndex = (savedFilterIndex >= 0 && savedFilterIndex < filters.length) ? savedFilterIndex : 0;

            // DOM Elements (cache for performance)
            const body = document.body;
            const cyclicVideo = document.getElementById("cyclicVideo");
            const videoTitle = document.getElementById("videoTitle");
            const speedButtons = document.querySelectorAll('#featurePanel button[data-speed]'); // Target feature panel speed buttons
            const downloadBtn = document.getElementById("downloadBtn");
            const shuffleBtn = document.getElementById("shuffleBtn");
            const repeatBtn = document.getElementById("repeatBtn");
            const keyboardTooltip = document.getElementById("keyboardTooltip");
            const filterSelect = document.getElementById("filterSelect");
            const playlistElement = document.getElementById("playlist");
            const togglePlaylistBtn = document.getElementById("togglePlaylistBtn");
            const toggleMatrixBtn = document.getElementById("toggleMatrixBtn");
            const playPauseBtn = document.getElementById('playPauseBtn');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const seekBar = document.getElementById('seekBar');
            const currentTimeDisplay = document.getElementById('currentTime');
            const durationDisplay = document.getElementById('duration');
            const pipBtn = document.getElementById('pipBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const videoWrapper = document.getElementById('videoWrapper'); // Use the wrapper for fullscreen/PiP context
            const visualizerCanvas = document.getElementById('audioVisualizer');
            const visualizerCtx = visualizerCanvas ? visualizerCanvas.getContext('2d') : null;
            const visualizerSelect = document.getElementById('visualizerSelect');
            const mainControlsPanel = document.getElementById('mainControlsPanel'); // Right panel
            const featurePanel = document.getElementById('featurePanel'); // Bottom panel
            const toggleControlsBtn = document.getElementById('toggleControlsBtn'); // Right panel toggle
            const toggleFeaturesBtn = document.getElementById('toggleFeaturesBtn'); // Bottom panel toggle
            matrixCanvas = document.getElementById('matrixCanvas'); // Assign to cached variable
            matrixCtx = matrixCanvas ? matrixCanvas.getContext('2d') : null;

            // ---===[ Initialization ]===---

            function initializePlayer() {
                console.log("Initializing AXIOM Player...");
                setStatus('Initializing...');
                if (!cyclicVideo) { console.error("FATAL: Video element not found!"); return; }

                setupEventListeners();
                setupAudioNodes(); // Setup audio context and nodes early if possible
                populatePlaylist();
                populateFilterSelect();
                applyInitialStates();
                updateUI(false); // Load first video metadata without auto-playing yet
                setupMatrix(); // Setup matrix dimensions
                if (matrixActive) startMatrix(); else stopMatrix(); // Start/stop based on saved state
                updateTooltip(); // Update tooltip text
                setupMobileControls(); // Add mobile controls dynamically
                setStatus('Ready');
                console.log("Player Initialized.");

                 // Attempt to play after a user interaction gesture (best practice)
                 const playOnInteraction = () => {
                     if (cyclicVideo.paused) {
                         cyclicVideo.play().catch(e => console.warn("Autoplay requires user interaction.", e));
                     }
                     // Remove this listener after first interaction
                     document.removeEventListener('click', playOnInteraction);
                     document.removeEventListener('keydown', playOnInteraction);
                 };
                 document.addEventListener('click', playOnInteraction);
                 document.addEventListener('keydown', playOnInteraction);
            }

             // Run initialization when the DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializePlayer);
            } else {
                initializePlayer();
            }


            // ---===[ Core Player Logic ]===---

            function updateUI(playRequest = false) {
                 if (!cyclicVideo) return;
                 // Validate Index
                 if (currentVideoIndex < 0 || currentVideoIndex >= currentVideoSources.length) {
                    currentVideoIndex = 0;
                    if (currentVideoSources.length === 0) { handleEmptyPlaylist(); return; }
                 }

                 const videoPath = currentVideoSources[currentVideoIndex];
                 const videoName = extractVideoName(videoPath);
                 videoTitle.textContent = videoName;

                 const currentVideoFilename = cyclicVideo.currentSrc?.split('/').pop();
                 const nextVideoFilename = videoPath?.split('/').pop();

                 // Load Source if Changed
                 if (!cyclicVideo.currentSrc || currentVideoFilename !== nextVideoFilename) {
                     console.log("Loading:", videoPath);
                     cyclicVideo.src = videoPath;
                     cyclicVideo.load();
                     setStatus(`Loading: ${videoName}`);
                     resetPlaybackUI(); // Reset time/seek while loading
                 }

                 // Apply States
                 setVolume(savedVolume, false); // Apply volume without saving again
                 cyclicVideo.muted = isMuted;
                 cyclicVideo.loop = repeatMode;

                 if (playRequest && cyclicVideo.paused) {
                    playVideo();
                 }

                 updateButtonStates();
                 updatePlaylistHighlight();
                 applyFilterClass();
            }

            function handleEmptyPlaylist() {
                 console.error("Playlist is empty!");
                 videoTitle.textContent = "NO MEDIA LOADED";
                 resetPlaybackUI();
                 playPauseBtn.disabled = true;
                 // Disable other relevant controls
            }

            function resetPlaybackUI() {
                 currentTimeDisplay.textContent = "0:00";
                 durationDisplay.textContent = "0:00";
                 seekBar.value = 0; seekBar.max = 100; seekBar.disabled = true;
            }

            function playVideo() {
                 if (!cyclicVideo) return;
                 const playPromise = cyclicVideo.play();
                 if (playPromise !== undefined) {
                     playPromise.then(() => {
                         // Play started
                         if (audioContext && audioContext.state === 'suspended') {
                            audioContext.resume().catch(e => console.error("AudioContext resume failed:", e));
                         }
                         if (currentVisualizerStyle !== 'off' && !visualizerAnimationId) drawVisualizer();
                         playPauseBtn.textContent = "❚❚"; // Pause symbol
                         playPauseBtn.title = "Pause (Space)";
                         setStatus(`Playing: ${extractVideoName(cyclicVideo.currentSrc)}`);
                     }).catch(error => {
                         console.warn("Playback initiation failed:", error);
                         // Show play button again if it failed
                         playPauseBtn.textContent = "▶";
                         playPauseBtn.title = "Play (Space)";
                         setStatus(`Playback Error. Interaction Needed?`);
                     });
                 }
            }

            function pauseVideo() {
                 if (cyclicVideo) {
                     cyclicVideo.pause();
                     playPauseBtn.textContent = "▶"; // Play symbol
                     playPauseBtn.title = "Play (Space)";
                     stopVisualizer();
                     setStatus('Paused');
                 }
            }

            function togglePlayPause() {
                 if (!cyclicVideo || currentVideoSources.length === 0) return;
                 if (cyclicVideo.paused) { playVideo(); }
                 else { pauseVideo(); }
            }

            function nextTrack() {
                 if (currentVideoSources.length === 0) return;
                 currentVideoIndex = (currentVideoIndex + 1) % currentVideoSources.length;
                 updateUI(true);
            }

            function prevTrack() {
                 if (currentVideoSources.length === 0) return;
                 currentVideoIndex = (currentVideoIndex - 1 + currentVideoSources.length) % currentVideoSources.length;
                 updateUI(true);
            }

            function setPlaybackSpeed(speed) {
                if(cyclicVideo) {
                    cyclicVideo.playbackRate = parseFloat(speed);
                    updateButtonStates();
                }
            }

            // ---===[ Playlist Logic ]===---

            function populatePlaylist() {
                if (!playlistElement) return;
                playlistElement.innerHTML = '';
                currentVideoSources.forEach((src, index) => {
                    const li = document.createElement('li');
                    const displayName = extractVideoName(src, index);
                    li.textContent = displayName;
                    li.title = displayName;
                    li.dataset.index = index;
                    if (index === currentVideoIndex) { li.classList.add('playing'); }
                    li.addEventListener('click', () => {
                        currentVideoIndex = index;
                        updateUI(true); // Play selected video
                        // Optionally close playlist on mobile selection
                        if (window.innerWidth <= 768) {
                             body.classList.remove('playlist-open');
                        }
                    });
                    playlistElement.appendChild(li);
                });
            }

            function updatePlaylistHighlight() { /* ... same as before ... */
                 if (!playlistElement) return;
                 const items = playlistElement.querySelectorAll('li');
                 items.forEach((li, index) => { li.classList.toggle('playing', index === currentVideoIndex); });
                 const activeItem = playlistElement.querySelector('.playing');
                 if (activeItem) { activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            }

            function toggleShuffle(save = true) {
                isShuffled = !isShuffled;
                const currentVideoPath = currentVideoSources[currentVideoIndex];
                if (isShuffled) {
                    currentVideoSources = [...originalVideoOrder];
                    const currentIdxOriginal = currentVideoSources.findIndex(src => src === currentVideoPath);
                    if(currentIdxOriginal !== -1) currentVideoSources.splice(currentIdxOriginal, 1); else currentVideoIndex = 0;
                    // Use non-seeded shuffle for true randomness each time
                    for (let i = currentVideoSources.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [currentVideoSources[i], currentVideoSources[j]] = [currentVideoSources[j], currentVideoSources[i]]; }
                    if(currentIdxOriginal !== -1) currentVideoSources.unshift(currentVideoPath);
                    currentVideoIndex = 0; // Always start at the first item of the shuffled list
                    console.log("Playlist Shuffled");
                } else {
                    currentVideoSources = [...originalVideoOrder];
                    currentVideoIndex = currentVideoSources.findIndex(src => src === currentVideoPath);
                    if (currentVideoIndex === -1) currentVideoIndex = 0;
                    console.log("Playlist Unshuffled");
                }
                 if(save) localStorage.setItem('isShuffled', isShuffled);
                 populatePlaylist();
                 updateButtonStates();
                 updatePlaylistHighlight(); // Update highlight as index might change
            }

            function toggleRepeat(save = true) {
                 repeatMode = !repeatMode;
                 cyclicVideo.loop = repeatMode;
                 if(save) localStorage.setItem('repeatMode', repeatMode);
                 updateButtonStates();
            }

            // ---===[ Controls & UI Logic ]===---

            function setVolume(value, save = true) {
                 savedVolume = Math.max(0, Math.min(1, value)); // Clamp 0-1
                 if (volumeSlider) volumeSlider.value = savedVolume; // Update slider position
                 if (gainNode && audioContext) { // Use GainNode primarily
                     gainNode.gain.linearRampToValueAtTime(savedVolume, audioContext.currentTime + 0.05);
                 } else if (cyclicVideo) {
                     cyclicVideo.volume = savedVolume; // Fallback if GainNode not ready
                 }
                 if (save) localStorage.setItem('playerVolume', savedVolume);
                 // Unmute if user manually sets volume > 0
                 if (savedVolume > 0 && isMuted) {
                     toggleMute(false); // Explicitly call toggleMute to handle UI and state
                 }
                 updateButtonStates(); // Update mute button text/state if needed
            }

             function toggleMute(save = true) {
                 isMuted = !isMuted;
                 if (gainNode && audioContext) { // Mute using GainNode
                     gainNode.gain.linearRampToValueAtTime(isMuted ? 0 : savedVolume, audioContext.currentTime + 0.05);
                 }
                 // Still set video's muted property as backup/indicator
                 if (cyclicVideo) cyclicVideo.muted = isMuted;
                 if (save) localStorage.setItem('isMuted', isMuted);
                 updateButtonStates();
             }

             function handleSeek() {
                 if(cyclicVideo && isFinite(cyclicVideo.duration)) { // Check duration is valid
                    cyclicVideo.currentTime = parseFloat(seekBar.value);
                 }
             }

             function updatePlaybackTime() {
                 if(cyclicVideo && isFinite(cyclicVideo.duration)) {
                    currentTimeDisplay.textContent = formatTime(cyclicVideo.currentTime);
                    durationDisplay.textContent = formatTime(cyclicVideo.duration);
                    // Only update slider if user is not actively dragging it
                    if (!seekBar.matches(':active')) {
                         seekBar.value = cyclicVideo.currentTime;
                    }
                    seekBar.max = cyclicVideo.duration;
                    seekBar.disabled = false;
                 } else {
                    // Reset if duration is not valid (e.g., before loading)
                    resetPlaybackUI();
                 }
             }

             function togglePiP() {
                  if (!document.pictureInPictureEnabled || pipBtn.disabled) return;
                  if (!document.pictureInPictureElement) {
                      cyclicVideo.requestPictureInPicture().catch(error => console.error('PiP Error:', error));
                  } else {
                      document.exitPictureInPicture().catch(error => console.error('Exit PiP Error:', error));
                  }
             }

             function toggleFullscreen() {
                  const elem = videoWrapper; // Fullscreen the wrapper
                  try {
                     if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                        const promise = elem.requestFullscreen ? elem.requestFullscreen() : elem.webkitRequestFullscreen ? elem.webkitRequestFullscreen() : elem.msRequestFullscreen ? elem.msRequestFullscreen() : null;
                        if (promise) promise.catch(err => console.error(`Fullscreen request failed: ${err.message}`)); else console.error("Fullscreen API not supported.");
                     } else {
                        const promise = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen ? document.webkitExitFullscreen() : document.msExitFullscreen ? document.msExitFullscreen() : null;
                        if (promise) promise.catch(err => console.error(`Exit Fullscreen failed: ${err.message}`)); else console.error("Exit Fullscreen API not supported.");
                     }
                 } catch (err) { console.error('Fullscreen API error:', err); }
             }

            function setupMobileControls() {
                 // Clone or move controls for mobile view inside featurePanel
                 const mobileControlsContainer = featurePanel.querySelector('.mobile-main-controls');
                 if (!mobileControlsContainer) return;

                 // Seek + Time
                 const seekTime = document.createElement('div');
                 seekTime.className = 'mobile-seek-time';
                 seekTime.appendChild(currentTimeDisplay.cloneNode(true)); // Clone nodes
                 seekTime.appendChild(seekBar.cloneNode(true));
                 seekTime.appendChild(durationDisplay.cloneNode(true));
                 mobileControlsContainer.appendChild(seekTime);

                 // Play + Nav
                 const playNav = document.createElement('div');
                 playNav.className = 'mobile-play-nav';
                 playNav.appendChild(document.getElementById('prevVideo').cloneNode(true));
                 playNav.appendChild(playPauseBtn.cloneNode(true));
                 playNav.appendChild(document.getElementById('nextVideo').cloneNode(true));
                 mobileControlsContainer.appendChild(playNav);

                 // Volume
                 const volume = document.createElement('div');
                 volume.className = 'mobile-volume';
                 volume.appendChild(muteBtn.cloneNode(true));
                 volume.appendChild(volumeSlider.cloneNode(true));
                 mobileControlsContainer.appendChild(volume);

                 // Re-add event listeners to the *cloned* elements
                 setupEventListeners(mobileControlsContainer); // Pass container to scope listeners
            }


            // ---===[ Audio Effects Logic ]===---

            function setupAudioNodes() {
                 // ... (same setup as before, ensures nodes are created) ...
                 if (audioContext || !cyclicVideo) return;
                 try {
                     // ... (AudioContext, Analyser, SourceNode setup) ...
                     audioContext = new (window.AudioContext || window.webkitAudioContext)();
                     sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                     analyser = audioContext.createAnalyser();
                     analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.8;
                     gainNode = audioContext.createGain();
                     distortNode = audioContext.createBiquadFilter();
                     spatialNode = audioContext.createStereoPanner();
                     // Default states
                     distortNode.type = "lowpass"; distortNode.frequency.value = 20000; distortNode.Q.value = 1;
                     spatialNode.pan.value = 0;
                     // Connect chain: Source -> Gain -> Distortion -> Spatial -> Analyser -> Destination
                     sourceNode.connect(gainNode); gainNode.connect(distortNode); distortNode.connect(spatialNode);
                     spatialNode.connect(analyser); analyser.connect(audioContext.destination);
                     // ... (dataArray setup etc) ...
                     const bufferLength = analyser.frequencyBinCount; dataArray = new Uint8Array(bufferLength);
                     applyInitialAudioStates(); // Apply saved states after creation
                     console.log('Audio Nodes Initialized');
                 } catch (e) { console.error("Web Audio API setup failed:", e); /* ... disable buttons ... */ }
             }
             function applyInitialAudioStates() {
                  // Called after nodes are created
                  if (audioContext) {
                      toggleDistortion(isDistortionOn, false);
                      toggleSpatialDrift(isSpatialOn, false);
                      setVolume(savedVolume, false); // Apply saved volume via gain node
                  }
             }
            // toggleDistortion, toggleSpatialDrift... (remain the same as conceptualized)
             function toggleDistortion(forceState, save = true) {
                 if (!audioContext || !distortNode) return;
                 const newState = (forceState !== undefined) ? forceState : !isDistortionOn;
                 const targetFreq = newState ? 800 : 20000; // Low freq for muffle
                 const targetQ = newState ? 6 : 1;
                 distortNode.frequency.linearRampToValueAtTime(targetFreq, audioContext.currentTime + 0.1);
                 distortNode.Q.linearRampToValueAtTime(targetQ, audioContext.currentTime + 0.1);
                 isDistortionOn = newState;
                 if(save) localStorage.setItem('distortionOn', isDistortionOn);
                 updateButtonStates();
             }
             let spatialDriftInterval = null;
             function toggleSpatialDrift(forceState, save = true) {
                 if (!audioContext || !spatialNode) return;
                 const newState = (forceState !== undefined) ? forceState : !isSpatialOn;
                 clearInterval(spatialDriftInterval); // Clear previous interval always
                 spatialDriftInterval = null;
                 if (newState) {
                     let panValue = spatialNode.pan.value; // Start from current value
                     let direction = (Math.random() > 0.5 ? 1 : -1) * 0.015; // Random initial direction/speed
                     spatialDriftInterval = setInterval(() => {
                          panValue += direction;
                          if (panValue > 1.0 || panValue < -1.0) { direction *= -1; panValue = Math.max(-1.0, Math.min(1.0, panValue)); }
                          if(spatialNode?.pan) spatialNode.pan.setTargetAtTime(panValue, audioContext.currentTime, 0.05); // Smoother target setting
                     }, 60);
                 } else {
                     if(spatialNode?.pan) spatialNode.pan.linearRampToValueAtTime(0, audioContext.currentTime + 0.3); // Return to center
                 }
                  isSpatialOn = newState;
                  if(save) localStorage.setItem('spatialOn', isSpatialOn);
                  updateButtonStates();
             }


            // ---===[ Utility Functions ]===---
            function formatTime(seconds) { /* ... same ... */
                 const totalSeconds = Math.max(0, Math.floor(seconds));
                 const minutes = Math.floor(totalSeconds / 60);
                 const secs = totalSeconds % 60;
                 return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
            }
            function extractVideoName(path, indexFallback) {
                 try {
                     let name = path.split('/').pop()?.replace('.mp4', '').replace(/[_-]/g, ' ') || `Track ${indexFallback + 1}`;
                     return name.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
                 } catch { return `Track ${indexFallback + 1}`; }
            }

            // ---===[ Event Listeners Setup ]===---
            function setupEventListeners(scope = document) { // Allow scoping for mobile controls
                 // Use event delegation where possible, or query within scope
                scope.querySelectorAll('#playPauseBtn, .mobile-play-nav button:nth-child(2)').forEach(btn => btn.addEventListener('click', togglePlayPause));
                scope.querySelectorAll('#prevVideo, .mobile-play-nav button:nth-child(1)').forEach(btn => btn.addEventListener('click', prevTrack));
                scope.querySelectorAll('#nextVideo, .mobile-play-nav button:nth-child(3)').forEach(btn => btn.addEventListener('click', nextTrack));
                scope.querySelectorAll('#muteBtn, .mobile-volume button:nth-child(1)').forEach(btn => btn.addEventListener('click', () => toggleMute()));
                scope.querySelectorAll('#volumeSlider, .mobile-volume input[type="range"]').forEach(slider => slider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value))));
                scope.querySelectorAll('#seekBar, .mobile-seek-time input[type="range"]').forEach(bar => {
                    bar.addEventListener('input', handleSeek);
                    // Add seek pause/resume listeners
                    bar.addEventListener('mousedown', () => { wasPausedBeforeSeek = cyclicVideo.paused; if (!wasPausedBeforeSeek) cyclicVideo.pause(); });
                    bar.addEventListener('touchstart', () => { wasPausedBeforeSeek = cyclicVideo.paused; if (!wasPausedBeforeSeek) cyclicVideo.pause(); }); // Touch support
                    bar.addEventListener('mouseup', () => { if (!wasPausedBeforeSeek) cyclicVideo.play(); });
                    bar.addEventListener('touchend', () => { if (!wasPausedBeforeSeek) cyclicVideo.play(); }); // Touch support
                });

                // These controls are likely unique, no need for scope selector unless cloned badly
                if(scope === document) { // Only add these listeners once globally
                    shuffleBtn.addEventListener("click", () => toggleShuffle());
                    repeatBtn.addEventListener("click", () => toggleRepeat());
                    pipBtn.addEventListener("click", togglePiP);
                    fullscreenBtn.addEventListener("click", toggleFullscreen);
                    downloadBtn.addEventListener("click", () => { /* download logic */
                         const videoPath = currentVideoSources[currentVideoIndex]; if (!videoPath) return;
                         const a = document.createElement('a'); a.href = videoPath;
                         a.download = extractVideoName(videoPath, currentVideoIndex) + '.mp4';
                         document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    });
                    filterSelect.addEventListener('change', (e) => {
                        const selectedClass = e.target.value; currentFilterIndex = filters.findIndex(f => f.class === selectedClass);
                        if(currentFilterIndex === -1) currentFilterIndex = 0; localStorage.setItem('filterIndex', currentFilterIndex); applyFilterClass();
                    });
                    visualizerSelect.addEventListener('change', (e) => {
                        currentVisualizerStyle = e.target.value; localStorage.setItem('visualizerStyle', currentVisualizerStyle);
                        visualizerCanvas.style.opacity = currentVisualizerStyle === 'off' ? '0' : '0.65'; // Use opacity
                        if(currentVisualizerStyle !== 'off' && !visualizerAnimationId && !cyclicVideo.paused) drawVisualizer(); else if (currentVisualizerStyle === 'off') stopVisualizer();
                    });
                    speedButtons.forEach(button => button.addEventListener('click', function() { setPlaybackSpeed(this.dataset.speed); }));
                    togglePlaylistBtn.addEventListener('click', () => body.classList.toggle('playlist-open'));
                    toggleMatrixBtn.addEventListener('click', toggleMatrix);
                    toggleControlsBtn.addEventListener('click', () => body.classList.toggle('controls-open'));
                    toggleFeaturesBtn.addEventListener('click', () => body.classList.toggle('features-open'));

                    // Keyboard shortcuts - add new ones
                    document.addEventListener('keydown', handleKeyboard);
                    document.addEventListener('keydown', () => showTooltip()); // Show tooltip on keypress
                    setTimeout(showTooltip, 1500); // Show tooltip on load

                    // Window resize
                    window.addEventListener('resize', () => { setupMatrix(); resizeVisualizer(); });

                    // Video events - Attach only once
                    cyclicVideo.addEventListener('loadedmetadata', () => { updatePlaybackTime(); if (!audioContext) setupAudioNodes(); /* Render markers on load? */ renderMarkers(); });
                    cyclicVideo.addEventListener('timeupdate', updatePlaybackTime);
                    cyclicVideo.addEventListener('play', () => { playPauseBtn.textContent = "❚❚"; if (!audioContext) setupAudioNodes(); else if (audioContext.state === 'suspended') audioContext.resume().catch(e=>console.error(e)); if (currentVisualizerStyle !== 'off' && !visualizerAnimationId) drawVisualizer(); setStatus(`Playing: ${extractVideoName(cyclicVideo.currentSrc)}`); });
                    cyclicVideo.addEventListener('pause', () => { playPauseBtn.textContent = "▶"; stopVisualizer(); setStatus('Paused'); });
                    cyclicVideo.addEventListener('ended', () => { /* ... same ... */ if (!repeatMode) nextTrack(); else playVideo(); });
                    cyclicVideo.addEventListener('error', (e) => { /* ... same error handling ... */ });
                 }
            }

            function handleKeyboard(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
                let handled = true;
                switch (e.code) {
                    case 'Space': playPauseBtn.click(); break;
                    case 'ArrowRight': nextTrack(); break;
                    case 'ArrowLeft': prevTrack(); break;
                    case 'KeyS': shuffleBtn.click(); break;
                    case 'KeyR': repeatBtn.click(); break;
                    // case 'KeyL': addLogMarker(); break; // Log Marker feature removed for now
                    case 'KeyM': muteBtn.click(); break;
                    case 'KeyP': if(!pipBtn.disabled) pipBtn.click(); break;
                    case 'ArrowUp': e.preventDefault(); setVolume(savedVolume + 0.05); break;
                    case 'ArrowDown': e.preventDefault(); setVolume(savedVolume - 0.05); break;
                    // case 'KeyD': distortBtn.click(); break; // Removed distort/spatial/scramble
                    // case 'KeyA': spatialBtn.click(); break;
                    // case 'KeyX': scrambleBtn.click(); break;
                    case 'KeyG': toggleMatrixBtn.click(); break;
                    case 'Tab': e.preventDefault(); togglePlaylistBtn.click(); break;
                    case 'KeyC': toggleFeaturesBtn.click(); break; // Toggle feature panel
                    case 'KeyV': toggleControlsBtn.click(); break; // Toggle main controls panel
                    default: handled = false;
                }
                if (handled) e.preventDefault();
            }

             function updateTooltip() {
                const message = "Keys: [Space] Play/Pause | [←/→] Prev/Next | [S] Shuffle | [R] Repeat | [M] Mute | [P] PiP | [↑/↓] Vol | [G] Matrix | [Tab] Playlist | [C] Features | [V] Controls";
                keyboardTooltip.textContent = message;
            }

            function showTooltip() {
                clearTimeout(tooltipTimeout);
                keyboardTooltip.style.opacity = '1';
                tooltipTimeout = setTimeout(() => { keyboardTooltip.style.opacity = '0'; }, 3500);
            }


            // ---===[ Initial State Application ]===---
            function applyInitialStates() {
                // Apply states loaded from localStorage
                if (isShuffled) { toggleShuffle(false); } // Apply shuffle without saving again
                if (repeatMode) { toggleRepeat(false); } // Apply repeat without saving again
                filterSelect.value = filters[currentFilterIndex]?.class || filters[0].class; // Apply filter select
                applyFilterClass(); // Apply filter CSS
                visualizerSelect.value = currentVisualizerStyle; // Apply viz select
                visualizerCanvas.style.opacity = currentVisualizerStyle === 'off' ? '0' : '0.65';
                pipBtn.disabled = !document.pictureInPictureEnabled; // Disable PiP if not supported
                // Mute/Volume applied in setupAudioNodes or updateUI
            }

            // ---===[ Helper Functions (Placeholder for removed features) ]===---
            function addLogMarker() { console.warn("Log Marker feature not implemented in this version."); showTooltip("Log Marker [L] - Not Active"); }
            function renderMarkers() { /* Clear marker display if feature removed */ if(markersContainer) markersContainer.innerHTML = ''; }
            function toggleDistortion() { console.warn("Audio Distortion feature not implemented in this version."); showTooltip("Muffle [D] - Not Active"); }
            function toggleSpatialDrift() { console.warn("Spatial Drift feature not implemented in this version."); showTooltip("Drift [A] - Not Active"); }
            function toggleScramble() { console.warn("Scramble effect not implemented in this version."); showTooltip("Scramble [X] - Not Active"); }


        })(); // End IIFE

    </script>

</body>
</html>
