<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futura Video Player 2026 Concept</title>
    <style>
        :root {
            --bg-primary: #0a0f1f; /* Deep dark blue */
            --bg-secondary: #101830; /* Slightly lighter blue */
            --accent-primary: #00bcd4; /* Cyan/Teal */
            --accent-secondary: #80deea; /* Lighter Cyan */
            --text-primary: #e0f7fa; /* Very light cyan */
            --text-secondary: #b2ebf2; /* Light cyan */
            --border-color: rgba(0, 188, 212, 0.3);
            --glow-primary: rgba(0, 188, 212, 0.5);
            --glow-secondary: rgba(128, 222, 234, 0.4);
            --button-bg: rgba(0, 188, 212, 0.1);
            --button-hover-bg: rgba(0, 188, 212, 0.25);
            --button-active-bg: rgba(0, 158, 180, 0.3);
            --sidebar-width: 300px; /* Sidebar width */
            --header-height: 60px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap'); /* Example modern font */

        body {
            margin: 0;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif; /* Use a modern font */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scroll */
        }

        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.8; /* Slightly less prominent */
        }

        .player-container {
            display: flex;
            height: calc(100vh - var(--header-height)); /* Full height minus header */
            width: 100vw;
        }

        header {
            width: 100%;
            height: var(--header-height);
            padding: 0 30px; /* More padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            background: rgba(10, 15, 31, 0.5); /* Semi-transparent header */
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        header h1 {
            margin: 0 auto; /* Center title */
            font-size: clamp(1.5rem, 3vw, 1.8rem); /* Slightly smaller, responsive */
            font-weight: 600;
            color: var(--accent-secondary);
            text-shadow: 0 0 10px var(--glow-primary);
            letter-spacing: 1px;
            text-align: center;
        }

        main.content-area {
            flex-grow: 1; /* Takes remaining space */
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Allow scrolling if content overflows */
            height: 100%;
            box-sizing: border-box;
        }

        aside.sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0; /* Prevent shrinking */
            background: rgba(16, 24, 48, 0.6); /* Sidebar background */
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Space between control groups */
            overflow-y: auto; /* Allow sidebar scrolling */
            height: 100%;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px; /* Space below video */
            border-radius: 8px;
            overflow: hidden; /* Clip corners */
             box-shadow: 0 0 20px var(--glow-primary);
             border: 2px solid var(--border-color);
        }

        .video-container video {
            width: 100%;
            display: block;
            background: #000;
            transition: filter 0.4s ease-in-out;
            border-radius: 6px; /* Match wrapper */
        }

        /* --- Filter Classes (Keep as is) --- */
        .video-container video.filter-none { filter: none; }
        .video-container video.filter-grayscale { filter: grayscale(1); }
        .video-container video.filter-sepia { filter: sepia(1); }
        .video-container video.filter-invert { filter: invert(1); }
        .video-container video.filter-hue-rotate-90 { filter: hue-rotate(90deg); }
        .video-container video.filter-hue-rotate-180 { filter: hue-rotate(180deg); }
        .video-container video.filter-contrast-saturate { filter: contrast(1.5) saturate(2); }
        .video-container video.filter-blur-bright { filter: blur(2px) brightness(1.3); }
        .video-container video.filter-vintage { filter: sepia(0.8) contrast(1.1) brightness(0.9); }
        .video-container video.filter-xray { filter: invert(1) contrast(1.5) brightness(0.8); }
        .video-container video.filter-saturated-bright { filter: saturate(3) brightness(1.1); }
        /* --- End Filter Classes --- */


        #audioVisualizer {
            position: absolute;
            bottom: 2px; /* Position inside border */
            left: 2px;
            width: calc(100% - 4px);
            height: 40px; /* Slightly shorter */
            pointer-events: none;
            z-index: 5;
            opacity: 0.65;
            border-bottom-left-radius: 6px;
             border-bottom-right-radius: 6px;
        }

        .video-info-main { /* Info below video in main area */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px; /* Less padding */
        }
        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 15px;
        }
        .video-counter {
            font-size: 1rem;
            color: var(--text-secondary);
            white-space: nowrap;
            background: rgba(0,0,0,0.2);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* --- Sidebar Controls --- */
        .sidebar-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
         .sidebar-section:last-child {
            border-bottom: none;
        }

        .sidebar-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--accent-secondary);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid var(--accent-primary);
            padding-left: 8px;
        }

        .control-grid, .control-flex-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); /* Responsive grid */
            gap: 10px;
        }
         .control-flex-wrap {
            display: flex; /* Use flex for speed buttons */
            flex-wrap: wrap;
         }

        button, .button-like { /* Style buttons and button-like elements */
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            padding: 8px 12px; /* Adjusted padding */
            font-size: 0.85rem;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            display: inline-flex; /* Align icon and text */
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 38px; /* Ensure consistent height */
        }

        button:hover, .button-like:hover {
            background: var(--button-hover-bg);
            border-color: var(--accent-primary);
            color: var(--text-primary);
            box-shadow: 0 0 8px var(--glow-primary);
            transform: translateY(-1px);
        }

        button:active, .button-like:active {
            transform: scale(0.97) translateY(0);
            background: var(--button-active-bg);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
        button.back-button { /* Specific style for header back button */
             padding: 5px 15px;
             font-size: 0.8rem;
        }

        .active-button {
            background: var(--button-active-bg);
            border-color: var(--accent-secondary);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 0 8px var(--glow-secondary), inset 0 0 5px rgba(0,0,0,0.2);
        }

        .filter-control span {
             display: block;
             margin-bottom: 10px;
             font-size: 0.9rem;
             color: var(--text-secondary);
        }
        #currentFilterDisplay {
            font-weight: 600;
            color: var(--accent-secondary);
        }

         /* Tooltip - kept similar */
         .tooltip {
             position: fixed;
             bottom: 10px;
             left: 10px;
             background: rgba(0,0,0,0.8);
             color: #ccc;
             padding: 5px 10px;
             border-radius: 4px;
             font-size: 0.8rem;
             border: 1px solid #555;
             z-index: 100;
             opacity: 0;
             transition: opacity 0.5s;
             pointer-events: none;
         }

         /* Placeholder for Playlist/Details */
         .playlist-placeholder {
             flex-grow: 1; /* Takes remaining space in sidebar */
             border: 1px dashed var(--border-color);
             border-radius: 5px;
             display: flex;
             align-items: center;
             justify-content: center;
             color: var(--text-secondary);
             font-size: 0.9rem;
             min-height: 100px;
             text-align: center;
             padding: 10px;
         }

          /* Responsive Adjustments */
          @media (max-width: 768px) {
             .player-container {
                flex-direction: column;
                height: auto; /* Allow content to determine height */
             }
             aside.sidebar {
                width: 100%;
                height: auto; /* Adjust height */
                max-height: 40vh; /* Limit height */
                border-left: none;
                border-top: 1px solid var(--border-color);
                box-shadow: none;
             }
             main.content-area {
                 height: auto; /* Adjust height */
             }
             header h1 {
                font-size: 1.3rem;
             }
             :root {
                 --sidebar-width: 100%; /* Full width on small screens */
             }
          }

    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <header>
        <button class="back-button" onclick="goBack()">Back</button>
        <h1>Futura Player</h1>
        </header>

    <div class="player-container">
        <main class="content-area">
            <div class="video-wrapper">
                <div class="video-container">
                    <video id="cyclicVideo" autoplay loop controls crossorigin="anonymous"></video>
                </div>
                <canvas id="audioVisualizer"></canvas>
            </div>
            <div class="video-info-main">
                <div class="video-title" id="videoTitle">Video 1</div>
                <div class="video-counter">
                    <span id="videoCounter">1</span> / <span id="videoTotal">20</span>
                </div>
            </div>
             </main>

        <aside class="sidebar">
            <div class="sidebar-section navigation-controls">
                <h3>Navigation</h3>
                <div class="control-grid">
                    <button id="prevVideo">Prev</button>
                    <button id="nextVideo">Next</button>
                    <button id="downloadBtn">Download</button>
                </div>
            </div>

            <div class="sidebar-section speed-controls">
                <h3>Playback Speed</h3>
                <div class="control-flex-wrap">
                    <button data-speed="0.5">0.5x</button>
                    <button data-speed="0.75">0.75x</button>
                    <button data-speed="1.0" class="active-button">1.0x</button>
                    <button data-speed="1.5">1.5x</button>
                    <button data-speed="2.0">2.0x</button>
                </div>
            </div>

            <div class="sidebar-section feature-controls">
                <h3>Features</h3>
                 <div class="control-grid">
                    <button id="shuffleBtn">Shuffle</button>
                    <button id="repeatBtn">Repeat: Off</button>
                </div>
            </div>

             <div class="sidebar-section filter-controls">
                <h3>Video Filter</h3>
                 <div class="filter-control">
                     <button id="filterBtn">Next Filter</button>
                     <span >Current: <strong id="currentFilterDisplay">NONE</strong></span>
                 </div>
            </div>

             <div class="sidebar-section playlist-section">
                 <h3>Playlist / Details</h3>
                 <div class="playlist-placeholder">
                     Playlist or detailed video info could go here.
                 </div>
             </div>

        </aside>
    </div>

    <div id="keyboardTooltip" class="tooltip">Space: Play/Pause | ←/→: Prev/Next | S: Shuffle | R: Repeat | F: Filter</div>

    <script>
        // --- Matrix Background (Keep as is) ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        const matrixFontSize = 14; // Slightly smaller
        let matrixColumns = matrixCanvas.width / matrixFontSize;
        let matrixDrops = Array(Math.floor(matrixColumns)).fill(1);
        let matrixInterval; // Declare interval variable

        function drawMatrix() {
            // Optimization: Check if canvas is visible/valid
             if (!matrixCanvas || matrixCanvas.width === 0 || matrixCanvas.height === 0) return;

            matrixCtx.fillStyle = 'rgba(10, 15, 31, 0.06)'; // Match background blend
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = 'rgba(0, 188, 212, 0.7)'; // Match accent color
            matrixCtx.font = matrixFontSize + 'px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                 if (matrixDrops[i] === undefined) matrixDrops[i] = 1; // Initialize if undefined during resize
                const text = String.fromCharCode(33 + Math.random() * 94); // Printable ASCII range
                matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        function startMatrix() {
            if (matrixInterval) clearInterval(matrixInterval); // Clear existing interval if any
             matrixColumns = matrixCanvas.width / matrixFontSize; // Recalculate columns
             matrixDrops = Array(Math.floor(matrixColumns)).fill(1); // Reset drops
            matrixInterval = setInterval(drawMatrix, 60); // Slightly slower for subtlety
        }
        startMatrix(); // Initial start

        // --- Video Player Setup ---
        // IMPORTANT: Make sure these video paths are correct relative to your HTML file
        const videoSources = Array.from({ length: 20 }, (_, i) => `videos/video${i + 1}.mp4`); // Example: Put videos in a 'videos' subfolder
        let originalVideoOrder = [...videoSources];
        let currentVideoIndex = 0;
        let isShuffled = false;
        let repeatMode = false; // false = off, true = repeat current video

        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const videoTotal = document.getElementById("videoTotal");
        const speedButtons = document.querySelectorAll('.speed-controls button[data-speed]'); // More specific selector
        const downloadBtn = document.getElementById("downloadBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const filterBtn = document.getElementById("filterBtn");
        const keyboardTooltip = document.getElementById("keyboardTooltip");
        const currentFilterDisplay = document.getElementById("currentFilterDisplay");

        // --- Filter Setup (Keep as is) ---
        const filters = [
            { name: 'NONE', class: 'filter-none' },
            { name: 'GRAYSCALE', class: 'filter-grayscale' },
            { name: 'SEPIA', class: 'filter-sepia' },
            { name: 'INVERT', class: 'filter-invert' },
            { name: 'ALIEN', class: 'filter-hue-rotate-90' },
            { name: 'PSYCHEDELIC', class: 'filter-hue-rotate-180' },
            { name: 'VIBRANT', class: 'filter-contrast-saturate' },
            { name: 'BLURRY', class: 'filter-blur-bright' },
            { name: 'VINTAGE', class: 'filter-vintage' },
            { name: 'X-RAY', class: 'filter-xray' },
            { name: 'OVERDRIVE', class: 'filter-saturated-bright' }
        ];
        let currentFilterIndex = 0;

        // --- Audio Visualizer Setup (Mostly unchanged, ensure canvas ID is correct) ---
        const visualizerCanvas = document.getElementById('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext;
        let analyser;
        let sourceNode;
        let visualizerAnimationId;
        const numBars = 64;

        function setupAudioVisualizer() {
            // Prevent re-initialization or errors
            if (audioContext && audioContext.state !== 'closed') {
                // If context exists but source might be disconnected (e.g., after video change)
                 if (!sourceNode || !sourceNode.mediaElement) {
                     try {
                         sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                         sourceNode.connect(analyser);
                         // No need to connect analyser to destination again if already done
                     } catch(e) {
                         console.error("Error reconnecting media element source:", e);
                         return; // Exit if reconnection fails
                     }
                 }
                // Resume if suspended
                 if(audioContext.state === 'suspended') {
                    audioContext.resume().catch(e => console.warn("AudioContext resume failed:", e));
                 }
                 startVisualizerDrawing(); // Ensure drawing loop is running
                return;
            }
             // Only create new context if it doesn't exist or was closed
             if (!audioContext || audioContext.state === 'closed') {
                 try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 128; // 2^7 for 64 bars
                    analyser.smoothingTimeConstant = 0.8; // Smoother transitions
                    sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                    sourceNode.connect(analyser);
                    analyser.connect(audioContext.destination); // Connect analyser output to speakers
                 } catch (e) {
                    console.error("Web Audio API setup failed:", e);
                    visualizerCanvas.style.display = 'none'; // Hide visualizer on failure
                    audioContext = null; // Reset context variable
                    return; // Exit setup
                 }
            }

             visualizerCanvas.height = 40; // Set canvas drawing size
             visualizerCanvas.width = visualizerCanvas.offsetWidth; // Match container width dynamically
            startVisualizerDrawing(); // Start drawing loop
        }


        function drawVisualizer() {
            if (!analyser || !visualizerAnimationId) return; // Stop if analyser not ready or loop stopped

            visualizerAnimationId = requestAnimationFrame(drawVisualizer); // Continue loop

            const bufferLength = analyser.frequencyBinCount; // Should be 64
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const barWidth = (visualizerCanvas.width / numBars) * 0.8; // Slightly thinner bars with gaps
            const gapWidth = (visualizerCanvas.width / numBars) * 0.2;
            let x = gapWidth / 2; // Start with half gap

             const gradient = visualizerCtx.createLinearGradient(0, 0, 0, visualizerCanvas.height);
             gradient.addColorStop(0, 'rgba(0, 188, 212, 0.8)');   // Accent Primary top
             gradient.addColorStop(1, 'rgba(128, 222, 234, 0.6)'); // Accent Secondary bottom

            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height * 0.9; // Max height slightly less than canvas

                visualizerCtx.fillStyle = gradient; // Use gradient
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth, barHeight);

                x += barWidth + gapWidth; // Move to next bar position
            }
        }

        function startVisualizerDrawing() {
             if (!visualizerAnimationId && analyser) { // Only start if not already running
                drawVisualizer(); // Start the animation loop
            }
        }


        function stopVisualizer() {
            if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null; // Reset ID
                 // Optionally clear canvas when stopped
                 // visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            }
        }

         // Ensure AudioContext is resumed by user interaction
         function initAudioContext() {
             if (audioContext && audioContext.state === 'suspended') {
                 audioContext.resume().catch(e => console.warn("Resume failed - user interaction needed?", e));
             } else if (!audioContext) {
                 setupAudioVisualizer(); // Attempt setup if not initialized
             }
         }
         // Add listeners to resume context on interaction (important for autoplay restrictions)
         document.body.addEventListener('click', initAudioContext, { once: true });
         document.body.addEventListener('keydown', initAudioContext, { once: true });


        // --- UI Update Function ---
        function updateUI(playVideo = true) {
            if (currentVideoIndex < 0 || currentVideoIndex >= videoSources.length) {
                console.warn("Video index out of bounds, resetting.", currentVideoIndex);
                currentVideoIndex = 0; // Reset to first video
            }
            const videoPath = videoSources[currentVideoIndex];
            // Extract a cleaner name if possible, otherwise use index
            let displayName = `Video ${currentVideoIndex + 1}`;
            try {
                const pathParts = videoPath.split('/');
                const fileName = pathParts[pathParts.length - 1];
                displayName = fileName.split('.')[0].replace(/_/g, ' ').replace(/video/i, '').trim(); // Basic cleanup
                displayName = displayName || `Video ${currentVideoIndex + 1}`; // Fallback if name is empty after cleanup
            } catch(e) { /* Ignore errors in name extraction */ }

            videoTitle.textContent = displayName;
            videoCounter.textContent = currentVideoIndex + 1;
            videoTotal.textContent = videoSources.length;

             // Only change src if it's actually different
             const currentVideoFilename = cyclicVideo.currentSrc.split('/').pop();
             const nextVideoFilename = videoPath.split('/').pop();
             if (currentVideoFilename !== nextVideoFilename) {
                 console.log("Loading video:", videoPath);
                 cyclicVideo.src = videoPath;
                 cyclicVideo.load(); // Explicitly load the new source
             }


            if (playVideo) {
                 // Attempt to play, handle potential errors
                 const playPromise = cyclicVideo.play();
                 if (playPromise !== undefined) {
                     playPromise.then(() => {
                         // Autoplay started! Ensure visualizer is ready.
                         initAudioContext(); // Resume/Setup audio context on successful play
                         startVisualizerDrawing();
                     }).catch(error => {
                         // Autoplay was prevented.
                         console.warn("Autoplay prevented:", error);
                         // UI might need to indicate that user interaction is needed to play.
                         stopVisualizer(); // Stop visualizer if play fails
                     });
                 }
            }

            // Update Speed Buttons
            speedButtons.forEach(btn => {
                 // Use parseFloat for comparison, ensure playbackRate is a number
                const isActive = parseFloat(btn.dataset.speed) === parseFloat(cyclicVideo.playbackRate.toFixed(2));
                btn.classList.toggle('active-button', isActive);
            });

            // Update Shuffle Button
            shuffleBtn.classList.toggle('active-button', isShuffled);

            // Update Repeat Button
            repeatBtn.textContent = `Repeat: ${repeatMode ? 'On' : 'Off'}`;
            repeatBtn.classList.toggle('active-button', repeatMode);
            cyclicVideo.loop = repeatMode; // Set the video's loop attribute

             // Update Filter Display
             applyFilterClass(); // Ensure correct class is applied
             currentFilterDisplay.textContent = `${filters[currentFilterIndex].name}`; // Update text in sidebar


            // Ensure download button points to the correct source
             downloadBtn.setAttribute('data-download-path', videoPath);
        }

        // --- Apply Filter Function ---
        function applyFilterClass() {
            // Remove all possible filter classes first
            filters.forEach(filter => cyclicVideo.classList.remove(filter.class));
            // Add the current one
            const currentFilter = filters[currentFilterIndex];
            if (currentFilter) { // Check if filter exists
                 cyclicVideo.classList.add(currentFilter.class);
                filterBtn.classList.toggle('active-button', currentFilterIndex !== 0); // Active if not 'NONE'
            } else {
                 console.warn("Current filter index invalid:", currentFilterIndex);
                 cyclicVideo.classList.add(filters[0].class); // Fallback to NONE
                 filterBtn.classList.remove('active-button');
            }
        }

        // --- Cycle Filter Function ---
        function cycleFilter() {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            updateUI(false); // Update display without restarting video playback
        }

        // --- Event Listeners ---
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                cyclicVideo.playbackRate = parseFloat(this.dataset.speed);
                updateUI(false); // Update button states without restarting playback
            });
        });

        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI(); // Load and play previous video
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI(); // Load and play next video
        });

         // Updated Download Button Logic
        downloadBtn.addEventListener("click", function() {
            const path = this.getAttribute('data-download-path'); // Get path from data attribute
            if (!path) {
                 console.error("No download path set for current video.");
                 return; // Exit if no path
             }
            const a = document.createElement('a');
            a.href = path;
            const filename = path.split('/').pop() || `video-${currentVideoIndex + 1}.mp4`; // Generate filename
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });


         shuffleBtn.addEventListener("click", function() {
             isShuffled = !isShuffled;
             const currentVideoPath = videoSources[currentVideoIndex]; // Store current video path *before* shuffling/unshuffling

             if (isShuffled) {
                 // Shuffle the original order, excluding the current video temporarily
                 let playlistToShuffle = originalVideoOrder.filter(src => src !== currentVideoPath);
                 for (let i = playlistToShuffle.length - 1; i > 0; i--) {
                     const j = Math.floor(Math.random() * (i + 1));
                     [playlistToShuffle[i], playlistToShuffle[j]] = [playlistToShuffle[j], playlistToShuffle[i]];
                 }
                 // Put the current video at the beginning of the shuffled list
                 videoSources = [currentVideoPath, ...playlistToShuffle];
                 currentVideoIndex = 0; // Current video is now at index 0
                 console.log("Playlist shuffled.");
             } else {
                 // Restore original order
                 videoSources = [...originalVideoOrder];
                 // Find the index of the current video in the original order
                 currentVideoIndex = videoSources.findIndex(src => src === currentVideoPath);
                 if (currentVideoIndex === -1) currentVideoIndex = 0; // Fallback if not found
                 console.log("Playlist unshuffled.");
             }
             // Update UI but don't automatically play next/prev video
             updateUI(false);
         });

        repeatBtn.addEventListener("click", function() {
            repeatMode = !repeatMode;
            updateUI(false); // Update button state and video loop attribute
        });

        filterBtn.addEventListener("click", cycleFilter); // Use cycle function

        cyclicVideo.addEventListener('ended', () => {
            if (!repeatMode) {
                console.log("Video ended, playing next.");
                currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
                updateUI(); // Load and play next video
            } else {
                 console.log("Video ended, repeating.");
                 // If repeatMode is true, the 'loop' attribute handles playback
                 cyclicVideo.play().catch(e=>console.warn("Repeat play prevented", e)); // Ensure it plays again if paused somehow
            }
        });

        // Handle starting/resuming visualizer on play
         cyclicVideo.addEventListener('play', () => {
             console.log("Video play event");
             initAudioContext(); // Ensure context is ready/resumed
             startVisualizerDrawing(); // Start/Restart drawing loop
         });

        // Stop visualizer on pause or when seeking stops playback
        cyclicVideo.addEventListener('pause', () => {
            console.log("Video pause event");
            stopVisualizer();
         });
        cyclicVideo.addEventListener('seeking', stopVisualizer); // Also stop when seeking
         cyclicVideo.addEventListener('seeked', () => { // Resume after seek if playing
             if (!cyclicVideo.paused) {
                 startVisualizerDrawing();
             }
         });


         // --- Utility Functions ---
        function goBack() { window.history.back(); }

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', (e) => {
            // Ignore shortcuts if typing in an input field
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

            let handled = true; // Assume handled to prevent default browser actions
            console.log("Key pressed:", e.code); // Log key presses

            switch (e.code) {
                case 'Space':
                    e.preventDefault(); // Prevent page scroll
                     if (cyclicVideo.paused) {
                         cyclicVideo.play().catch(e => console.warn("Play prevented by key", e));
                     } else {
                         cyclicVideo.pause();
                     }
                    break;
                case 'ArrowRight':
                    document.getElementById("nextVideo").click();
                    break;
                case 'ArrowLeft':
                    document.getElementById("prevVideo").click();
                    break;
                case 'KeyS': // S for Shuffle
                    shuffleBtn.click();
                    break;
                case 'KeyR': // R for Repeat
                    repeatBtn.click();
                    break;
                case 'KeyF': // F for Filter
                     cycleFilter();
                    break;
                 // Add Volume controls? Mute? Fullscreen?
                 // case 'KeyM': // M for Mute
                 //    cyclicVideo.muted = !cyclicVideo.muted;
                 //    // Add UI indicator for mute state
                 //    console.log("Muted:", cyclicVideo.muted);
                 //    break;
                 // case 'ArrowUp': // Volume Up
                 //    e.preventDefault();
                 //    cyclicVideo.volume = Math.min(1, cyclicVideo.volume + 0.1);
                 //    // Add UI indicator for volume
                 //    console.log("Volume:", cyclicVideo.volume.toFixed(1));
                 //    break;
                 // case 'ArrowDown': // Volume Down
                 //    e.preventDefault();
                 //    cyclicVideo.volume = Math.max(0, cyclicVideo.volume - 0.1);
                 //    // Add UI indicator for volume
                 //    console.log("Volume:", cyclicVideo.volume.toFixed(1));
                 //    break;
                default:
                    handled = false; // Key not mapped to an action
            }

            if (handled) {
                 // Optionally show tooltip on handled keypress
                // showTooltip();
            }
        });

        // --- Tooltip ---
        let tooltipTimeout;
        function showTooltip() {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.style.opacity = '1';
            tooltipTimeout = setTimeout(() => { keyboardTooltip.style.opacity = '0'; }, 3000);
        }
        // Show tooltip briefly on load and on keydown
        document.addEventListener('keydown', showTooltip);
        window.addEventListener('load', () => {
            setTimeout(showTooltip, 500); // Show tooltip shortly after load
        });

        // --- Resize Handling ---
        window.addEventListener('resize', function() {
            // Resize Matrix Canvas
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
             startMatrix(); // Restart matrix effect with new dimensions


            // Resize Visualizer Canvas
            if (visualizerCanvas.style.display !== 'none' && audioContext) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth; // Update drawing width
                // Redrawing will happen automatically via requestAnimationFrame
            }
        });

        // --- Initial Load ---
        // Ensure DOM is fully loaded before running initial UI update
        document.addEventListener('DOMContentLoaded', () => {
             console.log("DOM Loaded. Initializing UI.");
             updateUI(false); // Load first video metadata and set initial states, but don't force autoplay immediately
             applyFilterClass(); // Ensure initial filter state is correct
        });

    </script>
</body>
</html>
