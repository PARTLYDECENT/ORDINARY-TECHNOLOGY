<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIEN PLAYER X2 | 2026 EDITION</title>
    <style>
        :root {
            --main-bg: #050510;
            --accent-neon: #00ffaa;
            --accent-blue: #0088ff;
            --accent-red: #ff3060;
            --text-color: #ffffff;
            --panel-bg: rgba(10, 15, 25, 0.7);
            --glass-bg: rgba(15, 20, 35, 0.4);
            --border-glow: 0 0 8px var(--accent-neon);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-neon) var(--panel-bg);
        }

        body {
            background: var(--main-bg);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        #matrixCanvas, #bgEffects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
            z-index: 100;
            height: 70px;
        }

        .back-button {
            background: linear-gradient(135deg, #111122, #223344);
            color: var(--accent-blue);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 136, 255, 0.5);
            transition: all 0.3s ease;
            text-shadow: 0 0 3px var(--accent-blue);
        }

        .back-button:hover {
            background: linear-gradient(135deg, #223344, #334455);
            box-shadow: 0 0 12px rgba(0, 136, 255, 0.8);
            transform: scale(1.05);
        }

        .main-title {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00ffaa, #00aaff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        .subtitle {
            font-size: 12px;
            color: #ffffff;
            letter-spacing: 3px;
            margin-top: -2px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .header-button {
            background: none;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header-button:hover {
            background: rgba(0, 136, 255, 0.2);
            box-shadow: 0 0 8px rgba(0, 136, 255, 0.5);
        }

        .content-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 255, 170, 0.3);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid rgba(0, 255, 170, 0.2);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-neon);
        }

        .sidebar-controls {
            display: flex;
            gap: 8px;
        }

        .sidebar-controls button {
            background: none;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-controls button:hover {
            background: rgba(0, 255, 170, 0.2);
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
        }

        .track-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style-type: none;
            padding: 5px;
        }

        .track-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(15, 25, 40, 0.6);
            border-radius: 4px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .track-item:hover {
            background: rgba(20, 35, 55, 0.8);
            border-left-color: var(--accent-blue);
        }

        .track-item.active {
            background: rgba(25, 40, 65, 0.8);
            border-left-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
        }

        .track-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .track-duration {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 45px;
            text-align: right;
        }

        .sidebar-footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-top: 1px solid rgba(0, 255, 170, 0.2);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .screen-section {
            min-height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 70vh;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        #cyclicVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.1), rgba(0, 136, 255, 0.1));
            pointer-events: none;
            z-index: 1;
            border: 1px solid rgba(0, 255, 170, 0.3);
            border-radius: 8px;
        }

        .video-corners {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--accent-neon);
            opacity: 0.8;
        }

        .top-left {
            top: 5px;
            left: 5px;
            border-top: 2px solid;
            border-left: 2px solid;
        }

        .top-right {
            top: 5px;
            right: 5px;
            border-top: 2px solid;
            border-right: 2px solid;
        }

        .bottom-left {
            bottom: 5px;
            left: 5px;
            border-bottom: 2px solid;
            border-left: 2px solid;
        }

        .bottom-right {
            bottom: 5px;
            right: 5px;
            border-bottom: 2px solid;
            border-right: 2px solid;
        }

        #audioVisualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            padding: 10px 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 170, 0.2);
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .video-counter {
            background: rgba(0, 10, 20, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--accent-neon);
            box-shadow: 0 0 5px rgba(0, 255, 170, 0.3);
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border-radius: 6px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 170, 0.2);
            margin-bottom: 20px;
        }

        .panel-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 70px;
        }

        .video-navigation {
            display: flex;
            gap: 10px;
        }

        .control-button {
            background: linear-gradient(135deg, #112233, #223344);
            color: var(--text-color);
            border: 1px solid rgba(0, 255, 170, 0.3);
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .control-button:hover {
            background: linear-gradient(135deg, #223344, #334455);
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
            transform: translateY(-2px);
        }

        .control-button.active-button {
            background: linear-gradient(135deg, #004433, #006655);
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.5);
            border-color: var(--accent-neon);
        }

        .icon-button {
            font-size: 16px;
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        .progress-slider {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .progress-value {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-blue));
            border-radius: 3px;
            width: 30%;
        }

        .time-display {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            min-width: 50px;
            text-align: center;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
        }

        .volume-slider {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .volume-value {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--accent-blue);
            border-radius: 2px;
            width: 70%;
        }

        .current-filter-display {
            padding: 4px 8px;
            background: rgba(0, 10, 20, 0.5);
            border-radius: 4px;
            margin-left: 10px;
            font-size: 12px;
            color: var(--accent-neon);
            letter-spacing: 1px;
        }

        .tooltip {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 10, 20, 0.8);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 170, 0.3);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .tooltip:hover {
            opacity: 1;
        }

        .screen-divider {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
            margin: 20px 0;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        /* Second screen section - Advanced Controls */
        .advanced-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .section-card {
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 170, 0.2);
            overflow: hidden;
            transition: all 0.3s;
        }

        .section-card:hover {
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
            transform: translateY(-3px);
        }

        .card-header {
            padding: 10px 15px;
            background: rgba(0, 20, 40, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 170, 0.2);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-neon);
        }

        .card-content {
            padding: 15px;
        }

        .audio-effects {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .effect-button {
            flex: 1 0 calc(33% - 10px);
            min-width: 80px;
            text-align: center;
        }

        .eq-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .eq-slider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .vertical-slider {
            height: 100px;
            width: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .vertical-value {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--accent-blue);
            border-radius: 3px;
        }

        .slider-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }

        .shortcuts-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .shortcut-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .key {
            background: rgba(20, 30, 50, 0.7);
            color: var(--accent-blue);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            min-width: 20px;
            text-align: center;
            border: 1px solid rgba(0, 136, 255, 0.3);
        }

        .key-action {
            font-size: 12px;
        }

        .stream-status {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .status-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .status-value {
            color: var(--accent-neon);
            font-weight: bold;
        }

        .scan-animation {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
            background-size: 200% 100%;
            animation: scanLine 2s linear infinite;
        }

        @keyframes scanLine {
            0% { background-position: -100% 0; }
            100% { background-position: 300% 0; }
        }

        .hologram-effect {
            position: fixed;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 170, 0.03) 0px,
                rgba(0, 136, 255, 0.03) 1px,
                rgba(0, 0, 0, 0) 1px,
                rgba(0, 0, 0, 0) 4px
            );
        }

        .scroll-down-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent-neon);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            opacity: 0.8;
            transition: all 0.3s;
            cursor: pointer;
            z-index: 5;
        }

        .scroll-down-indicator:hover {
            opacity: 1;
            transform: translateX(-50%) translateY(-3px);
        }

        .scroll-arrow {
            font-size: 20px;
            animation: bobUpDown 1.5s ease-in-out infinite;
        }

        @keyframes bobUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            
            .advanced-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="hologram-effect"></div>
    
    <header>
        <button class="back-button" onclick="goBack()">BACK</button>
        <div class="main-title">
            <h1>ALIEN PLAYER X2</h1>
            <div class="subtitle">ULTRA EDITION 2026</div>
        </div>
        <div class="header-controls">
            <button class="header-button" id="settingsBtn">SETTINGS</button>
            <button class="header-button" id="themeBtn">THEME</button>
        </div>
    </header>
    
    <div class="content-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">NEURAL PLAYLIST</div>
                <div class="sidebar-controls">
                    <button id="sortBtn" title="Sort">⇅</button>
                    <button id="filterTracksBtn" title="Filter">⋮</button>
                </div>
            </div>
            <ul class="track-list" id="trackList">
                <!-- Tracks will be added here via JavaScript -->
            </ul>
            <div class="sidebar-footer">
                <span id="totalDuration">00:00:00</span>
                <span id="playlistType">QUANTUM MIX</span>
            </div>
        </aside>
        
        <main>
            <section class="screen-section" id="playerScreen">
                <div class="video-wrapper">
                    <div class="video-container">
                        <video id="cyclicVideo" autoplay loop crossorigin="anonymous"></video>
                        <div class="video-overlay"></div>
                        <div class="video-corners">
                            <div class="corner top-left"></div>
                            <div class="corner top-right"></div>
                            <div class="corner bottom-left"></div>
                            <div class="corner bottom-right"></div>
                        </div>
                    </div>
                    <canvas id="audioVisualizer"></canvas>
                </div>
                
                <div class="video-info">
                    <div class="video-title" id="videoTitle">COSMIC ANOMALY X-42</div>
                    <div class="video-counter">
                        <span id="videoCounter">1</span> / <span id="videoTotal">20</span>
                    </div>
                </div>
                
                <div class="control-panel">
                    <div class="panel-row">
                        <div class="slider-container">
                            <div class="time-display" id="currentTime">00:00</div>
                            <div class="progress-slider" id="progressSlider">
                                <div class="progress-value"></div>
                            </div>
                            <div class="time-display" id="totalTime">05:30</div>
                        </div>
                    </div>
                    
                    <div class="panel-row">
                        <div class="video-navigation">
                            <button class="control-button icon-button" id="prevVideo">⏮</button>
                            <button class="control-button icon-button" id="playPauseBtn">⏯</button>
                            <button class="control-button icon-button" id="nextVideo">⏭</button>
                        </div>
                        
                        <div class="volume-controls">
                            <button class="control-button icon-button" id="muteBtn">🔊</button>
                            <div class="volume-slider" id="volumeSlider">
                                <div class="volume-value"></div>
                            </div>
                        </div>
                        
                        <button class="control-button" id="downloadBtn">⇓ SAVE</button>
                    </div>
                    
                    <div class="panel-row">
                        <div class="panel-label">SPEED:</div>
                        <button class="control-button" data-speed="0.5">0.5x</button>
                        <button class="control-button" data-speed="0.75">0.75x</button>
                        <button class="control-button active-button" data-speed="1.0">1.0x</button>
                        <button class="control-button" data-speed="1.5">1.5x</button>
                        <button class="control-button" data-speed="2.0">2.0x</button>
                    </div>
                    
                    <div class="panel-row">
                        <div class="panel-label">FEATURES:</div>
                        <button class="control-button" id="shuffleBtn">SHUFFLE</button>
                        <button class="control-button" id="repeatBtn">REPEAT: OFF</button>
                        <button class="control-button" id="filterBtn">NEXT FILTER</button>
                        <span id="currentFilterDisplay" class="current-filter-display">QUANTUM FILTER</span>
                    </div>
                </div>
                
                <div class="scroll-down-indicator" id="scrollDown">
                    <span>MORE CONTROLS</span>
                    <span class="scroll-arrow">↓</span>
                </div>
            </section>
            
            <div class="screen-divider"></div>
            
            <section class="screen-section" id="advancedScreen">
                <div class="advanced-section">
                    <div class="section-card">
                        <div class="card-header">
                            <div class="card-title">AUDIO EFFECTS</div>
                            <div class="scan-animation"></div>
                        </div>
                        <div class="card-content">
                            <div class="audio-effects">
                                <button class="control-button effect-button">BASS BOOST</button>
                                <button class="control-button effect-button">TREBLE</button>
                                <button class="control-button effect-button">3D AUDIO</button>
                                <button class="control-button effect-button">REVERB</button>
                                <button class="control-button effect-button">AMPLIFY</button>
                                <button class="control-button effect-button">NORMALIZE</button>
                                <button class="control-button effect-button">NEURAL MIX</button>
                                <button class="control-button effect-button">AI ENHANCE</button>
                                <button class="control-button effect-button">CLARITY+</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section-card">
                        <div class="card-header">
                            <div class="card-title">NEURO EQUALIZER</div>
                            <div class="scan-animation"></div>
                        </div>
                        <div class="card-content">
                            <div class="eq-controls">
                                <div class="eq-slider">
                                    <div class="vertical-slider">
                                        <div class="vertical-value" style="height: 60%;"></div>
                                    </div>
                                    <div class="slider-label">60Hz</div>
                                </div>
                                <div class="eq-slider">
                                    <div class="vertical-slider">
                                        <div class="vertical-value" style="height: 40%;"></div>
                                    </div>
                                    <div class="slider-label">150Hz</div>
                                </div>
                                <div class="eq-slider">
                                    <div class="vertical-slider">
                                        <div class="vertical-value" style="height: 75%;"></div>
                                    </div>
                                    <div class="slider-label">400Hz</div>
                                </div>
                                <div class="eq-slider">
                                    <div class="vertical-slider">
                                        <div class="vertical-value" style="height: 55%;"></div>
                                    </div>




























    <script>
        // --- Matrix Background ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        const matrixFontSize = 16;
        const matrixColumns = matrixCanvas.width / matrixFontSize;
        const matrixDrops = Array(Math.floor(matrixColumns)).fill(1);

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#00ff00'; // Green matrix color
            matrixCtx.font = matrixFontSize + 'px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = String.fromCharCode(Math.random() * 128);
                matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 50); // Adjusted speed slightly

        // --- Video Player Setup ---
        const videoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`); // Ensure you have 20 videos or adjust length
        let originalVideoOrder = [...videoSources]; // Keep original order for unshuffle
        let currentVideoIndex = 0;
        let isShuffled = false;
        let repeatMode = false; // false = off, true = repeat current video

        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const videoTotal = document.getElementById("videoTotal");
        const speedButtons = document.querySelectorAll('.speed-panel button');
        const downloadBtn = document.getElementById("downloadBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const filterBtn = document.getElementById("filterBtn");
        const keyboardTooltip = document.getElementById("keyboardTooltip");
        const currentFilterDisplay = document.getElementById("currentFilterDisplay"); // Get filter display element




































// --- Filter Setup (Expanded to 30+) ---
        const filters = [
            // Original + Variations
            { name: 'NONE', class: 'filter-none' },                     // 1
            { name: 'GRAYSCALE', class: 'filter-grayscale' },          // 2
            { name: 'SEPIA', class: 'filter-sepia' },                   // 3
            { name: 'INVERT', class: 'filter-invert' },                 // 4
            { name: 'ALIEN', class: 'filter-hue-rotate-90' },          // 5 (Original hue-rotate-90)
            { name: 'PSYCHEDELIC', class: 'filter-hue-rotate-180' },    // 6 (Original hue-rotate-180)
            { name: 'VIBRANT', class: 'filter-contrast-saturate' },     // 7 (Original contrast-saturate)
            { name: 'BLURRY', class: 'filter-blur-bright' },           // 8 (Original blur-bright)
            { name: 'VINTAGE', class: 'filter-vintage' },               // 9 (Original vintage)
            { name: 'X-RAY', class: 'filter-xray' },                   // 10 (Original xray)
            { name: 'OVERDRIVE', class: 'filter-saturated-bright' },    // 11 (Original saturated-bright)

            // New Filters
            { name: 'DEEP BLUE', class: 'filter-deep-blue'},           // 12
            { name: 'TOXIC GREEN', class: 'filter-toxic-green'},       // 13
            { name: 'SUNSET', class: 'filter-sunset'},                 // 14
            { name: 'NOIR', class: 'filter-noir'},                     // 15
            { name: 'ARCTIC', class: 'filter-arctic'},                 // 16
            { name: 'GOLDEN HOUR', class: 'filter-golden-hour'},       // 17
            { name: 'DREAMY', class: 'filter-dreamy'},                 // 18
            { name: 'HIGH CONTRAST BW', class: 'filter-high-contrast-bw'},// 19
            { name: 'LOW CONTRAST', class: 'filter-low-contrast'},     // 20
            { name: 'POSTERIZE', class: 'filter-posterize'},           // 21 (Using saturate/contrast approximation)
            { name: 'WASHED OUT', class: 'filter-washed-out'},         // 22
            { name: 'MATRIX', class: 'filter-matrix-effect'},         // 23
            { name: 'INFRARED', class: 'filter-infrared'},             // 24
            { name: 'TECHNICOLOR', class: 'filter-technicolor'},       // 25
            { name: 'MOODY', class: 'filter-moody'},                   // 26
            { name: 'SUBTLE BLUR', class: 'filter-subtle-blur'},       // 27
            { name: 'SHARPEN', class: 'filter-sharpen'},               // 28 (Simulated with contrast)
            { name: 'MAGENTA POP', class: 'filter-magenta-pop'},       // 29
            { name: 'CYAN WASH', class: 'filter-cyan-wash'},           // 30
            { name: 'NEON GLOW', class: 'filter-neon-glow'},           // 31 (Bonus)
        ];
        let currentFilterIndex = 0; // Start with no filter
















        // --- Audio Visualizer Setup ---
        const visualizerCanvas = document.getElementById('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext;
        let analyser;
        let sourceNode;
        let visualizerAnimationId;
        const numBars = 64; // Number of visualizer bars

        function setupAudioVisualizer() {
            if (audioContext) return; // Already initialized

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = Math.pow(2, 7); // 128 for numBars=64
                sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizerCanvas.height = 50; // Set canvas size
                visualizerCanvas.width = visualizerCanvas.offsetWidth; // Match container width
                drawVisualizer(); // Start drawing
            } catch (e) {
                console.error("Web Audio API setup failed:", e);
                visualizerCanvas.style.display = 'none';
            }
        }

        function drawVisualizer() {
            if (!analyser) return; // Stop if analyser not ready

            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const barWidth = visualizerCanvas.width / numBars;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height;
                const hue = (i / numBars) * 360; // Cycle hue across bars
                visualizerCtx.fillStyle = `hsla(${hue}, 100%, 50%, 0.8)`; // Use HSL for easy color cycling
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        function stopVisualizer() {
             if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
             }
        }

        // --- UI Update Function ---
        function updateUI(playVideo = true) {
            if (currentVideoIndex < 0 || currentVideoIndex >= videoSources.length) {
                 console.error("Invalid video index:", currentVideoIndex);
                 currentVideoIndex = 0;
            }
            const videoPath = videoSources[currentVideoIndex];
            videoTitle.textContent = `Video ${currentVideoIndex + 1}`;
            videoCounter.textContent = currentVideoIndex + 1;
            videoTotal.textContent = videoSources.length;

             if (cyclicVideo.currentSrc.split('/').pop() !== videoPath.split('/').pop()) {
                 cyclicVideo.src = videoPath;
                 cyclicVideo.load();
             }

            if (playVideo) {
                 cyclicVideo.play().catch(e => console.warn("Autoplay possibly prevented:", e));
                 if (!audioContext && cyclicVideo.readyState >= 2) {
                     setupAudioVisualizer();
                 } else if (analyser && audioContext.state === 'suspended') {
                      audioContext.resume();
                 }
            }
             speedButtons.forEach(btn => {
                btn.classList.toggle('active-button', parseFloat(btn.dataset.speed) === cyclicVideo.playbackRate);
            });
            shuffleBtn.classList.toggle('active-button', isShuffled);
             repeatBtn.textContent = `Repeat: ${repeatMode ? 'On' : 'Off'}`;
             repeatBtn.classList.toggle('active-button', repeatMode);
             cyclicVideo.loop = repeatMode;

             // Update filter display
             applyFilterClass(); // Ensure correct class is applied
             currentFilterDisplay.textContent = `FILTER: ${filters[currentFilterIndex].name}`;

        }

        // --- Apply Filter Function ---
        function applyFilterClass() {
            // Remove all possible filter classes first
            filters.forEach(filter => cyclicVideo.classList.remove(filter.class));
            // Add the current one
            cyclicVideo.classList.add(filters[currentFilterIndex].class);
             filterBtn.classList.toggle('active-button', currentFilterIndex !== 0); // Active if not 'NONE'
        }

        // --- Cycle Filter Function ---
        function cycleFilter() {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            updateUI(false); // Update display without restarting video
        }

        // --- Event Listeners ---
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                cyclicVideo.playbackRate = parseFloat(this.dataset.speed);
                updateUI(false);
            });
        });

        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI();
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI();
        });

        downloadBtn.addEventListener("click", function() {
            const a = document.createElement('a');
            a.href = videoSources[currentVideoIndex];
            const filename = videoSources[currentVideoIndex].split('/').pop() || `video-${currentVideoIndex + 1}.mp4`;
            a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

         shuffleBtn.addEventListener("click", function() {
            isShuffled = !isShuffled;
            if (isShuffled) {
                const currentVideo = videoSources.splice(currentVideoIndex, 1)[0];
                for (let i = videoSources.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [videoSources[i], videoSources[j]] = [videoSources[j], videoSources[i]];
                }
                videoSources.unshift(currentVideo);
                currentVideoIndex = 0;
            } else {
                 const currentVideoPath = videoSources[currentVideoIndex];
                 videoSources = [...originalVideoOrder];
                 currentVideoIndex = videoSources.findIndex(src => src === currentVideoPath);
                 if (currentVideoIndex === -1) currentVideoIndex = 0;
            }
            updateUI(false);
        });

         repeatBtn.addEventListener("click", function() {
             repeatMode = !repeatMode;
             updateUI(false);
         });

        filterBtn.addEventListener("click", cycleFilter); // Use cycle function

         cyclicVideo.addEventListener('ended', () => {
            if (!repeatMode) {
                 currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
                 updateUI();
            }
         });

         cyclicVideo.addEventListener('play', () => {
             if (!audioContext) { setupAudioVisualizer(); }
             else if (audioContext.state === 'suspended') { audioContext.resume(); }
             if (visualizerAnimationId === null && analyser) { drawVisualizer(); }
         });
         cyclicVideo.addEventListener('pause', stopVisualizer);


        function goBack() { window.history.back(); }

        document.addEventListener('keydown', (e) => {
             if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
             let handled = true; // Assume handled to prevent default if matched
             switch (e.code) {
                case 'Space': cyclicVideo.paused ? cyclicVideo.play() : cyclicVideo.pause(); break;
                case 'ArrowRight': document.getElementById("nextVideo").click(); break;
                case 'ArrowLeft': document.getElementById("prevVideo").click(); break;
                 case 'KeyS': shuffleBtn.click(); break;
                 case 'KeyR': repeatBtn.click(); break;
                 case 'KeyF': cycleFilter(); break; // Use cycle function
                 default: handled = false; // Not handled
            }
             if (handled) e.preventDefault(); // Prevent default actions like page scroll
        });

        let tooltipTimeout;
        function showTooltip() {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.style.opacity = '1';
            tooltipTimeout = setTimeout(() => { keyboardTooltip.style.opacity = '0'; }, 3000);
        }
         document.addEventListener('keydown', showTooltip);
         showTooltip(); // Show on load

        window.addEventListener('resize', function() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const newColumns = matrixCanvas.width / matrixFontSize;
            matrixDrops.length = Math.floor(newColumns);
            for (let i = 0; i < matrixDrops.length; i++) if (matrixDrops[i] === undefined) matrixDrops[i] = 1;

             if (visualizerCanvas.style.display !== 'none' && audioContext) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
             }
        });

        // --- Initial Load ---
        updateUI(); // Load first video and set initial states

    </script>
</body>
</html>
