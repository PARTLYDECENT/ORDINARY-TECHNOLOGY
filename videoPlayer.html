<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Video Player</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #0d0d2b, #050018);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif; /* Assuming Orbitron font is linked elsewhere or system available */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button {
            background: none;
            border: 2px solid #00ffff;
            color: #00ffff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif; /* Inherit font */
        }

        button:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        .video-container {
            width: 100%;
            background: #000;
            border: 4px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            position: relative; /* Needed if elements inside were absolute */
        }

        .video-container video {
            width: 100%;
            display: block;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding: 5px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
        }

        .video-title {
            font-size: 1.2rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #00ffff;
        }

        .video-counter {
            font-size: 1rem;
            color: #ff00ff;
        }

        .control-panel {
            margin-top: 10px;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border: 2px solid #00ffff;
            border-radius: 10px;
        }

        .video-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .speed-panel {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Removed .tracker-marker styles */
        /* Removed .focused-area styles */
        /* Removed .ambient-border styles */

        .active-button {
             /* Style retained for speed buttons */
            background: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
        }
    </style>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>
    <header>
        <button class="back-button" onclick="goBack()">BACK</button>
        <h1>ALIEN VIDEO PLAYER</h1>
    </header>
    <main>
        <div class="video-container">
            <video id="cyclicVideo" autoplay loop controls>
                <source src="video1.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
            </div>
        <div class="video-info">
            <div class="video-title" id="videoTitle">Video 1</div>
            <div class="video-counter">
                <span id="videoCounter">1</span> / 20
            </div>
        </div>
        <div class="control-panel">
            <div class="video-navigation">
                <button id="prevVideo">Previous</button>
                <button id="nextVideo">Next</button>
                <button id="downloadBtn">Download</button>
            </div>
        </div>
        <div class="speed-panel">
            <button data-speed="0.5">0.5x</button>
            <button data-speed="0.75">0.75x</button>
            <button data-speed="1.0" class="active">1.0x</button>
            <button data-speed="1.25">1.25x</button>
            <button data-speed="1.5">1.5x</button>
            <button data-speed="1.75">1.75x</button>
            <button data-speed="2.0">2.0x</button>
        </div>
        <div class="feature-panel">
            </div>
    </main>

    <script>
        // Matrix background
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = String.fromCharCode(Math.random() * 128);
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Video player setup
        const videoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`);
        let currentVideoIndex = 0;
        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const speedButtons = document.querySelectorAll('.speed-panel button');
        const downloadBtn = document.getElementById("downloadBtn");
        // Removed references to feature buttons and flags
        // const trackingBtn = document.getElementById("trackingBtn");
        // const focusModeBtn = document.getElementById("focusModeBtn");
        // const ambientGlowBtn = document.getElementById("ambientGlowBtn");
        const videoContainer = document.querySelector('.video-container');
        // const ambientBorder = document.getElementById('ambientBorder');

        // Removed feature flags
        // let trackingEnabled = false;
        // let focusModeEnabled = false;
        // let ambientGlowEnabled = false;
        // let trackerMarkers = [];
        // let focusedArea = null;

        // Update UI with current video data
        function updateUI() {
            // Update video source and title
            cyclicVideo.src = videoSources[currentVideoIndex];
            cyclicVideo.load();
            cyclicVideo.play().catch(e => console.error("Autoplay prevented:", e)); // Added catch for autoplay

            videoTitle.textContent = `Video ${currentVideoIndex + 1}`;
            videoCounter.textContent = currentVideoIndex + 1;

            // Removed call to clearTrackingMarkers();
        }

        // Initialize
        updateUI();

        // Speed control
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                const speed = parseFloat(this.dataset.speed);
                cyclicVideo.playbackRate = speed;

                // Update active button
                speedButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Navigation buttons
        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI();
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI();
        });

        // Download button
        downloadBtn.addEventListener("click", function() {
            const a = document.createElement('a');
            a.href = videoSources[currentVideoIndex];
            a.download = `video-${currentVideoIndex + 1}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Removed Scene Tracking button listener and related functions
        // Removed generateTrackingMarkers, animateMarker, clearTrackingMarkers

        // Removed Precision Focus button listener and related functions
        // Removed video click listener for focus
        // Removed animateFocusEffect

        // Removed Ambient Edge Glow button listener and related functions
        // Removed setupAmbientGlow, updateAmbientGlow
        // Removed play event listener related to ambient glow

        // Back button function
        function goBack() {
            window.history.back();
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Removed marker repositioning logic
        });

    </script>
</body>
</html>
