<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLOGRAPHIC PLAYER X-4 | REFINED & OPTIMIZED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #01040a;
            --accent-cyan: #00e5ff;
            --accent-blue: #00aaff;
            --accent-magenta: #ff20c5;
            --accent-purple: #cc00ff;
            --text-color: #e0eaff;
            --panel-bg: rgba(5, 12, 25, 0.75);
            --glass-bg: rgba(8, 15, 35, 0.7);
            --border-glow: 0 0 10px 1px var(--accent-cyan), 0 0 18px 3px rgba(0, 229, 255, 0.4);
            --border-glow-blue: 0 0 10px 1px var(--accent-blue), 0 0 18px 3px rgba(0, 170, 255, 0.4);
            --focus-glow: 0 0 0 2px var(--main-bg), 0 0 0 4px var(--accent-blue);
            --border-radius: 6px;
            --transition-speed-fast: 0.2s;
            --transition-speed-med: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) var(--main-bg);
        }
        *::-webkit-scrollbar { width: 10px; }
        *::-webkit-scrollbar-track { background: rgba(5, 10, 20, 0.7); }
        *::-webkit-scrollbar-thumb {
            background-color: var(--accent-cyan);
            border-radius: var(--border-radius);
            border: 1px solid rgba(5, 10, 20, 0.9);
            box-shadow: inset 0 0 3px rgba(0,0,0,0.5), 0 0 5px var(--accent-cyan);
        }
        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent-blue);
            box-shadow: inset 0 0 3px rgba(0,0,0,0.5), 0 0 8px var(--accent-blue);
        }

        body {
            background: var(--main-bg);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }
        
        button:focus-visible, input[type="range"]:focus-visible, [tabindex="0"]:focus-visible {
            outline: none;
            box-shadow: var(--focus-glow);
        }

        /* --- NEW: Lightweight Holographic Grid Background --- */
        #holographic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.25;
            pointer-events: none;
        }
        
        /* --- General Glitch/Flicker Animation --- */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 3px 25px rgba(0, 229, 255, 0.2);
            z-index: 100;
            height: 75px;
            flex-shrink: 0;
        }
        
        .main-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(24px, 3.5vw, 32px);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-magenta), var(--accent-cyan));
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 20px rgba(0, 170, 255, 0.3);
            animation: titleShine 5s linear infinite;
        }
        @keyframes titleShine {
            0% { background-position: 0% center; }
            100% { background-position: -300% center; }
        }

        .subtitle {
            font-size: 13px;
            color: rgba(224, 234, 255, 0.85);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
        }

        .content-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-right: 2px solid rgba(0, 229, 255, 0.4);
            box-shadow: 3px 0 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
            letter-spacing: 1px;
            padding: 18px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
        }

        .track-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style-type: none;
            padding: 12px 8px 12px 12px;
        }

        .track-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(10, 20, 35, 0.8);
            border-radius: var(--border-radius);
            border-left: 5px solid transparent;
            cursor: pointer;
            transition: all var(--transition-speed-fast) ease-out;
            position: relative;
            overflow: hidden;
        }
        .track-item:hover, .track-item:focus-visible {
            background: rgba(20, 35, 60, 0.95);
            border-left-color: var(--accent-blue);
            transform: translateX(5px) scale(1.02);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
        }
         .track-item.active {
            background: rgba(0, 60, 100, 0.95);
            border-left-color: var(--accent-cyan);
            box-shadow: inset 4px 0 10px rgba(0, 229, 255, 0.4), var(--border-glow);
            color: var(--accent-cyan);
            font-weight: 700;
            transform: scale(1.03);
        }
        .track-item.active .track-duration,
        .track-item.active .track-name {
            color: var(--accent-cyan);
            font-weight: 700;
            text-shadow: 0 0 5px var(--accent-cyan);
        }
        
        .track-name {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        #playerScreen {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px 35px;
            min-height: 0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            max-height: calc(100vh - 300px);
            margin: 0 auto 25px auto;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.5), 0 0 15px rgba(0,0,0,0.6);
            border-radius: var(--border-radius);
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        #cyclicVideo {
            display: block;
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
            border-radius: var(--border-radius);
            transition: filter 0.3s ease;
        }
        
        /* --- NEW: Scanline Overlay for Holographic Effect --- */
        .video-scanline-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            background: repeating-linear-gradient(
                0deg,
                rgba(10, 20, 40, 0.1),
                rgba(10, 20, 40, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.5;
            animation: scanline-scroll 8s linear infinite;
        }
        @keyframes scanline-scroll {
            from { background-position-y: 0; }
            to { background-position-y: 100px; }
        }

        #audioVisualizer {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 80px; /* Increased height */
            z-index: 3;
            mix-blend-mode: lighten;
            opacity: 0.85;
            pointer-events: none;
        }
        
        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 20px auto;
            padding: 12px 18px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 229, 255, 0.3);
            max-width: 1000px;
            width: calc(100% - 40px);
        }
        
        .video-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
        }
        
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 18px 25px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            margin: 0 auto;
            max-width: 1000px;
            width: calc(100% - 40px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .panel-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        
        .control-button {
            background: linear-gradient(145deg, #18202b, #2a3545);
            color: var(--text-color);
            border: 2px solid rgba(180, 190, 210, 0.4);
            padding: 10px 18px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-speed-fast) ease-out;
            text-transform: uppercase;
        }
        .control-button:hover, .control-button:focus-visible {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.5);
            transform: translateY(-2px) scale(1.03);
            color: var(--accent-blue);
        }
        .control-button.active-button {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            box-shadow: var(--border-glow), inset 0 0 8px rgba(0,0,0,0.4);
            border-color: var(--accent-cyan);
            color: var(--main-bg);
            font-weight: 900;
        }

        .icon-button {
            font-size: 20px;
            width: 44px; height: 44px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #playPauseBtn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--main-bg);
            border-color: var(--accent-cyan);
            font-size: 22px;
            box-shadow: var(--border-glow);
        }
        #playPauseBtn:hover, #playPauseBtn:focus-visible {
            box-shadow: 0 0 18px var(--accent-cyan), 0 0 25px var(--accent-blue);
            transform: scale(1.1);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            transition: all var(--transition-speed-fast) ease;
        }
        input[type="range"]:hover, input[type="range"]:focus-visible {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px; height: 20px;
            background: var(--accent-cyan);
            border-radius: 50%;
            border: 3px solid var(--main-bg);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
            transition: all var(--transition-speed-fast) ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.9);
            transform: scale(1.15);
        }
        input[type="range"]::-moz-range-thumb {
             width: 18px; height: 18px;
            background: var(--accent-cyan);
            border-radius: 50%;
            border: 3px solid var(--main-bg);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
        }

        .tooltip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--main-bg);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            z-index: 200;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            opacity: 0;
            transition: opacity var(--transition-speed-med) ease, transform var(--transition-speed-med) ease;
            pointer-events: none;
        }
        .tooltip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Filter CSS Classes (Unchanged, kept for functionality) */
        .video-container video.filter-none { filter: none; }
        .video-container video.filter-grayscale { filter: grayscale(1); }
        .video-container video.filter-sepia { filter: sepia(1); }
        .video-container video.filter-invert { filter: invert(1); }
        .video-container video.filter-hue-rotate-90 { filter: hue-rotate(90deg); }
        .video-container video.filter-matrix-effect { filter: grayscale(1) contrast(1.5) brightness(0.7) hue-rotate(120deg); }
        .video-container video.filter-neon-glow { filter: brightness(1.5) contrast(1.4) saturate(3) drop-shadow(0 0 5px var(--accent-cyan)); }
        
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); position: absolute; height: 100%; }
            .sidebar.open { transform: translateX(0); }
        }
        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .sidebar {
                width: 100%; height: 45vh;
                position: relative; transform: translateX(0);
                border-right: none;
                border-bottom: 2px solid rgba(0, 229, 255, 0.5);
            }
            main { height: 55vh; }
            #playerScreen { padding: 15px; }
            .video-wrapper { max-height: calc(55vh - 200px); }
        }
    </style>
</head>
<body>
    <canvas id="holographic-bg"></canvas>

    <header>
        <div class="main-title">
            <h1>HOLOGRAPHIC PLAYER X-4</h1>
            <div class="subtitle">REFINED & OPTIMIZED</div>
        </div>
        <div style="width: 80px;"></div> 
    </header>

    <div class="content-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">DATASTREAM PLAYLIST</div>
            <ul class="track-list" id="trackList">
                </ul>
        </aside>

        <main id="mainContentArea">
            <section id="playerScreen">
                <div class="video-wrapper" id="videoWrapper">
                    <div class="video-container" id="videoContainer">
                        <video id="cyclicVideo" loop crossorigin="anonymous"></video>
                        <div class="video-scanline-overlay"></div>
                        <canvas id="audioVisualizer"></canvas>
                    </div>
                </div>

                <div class="video-info">
                    <div class="video-title" id="videoTitle">AWAITING SIGNAL...</div>
                </div>

                <div class="control-panel">
                    <div class="panel-row">
                        <div class="slider-container">
                            <div class="time-display" id="currentTime">00:00</div>
                            <input type="range" id="progressSliderInput" value="0" step="0.1" min="0" max="100" aria-label="Video progress">
                            <div class="time-display" id="totalTime">00:00</div>
                        </div>
                    </div>
                    <div class="panel-row">
                        <button class="control-button icon-button" id="prevVideo" title="Previous (←)">⏮</button>
                        <button class="control-button icon-button" id="playPauseBtn" title="Play/Pause (Space)" aria-label="Play">▶</button>
                        <button class="control-button icon-button" id="nextVideo" title="Next (→)">⏭</button>
                        <div class="volume-controls" style="display:flex; align-items:center; gap:10px;">
                            <button class="control-button icon-button" id="muteBtn" title="Mute (M)">🔊</button>
                            <input type="range" id="volumeSliderInput" value="70" step="1" min="0" max="100" aria-label="Volume">
                        </div>
                        <button class="control-button" id="filterBtn" title="Next Filter (F)">FILTER</button>
                        <button class="control-button icon-button" id="fullscreenBtn" title="Fullscreen (U)">⛶</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="tooltip" id="keyboardTooltip"></div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log("Holographic Player X-4 Initializing...");

        // --- Element Cache ---
        const getEl = id => document.getElementById(id);
        const cyclicVideo = getEl("cyclicVideo");
        const videoContainer = getEl("videoContainer");
        const videoTitle = getEl("videoTitle");
        const trackListEl = getEl("trackList");
        const playPauseBtn = getEl("playPauseBtn");
        const prevBtn = getEl("prevVideo");
        const nextBtn = getEl("nextVideo");
        const filterBtn = getEl("filterBtn");
        const fullscreenBtn = getEl("fullscreenBtn");
        const currentTimeEl = getEl("currentTime");
        const totalTimeEl = getEl("totalTime");
        const progressSliderInput = getEl("progressSliderInput");
        const volumeSliderInput = getEl("volumeSliderInput");
        const muteBtn = getEl("muteBtn");
        const keyboardTooltip = getEl("keyboardTooltip");

        // --- Player State ---
        const videoSources = Array.from({ length: 15 }, (_, i) => `https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4?i=${i + 1}`); // Placeholder URLs
        let currentVideoIndex = 0;
        let isSeeking = false;
        
        const filters = [
            { name: 'NONE', class: 'filter-none' },
            { name: 'GRAYSCALE', class: 'filter-grayscale' },
            { name: 'SEPIA', class: 'filter-sepia' },
            { name: 'INVERT', class: 'filter-invert' },
            { name: 'ALIEN', class: 'filter-hue-rotate-90' },
            { name: 'MATRIX', class: 'filter-matrix-effect' },
            { name: 'NEON GLOW', class: 'filter-neon-glow' }
        ];
        let currentFilterIndex = 0;
        
        // --- Lightweight Holographic Background ---
        const bgCanvas = getEl('holographic-bg');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];
        const particleCount = window.innerWidth > 768 ? 60 : 30;

        function setupBackground() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    radius: Math.random() * 1.5 + 0.5
                });
            }
        }

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = 'rgba(0, 229, 255, 0.5)';
            bgCtx.strokeStyle = 'rgba(0, 229, 255, 0.1)';

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
                
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fill();

                particles.forEach(p2 => {
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        bgCtx.beginPath();
                        bgCtx.moveTo(p.x, p.y);
                        bgCtx.lineTo(p2.x, p2.y);
                        bgCtx.stroke();
                    }
                });
            });
            requestAnimationFrame(drawBackground);
        }

        // --- Audio Visualizer ---
        const visualizerCanvas = getEl('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext, analyser, sourceNode, visualizerAnimationId;
        const numBars = 64;

        function setupAudioVisualizer() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
            } catch (e) {
                console.error("Web Audio API setup failed:", e);
                visualizerCanvas.style.display = 'none';
            }
        }
        
        function drawVisualizer() {
            if (!analyser) return;
            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            const barWidth = visualizerCanvas.width / numBars;
            
            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height * 0.8;
                const hue = 180 + (i / numBars) * 60; // Cyan to Blue range
                visualizerCtx.fillStyle = `hsla(${hue}, 100%, 60%, 0.7)`;
                visualizerCtx.fillRect(i * barWidth, visualizerCanvas.height - barHeight, barWidth - 1, barHeight);
            }
        }

        // --- Player Functions ---
        const formatTime = (s) => (s = Math.floor(s), `${(s/60|0)}`.padStart(2,'0')+':'+`${s%60}`.padStart(2,'0'));

        function populatePlaylist() {
            trackListEl.innerHTML = videoSources.map((src, index) => {
                const name = `Datastream ${index + 1}`;
                return `<li><div class="track-item" data-index="${index}"><span class="track-name">${name}</span></div></li>`;
            }).join('');
        }

        function loadVideo(index) {
            currentVideoIndex = index;
            cyclicVideo.src = videoSources[index];
            videoTitle.textContent = `Datastream ${index + 1}`;
            
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.index) === index);
            });
            
            const playPromise = cyclicVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => console.warn("Autoplay was prevented.", e));
            }
        }

        function togglePlayPause() {
            if (cyclicVideo.paused || cyclicVideo.ended) {
                cyclicVideo.play();
            } else {
                cyclicVideo.pause();
            }
        }

        function updateProgress() {
            if (!isSeeking && cyclicVideo.duration) {
                const percentage = (cyclicVideo.currentTime / cyclicVideo.duration) * 100;
                progressSliderInput.value = percentage;
                currentTimeEl.textContent = formatTime(cyclicVideo.currentTime);
            }
        }

        // --- Event Listeners ---
        playPauseBtn.addEventListener('click', togglePlayPause);
        cyclicVideo.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
            playPauseBtn.setAttribute('aria-label', 'Pause');
            if (!audioContext) setupAudioVisualizer();
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            if (!visualizerAnimationId) drawVisualizer();
        });
        cyclicVideo.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
            playPauseBtn.setAttribute('aria-label', 'Play');
            cancelAnimationFrame(visualizerAnimationId);
            visualizerAnimationId = null;
        });
        cyclicVideo.addEventListener('ended', () => nextBtn.click());
        cyclicVideo.addEventListener('loadedmetadata', () => totalTimeEl.textContent = formatTime(cyclicVideo.duration));
        cyclicVideo.addEventListener('timeupdate', updateProgress);

        prevBtn.addEventListener('click', () => loadVideo((currentVideoIndex - 1 + videoSources.length) % videoSources.length));
        nextBtn.addEventListener('click', () => loadVideo((currentVideoIndex + 1) % videoSources.length));
        
        trackListEl.addEventListener('click', (e) => {
            const item = e.target.closest('.track-item');
            if (item) loadVideo(parseInt(item.dataset.index));
        });

        progressSliderInput.addEventListener('input', () => {
            if(cyclicVideo.duration) currentTimeEl.textContent = formatTime((progressSliderInput.value / 100) * cyclicVideo.duration);
        });
        progressSliderInput.addEventListener('change', () => {
            if(cyclicVideo.duration) cyclicVideo.currentTime = (progressSliderInput.value / 100) * cyclicVideo.duration;
        });
        progressSliderInput.addEventListener('mousedown', () => isSeeking = true);
        progressSliderInput.addEventListener('mouseup', () => isSeeking = false);
        
        volumeSliderInput.addEventListener('input', () => {
            cyclicVideo.volume = volumeSliderInput.value / 100;
            cyclicVideo.muted = cyclicVideo.volume === 0;
            muteBtn.textContent = cyclicVideo.muted ? '🔇' : '🔊';
        });
        muteBtn.addEventListener('click', () => {
            cyclicVideo.muted = !cyclicVideo.muted;
            volumeSliderInput.value = cyclicVideo.muted ? 0 : (cyclicVideo.volume * 100 || 70);
            muteBtn.textContent = cyclicVideo.muted ? '🔇' : '🔊';
        });

        filterBtn.addEventListener('click', () => {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            const filter = filters[currentFilterIndex];
            filters.forEach(f => cyclicVideo.classList.remove(f.class));
            cyclicVideo.classList.add(filter.class);
            showTooltip(`Filter: ${filter.name}`);
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        });
        
        let tooltipTimeout;
        function showTooltip(message) {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.textContent = message;
            keyboardTooltip.classList.add('show');
            tooltipTimeout = setTimeout(() => keyboardTooltip.classList.remove('show'), 1500);
        }
        
        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); togglePlayPause(); break;
                case 'ArrowRight': e.preventDefault(); nextBtn.click(); break;
                case 'ArrowLeft': e.preventDefault(); prevBtn.click(); break;
                case 'KeyM': e.preventDefault(); muteBtn.click(); break;
                case 'KeyF': e.preventDefault(); filterBtn.click(); break;
                case 'KeyU': e.preventDefault(); fullscreenBtn.click(); break;
            }
        });
        
        window.addEventListener('resize', () => {
            setupBackground();
            if(visualizerCanvas) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
                visualizerCanvas.height = visualizerCanvas.offsetHeight;
            }
        });

        // --- Initial Load ---
        setupBackground();
        drawBackground();
        populatePlaylist();
        loadVideo(0); // Load the first video but don't force play
        cyclicVideo.pause(); // Ensure it starts paused
        if(visualizerCanvas) {
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
        }

        console.log("Player X-4 Ready. Awaiting user interaction.");
    });
    </script>
</body>
</html>
