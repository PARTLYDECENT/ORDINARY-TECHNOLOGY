<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Video Player v4 - Hyper Modern</title>
    <style>
        :root {
            --primary-glow: #00ffff;
            --secondary-glow: #ff00ff;
            --background-start: #0d0d2b;
            --background-end: #050018;
            --border-color: #00ffff;
            --text-color: #00ffff;
            --button-active-bg: rgba(255, 0, 255, 0.3);
            --button-active-border: #ff00ff;
            --sidebar-bg: rgba(0, 0, 0, 0.8);
            --sidebar-hover: rgba(0, 255, 255, 0.1);
            --playlist-active: rgba(255, 0, 255, 0.3);
        }
        body {
            margin: 0;
            background: radial-gradient(circle, var(--background-start), var(--background-end));
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .app-container {
            display: flex;
            width: 100%;
            height: calc(100vh - 60px);
            max-width: 1600px;
        }
        header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            height: 60px;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            z-index: 10;
        }
        button {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px var(--primary-glow);
            transform: translateY(-2px);
        }
        button:active {
            transform: scale(0.95) translateY(0);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
            text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--secondary-glow);
            text-align: center;
            flex-grow: 1;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0, 255, 255, 0.2);
            overflow-y: auto;
            transition: width 0.3s;
            height: 100%;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist-title {
            color: var(--secondary-glow);
            font-size: 1.1rem;
            text-shadow: 0 0 5px var(--primary-glow);
            margin: 0;
        }
        .playlist-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .playlist-item:hover {
            background: var(--sidebar-hover);
        }
        .playlist-item.active {
            background: var(--playlist-active);
            border-left: 3px solid var(--secondary-glow);
        }
        .playlist-thumbnail {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            background: #000;
            border: 1px solid var(--border-color);
        }
        .playlist-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Main Content */
        main {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 200px;
            margin-bottom: 15px;
        }
        .video-container {
            width: 100%;
            height: 100%;
            background: #000;
            border: 4px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: filter 0.5s ease;
        }
        /* Filter Classes */
        .video-container video.filter-none { filter: none; }
        .video-container video.filter-grayscale { filter: grayscale(1); }
        .video-container video.filter-sepia { filter: sepia(1); }
        .video-container video.filter-invert { filter: invert(1); }
        .video-container video.filter-hue-rotate-90 { filter: hue-rotate(90deg); }
        .video-container video.filter-hue-rotate-180 { filter: hue-rotate(180deg); }
        .video-container video.filter-contrast-saturate { filter: contrast(1.5) saturate(2); }
        .video-container video.filter-blur-bright { filter: blur(2px) brightness(1.3); }
        .video-container video.filter-vintage { filter: sepia(0.8) contrast(1.1) brightness(0.9); }
        .video-container video.filter-xray { filter: invert(1) contrast(1.5) brightness(0.8); }
        .video-container video.filter-saturated-bright { filter: saturate(3) brightness(1.1); }

        #audioVisualizer {
            position: absolute;
            bottom: 4px;
            left: 4px;
            width: calc(100% - 8px);
            height: 50px;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }
        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .video-title {
            font-size: 1.1rem;
            color: var(--secondary-glow);
            text-shadow: 0 0 5px var(--primary-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .video-counter {
            font-size: 1rem;
            color: var(--secondary-glow);
            white-space: nowrap;
        }
        .control-panel {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .video-navigation, .speed-panel, .feature-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }
        .active-button {
            background: var(--button-active-bg);
            border-color: var(--button-active-border);
            box-shadow: 0 0 10px var(--button-active-border);
        }
        .tooltip {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #ccc;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #555;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .current-filter-display {
            margin-left: 10px;
            font-size: 0.8rem;
            color: var(--secondary-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            }
            .control-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrixCanvas"></canvas>
    <header>
        <button class="back-button" onclick="goBack()">BACK</button>
        <h1>ALIEN PLAYER</h1>
    </header>
    <div class="app-container">
        <!-- Sidebar with playlists -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 class="playlist-title">PLAYLISTS</h3>
                <button id="addPlaylistBtn" style="padding: 3px 8px;">+</button>
            </div>
            <div id="playlistContainer">
                <!-- Playlist items will be generated here -->
            </div>
        </div>
        
        <!-- Main content -->
        <main>
            <div class="video-wrapper">
                <div class="video-container">
                    <video id="cyclicVideo" autoplay loop controls crossorigin="anonymous"></video>
                </div>
                <canvas id="audioVisualizer"></canvas>
            </div>
            <div class="video-info">
                <div class="video-title" id="videoTitle">Video 1</div>
                <div class="video-counter">
                    <span id="videoCounter">1</span> / <span id="videoTotal">20</span>
                </div>
            </div>
            <div class="control-panel">
                <div class="video-navigation">
                    <button id="prevVideo">Prev</button>
                    <button id="nextVideo">Next</button>
                    <button id="downloadBtn">Download</button>
                </div>
                <div class="speed-panel">
                    Speed: <button data-speed="0.5">0.5x</button>
                    <button data-speed="0.75">0.75x</button>
                    <button data-speed="1.0" class="active-button">1.0x</button>
                    <button data-speed="1.5">1.5x</button>
                    <button data-speed="2.0">2.0x</button>
                </div>
                <div class="feature-panel">
                    Features: <button id="shuffleBtn">Shuffle</button>
                    <button id="repeatBtn">Repeat: Off</button>
                    <button id="filterBtn">Next Filter</button>
                    <span id="currentFilterDisplay" class="current-filter-display">FILTER: NONE</span>
                </div>
            </div>
        </main>
    </div>
    <div id="keyboardTooltip" class="tooltip">Space: Play/Pause | ←/→: Prev/Next | S: Shuffle | R: Repeat | F: Filter</div>

    <script>
        // --- Matrix Background ---
        const matrixCanvas = document.getElementById('matrixCanvas');
        const matrixCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        const matrixFontSize = 16;
        const matrixColumns = matrixCanvas.width / matrixFontSize;
        const matrixDrops = Array(Math.floor(matrixColumns)).fill(1);

        function drawMatrix() {
            matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            matrixCtx.fillStyle = '#00ff00';
            matrixCtx.font = matrixFontSize + 'px monospace';
            for (let i = 0; i < matrixDrops.length; i++) {
                const text = String.fromCharCode(Math.random() * 128);
                matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
                if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 50);

        // --- Video Player Setup ---
        const defaultVideoSources = Array.from({ length: 20 }, (_, i) => `video${i + 1}.mp4`);
        let videoSources = [...defaultVideoSources];
        let originalVideoOrder = [...videoSources];
        let currentVideoIndex = 0;
        let isShuffled = false;
        let repeatMode = false;
        let playlists = [
            { name: "Default Playlist", videos: [...defaultVideoSources] },
            { name: "Favorites", videos: ["video1.mp4", "video5.mp4", "video10.mp4"] },
            { name: "Recently Added", videos: ["video18.mp4", "video19.mp4", "video20.mp4"] }
        ];
        let currentPlaylistIndex = 0;

        const cyclicVideo = document.getElementById("cyclicVideo");
        const videoTitle = document.getElementById("videoTitle");
        const videoCounter = document.getElementById("videoCounter");
        const videoTotal = document.getElementById("videoTotal");
        const speedButtons = document.querySelectorAll('.speed-panel button');
        const downloadBtn = document.getElementById("downloadBtn");
        const shuffleBtn = document.getElementById("shuffleBtn");
        const repeatBtn = document.getElementById("repeatBtn");
        const filterBtn = document.getElementById("filterBtn");
        const keyboardTooltip = document.getElementById("keyboardTooltip");
        const currentFilterDisplay = document.getElementById("currentFilterDisplay");
        const playlistContainer = document.getElementById("playlistContainer");
        const addPlaylistBtn = document.getElementById("addPlaylistBtn");

        // --- Filter Setup ---
        const filters = [
            { name: 'NONE', class: 'filter-none' },
            { name: 'GRAYSCALE', class: 'filter-grayscale' },
            { name: 'SEPIA', class: 'filter-sepia' },
            { name: 'INVERT', class: 'filter-invert' },
            { name: 'ALIEN', class: 'filter-hue-rotate-90' },
            { name: 'PSYCHEDELIC', class: 'filter-hue-rotate-180' },
            { name: 'VIBRANT', class: 'filter-contrast-saturate' },
            { name: 'BLURRY', class: 'filter-blur-bright' },
            { name: 'VINTAGE', class: 'filter-vintage' },
            { name: 'X-RAY', class: 'filter-xray' },
            { name: 'OVERDRIVE', class: 'filter-saturated-bright' }
        ];
        let currentFilterIndex = 0;

        // --- Playlist Functions ---
        function renderPlaylists() {
            playlistContainer.innerHTML = '';
            playlists.forEach((playlist, index) => {
                const playlistItem = document.createElement('div');
                playlistItem.className = `playlist-item ${index === currentPlaylistIndex ? 'active' : ''}`;
                playlistItem.innerHTML = `
                    <div class="playlist-thumbnail"></div>
                    <div class="playlist-item-title">${playlist.name}</div>
                `;
                playlistItem.addEventListener('click', () => switchPlaylist(index));
                playlistContainer.appendChild(playlistItem);
            });
        }

        function switchPlaylist(index) {
            if (index === currentPlaylistIndex) return;
            currentPlaylistIndex = index;
            videoSources = [...playlists[index].videos];
            originalVideoOrder = [...videoSources];
            currentVideoIndex = 0;
            isShuffled = false;
            renderPlaylists();
            updateUI();
        }

        addPlaylistBtn.addEventListener('click', () => {
            const name = prompt("Enter new playlist name:");
            if (name) {
                playlists.push({ name, videos: [] });
                renderPlaylists();
            }
        });

        // --- Audio Visualizer Setup ---
        const visualizerCanvas = document.getElementById('audioVisualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        let audioContext;
        let analyser;
        let sourceNode;
        let visualizerAnimationId;
        const numBars = 64;

        function setupAudioVisualizer() {
            if (audioContext) return;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = Math.pow(2, 7);
                sourceNode = audioContext.createMediaElementSource(cyclicVideo);
                sourceNode.connect(analyser);
                analyser.connect(audioContext.destination);
                visualizerCanvas.height = 50;
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
                drawVisualizer();
            } catch (e) {
                console.error("Web Audio API setup failed:", e);
                visualizerCanvas.style.display = 'none';
            }
        }

        function drawVisualizer() {
            if (!analyser) return;

            visualizerAnimationId = requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            const barWidth = visualizerCanvas.width / numBars;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
                const barHeight = (dataArray[i] / 255) * visualizerCanvas.height;
                const hue = (i / numBars) * 360;
                visualizerCtx.fillStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
                visualizerCtx.fillRect(x, visualizerCanvas.height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        function stopVisualizer() {
            if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
            }
        }

        // --- UI Update Function ---
        function updateUI(playVideo = true) {
            if (currentVideoIndex < 0 || currentVideoIndex >= videoSources.length) {
                currentVideoIndex = 0;
            }
            const videoPath = videoSources[currentVideoIndex];
            videoTitle.textContent = `Video ${currentVideoIndex + 1}`;
            videoCounter.textContent = currentVideoIndex + 1;
            videoTotal.textContent = videoSources.length;

            if (cyclicVideo.currentSrc.split('/').pop() !== videoPath.split('/').pop()) {
                cyclicVideo.src = videoPath;
                cyclicVideo.load();
            }

            if (playVideo) {
                cyclicVideo.play().catch(e => console.warn("Autoplay possibly prevented:", e));
                if (!audioContext && cyclicVideo.readyState >= 2) {
                    setupAudioVisualizer();
                } else if (analyser && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }
            speedButtons.forEach(btn => {
                btn.classList.toggle('active-button', parseFloat(btn.dataset.speed) === cyclicVideo.playbackRate);
            });
            shuffleBtn.classList.toggle('active-button', isShuffled);
            repeatBtn.textContent = `Repeat: ${repeatMode ? 'On' : 'Off'}`;
            repeatBtn.classList.toggle('active-button', repeatMode);
            cyclicVideo.loop = repeatMode;

            applyFilterClass();
            currentFilterDisplay.textContent = `FILTER: ${filters[currentFilterIndex].name}`;
        }

        // --- Apply Filter Function ---
        function applyFilterClass() {
            filters.forEach(filter => cyclicVideo.classList.remove(filter.class));
            cyclicVideo.classList.add(filters[currentFilterIndex].class);
            filterBtn.classList.toggle('active-button', currentFilterIndex !== 0);
        }

        // --- Cycle Filter Function ---
        function cycleFilter() {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            updateUI(false);
        }

        // --- Event Listeners ---
        speedButtons.forEach(button => {
            button.addEventListener('click', function() {
                cyclicVideo.playbackRate = parseFloat(this.dataset.speed);
                updateUI(false);
            });
        });

        document.getElementById("prevVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex - 1 + videoSources.length) % videoSources.length;
            updateUI();
        });

        document.getElementById("nextVideo").addEventListener("click", function() {
            currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
            updateUI();
        });

        downloadBtn.addEventListener("click", function() {
            const a = document.createElement('a');
            a.href = videoSources[currentVideoIndex];
            const filename = videoSources[currentVideoIndex].split('/').pop() || `video-${currentVideoIndex + 1}.mp4`;
            a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

        shuffleBtn.addEventListener("click", function() {
            isShuffled = !isShuffled;
            if (isShuffled) {
                const currentVideo = videoSources.splice(currentVideoIndex, 1)[0];
                for (let i = videoSources.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [videoSources[i], videoSources[j]] = [videoSources[j], videoSources[i]];
                }
                videoSources.unshift(currentVideo);
                currentVideoIndex = 0;
            } else {
                const currentVideoPath = videoSources[currentVideoIndex];
                videoSources = [...originalVideoOrder];
                currentVideoIndex = videoSources.findIndex(src => src === currentVideoPath);
                if (currentVideoIndex === -1) currentVideoIndex = 0;
            }
            updateUI(false);
        });

        repeatBtn.addEventListener("click", function() {
            repeatMode = !repeatMode;
            updateUI(false);
        });

        filterBtn.addEventListener("click", cycleFilter);

        cyclicVideo.addEventListener('ended', () => {
            if (!repeatMode) {
                currentVideoIndex = (currentVideoIndex + 1) % videoSources.length;
                updateUI();
            }
        });

        cyclicVideo.addEventListener('play', () => {
            if (!audioContext) { setupAudioVisualizer(); }
            else if (audioContext.state === 'suspended') { audioContext.resume(); }
            if (visualizerAnimationId === null && analyser) { drawVisualizer(); }
        });
        cyclicVideo.addEventListener('pause', stopVisualizer);

        function goBack() { window.history.back(); }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            let handled = true;
            switch (e.code) {
                case 'Space': cyclicVideo.paused ? cyclicVideo.play() : cyclicVideo.pause(); break;
                case 'ArrowRight': document.getElementById("nextVideo").click(); break;
                case 'ArrowLeft': document.getElementById("prevVideo").click(); break;
                case 'KeyS': shuffleBtn.click(); break;
                case 'KeyR': repeatBtn.click(); break;
                case 'KeyF': cycleFilter(); break;
                default: handled = false;
            }
            if (handled) e.preventDefault();
        });

        let tooltipTimeout;
        function showTooltip() {
            clearTimeout(tooltipTimeout);
            keyboardTooltip.style.opacity = '1';
            tooltipTimeout = setTimeout(() => { keyboardTooltip.style.opacity = '0'; }, 3000);
        }
        document.addEventListener('keydown', showTooltip);
        showTooltip();

        window.addEventListener('resize', function() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            const newColumns = matrixCanvas.width / matrixFontSize;
            matrixDrops.length = Math.floor(newColumns);
            for (let i = 0; i < matrixDrops.length; i++) if (matrixDrops[i] === undefined) matrixDrops[i] = 1;

            if (visualizerCanvas.style.display !== 'none' && audioContext) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
            }
        });

        // --- Initial Load ---
        renderPlaylists();
        updateUI();
    </script>
</body>
</html>
