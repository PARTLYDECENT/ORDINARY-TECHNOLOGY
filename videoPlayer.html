<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLOGRAPHIC PLAYER X-4 | REFINED & OPTIMIZED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --main-bg: #01040a;
            --accent-cyan: #00e5ff;
            --accent-blue: #00aaff;
            --accent-magenta: #ff20c5;
            --text-color: #e0eaff;
            --panel-bg: rgba(5, 12, 25, 0.75);
            --glass-bg: rgba(8, 15, 35, 0.7);
            --border-glow: 0 0 10px 1px var(--accent-cyan), 0 0 18px 3px rgba(0, 229, 255, 0.4);
            --border-radius: 6px;
            --transition-speed-fast: 0.2s;
            --transition-speed-med: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) var(--main-bg);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: var(--main-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
        }

        #holographic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.25;
            pointer-events: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Centered title */
            padding: 12px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 3px 25px rgba(0, 229, 255, 0.2);
            z-index: 100;
            height: 75px;
            flex-shrink: 0;
            position: relative;
        }

        .main-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(24px, 3.5vw, 32px);
            font-weight: 900;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-magenta), var(--accent-cyan));
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            animation: titleShine 5s linear infinite;
        }

        @keyframes titleShine {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: -300% center;
            }
        }

        .content-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-right: 2px solid rgba(0, 229, 255, 0.4);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
            padding: 18px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
        }

        .track-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style-type: none;
            padding: 12px;
        }

        .track-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(10, 20, 35, 0.8);
            border-radius: var(--border-radius);
            border-left: 5px solid transparent;
            cursor: pointer;
            transition: all var(--transition-speed-fast) ease-out;
        }

        .track-item:hover {
            background: rgba(20, 35, 60, 0.95);
            border-left-color: var(--accent-blue);
            transform: translateX(5px);
        }

        .track-item.active {
            border-left-color: var(--accent-cyan);
            box-shadow: inset 4px 0 10px rgba(0, 229, 255, 0.4);
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .track-item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 25px;
        }

        #playerScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            margin-bottom: 25px;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.5);
            border-radius: var(--border-radius);
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        #cyclicVideo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: repeating-linear-gradient(0deg, rgba(10, 20, 40, 0.1) 0px, transparent 1px, transparent 3px);
            opacity: 0.5;
            animation: scanline-scroll 8s linear infinite;
        }

        @keyframes scanline-scroll {
            to {
                background-position-y: 100px;
            }
        }

        #audioVisualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 3;
            mix-blend-mode: lighten;
            opacity: 0.85;
            pointer-events: none;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 18px 25px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .control-button {
            background: linear-gradient(145deg, #18202b, #2a3545);
            color: var(--text-color);
            border: 2px solid rgba(180, 190, 210, 0.4);
            padding: 10px 18px;
            border-radius: var(--border-radius);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-speed-fast) ease-out;
            text-transform: uppercase;
        }

        .icon-button {
            font-size: 20px;
            width: 44px;
            height: 44px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }


        #external-modules {
            margin-top: 40px;
            max-width: 1280px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            border-radius: var(--border-radius);
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .tooltip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--main-bg);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            z-index: 200;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            opacity: 0;
            transition: all var(--transition-speed-med) ease;
            pointer-events: none;
        }

        .tooltip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <canvas id="holographic-bg"></canvas>

    <header>
        <div class="main-title">
            <h1>HOLOGRAPHIC PLAYER X-4</h1>
        </div>
    </header>

    <div class="content-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">DATASTREAM PLAYLIST</div>
            <ul class="track-list" id="trackList"></ul>
        </aside>

        <main id="mainContentArea">
            <section id="playerScreen">
                <div class="video-wrapper" id="videoWrapper">
                    <div class="video-container" id="videoContainer">
                        <video id="cyclicVideo" loop crossorigin="anonymous"></video>
                        <div class="video-scanline-overlay"></div>
                        <canvas id="audioVisualizer"></canvas>
                    </div>
                </div>

                <div class="control-panel">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 15px;">
                        <button class="control-button icon-button" id="prevVideo" title="Previous (←)">⏮</button>
                        <button class="control-button icon-button" id="playPauseBtn" title="Play/Pause (Space)"
                            style="font-size: 20px;">▶</button>
                        <button class="control-button icon-button" id="nextVideo" title="Next (→)">⏭</button>
                        <input type="range" id="progressSliderInput" value="0" style="flex-grow: 1;">
                        <button class="control-button icon-button" id="fullscreenBtn" title="Fullscreen (U)">⛶</button>
                    </div>
                </div>
            </section>

            <section id="external-modules">
                <div class="embed-container">
                    <iframe title="Xenomorph - Toy Scan" frameborder="0" allowfullscreen
                        src="https://sketchfab.com/models/95938a96d37842b68d6c066407e23ed7/embed?autostart=1&ui_theme=dark"></iframe>
                </div>
                <div class="embed-container">
                    <iframe title="Resident Evil 2 Remake Licker" frameborder="0" allowfullscreen
                        src="https://sketchfab.com/models/18db038d30244b27af5f00d1f9d99567/embed?autostart=1&ui_theme=dark"></iframe>
                </div>
                <div class="embed-container">
                    <iframe frameborder="0" allowfullscreen
                        src="https://www.shadertoy.com/embed/MdX3Rr?gui=false&t=10&paused=false&muted=true"></iframe>
                </div>
            </section>
        </main>
    </div>

    <div class="tooltip" id="keyboardTooltip"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Cache ---
            const getEl = id => document.getElementById(id);
            const cyclicVideo = getEl("cyclicVideo");
            const trackListEl = getEl("trackList");
            const playPauseBtn = getEl("playPauseBtn");
            const prevBtn = getEl("prevVideo");
            const nextBtn = getEl("nextVideo");
            const fullscreenBtn = getEl("fullscreenBtn");
            const progressSliderInput = getEl("progressSliderInput");
            const videoContainer = getEl("videoContainer");

            // ### INTERNET ARCHIVE VIDEO SOURCES - 140 VIDEOS ###
            // This creates URLs like "https://archive.org/download/videos1_202512/CHANNEL1/video1.mp4", etc.
            const videoSources = Array.from({ length: 140 }, (_, i) =>
                `https://archive.org/download/videos1_202512/CHANNEL1/video${i + 1}.mp4`
            );
            let currentVideoIndex = 0;

            // --- Lightweight Holographic Background ---
            const bgCanvas = getEl('holographic-bg');
            const bgCtx = bgCanvas.getContext('2d');
            let particles = [];
            const particleCount = window.innerWidth > 768 ? 60 : 30;

            function setupBackground() {
                bgCanvas.width = window.innerWidth;
                bgCanvas.height = window.innerHeight;
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * bgCanvas.width,
                        y: Math.random() * bgCanvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: Math.random() * 1.5 + 0.5
                    });
                }
            }
            function drawBackground() {
                if (!bgCtx) return;
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                bgCtx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
                    particles.forEach(p2 => {
                        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                        if (dist < 120) {
                            bgCtx.beginPath();
                            bgCtx.moveTo(p.x, p.y);
                            bgCtx.lineTo(p2.x, p2.y);
                            bgCtx.stroke();
                        }
                    });
                });
                requestAnimationFrame(drawBackground);
            }

            // --- Player Functions ---
            function populatePlaylist() {
                trackListEl.innerHTML = videoSources.map((path, index) => {
                    const trackName = path.split('/').pop().replace('.mp4', '').replace(/video/i, 'Signal ');
                    return `<li><div class="track-item" data-index="${index}"><span class="track-item-name">${trackName}</span></div></li>`;
                }).join('');
            }

            function loadVideo(index) {
                if (index < 0 || index >= videoSources.length) return;
                currentVideoIndex = index;
                cyclicVideo.src = videoSources[index];
                document.querySelectorAll('.track-item').forEach(item => {
                    item.classList.toggle('active', parseInt(item.dataset.index) === index);
                });
                cyclicVideo.play().catch(e => console.warn("Autoplay was prevented.", e));
            }

            function togglePlayPause() {
                cyclicVideo.paused ? cyclicVideo.play() : cyclicVideo.pause();
            }

            // --- Event Listeners ---
            playPauseBtn.addEventListener('click', togglePlayPause);
            cyclicVideo.addEventListener('play', () => playPauseBtn.textContent = '⏸');
            cyclicVideo.addEventListener('pause', () => playPauseBtn.textContent = '▶');
            cyclicVideo.addEventListener('ended', () => nextBtn.click());
            cyclicVideo.addEventListener('timeupdate', () => {
                if (cyclicVideo.duration) {
                    progressSliderInput.value = (cyclicVideo.currentTime / cyclicVideo.duration) * 100;
                }
            });

            prevBtn.addEventListener('click', () => loadVideo((currentVideoIndex - 1 + videoSources.length) % videoSources.length));
            nextBtn.addEventListener('click', () => loadVideo((currentVideoIndex + 1) % videoSources.length));

            trackListEl.addEventListener('click', (e) => {
                const item = e.target.closest('.track-item');
                if (item) loadVideo(parseInt(item.dataset.index));
            });

            progressSliderInput.addEventListener('input', () => {
                if (cyclicVideo.duration) {
                    cyclicVideo.currentTime = (progressSliderInput.value / 100) * cyclicVideo.duration;
                }
            });

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    videoContainer.requestFullscreen().catch(err => console.error(err));
                } else {
                    document.exitFullscreen();
                }
            });

            // --- Initial Load ---
            setupBackground();
            requestAnimationFrame(drawBackground);
            populatePlaylist();
            loadVideo(0);
            cyclicVideo.pause();
        });
    </script>
</body>

</html>
