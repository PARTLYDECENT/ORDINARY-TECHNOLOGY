<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLOGRAPHIC PLAYER X-4 | REFINED & OPTIMIZED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Deeper, more atmospheric background */
            --main-bg: #050508;

            /* Vibrant neon accents */
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --accent-magenta: #ff0055;
            --accent-purple: #8a2be2;

            /* Text colors */
            --text-main: #ffffff;
            --text-muted: #a0a5b5;

            /* Premium Glass Panels */
            --glass-bg: rgba(10, 15, 25, 0.4);
            --glass-border: rgba(0, 240, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            --glass-blur: blur(16px);

            /* Enhanced Glows */
            --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.4), 0 0 30px rgba(0, 240, 255, 0.2);
            --glow-magenta: 0 0 15px rgba(255, 0, 85, 0.4), 0 0 30px rgba(255, 0, 85, 0.2);

            --border-radius-lg: 12px;
            --border-radius-sm: 6px;

            --transition-bounce: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-smooth: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) rgba(255, 255, 255, 0.05);
        }

        /* Custom Webkit Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: var(--main-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            /* Subtle animated background gradient to mix with the 3D canvas */
            background: radial-gradient(circle at 50% 50%, #101525 0%, #050508 100%);
        }

        /* 3D and 2D Background Canvases */
        #babylon-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
            /* Blend orb with background slightly */
        }

        #holographic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.2;
        }

        /* Ambient body lighting */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%,
                    rgba(0, 240, 255, 0.05) 0deg,
                    rgba(255, 0, 85, 0.05) 120deg,
                    rgba(0, 119, 255, 0.05) 240deg,
                    rgba(0, 240, 255, 0.05) 360deg);
            animation: rotateBG 30s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rotateBG {
            100% {
                transform: rotate(360deg);
            }
        }

        /* HEADER - Premium Glass */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 40px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 100;
            height: 80px;
            flex-shrink: 0;
            position: relative;
        }

        /* Cyberpunk Header Line */
        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-magenta), transparent);
            opacity: 0.8;
        }

        .main-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(24px, 3.5vw, 36px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            /* Animated Gradient Text */
            background: linear-gradient(90deg, #fff, var(--accent-cyan), var(--accent-blue), #fff);
            background-size: 300% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            animation: titleShine 4s linear infinite;
        }

        @keyframes titleShine {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: -300% center;
            }
        }

        /* MAIN CONTENT LAYOUT */
        .content-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            z-index: 10;
            position: relative;
        }

        /* SIDEBAR - Glassmorphism */
        .sidebar {
            width: 340px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--glass-border);
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
            transition: width var(--transition-smooth);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            padding: 25px 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: var(--glow-cyan);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .track-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style-type: none;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-item {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius-sm);
            border: 1px solid transparent;
            border-left: 4px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Hover FX */
        .track-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }

        .track-item:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.2);
            border-left-color: var(--accent-cyan);
            transform: translateX(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .track-item:hover::before {
            opacity: 1;
        }

        /* Active Track FX */
        .track-item.active {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.4);
            border-left-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan), inset 0 0 15px rgba(0, 240, 255, 0.2);
            color: #fff;
            transform: scale(1.02) translateX(4px);
        }

        .track-item.active::after {
            content: '▶';
            position: absolute;
            right: 15px;
            color: var(--accent-cyan);
            font-size: 12px;
            animation: slideRight 1s infinite alternate;
        }

        @keyframes slideRight {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(5px);
            }
        }

        .track-item-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }

        /* MAIN AREA */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 40px;
            align-items: center;
        }

        #playerScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            /* Wider max for cinematic feel */
            gap: 25px;
        }

        /* VIDEO WRAPPER & CONTAINER */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            /* Premium Holo-frame */
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.5), rgba(255, 0, 85, 0.5));
            border-radius: var(--border-radius-lg);
            box-shadow: var(--glow-cyan), 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform var(--transition-smooth);
        }

        .video-wrapper:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: calc(var(--border-radius-lg) - 2px);
            /* inner radius */
            overflow: hidden;
            background: #000;
        }

        /* Video screen interior shadow */
        .video-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 4;
        }

        #cyclicVideo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Fill the screen better */
            background: #000;
        }

        /* Scanlines - more subtle, higher quality */
        .video-scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        #audioVisualizer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 3;
            mix-blend-mode: screen;
            opacity: 0.9;
            pointer-events: none;
            /* Fade top of visualizer */
            mask-image: linear-gradient(to bottom, transparent, black);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black);
        }

        /* CONTROL PANEL */
        .control-panel {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--border-radius-lg);
            padding: 20px 30px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }

        /* Panel accent glow */
        .control-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            /* Circular buttons */
            cursor: pointer;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        .control-button:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: scale(1.1) translateY(-2px);
            box-shadow: var(--glow-cyan);
        }

        .control-button:hover::after {
            opacity: 1;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .icon-button {
            font-size: 18px;
            width: 50px;
            height: 50px;
        }

        #playPauseBtn {
            width: 65px;
            height: 65px;
            font-size: 24px;
            background: rgba(0, 240, 255, 0.15);
            border-color: rgba(0, 240, 255, 0.5);
        }

        #playPauseBtn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
        }

        /* CUSTOM RANGE SLIDER */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            flex-grow: 1;
            background: transparent;
            height: 30px;
            cursor: pointer;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Webkit Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Track glow on hover */
        input[type=range]:hover::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Webkit Thumb */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            margin-top: -6px;
            /* align center */
            box-shadow: 0 0 15px var(--accent-cyan);
            transition: transform 0.1s, box-shadow 0.1s;
            border: 2px solid #fff;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.3);
            box-shadow: 0 0 20px var(--accent-cyan), 0 0 5px #fff;
        }

        /* Firefox Support */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            border: 2px solid #fff;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        input[type=range]::-moz-range-progress {
            background: var(--accent-cyan);
            height: 4px;
            border-radius: 2px;
        }

        /* EXTERNAL MODULES - Sketchfab embeds */
        #external-modules {
            margin-top: 50px;
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
        }

        .embed-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 0, 85, 0.2);
            border-color: rgba(255, 0, 85, 0.4);
            /* Magenta hover state for variety */
        }

        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        /* LOADING OVERLAY */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-right: 3px solid var(--accent-magenta);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(255, 0, 85, 0.3);
        }

        .loading-text {
            margin-top: 30px;
            color: var(--text-main);
            font-family: "Orbitron", sans-serif;
            letter-spacing: 4px;
            font-size: 16px;
            font-weight: 700;
            animation: textPulse 1.5s ease-in-out infinite alternate;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes textPulse {
            0% {
                opacity: 0.5;
                text-shadow: 0 0 5px var(--accent-cyan);
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 20px var(--accent-cyan);
            }
        }

        /* TOOLTIP */
        .tooltip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px) scale(0.9);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 200;
            box-shadow: var(--glow-cyan);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tooltip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Element Cache ---
            const getEl = id => document.getElementById(id);
            const cyclicVideo = getEl("cyclicVideo");
            const trackListEl = getEl("trackList");
            const playPauseBtn = getEl("playPauseBtn");
            const prevBtn = getEl("prevVideo");
            const nextBtn = getEl("nextVideo");
            const fullscreenBtn = getEl("fullscreenBtn");
            const progressSliderInput = getEl("progressSliderInput");
            const videoContainer = getEl("videoContainer");
            const videoLoader = getEl("videoLoader");
            const showLoader = () => videoLoader.classList.add("active");
            const hideLoader = () => videoLoader.classList.remove("active");

            cyclicVideo.addEventListener("loadstart", showLoader);
            cyclicVideo.addEventListener("waiting", showLoader);
            cyclicVideo.addEventListener("canplay", hideLoader);
            cyclicVideo.addEventListener("playing", hideLoader);
            cyclicVideo.addEventListener("error", hideLoader);

            // ### INTERNET ARCHIVE VIDEO SOURCES - 140 VIDEOS ###
            // This creates URLs like "https://archive.org/download/videos1_202512/CHANNEL1/video1.mp4", etc.
            const videoSources = Array.from({ length: 140 }, (_, i) =>
                `https://archive.org/download/videos1_202512/CHANNEL1/video${i + 1}.mp4`
            );
            let currentVideoIndex = 0;

            // --- Lightweight Holographic Background ---
            const bgCanvas = getEl('holographic-bg');
            const bgCtx = bgCanvas.getContext('2d');
            let particles = [];
            const particleCount = window.innerWidth > 768 ? 60 : 30;

            function setupBackground() {
                bgCanvas.width = window.innerWidth;
                bgCanvas.height = window.innerHeight;
                particles = [];
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * bgCanvas.width,
                        y: Math.random() * bgCanvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: Math.random() * 1.5 + 0.5
                    });
                }
            }
            function drawBackground() {
                if (!bgCtx) return;
                bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
                bgCtx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
                    particles.forEach(p2 => {
                        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                        if (dist < 120) {
                            bgCtx.beginPath();
                            bgCtx.moveTo(p.x, p.y);
                            bgCtx.lineTo(p2.x, p2.y);
                            bgCtx.stroke();
                        }
                    });
                });
                requestAnimationFrame(drawBackground);
            }

            // --- Player Functions ---
            function populatePlaylist() {
                trackListEl.innerHTML = videoSources.map((path, index) => {
                    const trackName = path.split('/').pop().replace('.mp4', '').replace(/video/i, 'Signal ');
                    return `<li><div class="track-item" data-index="${index}"><span class="track-item-name">${trackName}</span></div></li>`;
                }).join('');
            }

            function loadVideo(index) {
                if (index < 0 || index >= videoSources.length) return;
                currentVideoIndex = index;
                cyclicVideo.src = videoSources[index];
                document.querySelectorAll('.track-item').forEach(item => {
                    item.classList.toggle('active', parseInt(item.dataset.index) === index);
                });
                cyclicVideo.play().catch(e => console.warn("Autoplay was prevented.", e));
            }

            function togglePlayPause() {
                cyclicVideo.paused ? cyclicVideo.play() : cyclicVideo.pause();
            }

            // --- Event Listeners ---
            playPauseBtn.addEventListener('click', togglePlayPause);
            cyclicVideo.addEventListener('play', () => playPauseBtn.textContent = '⏸');
            cyclicVideo.addEventListener('pause', () => playPauseBtn.textContent = '▶');
            cyclicVideo.addEventListener('ended', () => nextBtn.click());
            cyclicVideo.addEventListener('timeupdate', () => {
                if (cyclicVideo.duration) {
                    progressSliderInput.value = (cyclicVideo.currentTime / cyclicVideo.duration) * 100;
                }
            });

            prevBtn.addEventListener('click', () => loadVideo((currentVideoIndex - 1 + videoSources.length) % videoSources.length));
            nextBtn.addEventListener('click', () => loadVideo((currentVideoIndex + 1) % videoSources.length));

            trackListEl.addEventListener('click', (e) => {
                const item = e.target.closest('.track-item');
                if (item) loadVideo(parseInt(item.dataset.index));
            });

            progressSliderInput.addEventListener('input', () => {
                if (cyclicVideo.duration) {
                    cyclicVideo.currentTime = (progressSliderInput.value / 100) * cyclicVideo.duration;
                }
            });

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    videoContainer.requestFullscreen().catch(err => console.error(err));
                } else {
                    document.exitFullscreen();
                }
            });

            // --- Initial Load ---
            setupBackground();
            requestAnimationFrame(drawBackground);
            populatePlaylist();
            loadVideo(0);
            cyclicVideo.pause();

            // --- Three.js Tentacle Orb Initialization ---
            try {
                const canvas = document.getElementById('babylon-canvas');
                if (canvas) {
                    console.log("🦑 VideoPlayer: Canvas found. Loading modules...");
                    import('./tentacle_orb_three.js').then(async (module) => {
                        try {
                            console.log("🦑 VideoPlayer: Modules loaded.");
                            const { TentacleOrb } = module;
                            const THREE = await import('three');

                            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
                            renderer.setSize(window.innerWidth, window.innerHeight);
                            renderer.setPixelRatio(window.devicePixelRatio);

                            const scene = new THREE.Scene();

                            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                            camera.position.z = 5;

                            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                            scene.add(ambientLight);
                            const pointLight = new THREE.PointLight(0xffffff, 1);
                            pointLight.position.set(5, 5, 5);
                            scene.add(pointLight);

                            console.log("🦑 VideoPlayer: Creating TentacleOrb...");
                            const orb = new TentacleOrb(scene, new THREE.Vector3(0, 0, 0), {
                                orbSize: 1.5,
                                length: 3.5,
                                colorTheme: {
                                    orb: new THREE.Color(0x00ccff),
                                    tentacleStart: new THREE.Color(0x0055aa),
                                    tentacleEnd: new THREE.Color(0x00ccff),
                                    accent: new THREE.Color(0xff00cc)
                                }
                            });

                            function animate() {
                                requestAnimationFrame(animate);
                                try {
                                    orb.update();
                                    renderer.render(scene, camera);
                                } catch (animErr) {
                                    console.error("🦑 VideoPlayer: Animation loop error:", animErr);
                                }
                            }
                            animate();
                            console.log("🦑 VideoPlayer: Animation started.");

                            window.addEventListener('resize', () => {
                                camera.aspect = window.innerWidth / window.innerHeight;
                                camera.updateProjectionMatrix();
                                renderer.setSize(window.innerWidth, window.innerHeight);
                            });
                            console.log("🦑 Tentacle Orb (Three.js) initialized in Video Player!");
                        } catch (innerErr) {
                            console.error("🦑 VideoPlayer: Error inside module promise:", innerErr);
                        }
                    }).catch(importErr => {
                        console.error("🦑 VideoPlayer: Failed to import modules:", importErr);
                    });
                } else {
                    console.warn("🦑 VideoPlayer: Canvas element 'babylon-canvas' not found!");
                }
            } catch (e) {
                console.error("Three.js initialization failed:", e);
            }
        });
    </script>
</body>

</html>
