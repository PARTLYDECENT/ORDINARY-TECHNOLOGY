<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycle Rumble: Space-Age Training Simulator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #000 url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: #8DF7FF;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            margin: 0 auto;
            background-color: rgba(0, 20, 40, 0.9);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 195, 255, 0.7);
            border: 2px solid #0077AA;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        .conveyor {
            position: absolute;
            top: 120px;
            left: 0;
            width: 100%;
            height: 50px;
            background: repeating-linear-gradient(
                45deg,
                #111922,
                #111922 10px,
                #071118 10px,
                #071118 20px
            );
            border-top: 4px solid #0077AA;
            border-bottom: 4px solid #0077AA;
            animation: moveConveyor 5s linear infinite;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.5) inset;
        }
        
        @keyframes moveConveyor {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
        
        .bins-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            flex-wrap: wrap;
        }
        
        .bin {
            width: 110px;
            height: 130px;
            background-color: rgba(10, 30, 50, 0.9);
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.3);
            border: 2px solid #0077AA;
            margin: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .bin:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.7);
        }
        
        .bin::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .bin:hover::before {
            left: 100%;
        }
        
        .bin-label {
            color: #fff;
            font-weight: bold;
            background-color: #0077AA;
            width: 100%;
            text-align: center;
            padding: 8px 0;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            text-shadow: 0 0 5px rgba(0, 195, 255, 0.7);
            letter-spacing: 1px;
            font-size: 0.9em;
        }
        
        .item {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: grab;
            z-index: 10;
            background-size: 80% 80%;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.15s ease, opacity 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: itemEntry 0.5s ease-out;
        }
        
        @keyframes itemEntry {
            0% {
                transform: scale(0.5) rotate(180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        .item:active {
            transform: scale(1.25);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            cursor: grabbing;
        }
        
        .item.correct-drop {
            animation: correctDrop 0.5s ease-out forwards;
        }
        
        .item.incorrect-drop {
            animation: incorrectDrop 0.5s ease-out;
        }
        
        @keyframes correctDrop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        @keyframes incorrectDrop {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        
        .score-container {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 30, 60, 0.9);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.6);
            font-weight: bold;
            font-size: 1.1em;
            border: 2px solid #0077AA;
            backdrop-filter: blur(5px);
        }
        
        .title-banner {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(0, 30, 60, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.6);
            font-weight: bold;
            font-size: 1.1em;
            border: 2px solid #0077AA;
            color: #8DF7FF;
            text-shadow: 0 0 5px rgba(0, 195, 255, 0.7);
            backdrop-filter: blur(5px);
        }
        
        .level-indicator {
            position: absolute;
            top: 70px;
            left: 15px;
            background-color: rgba(0, 30, 60, 0.9);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            font-weight: bold;
            font-size: 1em;
            border: 2px solid #FFD700;
            color: #FFD700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.7);
            backdrop-filter: blur(5px);
        }
        
        .game-over, .level-complete {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 10, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8DF7FF;
            font-size: 2.5em;
            z-index: 100;
            display: none;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        
        .level-complete {
            background-color: rgba(0, 30, 10, 0.95);
            color: #00FF88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }
        
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.1em;
            background-color: #0077AA;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.6);
            text-shadow: 0 0 5px rgba(0, 195, 255, 0.7);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            background-color: #00A3E0;
            box-shadow: 0 0 15px rgba(0, 225, 255, 0.8);
            transform: scale(1.05);
        }
        
        #score { 
            color: #00FFAA; 
            transition: all 0.3s ease;
        }
        #lives { 
            color: #FF5577; 
            transition: all 0.3s ease;
        }
        #time { 
            color: #FFDD00; 
            transition: all 0.3s ease;
        }
        
        .score-pulse {
            animation: scorePulse 0.3s ease-out;
        }
        
        .lives-pulse {
            animation: livesPulse 0.3s ease-out;
        }
        
        .time-warning {
            animation: timeWarning 1s infinite;
        }
        
        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #00FF00; }
            100% { transform: scale(1); }
        }
        
        @keyframes livesPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #FF0000; }
            100% { transform: scale(1); }
        }
        
        @keyframes timeWarning {
            0%, 100% { color: #FFDD00; transform: scale(1); }
            50% { color: #FF3333; transform: scale(1.1); }
        }
        
        .scanner-line {
            position: absolute;
            height: 2px;
            width: 100%;
            background-color: rgba(0, 255, 255, 0.7);
            top: 145px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.9);
            animation: scanAnimation 1.5s infinite;
            z-index: 5;
        }
        
        @keyframes scanAnimation {
            0% { opacity: 0.2; transform: scaleX(0.8); }
            50% { opacity: 1; transform: scaleX(1); }
            100% { opacity: 0.2; transform: scaleX(0.8); }
        }
        
        .power-up {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border: 3px solid #FFFF00;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: powerUpFloat 2s ease-in-out infinite, powerUpGlow 1s ease-in-out infinite alternate;
            cursor: pointer;
            z-index: 15;
        }
        
        @keyframes powerUpFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes powerUpGlow {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 30px rgba(255, 215, 0, 1); }
        }
        
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 50, 100, 0.95);
            color: #8DF7FF;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 195, 255, 0.9);
            text-align: center;
            z-index: 200;
            border: 2px solid #00A3E0;
            animation: notificationEntry 0.5s ease-out;
            backdrop-filter: blur(10px);
        }
        
        @keyframes notificationEntry {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00FFAA;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 1s ease-out forwards;
        }
        
        @keyframes particleFloat {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0) translateY(-50px);
                opacity: 0;
            }
        }
        
        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            .game-container {
                width: 95vw;
                height: 80vh;
                max-height: 600px;
            }
            
            .title-banner, .score-container, .level-indicator {
                font-size: 0.9em;
                padding: 8px 12px;
            }
            
            .bin {
                width: 90px;
                height: 110px;
                margin: 2px;
            }
            
            .bin-label {
                font-size: 0.8em;
                padding: 6px 0;
            }
            
            .item {
                width: 60px;
                height: 60px;
            }
            
            .game-over, .level-complete {
                font-size: 2em;
            }
            
            button {
                font-size: 1em;
                padding: 10px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .game-container {
                width: 98vw;
                height: 85vh;
            }
            
            .title-banner, .score-container, .level-indicator {
                font-size: 0.8em;
                padding: 6px 10px;
            }
            
            .bin {
                width: 70px;
                height: 90px;
                margin: 1px;
            }
            
            .bin-label {
                font-size: 0.7em;
                padding: 4px 0;
            }
            
            .item {
                width: 50px;
                height: 50px;
            }
            
            .game-over, .level-complete {
                font-size: 1.5em;
            }
            
            .bins-container {
                bottom: 10px;
                padding: 5px;
            }
        }
        
        /* Special bin types for higher levels */
        .bin[data-type="paper"] .bin-label {
            background-color: #8B4513;
        }
        
        .bin[data-type="glass"] .bin-label {
            background-color: #006400;
        }
        
        .bin[data-type="electronic"] .bin-label {
            background-color: #800080;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="game-container">
        <div class="title-banner">RECYCLE STATION ALPHA</div>
        
        <div class="level-indicator">
            LEVEL: <span id="level">1</span>
        </div>
        
        <div class="score-container">
            <div>SCORE: <span id="score">0</span></div>
            <div>ENERGY: <span id="lives">3</span></div>
            <div>TIME: <span id="time">60</span>s</div>
        </div>
        
        <div class="conveyor"></div>
        <div class="scanner-line"></div>
        
        <div class="bins-container" id="bins-container">
            <div class="bin" data-type="plastic">
                <div class="bin-label">PLASTIC</div>
            </div>
            <div class="bin" data-type="metal">
                <div class="bin-label">METAL</div>
            </div>
            <div class="bin" data-type="garbage">
                <div class="bin-label">WASTE</div>
            </div>
        </div>
        
        <div class="game-over">
            <div id="game-over-text">SIMULATION COMPLETE</div>
            <div id="final-score" style="font-size: 0.4em;">FINAL SCORE: 0</div>
            <div id="final-level" style="font-size: 0.3em;">LEVEL REACHED: 1</div>
            <button id="restart-button">RESTART SIMULATION</button>
        </div>
        
        <div class="level-complete">
            <div id="level-complete-text">LEVEL COMPLETE!</div>
            <div id="level-score" style="font-size: 0.4em;">LEVEL SCORE: 0</div>
            <button id="next-level-button">NEXT LEVEL</button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create starfield background
            function createStars() {
                const starsContainer = document.querySelector('.stars');
                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    starsContainer.appendChild(star);
                }
            }
            createStars();
            
            const gameContainer = document.querySelector('.game-container');
            const binsContainer = document.getElementById('bins-container');
            const scoreElement = document.getElementById('score');
            const livesElement = document.getElementById('lives');
            const timeElement = document.getElementById('time');
            const levelElement = document.getElementById('level');
            const gameOverScreen = document.querySelector('.game-over');
            const levelCompleteScreen = document.querySelector('.level-complete');
            const finalScoreElement = document.getElementById('final-score');
            const finalLevelElement = document.getElementById('final-level');
            const levelScoreElement = document.getElementById('level-score');
            const restartButton = document.getElementById('restart-button');
            const nextLevelButton = document.getElementById('next-level-button');
            
            let score = 0;
            let lives = 3;
            let timeLeft = 60;
            let level = 1;
            let gameRunning = true;
            let levelScore = 0;
            let itemInterval;
            let powerUpActive = false;
            let powerUpType = '';
            
            // Level configurations
            const levelConfigs = {
                1: {
                    timeLimit: 60,
                    targetScore: 100,
                    itemSpeed: { min: 1.5, max: 3.5 },
                    spawnRate: { min: 1000, max: 2500 },
                    bins: ['plastic', 'metal', 'garbage'],
                    items: ['plastic', 'metal', 'garbage']
                },
                2: {
                    timeLimit: 55,
                    targetScore: 200,
                    itemSpeed: { min: 2, max: 4 },
                    spawnRate: { min: 800, max: 2000 },
                    bins: ['plastic', 'metal', 'garbage', 'paper'],
                    items: ['plastic', 'metal', 'garbage', 'paper']
                },
                3: {
                    timeLimit: 50,
                    targetScore: 350,
                    itemSpeed: { min: 2.5, max: 4.5 },
                    spawnRate: { min: 600, max: 1800 },
                    bins: ['plastic', 'metal', 'garbage', 'paper', 'glass'],
                    items: ['plastic', 'metal', 'garbage', 'paper', 'glass']
                },
                4: {
                    timeLimit: 45,
                    targetScore: 500,
                    itemSpeed: { min: 3, max: 5 },
                    spawnRate: { min: 500, max: 1500 },
                    bins: ['plastic', 'metal', 'garbage', 'paper', 'glass', 'electronic'],
                    items: ['plastic', 'metal', 'garbage', 'paper', 'glass', 'electronic']
                }
            };
            
            const itemTypes = {
                plastic: { image: 'plastic.png', glow: 'rgba(0, 180, 255, 0.8)', color: 'rgba(0, 100, 200, 0.3)' },
                metal: { image: 'metal.png', glow: 'rgba(200, 200, 200, 0.8)', color: 'rgba(180, 180, 200, 0.3)' },
                garbage: { image: 'garbage.png', glow: 'rgba(80, 200, 80, 0.8)', color: 'rgba(50, 150, 50, 0.3)' },
                paper: { image: 'paper.png', glow: 'rgba(139, 69, 19, 0.8)', color: 'rgba(139, 69, 19, 0.3)' },
                glass: { image: 'glass.png', glow: 'rgba(0, 100, 0, 0.8)', color: 'rgba(0, 100, 0, 0.3)' },
                electronic: { image: 'electronic.png', glow: 'rgba(128, 0, 128, 0.8)', color: 'rgba(128, 0, 128, 0.3)' }
            };
            
            const binLabels = {
                plastic: 'PLASTIC',
                metal: 'METAL',
                garbage: 'WASTE',
                paper: 'PAPER',
                glass: 'GLASS',
                electronic: 'E-WASTE'
            };
            
            const imagePreload = {};
            Object.keys(itemTypes).forEach(type => {
                imagePreload[type] = new Image();
                imagePreload[type].src = itemTypes[type].image;
            });
            
            let touchOffset = { x: 0, y: 0 };
            
            function setupLevel(levelNum) {
                const config = levelConfigs[levelNum] || levelConfigs[4]; // Use level 4 config for higher levels
                
                // Update time limit
                timeLeft = config.timeLimit;
                timeElement.textContent = timeLeft;
                
                // Setup bins for this level
                binsContainer.innerHTML = '';
                config.bins.forEach(binType => {
                    const bin = document.createElement('div');
                    bin.className = 'bin';
                    bin.dataset.type = binType;
                    
                    const label = document.createElement('div');
                    label.className = 'bin-label';
                    label.textContent = binLabels[binType];
                    
                    bin.appendChild(label);
                    binsContainer.appendChild(bin);
                });
            }
            
            function createItem() {
                if (!gameRunning) return;
                
                const config = levelConfigs[level] || levelConfigs[4];
                const availableItems = config.items;
                const randomType = availableItems[Math.floor(Math.random() * availableItems.length)];
                const itemData = itemTypes[randomType];
                
                const item = document.createElement('div');
                item.className = 'item';
                item.dataset.type = randomType;
                
                item.style.backgroundImage = `url(${itemData.image})`;
                item.style.boxShadow = `0 0 15px ${itemData.glow}`;
                item.style.backgroundColor = itemData.color;
                
                item.style.left = '-80px';
                item.style.top = '105px';
                
                gameContainer.appendChild(item);
                
                item.addEventListener('mousedown', startDrag);
                item.addEventListener('touchstart', startDragTouch, { passive: false });
                
                // Variable speed based on level
                const speed = config.itemSpeed.min + Math.random() * (config.itemSpeed.max - config.itemSpeed.min);
                const moveInterval = setInterval(() => {
                    if (!gameRunning) {
                        clearInterval(moveInterval);
                        return;
                    }
                    
                    const currentLeft = parseFloat(item.style.left);
                    if (currentLeft > gameContainer.clientWidth) {
                        clearInterval(moveInterval);
                        if (gameContainer.contains(item)) {
                            gameContainer.removeChild(item);
                            decrementLives();
                        }
                    } else {
                        item.style.left = (currentLeft + speed) + 'px';
                    }
                }, 30);
            }
            
            function createPowerUp() {
                if (!gameRunning || powerUpActive) return;
                
                const powerUp = document.createElement('div');
                powerUp.className = 'power-up';
                powerUp.style.left = '-60px';
                powerUp.style.top = '105px';
                
                // Power-up symbol
                powerUp.innerHTML = '⚡';
                powerUp.style.display = 'flex';
                powerUp.style.alignItems = 'center';
                powerUp.style.justifyContent = 'center';
                powerUp.style.fontSize = '24px';
                powerUp.style.color = '#FFFFFF';
                
                gameContainer.appendChild(powerUp);
                
                powerUp.addEventListener('click', activatePowerUp);
                powerUp.addEventListener('touchstart', activatePowerUp);
                
                const speed = 2;
                const moveInterval = setInterval(() => {
                    if (!gameRunning) {
                        clearInterval(moveInterval);
                        return;
                    }
                    
                    const currentLeft = parseFloat(powerUp.style.left);
                    if (currentLeft > gameContainer.clientWidth) {
                        clearInterval(moveInterval);
                        if (gameContainer.contains(powerUp)) {
                            gameContainer.removeChild(powerUp);
                        }
                    } else {
                        powerUp.style.left = (currentLeft + speed) + 'px';
                    }
                }, 30);
            }
            
            function activatePowerUp(e) {
                e.preventDefault();
                const powerUp = e.target;
                
                if (gameContainer.contains(powerUp)) {
                    gameContainer.removeChild(powerUp);
                }
                
                const powerUpTypes = ['slowMotion', 'doublePoints', 'extraLife'];
                powerUpType = powerUpTypes[Math.floor(Math.random() * powerUpTypes.length)];
                powerUpActive = true;
                
                let message = '';
                switch (powerUpType) {
                    case 'slowMotion':
                        message = '<strong>SLOW MOTION ACTIVATED!</strong><br>Items move slower for 10 seconds';
                        break;
                    case 'doublePoints':
                        message = '<strong>DOUBLE POINTS ACTIVATED!</strong><br>Score doubled for 15 seconds';
                        break;
                    case 'extraLife':
                        message = '<strong>EXTRA LIFE!</strong><br>Energy restored';
                        lives = Math.min(lives + 1, 5);
                        livesElement.textContent = lives;
                        livesElement.classList.add('score-pulse');
                        setTimeout(() => livesElement.classList.remove('score-pulse'), 300);
                        powerUpActive = false;
                        break;
                }
                
                showNotification(message, 'rgba(255, 215, 0, 0.9)', '#FFD700');
                
                if (powerUpType !== 'extraLife') {
                    const duration = powerUpType === 'slowMotion' ? 10000 : 15000;
                    setTimeout(() => {
                        powerUpActive = false;
                        powerUpType = '';
                        showNotification('<strong>POWER-UP DEACTIVATED</strong>', 'rgba(0, 50, 100, 0.9)', '#00A3E0');
                    }, duration);
                }
            }
            
            function startDrag(e) {
                const item = e.target;
                
                const startX = e.clientX - item.getBoundingClientRect().left;
                const startY = e.clientY - item.getBoundingClientRect().top;
                
                item.style.zIndex = "100";
                item.style.transform = "scale(1.1)";
                
                function moveItem(e) {
                    const gameRect = gameContainer.getBoundingClientRect();
                    const x = e.clientX - gameRect.left - startX;
                    const y = e.clientY - gameRect.top - startY;
                    
                    const maxX = gameRect.width - item.clientWidth;
                    const maxY = gameRect.height - item.clientHeight;
                    
                    item.style.left = Math.max(0, Math.min(maxX, x)) + 'px';
                    item.style.top = Math.max(0, Math.min(maxY, y)) + 'px';
                }
                
                function stopDrag() {
                    document.removeEventListener('mousemove', moveItem);
                    document.removeEventListener('mouseup', stopDrag);
                    
                    checkBinDrop(item);
                    
                    item.style.zIndex = "10";
                    item.style.transform = "scale(1)";
                }
                
                document.addEventListener('mousemove', moveItem);
                document.addEventListener('mouseup', stopDrag);
            }
            
            function startDragTouch(e) {
                e.preventDefault();
                const item = e.target;
                const touch = e.touches[0];
                
                const itemRect = item.getBoundingClientRect();
                touchOffset.x = touch.clientX - itemRect.left;
                touchOffset.y = touch.clientY - itemRect.top;
                
                item.style.zIndex = "100";
                item.style.transform = "scale(1.1)";
                
                function moveItemTouch(e) {
                    const touch = e.touches[0];
                    const gameRect = gameContainer.getBoundingClientRect();
                    
                    const x = touch.clientX - gameRect.left - touchOffset.x;
                    const y = touch.clientY - gameRect.top - touchOffset.y;
                    
                    const maxX = gameRect.width - item.clientWidth;
                    const maxY = gameRect.height - item.clientHeight;
                    
                    item.style.left = Math.max(0, Math.min(maxX, x)) + 'px';
                    item.style.top = Math.max(0, Math.min(maxY, y)) + 'px';
                }
                
                function stopDragTouch() {
                    document.removeEventListener('touchmove', moveItemTouch);
                    document.removeEventListener('touchend', stopDragTouch);
                    
                    checkBinDrop(item);
                    
                    item.style.zIndex = "10";
                    item.style.transform = "scale(1)";
                }
                
                document.addEventListener('touchmove', moveItemTouch, { passive: false });
                document.addEventListener('touchend', stopDragTouch);
            }
            
            function checkBinDrop(item) {
                const itemRect = item.getBoundingClientRect();
                const itemType = item.dataset.type;
                let dropped = false;
                
                const bins = document.querySelectorAll('.bin');
                bins.forEach(bin => {
                    const binRect = bin.getBoundingClientRect();
                    const binType = bin.dataset.type;
                    
                    const itemCenterX = itemRect.left + itemRect.width / 2;
                    const itemCenterY = itemRect.top + itemRect.height / 2;
                    
                    if (
                        itemCenterX >= binRect.left &&
                        itemCenterX <= binRect.right &&
                        itemCenterY >= binRect.top &&
                        itemCenterY <= binRect.bottom
                    ) {
                        if (itemType === binType) {
                            incrementScore();
                            bin.style.boxShadow = "0 0 30px rgba(0, 255, 100, 0.8)";
                            setTimeout(() => bin.style.boxShadow = "0 0 15px rgba(0, 195, 255, 0.3)", 300);
                            
                            item.classList.add('correct-drop');
                            createParticles(itemRect.left + itemRect.width/2, itemRect.top + itemRect.height/2, '#00FFAA');
                            
                            setTimeout(() => {
                                if (gameContainer.contains(item)) {
                                    gameContainer.removeChild(item);
                                }
                            }, 500);
                        } else {
                            decrementLives();
                            bin.style.boxShadow = "0 0 30px rgba(255, 50, 50, 0.8)";
                            setTimeout(() => bin.style.boxShadow = "0 0 15px rgba(0, 195, 255, 0.3)", 300);
                            
                            item.classList.add('incorrect-drop');
                            createParticles(itemRect.left + itemRect.width/2, itemRect.top + itemRect.height/2, '#FF5577');
                            
                            setTimeout(() => {
                                item.classList.remove('incorrect-drop');
                                item.style.top = '105px';
                                item.style.transition = 'left 0.5s ease-out, top 0.5s ease-out';
                                item.style.left = '0px';
                                setTimeout(() => {
                                    item.style.transition = 'transform 0.15s ease';
                                }, 500);
                            }, 500);
                        }
                        
                        dropped = true;
                    }
                });
                
                if (!dropped) {
                    item.style.top = '105px';
                    item.style.transition = 'left 0.5s ease-out, top 0.5s ease-out';
                    item.style.left = '0px';
                    setTimeout(() => {
                        item.style.transition = 'transform 0.15s ease';
                    }, 500);
                }
            }
            
            function createParticles(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.background = color;
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.transform = `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px)`;
                    
                    gameContainer.appendChild(particle);
                    
                    setTimeout(() => {
                        if (gameContainer.contains(particle)) {
                            gameContainer.removeChild(particle);
                        }
                    }, 1000);
                }
            }
            
            function incrementScore() {
                const points = (powerUpType === 'doublePoints') ? 20 : 10;
                score += points;
                levelScore += points;
                scoreElement.textContent = score;
                
                scoreElement.classList.add('score-pulse');
                setTimeout(() => scoreElement.classList.remove('score-pulse'), 300);
                
                // Check level completion
                const config = levelConfigs[level] || levelConfigs[4];
                if (levelScore >= config.targetScore) {
                    completeLevel();
                }
            }
            
            function decrementLives() {
                lives--;
                livesElement.textContent = lives;
                
                livesElement.classList.add('lives-pulse');
                setTimeout(() => livesElement.classList.remove('lives-pulse'), 300);
                
                if (lives <= 0) {
                    endGame();
                }
            }
            
            function updateTimer() {
                timeLeft--;
                timeElement.textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    timeElement.classList.add('time-warning');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }
            
            function completeLevel() {
                gameRunning = false;
                
                document.querySelectorAll('.item').forEach(item => {
                    if (gameContainer.contains(item)) {
                        gameContainer.removeChild(item);
                    }
                });
                
                levelScoreElement.textContent = `LEVEL SCORE: ${levelScore}`;
                levelCompleteScreen.style.display = 'flex';
            }
            
            function nextLevel() {
                level++;
                levelScore = 0;
                lives = Math.min(lives + 1, 5); // Bonus life for completing level
                
                levelElement.textContent = level;
                livesElement.textContent = lives;
                
                setupLevel(level);
                levelCompleteScreen.style.display = 'none';
                
                showNotification(`<strong>LEVEL ${level} INITIATED</strong><br>New recycling protocols active`, 'rgba(0, 50, 100, 0.9)', '#00A3E0');
                
                gameRunning = true;
                startGameLoop();
            }
            
            function endGame() {
                gameRunning = false;
                
                document.querySelectorAll('.item').forEach(item => {
                    if (gameContainer.contains(item)) {
                        gameContainer.removeChild(item);
                    }
                });
                
                finalScoreElement.textContent = `FINAL SCORE: ${score}`;
                finalLevelElement.textContent = `LEVEL REACHED: ${level}`;
                gameOverScreen.style.display = 'flex';
            }
            
            function startGame() {
                score = 0;
                lives = 3;
                level = 1;
                levelScore = 0;
                gameRunning = true;
                powerUpActive = false;
                powerUpType = '';
                
                scoreElement.textContent = score;
                livesElement.textContent = lives;
                levelElement.textContent = level;
                timeElement.classList.remove('time-warning');
                
                setupLevel(level);
                gameOverScreen.style.display = 'none';
                levelCompleteScreen.style.display = 'none';
                
                startGameLoop();
            }
            
            function startGameLoop() {
                const config = levelConfigs[level] || levelConfigs[4];
                
                // Item spawning with variable intervals
                const createItemWithRandomDelay = () => {
                    if (!gameRunning) return;
                    
                    createItem();
                    let nextDelay = config.spawnRate.min + Math.random() * (config.spawnRate.max - config.spawnRate.min);
                    
                    // Slow motion power-up effect
                    if (powerUpType === 'slowMotion') {
                        nextDelay *= 1.5;
                    }
                    
                    setTimeout(createItemWithRandomDelay, nextDelay);
                };
                
                createItemWithRandomDelay();
                
                // Power-up spawning (random chance every 15-30 seconds)
                const createPowerUpWithRandomDelay = () => {
                    if (!gameRunning) return;
                    
                    if (Math.random() < 0.3) { // 30% chance
                        createPowerUp();
                    }
                    
                    const nextDelay = 15000 + Math.random() * 15000; // 15-30 seconds
                    setTimeout(createPowerUpWithRandomDelay, nextDelay);
                };
                
                setTimeout(createPowerUpWithRandomDelay, 10000); // First power-up after 10 seconds
                
                // Timer
                const timerInterval = setInterval(() => {
                    if (!gameRunning) {
                        clearInterval(timerInterval);
                        return;
                    }
                    updateTimer();
                }, 1000);
            }
            
            function showNotification(message, bgColor = 'rgba(0, 50, 100, 0.9)', borderColor = '#00A3E0') {
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.style.background = bgColor;
                notification.style.borderColor = borderColor;
                notification.innerHTML = message;
                
                gameContainer.appendChild(notification);
                
                setTimeout(() => {
                    if (gameContainer.contains(notification)) {
                        gameContainer.removeChild(notification);
                    }
                }, 3000);
            }
            
            // Hidden Feature: Rapid Fire Mode (Click the score 5 times quickly)
            let clickCount = 0;
            let lastClickTime = 0;
            scoreElement.addEventListener('click', () => {
                const now = Date.now();
                if (now - lastClickTime < 500) {
                    clickCount++;
                    if (clickCount >= 5) {
                        clickCount = 0;
                        
                        showNotification('<strong>HYPER MODE ACTIVATED!</strong><br>Increased item flow rate!', 'rgba(100, 0, 100, 0.9)', '#CC00CC');
                        
                        // Increase item spawn rate for 15 seconds
                        const createRapidItems = () => {
                            if (!gameRunning) return;
                            createItem();
                            setTimeout(createRapidItems, 400);
                        };
                        
                        createRapidItems();
                    }
                } else {
                    clickCount = 1;
                }
                lastClickTime = now;
            });
            
            // Event listeners
            restartButton.addEventListener('click', startGame);
            nextLevelButton.addEventListener('click', nextLevel);
            
            // Start the game
            startGame();
        });
    </script>
</body>
</html>
