<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Eco-Sorter | NEO-SORT PROTOCOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            user-select: none;
            touch-action: none;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .text-shadow {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .instruction-fade {
            animation: fadeOut 3s forwards;
            animation-delay: 4s;
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
        .bin-indicator {
            transition: transform 0.2s;
            font-family: 'Orbitron', sans-serif;
        }
        .bin-indicator.active {
            transform: scale(1.1) translateY(-5px);
            border: 2px solid white;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .floating-score {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            pointer-events: none;
            animation: floatUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.6);
            z-index: 100;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -70%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
        }

        /* Aria Subtitle */
        .aria-subtitle {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00f0ff;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            text-align: center;
            width: 85%;
            max-width: 650px;
            backdrop-filter: blur(5px);
        }

        .aria-subtitle.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Aria Subtitle -->
    <div class="aria-subtitle" id="aria-subtitle"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between hidden">
        <!-- Top Bar -->
        <div class="p-6 flex justify-between items-start">
            <div class="text-white font-black text-3xl text-shadow flex flex-col font-['Orbitron']">
                <span>SCORE <span id="score-display" class="text-yellow-300">0</span></span>
                <span id="combo-display" class="text-sm text-green-300 opacity-0 transition-opacity">Combo x1!</span>
            </div>
            <div class="text-white font-black text-2xl text-shadow flex gap-1" id="lives-display">
                ❤️❤️❤️
            </div>
        </div>

        <!-- Center Instructions -->
        <div class="absolute inset-0 flex items-center justify-center instruction-fade">
            <div class="bg-black/60 text-white px-6 py-3 rounded-full backdrop-blur-md text-lg font-bold tracking-wider font-['Orbitron'] border border-white/20">
                Tap Left / Right or use A & D to Rotate
            </div>
        </div>

        <!-- Bottom Legend -->
        <div class="p-6 w-full flex justify-center gap-2 sm:gap-6 mb-4">
            <div id="ind-0" class="bin-indicator bg-blue-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg flex items-center gap-2 active">
                <div class="w-3 h-3 bg-white rounded-sm"></div> Paper
            </div>
            <div id="ind-1" class="bin-indicator bg-yellow-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg flex items-center gap-2">
                <div class="w-3 h-4 bg-white rounded-sm"></div> Plastic
            </div>
            <div id="ind-2" class="bin-indicator bg-green-500 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg flex items-center gap-2">
                <div class="w-4 h-4 bg-white rounded-full" style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);"></div> Glass
            </div>
            <div id="ind-3" class="bin-indicator bg-amber-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-lg flex items-center gap-2">
                <div class="w-4 h-4 bg-white rounded-full"></div> Organic
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-md">
        <div class="bg-gray-900/90 text-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-white/10">
            <h1 class="text-4xl font-black text-green-400 mb-2 font-['Orbitron']">ECO-SORTER</h1>
            <p class="text-gray-400 mb-6 font-medium font-['Orbitron'] text-xs tracking-widest">NEO-SORT PROTOCOL v4.0</p>
            
            <div class="grid grid-cols-2 gap-4 mb-8 text-xs font-bold font-['Orbitron']">
                <div class="bg-blue-500/20 p-3 rounded-xl border border-blue-500/30">
                    <div class="text-blue-400 mb-1">BLUE BIN</div>
                    <div class="text-gray-300">Paper (Cubes)</div>
                </div>
                <div class="bg-yellow-500/20 p-3 rounded-xl border border-yellow-500/30">
                    <div class="text-yellow-400 mb-1">YELLOW BIN</div>
                    <div class="text-gray-300">Plastic (Cylinders)</div>
                </div>
                <div class="bg-green-500/20 p-3 rounded-xl border border-green-500/30">
                    <div class="text-green-400 mb-1">GREEN BIN</div>
                    <div class="text-gray-300">Glass (Gems)</div>
                </div>
                <div class="bg-amber-700/20 p-3 rounded-xl border border-amber-700/30">
                    <div class="text-amber-500 mb-1">BROWN BIN</div>
                    <div class="text-gray-300">Organic (Spheres)</div>
                </div>
            </div>

            <button id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg shadow-green-500/30 transition-all active:scale-95 font-['Orbitron']">
                INITIATE
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-gray-900 border border-red-500/30 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <h2 class="text-4xl font-black text-red-500 mb-2 font-['Orbitron']">FAILED</h2>
            <p class="text-gray-400 mb-6 font-medium">SIMULATION TERMINATED</p>
            
            <div class="text-6xl font-black text-white mb-2 font-['Orbitron']" id="final-score">0</div>
            <p class="text-gray-500 text-xs mb-8 uppercase tracking-widest">Final Data Recovered</p>
            
            <button id="restart-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xl py-4 rounded-2xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 font-['Orbitron']">
                REBOOT
            </button>
        </div>
    </div>

    <script src="../narrator.js"></script>
    <script>
        // --- ARIA DIALOGUE & AUDIO ---
        const ariaSubtitle = document.getElementById('aria-subtitle');
        const ariaDialogue = {
            gameStart: ["NEO-SORT PROTOCOL INITIATED. COMMENCE RECYCLING.", "SIMULATION ONLINE. PROCEED WITH CAUTION.", "ENTERING RECYCLING SECTOR. OPTIMIZE THROUGHPUT."],
            correct: ["DATA POINT ACQUIRED.", "EFFICIENCY IMPROVING.", "OPTIMAL SORT.", "RECOVERY COMPLETE."],
            wrong: ["ERROR: INCORRECT CLASSIFICATION.", "CONTAMINATION DETECTED.", "SORTING FAILURE.", "INEFFICIENT PERFORMANCE."],
            powerup: ["QUANTUM ANOMALY HARNESSED.", "SYSTEM OVERCLOCK DETECTED.", "VITALITY RESTORED."],
            combo2: ["SYNERGY DETECTED.", "DOUBLE SORT PROTOCOL ACTIVE."],
            combo3: ["TRIPLE SYNERGY ENGAGED.", "QUANTUM THROUGHPUT OPTIMIZED."],
            combo4: ["HYPER-SORT ACTIVE.", "UNSTOPPABLE LOGISTICS DETECTED."],
            gameOver: ["SIMULATION TERMINATED. SYSTEM OFFLINE.", "FINAL ANALYSIS: REBOOT REQUIRED."]
        };

        window.ariaRandom = function (type, delay = 0) {
            if (!ariaDialogue[type]) return;
            const quotes = ariaDialogue[type];
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            setTimeout(() => {
                ariaSubtitle.textContent = quote;
                ariaSubtitle.classList.add('visible');
                if (window.AriaNarrator) {
                    window.AriaNarrator.speak(quote, null, () => {
                        setTimeout(() => { if (ariaSubtitle.textContent === quote) ariaSubtitle.classList.remove('visible'); }, 1000);
                    });
                } else {
                    setTimeout(() => ariaSubtitle.classList.remove('visible'), 3000);
                }
            }, delay);
        };

        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSFX(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); gain.gain.value = 0.08;
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'combo') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'powerup') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- GAME STATE ---
        let score = 0;
        let lives = 3;
        let combo = 0;
        let gameActive = false;
        let baseSpeed = 0.08;
        let currentSpeed = baseSpeed;
        let spawnRate = 120; 
        let frameCount = 0;
        
        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 30);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, -2, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 15, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const floorGeo = new THREE.CylinderGeometry(15, 15, 1, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x24292e, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -4.5;
        floor.receiveShadow = true;
        scene.add(floor);

        const carousel = new THREE.Group();
        carousel.position.y = -2;
        scene.add(carousel);

        let targetRotation = 0;
        let currentRotation = 0;

        const binTypes = [
            { id: 0, name: 'Paper', color: 0x3b82f6, hex: '#3b82f6' },
            { id: 1, name: 'Plastic', color: 0xeab308, hex: '#eab308' },
            { id: 2, name: 'Glass', color: 0x22c55e, hex: '#22c55e' },
            { id: 3, name: 'Organic', color: 0xb45309, hex: '#b45309' }
        ];

        function createBin(colorHex, x, z) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(1.4, 1.2, 2.5, 16, 1, true);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, side: THREE.DoubleSide });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);
            const bottomGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16);
            const bottom = new THREE.Mesh(bottomGeo, new THREE.MeshStandardMaterial({ color: colorHex }));
            bottom.position.y = -1.15;
            group.add(bottom);
            group.position.set(x, 0, z);
            return group;
        }

        const binDistance = 4;
        const bins = [];
        bins.push(createBin(binTypes[0].color, 0, binDistance));
        bins.push(createBin(binTypes[1].color, binDistance, 0));
        bins.push(createBin(binTypes[2].color, 0, -binDistance));
        bins.push(createBin(binTypes[3].color, -binDistance, 0));
        bins.forEach(bin => carousel.add(bin));

        const activeTrash = [];
        const trashGeometries = [
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16),
            new THREE.DodecahedronGeometry(0.8),
            new THREE.SphereGeometry(0.8, 16, 16),
            new THREE.TorusKnotGeometry(0.6, 0.2, 64, 8)
        ];

        function spawnTrashItem() {
            let typeId = Math.floor(Math.random() * 4);
            const isBonus = Math.random() < 0.08;
            if (isBonus) typeId = 4;
            let material = new THREE.MeshStandardMaterial({ 
                color: typeId === 4 ? 0xffd700 : binTypes[typeId].color,
                emissive: typeId === 4 ? 0xaa8800 : 0x000000,
                emissiveIntensity: 0.4
            });
            const mesh = new THREE.Mesh(trashGeometries[typeId], material);
            mesh.position.set(0, 10, binDistance);
            mesh.castShadow = true;
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            activeTrash.push({ mesh, typeId, rotSpeed: { x: Math.random()*0.1, y: Math.random()*0.1, z: Math.random()*0.1 }, caught: false });
            scene.add(mesh);
        }

        const particles = [];
        const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        function createExplosion(position, colorHex) {
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for(let i=0; i<15; i++) {
                const mesh = new THREE.Mesh(particleGeo, mat);
                mesh.position.copy(position);
                const velocity = new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.2, (Math.random()-0.5)*0.3);
                scene.add(mesh);
                particles.push({ mesh, velocity, life: 1.0 });
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = score;
            let hearts = "";
            for(let i=0; i<Math.max(3, lives); i++) hearts += i < lives ? "❤️" : "🖤";
            document.getElementById('lives-display').innerText = hearts;
            const currentFront = getCurrentFrontBinIndex();
            for(let i=0; i<4; i++) {
                const el = document.getElementById(`ind-${i}`);
                if(i === currentFront) el.classList.add('active'); else el.classList.remove('active');
            }
        }

        function getCurrentFrontBinIndex() {
            let shifts = Math.round(targetRotation / (Math.PI / 2));
            return ((-shifts % 4) + 4) % 4; 
        }

        function triggerCombo(isHit) {
            const comboEl = document.getElementById('combo-display');
            if(isHit) {
                combo++;
                if(combo > 1) {
                    comboEl.innerText = `Combo x${combo}!`;
                    comboEl.style.opacity = '1';
                    ariaRandom('combo' + Math.min(4, combo));
                }
                playSFX(combo >= 3 ? 'combo' : 'correct');
            } else {
                combo = 0;
                comboEl.style.opacity = '0';
                playSFX('wrong');
                ariaRandom('wrong');
            }
        }

        function checkCollision(trashObj, index) {
            if (trashObj.mesh.position.y <= 0 && !trashObj.caught) {
                trashObj.caught = true;
                const frontBinType = getCurrentFrontBinIndex();
                if (trashObj.typeId === frontBinType || trashObj.typeId === 4) {
                    const isGold = trashObj.typeId === 4;
                    score += isGold ? 50 : 10;
                    triggerCombo(true);
                    createExplosion(trashObj.mesh.position, isGold ? 0xffd700 : binTypes[frontBinType].color);
                    if (isGold) { lives++; playSFX('powerup'); ariaRandom('powerup'); }
                    currentSpeed = Math.min(baseSpeed + (score * 0.0005), 0.3);
                    spawnRate = Math.max(120 - Math.floor(score / 50), 40);
                } else {
                    lives--;
                    triggerCombo(false);
                    if (lives <= 0) endGame();
                }
                scene.remove(trashObj.mesh);
                activeTrash.splice(index, 1);
                updateUI();
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            score = 0; lives = 3; combo = 0; currentSpeed = baseSpeed; spawnRate = 120;
            activeTrash.forEach(t => scene.remove(t.mesh)); activeTrash.length = 0;
            gameActive = true;
            updateUI();
            ariaRandom('gameStart');
        }

        function endGame() {
            gameActive = false;
            document.getElementById('ui-layer').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            ariaRandom('gameOver');
        }

        function rotateLeft() { if(!gameActive) return; targetRotation += Math.PI / 2; updateUI(); }
        function rotateRight() { if(!gameActive) return; targetRotation -= Math.PI / 2; updateUI(); }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') rotateLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rotateRight();
        });

        window.addEventListener('mousedown', (e) => {
            if(e.target.tagName === 'BUTTON') return;
            if (e.clientX < window.innerWidth / 2) rotateLeft(); else rotateRight();
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function animate() {
            requestAnimationFrame(animate);
            currentRotation += (targetRotation - currentRotation) * 0.15;
            carousel.rotation.y = currentRotation;
            if (gameActive) {
                frameCount++;
                if (frameCount >= spawnRate) { spawnTrashItem(); frameCount = 0; }
                for (let i = activeTrash.length - 1; i >= 0; i--) {
                    const t = activeTrash[i];
                    t.mesh.position.y -= currentSpeed;
                    t.mesh.rotation.x += t.rotSpeed.x;
                    t.mesh.rotation.y += t.rotSpeed.y;
                    t.mesh.rotation.z += t.rotSpeed.z;
                    checkCollision(t, i);
                    if (t.mesh.position.y < -10) { scene.remove(t.mesh); activeTrash.splice(i, 1); }
                }
            }
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.velocity);
                p.velocity.y -= 0.01; p.life -= 0.02; p.mesh.scale.setScalar(p.life);
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = animate;
    </script>
</body>
</html>
