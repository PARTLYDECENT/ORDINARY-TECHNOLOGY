<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAST STAND // ARCADE CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oxanium:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050202;
            --accent-red: #ff3333;
            --accent-glow: rgba(255, 51, 51, 0.4);
            --text-primary: #f0f0f0;
            --text-muted: #887777;
            --border-glow: 0 0 15px rgba(255, 51, 51, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Ambient scanlines and CRT vignette */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 10, 10, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.85) 100%);
            z-index: 101;
            pointer-events: none;
        }

        /* Top HUD Bar */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            border-bottom: 1px solid rgba(255, 51, 51, 0.2);
            background: rgba(10, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 10;
        }

        .hud-title {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--accent-red);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .hud-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Arcade Cabinet Frame */
        .arcade-container {
            width: 90%;
            max-width: 960px;
            height: 70vh;
            max-height: 720px;
            background: #000;
            border: 1px solid rgba(255, 51, 51, 0.3);
            border-radius: 8px;
            position: relative;
            box-shadow: var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            overflow: hidden;
        }

        /* Ruffle element sizing */
        #ruffle-player-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ruffle-player-wrapper ruffle-player {
            width: 100%;
            height: 100%;
        }

        /* Corner accents for sc-fi cabinet vibe */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            z-index: 6;
        }
        .corner.top-left { top: -1px; left: -1px; border-top-color: var(--accent-red); border-left-color: var(--accent-red); }
        .corner.top-right { top: -1px; right: -1px; border-top-color: var(--accent-red); border-right-color: var(--accent-red); }
        .corner.bottom-left { bottom: -1px; left: -1px; border-bottom-color: var(--accent-red); border-left-color: var(--accent-red); }
        .corner.bottom-right { bottom: -1px; right: -1px; border-bottom-color: var(--accent-red); border-right-color: var(--accent-red); }

        /* Navigation Button */
        .btn-back {
            display: inline-block;
            background: rgba(255, 51, 51, 0.05);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.1);
        }

        .btn-back:hover {
            background: var(--accent-red);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--accent-red);
            transform: translateY(-2px);
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            background-color: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 8;
            transition: opacity 0.8s ease;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255, 51, 51, 0.1);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Ruffle Flash Emulator CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <header>
        <div class="hud-title">THE LAST STAND</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span>SYSTEMS: ONLINE // FLASH_EMU</span>
        </div>
        <div>
            <a href="index.html" class="btn-back">Return to System</a>
        </div>
    </header>

    <div class="arcade-container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="loading-screen" id="loading-screen">
            <div class="loader-ring"></div>
            <div style="letter-spacing: 5px; color: var(--accent-red); font-size: 0.9rem;">LOAD_SWF_MODULE...</div>
        </div>

        <div id="ruffle-player-wrapper"></div>
    </div>

    <script>
        // Setup Ruffle configuration
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            autoplay: "on",
            unmuteAnchor: false,
            splashScreen: false
        };

        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player-wrapper");
            container.appendChild(player);

            // Load the local Last Stand SWF file
            player.load({
                url: "assets/games/the-last-stand-269.swf",
                allowScriptAccess: true
            }).then(() => {
                // Fade out loading screen when game is initialized
                setTimeout(() => {
                    const loader = document.getElementById("loading-screen");
                    if (loader) {
                        loader.style.opacity = "0";
                        setTimeout(() => loader.style.display = "none", 800);
                    }
                }, 500);
            }).catch((err) => {
                console.error("Ruffle failed to load SWF: ", err);
                const loaderText = document.querySelector("#loading-screen div:last-child");
                if (loaderText) {
                    loaderText.innerText = "ERROR: SWF_LOAD_FAILED";
                }
            });
        });
    </script>
</body>
</html>
