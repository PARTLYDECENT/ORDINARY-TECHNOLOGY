<script>
// Drop-in Command Panel for HTML Sites - Fully Functional Version
(function() {
    // Create command panel UI
    const commandPanel = document.createElement('div');
    commandPanel.id = 'command-panel';
    commandPanel.innerHTML = `
        <div id="command-header">
            <span>Command Panel</span>
            <button id="minimize-btn">−</button>
            <button id="close-btn">×</button>
        </div>
        <div id="command-body">
            <div id="command-output"></div>
            <div id="command-input-container">
                <input type="text" id="command-input" placeholder="Type command (help for options)">
                <button id="execute-btn">Run</button>
            </div>
            <div id="command-tabs">
                <button class="tab-btn active" data-tab="history">History</button>
                <button class="tab-btn" data-tab="elements">Elements</button>
                <button class="tab-btn" data-tab="styles">Styles</button>
            </div>
            <div id="command-tab-content">
                <div id="history-tab" class="tab-content active">
                    <div id="command-history"></div>
                </div>
                <div id="elements-tab" class="tab-content">
                    <div id="elements-list"></div>
                </div>
                <div id="styles-tab" class="tab-content">
                    <div id="styles-list"></div>
                </div>
            </div>
        </div>
    `;
    
    // Style the command panel
    const style = document.createElement('style');
    style.textContent = `
        #command-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            max-height: 600px;
            background-color: #2d2d30;
            color: #d4d4d4;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            font-family: 'Consolas', 'Monaco', monospace;
            z-index: 10000;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        #command-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #007acc;
            color: white;
            border-radius: 8px 8px 0 0;
            cursor: move;
        }
        
        #minimize-btn, #close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }
        
        #close-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        #command-body {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        #command-output {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            min-height: 80px;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        #command-input-container {
            display: flex;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        
        #command-input {
            flex: 1;
            padding: 8px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            font-family: inherit;
        }
        
        #execute-btn {
            margin-left: 8px;
            padding: 8px 12px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #command-tabs {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px solid #3e3e42;
            flex-shrink: 0;
        }
        
        .tab-btn {
            background: none;
            border: none;
            color: #d4d4d4;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-right: 5px;
        }
        
        .tab-btn.active {
            border-bottom: 2px solid #007acc;
            color: #007acc;
        }
        
        #command-tab-content {
            flex: 1;
            overflow-y: auto;
        }
        
        .tab-content {
            display: none;
            height: 100%;
        }
        
        .tab-content.active {
            display: block;
        }
        
        #command-history, #elements-list, #styles-list {
            background-color: #1e1e1e;
            border-radius: 4px;
            padding: 10px;
            height: 100%;
            overflow-y: auto;
        }
        
        .command-history-item, .element-item, .style-item {
            padding: 6px 8px;
            border-bottom: 1px solid #3e3e42;
            cursor: pointer;
            font-size: 13px;
        }
        
        .command-history-item:last-child, .element-item:last-child, .style-item:last-child {
            border-bottom: none;
        }
        
        .element-item:hover, .style-item:hover {
            background-color: #2a2d2e;
        }
        
        .element-item.selected {
            background-color: #094771;
        }
        
        #command-panel.minimized {
            width: 200px;
            height: 40px;
        }
        
        #command-panel.minimized #command-body {
            display: none;
        }
        
        .highlight-element {
            outline: 2px dashed #ff9900 !important;
            outline-offset: 2px !important;
        }
        
        .color-picker {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .style-value {
            float: right;
            color: #569cd6;
        }
        
        .style-input {
            width: 100%;
            padding: 4px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
        }
    `;
    
    // Add to document
    document.head.appendChild(style);
    document.body.appendChild(commandPanel);
    
    // Command panel functionality
    const commandInput = document.getElementById('command-input');
    const executeBtn = document.getElementById('execute-btn');
    const minimizeBtn = document.getElementById('minimize-btn');
    const closeBtn = document.getElementById('close-btn');
    const commandOutput = document.getElementById('command-output');
    const commandHistory = document.getElementById('command-history');
    const commandPanelElement = document.getElementById('command-panel');
    const elementsList = document.getElementById('elements-list');
    const stylesList = document.getElementById('styles-list');
    
    let selectedElement = null;
    let originalStyles = new Map();
    let commandHistoryArray = [];
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tabName = btn.getAttribute('data-tab');
            
            // Update active tab button
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Update active tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');
            
            // Refresh content if needed
            if (tabName === 'elements') {
                updateElementsList();
            } else if (tabName === 'styles' && selectedElement) {
                updateStylesList();
            }
        });
    });
    
    // Make panel draggable
    let isDragging = false;
    let dragOffsetX, dragOffsetY;
    
    document.getElementById('command-header').addEventListener('mousedown', (e) => {
        isDragging = true;
        dragOffsetX = e.clientX - commandPanelElement.offsetLeft;
        dragOffsetY = e.clientY - commandPanelElement.offsetTop;
    });
    
    document.addEventListener('mousemove', (e) => {
        if (isDragging) {
            commandPanelElement.style.left = `${e.clientX - dragOffsetX}px`;
            commandPanelElement.style.top = `${e.clientY - dragOffsetY}px`;
            commandPanelElement.style.bottom = 'auto';
            commandPanelElement.style.right = 'auto';
        }
    });
    
    document.addEventListener('mouseup', () => {
        isDragging = false;
    });
    
    // Minimize/restore panel
    minimizeBtn.addEventListener('click', () => {
        commandPanelElement.classList.toggle('minimized');
        minimizeBtn.textContent = commandPanelElement.classList.contains('minimized') ? '+' : '−';
    });
    
    // Close panel
    closeBtn.addEventListener('click', () => {
        commandPanelElement.style.display = 'none';
    });
    
    // Execute command
    function executeCommand() {
        const command = commandInput.value.trim();
        if (!command) return;
        
        // Add to history
        commandHistoryArray.unshift(command);
        if (commandHistoryArray.length > 50) commandHistoryArray.pop();
        
        const historyItem = document.createElement('div');
        historyItem.className = 'command-history-item';
        historyItem.textContent = `> ${command}`;
        historyItem.addEventListener('click', () => {
            commandInput.value = command;
            commandInput.focus();
        });
        commandHistory.prepend(historyItem);
        
        // Process command
        processCommand(command);
        
        // Clear input
        commandInput.value = '';
    }
    
    executeBtn.addEventListener('click', executeCommand);
    commandInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            executeCommand();
        }
    });
    
    // Update elements list
    function updateElementsList() {
        elementsList.innerHTML = '';
        
        const allElements = document.querySelectorAll('*');
        const elementTypes = {};
        
        allElements.forEach(el => {
            const tagName = el.tagName.toLowerCase();
            if (!elementTypes[tagName]) {
                elementTypes[tagName] = [];
            }
            elementTypes[tagName].push(el);
        });
        
        for (const [type, elements] of Object.entries(elementTypes)) {
            const category = document.createElement('div');
            category.innerHTML = `<strong>${type} (${elements.length})</strong>`;
            category.style.marginTop = '10px';
            category.style.marginBottom = '5px';
            elementsList.appendChild(category);
            
            // Show first 5 elements of this type
            const limit = Math.min(5, elements.length);
            for (let i = 0; i < limit; i++) {
                const el = elements[i];
                const item = document.createElement('div');
                item.className = 'element-item';
                
                let description = `<${type}`;
                if (el.id) description += `#${el.id}`;
                if (el.className) description += `.${el.className.replace(/\s+/g, '.')}`;
                description += '>';
                
                // Add some text content if available
                if (el.textContent && el.textContent.trim() && el.textContent.length < 50) {
                    description += ` - "${el.textContent.trim()}"`;
                }
                
                item.innerHTML = description;
                item.addEventListener('click', () => {
                    selectSpecificElement(el);
                });
                
                elementsList.appendChild(item);
            }
            
            if (elements.length > 5) {
                const more = document.createElement('div');
                more.className = 'element-item';
                more.style.fontStyle = 'italic';
                more.textContent = `... and ${elements.length - 5} more`;
                elementsList.appendChild(more);
            }
        }
    }
    
    // Update styles list for selected element
    function updateStylesList() {
        if (!selectedElement) {
            stylesList.innerHTML = 'No element selected';
            return;
        }
        
        stylesList.innerHTML = '';
        
        const computedStyle = window.getComputedStyle(selectedElement);
        const styleProperties = [
            'color', 'background-color', 'font-size', 'font-family', 'font-weight',
            'width', 'height', 'padding', 'margin', 'border', 'border-radius',
            'display', 'position', 'top', 'left', 'right', 'bottom', 'z-index',
            'opacity', 'visibility', 'transform', 'transition', 'text-align',
            'cursor', 'overflow', 'box-shadow', 'text-decoration'
        ];
        
        styleProperties.forEach(prop => {
            const item = document.createElement('div');
            item.className = 'style-item';
            
            const value = computedStyle.getPropertyValue(prop);
            
            item.innerHTML = `
                <div>${prop.replace(/-/g, ' ')}</div>
                <div class="style-value">${value}</div>
            `;
            
            // Make it editable
            item.addEventListener('click', () => {
                const input = document.createElement('input');
                input.className = 'style-input';
                input.value = value;
                
                item.innerHTML = '';
                item.appendChild(input);
                input.focus();
                input.select();
                
                const saveValue = () => {
                    selectedElement.style[prop] = input.value;
                    updateStylesList();
                };
                
                input.addEventListener('blur', saveValue);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        saveValue();
                    } else if (e.key === 'Escape') {
                        updateStylesList();
                    }
                });
            });
            
            stylesList.appendChild(item);
        });
    }
    
    // Process commands
    function processCommand(command) {
        const parts = command.toLowerCase().split(' ');
        const cmd = parts[0];
        const args = parts.slice(1);
        
        switch (cmd) {
            case 'help':
                showHelp();
                break;
                
            case 'select':
                selectElement();
                break;
                
            case 'hide':
                hideElement();
                break;
                
            case 'show':
                showElement();
                break;
                
            case 'color':
                changeColor(args.join(' '));
                break;
                
            case 'background':
                changeBackground(args.join(' '));
                break;
                
            case 'fontsize':
                changeFontSize(args.join(' '));
                break;
                
            case 'dark':
                toggleDarkMode(true);
                break;
                
            case 'light':
                toggleDarkMode(false);
                break;
                
            case 'reset':
                resetStyles();
                break;
                
            case 'info':
                showPageInfo();
                break;
                
            case 'elements':
                listElements(args[0]);
                break;
                
            case 'remove':
                removeElement();
                break;
                
            case 'disable':
                toggleDisable(true);
                break;
                
            case 'enable':
                toggleDisable(false);
                break;
                
            case 'width':
                changeDimension('width', args.join(' '));
                break;
                
            case 'height':
                changeDimension('height', args.join(' '));
                break;
                
            case 'padding':
                changeSpacing('padding', args.join(' '));
                break;
                
            case 'margin':
                changeSpacing('margin', args.join(' '));
                break;
                
            case 'border':
                changeBorder(args.join(' '));
                break;
                
            case 'opacity':
                changeOpacity(args.join(' '));
                break;
                
            case 'text':
                changeText(args.join(' '));
                break;
                
            case 'html':
                changeHTML(args.join(' '));
                break;
                
            case 'class':
                changeClass(args.join(' '));
                break;
                
            case 'id':
                changeId(args.join(' '));
                break;
                
            case 'scroll':
                scrollToElement();
                break;
                
            case 'focus':
                focusElement();
                break;
                
            case 'screenshot':
                takeScreenshot();
                break;
                
            case 'inspect':
                inspectElement();
                break;
                
            case 'parent':
                selectParent();
                break;
                
            case 'children':
                selectChild();
                break;
                
            case 'next':
                selectNextSibling();
                break;
                
            case 'prev':
                selectPreviousSibling();
                break;
                
            case 'toggle':
                toggleAttribute(args[0]);
                break;
                
            case 'refresh':
                location.reload();
                break;
                
            default:
                commandOutput.textContent = `Unknown command: ${cmd}. Type 'help' for available commands.`;
        }
    }
    
    // Command implementations
    function showHelp() {
        const helpText = `Available commands:
        
help - Show this help
select - Select an element by clicking on it
hide - Hide selected element
show - Show selected element
color [value] - Change text color of selected element
background [value] - Change background color of selected element
fontsize [value] - Change font size of selected element
dark - Enable dark mode
light - Enable light mode
reset - Reset all changes
info - Show page information
elements [tag] - List all elements of a specific type
remove - Remove selected element
disable - Disable selected element
enable - Enable selected element
width [value] - Change width of selected element
height [value] - Change height of selected element
padding [value] - Change padding of selected element
margin [value] - Change margin of selected element
border [value] - Change border of selected element
opacity [value] - Change opacity of selected element (0-1)
text [value] - Change text content of selected element
html [value] - Change HTML content of selected element
class [name] - Add class to selected element
id [name] - Change ID of selected element
scroll - Scroll to selected element
focus - Focus on selected element
screenshot - Take a screenshot of the page
inspect - Inspect selected element (like browser dev tools)
parent - Select parent of current element
children - List children of current element
next - Select next sibling element
prev - Select previous sibling element
toggle [attr] - Toggle boolean attribute (e.g., hidden, disabled)
refresh - Reload the page`;
        
        commandOutput.textContent = helpText;
    }
    
    function selectElement() {
        commandOutput.textContent = 'Click on an element to select it...';
        
        document.addEventListener('click', function selectHandler(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Remove previous selection
            if (selectedElement) {
                selectedElement.classList.remove('highlight-element');
            }
            
            // Select new element
            selectedElement = e.target;
            selectedElement.classList.add('highlight-element');
            
            // Store original styles
            if (!originalStyles.has(selectedElement)) {
                originalStyles.set(selectedElement, {
                    color: selectedElement.style.color,
                    backgroundColor: selectedElement.style.backgroundColor,
                    fontSize: selectedElement.style.fontSize,
                    display: selectedElement.style.display,
                    width: selectedElement.style.width,
                    height: selectedElement.style.height,
                    padding: selectedElement.style.padding,
                    margin: selectedElement.style.margin,
                    border: selectedElement.style.border,
                    opacity: selectedElement.style.opacity,
                    disabled: selectedElement.disabled,
                    className: selectedElement.className,
                    id: selectedElement.id
                });
            }
            
            commandOutput.textContent = `Selected: <${selectedElement.tagName.toLowerCase()}${selectedElement.id ? `#${selectedElement.id}` : ''}${selectedElement.className ? `.${selectedElement.className.replace(/\s+/g, '.')}` : ''}>`;
            
            // Update styles tab if active
            if (document.querySelector('#styles-tab').classList.contains('active')) {
                updateStylesList();
            }
            
            document.removeEventListener('click', selectHandler);
        }, { once: true });
    }
    
    function selectSpecificElement(element) {
        // Remove previous selection
        if (selectedElement) {
            selectedElement.classList.remove('highlight-element');
        }
        
        // Select new element
        selectedElement = element;
        selectedElement.classList.add('highlight-element');
        
        // Store original styles
        if (!originalStyles.has(selectedElement)) {
            originalStyles.set(selectedElement, {
                color: selectedElement.style.color,
                backgroundColor: selectedElement.style.backgroundColor,
                fontSize: selectedElement.style.fontSize,
                display: selectedElement.style.display,
                width: selectedElement.style.width,
                height: selectedElement.style.height,
                padding: selectedElement.style.padding,
                margin: selectedElement.style.margin,
                border: selectedElement.style.border,
                opacity: selectedElement.style.opacity,
                disabled: selectedElement.disabled,
                className: selectedElement.className,
                id: selectedElement.id
            });
        }
        
        commandOutput.textContent = `Selected: <${selectedElement.tagName.toLowerCase()}${selectedElement.id ? `#${selectedElement.id}` : ''}${selectedElement.className ? `.${selectedElement.className.replace(/\s+/g, '.')}` : ''}>`;
        
        // Update styles tab if active
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
        
        // Switch to styles tab
        document.querySelector('[data-tab="styles"]').click();
    }
    
    function hideElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        selectedElement.style.display = 'none';
        commandOutput.textContent = `Element hidden: <${selectedElement.tagName.toLowerCase()}>`;
    }
    
    function showElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        selectedElement.style.display = '';
        commandOutput.textContent = `Element shown: <${selectedElement.tagName.toLowerCase()}>`;
    }
    
    function changeColor(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide a color value.';
            return;
        }
        
        selectedElement.style.color = value;
        commandOutput.textContent = `Changed color to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeBackground(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide a background color value.';
            return;
        }
        
        selectedElement.style.backgroundColor = value;
        commandOutput.textContent = `Changed background color to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeFontSize(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide a font size value.';
            return;
        }
        
        selectedElement.style.fontSize = value;
        commandOutput.textContent = `Changed font size to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function toggleDarkMode(enable) {
        if (enable) {
            document.body.style.backgroundColor = '#121212';
            document.body.style.color = '#e0e0e0';
            commandOutput.textContent = 'Dark mode enabled';
        } else {
            document.body.style.backgroundColor = '';
            document.body.style.color = '';
            commandOutput.textContent = 'Light mode enabled';
        }
    }
    
    function resetStyles() {
        // Reset all modified elements
        for (const [element, styles] of originalStyles) {
            element.style.color = styles.color;
            element.style.backgroundColor = styles.backgroundColor;
            element.style.fontSize = styles.fontSize;
            element.style.display = styles.display;
            element.style.width = styles.width;
            element.style.height = styles.height;
            element.style.padding = styles.padding;
            element.style.margin = styles.margin;
            element.style.border = styles.border;
            element.style.opacity = styles.opacity;
            element.disabled = styles.disabled;
            element.className = styles.className;
            element.id = styles.id;
            element.classList.remove('highlight-element');
        }
        
        // Reset body
        document.body.style.backgroundColor = '';
        document.body.style.color = '';
        
        originalStyles.clear();
        selectedElement = null;
        
        commandOutput.textContent = 'All styles have been reset';
    }
    
    function showPageInfo() {
        const title = document.title;
        const url = window.location.href;
        const elementsCount = document.querySelectorAll('*').length;
        const loadTime = performance.timing.loadEventEnd - performance.timing.navigationStart;
        
        commandOutput.textContent = `Page Information:
Title: ${title}
URL: ${url}
Total elements: ${elementsCount}
Load time: ${loadTime}ms
Viewport: ${window.innerWidth}x${window.innerHeight}
User Agent: ${navigator.userAgent.substring(0, 60)}...`;
    }
    
    function listElements(tag) {
        const elements = tag ? document.querySelectorAll(tag) : document.querySelectorAll('*');
        const elementTypes = {};
        
        elements.forEach(el => {
            const tagName = el.tagName.toLowerCase();
            elementTypes[tagName] = (elementTypes[tagName] || 0) + 1;
        });
        
        let result = `Found ${elements.length} elements:\n\n`;
        for (const [type, count] of Object.entries(elementTypes)) {
            result += `${type}: ${count}\n`;
        }
        
        commandOutput.textContent = result;
    }
    
    function removeElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        const parent = selectedElement.parentNode;
        const tagName = selectedElement.tagName.toLowerCase();
        
        selectedElement.remove();
        originalStyles.delete(selectedElement);
        selectedElement = null;
        
        commandOutput.textContent = `Removed element: <${tagName}>`;
    }
    
    function toggleDisable(disable) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        selectedElement.disabled = disable;
        commandOutput.textContent = `Element ${disable ? 'disabled' : 'enabled'}: <${selectedElement.tagName.toLowerCase()}>`;
    }
    
    function changeDimension(dimension, value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = `Please provide a ${dimension} value.`;
            return;
        }
        
        selectedElement.style[dimension] = value;
        commandOutput.textContent = `Changed ${dimension} to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeSpacing(property, value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = `Please provide a ${property} value.`;
            return;
        }
        
        selectedElement.style[property] = value;
        commandOutput.textContent = `Changed ${property} to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeBorder(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide a border value.';
            return;
        }
        
        selectedElement.style.border = value;
        commandOutput.textContent = `Changed border to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeOpacity(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide an opacity value (0-1).';
            return;
        }
        
        const opacity = parseFloat(value);
        if (isNaN(opacity) || opacity < 0 || opacity > 1) {
            commandOutput.textContent = 'Opacity must be a number between 0 and 1.';
            return;
        }
        
        selectedElement.style.opacity = opacity;
        commandOutput.textContent = `Changed opacity to: ${opacity}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeText(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide text content.';
            return;
        }
        
        selectedElement.textContent = value;
        commandOutput.textContent = `Changed text content to: ${value}`;
    }
    
    function changeHTML(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide HTML content.';
            return;
        }
        
        selectedElement.innerHTML = value;
        commandOutput.textContent = `Changed HTML content`;
    }
    
    function changeClass(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide a class name.';
            return;
        }
        
        selectedElement.classList.add(value);
        commandOutput.textContent = `Added class: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function changeId(value) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!value) {
            commandOutput.textContent = 'Please provide an ID value.';
            return;
        }
        
        selectedElement.id = value;
        commandOutput.textContent = `Changed ID to: ${value}`;
        
        if (document.querySelector('#styles-tab').classList.contains('active')) {
            updateStylesList();
        }
    }
    
    function scrollToElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        selectedElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        commandOutput.textContent = `Scrolled to element: <${selectedElement.tagName.toLowerCase()}>`;
    }
    
    function focusElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (typeof selectedElement.focus === 'function') {
            selectedElement.focus();
            commandOutput.textContent = `Focused on element: <${selectedElement.tagName.toLowerCase()}>`;
        } else {
            commandOutput.textContent = 'Element cannot be focused';
        }
    }
    
    function takeScreenshot() {
        commandOutput.textContent = 'Taking screenshot...';
        
        // Use html2canvas library if available, otherwise use a fallback
        if (typeof html2canvas === 'function') {
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'screenshot.png';
                link.href = canvas.toDataURL();
                link.click();
                commandOutput.textContent = 'Screenshot saved';
            });
        } else {
            // Fallback: create a simple canvas with the current viewport
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            
            // Draw a simple representation
            ctx.fillStyle = document.body.style.backgroundColor || '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = document.body.style.color || '#000000';
            ctx.font = '16px Arial';
            ctx.fillText('Screenshot of ' + document.title, 20, 30);
            ctx.fillText(window.location.href, 20, 60);
            
            const link = document.createElement('a');
            link.download = 'screenshot.png';
            link.href = canvas.toDataURL();
            link.click();
            
            commandOutput.textContent = 'Basic screenshot saved (for full screenshots, include html2canvas library)';
        }
    }
    
    function inspectElement() {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        // Open browser's native inspector
        if (typeof window.inspect === 'function') {
            window.inspect(selectedElement);
        } else {
            // Fallback: log element details to console
            console.log(selectedElement);
            commandOutput.textContent = 'Element details logged to console. Press F12 to view.';
        }
    }
    
    function selectParent() {
        if (!selectedElement || !selectedElement.parentNode) {
            commandOutput.textContent = 'No parent element available.';
            return;
        }
        
        selectSpecificElement(selectedElement.parentNode);
    }
    
    function selectChild() {
        if (!selectedElement || !selectedElement.children.length) {
            commandOutput.textContent = 'No child elements available.';
            return;
        }
        
        // List children
        let childrenList = 'Child elements:\n';
        Array.from(selectedElement.children).forEach((child, index) => {
            childrenList += `${index}: <${child.tagName.toLowerCase()}${child.id ? `#${child.id}` : ''}${child.className ? `.${child.className.replace(/\s+/g, '.')}` : ''}>\n`;
        });
        
        commandOutput.textContent = childrenList;
        
        // Ask which child to select
        const childIndex = prompt('Enter index of child to select:');
        if (childIndex !== null && !isNaN(childIndex)) {
            const index = parseInt(childIndex);
            if (index >= 0 && index < selectedElement.children.length) {
                selectSpecificElement(selectedElement.children[index]);
            }
        }
    }
    
    function selectNextSibling() {
        if (!selectedElement || !selectedElement.nextElementSibling) {
            commandOutput.textContent = 'No next sibling element available.';
            return;
        }
        
        selectSpecificElement(selectedElement.nextElementSibling);
    }
    
    function selectPreviousSibling() {
        if (!selectedElement || !selectedElement.previousElementSibling) {
            commandOutput.textContent = 'No previous sibling element available.';
            return;
        }
        
        selectSpecificElement(selectedElement.previousElementSibling);
    }
    
    function toggleAttribute(attr) {
        if (!selectedElement) {
            commandOutput.textContent = 'No element selected. Use "select" command first.';
            return;
        }
        
        if (!attr) {
            commandOutput.textContent = 'Please provide an attribute name to toggle.';
            return;
        }
        
        if (selectedElement.hasAttribute(attr)) {
            selectedElement.removeAttribute(attr);
            commandOutput.textContent = `Removed attribute: ${attr}`;
        } else {
            selectedElement.setAttribute(attr, '');
            commandOutput.textContent = `Added attribute: ${attr}`;
        }
    }
    
    // Initialize with help text
    commandOutput.textContent = 'Command Panel ready. Type "help" for available commands.';
    
    // Initialize elements list
    updateElementsList();
    
    // Add keyboard shortcut to toggle panel (Ctrl+Shift+C)
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && e.key === 'C') {
            if (commandPanelElement.style.display === 'none') {
                commandPanelElement.style.display = 'flex';
            } else {
                commandPanelElement.style.display = 'none';
            }
        }
    });
})();
</script>
