<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship PLY Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(30, 30, 50, 0.8);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-group {
            background: rgba(40, 40, 60, 0.6);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-weight: 500;
        }
        
        input[type="range"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #e0e0e0;
        }
        
        input[type="range"] {
            height: 6px;
            background: linear-gradient(90deg, #00d4ff, #0080ff);
            outline: none;
            border-radius: 3px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            width: 18px;
            height: 18px;
            background: #00d4ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        .output-value {
            color: #00d4ff;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 25px;
            background: linear-gradient(45deg, #00d4ff, #0080ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .preview {
            background: rgba(20, 20, 30, 0.8);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: rgba(40, 40, 60, 0.6);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .stat-value {
            font-size: 1.5em;
            color: #00d4ff;
            font-weight: bold;
        }
        
        .stat-label {
            color: #b0b0b0;
            font-size: 0.9em;
        }
        
        .download-area {
            text-align: center;
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            border: 2px dashed rgba(0, 212, 255, 0.3);
        }
        
        .ship-type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .ship-type-btn {
            padding: 10px;
            background: rgba(40, 40, 60, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ship-type-btn.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        
        .ship-type-btn:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Spaceship PLY Generator</h1>
        
        <div class="controls">
            <div class="control-group">
                <h3>Ship Type</h3>
                <div class="ship-type-selector">
                    <div class="ship-type-btn active" data-type="fighter">Fighter</div>
                    <div class="ship-type-btn" data-type="cruiser">Cruiser</div>
                    <div class="ship-type-btn" data-type="cargo">Cargo</div>
                    <div class="ship-type-btn" data-type="mothership">Mothership</div>
                </div>
            </div>
            
            <div class="control-group">
                <h3>Hull Parameters</h3>
                <label>Hull Length: <span class="output-value" id="lengthValue">50</span></label>
                <input type="range" id="hullLength" min="20" max="100" value="50">
                
                <label>Hull Width: <span class="output-value" id="widthValue">20</span></label>
                <input type="range" id="hullWidth" min="10" max="40" value="20">
                
                <label>Hull Height: <span class="output-value" id="heightValue">15</span></label>
                <input type="range" id="hullHeight" min="8" max="30" value="15">
            </div>
            
            <div class="control-group">
                <h3>Wing Configuration</h3>
                <label>Wing Span: <span class="output-value" id="wingSpanValue">30</span></label>
                <input type="range" id="wingSpan" min="0" max="60" value="30">
                
                <label>Wing Sweep: <span class="output-value" id="wingSweepValue">15</span></label>
                <input type="range" id="wingSweep" min="0" max="45" value="15">
                
                <label>Wing Thickness: <span class="output-value" id="wingThicknessValue">3</span></label>
                <input type="range" id="wingThickness" min="1" max="8" value="3">
            </div>
            
            <div class="control-group">
                <h3>Engine Configuration</h3>
                <label>Number of Engines: <span class="output-value" id="engineCountValue">2</span></label>
                <input type="range" id="engineCount" min="1" max="6" value="2">
                
                <label>Engine Size: <span class="output-value" id="engineSizeValue">8</span></label>
                <input type="range" id="engineSize" min="3" max="15" value="8">
                
                <label>Engine Length: <span class="output-value" id="engineLengthValue">12</span></label>
                <input type="range" id="engineLength" min="5" max="25" value="12">
            </div>
            
            <div class="control-group">
                <h3>Detail Level</h3>
                <label>Hull Segments: <span class="output-value" id="hullSegmentsValue">16</span></label>
                <input type="range" id="hullSegments" min="8" max="32" value="16">
                
                <label>Surface Detail: <span class="output-value" id="surfaceDetailValue">5</span></label>
                <input type="range" id="surfaceDetail" min="1" max="10" value="5">
                
                <label>Randomization: <span class="output-value" id="randomizationValue">0.1</span></label>
                <input type="range" id="randomization" min="0" max="0.5" step="0.05" value="0.1">
            </div>
            
            <div class="control-group">
                <h3>Advanced Features</h3>
                <label>Add Bridge: 
                    <input type="checkbox" id="addBridge" checked>
                </label>
                
                <label>Add Weapon Mounts: 
                    <input type="checkbox" id="addWeapons" checked>
                </label>
                
                <label>Add Solar Panels: 
                    <input type="checkbox" id="addSolar">
                </label>
                
                <label>Add Landing Gear: 
                    <input type="checkbox" id="addLandingGear">
                </label>
            </div>
        </div>
        
        <div class="buttons">
            <button onclick="generateSpaceship()">Generate Spaceship</button>
            <button onclick="randomizeAll()">Randomize All</button>
            <button onclick="downloadPLY()">Download PLY File</button>
        </div>
        
        <div class="preview">
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="vertexCount">0</div>
                    <div class="stat-label">Vertices</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="faceCount">0</div>
                    <div class="stat-label">Faces</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="fileSize">0 KB</div>
                    <div class="stat-label">File Size</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="shipClass">Fighter</div>
                    <div class="stat-label">Ship Class</div>
                </div>
            </div>
            
            <div class="download-area" id="downloadArea">
                <p>Generate a spaceship to see PLY data</p>
            </div>
        </div>
    </div>

    <script>
        let currentPLYData = '';
        let currentShipType = 'fighter';
        
        // Ship type presets
        const shipPresets = {
            fighter: {
                hullLength: 40,
                hullWidth: 15,
                hullHeight: 10,
                wingSpan: 35,
                wingSweep: 25,
                wingThickness: 2,
                engineCount: 2,
                engineSize: 6,
                engineLength: 15
            },
            cruiser: {
                hullLength: 70,
                hullWidth: 25,
                hullHeight: 20,
                wingSpan: 20,
                wingSweep: 10,
                wingThickness: 5,
                engineCount: 4,
                engineSize: 10,
                engineLength: 18
            },
            cargo: {
                hullLength: 60,
                hullWidth: 35,
                hullHeight: 25,
                wingSpan: 10,
                wingSweep: 5,
                wingThickness: 8,
                engineCount: 6,
                engineSize: 12,
                engineLength: 20
            },
            mothership: {
                hullLength: 100,
                hullWidth: 40,
                hullHeight: 30,
                wingSpan: 50,
                wingSweep: 0,
                wingThickness: 10,
                engineCount: 8,
                engineSize: 15,
                engineLength: 25
            }
        };
        
        // Initialize UI
        document.addEventListener('DOMContentLoaded', function() {
            updateAllDisplays();
            attachEventListeners();
            applyShipPreset('fighter');
        });
        
        function attachEventListeners() {
            // Range input listeners
            const ranges = document.querySelectorAll('input[type="range"]');
            ranges.forEach(range => {
                range.addEventListener('input', updateAllDisplays);
            });
            
            // Ship type selector
            document.querySelectorAll('.ship-type-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.ship-type-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentShipType = this.dataset.type;
                    applyShipPreset(currentShipType);
                    document.getElementById('shipClass').textContent = currentShipType.charAt(0).toUpperCase() + currentShipType.slice(1);
                });
            });
        }
        
        function applyShipPreset(type) {
            const preset = shipPresets[type];
            Object.keys(preset).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.value = preset[key];
                }
            });
            updateAllDisplays();
        }
        
        function updateAllDisplays() {
            // Update all range display values
            const ranges = {
                'hullLength': 'lengthValue',
                'hullWidth': 'widthValue',
                'hullHeight': 'heightValue',
                'wingSpan': 'wingSpanValue',
                'wingSweep': 'wingSweepValue',
                'wingThickness': 'wingThicknessValue',
                'engineCount': 'engineCountValue',
                'engineSize': 'engineSizeValue',
                'engineLength': 'engineLengthValue',
                'hullSegments': 'hullSegmentsValue',
                'surfaceDetail': 'surfaceDetailValue',
                'randomization': 'randomizationValue'
            };
            
            Object.keys(ranges).forEach(rangeId => {
                const range = document.getElementById(rangeId);
                const display = document.getElementById(ranges[rangeId]);
                if (range && display) {
                    display.textContent = range.value;
                }
            });
        }
        
        function randomizeAll() {
            const ranges = document.querySelectorAll('input[type="range"]');
            ranges.forEach(range => {
                const min = parseFloat(range.min);
                const max = parseFloat(range.max);
                const step = parseFloat(range.step) || 1;
                const randomValue = Math.floor((Math.random() * (max - min) / step + min / step)) * step;
                range.value = randomValue;
            });
            
            // Randomize checkboxes
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = Math.random() > 0.5;
            });
            
            updateAllDisplays();
        }
        
        function generateSpaceship() {
            const params = getParameters();
            const geometry = generateSpaceshipGeometry(params);
            currentPLYData = generatePLYFile(geometry);
            
            // Update stats
            document.getElementById('vertexCount').textContent = geometry.vertices.length;
            document.getElementById('faceCount').textContent = geometry.faces.length;
            document.getElementById('fileSize').textContent = Math.round(currentPLYData.length / 1024) + ' KB';
            
            // Show preview
            const downloadArea = document.getElementById('downloadArea');
            downloadArea.innerHTML = `
                <h4>PLY File Generated Successfully!</h4>
                <p>Vertices: ${geometry.vertices.length} | Faces: ${geometry.faces.length}</p>
                <p>Ready to download - Compatible with Blender, MeshLab, and game engines</p>
            `;
        }
        
        function getParameters() {
            return {
                hullLength: parseFloat(document.getElementById('hullLength').value),
                hullWidth: parseFloat(document.getElementById('hullWidth').value),
                hullHeight: parseFloat(document.getElementById('hullHeight').value),
                wingSpan: parseFloat(document.getElementById('wingSpan').value),
                wingSweep: parseFloat(document.getElementById('wingSweep').value),
                wingThickness: parseFloat(document.getElementById('wingThickness').value),
                engineCount: parseInt(document.getElementById('engineCount').value),
                engineSize: parseFloat(document.getElementById('engineSize').value),
                engineLength: parseFloat(document.getElementById('engineLength').value),
                hullSegments: parseInt(document.getElementById('hullSegments').value),
                surfaceDetail: parseInt(document.getElementById('surfaceDetail').value),
                randomization: parseFloat(document.getElementById('randomization').value),
                addBridge: document.getElementById('addBridge').checked,
                addWeapons: document.getElementById('addWeapons').checked,
                addSolar: document.getElementById('addSolar').checked,
                addLandingGear: document.getElementById('addLandingGear').checked,
                shipType: currentShipType
            };
        }
        
        function generateSpaceshipGeometry(params) {
            const vertices = [];
            const faces = [];
            
            // Generate main hull
            generateHull(vertices, faces, params);
            
            // Generate wings
            if (params.wingSpan > 0) {
                generateWings(vertices, faces, params);
            }
            
            // Generate engines
            generateEngines(vertices, faces, params);
            
            // Generate additional components
            if (params.addBridge) {
                generateBridge(vertices, faces, params);
            }
            
            if (params.addWeapons) {
                generateWeaponMounts(vertices, faces, params);
            }
            
            if (params.addSolar) {
                generateSolarPanels(vertices, faces, params);
            }
            
            if (params.addLandingGear) {
                generateLandingGear(vertices, faces, params);
            }
            
            return { vertices, faces };
        }
        
        function generateHull(vertices, faces, params) {
            const segments = params.hullSegments;
            const length = params.hullLength;
            const width = params.hullWidth;
            const height = params.hullHeight;
            const randomFactor = params.randomization;
            
            // Generate hull profile points
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const x = (t - 0.5) * length;
                
                // Create hull cross-section (elliptical)
                const hullProfile = Math.sin(Math.PI * t) * 0.8 + 0.2;
                const currentWidth = width * hullProfile;
                const currentHeight = height * hullProfile;
                
                // Generate cross-section vertices
                const crossSectionVertices = 8;
                for (let j = 0; j < crossSectionVertices; j++) {
                    const angle = (j / crossSectionVertices) * Math.PI * 2;
                    const y = Math.cos(angle) * currentWidth * (1 + (Math.random() - 0.5) * randomFactor);
                    const z = Math.sin(angle) * currentHeight * (1 + (Math.random() - 0.5) * randomFactor);
                    
                    vertices.push([x, y, z]);
                }
            }
            
            // Generate faces for hull
            for (let i = 0; i < segments; i++) {
                for (let j = 0; j < 8; j++) {
                    const curr = i * 8 + j;
                    const next = i * 8 + ((j + 1) % 8);
                    const currNext = (i + 1) * 8 + j;
                    const nextNext = (i + 1) * 8 + ((j + 1) % 8);
                    
                    // Create quad faces
                    faces.push([curr, next, nextNext]);
                    faces.push([curr, nextNext, currNext]);
                }
            }
        }
        
        function generateWings(vertices, faces, params) {
            const wingSpan = params.wingSpan;
            const sweep = params.wingSweep * Math.PI / 180;
            const thickness = params.wingThickness;
            const startIndex = vertices.length;
            
            // Wing root and tip positions
            const rootX = -params.hullLength * 0.2;
            const tipX = rootX - Math.tan(sweep) * wingSpan;
            
            // Generate wing vertices
            const wingVertices = [
                // Root leading edge
                [rootX, 0, 0],
                [rootX, wingSpan, 0],
                // Root trailing edge
                [rootX - params.hullLength * 0.3, 0, 0],
                [tipX, wingSpan, 0],
                // Top surface
                [rootX, 0, thickness],
                [rootX, wingSpan, thickness * 0.5],
                [rootX - params.hullLength * 0.3, 0, thickness],
                [tipX, wingSpan, thickness * 0.5],
                // Bottom surface (mirrored)
                [rootX, 0, -thickness],
                [rootX, wingSpan, -thickness * 0.5],
                [rootX - params.hullLength * 0.3, 0, -thickness],
                [tipX, wingSpan, -thickness * 0.5]
            ];
            
            // Add wing vertices (right wing)
            wingVertices.forEach(v => vertices.push(v));
            
            // Add left wing (mirrored)
            wingVertices.forEach(v => vertices.push([v[0], -v[1], v[2]]));
            
            // Generate wing faces
            const wingFaces = [
                // Right wing top
                [0, 4, 5], [0, 5, 1],
                [4, 6, 7], [4, 7, 5],
                [1, 5, 7], [1, 7, 3],
                [0, 2, 6], [0, 6, 4],
                // Right wing bottom
                [0, 9, 8], [0, 1, 9],
                [8, 11, 10], [8, 9, 11],
                [1, 11, 9], [1, 3, 11],
                [0, 10, 2], [0, 8, 10]
            ];
            
            // Add right wing faces
            wingFaces.forEach(face => {
                faces.push(face.map(i => i + startIndex));
            });
            
            // Add left wing faces (with corrected winding)
            wingFaces.forEach(face => {
                faces.push(face.map(i => i + startIndex + 12).reverse());
            });
        }
        
        function generateEngines(vertices, faces, params) {
            const engineCount = params.engineCount;
            const engineSize = params.engineSize;
            const engineLength = params.engineLength;
            const startIndex = vertices.length;
            
            for (let e = 0; e < engineCount; e++) {
                const angle = (e / engineCount) * Math.PI * 2;
                const radius = params.hullWidth * 0.8;
                const engineY = Math.cos(angle) * radius;
                const engineZ = Math.sin(angle) * radius * 0.5;
                const engineX = params.hullLength * 0.3;
                
                // Generate engine geometry (cylinder)
                const segments = 8;
                const engineVertices = [];
                
                // Front cap
                for (let i = 0; i < segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    const y = Math.cos(a) * engineSize + engineY;
                    const z = Math.sin(a) * engineSize + engineZ;
                    engineVertices.push([engineX, y, z]);
                }
                
                // Back cap
                for (let i = 0; i < segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    const y = Math.cos(a) * engineSize * 1.2 + engineY;
                    const z = Math.sin(a) * engineSize * 1.2 + engineZ;
                    engineVertices.push([engineX + engineLength, y, z]);
                }
                
                // Add center points for caps
                engineVertices.push([engineX, engineY, engineZ]); // Front center
                engineVertices.push([engineX + engineLength, engineY, engineZ]); // Back center
                
                // Add vertices
                const engineStartIndex = vertices.length;
                engineVertices.forEach(v => vertices.push(v));
                
                // Generate engine faces
                // Side faces
                for (let i = 0; i < segments; i++) {
                    const next = (i + 1) % segments;
                    faces.push([
                        engineStartIndex + i,
                        engineStartIndex + next,
                        engineStartIndex + next + segments
                    ]);
                    faces.push([
                        engineStartIndex + i,
                        engineStartIndex + next + segments,
                        engineStartIndex + i + segments
                    ]);
                }
                
                // Front cap
                for (let i = 0; i < segments; i++) {
                    const next = (i + 1) % segments;
                    faces.push([
                        engineStartIndex + segments * 2,
                        engineStartIndex + next,
                        engineStartIndex + i
                    ]);
                }
                
                // Back cap
                for (let i = 0; i < segments; i++) {
                    const next = (i + 1) % segments;
                    faces.push([
                        engineStartIndex + segments * 2 + 1,
                        engineStartIndex + i + segments,
                        engineStartIndex + next + segments
                    ]);
                }
            }
        }
        
        function generateBridge(vertices, faces, params) {
            const startIndex = vertices.length;
            const bridgeSize = params.hullWidth * 0.3;
            const bridgeHeight = params.hullHeight * 0.6;
            const bridgeX = -params.hullLength * 0.2;
            
            // Simple bridge geometry (box on top of hull)
            const bridgeVertices = [
                [bridgeX - bridgeSize, -bridgeSize, bridgeHeight],
                [bridgeX + bridgeSize, -bridgeSize, bridgeHeight],
                [bridgeX + bridgeSize, bridgeSize, bridgeHeight],
                [bridgeX - bridgeSize, bridgeSize, bridgeHeight],
                [bridgeX - bridgeSize * 0.8, -bridgeSize * 0.8, bridgeHeight + bridgeSize],
                [bridgeX + bridgeSize * 0.8, -bridgeSize * 0.8, bridgeHeight + bridgeSize],
                [bridgeX + bridgeSize * 0.8, bridgeSize * 0.8, bridgeHeight + bridgeSize],
                [bridgeX - bridgeSize * 0.8, bridgeSize * 0.8, bridgeHeight + bridgeSize]
            ];
            
            bridgeVertices.forEach(v => vertices.push(v));
            
            // Bridge faces
            const bridgeFaces = [
                [0, 1, 2], [0, 2, 3], // Bottom
                [4, 7, 6], [4, 6, 5], // Top
                [0, 4, 5], [0, 5, 1], // Front
                [2, 6, 7], [2, 7, 3], // Back
                [1, 5, 6], [1, 6, 2], // Right
                [0, 3, 7], [0, 7, 4]  // Left
            ];
            
            bridgeFaces.forEach(face => {
                faces.push(face.map(i => i + startIndex));
            });
        }
        
        function generateWeaponMounts(vertices, faces, params) {
            const mountCount = Math.floor(params.surfaceDetail / 2) + 1;
            
            for (let m = 0; m < mountCount; m++) {
                const startIndex = vertices.length;
                const mountX = -params.hullLength * 0.1 + (m * params.hullLength * 0.3);
                const mountY = (m % 2 === 0 ? 1 : -1) * params.hullWidth * 0.6;
                const mountSize = params.hullHeight * 0.2;
                
                // Weapon mount geometry (small turret)
                const mountVertices = [
                    [mountX, mountY, 0],
                    [mountX + mountSize, mountY, mountSize * 0.5],
                    [mountX + mountSize * 2, mountY, 0],
                    [mountX + mountSize, mountY, -mountSize * 0.5],
                    [mountX + mountSize, mountY + mountSize * 0.3, 0]
                ];
                
                mountVertices.forEach(v => vertices.push(v));
                
                // Mount faces
                const mountFaces = [
                    [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4],
                    [0, 3, 2], [0, 2, 1]
                ];
                
                mountFaces.forEach(face => {
                    faces.push(face.map(i => i + startIndex));
                });
            }
        }
        
        function generateSolarPanels(vertices, faces, params) {
            const panelCount = 2;
            
            for (let p = 0; p < panelCount; p++) {
                const startIndex = vertices.length;
                const side = p === 0 ? 1 : -1;
                const panelX = -params.hullLength * 0.3;
                const panelY = side * params.hullWidth * 1.2;
                const panelWidth = params.hullLength * 0.4;
                const panelHeight = params.hullWidth * 0.8;
                
                // Solar panel vertices (thin rectangle)
                const panelVertices = [
                    [panelX, panelY, 0],
                    [panelX + panelWidth, panelY, 0],
                    [panelX + panelWidth, panelY, panelHeight],
                    [panelX, panelY, panelHeight],
                    [panelX, panelY + side * 0.5, 0],
                    [panelX + panelWidth, panelY + side * 0.5, 0],
                    [panelX + panelWidth, panelY + side * 0.5, panelHeight],
                    [panelX, panelY + side * 0.5, panelHeight]
                ];
                
                panelVertices.forEach(v => vertices.push(v));
                
                // Panel faces
                const panelFaces = [
                    [0, 1, 2], [0, 2, 3], // Front face
                    [4, 7, 6], [4, 6, 5], // Back face
                    [0, 4, 5], [0, 5, 1], // Bottom
                    [3, 2, 6], [3, 6, 7], // Top
                    [1, 5, 6], [1, 6, 2], // Right
                    [0, 3, 7], [0, 7, 4]  // Left
                ];
                
                panelFaces.forEach(face => {
                    faces.push(face.map(i => i + startIndex));
                });
            }
        }
        
        function generateLandingGear(vertices, faces, params) {
            const gearCount = 3;
            
            for (let g = 0; g < gearCount; g++) {
                const startIndex = vertices.length;
                const angle = (g / gearCount) * Math.PI * 2;
                const radius = params.hullWidth * 0.7;
                const gearX = Math.cos(angle) * params.hullLength * 0.2;
                const gearY = Math.sin(angle) * radius;
                const gearZ = -params.hullHeight * 0.8;
                const gearLength = params.hullHeight * 0.6;
                
                // Landing gear strut
                const gearVertices = [
                    [gearX, gearY, 0],
                    [gearX, gearY + 2, gearZ],
                    [gearX, gearY - 2, gearZ],
                    [gearX + 2, gearY, gearZ],
                    [gearX - 2, gearY, gearZ],
                    [gearX, gearY, gearZ - gearLength * 0.3]
                ];
                
                gearVertices.forEach(v => vertices.push(v));
                
                // Gear faces
                const gearFaces = [
                    [0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1],
                    [1, 5, 2], [2, 5, 3], [3, 5, 4], [4, 5, 1]
                ];
                
                gearFaces.forEach(face => {
                    faces.push(face.map(i => i + startIndex));
                });
            }
        }
        
        function generatePLYFile(geometry) {
            const vertices = geometry.vertices;
            const faces = geometry.faces;
            
            let plyContent = 'ply\n';
            plyContent += 'format ascii 1.0\n';
            plyContent += 'comment Generated by Spaceship PLY Generator\n';
            plyContent += `element vertex ${vertices.length}\n`;
            plyContent += 'property float x\n';
            plyContent += 'property float y\n';
            plyContent += 'property float z\n';
            plyContent += 'property uchar red\n';
            plyContent += 'property uchar green\n';
            plyContent += 'property uchar blue\n';
            plyContent += `element face ${faces.length}\n`;
            plyContent += 'property list uchar int vertex_indices\n';
            plyContent += 'end_header\n';
            
            // Add vertices with colors
            vertices.forEach((vertex, index) => {
                const x = vertex[0].toFixed(6);
                const y = vertex[1].toFixed(6);
                const z = vertex[2].toFixed(6);
                
                // Generate colors based on position and ship type
                let r, g, b;
                if (currentShipType === 'fighter') {
                    r = 180; g = 180; b = 200; // Light gray
                } else if (currentShipType === 'cruiser') {
                    r = 100; g = 120; b = 140; // Blue-gray
                } else if (currentShipType === 'cargo') {
                    r = 160; g = 140; b = 100; // Brown-gray
                } else { // mothership
                    r = 80; g = 80; b = 100; // Dark gray
                }
                
                // Add some variation based on position
                const variation = Math.sin(vertex[0] * 0.1) * 20;
                r = Math.max(0, Math.min(255, r + variation));
                g = Math.max(0, Math.min(255, g + variation));
                b = Math.max(0, Math.min(255, b + variation));
                
                plyContent += `${x} ${y} ${z} ${Math.floor(r)} ${Math.floor(g)} ${Math.floor(b)}\n`;
            });
            
            // Add faces
            faces.forEach(face => {
                plyContent += `3 ${face[0]} ${face[1]} ${face[2]}\n`;
            });
            
            return plyContent;
        }
        
        function downloadPLY() {
            if (!currentPLYData) {
                alert('Please generate a spaceship first!');
                return;
            }
            
            const blob = new Blob([currentPLYData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `spaceship_${currentShipType}_${Date.now()}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Initialize with default spaceship
        setTimeout(() => {
            generateSpaceship();
        }, 500);
    </script>
</body>
