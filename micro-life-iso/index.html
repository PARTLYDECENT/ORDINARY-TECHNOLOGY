<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a202c; /* Dark border */

            display: block;

</head>
<body class="text-white">

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="p-4 sm:p-6 flex flex-col justify-between">
        
        <!-- Top Bar: Resources -->

            <div class="bg-slate-800/90 border-2 border-slate-700 rounded-xl p-3 shadow-lg flex items-center gap-3">

                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block">Micro Population</span>

                <div>
                    <span class="text-xs text-red-400 font-bold uppercase tracking-wider block">Threats</span>

        <!-- Bottom Bar: Controls -->
        <div class="interactive flex justify-center pb-4 w-full px-4">
            <div class="bg-slate-800/90 border-2 border-slate-700 rounded-2xl p-4 shadow-2xl flex flex-wrap gap-3 items-center justify-center max-w-full overflow-x-auto">
                <button id="btn-hatch" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">

                    <span class="text-sm">Farm</span>

                <button id="btn-medic" class="bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white font-bold py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">
                    <span class="text-sm">Medic</span>

                </button>
                <button id="btn-titan" class="bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-900 text-white font-bold py-2 px-4 rounded-xl border border-zinc-600 transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">
                    <span class="text-sm">Titan</span>

                <button id="btn-spikes" class="bg-stone-600 hover:bg-stone-500 active:bg-stone-700 text-white font-bold py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">
                    <span class="text-sm">Spikes</span>
                    <span class="text-[10px] bg-black/30 px-1 py-0.5 rounded mt-1">10 Food</span>
                </button>
                <button id="btn-silo" class="bg-red-700 hover:bg-red-600 active:bg-red-800 text-white font-bold py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">
                    <span class="text-sm">Silo</span>
                    <span class="text-[10px] bg-black/30 px-1 py-0.5 rounded mt-1">40 Food</span>
                </button>
                <button id="btn-lantern" class="bg-yellow-600 hover:bg-yellow-500 active:bg-yellow-700 text-white font-bold py-2 px-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 flex flex-col items-center shrink-0">
                    <span class="text-sm">Lantern</span>
                    <span class="text-[10px] bg-black/30 px-1 py-0.5 rounded mt-1">15 Food</span>
                </button>
                <div class="w-px h-10 bg-slate-600 hidden lg:block"></div>
                <div class="text-xs text-slate-400 max-w-[150px] hidden lg:block" id="ui-hint">
                    <p><b>Drag</b> to pan camera.</p>
                </div>
            </div>
        </div>
    </div>
<script>
/**
 * ISOMETRIC MICRO LIFE REMAKE
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE_W = 64;
const TILE_H = 32;
const MAP_SIZE = 40; 
let resources = 100; 
let camera = { x: 0, y: 0 };
let isDragging = false;
let lastMouse = { x: 0, y: 0 };
let entities = [];
let nextId = 0;
let dayTime = 0; 
let lightLevel = 1; 

let buildMode = null; 
let mouseX = 0, mouseY = 0;

const COLORS = ['#3b82f6', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6'];

const uiFood = document.getElementById('ui-food');
const uiPop = document.getElementById('ui-pop');
const uiThreats = document.getElementById('ui-threats');
const btnHatch = document.getElementById('btn-hatch');
const btnSoldier = document.getElementById('btn-soldier');
const btnWall = document.getElementById('btn-wall');
const btnFarm = document.getElementById('btn-farm');
const btnTurret = document.getElementById('btn-turret');
const btnMedic = document.getElementById('btn-medic');
const btnTitan = document.getElementById('btn-titan');
const btnSpikes = document.getElementById('btn-spikes');
const btnSilo = document.getElementById('btn-silo');
const btnLantern = document.getElementById('btn-lantern');
const uiHint = document.getElementById('ui-hint');

let patterns = {};
function createTextures() {
    const createTex = (base, colors, type) => {
        const tc = document.createElement('canvas'); tc.width = 128; tc.height = 128;
        const tctx = tc.getContext('2d');
        tctx.fillStyle = base; tctx.fillRect(0, 0, 128, 128);
        for(let i=0; i<40; i++) {
            tctx.fillStyle = colors[Math.floor(Math.random() * 2)]; tctx.globalAlpha = 0.3;
            tctx.beginPath(); tctx.arc(Math.random()*128, Math.random()*128, Math.random()*15 + 5, 0, Math.PI*2); tctx.fill();
        }
        tctx.globalAlpha = 1.0;
        for(let i=0; i<300; i++) {
            tctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            tctx.beginPath(); tctx.arc(Math.random()*128, Math.random()*128, Math.random()*1.5 + 0.2, 0, Math.PI*2); tctx.fill();
        }
        for(let i=0; i<40; i++) {
            tctx.strokeStyle = colors[0]; tctx.lineWidth = type === 'dirt' ? 1.5 : 1; tctx.globalAlpha = 0.6;
            tctx.beginPath(); let x = Math.random()*128; let y = Math.random()*128; tctx.moveTo(x, y);
            if(type === 'dirt') { tctx.lineTo(x + Math.random()*8-4, y + Math.random()*8-4); tctx.lineTo(x + Math.random()*12-6, y + Math.random()*12-6); }
            else { tctx.lineTo(x + Math.random()*4-2, y - Math.random()*10-4); } tctx.stroke();
        }
        return ctx.createPattern(tc, 'repeat');
    };
    patterns['GRASS'] = createTex('#15803d', ['#14532d', '#166534', '#22c55e', '#4ade80'], 'grass');
    patterns['DARK_GRASS'] = createTex('#166534', ['#064e3b', '#14532d', '#15803d', '#22c55e'], 'grass');
    patterns['DIRT'] = createTex('#a16207', ['#451a03', '#713f12', '#854d0e', '#ca8a04'], 'dirt');
}

let mapGrid = [];
function generateMap() {
    for(let x=0; x<MAP_SIZE; x++) {
        mapGrid[x] = [];
        for(let y=0; y<MAP_SIZE; y++) {
            let nx = x * 0.4; let ny = y * 0.4;
            let noise = Math.sin(nx) + Math.cos(ny) + (Math.random() * 0.5);
            let distToCenter = Math.hypot(x - MAP_SIZE/2, y - MAP_SIZE/2);
            let type = 'GRASS'; let edgeColor = '#14532d';
            if (distToCenter < 2.5 || noise < -0.5) { type = 'DIRT'; edgeColor = '#713f12'; }
            else if (noise > 0.8) { type = 'DARK_GRASS'; edgeColor = '#14532d'; }
            let numDetails = Math.floor(Math.random() * 5);
            for(let i=0; i<numDetails; i++) {
                let dx = x + 0.1 + Math.random() * 0.8; let dy = y + 0.1 + Math.random() * 0.8;
                if (type === 'GRASS' || type === 'DARK_GRASS') {
                    let r = Math.random();
                    if (r < 0.5) entities.push(new Grass(dx, dy, type));
                    else if (r < 0.7) entities.push(new Fern(dx, dy));
                    else if (r < 0.85) entities.push(new Flower(dx, dy));
                    else entities.push(new Mushroom(dx, dy));
                } else if (type === 'DIRT') { entities.push(new Pebble(dx, dy)); }
            }
            mapGrid[x][y] = { type, edgeColor, pattern: patterns[type] };
        }
    }
}

function toScreen(mapX, mapY, z = 0) {
    return { x: (mapX - mapY) * (TILE_W / 2) + camera.x, y: (mapX + mapY) * (TILE_H / 2) - z + camera.y };
}
function toMap(screenX, screenY) {
    let adjX = screenX - camera.x; let adjY = screenY - camera.y;
    let mapX = (adjX / (TILE_W / 2) + adjY / (TILE_H / 2)) / 2;
    let mapY = (adjY / (TILE_H / 2) - adjX / (TILE_W / 2)) / 2;
    return { x: Math.floor(mapX), y: Math.floor(mapY) };
}
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
class Entity {
    constructor(x, y) { this.id = nextId++; this.x = x; this.y = y; this.z = 0; this.depth = 0; }
    update() { this.depth = this.x + this.y + (this.z * 0.1); }
    draw(ctx) {}
}
class Grass extends Entity {
    constructor(x, y, type) {
        super(x, y); this.type = 'grass'; this.isStatic = true; this.depth = this.x + this.y; this.clusterType = type;
        this.blades = []; let numBlades = Math.floor(Math.random() * 5) + 3;
        for(let b = 0; b < numBlades; b++) {
            this.blades.push({ offsetX: (Math.random() - 0.5) * 8, height: Math.random() * 12 + 6, curve: (Math.random() - 0.5) * 10,
                shade: Math.random() > 0.5 ? (type === 'GRASS' ? '#4ade80' : '#22c55e') : (type === 'GRASS' ? '#22c55e' : '#16a34a') });
        }
    }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(pos.x, pos.y, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();
        let time = Date.now() * 0.002; let wind = Math.sin(time + this.x * 2 + this.y * 2) * 4; 
        this.blades.forEach(blade => {
            ctx.strokeStyle = blade.shade; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pos.x + blade.offsetX, pos.y);
            let windEffect = wind * (blade.height / 15);
            ctx.quadraticCurveTo(pos.x + blade.offsetX + blade.curve / 2 + windEffect, pos.y - blade.height / 2, 
                pos.x + blade.offsetX + blade.curve + windEffect * 1.5, pos.y - blade.height); ctx.stroke();
        });
    }
}
class Fern extends Entity {
    constructor(x, y) { super(x, y); this.type = 'fern'; this.isStatic = true; this.depth = this.x + this.y; this.size = Math.random() * 0.5 + 0.8; }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(pos.x, pos.y, 8*this.size, 4*this.size, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#064e3b'; ctx.lineWidth = 2;
        for(let i=0; i<4; i++) {
            let angle = (i * Math.PI / 2) + (Math.sin(this.x) * 0.5); let endX = pos.x + Math.cos(angle) * 12 * this.size; let endY = pos.y + Math.sin(angle) * 8 * this.size - 6 * this.size;
            ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.quadraticCurveTo(pos.x, endY, endX, endY); ctx.stroke();
        }
    }
}
class Flower extends Entity {
    constructor(x, y) {
        super(x, y); this.type = 'flower'; this.isStatic = true; this.depth = this.x + this.y;
        let colors = ['#f43f5e', '#a855f7', '#3b82f6', '#eab308']; this.color = colors[Math.floor(Math.random() * colors.length)];
    }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z); let wind = Math.sin(Date.now() * 0.002 + this.x) * 2;
        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.quadraticCurveTo(pos.x + wind/2, pos.y - 4, pos.x + wind, pos.y - 8); ctx.stroke();
        ctx.fillStyle = this.color; let px = pos.x + wind; let py = pos.y - 8;
        for(let i=0; i<5; i++) { let angle = (i / 5) * Math.PI * 2; ctx.beginPath(); ctx.arc(px + Math.cos(angle)*3, py + Math.sin(angle)*3, 2.5, 0, Math.PI*2); ctx.fill(); }
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();
    }
}
class Mushroom extends Entity {
    constructor(x, y) { super(x, y); this.type = 'mushroom'; this.isStatic = true; this.depth = this.x + this.y; this.color = Math.random() > 0.5 ? '#2dd4bf' : '#c084fc'; }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z); ctx.fillStyle = '#e2e8f0'; ctx.fillRect(pos.x - 1.5, pos.y - 6, 3, 6);
        ctx.fillStyle = this.color; if (lightLevel < 0.5) { ctx.shadowColor = this.color; ctx.shadowBlur = 10 * (1 - lightLevel); }
        ctx.beginPath(); ctx.arc(pos.x, pos.y - 6, 5, Math.PI, 0); ctx.fill(); ctx.shadowBlur = 0;
    }
}
class Pebble extends Entity {
    constructor(x, y) { super(x, y); this.type = 'pebble'; this.isStatic = true; this.depth = this.x + this.y; this.size = Math.random() * 1.5 + 1; }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 1, this.size, this.size/2, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#713f12'; ctx.beginPath(); ctx.arc(pos.x, pos.y, this.size, 0, Math.PI*2); ctx.fill();
    }
}
class Nest extends Entity {
    constructor(x, y) { super(x, y); this.type = 'nest'; this.hp = 500; this.maxHp = 500; }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(pos.x, pos.y, 40, 20, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.ellipse(pos.x, pos.y - 10, 35, 18, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(125, 211, 252, 0.4)'; ctx.beginPath(); ctx.arc(pos.x, pos.y - 15, 30, 0, Math.PI, true); ctx.lineTo(pos.x + 30, pos.y - 15); ctx.fill();
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(pos.x, pos.y - 15, 15 + Math.sin(Date.now() * 0.003) * 2, 0, Math.PI*2); ctx.fill();
        if (this.hp < this.maxHp) { ctx.fillStyle = '#000'; ctx.fillRect(pos.x - 20, pos.y - 40, 40, 5); ctx.fillStyle = '#10b981'; ctx.fillRect(pos.x - 19, pos.y - 39, 38 * (this.hp / this.maxHp), 3); }
    }
}
class Food extends Entity {
    constructor(x, y) { super(x, y); this.type = 'food'; this.z = 5; this.targetedBy = null; }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z + Math.sin(Date.now() * 0.005 + this.id) * 3); let shadowPos = toScreen(this.x, this.y, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(shadowPos.x, shadowPos.y, 6, 3, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 6, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1; ctx.stroke();
    }
}
class Projectile extends Entity {
    constructor(x, y, target) { super(x, y); this.type = 'projectile'; this.target = target; this.speed = 0.3; this.z = 15; }
    update() {
        super.update();
        if (!this.target || !entities.includes(this.target)) { entities = entities.filter(e => e !== this); return; }
        let dx = this.target.x - this.x; let dy = this.target.y - this.y; let distAmt = Math.hypot(dx, dy);
        if (distAmt < 0.5) {
            this.target.hp -= 40; entities = entities.filter(e => e !== this);
            if (this.target.hp <= 0) { entities = entities.filter(e => e !== this.target); updateUI(); }
        } else { this.x += (dx / distAmt) * this.speed; this.y += (dy / distAmt) * this.speed; }
    }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z); ctx.fillStyle = '#818cf8'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(129, 140, 248, 0.4)'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 8, 0, Math.PI*2); ctx.fill();
    }
}
class Turret extends Entity {
    constructor(x, y) { super(x, y); this.type = 'turret'; this.hp = 150; this.maxHp = 150; this.cooldown = 0; this.range = 8; }
    update() {
        super.update();
        if (this.cooldown > 0) this.cooldown--;
        else {
            let preds = entities.filter(e => e.isHostile);
            for (let p of preds) {
                if (dist(this.x, this.y, p.x, p.y) < this.range) { entities.push(new Projectile(this.x, this.y, p)); this.cooldown = 90; this.z = 5; break; }
            }
        }
        if (this.z > 0) this.z -= 0.5;
    }
    draw(ctx) {
        let pos = toScreen(this.x, this.y, this.z); let shadowPos = toScreen(this.x, this.y, 0);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(shadowPos.x, shadowPos.y, 14, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#3730a3'; ctx.beginPath(); ctx.moveTo(pos.x - 10, pos.y); ctx.lineTo(pos.x, pos.y + 5); ctx.lineTo(pos.x + 10, pos.y); ctx.lineTo(pos.x, pos.y - 5); ctx.fill();
        ctx.fillStyle = '#4f46e5'; ctx.fillRect(pos.x - 4, pos.y - 15, 8, 15);
        ctx.fillStyle = '#c7d2fe'; ctx.beginPath(); ctx.arc(pos.x, pos.y - 15, 6, 0, Math.PI*2); ctx.fill();
        if (this.hp < this.maxHp) { ctx.fillStyle = '#000'; ctx.fillRect(pos.x - 10, pos.y - 25, 20, 4); ctx.fillStyle = '#10b981'; ctx.fillRect(pos.x - 9, pos.y - 24, 18 * (this.hp / this.maxHp), 2); }
    }
}
class Farm extends Entity {
    constructor(x, y) { super(x, y); this.type = 'farm'; this.hp = 100; this.maxHp = 100; this.cooldown = 180; }
    update() {
        super.update();
        if (this.cooldown > 0) {
            let hasSilo = entities.some(e => e.type === 'silo' && dist(this.x, this.y, e.x, e.y) < 6);
            this.cooldown -= hasSilo ? 2 : 1;
        } else {
            let nearbyFood = entities.filter(e => e.type === 'food' && dist(e.x, e.y, this.x, this.y) < 3);
            if (nearbyFood.length < 5) { let fx = this.x + (Math.random() * 2 - 1); let fy = this.y + (Math.random() * 2 - 1); entities.push(new Food(fx, fy)); }
            this.cooldown = 300; this.z = 4;
        }
        if (this.z > 0) this.z -= 0.1;
