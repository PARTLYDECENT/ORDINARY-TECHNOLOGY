<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOM CLASSIC // ARCADE CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oxanium:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050101;
            --accent-red: #ff2222;
            --accent-glow: rgba(255, 34, 34, 0.4);
            --text-primary: #f8f0f0;
            --text-muted: #997777;
            --border-glow: 0 0 15px rgba(255, 34, 34, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Ambient scanlines and CRT vignette */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 10, 10, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 34, 34, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.85) 100%);
            z-index: 101;
            pointer-events: none;
        }

        /* Top HUD Bar */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            border-bottom: 1px solid rgba(255, 34, 34, 0.2);
            background: rgba(15, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 10;
        }

        .hud-title {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--accent-red);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .hud-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* Arcade Cabinet Frame */
        .arcade-container {
            width: 820px;
            height: 620px;
            background: #000;
            border: 1px solid rgba(255, 34, 34, 0.3);
            border-radius: 8px;
            position: relative;
            box-shadow: var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            overflow: hidden;
        }

        .arcade-container iframe {
            width: 800px;
            height: 600px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 7;
        }

        /* Corner accents for sc-fi cabinet vibe */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            z-index: 6;
        }
        .corner.top-left { top: -1px; left: -1px; border-top-color: var(--accent-red); border-left-color: var(--accent-red); }
        .corner.top-right { top: -1px; right: -1px; border-top-color: var(--accent-red); border-right-color: var(--accent-red); }
        .corner.bottom-left { bottom: -1px; left: -1px; border-bottom-color: var(--accent-red); border-left-color: var(--accent-red); }
        .corner.bottom-right { bottom: -1px; right: -1px; border-bottom-color: var(--accent-red); border-right-color: var(--accent-red); }

        /* Navigation Button */
        .btn-back {
            display: inline-block;
            background: rgba(255, 34, 34, 0.05);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 34, 34, 0.1);
        }

        .btn-back:hover {
            background: var(--accent-red);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--accent-red);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <div class="hud-title">DOOM // CLASSIC</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span>SYSTEMS: ONLINE // JS-DOS</span>
        </div>
        <div>
            <a href="index.html" class="btn-back">Return to System</a>
        </div>
    </header>

    <div class="arcade-container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <iframe 
          src="https://js-dos.com/DOOM/" 
          width="800" 
          height="600" 
          style="border: none; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"
          allow="autoplay; keyboard"
          allowfullscreen>
        </iframe>
    </div>

</body>
</html>
