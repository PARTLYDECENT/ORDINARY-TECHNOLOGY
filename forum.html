  <script>
    // --- Global Variables ---
    const loadingBar = document.getElementById("loading-bar");
    const loadingText = document.getElementById("loading-text");
    const loadingScreen = document.getElementById("loading-screen");
    const weaponNameElement = document.getElementById("weapon-name");
    const techReadoutElement = document.getElementById("tech-readout");
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    const rootStyles = getComputedStyle(document.documentElement);

    // Weapon data (same as before)
    const weaponData = [
        { filename: "weapon1.glb", name: "Subject: KENJO REMNANT", tech: "SYS_STATUS: DAMAGED // PWR_LVL: 32% // SIG: CORRUPTED" },
        { filename: "weapon2.glb", name: "Subject: Makeshift Disruptor", tech: "SYS_STATUS: UNSTABLE // PWR_LVL: 115% // SIG: DANGEROUS" },
        { filename: "weapon3.glb", name: "Subject: 'Phase Ripper'", tech: "SYS_STATUS: FUNCTIONAL? // PWR_LVL: 68% // SIG: ODD" },
        { filename: "weapon4.glb", name: "Subject: Cracked Void Core", tech: "SYS_STATUS: LEAKING // PWR_LVL: 15% // SIG: HAZARDOUS" },
        { filename: "weapon5.glb", name: "Subject: Quantum 'Glitch'", tech: "SYS_STATUS: UNKNOWN // PWR_LVL: ??? // SIG: LOST" }
    ];

    // BabylonJS variables (same as before)
    let weapon;
    let originalMaterials = new Map();
    let isRotating = true;
    let currentWeaponIndex = 0;
    let environmentMode = 0;
    let mainLight, spotLight1, spotLight2, gl, camera; // Declare here for broader scope if needed

    // --- Web Audio API Variables ---
    let audioContext;
    let masterGain;
    let oscillator;
    let arpGain; // Gain node for individual note envelopes
    let filterNode;
    let delayNode;
    let feedbackGain;
    let lfo; // Low Frequency Oscillator for modulation
    let lfoGain; // Controls depth of LFO modulation
    let arpInterval; // Stores the setInterval ID
    let isAudioPlaying = false;
    let audioInitialized = false;

    // Arpeggiator Settings
    const bpm = 85; // Beats per minute - slightly slower, ominous
    const noteDuration = 60 / bpm / 4; // Time per 16th note
    const scale = { // C Minor scale notes (MIDI note numbers) - fits dark theme
        'C3': 48, 'D3': 50, 'Eb3': 51, 'F3': 53, 'G3': 55, 'Ab3': 56, 'Bb3': 58,
        'C4': 60, 'D4': 62, 'Eb4': 63, 'F4': 65, 'G4': 67, 'Ab4': 68, 'Bb4': 70,
        'C5': 72
    };
    // Simple arpeggio pattern (MIDI note numbers from the scale)
    const arpPattern = [
        scale.C3, scale.Eb3, scale.G3, scale.Bb3,
        scale.C4, scale.Eb4, scale.G4, scale.Bb4,
        scale.Ab4, scale.F4, scale.D4, scale.Bb3,
        scale.G3, scale.Eb4, scale.C4, scale.G3 // Repeating/varying pattern
    ];
    let currentNoteIndex = 0;

    // --- Helper Functions ---
    function midiNoteToFrequency(midiNote) {
        return Math.pow(2, (midiNote - 69) / 12) * 440;
    }

    function parseColor(cssVarName) {
        let colorString = rootStyles.getPropertyValue(cssVarName).trim();
        if (colorString.startsWith('#')) {
            return BABYLON.Color3.FromHexString(colorString);
        }
        return new BABYLON.Color3(0.1, 0.1, 0.1);
    }
    const grungeBgColor = parseColor('--grunge-bg');
    const grungeAccent1Color = parseColor('--grunge-accent1');
    const grungeAccent2Color = parseColor('--grunge-accent2');

    // --- Web Audio API Functions ---
    function initAudio() {
        if (audioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();

            // Create Nodes
            masterGain = audioContext.createGain();
            oscillator = audioContext.createOscillator();
            arpGain = audioContext.createGain();
            filterNode = audioContext.createBiquadFilter();
            delayNode = audioContext.createDelay(1.0); // Max 1 second delay
            feedbackGain = audioContext.createGain();
            lfo = audioContext.createOscillator();
            lfoGain = audioContext.createGain();

            // Configure Nodes
            masterGain.gain.value = 0.25; // Master volume (lower)
            oscillator.type = 'sawtooth'; // Grittier wave
            oscillator.frequency.value = 0; // Start silent
            arpGain.gain.value = 0; // Arp notes initially silent
            filterNode.type = 'lowpass';
            filterNode.frequency.value = 800; // Cut off high frequencies
            filterNode.Q.value = 2; // Slight resonance peak
            delayNode.delayTime.value = noteDuration * 3.5; // Delay time based on tempo (dotted 8th)
            feedbackGain.gain.value = 0.4; // Feedback amount for echoes
            lfo.type = 'sine';
            lfo.frequency.value = 0.3; // Slow LFO for subtle modulation
            lfoGain.gain.value = 100; // LFO depth (modulates filter frequency by +/- 100Hz)

            // Connect Nodes (Audio Path)
            oscillator.connect(filterNode);
            filterNode.connect(arpGain);
            arpGain.connect(masterGain);
            arpGain.connect(delayNode); // Send arp signal to delay
            delayNode.connect(feedbackGain);
            feedbackGain.connect(delayNode); // Feedback loop
            delayNode.connect(masterGain); // Connect delay output to master
            masterGain.connect(audioContext.destination);

            // Connect Nodes (Modulation Path)
            lfo.connect(lfoGain);
            lfoGain.connect(filterNode.frequency); // LFO modulates filter cutoff

            // Start Oscillators
            oscillator.start();
            lfo.start();

            audioInitialized = true;
            console.log("Audio Engine Initialized.");

        } catch (e) {
            console.error("Web Audio API is not supported or failed to initialize:", e);
            alert("Web Audio API initialization failed. Audio will not be available.");
            // Disable audio button if init fails
            const audioBtn = document.getElementById("audio-toggle-btn");
            if(audioBtn) {
                audioBtn.disabled = true;
                audioBtn.textContent = "AUDIO N/A";
            }
        }
    }

    function scheduleNote() {
        if (!audioContext || audioContext.state !== 'running') return;

        const noteMidi = arpPattern[currentNoteIndex % arpPattern.length];
        const freq = midiNoteToFrequency(noteMidi);
        const currentTime = audioContext.currentTime;

        // Schedule oscillator frequency change
        oscillator.frequency.setValueAtTime(freq, currentTime);

        // Schedule gain envelope for the note
        arpGain.gain.cancelScheduledValues(currentTime); // Clear previous ramps
        arpGain.gain.setValueAtTime(0, currentTime); // Start silent
        arpGain.gain.linearRampToValueAtTime(0.4, currentTime + 0.01); // Quick attack
        arpGain.gain.linearRampToValueAtTime(0.0, currentTime + noteDuration * 0.8); // Decay before next note starts

        currentNoteIndex++;
    }

    function startArpeggiator() {
        if (!audioInitialized) {
            console.warn("Audio not initialized yet.");
            return;
        }
        if (isAudioPlaying) return; // Already playing

        // Resume context if suspended (required by browser autoplay policies)
        if (audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                console.log("AudioContext resumed.");
                // Start scheduling after resume
                if (!arpInterval) { // Prevent multiple intervals
                     currentNoteIndex = 0; // Reset pattern position
                    scheduleNote(); // Play the first note immediately
                    arpInterval = setInterval(scheduleNote, noteDuration * 1000); // Schedule subsequent notes
                    isAudioPlaying = true;
                     document.getElementById("audio-toggle-btn").textContent = "AUDIO: ON";
                    console.log("Arpeggiator Started (after resume).");
                }
            }).catch(err => console.error("AudioContext resume failed:", err));
        } else if (audioContext.state === 'running') {
             if (!arpInterval) {
                 currentNoteIndex = 0; // Reset pattern position
                 scheduleNote(); // Play the first note immediately
                 arpInterval = setInterval(scheduleNote, noteDuration * 1000);
                 isAudioPlaying = true;
                  document.getElementById("audio-toggle-btn").textContent = "AUDIO: ON";
                 console.log("Arpeggiator Started.");
            }
        } else {
            console.warn("AudioContext is not in a runnable state:", audioContext.state);
        }
    }

    function stopArpeggiator() {
        if (!isAudioPlaying || !arpInterval) return;

        clearInterval(arpInterval);
        arpInterval = null;
        // Fade out the last note smoothly
        if (audioContext && arpGain) {
             const currentTime = audioContext.currentTime;
             arpGain.gain.cancelScheduledValues(currentTime);
             arpGain.gain.setValueAtTime(arpGain.gain.value, currentTime); // Hold current value
             arpGain.gain.linearRampToValueAtTime(0.0, currentTime + 0.2); // Fade out over 0.2s
        }
        isAudioPlaying = false;
         document.getElementById("audio-toggle-btn").textContent = "AUDIO: OFF";
        console.log("Arpeggiator Stopped.");
    }


    // --- BabylonJS Scene Setup (Simplified - showing only light/scene adjustments) ---
    function setupScene() {
        scene.clearColor = new BABYLON.Color4(grungeBgColor.r, grungeBgColor.g, grungeBgColor.b, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
        scene.fogDensity = 0.03;
        scene.fogColor = grungeBgColor;

        camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 6, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 2;
        camera.upperRadiusLimit = 20;
        camera.wheelDeltaPercentage = 0.015;

        mainLight = new BABYLON.HemisphericLight("mainLight", new BABYLON.Vector3(0.1, 1, -0.2), scene);
        mainLight.intensity = 0.4;
        mainLight.diffuse = new BABYLON.Color3(0.6, 0.6, 0.7);
        mainLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.1);

        spotLight1 = new BABYLON.SpotLight("spotLight1", new BABYLON.Vector3(6, 7, 2), new BABYLON.Vector3(-1, -1, -0.3), Math.PI / 5, 5, scene);
        spotLight1.diffuse = grungeAccent1Color;
        spotLight1.intensity = 1.0;

        spotLight2 = new BABYLON.SpotLight("spotLight2", new BABYLON.Vector3(-5, 4, -6), new BABYLON.Vector3(1, -0.8, 1), Math.PI / 6, 8, scene);
        spotLight2.diffuse = grungeAccent2Color;
        spotLight2.intensity = 0.8;

        // Flicker animation (same as before)
        const flickerAnim = new BABYLON.Animation("flicker", "intensity", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE);
        flickerAnim.setKeys([ { frame: 0, value: 1.0 }, { frame: 5, value: 0.4 }, { frame: 10, value: 1.2 }, { frame: 15, value: 0.7 }, { frame: 25, value: 1.0 }, { frame: 30, value: 0.5 }, { frame: 40, value: 1.0 }, { frame: 42, value: 0.9 }, { frame: 50, value: 1.1 }, { frame: 60, value: 1.0 } ]);
        spotLight1.animations.push(flickerAnim);
        scene.beginAnimation(spotLight1, 0, 60, true, Math.random() * 0.5 + 0.8);
        const flickerAnim2 = flickerAnim.clone();
        flickerAnim2.getKeys().forEach(k => k.value *= 0.8);
        spotLight2.animations.push(flickerAnim2);
        scene.beginAnimation(spotLight2, 0, 60, true, Math.random() * 0.5 + 0.6);

        gl = new BABYLON.GlowLayer("glow", scene);
        gl.intensity = 0.4;
        gl.blurKernelSize = 16;

        const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);
        scene.environmentTexture = hdrTexture;
        scene.environmentIntensity = 0.5;
    }

    // --- Loading Sequence (Modified to init/start audio) ---
    function startLoadingSequence() {
        loadingScreen.style.display = "flex";
        loadingScreen.style.opacity = "1";

        // Initialize audio engine silently while loading
        initAudio();

        let loadProgress = 0;
        const loadingTexts = [ "SCANNING DAMAGED SECTORS...", "BYPASSING SECURITY LOCKS...", "DEFRAGMENTING CORRUPTED FILES...", "RECOVERING ASSET DATA...", "WARNING: SYSTEM INSTABILITY DETECTED...", "RENDERING FROM CACHE...", "AUDIO SUBSYSTEM CHECK...", "INTERFACE MAY BE UNRELIABLE..." ];
        let textIndex = 0;
        loadingText.textContent = loadingTexts[textIndex];

        const loadingInterval = setInterval(() => {
            loadProgress += Math.random() * 10 + 5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                loadingBar.style.width = loadProgress + "%";
                loadingText.textContent = "SYSTEM ONLINE... ERRORS PRESENT.";

                clearInterval(loadingInterval);

                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        // ** Start Arpeggiator when loading screen is fully hidden **
                        // This relies on user interaction later via the toggle button
                        // or automatically if the browser allows it.
                        // Let's attempt to start it here, but rely on the button if it fails.
                        // We won't start it automatically here to be safer with autoplay.
                        // User MUST click the "AUDIO: OFF" button first.
                        console.log("Loading finished. Audio ready to be started by user.");
                    }, 1000); // Match CSS transition duration
                }, 800);
            } else {
                loadingBar.style.width = loadProgress + "%";
                if (Math.random() > 0.7) {
                    textIndex = (textIndex + 1) % loadingTexts.length;
                    loadingText.textContent = loadingTexts[textIndex];
                }
            }
        }, 350);
    }

    // --- Weapon Loading & Environment Mode (Mostly Unchanged) ---
    function loadWeapon(weaponIndex) {
        // ... (Existing weapon loading logic) ...
        // Show loading screen
        loadingScreen.style.display = "flex";
        loadingScreen.style.opacity = "1";
        loadingBar.style.width = "0%";
        loadingText.textContent = "ACCESSING DAMAGED ARCHIVE..."; // Update loading text

        const weaponInfo = weaponData[weaponIndex];
        currentWeaponIndex = weaponIndex;

        weaponNameElement.textContent = weaponInfo.name;
        techReadoutElement.textContent = weaponInfo.tech;

        // Simulate loading progress (similar logic, maybe adjusted text)
        let loadProgress = 0;
        const loadingTextsLoad = [ "DECRYPTING FRAGMENT...", "RECONSTRUCTING DATA...", "WARNING: DATA INTEGRITY LOW...", "RENDERING BEST GUESS..." ];
        let loadTextIdx = 0;
        loadingText.textContent = loadingTextsLoad[loadTextIdx];

        const loadingIntervalLoad = setInterval(() => {
            loadProgress += Math.random() * 15 + 5;
            if (loadProgress >= 100) {
                loadProgress = 100;
                clearInterval(loadingIntervalLoad);
                loadingBar.style.width = "100%";
                loadingText.textContent = "ASSET RENDERED (ERRORS POSSIBLE)";
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                    }, 800); // Match transition
                }, 600);
            } else {
                loadingBar.style.width = loadProgress + "%";
                if (Math.random() > 0.6) {
                     loadTextIdx = (loadTextIdx + 1) % loadingTextsLoad.length;
                     loadingText.textContent = loadingTextsLoad[loadTextIdx];
                }
            }
        }, 150); // Faster loading sim for subsequent loads


        if (weapon) {
            const animGroup = scene.getAnimationGroupByName("rotationGroup");
            if (animGroup) { animGroup.stop(); }
            weapon.getChildMeshes(false).forEach(mesh => { // Include root
                 if (originalMaterials.has(mesh.uniqueId)) {
                    // If we cloned materials for modes, dispose the clones
                    if (mesh.material && mesh.material !== originalMaterials.get(mesh.uniqueId)) {
                        mesh.material.dispose();
                    }
                } else if(mesh.material) {
                    // If material wasn't stored (e.g. from error state), dispose it
                    mesh.material.dispose();
                 }
            });
            weapon.dispose();
            originalMaterials.clear(); // Clear stored materials
        }

        BABYLON.SceneLoader.ImportMesh("", "assets/weapons/", weaponInfo.filename, scene, (meshes) => {
            if (meshes.length > 0) {
                weapon = meshes[0];
                weapon.position = BABYLON.Vector3.Zero(); // Center it

                originalMaterials.clear(); // Ensure map is clear before population
                weapon.getChildMeshes(true).forEach(mesh => { // Include root mesh itself if it has geometry
                    if (mesh.material) {
                        originalMaterials.set(mesh.uniqueId, mesh.material); // Store original
                        gl.removeIncludedOnlyMesh(mesh); // Clear from glow initially
                         if (mesh.material.emissiveColor && (mesh.material.emissiveColor.r > 0.1 || mesh.material.emissiveColor.g > 0.1 || mesh.material.emissiveColor.b > 0.1)) {
                             // Added check for existence before adding
                             if(gl) gl.addIncludedOnlyMesh(mesh);
                        }
                    }
                });
                updateEnvironmentMode(); // Apply current mode (likely 0)

                const rotationAnimation = new BABYLON.Animation( "rotationAnimation", "rotation.y", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE );
                rotationAnimation.setKeys([ { frame: 0, value: weapon.rotation.y }, { frame: 450, value: weapon.rotation.y + 2 * Math.PI } ]);
                weapon.animations = []; // Clear previous anims if any
                weapon.animations.push(rotationAnimation);

                if (isRotating) {
                    scene.beginAnimation(weapon, 0, 450, true, 0.4, null, "rotationGroup"); // Slower speed (0.4)
                }
            } else { /* Error Handling */ }
        }, null, (scene, message, exception) => { /* Error Handling */ });
    }

    function updateEnvironmentMode() {
        // ... (Existing environment mode logic) ...
        if (!weapon || !originalMaterials) return;
        if (gl) gl.customEmissiveColorSelector = null; // Reset glow selector

        weapon.getChildMeshes(true).forEach(mesh => {
            const originalMat = originalMaterials.get(mesh.uniqueId);
            if (!originalMat) {
                 // console.warn(`Original material not found for mesh ID: ${mesh.uniqueId}, Name: ${mesh.name}`);
                 // If no original, maybe skip or apply a default fallback material?
                 // Fallback: Ensure it has some material to avoid render issues
                 if (!mesh.material) {
                      mesh.material = new BABYLON.StandardMaterial(`fallback_${mesh.uniqueId}`, scene);
                 }
                 return; // Skip mode logic if original is missing
            }

             // Dispose previous temporary/cloned material if it exists and is not the original
             if (mesh.material && mesh.material !== originalMat && !mesh.material.isDisposed) {
                // Check if it's a known clone pattern or just different
                if (mesh.material.name.includes("_scan") || mesh.material.name.includes("_heat")) {
                     mesh.material.dispose();
                } else {
                    // If it's some other material, maybe log it but don't dispose? Or do? Depends on logic.
                     // console.log(`Mesh ${mesh.name} has unexpected material: ${mesh.material.name}`);
                }
                mesh.material = null; // Clear reference
             }


            // Apply new material/settings based on mode
            switch(environmentMode) {
                case 0: // Normal (Restore original)
                     if (!mesh.material || mesh.material.isDisposed || mesh.material !== originalMat) {
                         mesh.material = originalMat; // Assign original back
                     }
                     mesh.visibility = 1.0;
                     mesh.overlayColor = BABYLON.Color3.Black(); // Ensure no overlay
                     mesh.renderOverlay = false;
                     if (mesh.material.alpha < 1.0) mesh.material.alpha = 1.0; // Reset alpha if changed
                     mesh.material.wireframe = false; // Ensure wireframe off
                    break;

                case 1: // Scan Mode (Wireframe + Accent Color)
                     // Only clone if we need to modify it or if current isn't the clone
                    if (!mesh.material || mesh.material.isDisposed || !mesh.material.name.includes("_scan")) {
                        mesh.material = originalMat.clone(`${originalMat.name}_scan_${mesh.uniqueId}`); // Clone to avoid modifying original, add unique ID
                    }
                    mesh.material.wireframe = true;
                    mesh.material.emissiveColor = grungeAccent2Color.scale(0.7); // Dim teal emissive
                    mesh.material.diffuseColor = BABYLON.Color3.Black(); // No diffuse
                    mesh.material.specularColor = BABYLON.Color3.Black(); // No specular
                    mesh.material.alpha = 0.8;
                    mesh.visibility = 0.9;
                    mesh.overlayColor = grungeAccent2Color; // Set overlay color
                    mesh.renderOverlay = true; // Enable overlay rendering
                    mesh.overlayAlpha = 0.15; // Overlay intensity
                    break;

                case 2: // Heat/Error Scan (Red/Orange + Noise)
                     if (!mesh.material || mesh.material.isDisposed || !mesh.material.name.includes("_heat")) {
                         mesh.material = originalMat.clone(`${originalMat.name}_heat_${mesh.uniqueId}`);
                     }
                     mesh.material.wireframe = false;
                     // Use emissive texture if available, otherwise solid color
                     // if (mesh.material.emissiveTexture) { } // Keep original texture if exists on clone
                      mesh.material.emissiveColor = grungeAccent1Color.scale(0.6); // Rusty base
                      mesh.material.diffuseColor = BABYLON.Color3.Black();
                      mesh.material.specularColor = grungeAccent1Color.scale(0.2); // Slight rusty specular
                      mesh.material.alpha = 0.75;
                      mesh.visibility = 0.85;
                      // Use glow layer for heat effect
                      if (gl) {
                            gl.customEmissiveColorSelector = (mesh, subMesh, material, result) => {
                                result.set(1, 0.4, 0.1, 0.8); // Override glow color to orange/red
                            };
                       }
                    break;
            }
             // Re-add/remove from glow layer based on current mode and emissive properties
            if (gl) {
                gl.removeIncludedOnlyMesh(mesh); // Remove first to be safe
                if (environmentMode !== 1 && mesh.material && mesh.material.emissiveColor && (mesh.material.emissiveColor.r > 0.1 || mesh.material.emissiveColor.g > 0.1 || mesh.material.emissiveColor.b > 0.1)) {
                    gl.addIncludedOnlyMesh(mesh);
                }
            }
        });
    }

    // --- Event Listeners ---
    function setupEventListeners() {
        document.getElementById("weapon1-btn").addEventListener("click", () => loadWeapon(0));
        document.getElementById("weapon2-btn").addEventListener("click", () => loadWeapon(1));
        document.getElementById("weapon3-btn").addEventListener("click", () => loadWeapon(2));
        document.getElementById("weapon4-btn").addEventListener("click", () => loadWeapon(3));
        document.getElementById("weapon5-btn").addEventListener("click", () => loadWeapon(4));

        document.getElementById("rotate-btn").addEventListener("click", function() {
            if (!weapon) return; isRotating = !isRotating;
            const animGroup = scene.getAnimationGroupByName("rotationGroup");
            if (isRotating) { if (animGroup) animGroup.play(true); else scene.beginAnimation(weapon, 0, 450, true, 0.4, null, "rotationGroup"); }
            else { if (animGroup) animGroup.pause(); }
            this.textContent = `ROTATION: ${isRotating ? 'ON' : 'OFF'}`;
        });

        document.getElementById("zoom-in-btn").addEventListener("click", () => {
            BABYLON.Animation.CreateAndStartAnimation('zoomIn', camera, 'radius', 30, 10, camera.radius, Math.max(camera.lowerRadiusLimit, camera.radius * 0.7), 0, new BABYLON.ExponentialEase());
        });
        document.getElementById("zoom-out-btn").addEventListener("click", () => {
            BABYLON.Animation.CreateAndStartAnimation('zoomOut', camera, 'radius', 30, 10, camera.radius, Math.min(camera.upperRadiusLimit, camera.radius * 1.3), 0, new BABYLON.ExponentialEase());
        });

        let lightsOn = true;
        document.getElementById("lights-btn").addEventListener("click", function() {
            lightsOn = !lightsOn;
            if (lightsOn) { scene.beginAnimation(spotLight1, 0, 60, true, Math.random()*0.5+0.8); scene.beginAnimation(spotLight2, 0, 60, true, Math.random()*0.5+0.6); mainLight.intensity = 0.4; gl.intensity = 0.4; this.textContent = "LIGHTS: FLICKER"; }
            else { scene.stopAnimation(spotLight1); scene.stopAnimation(spotLight2); spotLight1.intensity = 0.05; spotLight2.intensity = 0.03; mainLight.intensity = 0.1; gl.intensity = 0.2; this.textContent = "LIGHTS: MINIMAL"; }
        });

        document.getElementById("env-btn").addEventListener("click", function() {
            environmentMode = (environmentMode + 1) % 3; updateEnvironmentMode();
            const modes = ["NORMAL", "SCAN MODE", "HEAT SCAN"]; this.textContent = `MODE: ${modes[environmentMode]}`;
        });

        // NEW Audio Toggle Button Listener
        document.getElementById("audio-toggle-btn").addEventListener("click", function() {
            if (!audioInitialized) {
                console.log("Audio engine not ready.");
                return; // Don't toggle if not ready
            }
            if (isAudioPlaying) {
                stopArpeggiator();
            } else {
                startArpeggiator();
            }
        });

        window.addEventListener("resize", () => engine.resize());
    }

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        setupScene();
        setupEventListeners();
        startLoadingSequence(); // Start loading, which includes audio init
        loadWeapon(0); // Load initial weapon after basic setup

        // Start the BabylonJS render loop
        engine.runRenderLoop(() => {
            scene.render();
        });
    });

  </script>
</body>
