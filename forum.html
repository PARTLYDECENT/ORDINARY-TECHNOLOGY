<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ORDINARY TECHNOLOGY - Weapon Viewer</title>
  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-purple: #9600ff;
      --neon-red: #ff003c; /* Kept for potential future use, e.g., highlighting */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Orbitron', sans-serif;
      color: white;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      position: absolute;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      /* Optional: Keep a subtle gradient or remove entirely */
      /* background: linear-gradient(135deg, rgba(0,0,40,0.1) 0%, rgba(0,0,0,0) 50%); */
    }

    /* HUD Elements */
    .hud {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }

    .header {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem; /* Slightly smaller */
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 8px var(--neon-blue);
      letter-spacing: 2px;
    }

    .status-bar {
      bottom: 30px;
      left: 30px;
      width: auto; /* Adjust width based on content */
      min-width: 250px;
      height: auto;
      border: 1px solid var(--neon-blue); /* Thinner border */
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      box-shadow: 0 0 10px var(--neon-blue);
    }

    .weapon-name {
      font-size: 1rem;
      margin-bottom: 0; /* Removed margin */
      color: var(--neon-blue);
    }

    /* Removed .weapon-stats, .damage-meter, .reticle, .fact-popup, .holo-rings, .energy-field, .warning, .scan-line */

    /* Corner decorations (kept for subtle style) */
    .corner {
      position: absolute;
      width: 30px; /* Smaller */
      height: 30px; /* Smaller */
      z-index: 3;
      opacity: 0.6;
    }

    .top-left { top: 10px; left: 10px; border-top: 1px solid var(--neon-blue); border-left: 1px solid var(--neon-blue); }
    .top-right { top: 10px; right: 10px; border-top: 1px solid var(--neon-blue); border-right: 1px solid var(--neon-blue); }
    .bottom-left { bottom: 10px; left: 10px; border-bottom: 1px solid var(--neon-blue); border-left: 1px solid var(--neon-blue); }
    .bottom-right { bottom: 10px; right: 10px; border-bottom: 1px solid var(--neon-blue); border-right: 1px solid var(--neon-blue); }

    /* Control panel */
    .control-panel {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 150px; /* Narrower */
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--neon-purple);
      border-radius: 5px;
      padding: 10px;
      z-index: 10;
      box-shadow: 0 0 10px var(--neon-purple);
    }

    .control-title {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--neon-purple);
      text-align: center;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1fr; /* Single column */
      gap: 8px;
    }

    .control-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--neon-blue);
      color: white;
      padding: 8px;
      border-radius: 5px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s;
      pointer-events: auto; /* Make buttons clickable */
      text-align: center;
    }

    .control-btn:hover {
      background: rgba(0, 180, 255, 0.2);
      box-shadow: 0 0 5px var(--neon-blue);
    }

    /* Loading screen (kept) */
    .loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 1s;
    }

    .loading-title {
      font-size: 2.5rem;
      color: var(--neon-blue);
      margin-bottom: 20px;
      text-shadow: 0 0 8px var(--neon-blue);
    }

    .loading-bar-container {
      width: 300px;
      height: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      transition: width 0.5s; /* Faster transition */
    }

    .loading-text {
      color: white;
      font-size: 0.9rem;
    }

     /* Removed particles.js related styles */

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
  </head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div class="overlay"></div>
  <div class="hud header">WEAPON VIEWER</div> <div class="hud status-bar">
    <div class="weapon-name">O.T.S.F.M.B.R.C.A. XXXKENJOXXX</div> </div>

  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>

  <div class="control-panel">
    <div class="control-title">VIEW CONTROLS</div>
    <div class="control-grid">
      <button class="control-btn" id="rotate-btn">TOGGLE ROTATE</button>
      <button class="control-btn" id="zoom-in-btn">ZOOM IN</button>
      <button class="control-btn" id="zoom-out-btn">ZOOM OUT</button>
      <button class="control-btn" id="lights-btn">TOGGLE LIGHTS</button>
      </div>
  </div>

  <div class="loading-screen" id="loading-screen">
    <div class="loading-title">LOADING MODEL</div>
    <div class="loading-bar-container">
      <div class="loading-bar" id="loading-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Please wait...</div>
  </div>

  <script>
    // Initialize the loading sequence
    const loadingBar = document.getElementById("loading-bar");
    const loadingText = document.getElementById("loading-text");
    const loadingScreen = document.getElementById("loading-screen");

    // --- Loading Simulation ---
    // You might replace this with actual progress feedback from Babylon.js SceneLoader if needed
    let loadProgress = 0;
    const loadingInterval = setInterval(() => {
      loadProgress += Math.random() * 25; // Faster loading steps
      if (loadProgress >= 100) {
        loadProgress = 100;
        clearInterval(loadingInterval);
        loadingBar.style.width = "100%";
        loadingText.textContent = "MODEL LOADED";
        setTimeout(() => {
          loadingScreen.style.opacity = "0";
          setTimeout(() => {
            loadingScreen.style.display = "none";
          }, 1000); // Fade out duration
        }, 500); // Wait briefly after load complete
      } else {
        loadingBar.style.width = loadProgress + "%";
      }
    }, 100); // Faster interval

    // Removed facts array and related functions

    // Initialize Babylon.js scene
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    // Set scene background and properties
    scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.03, 1); // Slightly lighter dark blue

    // Create a camera - ArcRotateCamera is good for model viewing
    const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true); // Allow user control (orbit, zoom, pan)
    camera.lowerRadiusLimit = 1; // Allow closer zoom
    camera.upperRadiusLimit = 20; // Allow further zoom out
    camera.wheelDeltaPercentage = 0.02; // Adjust zoom speed

    // Add lights
    const mainLight = new BABYLON.HemisphericLight("mainLight", new BABYLON.Vector3(0, 1, 0), scene);
    mainLight.intensity = 0.8;

    // Optional: Add a directional light for better shading
    const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-0.5, -1, 0.5), scene);
    dirLight.intensity = 0.5;

    // Removed point lights for simplicity, but can be added back if desired
    // Removed ground reflection plane

    // Add a glow layer (optional, enhances emissive parts)
    const gl = new BABYLON.GlowLayer("glow", scene);
    gl.intensity = 0.6; // Reduced intensity

    // Variable to store loaded weapon and rotation state
    let weapon;
    let isRotating = true; // Start rotating by default

    // Load the GLB weapon model
    BABYLON.SceneLoader.ImportMesh("", "assets/weapons/", "weapon1.glb", scene, (meshes) => {
      if (meshes.length > 0) {
          weapon = meshes[0]; // Assuming the main mesh is the first one
          weapon.position = new BABYLON.Vector3(0, 0, 0); // Center the model
          // Optional: Auto-scale or center the model if needed
          // const boundingInfo = weapon.getHierarchyBoundingVectors();
          // const size = boundingInfo.max.subtract(boundingInfo.min);
          // const maxDim = Math.max(size.x, size.y, size.z);
          // weapon.scaling.scaleInPlace(3 / maxDim); // Example scaling to fit ~3 units
          // weapon.position = boundingInfo.center.scale(-1).scale(weapon.scaling.x); // Center pivot

          // Apply glow to meshes with emissive materials if desired
          meshes.forEach(mesh => {
              if (mesh.material && mesh.material.emissiveColor && (mesh.material.emissiveColor.r > 0 || mesh.material.emissiveColor.g > 0 || mesh.material.emissiveColor.b > 0)) {
                 gl.addIncludedOnlyMesh(mesh);
              } else if (mesh.material) {
                 // Optional: Tweak non-emissive materials if needed
                 // mesh.material.metallic = 0.5;
                 // mesh.material.roughness = 0.4;
              }
          });

          // Setup rotation animation (we control start/stop via button)
          const rotationAnimation = new BABYLON.Animation(
              "rotationAnimation", "rotation.y", 30,
              BABYLON.Animation.ANIMATIONTYPE_FLOAT,
              BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE
          );
          rotationAnimation.setKeys([ { frame: 0, value: 0 }, { frame: 300, value: 2 * Math.PI } ]);
          weapon.animations.push(rotationAnimation);

          // Start rotation initially
          scene.beginAnimation(weapon, 0, 300, true, 1.0, null, "rotationGroup");

      } else {
          console.error("Failed to load weapon model or model is empty.");
          loadingText.textContent = "ERROR LOADING MODEL";
      }
    }, (progress) => {
        // Optional: Update loading bar with actual progress
        // let percent = progress.loaded / progress.total * 100;
        // loadingBar.style.width = percent + "%";
        // loadingText.textContent = `Loading: ${Math.round(percent)}%`;
    }, (scene, message, exception) => {
        console.error("Error during model loading:", message, exception);
        loadingText.textContent = "ERROR LOADING MODEL";
    });

    // Removed Skybox for cleaner background, but can be added back
    // Removed Particle Systems

    // Control panel functionality
    document.getElementById("rotate-btn").addEventListener("click", function() {
        if (weapon) {
            isRotating = !isRotating;
            const animGroup = scene.getAnimationGroupByName("rotationGroup");
            if (isRotating) {
                if (animGroup && animGroup.isStarted && !animGroup.isPlaying) {
                     animGroup.play(true); // Resume if paused
                } else if (!animGroup || !animGroup.isStarted) {
                     scene.beginAnimation(weapon, 0, 300, true, 1.0, null, "rotationGroup"); // Start if not started
                }
            } else {
                if (animGroup && animGroup.isPlaying) {
                    animGroup.pause(); // Pause the rotation
                }
            }
        }
    });

    document.getElementById("zoom-in-btn").addEventListener("click", function() {
        // Animate zoom in
        BABYLON.Animation.CreateAndStartAnimation('zoomIn', camera, 'radius', 30, 15, camera.radius, Math.max(camera.lowerRadiusLimit, camera.radius * 0.7), BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
    });
    document.getElementById("zoom-out-btn").addEventListener("click", function() {
        // Animate zoom out
         BABYLON.Animation.CreateAndStartAnimation('zoomOut', camera, 'radius', 30, 15, camera.radius, Math.min(camera.upperRadiusLimit, camera.radius * 1.3), BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
    });

    let lightsOn = true;
    document.getElementById("lights-btn").addEventListener("click", function() {
        lightsOn = !lightsOn;
        mainLight.intensity = lightsOn ? 0.8 : 0.1; // Dim main light
        dirLight.intensity = lightsOn ? 0.5 : 0; // Turn off directional
        gl.intensity = lightsOn ? 0.6 : 0; // Turn off glow
        // Toggle other lights if they were added back
    });

    // Removed facts, scan, power-up button logic
    // Removed random fact/warning intervals
    // Removed light animation (animateLights)

    // Resize the engine on window resize
    window.addEventListener("resize", function() {
      engine.resize();
    });

    // Run the render loop
    engine.runRenderLoop(function() {
      scene.render();
    });

  </script>
</body>
</html>
