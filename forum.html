  <div class="lab-loading" id="loading-screen"> <div class="loading-title">REBOOTING SYSTEM...</div> <div class="loading-bar-container"> <div class="loading-bar" id="loading-bar"></div> </div> <div class="loading-text" id="loading-text">...</div> </div>

  <script>
    // --- Global Variables ---
    // [Previous globals: loadingBar, loadingText, etc.]
    const loadingBar = document.getElementById("loading-bar");
    const loadingText = document.getElementById("loading-text");
    const loadingScreen = document.getElementById("loading-screen");
    const weaponNameElement = document.getElementById("weapon-name");
    const techReadoutElement = document.getElementById("tech-readout");
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    const rootStyles = getComputedStyle(document.documentElement);
    const weaponData = [ { filename: "weapon1.glb", name: "Subject: KENJO REMNANT", tech: "SYS_STATUS: DAMAGED // PWR_LVL: 32% // SIG: CORRUPTED" }, { filename: "weapon2.glb", name: "Subject: Makeshift Disruptor", tech: "SYS_STATUS: UNSTABLE // PWR_LVL: 115% // SIG: DANGEROUS" }, { filename: "weapon3.glb", name: "Subject: 'Phase Ripper'", tech: "SYS_STATUS: FUNCTIONAL? // PWR_LVL: 68% // SIG: ODD" }, { filename: "weapon4.glb", name: "Subject: Cracked Void Core", tech: "SYS_STATUS: LEAKING // PWR_LVL: 15% // SIG: HAZARDOUS" }, { filename: "weapon5.glb", name: "Subject: Quantum 'Glitch'", tech: "SYS_STATUS: UNKNOWN // PWR_LVL: ??? // SIG: LOST" } ];
    let weapon, originalMaterials = new Map(), isRotating = true, currentWeaponIndex = 0, environmentMode = 0;
    let mainLight, spotLight1, spotLight2, gl, camera;

    // --- Web Audio API Variables ---
    let audioContext;
    let masterGain;
    // Arp Voice
    let arpOsc1, arpOsc2, arpGain, arpFilter, arpLFO, arpLfoGain;
    // Bass Voice
    let bassOsc, bassGain, bassFilter;
    // Effects
    let delayNode, feedbackGain, reverbNode, reverbGain; // Added reverb
    // Sequencer
    let nextNoteTime = 0.0; // Start time for the next note
    let currentStep = 0; // Current step in the sequence
    let scheduleAheadTime = 0.1; // How far ahead to schedule notes (in seconds)
    let schedulerIntervalID = null; // ID for stopping the interval/timeout loop
    let isAudioPlaying = false;
    let audioInitialized = false;
    let analyserNode; // For potential visualization later

    // --- Audio Settings ---
    const bpm = 95; // Slightly faster tempo
    const stepDuration = 60.0 / bpm / 4.0; // Duration of a 16th note step
    const stepsPerMeasure = 16;
    const velocityRandomness = 0.2; // How much to vary note gain (0 to 1)
    const timingRandomness = 0.01; // Max random offset for timing (in seconds)

    // --- Musical Data ---
    const Notes = { // MIDI note numbers
      C2: 36, Eb2: 39, F2: 41, G2: 43, Ab2: 44, Bb2: 46,
      C3: 48, Eb3: 51, F3: 53, G3: 55, Ab3: 56, Bb3: 58,
      C4: 60, Eb4: 63, F4: 65, G4: 67, Ab4: 68, Bb4: 70,
      C5: 72, Eb5: 75, F5: 77, G5: 79
    };

    // Chord Progression (Cm - Gm - Ab - Eb) - Each chord lasts 1 measure (16 steps)
    const chordProgression = [
      { root: Notes.C3, notes: [Notes.C4, Notes.Eb4, Notes.G4, Notes.C5, Notes.Eb5], bass: Notes.C2 }, // Cm
      { root: Notes.G3, notes: [Notes.G3, Notes.Bb3, Notes.D4, Notes.G4, Notes.Bb4], bass: Notes.G2 }, // Gm
      { root: Notes.Ab3, notes: [Notes.Ab3, Notes.C4, Notes.Eb4, Notes.Ab4, Notes.C5], bass: Notes.Ab2 },// Ab
      { root: Notes.Eb3, notes: [Notes.Eb3, Notes.G3, Notes.Bb3, Notes.Eb4, Notes.G4], bass: Notes.Eb2 } // Eb
    ];
    let currentChordIndex = 0;

    // Arpeggio patterns (array of indices into the current chord's 'notes' array, or null for rest)
    const arpPatterns = [
      [0, 1, 2, 1, 3, 2, 4, 2, 0, 1, 2, 1, 3, null, 2, null], // Pattern 1 (up/down with rests)
      [4, 3, 2, 1, 0, 1, 2, 3, 4, 2, 0, null, 3, 1, null, 0], // Pattern 2 (down/up variation)
      [0, 2, 4, null, 1, 3, null, 4, 0, 2, 4, null, 1, 3, null, 2], // Pattern 3 (more sparse)
    ];
    let currentArpPatternIndex = 0;


    // --- Helper Functions ---
    function midiNoteToFrequency(midiNote) {
        return Math.pow(2, (midiNote - 69) / 12) * 440;
    }
    // [parseColor function remains the same]
    function parseColor(cssVarName) { let colorString = rootStyles.getPropertyValue(cssVarName).trim(); if (colorString.startsWith('#')) { return BABYLON.Color3.FromHexString(colorString); } return new BABYLON.Color3(0.1, 0.1, 0.1); }
    const grungeBgColor = parseColor('--grunge-bg'); const grungeAccent1Color = parseColor('--grunge-accent1'); const grungeAccent2Color = parseColor('--grunge-accent2');

    // --- Web Audio API Functions ---
    async function createReverb() {
        // Simple Schroeder Reverb Approximation using delays
        // More realistic reverb needs ConvolverNode and an Impulse Response file
        // For simplicity here, we'll chain delays.
        let revDelay1 = audioContext.createDelay(0.31);
        let revFdbk1 = audioContext.createGain(); revFdbk1.gain.value = 0.3;
        let revDelay2 = audioContext.createDelay(0.53);
        let revFdbk2 = audioContext.createGain(); revFdbk2.gain.value = 0.25;
        let revFilter = audioContext.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500;

        revDelay1.connect(revFdbk1).connect(revDelay1); // Feedback loop 1
        revDelay1.connect(revDelay2);
        revDelay2.connect(revFdbk2).connect(revDelay2); // Feedback loop 2
        revDelay2.connect(revFilter);

        return { input: revDelay1, output: revFilter };
    }

    async function initAudio() {
        if (audioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            await audioContext.resume(); // Attempt to resume immediately

            // --- Master Output ---
            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.25; // Lower master volume initially
            analyserNode = audioContext.createAnalyser(); // Optional: for visuals
            masterGain.connect(analyserNode).connect(audioContext.destination);

            // --- Arp Synth Voice ---
            arpOsc1 = audioContext.createOscillator();
            arpOsc2 = audioContext.createOscillator(); // Second osc for chorus effect
            arpFilter = audioContext.createBiquadFilter();
            arpGain = audioContext.createGain();
            arpLFO = audioContext.createOscillator(); // For filter modulation
            arpLfoGain = audioContext.createGain();

            arpOsc1.type = 'sawtooth';
            arpOsc2.type = 'sawtooth';
            arpOsc2.detune.value = 6; // Detune second oscillator slightly (in cents)
            arpFilter.type = 'lowpass';
            arpFilter.frequency.value = 600;
            arpFilter.Q.value = 3;
            arpGain.gain.value = 0; // Start silent
            arpLFO.type = 'sine';
            arpLFO.frequency.value = 0.5; // Slow modulation
            arpLfoGain.gain.value = 250; // Modulation depth for filter cutoff

            arpOsc1.connect(arpFilter);
            arpOsc2.connect(arpFilter);
            arpFilter.connect(arpGain);
            arpLFO.connect(arpLfoGain).connect(arpFilter.frequency); // LFO modulates filter

            // --- Bass Synth Voice ---
            bassOsc = audioContext.createOscillator();
            bassFilter = audioContext.createBiquadFilter();
            bassGain = audioContext.createGain();

            bassOsc.type = 'sine'; // Deep sine for bass
            bassFilter.type = 'lowpass';
            bassFilter.frequency.value = 300; // Keep it low
            bassFilter.Q.value = 1;
            bassGain.gain.value = 0; // Start silent

            bassOsc.connect(bassFilter).connect(bassGain);

            // --- Effects ---
            delayNode = audioContext.createDelay(1.0);
            feedbackGain = audioContext.createGain();
            reverbNode = await createReverb(); // Create our simple reverb chain
            reverbGain = audioContext.createGain();

            delayNode.delayTime.value = stepDuration * 6; // Dotted quarter note delay
            feedbackGain.gain.value = 0.35;
            reverbGain.gain.value = 0.2; // Mix level for reverb

            // --- Routing ---
            arpGain.connect(masterGain);    // Arp direct to master
            arpGain.connect(delayNode);     // Arp to delay send
            bassGain.connect(masterGain);   // Bass direct to master

            delayNode.connect(feedbackGain).connect(delayNode); // Delay feedback
            delayNode.connect(masterGain);  // Delay output to master
            delayNode.connect(reverbNode.input); // Delay feeds reverb too

            reverbNode.output.connect(reverbGain).connect(masterGain); // Reverb output to master

            // --- Start Oscillators ---
            const now = audioContext.currentTime;
            arpOsc1.start(now);
            arpOsc2.start(now);
            bassOsc.start(now);
            arpLFO.start(now);

            audioInitialized = true;
            console.log("Advanced Audio Engine Initialized.");

        } catch (e) { /* Error handling remains the same */ console.error("Web Audio API is not supported or failed to initialize:", e); alert("Web Audio API initialization failed. Audio will not be available."); const audioBtn = document.getElementById("audio-toggle-btn"); if(audioBtn) { audioBtn.disabled = true; audioBtn.textContent = "AUDIO N/A"; } }
    }

    // --- Sequencer Functions ---
    function scheduleNextSteps(stepsToSchedule) {
        const currentTime = audioContext.currentTime;
        const currentChord = chordProgression[currentChordIndex];
        const currentPattern = arpPatterns[currentArpPatternIndex];

        for (let i = 0; i < stepsToSchedule; i++) {
            const stepIndexInPattern = currentStep % stepsPerMeasure;
            const noteTime = nextNoteTime + (Math.random() * timingRandomness) - (timingRandomness / 2); // Add timing jitter

            // --- Schedule Arp Note ---
            const arpNoteIndex = currentPattern[stepIndexInPattern];
            if (arpNoteIndex !== null && arpNoteIndex < currentChord.notes.length) {
                const midiNote = currentChord.notes[arpNoteIndex];
                const freq = midiNoteToFrequency(midiNote);
                const velocity = 0.4 + (Math.random() * velocityRandomness); // Base velocity + random

                arpOsc1.frequency.setValueAtTime(freq, noteTime);
                arpOsc2.frequency.setValueAtTime(freq, noteTime); // Keep detune relative

                arpGain.gain.cancelScheduledValues(noteTime);
                arpGain.gain.setValueAtTime(0, noteTime); // Start silent
                arpGain.gain.linearRampToValueAtTime(velocity, noteTime + 0.01); // Attack
                arpGain.gain.linearRampToValueAtTime(0, noteTime + stepDuration * 0.9); // Decay

                // Slight random filter cutoff per note
                const filterOffset = (Math.random() - 0.5) * 200;
                arpFilter.frequency.setValueAtTime(600 + filterOffset + arpLfoGain.gain.value, noteTime); // Base + Offset + LFO influence
            }

            // --- Schedule Bass Note (only on first step of the measure) ---
            if (stepIndexInPattern === 0) {
                const bassMidi = currentChord.bass;
                const bassFreq = midiNoteToFrequency(bassMidi);
                bassOsc.frequency.setValueAtTime(bassFreq, noteTime);

                bassGain.gain.cancelScheduledValues(noteTime);
                bassGain.gain.setValueAtTime(0, noteTime);
                bassGain.gain.linearRampToValueAtTime(0.5, noteTime + 0.02); // Slightly longer attack
                // Let bass note ring longer - fade out just before next measure starts
                 bassGain.gain.setValueAtTime(0.5, noteTime + stepDuration * (stepsPerMeasure - 2)); // Hold gain
                 bassGain.gain.linearRampToValueAtTime(0.0, noteTime + stepDuration * (stepsPerMeasure - 1)); // Fade out before next bass note hits
            }

            // Advance time and step
            nextNoteTime += stepDuration;
            currentStep++;

            // --- Change Chord & Pattern ---
            if (currentStep % stepsPerMeasure === 0) {
                currentChordIndex = (currentChordIndex + 1) % chordProgression.length;
                // Optionally change arp pattern less frequently
                 if (currentStep % (stepsPerMeasure * 2) === 0) { // Change pattern every 2 measures
                      currentArpPatternIndex = (currentArpPatternIndex + 1) % arpPatterns.length;
                 }
                 console.log(`Measure ${Math.floor(currentStep / stepsPerMeasure)}, Chord: ${currentChordIndex}, Pattern: ${currentArpPatternIndex}`);
            }
        }
    }

    function scheduler() {
        if (!isAudioPlaying) return; // Stop if audio is toggled off

        const currentTime = audioContext.currentTime;
        while (nextNoteTime < currentTime + scheduleAheadTime) {
            // Schedule a few steps at a time to stay ahead
            scheduleNextSteps(4); // Schedule 4 steps (a beat) ahead
        }

        // Re-schedule the scheduler function
        schedulerIntervalID = setTimeout(scheduler, scheduleAheadTime * 500); // Check twice per scheduleAheadTime window
    }

    function startAudioSystem() {
        if (!audioInitialized) { console.warn("Audio not initialized."); return; }
        if (isAudioPlaying) return;

        audioContext.resume().then(() => {
            if (isAudioPlaying) return; // Double check after async resume

            console.log("AudioContext resumed, starting Scheduler.");
            isAudioPlaying = true;
            nextNoteTime = audioContext.currentTime + 0.05; // Add slight delay before first note
            currentStep = 0; // Reset sequence position
            currentChordIndex = 0;
            currentArpPatternIndex = 0;
            scheduler(); // Start the lookahead scheduler loop
            document.getElementById("audio-toggle-btn").textContent = "AUDIO CORE: ON";

        }).catch(err => console.error("AudioContext resume failed:", err));
    }

    function stopAudioSystem() {
        if (!isAudioPlaying) return;
        isAudioPlaying = false; // Signal scheduler to stop
        clearTimeout(schedulerIntervalID);
        schedulerIntervalID = null;

        // Fade out all voices smoothly
        const now = audioContext.currentTime;
        arpGain.gain.cancelScheduledValues(now);
        arpGain.gain.setValueAtTime(arpGain.gain.value, now);
        arpGain.gain.linearRampToValueAtTime(0, now + 0.3);

        bassGain.gain.cancelScheduledValues(now);
        bassGain.gain.setValueAtTime(bassGain.gain.value, now);
        bassGain.gain.linearRampToValueAtTime(0, now + 0.3);

        document.getElementById("audio-toggle-btn").textContent = "AUDIO CORE: OFF";
        console.log("Audio System Stopped.");
    }

    // --- BabylonJS Scene Setup & Loading (Mostly Unchanged) ---
    function setupScene() { /* ... Same scene setup ... */ scene.clearColor = new BABYLON.Color4(grungeBgColor.r, grungeBgColor.g, grungeBgColor.b, 1); scene.fogMode = BABYLON.Scene.FOGMODE_EXP; scene.fogDensity = 0.03; scene.fogColor = grungeBgColor; camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.5, 6, BABYLON.Vector3.Zero(), scene); camera.attachControl(canvas, true); camera.lowerRadiusLimit = 2; camera.upperRadiusLimit = 20; camera.wheelDeltaPercentage = 0.015; mainLight = new BABYLON.HemisphericLight("mainLight", new BABYLON.Vector3(0.1, 1, -0.2), scene); mainLight.intensity = 0.4; mainLight.diffuse = new BABYLON.Color3(0.6, 0.6, 0.7); mainLight.groundColor = new BABYLON.Color3(0.2, 0.15, 0.1); spotLight1 = new BABYLON.SpotLight("spotLight1", new BABYLON.Vector3(6, 7, 2), new BABYLON.Vector3(-1, -1, -0.3), Math.PI / 5, 5, scene); spotLight1.diffuse = grungeAccent1Color; spotLight1.intensity = 1.0; spotLight2 = new BABYLON.SpotLight("spotLight2", new BABYLON.Vector3(-5, 4, -6), new BABYLON.Vector3(1, -0.8, 1), Math.PI / 6, 8, scene); spotLight2.diffuse = grungeAccent2Color; spotLight2.intensity = 0.8; const flickerAnim = new BABYLON.Animation("flicker", "intensity", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE); flickerAnim.setKeys([ { frame: 0, value: 1.0 }, { frame: 5, value: 0.4 }, { frame: 10, value: 1.2 }, { frame: 15, value: 0.7 }, { frame: 25, value: 1.0 }, { frame: 30, value: 0.5 }, { frame: 40, value: 1.0 }, { frame: 42, value: 0.9 }, { frame: 50, value: 1.1 }, { frame: 60, value: 1.0 } ]); spotLight1.animations.push(flickerAnim); scene.beginAnimation(spotLight1, 0, 60, true, Math.random() * 0.5 + 0.8); const flickerAnim2 = flickerAnim.clone(); flickerAnim2.getKeys().forEach(k => k.value *= 0.8); spotLight2.animations.push(flickerAnim2); scene.beginAnimation(spotLight2, 0, 60, true, Math.random() * 0.5 + 0.6); gl = new BABYLON.GlowLayer("glow", scene); gl.intensity = 0.4; gl.blurKernelSize = 16; const hdrTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene); scene.environmentTexture = hdrTexture; scene.environmentIntensity = 0.5;}
    function startLoadingSequence() { /* ... Mostly same loading logic, ensure initAudio() is awaited or handled correctly... */ loadingScreen.style.display = "flex"; loadingScreen.style.opacity = "1"; initAudio(); // Start audio init during load let loadProgress = 0; const loadingTexts = [ "SCANNING DAMAGED SECTORS...", "BYPASSING SECURITY LOCKS...", "DEFRAGMENTING CORRUPTED FILES...", "RECOVERING ASSET DATA...", "WARNING: SYSTEM INSTABILITY DETECTED...", "RENDERING FROM CACHE...", "AUDIO SUBSYSTEM CHECK...", "INTERFACE MAY BE UNRELIABLE..." ]; let textIndex = 0; loadingText.textContent = loadingTexts[textIndex]; const loadingInterval = setInterval(() => { loadProgress += Math.random() * 10 + 5; if (loadProgress >= 100) { loadProgress = 100; loadingBar.style.width = loadProgress + "%"; loadingText.textContent = "SYSTEM ONLINE... AUDIO CORE READY."; clearInterval(loadingInterval); setTimeout(() => { loadingScreen.style.opacity = "0"; setTimeout(() => { loadingScreen.style.display = "none"; console.log("Loading finished. Audio ready to be started by user via toggle."); }, 1000); }, 800); } else { loadingBar.style.width = loadProgress + "%"; if (Math.random() > 0.7) { textIndex = (textIndex + 1) % loadingTexts.length; loadingText.textContent = loadingTexts[textIndex]; } } }, 350); }
    function loadWeapon(weaponIndex) { /* ... Same weapon loading logic ... */ loadingScreen.style.display = "flex"; loadingScreen.style.opacity = "1"; loadingBar.style.width = "0%"; loadingText.textContent = "ACCESSING DAMAGED ARCHIVE..."; const weaponInfo = weaponData[weaponIndex]; currentWeaponIndex = weaponIndex; weaponNameElement.textContent = weaponInfo.name; techReadoutElement.textContent = weaponInfo.tech; let loadProgress = 0; const loadingTextsLoad = [ "DECRYPTING FRAGMENT...", "RECONSTRUCTING DATA...", "WARNING: DATA INTEGRITY LOW...", "RENDERING BEST GUESS..." ]; let loadTextIdx = 0; loadingText.textContent = loadingTextsLoad[loadTextIdx]; const loadingIntervalLoad = setInterval(() => { loadProgress += Math.random() * 15 + 5; if (loadProgress >= 100) { loadProgress = 100; clearInterval(loadingIntervalLoad); loadingBar.style.width = "100%"; loadingText.textContent = "ASSET RENDERED (ERRORS POSSIBLE)"; setTimeout(() => { loadingScreen.style.opacity = "0"; setTimeout(() => { loadingScreen.style.display = "none"; }, 800); }, 600); } else { loadingBar.style.width = loadProgress + "%"; if (Math.random() > 0.6) { loadTextIdx = (loadTextIdx + 1) % loadingTextsLoad.length; loadingText.textContent = loadingTextsLoad[loadTextIdx]; } } }, 150); if (weapon) { const animGroup = scene.getAnimationGroupByName("rotationGroup"); if (animGroup) { animGroup.stop(); } weapon.getChildMeshes(true).forEach(mesh => { if (originalMaterials.has(mesh.uniqueId)) { if (mesh.material && mesh.material !== originalMaterials.get(mesh.uniqueId) && !mesh.material.isDisposed) { if (mesh.material.name.includes("_scan") || mesh.material.name.includes("_heat")) { mesh.material.dispose(); } } mesh.material = null; } else if(mesh.material && !mesh.material.isDisposed) { mesh.material.dispose(); mesh.material = null; } }); weapon.dispose(); originalMaterials.clear(); } BABYLON.SceneLoader.ImportMesh("", "assets/weapons/", weaponInfo.filename, scene, (meshes) => { if (meshes.length > 0) { weapon = meshes[0]; weapon.position = BABYLON.Vector3.Zero(); originalMaterials.clear(); weapon.getChildMeshes(true).forEach(mesh => { if (mesh.material) { originalMaterials.set(mesh.uniqueId, mesh.material); if (gl) gl.removeIncludedOnlyMesh(mesh); if (mesh.material.emissiveColor && (mesh.material.emissiveColor.r > 0.1 || mesh.material.emissiveColor.g > 0.1 || mesh.material.emissiveColor.b > 0.1)) { if(gl) gl.addIncludedOnlyMesh(mesh); } } }); updateEnvironmentMode(); const rotationAnimation = new BABYLON.Animation( "rotationAnimation", "rotation.y", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE ); rotationAnimation.setKeys([ { frame: 0, value: weapon.rotation.y }, { frame: 450, value: weapon.rotation.y + 2 * Math.PI } ]); weapon.animations = []; weapon.animations.push(rotationAnimation); if (isRotating) { scene.beginAnimation(weapon, 0, 450, true, 0.4, null, "rotationGroup"); } } else { /* Error Handling */ } }, null, (scene, message, exception) => { /* Error Handling */ }); }
    function updateEnvironmentMode() { /* ... Same environment mode update logic ... */ if (!weapon || !originalMaterials) return; if (gl) gl.customEmissiveColorSelector = null; weapon.getChildMeshes(true).forEach(mesh => { const originalMat = originalMaterials.get(mesh.uniqueId); if (!originalMat) { if (!mesh.material) { mesh.material = new BABYLON.StandardMaterial(`fallback_${mesh.uniqueId}`, scene); } return; } if (mesh.material && mesh.material !== originalMat && !mesh.material.isDisposed) { if (mesh.material.name.includes("_scan") || mesh.material.name.includes("_heat")) { mesh.material.dispose(); } mesh.material = null; } switch(environmentMode) { case 0: if (!mesh.material || mesh.material.isDisposed || mesh.material !== originalMat) { mesh.material = originalMat; } mesh.visibility = 1.0; mesh.overlayColor = BABYLON.Color3.Black(); mesh.renderOverlay = false; if (mesh.material.alpha < 1.0) mesh.material.alpha = 1.0; mesh.material.wireframe = false; break; case 1: if (!mesh.material || mesh.material.isDisposed || !mesh.material.name.includes("_scan")) { mesh.material = originalMat.clone(`${originalMat.name}_scan_${mesh.uniqueId}`); } mesh.material.wireframe = true; mesh.material.emissiveColor = grungeAccent2Color.scale(0.7); mesh.material.diffuseColor = BABYLON.Color3.Black(); mesh.material.specularColor = BABYLON.Color3.Black(); mesh.material.alpha = 0.8; mesh.visibility = 0.9; mesh.overlayColor = grungeAccent2Color; mesh.renderOverlay = true; mesh.overlayAlpha = 0.15; break; case 2: if (!mesh.material || mesh.material.isDisposed || !mesh.material.name.includes("_heat")) { mesh.material = originalMat.clone(`${originalMat.name}_heat_${mesh.uniqueId}`); } mesh.material.wireframe = false; mesh.material.emissiveColor = grungeAccent1Color.scale(0.6); mesh.material.diffuseColor = BABYLON.Color3.Black(); mesh.material.specularColor = grungeAccent1Color.scale(0.2); mesh.material.alpha = 0.75; mesh.visibility = 0.85; if (gl) { gl.customEmissiveColorSelector = (mesh, subMesh, material, result) => { result.set(1, 0.4, 0.1, 0.8); }; } break; } if (gl) { gl.removeIncludedOnlyMesh(mesh); if (environmentMode !== 1 && mesh.material && mesh.material.emissiveColor && (mesh.material.emissiveColor.r > 0.1 || mesh.material.emissiveColor.g > 0.1 || mesh.material.emissiveColor.b > 0.1)) { gl.addIncludedOnlyMesh(mesh); } } });}

    // --- Event Listeners ---
    function setupEventListeners() {
        document.getElementById("weapon1-btn").addEventListener("click", () => loadWeapon(0));
        document.getElementById("weapon2-btn").addEventListener("click", () => loadWeapon(1));
        document.getElementById("weapon3-btn").addEventListener("click", () => loadWeapon(2));
        document.getElementById("weapon4-btn").addEventListener("click", () => loadWeapon(3));
        document.getElementById("weapon5-btn").addEventListener("click", () => loadWeapon(4));

        document.getElementById("rotate-btn").addEventListener("click", function() { if (!weapon) return; isRotating = !isRotating; const a = scene.getAnimationGroupByName("rotationGroup"); if(isRotating){if(a)a.play(true);else scene.beginAnimation(weapon,0,450,true,0.4,null,"rotationGroup")} else{if(a)a.pause()} this.textContent=`ROTATION: ${isRotating?'ON':'OFF'}`; });
        document.getElementById("zoom-in-btn").addEventListener("click", () => { BABYLON.Animation.CreateAndStartAnimation('zoomIn',camera,'radius',30,10,camera.radius,Math.max(camera.lowerRadiusLimit,camera.radius*0.7),0,new BABYLON.ExponentialEase()); });
        document.getElementById("zoom-out-btn").addEventListener("click", () => { BABYLON.Animation.CreateAndStartAnimation('zoomOut',camera,'radius',30,10,camera.radius,Math.min(camera.upperRadiusLimit,camera.radius*1.3),0,new BABYLON.ExponentialEase()); });

        let lightsOn = true;
        document.getElementById("lights-btn").addEventListener("click", function() { lightsOn=!lightsOn; if(lightsOn){scene.beginAnimation(spotLight1,0,60,true,Math.random()*0.5+0.8); scene.beginAnimation(spotLight2,0,60,true,Math.random()*0.5+0.6); mainLight.intensity=0.4; gl.intensity=0.4; this.textContent="LIGHTS: FLICKER";} else{scene.stopAnimation(spotLight1); scene.stopAnimation(spotLight2); spotLight1.intensity=0.05; spotLight2.intensity=0.03; mainLight.intensity=0.1; gl.intensity=0.2; this.textContent="LIGHTS: MINIMAL";} });
        document.getElementById("env-btn").addEventListener("click", function() { environmentMode=(environmentMode+1)%3; updateEnvironmentMode(); const modes=["NORMAL","SCAN MODE","HEAT SCAN"]; this.textContent=`MODE: ${modes[environmentMode]}`; });

        // Updated Audio Toggle Listener
        document.getElementById("audio-toggle-btn").addEventListener("click", function() {
            if (!audioInitialized) { console.log("Audio engine not ready."); return; }
            if (isAudioPlaying) { stopAudioSystem(); }
            else { startAudioSystem(); }
        });

        window.addEventListener("resize", () => engine.resize());
    }

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        setupScene();
        setupEventListeners();
        startLoadingSequence(); // Start loading, includes async audio init attempt
        loadWeapon(0); // Load initial weapon

        engine.runRenderLoop(() => { scene.render(); });
    });

  </script>
