<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien Biome Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0a, #1a0d1a, #0d1a1a);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 20, 20, 0.8);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .control-group {
            background: rgba(0, 40, 40, 0.6);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #004444;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #66ffaa;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            background: #001111;
            border: 1px solid #00ff88;
            border-radius: 5px;
            color: #00ff88;
            font-family: inherit;
        }
        button {
            background: linear-gradient(45deg, #00ff88, #00aa55);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.5);
        }
        .preview {
            background: #000;
            border: 2px solid #00ff88;
            border-radius: 10px;
            height: 400px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        .stats {
            background: rgba(0, 20, 20, 0.9);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #004444;
        }
        .biome-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .info-card {
            background: rgba(0, 30, 30, 0.8);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }
        #canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛸 ALIEN BIOME GENERATOR 🛸</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Biome Type</label>
                <select id="biomeType">
                    <option value="crystalline">Crystalline Forests</option>
                    <option value="fungal">Fungal Megastructures</option>
                    <option value="metallic">Metallic Coral Reefs</option>
                    <option value="plasma">Plasma Geysers</option>
                    <option value="fractal">Fractal Canyons</option>
                    <option value="organic">Organic Tentacle Valleys</option>
                    <option value="quantum">Quantum Probability Fields</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Terrain Complexity</label>
                <input type="range" id="complexity" min="50" max="500" value="200">
                <span id="complexityValue">200</span>
            </div>
            
            <div class="control-group">
                <label>Alien Factor</label>
                <input type="range" id="alienFactor" min="1" max="10" value="7">
                <span id="alienValue">7</span>
            </div>
            
            <div class="control-group">
                <label>Gravity Anomaly</label>
                <input type="range" id="gravity" min="0.1" max="3.0" step="0.1" value="1.0">
                <span id="gravityValue">1.0</span>
            </div>
        </div>

        <div style="text-align: center;">
            <button onclick="generateBiome()">🌌 GENERATE ALIEN WORLD 🌌</button>
            <button onclick="downloadPLY()" id="downloadBtn" style="display:none;">💾 DOWNLOAD .PLY FILE 💾</button>
        </div>

        <div class="preview">
            <canvas id="canvas"></canvas>
        </div>

        <div class="biome-info" id="biomeInfo" style="display:none;">
            <div class="info-card">
                <h3>🌍 World Classification</h3>
                <div id="worldClass"></div>
            </div>
            <div class="info-card">
                <h3>🧬 Dominant Life Forms</h3>
                <div id="lifeforms"></div>
            </div>
            <div class="info-card">
                <h3>⚛️ Atmospheric Composition</h3>
                <div id="atmosphere"></div>
            </div>
            <div class="info-card">
                <h3>🔮 Anomalous Properties</h3>
                <div id="anomalies"></div>
            </div>
        </div>

        <div class="stats" id="stats" style="display:none;">
            <h3>📊 Generation Statistics</h3>
            <div id="statsContent"></div>
        </div>
    </div>

    <script>
        let vertices = [];
        let faces = [];
        let colors = [];
        let currentBiome = null;

        // Update display values
        document.getElementById('complexity').oninput = function() {
            document.getElementById('complexityValue').textContent = this.value;
        };
        document.getElementById('alienFactor').oninput = function() {
            document.getElementById('alienValue').textContent = this.value;
        };
        document.getElementById('gravity').oninput = function() {
            document.getElementById('gravityValue').textContent = this.value;
        };

        function noise(x, y, z) {
            return Math.sin(x * 0.01) * Math.cos(y * 0.01) * Math.sin(z * 0.01) +
                   Math.sin(x * 0.02) * 0.5 + Math.cos(y * 0.03) * 0.3 + Math.sin(z * 0.025) * 0.4;
        }

        function fractalNoise(x, y, z, octaves = 4) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            
            for (let i = 0; i < octaves; i++) {
                value += noise(x * frequency, y * frequency, z * frequency) * amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }
            return value;
        }

        function generateBiome() {
            const biomeType = document.getElementById('biomeType').value;
            const complexity = parseInt(document.getElementById('complexity').value);
            const alienFactor = parseInt(document.getElementById('alienFactor').value);
            const gravity = parseFloat(document.getElementById('gravity').value);

            vertices = [];
            faces = [];
            colors = [];

            const size = Math.min(complexity, 200);
            const scale = 100;
            const time = Date.now() * 0.001;

            // Generate terrain based on biome type
            for (let x = 0; x < size; x++) {
                for (let z = 0; z < size; z++) {
                    const wx = (x - size/2) * scale / size;
                    const wz = (z - size/2) * scale / size;
                    
                    let height = 0;
                    let r = 0, g = 0, b = 0;

                    switch (biomeType) {
                        case 'crystalline':
                            height = generateCrystalline(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [0.3 + Math.random() * 0.7, 0.8 + Math.random() * 0.2, 1.0];
                            break;
                        case 'fungal':
                            height = generateFungal(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [0.8 + Math.random() * 0.2, 0.4 + Math.random() * 0.4, 0.9];
                            break;
                        case 'metallic':
                            height = generateMetallic(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [0.9, 0.7 + Math.random() * 0.3, 0.3 + Math.random() * 0.4];
                            break;
                        case 'plasma':
                            height = generatePlasma(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [1.0, 0.3 + Math.random() * 0.4, 0.8 + Math.random() * 0.2];
                            break;
                        case 'fractal':
                            height = generateFractal(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [0.7, 0.9, 0.4 + Math.random() * 0.6];
                            break;
                        case 'organic':
                            height = generateOrganic(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [0.6 + Math.random() * 0.4, 1.0, 0.5 + Math.random() * 0.5];
                            break;
                        case 'quantum':
                            height = generateQuantum(wx, wz, alienFactor, gravity, time);
                            [r, g, b] = [Math.random(), Math.random(), Math.random()];
                            break;
                    }

                    vertices.push([wx, height / gravity, wz]);
                    colors.push([r, g, b]);
                }
            }

            // Generate faces
            for (let x = 0; x < size - 1; x++) {
                for (let z = 0; z < size - 1; z++) {
                    const i1 = x * size + z;
                    const i2 = (x + 1) * size + z;
                    const i3 = x * size + (z + 1);
                    const i4 = (x + 1) * size + (z + 1);

                    faces.push([i1, i2, i3]);
                    faces.push([i2, i4, i3]);
                }
            }

            currentBiome = {
                type: biomeType,
                complexity: complexity,
                alienFactor: alienFactor,
                gravity: gravity,
                vertexCount: vertices.length,
                faceCount: faces.length
            };

            updateVisualization();
            updateBiomeInfo();
            updateStats();
            document.getElementById('downloadBtn').style.display = 'inline-block';
        }

        function generateCrystalline(x, z, alien, gravity, time) {
            const crystal1 = Math.sin(x * 0.1 + time) * Math.cos(z * 0.1) * 20;
            const crystal2 = Math.sin(x * 0.05) * Math.sin(z * 0.05) * 15;
            const spikes = Math.max(0, Math.sin(x * 0.2) * Math.cos(z * 0.2)) * alien * 5;
            return crystal1 + crystal2 + spikes + fractalNoise(x, 0, z, 3) * 10;
        }

        function generateFungal(x, z, alien, gravity, time) {
            const mushroom = Math.exp(-((x % 20) ** 2 + (z % 20) ** 2) / 100) * alien * 8;
            const stems = Math.sin(x * 0.3) * Math.cos(z * 0.3) * 5;
            const caps = Math.max(0, Math.sin(x * 0.1 + time * 2) * Math.cos(z * 0.1)) * 12;
            return mushroom + stems + caps + fractalNoise(x, time * 10, z, 4) * 8;
        }

        function generateMetallic(x, z, alien, gravity, time) {
            const coral = Math.sin(x * 0.2) * Math.cos(z * 0.15) * Math.sin(time) * 15;
            const pipes = Math.abs(Math.sin(x * 0.05)) * Math.abs(Math.cos(z * 0.05)) * alien * 6;
            const rings = Math.sin(Math.sqrt(x*x + z*z) * 0.1 + time) * 8;
            return coral + pipes + rings + fractalNoise(x, time * 5, z, 3) * 12;
        }

        function generatePlasma(x, z, alien, gravity, time) {
            const geyser = Math.exp(-((x % 15) ** 2 + (z % 15) ** 2) / 50) * Math.sin(time * 3) * alien * 12;
            const waves = Math.sin(x * 0.1 + time * 2) * Math.cos(z * 0.1 + time * 1.5) * 10;
            const turbulence = fractalNoise(x + time * 20, time * 30, z + time * 15, 5) * 8;
            return geyser + waves + turbulence;
        }

        function generateFractal(x, z, alien, gravity, time) {
            let height = 0;
            let scale = 1;
            for (let i = 0; i < alien; i++) {
                height += Math.sin(x * scale * 0.01) * Math.cos(z * scale * 0.01) * (20 / scale);
                scale *= 2.3;
            }
            return height + fractalNoise(x, time * 8, z, 6) * 15;
        }

        function generateOrganic(x, z, alien, gravity, time) {
            const tentacle1 = Math.sin(x * 0.1 + time) * Math.exp(-z * z / 1000) * alien * 4;
            const tentacle2 = Math.cos(z * 0.1 + time * 1.3) * Math.exp(-x * x / 800) * alien * 4;
            const bulbs = Math.sin(x * 0.3) * Math.sin(z * 0.3) * Math.sin(time * 2) * 8;
            const organic = fractalNoise(x + Math.sin(time) * 10, time * 12, z + Math.cos(time) * 10, 4) * 12;
            return tentacle1 + tentacle2 + bulbs + organic;
        }

        function generateQuantum(x, z, alien, gravity, time) {
            const probability = Math.random() < 0.5 ? 1 : -1;
            const quantum1 = Math.sin(x * 0.1 * probability + time) * alien * 3;
            const quantum2 = Math.cos(z * 0.1 / probability + time * 1.7) * alien * 3;
            const superposition = (Math.sin(x * 0.05) + Math.cos(z * 0.05)) * probability * 10;
            const uncertainty = Math.random() * alien * 5 - alien * 2.5;
            return quantum1 + quantum2 + superposition + uncertainty + fractalNoise(x * probability, time * 20, z, 5) * 8;
        }

        function updateVisualization() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (vertices.length === 0) return;

            // Simple 3D to 2D projection
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 300;

            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 0.5;

            // Draw wireframe
            for (let i = 0; i < faces.length; i += 10) { // Skip some faces for performance
                const face = faces[i];
                if (face && face.length === 3) {
                    const v1 = vertices[face[0]];
                    const v2 = vertices[face[1]];
                    const v3 = vertices[face[2]];

                    if (v1 && v2 && v3) {
                        ctx.beginPath();
                        ctx.moveTo(centerX + v1[0] * scale, centerY + v1[1] * scale - v1[2] * scale * 0.5);
                        ctx.lineTo(centerX + v2[0] * scale, centerY + v2[1] * scale - v2[2] * scale * 0.5);
                        ctx.lineTo(centerX + v3[0] * scale, centerY + v3[1] * scale - v3[2] * scale * 0.5);
                        ctx.closePath();
                        
                        const color = colors[face[0]];
                        if (color) {
                            ctx.strokeStyle = `rgb(${Math.floor(color[0] * 255)}, ${Math.floor(color[1] * 255)}, ${Math.floor(color[2] * 255)})`;
                        }
                        ctx.stroke();
                    }
                }
            }
        }

        function updateBiomeInfo() {
            const biome = currentBiome;
            if (!biome) return;

            const biomeInfo = {
                crystalline: {
                    worldClass: "Silicate Crystalline World - Class XC-7",
                    lifeforms: "Resonant Crystal Entities, Harmonic Photosynthetic Structures",
                    atmosphere: "75% Xenon, 20% Crystalline Particulates, 5% Unknown Noble Gases",
                    anomalies: "Sonic Amplification Zones, Temporal Echo Chambers"
                },
                fungal: {
                    worldClass: "Macro-Fungal Collective - Class FB-9",
                    lifeforms: "Sentient Spore Networks, Bioluminescent Mycelial Mega-organisms",
                    atmosphere: "45% Methane, 30% Oxygen, 25% Psychoactive Spore Compounds",
                    anomalies: "Collective Consciousness Fields, Memory-Storing Substrates"
                },
                metallic: {
                    worldClass: "Metallic Coral Reef World - Class MC-4",
                    lifeforms: "Electro-Conductive Coral Minds, Magnetic Field Manipulators",
                    atmosphere: "60% Nitrogen, 25% Metallic Vapor, 15% Electromagnetic Plasma",
                    anomalies: "Self-Assembling Structures, Electromagnetic Consciousness"
                },
                plasma: {
                    worldClass: "High-Energy Plasma World - Class PE-12",
                    lifeforms: "Energy-Based Entities, Plasma Storm Dancers",
                    atmosphere: "90% Ionized Gases, 10% Pure Energy Fields",
                    anomalies: "Temporal Distortion Geysers, Matter-Energy Conversion Zones"
                },
                fractal: {
                    worldClass: "Infinite Recursive Landscape - Class FR-∞",
                    lifeforms: "Self-Similar Organisms, Recursive Evolution Cycles",
                    atmosphere: "Mathematically Structured Gas Patterns, Geometric Precipitation",
                    anomalies: "Scale-Invariant Physics, Infinite Zoom Territories"
                },
                organic: {
                    worldClass: "Bio-Mechanical Symbiosis World - Class OM-6",
                    lifeforms: "Tentacle-Root Hybrids, Sentient Soil Networks",
                    atmosphere: "55% Bio-Synthesized Oxygen, 35% Organic Compounds, 10% Pheromone Clouds",
                    anomalies: "Living Terrain, Emotional Resonance Fields"
                },
                quantum: {
                    worldClass: "Quantum Probability World - Class QP-?",
                    lifeforms: "Superposition Entities, Probability Wave Surfers",
                    atmosphere: "Uncertain - Changes Upon Observation",
                    anomalies: "Reality Fluctuation Zones, Observer Effect Phenomena"
                }
            };

            const info = biomeInfo[biome.type];
            document.getElementById('worldClass').textContent = info.worldClass;
            document.getElementById('lifeforms').textContent = info.lifeforms;
            document.getElementById('atmosphere').textContent = info.atmosphere;
            document.getElementById('anomalies').textContent = info.anomalies;
            document.getElementById('biomeInfo').style.display = 'grid';
        }

        function updateStats() {
            const biome = currentBiome;
            if (!biome) return;

            const stats = `
                <strong>Vertices:</strong> ${biome.vertexCount.toLocaleString()}<br>
                <strong>Faces:</strong> ${biome.faceCount.toLocaleString()}<br>
                <strong>Biome Type:</strong> ${biome.type.charAt(0).toUpperCase() + biome.type.slice(1)}<br>
                <strong>Complexity Level:</strong> ${biome.complexity}<br>
                <strong>Alien Factor:</strong> ${biome.alienFactor}/10<br>
                <strong>Gravity Modifier:</strong> ${biome.gravity}x Standard<br>
                <strong>Estimated File Size:</strong> ~${Math.round((biome.vertexCount * 50 + biome.faceCount * 30) / 1024)}KB
            `;
            document.getElementById('statsContent').innerHTML = stats;
            document.getElementById('stats').style.display = 'block';
        }

        function downloadPLY() {
            if (vertices.length === 0 || faces.length === 0) {
                alert('Generate a biome first!');
                return;
            }

            let plyContent = `ply
format ascii 1.0
comment Generated by Alien Biome Generator
comment Biome Type: ${currentBiome.type}
comment Alien Factor: ${currentBiome.alienFactor}
comment Complexity: ${currentBiome.complexity}
element vertex ${vertices.length}
property float x
property float y
property float z
property uchar red
property uchar green
property uchar blue
element face ${faces.length}
property list uchar int vertex_indices
end_header
`;

            // Add vertices with colors
            for (let i = 0; i < vertices.length; i++) {
                const v = vertices[i];
                const c = colors[i];
                const r = Math.floor(c[0] * 255);
                const g = Math.floor(c[1] * 255);
                const b = Math.floor(c[2] * 255);
                plyContent += `${v[0].toFixed(6)} ${v[1].toFixed(6)} ${v[2].toFixed(6)} ${r} ${g} ${b}\n`;
            }

            // Add faces
            for (let i = 0; i < faces.length; i++) {
                const f = faces[i];
                plyContent += `3 ${f[0]} ${f[1]} ${f[2]}\n`;
            }

            const blob = new Blob([plyContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alien_biome_${currentBiome.type}_${Date.now()}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Auto-generate on load
        window.onload = function() {
            generateBiome();
        };
    </script>
</body>
</html>
