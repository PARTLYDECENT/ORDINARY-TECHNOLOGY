<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICRO-LIFE // RESEARCH MODULE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D16847;
            --secondary: #E89B6A;
            --background: #050511;
            --text: #FFFFFF;
            --glass-bg: rgba(25, 25, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(209, 104, 71, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(232, 155, 106, 0.05) 0%, transparent 40%);
        }

        .interface-header {
            width: 100%;
            max-width: 1000px;
            padding: 2rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out;
        }

        .title-group h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            color: var(--secondary);
            text-shadow: 0 0 15px rgba(232, 155, 106, 0.4);
        }

        .title-group p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            margin: 0.5rem 0 0 0;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .nav-controls {
            display: flex;
            gap: 1rem;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-button:hover {
            background: var(--primary);
            color: var(--background);
            box-shadow: 0 0 15px rgba(209, 104, 71, 0.4);
            border-color: var(--primary);
        }

        .game-window {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-window::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            opacity: 0.5;
        }

        iframe {
            display: block;
            border-radius: 4px;
            background: #000;
        }

        .system-footer {
            margin-top: 2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 1px;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Scanline Effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 100;
            pointer-events: none;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <header class="interface-header">
        <div class="title-group">
            <h1>MICRO-LIFE RESEARCH</h1>
            <p>ORDINARY//SIM_ENV/06: BIOLOGICAL EVOLUTION</p>
        </div>
        <div class="nav-controls">
            <a href="game.html" class="nav-button">Return to Interface</a>
        </div>
    </header>

    <div class="game-window">
        <iframe 
            src="https://archive.org/embed/microlife" 
            width="800" 
            height="600" 
            frameborder="0" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allowfullscreen>
        </iframe>
    </div>

    <footer class="system-footer">
        [SECURE_LINKESTABLISHED] :: ENCRYPTED_STREAM_06 :: ARCHIVE_ORG_P2P
    </footer>
</body>
</html>
