<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLY Alien Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group h3 {
            color: #00ff88;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .slider-container {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 0.9em;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .value-display {
            display: inline-block;
            float: right;
            color: #00ff88;
            font-weight: bold;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(45deg, #00ff88, #00ccff);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .preview-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-container h3 {
            color: #00ccff;
            margin-top: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .stat-value {
            font-size: 1.5em;
            color: #00ff88;
            font-weight: bold;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
        }

        #plyOutput {
            width: 100%;
            height: 300px;
            background: #000;
            color: #00ff88;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            resize: vertical;
            overflow-y: auto;
        }

        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .tag {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .alien-type {
            text-align: center;
            font-size: 1.3em;
            color: #00ccff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👽 PLY Alien Generator</h1>
        <p class="subtitle">Generate unique 3D alien models in PLY format</p>
        
        <div class="controls">
            <div class="control-group">
                <h3>🗿 Body Structure</h3>
                <div class="slider-container">
                    <label>Head Size <span class="value-display" id="headSizeValue">1.2</span></label>
                    <input type="range" id="headSize" min="0.8" max="2.5" step="0.1" value="1.2">
                </div>
                <div class="slider-container">
                    <label>Body Height <span class="value-display" id="bodyHeightValue">2.0</span></label>
                    <input type="range" id="bodyHeight" min="1.5" max="3.0" step="0.1" value="2.0">
                </div>
                <div class="slider-container">
                    <label>Limb Length <span class="value-display" id="limbLengthValue">1.0</span></label>
                    <input type="range" id="limbLength" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>

            <div class="control-group">
                <h3>👁️ Features</h3>
                <div class="slider-container">
                    <label>Eye Size <span class="value-display" id="eyeSizeValue">0.3</span></label>
                    <input type="range" id="eyeSize" min="0.1" max="0.8" step="0.05" value="0.3">
                </div>
                <div class="slider-container">
                    <label>Eye Separation <span class="value-display" id="eyeSeparationValue">0.4</span></label>
                    <input type="range" id="eyeSeparation" min="0.2" max="0.8" step="0.05" value="0.4">
                </div>
                <div class="slider-container">
                    <label>Antenna Count <span class="value-display" id="antennaCountValue">2</span></label>
                    <input type="range" id="antennaCount" min="0" max="6" step="1" value="2">
                </div>
            </div>

            <div class="control-group">
                <h3>🎨 Appearance</h3>
                <div class="slider-container">
                    <label>Skin Roughness <span class="value-display" id="skinRoughnessValue">0.5</span></label>
                    <input type="range" id="skinRoughness" min="0" max="1" step="0.1" value="0.5">
                </div>
                <div class="slider-container">
                    <label>Color Hue <span class="value-display" id="colorHueValue">120</span></label>
                    <input type="range" id="colorHue" min="0" max="360" step="10" value="120">
                </div>
                <div class="slider-container">
                    <label>Symmetry <span class="value-display" id="symmetryValue">0.8</span></label>
                    <input type="range" id="symmetry" min="0" max="1" step="0.1" value="0.8">
                </div>
            </div>
        </div>

        <div class="button-container">
            <button onclick="randomizeAlien()">🎲 Randomize Alien</button>
            <button onclick="generatePLY()">🚀 Generate PLY</button>
            <button onclick="downloadPLY()">💾 Download PLY File</button>
        </div>

        <div class="preview-container">
            <h3>Alien Specifications</h3>
            <div class="alien-type" id="alienType">HUMANOID XENOMORPH</div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="vertexCount">0</div>
                    <div class="stat-label">Vertices</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="faceCount">0</div>
                    <div class="stat-label">Faces</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="complexity">Medium</div>
                    <div class="stat-label">Complexity</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="alienSpecies">Type-A</div>
                    <div class="stat-label">Species</div>
                </div>
            </div>

            <div class="feature-tags" id="featureTags"></div>

            <h3>PLY File Content</h3>
            <textarea id="plyOutput" readonly placeholder="Click 'Generate PLY' to create your alien model..."></textarea>
        </div>
    </div>

    <script>
        let currentPLYContent = '';
        let alienConfig = {};

        // Initialize sliders
        const sliders = ['headSize', 'bodyHeight', 'limbLength', 'eyeSize', 'eyeSeparation', 'antennaCount', 'skinRoughness', 'colorHue', 'symmetry'];
        
        sliders.forEach(id => {
            const slider = document.getElementById(id);
            const valueDisplay = document.getElementById(id + 'Value');
            
            slider.addEventListener('input', () => {
                valueDisplay.textContent = slider.value;
                updateAlienType();
            });
        });

        function randomizeAlien() {
            document.getElementById('headSize').value = (Math.random() * 1.7 + 0.8).toFixed(1);
            document.getElementById('bodyHeight').value = (Math.random() * 1.5 + 1.5).toFixed(1);
            document.getElementById('limbLength').value = (Math.random() * 1.5 + 0.5).toFixed(1);
            document.getElementById('eyeSize').value = (Math.random() * 0.7 + 0.1).toFixed(2);
            document.getElementById('eyeSeparation').value = (Math.random() * 0.6 + 0.2).toFixed(2);
            document.getElementById('antennaCount').value = Math.floor(Math.random() * 7);
            document.getElementById('skinRoughness').value = (Math.random()).toFixed(1);
            document.getElementById('colorHue').value = Math.floor(Math.random() * 360);
            document.getElementById('symmetry').value = (Math.random() * 0.8 + 0.2).toFixed(1);

            // Update displays
            sliders.forEach(id => {
                const slider = document.getElementById(id);
                const valueDisplay = document.getElementById(id + 'Value');
                valueDisplay.textContent = slider.value;
            });

            updateAlienType();
        }

        function updateAlienType() {
            const headSize = parseFloat(document.getElementById('headSize').value);
            const eyeSize = parseFloat(document.getElementById('eyeSize').value);
            const antennaCount = parseInt(document.getElementById('antennaCount').value);
            const bodyHeight = parseFloat(document.getElementById('bodyHeight').value);

            let type = '';
            let species = '';

            if (headSize > 2.0 && eyeSize > 0.5) {
                type = 'CEREBRAL OVERLORD';
                species = 'Type-Ω';
            } else if (antennaCount >= 4) {
                type = 'INSECTOID HYBRID';
                species = 'Type-X';
            } else if (bodyHeight > 2.5) {
                type = 'TOWERING GIANT';
                species = 'Type-T';
            } else if (eyeSize > 0.6) {
                type = 'GREY OBSERVER';
                species = 'Type-G';
            } else if (headSize < 1.0) {
                type = 'REPTILIAN SCOUT';
                species = 'Type-R';
            } else {
                type = 'HUMANOID XENOMORPH';
                species = 'Type-A';
            }

            document.getElementById('alienType').textContent = type;
            document.getElementById('alienSpecies').textContent = species;

            updateFeatureTags();
        }

        function updateFeatureTags() {
            const tags = [];
            const headSize = parseFloat(document.getElementById('headSize').value);
            const eyeSize = parseFloat(document.getElementById('eyeSize').value);
            const antennaCount = parseInt(document.getElementById('antennaCount').value);
            const limbLength = parseFloat(document.getElementById('limbLength').value);
            const skinRoughness = parseFloat(document.getElementById('skinRoughness').value);

            if (headSize > 1.8) tags.push('Large Brain');
            if (eyeSize > 0.5) tags.push('Hypnotic Gaze');
            if (antennaCount > 0) tags.push('Telepathic');
            if (limbLength > 1.5) tags.push('Long Reach');
            if (skinRoughness > 0.7) tags.push('Armored Hide');
            if (skinRoughness < 0.3) tags.push('Smooth Skin');

            const tagsContainer = document.getElementById('featureTags');
            tagsContainer.innerHTML = tags.map(tag => `<span class="tag">${tag}</span>`).join('');
        }

        function generatePLY() {
            alienConfig = {
                headSize: parseFloat(document.getElementById('headSize').value),
                bodyHeight: parseFloat(document.getElementById('bodyHeight').value),
                limbLength: parseFloat(document.getElementById('limbLength').value),
                eyeSize: parseFloat(document.getElementById('eyeSize').value),
                eyeSeparation: parseFloat(document.getElementById('eyeSeparation').value),
                antennaCount: parseInt(document.getElementById('antennaCount').value),
                skinRoughness: parseFloat(document.getElementById('skinRoughness').value),
                colorHue: parseInt(document.getElementById('colorHue').value),
                symmetry: parseFloat(document.getElementById('symmetry').value)
            };

            const plyData = createAlienMesh(alienConfig);
            currentPLYContent = plyData.content;
            
            document.getElementById('plyOutput').value = currentPLYContent;
            document.getElementById('vertexCount').textContent = plyData.vertexCount;
            document.getElementById('faceCount').textContent = plyData.faceCount;
            
            // Update complexity
            const totalElements = plyData.vertexCount + plyData.faceCount;
            let complexity = 'Low';
            if (totalElements > 300) complexity = 'Medium';
            if (totalElements > 600) complexity = 'High';
            if (totalElements > 1000) complexity = 'Extreme';
            
            document.getElementById('complexity').textContent = complexity;
        }

        function createAlienMesh(config) {
            const vertices = [];
            const faces = [];
            const colors = [];

            // Generate color from hue
            const hsl2rgb = (h, s, l) => {
                h /= 360;
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h * 12) % 12;
                    return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                };
                return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
            };

            const baseColor = hsl2rgb(config.colorHue, 70, 50);

            // Helper function to add vertex with noise
            const addVertex = (x, y, z, colorVariation = 0) => {
                const noise = config.skinRoughness * 0.1;
                const asymmetry = 1 - config.symmetry;
                
                const finalX = x + (Math.random() - 0.5) * noise + (x > 0 ? asymmetry * 0.1 : -asymmetry * 0.1);
                const finalY = y + (Math.random() - 0.5) * noise;
                const finalZ = z + (Math.random() - 0.5) * noise;
                
                vertices.push([finalX, finalY, finalZ]);
                
                const colorMod = 1 + (Math.random() - 0.5) * colorVariation;
                colors.push([
                    Math.max(0, Math.min(255, Math.round(baseColor[0] * colorMod))),
                    Math.max(0, Math.min(255, Math.round(baseColor[1] * colorMod))),
                    Math.max(0, Math.min(255, Math.round(baseColor[2] * colorMod)))
                ]);
                
                return vertices.length - 1;
            };

            // Create head (ellipsoid)
            const headVertices = [];
            const headSegs = 12;
            for (let i = 0; i <= headSegs; i++) {
                for (let j = 0; j <= headSegs; j++) {
                    const theta = (i / headSegs) * Math.PI;
                    const phi = (j / headSegs) * 2 * Math.PI;
                    
                    const x = config.headSize * 0.4 * Math.sin(theta) * Math.cos(phi);
                    const y = config.bodyHeight + config.headSize * 0.5 * Math.cos(theta);
                    const z = config.headSize * 0.4 * Math.sin(theta) * Math.sin(phi);
                    
                    headVertices.push(addVertex(x, y, z, 0.2));
                }
            }

            // Create head faces
            for (let i = 0; i < headSegs; i++) {
                for (let j = 0; j < headSegs; j++) {
                    const a = i * (headSegs + 1) + j;
                    const b = a + headSegs + 1;
                    const c = a + 1;
                    const d = b + 1;
                    
                    faces.push([a, b, c]);
                    faces.push([b, d, c]);
                }
            }

            // Create eyes
            const eyeY = config.bodyHeight + config.headSize * 0.3;
            const eyeZ = config.headSize * 0.35;
            
            for (let eye = 0; eye < 2; eye++) {
                const eyeX = (eye === 0 ? -1 : 1) * config.eyeSeparation;
                const eyeCenter = addVertex(eyeX, eyeY, eyeZ, 0.1);
                
                // Create eye sphere
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * 2 * Math.PI;
                    const x = eyeX + config.eyeSize * Math.cos(angle);
                    const y = eyeY + config.eyeSize * 0.3 * Math.sin(angle);
                    const z = eyeZ + config.eyeSize * 0.5;
                    
                    const eyeVertex = addVertex(x, y, z, 0.3);
                    
                    if (i > 0) {
                        faces.push([eyeCenter, eyeVertex - 1, eyeVertex]);
                    }
                }
            }

            // Create body (cylinder)
            const bodySegs = 10;
            const bodyRadius = 0.3;
            
            for (let i = 0; i <= bodySegs; i++) {
                for (let level = 0; level <= 4; level++) {
                    const angle = (i / bodySegs) * 2 * Math.PI;
                    const y = (level / 4) * config.bodyHeight;
                    const radius = bodyRadius * (1 - level * 0.1);
                    
                    const x = radius * Math.cos(angle);
                    const z = radius * Math.sin(angle);
                    
                    addVertex(x, y, z, 0.15);
                }
            }

            // Create body faces
            const bodyStart = headVertices.length + 16; // After head and eyes
            for (let i = 0; i < bodySegs; i++) {
                for (let level = 0; level < 4; level++) {
                    const a = bodyStart + i * 5 + level;
                    const b = bodyStart + ((i + 1) % bodySegs) * 5 + level;
                    const c = a + 1;
                    const d = b + 1;
                    
                    faces.push([a, b, c]);
                    faces.push([b, d, c]);
                }
            }

            // Create limbs (arms and legs)
            const limbSegs = 6;
            for (let limb = 0; limb < 4; limb++) {
                const isArm = limb < 2;
                const isLeft = limb % 2 === 0;
                const baseX = (isLeft ? -0.4 : 0.4);
                const baseY = isArm ? config.bodyHeight * 0.7 : 0;
                const length = config.limbLength * (isArm ? 0.8 : 1.2);
                
                for (let i = 0; i <= limbSegs; i++) {
                    const t = i / limbSegs;
                    const x = baseX + (isArm ? (isLeft ? -1 : 1) * t * length * 0.5 : 0);
                    const y = baseY - (isArm ? t * length * 0.3 : t * length);
                    const z = isArm ? t * length * 0.2 : 0;
                    const radius = 0.1 * (1 - t * 0.3);
                    
                    // Create ring of vertices around limb
                    for (let j = 0; j < 6; j++) {
                        const angle = (j / 6) * 2 * Math.PI;
                        const limbX = x + radius * Math.cos(angle);
                        const limbZ = z + radius * Math.sin(angle);
                        
                        addVertex(limbX, y, limbZ, 0.1);
                    }
                }
            }

            // Create antennae
            if (config.antennaCount > 0) {
                for (let ant = 0; ant < config.antennaCount; ant++) {
                    const angle = (ant / config.antennaCount) * 2 * Math.PI;
                    const baseX = 0.2 * Math.cos(angle);
                    const baseZ = 0.2 * Math.sin(angle);
                    const baseY = config.bodyHeight + config.headSize * 0.8;
                    
                    for (let i = 0; i <= 5; i++) {
                        const t = i / 5;
                        const x = baseX * (1 + t * 0.5);
                        const y = baseY + t * 0.4;
                        const z = baseZ * (1 + t * 0.5);
                        
                        addVertex(x, y, z, 0.2);
                        
                        if (i > 0) {
                            faces.push([vertices.length - 2, vertices.length - 1, vertices.length - 1]);
                        }
                    }
                }
            }

            // Generate PLY content
            let plyContent = `ply
format ascii 1.0
element vertex ${vertices.length}
property float x
property float y
property float z
property uchar red
property uchar green
property uchar blue
element face ${faces.length}
property list uchar int vertex_indices
end_header
`;

            // Add vertices
            for (let i = 0; i < vertices.length; i++) {
                const v = vertices[i];
                const c = colors[i];
                plyContent += `${v[0].toFixed(6)} ${v[1].toFixed(6)} ${v[2].toFixed(6)} ${c[0]} ${c[1]} ${c[2]}\n`;
            }

            // Add faces
            for (const face of faces) {
                plyContent += `3 ${face[0]} ${face[1]} ${face[2]}\n`;
            }

            return {
                content: plyContent,
                vertexCount: vertices.length,
                faceCount: faces.length
            };
        }

        function downloadPLY() {
            if (!currentPLYContent) {
                alert('Please generate a PLY file first!');
                return;
            }

            const blob = new Blob([currentPLYContent], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alien_${Date.now()}.ply`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize
        updateAlienType();
    </script>
</body>
</html>
