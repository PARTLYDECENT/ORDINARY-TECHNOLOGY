<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF Genesis Kernel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1);
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #ff007b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .data {
            font-size: 12px;
            color: #88c0d0;
            line-height: 1.6;
            letter-spacing: 1px;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        #coords-hud {
            position: absolute;
            top: 40px;
            right: 40px;
            color: rgba(255, 255, 255, 0.9);
            text-align: right;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1);
        }
        .hud-row {
            font-size: 14px;
            color: #eceff4;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .hud-val {
            color: #a3be8c;
            font-weight: bold;
            display: inline-block;
            width: 80px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
    <div id="ui">
        <div class="title">SDF GENESIS KERNEL</div>
        <div class="data">> INITIATING PROCEDURAL EXTRUSION... <span class="blink">_</span></div>
        <div class="data">> WASD: MOVE | SPACE: JUMP | MOUSE: LOOK</div>
        <div class="data" style="color:#d08770; margin-top:8px;">> L-CLICK: RAILGUN | Q: FLARE | E: CHAFF</div>
    </div>

    <!-- AI Training & World Coordinate HUD -->
    <div id="coords-hud">
        <div class="hud-row">POS-X: <span id="hud-x" class="hud-val">0.00</span></div>
        <div class="hud-row">POS-Y: <span id="hud-y" class="hud-val">0.00</span></div>
        <div class="hud-row">POS-Z: <span id="hud-z" class="hud-val">0.00</span></div>
        <div class="hud-row" style="margin-top: 10px;">HDG: <span id="hud-heading" class="hud-val" style="color: #ebcb8b;">0° N</span></div>
    </div>

    <div id="crosshair"></div>

    <script type="module" src="./renderer.js"></script>
</body>
</html>
