<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Paradigms: Reactive Voxel Buffer</title>
    <!-- Babylon.js Core and Dependencies -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            cursor: crosshair;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 340px;
            background: rgba(10, 12, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #aeb4c5;
        }
        p {
            font-size: 0.85rem;
            color: #8b92a5;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #cdd3e6;
        }
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #2a2d3d;
            border-radius: 2px;
        }
        .status-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }
        .status-val {
            font-weight: 600;
            font-family: monospace;
            font-size: 0.85rem;
            color: #40a0ff;
        }
        .instruction {
            color: #ff4040;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-layer">
        <h1>Reactive Voxel Map</h1>
        <p>Double-buffered GPU Cellular Automata. The ground is a continuous data stream evaluating physics, corrosion, and biological healing per-pixel.</p>
        
        <div class="control-group">
            <label>
                <span>Biological Healing Rate</span>
                <span id="heal-val">10%</span>
            </label>
            <input type="range" id="healSlider" min="1" max="50" value="10">
        </div>

        <div class="control-group">
            <label>
                <span>Kinetic Damping (Friction)</span>
                <span id="damp-val">98%</span>
            </label>
            <input type="range" id="dampSlider" min="90" max="99" value="98">
        </div>

        <div class="status-box">
            <div class="status-row">
                <span>Data-Buffer Size:</span>
                <span class="status-val">512 x 512 (FLOAT)</span>
            </div>
            <div class="status-row">
                <span>Compute Pipeline:</span>
                <span class="status-val">Ping-Pong RTT</span>
            </div>
        </div>
        
        <span class="instruction">Click & Drag to cause kinetic damage</span>
    </div>

    <script>
        // --- 1. SHADER DEFINITIONS ---
        
        // A. AUTOMATA SIMULATION SHADER (Ping-Pong Compute)
        BABYLON.Effect.ShadersStore["simVertexShader"] = `
            precision highp float;
            attribute vec3 position;
            attribute vec2 uv;
            varying vec2 vUV;
            void main() {
                vUV = uv;
                // Render flat to the screen for RTT processing
                gl_Position = vec4(position, 1.0);
            }
        `;

        BABYLON.Effect.ShadersStore["simFragmentShader"] = `
            precision highp float;
            varying vec2 vUV;
            
            uniform sampler2D uState;
            uniform vec2 uResolution;
            uniform vec4 uImpact; // x: u, y: v, z: radius, w: force
            uniform float uHealRate;
            uniform float uDamping;

            void main() {
                vec2 uv = vUV;
                // Fixed GLSL strict typing: Convert scalar to vec2
                vec2 texel = vec2(1.0) / uResolution;
                
                // Fetch current cell and immediate neighbors
                // Channel R = Height, Channel G = Vertical Velocity, Channel B = Corrosive Damage
                vec4 c = texture2D(uState, uv);
                vec4 n = texture2D(uState, uv + vec2(0.0, texel.y));
                vec4 s = texture2D(uState, uv + vec2(0.0, -texel.y));
                vec4 e = texture2D(uState, uv + vec2(texel.x, 0.0));
                vec4 w = texture2D(uState, uv + vec2(-texel.x, 0.0));
                
                // 2D Wave Equation Simulation (Cellular Automata Rule)
                float avgHeight = (n.r + s.r + e.r + w.r) * 0.25;
                
                // Acceleration based on neighbor tension
                float accel = (avgHeight - c.r) * 2.0; 
                
                // Update Velocity and Height
                float newVel = c.g + accel * 0.5;
                newVel *= uDamping; // Friction
                float newHeight = c.r + newVel * 0.5;
                
                // Biological Healing: Slowly interpolate back to baseline height of 0.5
                newHeight += (0.5 - newHeight) * uHealRate;
                
                // Damage state slowly fades out
                float newDamage = max(c.b - (uHealRate * 0.5), 0.0);
                
                // Process external impact (User clicking)
                if (uImpact.w > 0.0) {
                    float dist = distance(uv, uImpact.xy);
                    if (dist < uImpact.z) {
                        float force = smoothstep(uImpact.z, 0.0, dist) * uImpact.w;
                        newHeight -= force * 0.5; // push down into a crater
                        newVel -= force;
                        newDamage = min(newDamage + force * 2.0, 1.0); // apply corrosion
                    }
                }
                
                gl_FragColor = vec4(newHeight, newVel, newDamage, 1.0);
            }
        `;

        // B. DISPLAY SHADER (Geometry Deformation & Lighting)
        BABYLON.Effect.ShadersStore["groundVertexShader"] = `
            precision highp float;
            attribute vec3 position;
            attribute vec2 uv;
            
            uniform mat4 worldViewProjection;
            uniform sampler2D uHeightMap;
            
            varying vec2 vUV;
            varying float vHeight;
            
            void main() {
                vUV = uv;
                
                // Sample the simulation buffer
                vec4 state = texture2D(uHeightMap, uv);
                vHeight = state.r;
                
                // Displace vertices along Y. Baseline is 0.5, scale displacement by 10.0
                vec3 pos = position;
                pos.y += (state.r - 0.5) * 10.0; 
                
                gl_Position = worldViewProjection * vec4(pos, 1.0);
            }
        `;

        BABYLON.Effect.ShadersStore["groundFragmentShader"] = `
            precision highp float;
            varying vec2 vUV;
            varying float vHeight;
            
            uniform sampler2D uHeightMap;
            uniform vec3 cameraPosition;
            
            void main() {
                // Fixed GLSL strict typing: Explicitly define vec2
                vec2 texel = vec2(1.0 / 512.0);
                
                // Sample heightmap dynamically to calculate accurate normals on the deformed surface
                float hL = texture2D(uHeightMap, vUV + vec2(-texel.x, 0.0)).r;
                float hR = texture2D(uHeightMap, vUV + vec2(texel.x, 0.0)).r;
                float hD = texture2D(uHeightMap, vUV + vec2(0.0, -texel.y)).r;
                float hU = texture2D(uHeightMap, vUV + vec2(0.0, texel.y)).r;
                float damage = texture2D(uHeightMap, vUV).b;
                
                // Finite difference normal generation (10.0 matches the vertex scale)
                vec3 dX = normalize(vec3(1.0, (hR - hL) * 10.0, 0.0));
                vec3 dZ = normalize(vec3(0.0, (hU - hD) * 10.0, 1.0));
                vec3 normal = normalize(cross(dZ, dX));
                
                // Lighting
                vec3 lightDir = normalize(vec3(0.8, 1.0, 0.4));
                float diff = max(dot(normal, lightDir), 0.15); // Diffuse + Ambient
                
                // Specular reflection for a "wet/bio" look
                // Approx world position mapping (grid is 40x40, uv is 0-1)
                vec3 worldPos = vec3((vUV.x - 0.5) * 40.0, (vHeight - 0.5) * 10.0, (vUV.y - 0.5) * 40.0);
                vec3 viewDir = normalize(cameraPosition - worldPos);
                vec3 halfDir = normalize(lightDir + viewDir);
                float spec = pow(max(dot(normal, halfDir), 0.0), 32.0) * 0.6;
                
                // Color mapping: Bio-tech base vs Corrosive Damage
                vec3 healthyBase = mix(vec3(0.02, 0.05, 0.1), vec3(0.1, 0.3, 0.4), diff);
                vec3 corrosiveCore = vec3(1.0, 0.2, 0.0);
                vec3 corrosiveEdge = vec3(0.8, 0.6, 0.0);
                
                // Map damage gradient
                vec3 damageColor = mix(corrosiveEdge, corrosiveCore, damage);
                
                // Subtle high-tech grid overlay
                vec2 gridUV = fract(vUV * 60.0);
                float gridLine = step(0.96, gridUV.x) + step(0.96, gridUV.y);
                vec3 finalColor = mix(healthyBase, damageColor, damage);
                finalColor += vec3(0.0, 0.8, 0.5) * clamp(gridLine, 0.0, 1.0) * 0.15 * (1.0 - damage); // Hide grid where damaged
                
                // Add specular
                finalColor += vec3(1.0) * spec * (1.0 - damage * 0.5); // Less shiny on damaged parts
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- 2. BABYLON ARCHITECTURE SETUP ---
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.02, 1.0);

            // Main View Camera
            const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 4, Math.PI / 3, 35, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.minZ = 0.1;
            camera.lowerRadiusLimit = 10;
            camera.upperRadiusLimit = 60;
            
            // Layer mask ensures main camera doesn't see the hidden computation quad
            camera.layerMask = 0x0FFFFFFF; 

            // Glow layer for corrosive material
            const glow = new BABYLON.GlowLayer("glow", scene);
            glow.intensity = 1.5;

            // --- PING-PONG RTT COMPUTATION SETUP ---
            const TEX_SIZE = 512;
            const LAYER_COMPUTE = 0x10000000;

            // Two Half-Float textures to hold the persistent data buffer states (A & B)
            const rttA = new BABYLON.RenderTargetTexture("rttA", TEX_SIZE, scene, false, true, BABYLON.Constants.TEXTURETYPE_HALF_FLOAT);
            const rttB = new BABYLON.RenderTargetTexture("rttB", TEX_SIZE, scene, false, true, BABYLON.Constants.TEXTURETYPE_HALF_FLOAT);
            rttA.wrapU = rttA.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
            rttB.wrapU = rttB.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;

            // Isolated orthographic camera specifically for rendering the computation quad
            const simCamera = new BABYLON.FreeCamera("simCam", new BABYLON.Vector3(0, 0, -1), scene);
            simCamera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
            simCamera.orthoLeft = -1; simCamera.orthoRight = 1;
            simCamera.orthoTop = 1; simCamera.orthoBottom = -1;
            simCamera.layerMask = LAYER_COMPUTE;

            // Computation quad (matches ortho camera bounds perfectly)
            const simQuad = BABYLON.MeshBuilder.CreatePlane("simQuad", {size: 2}, scene);
            simQuad.layerMask = LAYER_COMPUTE;

            // Material running the Automata rules
            const simMat = new BABYLON.ShaderMaterial("simMat", scene, 
                { vertex: "sim", fragment: "sim" },
                {
                    attributes: ["position", "uv"],
                    uniforms: ["uState", "uResolution", "uImpact", "uHealRate", "uDamping"]
                }
            );
            simMat.setVector2("uResolution", new BABYLON.Vector2(TEX_SIZE, TEX_SIZE));
            simQuad.material = simMat;

            // Assign the compute quad to only be rendered by the RTTs
            rttA.renderList.push(simQuad);
            rttA.activeCamera = simCamera;
            rttB.renderList.push(simQuad);
            rttB.activeCamera = simCamera;

            // --- MAIN DISPLAY GEOMETRY SETUP ---
            // Highly tessellated plane to accurately show the voxel buffer displacement
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 40, height: 40, subdivisions: 300}, scene);
            ground.layerMask = 0x0FFFFFFF; // Only seen by main camera

            const groundMat = new BABYLON.ShaderMaterial("groundMat", scene, 
                { vertex: "ground", fragment: "ground" },
                {
                    attributes: ["position", "uv"],
                    uniforms: ["worldViewProjection", "uHeightMap", "cameraPosition"]
                }
            );
            ground.material = groundMat;

            return { scene, rttA, rttB, simMat, groundMat, camera };
        };

        const { scene, rttA, rttB, simMat, groundMat, camera } = createScene();

        // --- 3. LOGIC & INTERACTION ---
        
        let pingPongTrigger = false;
        let currentImpact = [0.0, 0.0, 0.05, 0.0]; // u, v, radius, force
        let isPointerDown = false;

        // UI Variables
        let healRate = 0.01;
        let damping = 0.98;

        document.getElementById("healSlider").addEventListener("input", (e) => {
            let val = parseInt(e.target.value);
            healRate = val / 1000; // Map 1-50 to 0.001 - 0.050
            document.getElementById("heal-val").innerText = `${val}%`;
        });

        document.getElementById("dampSlider").addEventListener("input", (e) => {
            let val = parseInt(e.target.value);
            damping = val / 100;
            document.getElementById("damp-val").innerText = `${val}%`;
        });

        // Raycasting for continuous kinetic damage
        scene.onPointerObservable.add((pointerInfo) => {
            switch (pointerInfo.type) {
                case BABYLON.PointerEventTypes.POINTERDOWN:
                    isPointerDown = true;
                    // Intentional fallthrough
                case BABYLON.PointerEventTypes.POINTERMOVE:
                    if (isPointerDown && pointerInfo.pickInfo.hit && pointerInfo.pickInfo.pickedMesh.name === "ground") {
                        let uv = pointerInfo.pickInfo.getTextureCoordinates();
                        if (uv) {
                            currentImpact[0] = uv.x;
                            currentImpact[1] = uv.y;
                            currentImpact[3] = 1.5; // Trigger massive force
                        }
                    }
                    break;
                case BABYLON.PointerEventTypes.POINTERUP:
                    isPointerDown = false;
                    break;
            }
        });

        // Double Buffering (Ping-Pong) Loop
        scene.onBeforeRenderObservable.add(() => {
            // Apply current UI and Impact uniforms
            simMat.setFloat("uHealRate", healRate);
            simMat.setFloat("uDamping", damping);
            simMat.setVector4("uImpact", new BABYLON.Vector4(...currentImpact));
            
            // Fade out the impact force quickly so it doesn't drill endlessly
            currentImpact[3] *= 0.5;

            // Ping-Pong Architecture:
            // Frame A: Read from RTT_A -> Compute rules -> Write to RTT_B. Display RTT_B.
            // Frame B: Read from RTT_B -> Compute rules -> Write to RTT_A. Display RTT_A.
            if (pingPongTrigger) {
                simMat.setTexture("uState", rttA);       // Set read target
                scene.customRenderTargets = [rttB];      // Set write target
                groundMat.setTexture("uHeightMap", rttB);// Connect output to geometry
            } else {
                simMat.setTexture("uState", rttB);
                scene.customRenderTargets = [rttA];
                groundMat.setTexture("uHeightMap", rttA);
            }
            
            pingPongTrigger = !pingPongTrigger;
        });

        engine.runRenderLoop(() => {
            // Re-bind camera position for specular lighting in fragment
            groundMat.setVector3("cameraPosition", camera.position);
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
