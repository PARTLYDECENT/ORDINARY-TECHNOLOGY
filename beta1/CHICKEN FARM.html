<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Materia Stream Engine: High-Fidelity Chicken</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff9900;
            background: rgba(20, 10, 0, 0.8);
            padding: 15px;
            border: 1px solid #ff9900;
            border-radius: 4px;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 5px #ff9900;
        }
        .stat-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 5px; }
        .stat-label { opacity: 0.7; }
        .stat-value { font-weight: bold; }
        h1 { margin: 0 0 10px 0; font-size: 18px; border-bottom: 1px solid #ff9900; padding-bottom: 5px; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>MATERIA ENGINE: HF CHICKEN</h1>
        <div class="stat-row">
            <span class="stat-label">FLOCK COUNT:</span>
            <span class="stat-value" id="count-display">4096</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="fps-display">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">CPU LOAD:</span>
            <span class="stat-value">IDLE (GPU DRIVEN)</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">MODE:</span>
            <span class="stat-value">High Fidelity Instancing</span>
        </div>
        <div style="margin-top: 10px; font-size: 12px; color: #aaa;">
            > Left Click: Rotate Camera<br>
            > Scroll: Zoom<br>
            > Space: Trigger "Feeding Frenzy"
        </div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        // CONFIGURATION
        const FLOCK_COUNT = 4096; 
        const GRID_SIZE = 140;
        
        // --- CHICKEN SHADER DEFINITIONS ---
        
        const chickenVertexShader = `
            precision highp float;
            
            // Attributes
            attribute vec3 position;
            attribute vec3 normal;
            attribute vec4 color; // r,g,b = Color, a = BODY PART ID
            attribute vec4 world0;
            attribute vec4 world1;
            attribute vec4 world2;
            attribute vec4 world3;
            
            // Uniforms
            uniform mat4 viewProjection;
            uniform float time;
            uniform float hordeState; // 0.0 = Walk, 1.0 = Pecking

            // Varying
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec4 vColor;
            varying float vNoise;

            float hash(float n) { return fract(sin(n) * 43758.5453123); }

            // Part IDs (Defined in JS)
            // 0.0: Body
            // 0.2: Left Leg
            // 0.3: Right Leg
            // 0.5: Neck/Head
            // 0.6: Tail
            // 0.7: Wings

            void main() {
                mat4 finalWorld = mat4(world0, world1, world2, world3);
                float instanceSeed = finalWorld[3][0] + finalWorld[3][2] * 57.0;
                float randOffset = hash(instanceSeed);
                
                vec3 p = position;
                float partID = color.a; // Read the encoded part ID
                
                // Common Variables
                float speed = 8.0 + (randOffset * 4.0);
                float legCycle = time * 12.0 + randOffset * 10.0;
                float bob = abs(sin(legCycle)) * 0.08;

                // --- ANIMATION LOGIC BY PART ---

                // 1. General Body Bob (Applied to almost everything except feet touching ground?)
                // Actually, let's bob everything above y=0.5
                if (p.y > 0.5) {
                    p.y += bob;
                }

                // 2. HEAD & NECK (ID ~ 0.5)
                if (partID > 0.45 && partID < 0.55) {
                    // Head Bob (Walking)
                    float headBob = sin(time * 15.0 * speed) * 0.05;
                    p.z += headBob + 0.05; // Slightly forward bias
                    p.x += sin(time * 0.5 + randOffset) * 0.02; // Look around slightly

                    // PECK STATE
                    if (hordeState > 0.1) {
                        float peckPower = hordeState; // Blend
                        float peckCycle = sin(time * 20.0 + randOffset);
                        
                        if (peckCycle > 0.0) {
                            // Pivot down logic (Approximation of rotation)
                            p.y -= 0.8 * peckPower;
                            p.z += 0.4 * peckPower;
                        }
                    }
                }

                // 3. LEGS (Left=0.2, Right=0.3)
                if (partID > 0.15 && partID < 0.35) {
                    float isRight = (partID > 0.25) ? 1.0 : 0.0;
                    float myCycle = legCycle + (isRight * 3.14159); // Offset right leg by PI
                    
                    float legAngle = sin(myCycle);
                    
                    // Simple swing rotation around hip (approx Y=0.7)
                    float pivotY = 0.7;
                    float dy = p.y - pivotY;
                    float dz = p.z; // relative Z
                    
                    // Rotate Z and Y based on angle
                    float s = sin(legAngle * 0.5);
                    float c = cos(legAngle * 0.5);
                    
                    // Only animate if walking (implied always walking here)
                    p.z = dz * c - dy * s;
                    p.y = dz * s + dy * c + pivotY;
                }

                // 4. TAIL (ID ~ 0.6)
                if (partID > 0.55 && partID < 0.65) {
                    float tailWag = sin(time * 10.0 + randOffset * 5.0) * 0.05;
                    p.x += tailWag;
                }

                // 5. WINGS (ID ~ 0.7)
                if (partID > 0.65 && partID < 0.75) {
                    float flap = sin(time * 15.0 + randOffset) * 0.1;
                    p.y += flap;
                    // Expand out slightly
                    p.x += (p.x > 0.0 ? flap : -flap) * 0.5;
                }

                vec4 worldPos = finalWorld * vec4(p, 1.0);
                gl_Position = viewProjection * worldPos;

                vNormal = mat3(finalWorld) * normal;
                vPosition = worldPos.xyz;
                vColor = color; 
                vNoise = randOffset;
            }
        `;

        const chickenFragmentShader = `
            precision highp float;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec4 vColor;
            varying float vNoise;

            uniform vec3 cameraPosition;

            void main() {
                vec3 albedo = vColor.rgb;
                
                // Add noise detail to feathers (White parts)
                if (albedo.r > 0.9 && albedo.g > 0.9) {
                    float n = fract(sin(dot(vPosition.xy, vec2(12.9898, 78.233))) * 43758.5453);
                    albedo -= n * 0.05; 
                }

                // Lighting
                vec3 lightDir = normalize(vec3(0.5, 1.0, -0.3));
                vec3 normal = normalize(vNormal);
                float ndotl = max(0.0, dot(normal, lightDir));
                
                // Specular (Roughness control via Color R channel?)
                // Red parts (Comb) are shiny. Orange (Beak) shiny. White (Feathers) matte.
                
                float shine = 0.0;
                if (vColor.r > 0.8 && vColor.b < 0.2) shine = 0.5; // Red/Orange parts
                
                vec3 viewDir = normalize(cameraPosition - vPosition);
                vec3 halfDir = normalize(lightDir + viewDir);
                float spec = pow(max(0.0, dot(normal, halfDir)), 32.0) * shine;
                
                vec3 ambient = vec3(0.1, 0.1, 0.15);
                vec3 finalColor = ambient + (albedo * ndotl) + spec;
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- ENGINE SETUP ---

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.5, 0.6, 0.7, 1);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.015;
            scene.fogColor = new BABYLON.Color3(0.5, 0.6, 0.7);

            const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 4, Math.PI / 3, 20, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.6;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: GRID_SIZE, height: GRID_SIZE}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.35, 0.15); 
            ground.material = groundMat;

            // --- HF MASTER CHICKEN BUILDER ---
            // Replicating your ProceduralChicken class geometry EXACTLY
            
            const meshesToMerge = [];

            // Helper: color = material color, partID = animation group ID
            const paint = (mesh, r, g, b, partID) => {
                const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const colors = [];
                for (let i = 0; i < positions.length / 3; i++) {
                    colors.push(r, g, b, partID); // Encode Part ID in Alpha
                }
                mesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, colors);
                meshesToMerge.push(mesh);
            };

            // Colors
            // Body PBR -> 0.95, 0.95, 0.95
            // Beak PBR -> 1.0, 0.6, 0.1
            // Skin PBR -> 0.8, 0.1, 0.1
            // Eye Mat  -> 0, 0, 0

            // Part IDs
            const ID_BODY = 0.0;
            const ID_LEG_L = 0.2;
            const ID_LEG_R = 0.3;
            const ID_HEAD = 0.5;
            const ID_TAIL = 0.6;
            const ID_WING = 0.7;

            // 1. BODY
            const body = BABYLON.MeshBuilder.CreateSphere("body", {
                diameterX: 1.2, diameterY: 1.0, diameterZ: 1.4, segments: 8
            }, scene);
            body.position.y = 1.0;
            paint(body, 0.95, 0.95, 0.95, ID_BODY);

            // 2. TAIL (5 feathers)
            for (let i = 0; i < 5; i++) {
                const feather = BABYLON.MeshBuilder.CreateBox("tail"+i, {
                    height: 0.1, width: 0.4, depth: 0.6
                }, scene);
                // Parent logic simulation
                feather.position = new BABYLON.Vector3(0, 1.2, -0.8); // Adjusted for parent offset
                feather.rotation.x = 0.5 - (i * 0.2);
                feather.rotation.y = (i - 2) * 0.3;
                // Note: Standard rotation on merged mesh works because we bake it before merge
                paint(feather, 0.95, 0.95, 0.95, ID_TAIL);
            }

            // 3. WINGS
            const createWing = (mirror) => {
                const wing = BABYLON.MeshBuilder.CreateSphere("wing", {
                    diameterX: 0.5, diameterY: 0.8, diameterZ: 0.3, segments: 8
                }, scene);
                // Scaling.x = 0.6
                wing.scaling.x = 0.6; 
                // Position relative to body (0, 1.0, 0)
                // wingGroup pos: (mirror ? -0.6 : 0.6, 0.2, 0) -> Absolute y = 1.2
                wing.position = new BABYLON.Vector3(mirror ? -0.6 : 0.6, 1.2, 0);
                wing.rotation.z = mirror ? -0.5 : 0.5;
                paint(wing, 0.95, 0.95, 0.95, ID_WING);
            };
            createWing(false);
            createWing(true);

            // 4. LEGS
            const createLeg = (mirror, partID) => {
                const xOffset = mirror ? -0.3 : 0.3;
                
                // Hip (Pivot point approx 0, 0.7, -0.1)
                
                // Thigh
                const thigh = BABYLON.MeshBuilder.CreateSphere("thigh", {diameter: 0.35, segments: 6}, scene);
                thigh.scaling.y = 1.5;
                thigh.position = new BABYLON.Vector3(xOffset, 0.6, -0.1); // Body(1.0) - 0.3 - 0.1
                thigh.rotation.x = -0.5;
                paint(thigh, 0.95, 0.95, 0.95, partID);

                // Shin
                const shin = BABYLON.MeshBuilder.CreateCylinder("shin", {height: 0.5, diameter: 0.08}, scene);
                // Rough position calculation from hierarchy
                shin.position = new BABYLON.Vector3(xOffset, 0.35, -0.2); 
                shin.rotation.x = 0.3; 
                paint(shin, 1.0, 0.6, 0.1, partID); // Beak color

                // Toes (Simplified to one block for GPU efficiency)
                const toes = BABYLON.MeshBuilder.CreateBox("toes", {width: 0.1, height: 0.06, depth: 0.3}, scene);
                toes.position = new BABYLON.Vector3(xOffset, 0.03, -0.1);
                paint(toes, 1.0, 0.6, 0.1, partID);
            };
            createLeg(true, ID_LEG_L);
            createLeg(false, ID_LEG_R);

            // 5. HEAD & NECK
            // Neck
            const neck = BABYLON.MeshBuilder.CreateCylinder("neck", {
                height: 0.5, diameterTop: 0.1, diameterBottom: 0.3
            }, scene);
            // Parent Body (1.0), pos (0, 0.4, 0.7) -> Absolute (0, 1.4, 0.7)
            // NeckMesh pos y=-0.1 -> Absolute (0, 1.3, 0.7)
            neck.position = new BABYLON.Vector3(0, 1.35, 0.6);
            neck.rotation.x = 0.8; // Tilted forward
            paint(neck, 0.95, 0.95, 0.95, ID_HEAD);

            // Head Sphere
            const head = BABYLON.MeshBuilder.CreateSphere("head", {diameter: 0.55, segments: 8}, scene);
            // HeadGroup (0.2, 0.1) relative to neck -> Approx (0, 1.6, 0.8)
            head.position = new BABYLON.Vector3(0, 1.6, 0.9);
            head.scaling.y = 0.85;
            paint(head, 0.95, 0.95, 0.95, ID_HEAD);

            // Comb (4 parts)
            for (let i = 0; i < 4; i++) {
                const combPart = BABYLON.MeshBuilder.CreateSphere("comb", {diameter: 0.18, segments: 4}, scene);
                const zOffset = (i - 1.5) * -0.12;
                combPart.position = new BABYLON.Vector3(0, 1.9, 0.9 + zOffset);
                combPart.scaling.y = 1.5;
                paint(combPart, 0.8, 0.1, 0.1, ID_HEAD);
            }

            // Beak
            const beak = BABYLON.MeshBuilder.CreateCylinder("beak", {
                height: 0.25, diameterTop: 0.01, diameterBottom: 0.2
            }, scene);
            beak.position = new BABYLON.Vector3(0, 1.55, 1.2); // Forward of head
            beak.rotation.x = Math.PI / 2;
            paint(beak, 1.0, 0.6, 0.1, ID_HEAD);

            // Wattles
            const wattle = BABYLON.MeshBuilder.CreateCapsule("wattle", {height: 0.3, radius: 0.06}, scene);
            wattle.position = new BABYLON.Vector3(0, 1.4, 1.05);
            wattle.rotation.x = -0.5;
            paint(wattle, 0.8, 0.1, 0.1, ID_HEAD);

            // Eyes
            const createEye = (mirror) => {
                const eye = BABYLON.MeshBuilder.CreateSphere("eye", {diameter: 0.1, segments: 4}, scene);
                eye.position = new BABYLON.Vector3(mirror ? -0.15 : 0.15, 1.65, 1.1);
                paint(eye, 0, 0, 0, ID_HEAD);
            };
            createEye(false);
            createEye(true);


            // MERGE
            const masterChicken = BABYLON.Mesh.MergeMeshes(meshesToMerge, true, true, undefined, false, true);

            // --- MATERIAL & INSTANCING ---
            
            const shaderMaterial = new BABYLON.ShaderMaterial("chickenMat", scene, {
                vertexSource: chickenVertexShader,
                fragmentSource: chickenFragmentShader,
            }, {
                attributes: ["position", "normal", "color", "world0", "world1", "world2", "world3"],
                uniforms: ["world", "viewProjection", "cameraPosition", "time", "hordeState"]
            });
            
            masterChicken.material = shaderMaterial;

            // Generate Flock
            const matricesData = new Float32Array(FLOCK_COUNT * 16);
            for (let i = 0; i < FLOCK_COUNT; i++) {
                const matrix = BABYLON.Matrix.Identity();
                const x = (Math.random() - 0.5) * GRID_SIZE;
                const z = (Math.random() - 0.5) * GRID_SIZE;
                const rot = Math.random() * Math.PI * 2;
                const scale = 0.8 + Math.random() * 0.4;

                const transform = BABYLON.Matrix.Compose(
                    new BABYLON.Vector3(scale, scale, scale),
                    BABYLON.Quaternion.FromEulerAngles(0, rot, 0),
                    new BABYLON.Vector3(x, 0, z)
                );
                transform.copyToArray(matricesData, i * 16);
            }

            masterChicken.thinInstanceSetBuffer("matrix", matricesData, 16);
            masterChicken.doNotSyncBoundingInfo = true; 

            // Loop
            let time = 0;
            let hordeState = 0.0;
            let targetState = 0.0;

            window.addEventListener("keydown", (evt) => {
                if (evt.code === "Space") {
                    targetState = targetState === 0.0 ? 1.0 : 0.0;
                }
            });

            scene.registerBeforeRender(() => {
                time += engine.getDeltaTime() * 0.001;
                shaderMaterial.setFloat("time", time);
                hordeState = BABYLON.Scalar.Lerp(hordeState, targetState, 0.1);
                shaderMaterial.setFloat("hordeState", hordeState);
                document.getElementById("fps-display").innerText = engine.getFps().toFixed(0);
            });

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(function () { scene.render(); });
        window.addEventListener("resize", function () { engine.resize(); });
    </script>
</body>
</html>
