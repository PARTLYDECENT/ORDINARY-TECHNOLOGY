<!DOCTYPE html>
<html><body>
<canvas id="c" width="4096" height="4096" style="width: 500px;"></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const texSize = 4096;
    const bgGrad = ctx.createLinearGradient(0, 0, 0, texSize);
    bgGrad.addColorStop(0, '#020108');
    bgGrad.addColorStop(0.5, '#050a14');
    bgGrad.addColorStop(1, '#01080d');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, texSize, texSize);
    console.log("Canvas drawn");
</script>
</body></html>
