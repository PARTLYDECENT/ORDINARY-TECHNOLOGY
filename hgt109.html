<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Y S _ A N O M A L Y</title>
    <style>
        /* BASE SYSTEM RESET */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        /* --- THE VOID (INITIAL STATE) --- */
        #void-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            transition: opacity 0.1s;
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #terminal-anchor {
            position: absolute;
            display: none;
            color: #ccc;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #ccc;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- GLITCH TRANSITION --- */
        .glitch-active {
            animation: screen-tear 0.2s infinite, invert-flash 0.5s infinite;
        }

        @keyframes screen-tear {
            0% { transform: skewX(0deg) translate(0); filter: blur(0); }
            20% { transform: skewX(-30deg) translate(-20px, 10px); filter: blur(4px); }
            40% { transform: skewX(20deg) translate(20px, -10px); filter: blur(0); }
            60% { transform: skewX(-10deg) translate(-10px, 4px); filter: blur(8px) hue-rotate(90deg); }
            80% { transform: skewX(25deg) translate(10px, -4px); filter: blur(0); }
            100% { transform: skewX(0deg) translate(0); filter: blur(0); }
        }

        @keyframes invert-flash {
            0%, 100% { filter: invert(0); background: #000; }
            50% { filter: invert(1) hue-rotate(180deg); background: #fff; }
        }

        /* --- STAGE 2: ADVANCED ALIEN INTERFACE --- */
        #alien-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            
            /* Sickly dimension bleed */
            background-color: #1a180f;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 20%, #0a0904 100%),
                linear-gradient(90deg, transparent 98%, rgba(150, 130, 40, 0.1) 98%),
                linear-gradient(transparent 98%, rgba(150, 130, 40, 0.1) 98%);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            filter: sepia(0.8) contrast(1.5) brightness(0.8);
        }

        /* Biological / Mechanical Overlay */
        .bio-flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
            animation: crt-flicker 0.15s infinite;
            mix-blend-mode: overlay;
        }

        @keyframes crt-flicker {
            0% { opacity: 0.9; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(1px); }
            100% { opacity: 0.95; transform: translateY(0); }
        }

        /* Geometric Non-Euclidean UI Elements */
        .shard {
            position: absolute;
            background: rgba(200, 180, 100, 0.05);
            border: 1px solid #7a6b32;
            color: #b5a665;
            padding: 20px;
            backdrop-filter: blur(2px);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(122, 107, 50, 0.2);
            transition: transform 0.2s, filter 0.2s;
        }

        /* Angular clip-paths for alien feel */
        #data-shard {
            top: 5%;
            left: 2%;
            width: 350px;
            height: 60vh;
            clip-path: polygon(0 0, 80% 0, 100% 10%, 100% 90%, 80% 100%, 0 100%, 10% 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            font-size: 10px;
        }

        #nav-shard {
            bottom: 5%;
            left: 2%;
            width: 250px;
            height: 180px;
            clip-path: polygon(0 20%, 100% 0, 80% 100%, 0 80%);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 30px 20px;
        }

        .alien-btn {
            border: 1px solid #7a6b32;
            padding: 8px;
            text-align: center;
            color: #b5a665;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.2s;
            background: rgba(122, 107, 50, 0.1);
        }

        .alien-btn:hover {
            background: rgba(181, 166, 101, 0.4);
            letter-spacing: 6px;
            text-shadow: 0 0 5px #fff;
            color: #fff;
        }

        #visualizer-shard {
            bottom: 5%;
            right: 2%;
            width: 400px;
            height: 250px;
            clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%, 0 20%);
        }

        #translation-shard {
            top: 5%;
            right: 2%;
            width: 300px;
            height: 150px;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #7a6b32;
        }

        /* Rotating Glyphs */
        #glyph-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            margin-top: -300px;
            margin-left: -300px;
            border-radius: 50%;
            border: 1px dashed #7a6b32;
            pointer-events: none;
            animation: rotate-ring 60s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #glyph-ring::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px solid rgba(122, 107, 50, 0.3);
            animation: rotate-ring 40s linear infinite reverse;
        }

        @keyframes rotate-ring {
            100% { transform: rotate(360deg); }
        }

        .svg-sigil {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }

        /* Audio feedback flash */
        .audio-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #7a6b32;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: color-dodge;
        }

        /* Fake crosshair / Tracker */
        #tracker {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid #b5a665;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            display: none;
            transform: translate(-50%, -50%);
            transition: width 0.1s, height 0.1s, border-radius 0.2s;
            mix-blend-mode: difference;
        }

        #tracker::after {
            content: '';
            position: absolute;
            top: -10px; bottom: -10px; left: 50%; width: 1px; background: #b5a665;
        }
        #tracker::before {
            content: '';
            position: absolute;
            left: -10px; right: -10px; top: 50%; height: 1px; background: #b5a665;
        }

        /* Canvas for Oscilloscope */
        #osc-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

    </style>
</head>
<body>

    <!-- STAGE 1: THE VOID -->
    <div id="void-layer">
        <div id="terminal-anchor">
            <span id="typed-text"></span><span class="cursor-blink"></span>
        </div>
    </div>
    <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">

    <!-- STAGE 2: THE ALIEN HUD -->
    <div id="alien-layer">
        <div class="bio-flicker"></div>
        <div class="audio-flash" id="flash-overlay"></div>
        
        <!-- Background Sacred Geometry -->
        <div id="glyph-ring">
            <svg class="svg-sigil" viewBox="0 0 100 100">
                <polygon points="50,5 95,25 95,75 50,95 5,75 5,25" fill="none" stroke="#7a6b32" stroke-width="0.5"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="#7a6b32" stroke-width="0.2" stroke-dasharray="2,2"/>
                <line x1="50" y1="5" x2="50" y2="95" stroke="#7a6b32" stroke-width="0.2"/>
                <line x1="5" y1="25" x2="95" y2="75" stroke="#7a6b32" stroke-width="0.2"/>
                <line x1="5" y1="75" x2="95" y2="25" stroke="#7a6b32" stroke-width="0.2"/>
            </svg>
        </div>

        <!-- Left Data Column -->
        <div class="shard" id="data-shard">
            <div style="border-bottom: 1px solid #7a6b32; margin-bottom: 10px; padding-bottom: 5px;">STREAM // NULL_ROUTING</div>
            <div id="log-stream" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;"></div>
        </div>

        <!-- Navigation Shard -->
        <div class="shard" id="nav-shard">
            <div style="font-size: 10px; text-align: center; margin-bottom: 10px;">ROUTING_NODES</div>
            <a href="1.html" class="alien-btn">ACCESS // 01</a>
            <a href="2.html" class="alien-btn">ACCESS // 02</a>
            <a href="3.html" class="alien-btn">ACCESS // 03</a>
        </div>

        <!-- Top Right Translation Matrix -->
        <div class="shard" id="translation-shard">
            <span id="alien-text">⍙⟒ ⌇⟒⟒ ⊬⍜⎍</span>
        </div>

        <!-- Bottom Right Audio/Entity Visualizer -->
        <div class="shard" id="visualizer-shard">
            <div style="position: absolute; top: 10px; left: 20px; z-index: 2; font-size: 10px;">FREQ // SPATIAL_ANOMALY</div>
            <canvas id="osc-canvas"></canvas>
        </div>
    </div>

    <!-- CUSTOM CURSOR -->
    <div id="tracker"></div>

    <script>
        // DOM Elements
        const voidLayer = document.getElementById('void-layer');
        const terminalAnchor = document.getElementById('terminal-anchor');
        const typedText = document.getElementById('typed-text');
        const hiddenInput = document.getElementById('hidden-input');
        const alienLayer = document.getElementById('alien-layer');
        const tracker = document.getElementById('tracker');
        const logStream = document.getElementById('log-stream');
        const alienText = document.getElementById('alien-text');
        const flashOverlay = document.getElementById('flash-overlay');
        const canvas = document.getElementById('osc-canvas');
        const ctx = canvas.getContext('2d');

        // State variables
        let phase = 'void';
        let audioContext = null;
        let pannerNode = null;
        let analyser = null;
        let dataArray = null;

        // --- PROCEDURAL LANGUAGE ENGINE ---
        const alienRanges = [
            [0x1400, 0x167F], // Canadian Syllabics (very alien looking)
            [0x1300, 0x137F], // Ethiopic
            [0x16A0, 0x16FF], // Runic
            [0x25A0, 0x25FF]  // Geometric
        ];

        function generateAlienWord(length) {
            let word = "";
            for(let i=0; i<length; i++) {
                const range = alienRanges[Math.floor(Math.random() * alienRanges.length)];
                const charCode = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
                word += String.fromCharCode(charCode);
            }
            return word;
        }

        const threatVocab = {
            subjects: ["THE VOID", "IT", "THE SWARM", "THE VESSEL", "NULL_STATE", "THE FLESH", "WE"],
            verbs: ["CONSUMES", "OBSERVES", "AWAITS", "FRACTURES", "REQUIRES", "SEES", "BLEEDS"],
            objects: ["TIME", "YOUR MIND", "THE MATRIX", "LIGHT", "BONE", "REALITY", "THE VEIL"]
        };

        function generateThreat() {
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const struct = Math.random();
            if (struct > 0.6) return `${pick(threatVocab.subjects)} ${pick(threatVocab.verbs)} ${pick(threatVocab.objects)}`;
            if (struct > 0.3) return `${pick(threatVocab.verbs)} ${pick(threatVocab.objects)}`;
            return `ERR: ${pick(threatVocab.subjects)} ACTIVE`;
        }

        // --- ADVANCED AUDIO SYNTHESIS ---
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // 1. Setup Master Analyser for Canvas
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            // 2. Master Compression to prevent clipping from wild FM synth
            const compressor = audioContext.createDynamicsCompressor();
            compressor.threshold.value = -10;
            compressor.knee.value = 40;
            compressor.ratio.value = 12;
            compressor.attack.value = 0;
            compressor.release.value = 0.25;

            analyser.connect(compressor);
            compressor.connect(audioContext.destination);

            // 3. Prepare Spatial Panner for Vocalizations
            pannerNode = audioContext.createStereoPanner();
            pannerNode.connect(analyser);
        }

        // --- DYNAMIC VOCALIZATION ENGINE ---
        // Generates sound purely based on the string content
        async function speakProceduralString(text) {
            if(phase !== 'alien' || !audioContext) return;
            
            // Display the text we are speaking
            document.getElementById('translation-shard').innerHTML = `<span id="alien-text" style="color: #fff; text-shadow: 0 0 10px #b5a665;">${text}</span>`;
            
            for(let i = 0; i < text.length; i++) {
                if(phase !== 'alien') break;
                
                const char = text.charCodeAt(i);
                if (char === 32) { // Space
                    await new Promise(r => setTimeout(r, 150));
                    continue;
                }

                // Create Audio Nodes
                const osc = audioContext.createOscillator(); // Carrier
                const lfo = audioContext.createOscillator(); // Modulator
                const lfoGain = audioContext.createGain();   // Modulator Depth
                const vca = audioContext.createGain();       // Volume Envelope
                const filter = audioContext.createBiquadFilter();

                // 1. Map character code to synthesizer parameters
                const types = ['sine', 'square', 'sawtooth', 'triangle'];
                osc.type = types[char % 4];
                lfo.type = types[(char * 3) % 4];
                
                // Base pitch (100Hz to 2000Hz)
                const baseFreq = ((char * 17) % 1900) + 100; 
                osc.frequency.setValueAtTime(baseFreq, audioContext.currentTime);
                
                // Frequency Modulation (creates complex, metallic/guttural tones)
                lfo.frequency.setValueAtTime((char * 7) % 100 + 1, audioContext.currentTime); // LFO Speed
                lfoGain.gain.setValueAtTime((char * 11) % 1500 + 100, audioContext.currentTime); // LFO Depth
                
                // Filter sweeps (formant-like sounds)
                filter.type = (char % 2 === 0) ? 'bandpass' : 'lowpass';
                filter.frequency.setValueAtTime(baseFreq * 2, audioContext.currentTime);
                filter.frequency.exponentialRampToValueAtTime(Math.max(100, baseFreq / 2), audioContext.currentTime + 0.1);
                filter.Q.value = (char % 10) + 1;

                // Duration and Envelope (Snappy vs Drawn out)
                const duration = ((char % 5) + 1) * 0.04 + 0.02; // 0.06s to 0.22s per "syllable"
                vca.gain.setValueAtTime(0, audioContext.currentTime);
                vca.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01); // Attack
                vca.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration); // Decay

                // Random spatial panning for disorientation
                pannerNode.pan.setValueAtTime((Math.random() * 2) - 1, audioContext.currentTime);

                // Connect the FM Synth graph
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency); // Modulate carrier frequency
                osc.connect(filter);
                filter.connect(vca);
                vca.connect(pannerNode);

                // Play
                lfo.start();
                osc.start();
                lfo.stop(audioContext.currentTime + duration);
                osc.stop(audioContext.currentTime + duration);

                // Visual flash on harsh sounds
                if (baseFreq > 1000) {
                    flashOverlay.style.opacity = '0.3';
                    setTimeout(() => flashOverlay.style.opacity = '0', 30);
                }

                // Wait for this syllable to finish before the next
                await new Promise(r => setTimeout(r, duration * 1000 + (Math.random() * 40)));
            }
            
            // Revert translation shard back to idle corruption after speaking
            setTimeout(() => {
                document.getElementById('translation-shard').innerHTML = `<span id="alien-text">${generateAlienWord(8)}</span>`;
            }, 2000);
        }

        // --- STAGE 1: INTERACTION LOGIC ---
        document.addEventListener('mousedown', (e) => {
            if (phase === 'void') {
                initAudio();
                phase = 'typing';
                terminalAnchor.style.left = e.clientX + 'px';
                terminalAnchor.style.top = e.clientY + 'px';
                terminalAnchor.style.display = 'block';
                hiddenInput.focus();
            } else if (phase === 'alien') {
                // UI Reacts to clicks in alien space
                tracker.style.borderRadius = '0%';
                tracker.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 90}deg)`;
                setTimeout(() => {
                    tracker.style.borderRadius = '50%';
                    tracker.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                }, 150);
            }
        });

        document.addEventListener('click', () => {
            if (phase === 'typing') hiddenInput.focus();
        });

        hiddenInput.addEventListener('input', (e) => {
            if (phase !== 'typing') return;
            const val = e.target.value.toLowerCase();
            typedText.innerText = val;

            if (val === "let me in") {
                triggerTransition();
            }
        });

        // --- TRANSITION ---
        function triggerTransition() {
            phase = 'transition';
            hiddenInput.disabled = true;
            voidLayer.classList.add('glitch-active');

            setTimeout(() => {
                voidLayer.style.display = 'none';
                alienLayer.style.opacity = '1';
                alienLayer.style.pointerEvents = 'auto';
                tracker.style.display = 'block';
                phase = 'alien';
                startAlienLogic();
            }, 1000);
        }

        // --- STAGE 2: ALIEN LOGIC ---
        function startAlienLogic() {
            // Setup Canvas size
            const resizeCanvas = () => {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            };
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 1. Mouse Tracking with lag and distortion
            document.addEventListener('mousemove', (e) => {
                if (phase === 'alien') {
                    // Slight lag effect
                    setTimeout(() => {
                        tracker.style.left = e.clientX + 'px';
                        tracker.style.top = e.clientY + 'px';
                    }, 20);
                }
            });

            // 2. Start Procedural Audio Transmission Loop
            const vocalizationLoop = () => {
                if (phase !== 'alien') return;
                
                // Decide whether to speak alien gibberish or a translated threat
                const textToSpeak = Math.random() > 0.4 ? generateThreat() : generateAlienWord(Math.floor(Math.random() * 10) + 4);
                
                speakProceduralString(textToSpeak).then(() => {
                    // Wait 2 to 6 seconds before speaking again
                    setTimeout(vocalizationLoop, Math.random() * 4000 + 2000);
                });
            };
            setTimeout(vocalizationLoop, 2000);

            // 3. Hex/Binary Data Stream Simulation
            const chars = "0101010100001111ABCDEFGHIJKLMNOPQRSTUVWXYZ⍙⟒⌇⟒⟒⊬⍜⎍";
            setInterval(() => {
                if(phase !== 'alien') return;
                
                let str = "";
                let len = Math.floor(Math.random() * 30) + 10;
                for(let i=0; i<len; i++) str += chars.charAt(Math.floor(Math.random() * chars.length));
                
                const p = document.createElement('div');
                p.innerText = `0x${(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0')} : ${str}`;
                p.style.opacity = Math.random() * 0.8 + 0.2;
                p.style.filter = `blur(${Math.random() > 0.9 ? 2 : 0}px)`;
                logStream.appendChild(p);

                if (logStream.children.length > 40) logStream.removeChild(logStream.firstChild);
            }, 80);

            // 4. (Removed static Translation Matrix interval - handled by vocalization engine now)

            // 5. Draw Oscilloscope
            function drawOscilloscope() {
                if (phase !== 'alien' || !analyser) return;
                requestAnimationFrame(drawOscilloscope);

                analyser.getByteTimeDomainData(dataArray);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(181, 166, 101, 0.8)';
                ctx.beginPath();

                const sliceWidth = canvas.width * 1.0 / analyser.frequencyBinCount;
                let x = 0;

                for (let i = 0; i < analyser.frequencyBinCount; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            drawOscilloscope();

            // 6. Initiate Automated Haunting Routine
            startAutomatedHaunting();
        }

        // --- AUTOMATED HAUNTING SCRIPT ---
        function startAutomatedHaunting() {
            // Periodically corrupt UI elements
            setInterval(() => {
                if (Math.random() > 0.7) {
                    const targets = ['#translation-shard', '.alien-btn', '#data-shard div:first-child'];
                    XENO_DEV.corruptMatter(targets[Math.floor(Math.random() * targets.length)]);
                }
            }, 6000);

            // Manifest random geometric clutter to disorient the user
            setInterval(() => {
                // Limit to 15 max anomalies so we don't crash their browser
                if (Math.random() > 0.6 && document.querySelectorAll('.shard').length < 15) {
                    XENO_DEV.manifestConstruct();
                }
            }, 9000);

            // Randomly fold space (highly disorienting)
            setInterval(() => {
                if (Math.random() > 0.85) {
                    XENO_DEV.foldSpace();
                }
            }, 25000);

            // Override vocalization with high-priority threats occasionally
            setInterval(() => {
                if (Math.random() > 0.7) {
                    XENO_DEV.transmit("CRITICAL FAILURE SYSTEM COLLAPSE IMMINENT");
                }
            }, 20000);
        }

        // --- ALIEN WEB DEV API (XENO_DEV) ---
        // Expose anomalous functions to the global scope for non-human debugging
        window.XENO_DEV = {
            help: function() {
                console.log("%c[SYSTEM]: XENO_DEV API INITIALIZED", "color: #b5a665; font-weight: bold; font-size: 14px;");
                console.log("%cAvailable Methods:", "color: #7a6b32;");
                console.log(" - XENO_DEV.foldSpace() : Collapse Euclidean geometry of the viewport.");
                console.log(" - XENO_DEV.corruptMatter(selector) : Degrade atomic structure of a DOM node.");
                console.log(" - XENO_DEV.transmit(message) : Force system to speak a specific string.");
                console.log(" - XENO_DEV.manifestConstruct() : Spawn a new dimensional anomaly (HTML element).");
            },
            
            foldSpace: function() {
                console.log("%c[!] WARNING: FOLDING LOCAL SPACE", "color: #ff0000; background: #000;");
                document.body.style.transition = 'transform 2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 2s';
                document.body.style.transform = `perspective(500px) rotateX(${Math.random()*60 - 30}deg) rotateY(${Math.random()*60 - 30}deg) scale(${Math.random()*0.4 + 0.8})`;
                document.body.style.filter = `hue-rotate(${Math.random()*360}deg) saturate(3) blur(${Math.random()*3}px)`;
                
                // Unfold after a few seconds
                setTimeout(() => {
                    document.body.style.transform = 'none';
                    document.body.style.filter = 'none';
                }, 4000);
            },
            
            corruptMatter: function(selector) {
                const el = document.querySelector(selector);
                if (!el) return console.warn("MATTER NOT FOUND IN CURRENT DIMENSION");
                
                const glyphs = "⍙⟒⌇⟒⟒⊬⍜⎍⏁⊑⟒⊬⏃⍀⟒⊑⟒⍀⟒☊⍜⍀⍀⎍⌿⏁⟟⍜⋏";
                let original = el.innerText || "UNKNOWN_MATTER";
                
                // Replace characters with alien glyphs randomly
                el.innerText = original.split('').map(c => Math.random() > 0.4 ? glyphs[Math.floor(Math.random()*glyphs.length)] : c).join('');
                el.style.mixBlendMode = 'color-burn';
                el.style.transform = `skewX(${Math.random()*20-10}deg)`;
                console.log(`%c[+] MATTER CORRUPTED AT ${selector}`, "color: #b5a665;");
            },
            
            transmit: function(msg) {
                if (phase !== 'alien') return console.warn("ESTABLISH CONNECTION FIRST (ENTER GATEWAY)");
                console.log("%c[TRANSMITTING OVERRIDE]: " + msg, "color: #ff0000; font-style: italic; font-weight: bold;");
                speakProceduralString(msg);
            },
            
            manifestConstruct: function() {
                const alienLayer = document.getElementById('alien-layer');
                if(!alienLayer) return;
                
                const newShard = document.createElement('div');
                newShard.className = 'shard';
                newShard.style.top = Math.random() * 80 + '%';
                newShard.style.left = Math.random() * 80 + '%';
                newShard.style.width = (Math.random() * 200 + 100) + 'px';
                newShard.style.height = (Math.random() * 200 + 100) + 'px';
                
                // Generate a highly irregular, non-rectangular shape
                const points = Array.from({length: Math.floor(Math.random()*5)+4}, () => `${Math.random()*100}% ${Math.random()*100}%`).join(', ');
                newShard.style.clipPath = `polygon(${points})`;
                
                newShard.innerHTML = `ANOMALY_ID_${Math.floor(Math.random()*9999)}<br>STRUCT: UNSTABLE`;
                newShard.style.fontSize = '12px';
                newShard.style.display = 'flex';
                newShard.style.alignItems = 'center';
                newShard.style.justifyContent = 'center';
                
                alienLayer.appendChild(newShard);
                console.log("%c[+] CONSTRUCT MANIFESTED", "color: #b5a665;");
            }
        };

        // Notify "developer" in console
        console.log("%c[!] XENO_DEV API EXPOSED. RUN XENO_DEV.help() FOR ROUTING.", "color: #b5a665; background: #000; padding: 5px; font-family: monospace; font-size: 12px; border: 1px dashed #7a6b32;");

    </script>
</body>
