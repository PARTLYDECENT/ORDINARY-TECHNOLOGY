<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recycled Cosmos - Shader Console</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: 'Courier New', monospace;
    }

    #console {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ff88;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border: 1px solid #00ff88;
      max-width: 500px;
      white-space: pre-wrap;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="console"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
  <script type="x-shader/x-fragment" id="fragmentShader">
    uniform float time;
    uniform vec2 resolution;

    float random(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 pos = uv - 0.5;
      pos.x *= resolution.x / resolution.y;

      float starfield = pow(random(floor(uv * 150.0)) * 2.0, 20.0);

      // Pulsing anomaly
      float t = time * 0.3;
      float r = 0.3 + 0.1 * sin(t);
      float anomaly = smoothstep(r, r - 0.01, length(pos - vec2(sin(t), cos(t)) * 0.3));
      
      vec3 col = vec3(0.0);
      col += vec3(1.0, 1.0, 1.0) * starfield;
      col += vec3(0.1, 0.8, 1.0) * anomaly;

      gl_FragColor = vec4(col, 1.0);
    }
  </script>
  <script>
    // Shader init
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const uniforms = {
      time: { value: 0.0 },
      resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
      fragmentShader: document.getElementById("fragmentShader").textContent,
      uniforms
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
    });

    // Typing effect
    const consoleEl = document.getElementById("console");
    const message = `
Initializing Recycle Mode...

>> Computers are recyclable. Desktops can be reborn as routers, servers, or art.

>> Plastic casings? Melted into 3D filament or compressed for reuse.

>> @designmiii — visionary content on recycled tech, found on Instagram.

>> Check the video on our site: watch desktops transform into alien relics.

>> Language minds at the frontier: GPT, Claude, Gemini.

>> Gamecraft magic via: Upit Games — pixel worlds built from trash to treasure.

System Note: Stardust anomalies detected. Organic intelligence suspected.

End of log.
`;

    let index = 0;
    function typeMessage() {
      if (index < message.length) {
        consoleEl.textContent += message.charAt(index);
        index++;
        setTimeout(typeMessage, 30);
      }
    }

    typeMessage();

    // Animate shader
    function animate(time) {
      uniforms.time.value = time * 0.001;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
