<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recycled Cosmos - Shader Console</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: 'Courier New', monospace;
      color: #00ff88;
    }
    
    #console {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      color: #00ff88;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border: 1px solid #00ff88;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      backdrop-filter: blur(3px);
      white-space: pre-wrap;
      z-index: 10;
      line-height: 1.4;
    }
    
    #console-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid #00aa55;
      padding-bottom: 5px;
    }
    
    .terminal-title {
      color: #00ffaa;
      font-weight: bold;
    }
    
    .terminal-status {
      color: #ffcc00;
    }
    
    #terminal-time {
      color: #aaffee;
      font-size: 12px;
    }
    
    .highlight {
      color: #ff77aa;
    }
    
    .system {
      color: #ffaa00;
    }
    
    .warning {
      color: #ff5500;
      background: rgba(255, 85, 0, 0.1);
      padding: 2px 4px;
    }
    
    .data {
      color: #aaddff;
    }
    
    .progress-container {
      width: 100%;
      background: rgba(0, 60, 40, 0.5);
      height: 8px;
      margin-top: 5px;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00aa55, #00ffaa);
      transition: width 0.3s ease;
    }
    
    #stats {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #00ff88;
      border-radius: 5px;
      padding: 10px;
      font-size: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }
    
    .stat-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    
    .stat-value {
      margin-left: 20px;
      color: #ffaa00;
    }
    
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="console">
    <div id="console-header">
      <span class="terminal-title">RECYCLED COSMOS v2.1.7</span>
      <span id="terminal-time"></span>
    </div>
    <div id="console-content"></div>
  </div>
  
  <div id="stats">
    <div class="stat-line">
      <span>Anomalies:</span>
      <span class="stat-value" id="anomaly-count">0</span>
    </div>
    <div class="stat-line">
      <span>Cosmic Energy:</span>
      <span class="stat-value" id="energy-level">92%</span>
    </div>
    <div class="stat-line">
      <span>System Status:</span>
      <span class="stat-value" id="system-status">OPTIMAL</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
  <script type="x-shader/x-fragment" id="fragmentShader">
    uniform float time;
    uniform vec2 resolution;
    uniform float intensity;
    uniform vec2 anomalyPositions[5];
    uniform float anomalySizes[5];
    uniform vec3 anomalyColors[5];
    
    // Improved noise function
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    
    float noise(vec2 p) {
      vec2 ip = floor(p);
      vec2 u = fract(p);
      u = u*u*(3.0-2.0*u);
      
      float res = mix(
        mix(hash(dot(ip, vec2(1.0, 157.0))), 
            hash(dot(ip + vec2(1.0, 0.0), vec2(1.0, 157.0))), u.x),
        mix(hash(dot(ip + vec2(0.0, 1.0), vec2(1.0, 157.0))), 
            hash(dot(ip + vec2(1.0, 1.0), vec2(1.0, 157.0))), u.x), 
        u.y);
      return res;
    }
    
    // Fractal Brownian Motion
    float fbm(vec2 p) {
      float f = 0.0;
      float w = 0.5;
      for (int i = 0; i < 5; i++) {
        f += w * noise(p);
        p *= 2.0;
        w *= 0.5;
      }
      return f;
    }
    
    // Star function with twinkling
    float star(vec2 uv, float flare) {
      float d = length(uv);
      float m = 0.05 / d;
      
      float rays = max(0.0, 1.0 - abs(uv.x * uv.y * 1000.0));
      m += rays * flare;
      
      uv *= rotation2d(time * 0.1);
      rays = max(0.0, 1.0 - abs(uv.x * uv.y * 1000.0));
      m += rays * 0.3 * flare;
      
      m *= smoothstep(0.9, 0.2, d);
      return m;
    }
    
    // Rotation matrix
    mat2 rotation2d(float angle) {
      float s = sin(angle);
      float c = cos(angle);
      return mat2(c, -s, s, c);
    }
    
    // Nebula function
    vec3 nebula(vec2 uv) {
      float t = time * 0.05;
      
      // Main cloud layers
      float nebula = fbm(uv * 3.0 + t);
      nebula += fbm(uv * 6.0 - t * 0.5) * 0.5;
      
      // Create color variations
      vec3 nebulaColor = mix(
        mix(vec3(0.5, 0.1, 1.0), vec3(0.1, 0.3, 0.9), uv.x + uv.y),
        mix(vec3(0.1, 0.5, 0.9), vec3(0.1, 0.2, 0.5), fbm(uv * 2.0 + vec2(t))),
        nebula
      );
      
      // Apply intensity to the nebula
      return nebulaColor * nebula * 0.3 * intensity;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / resolution.xy;
      vec2 p = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
      
      // Background gradient
      vec3 bg = mix(
        vec3(0.01, 0.01, 0.02), 
        vec3(0.05, 0.02, 0.1), 
        length(p) * 0.5 + 0.5
      );
      
      // Add subtle nebula to background
      bg += nebula(p + vec2(time * 0.01));
      
      // Starfield with different densities
      float stars = 0.0;
      
      // Small distant stars
      vec2 gridUV = fract(uv * 200.0) - 0.5;
      float smallStar = length(gridUV);
      smallStar = 0.03 / smallStar;
      smallStar *= step(0.985, noise(floor(uv * 200.0) + time * 0.01));
      smallStar *= smoothstep(0.5, 0.9, noise(floor(uv * 200.0) + time * 0.05));
      
      // Medium stars with twinkling
      vec2 gridUV2 = fract(uv * 100.0) - 0.5;
      float medStar = star(gridUV2, 0.25);
      medStar *= step(0.97, noise(floor(uv * 100.0)));
      medStar *= smoothstep(0.3, 0.9, noise(floor(uv * 100.0) + time * 0.1));
      
      // Few bright stars with flare
      vec2 gridUV3 = fract(uv * 40.0) - 0.5;
      float bigStar = star(gridUV3, 0.8);
      bigStar *= step(0.98, noise(floor(uv * 40.0)));
      bigStar *= smoothstep(0.4, 0.9, noise(floor(uv * 40.0) + time * 0.05));
      
      stars = smallStar + medStar + bigStar;
      
      // Anomalies
      vec3 anomalyEffect = vec3(0.0);
      for (int i = 0; i < 5; i++) {
        vec2 anomalyPos = anomalyPositions[i];
        float anomalySize = anomalySizes[i];
        vec3 anomalyColor = anomalyColors[i];
        
        float dist = length(p - anomalyPos);
        
        // Core of anomaly
        float core = smoothstep(anomalySize, anomalySize * 0.5, dist);
        
        // Outer ripple effect
        float ripple = sin(dist * 20.0 - time * 2.0) * 0.5 + 0.5;
        ripple *= smoothstep(anomalySize * 2.0, anomalySize, dist);
        
        // Cosmic energy rays
        float rays = 0.0;
        vec2 rotUV = (p - anomalyPos) * rotation2d(time * 0.2);
        rays = 0.02 / abs(sin(atan(rotUV.y, rotUV.x) * 8.0) * length(rotUV));
        rays *= smoothstep(anomalySize * 2.0, anomalySize * 0.8, dist);
        
        // Combine anomaly effects
        anomalyEffect += anomalyColor * (core * 0.7 + ripple * 0.3 + rays * 0.2);
      }
      
      // Combine all elements
      vec3 finalColor = bg + vec3(stars) + anomalyEffect;
      
      // Tone mapping and gamma correction
      finalColor = finalColor / (1.0 + finalColor);
      finalColor = pow(finalColor, vec3(0.4545));
      
      gl_FragColor = vec4(finalColor, 1.0);
    }
  </script>
  <script>
    // Enhanced terminal functionality
    const consoleContent = document.getElementById("console-content");
    const terminalTime = document.getElementById("terminal-time");
    const anomalyCount = document.getElementById("anomaly-count");
    const energyLevel = document.getElementById("energy-level");
    const systemStatus = document.getElementById("system-status");
    
    // Update terminal time
    function updateTime() {
      const now = new Date();
      terminalTime.textContent = now.toLocaleTimeString() + "." + now.getMilliseconds().toString().padStart(3, '0');
      requestAnimationFrame(updateTime);
    }
    updateTime();
    
    // Typing effect with support for styled text
    function typeMessage(message, callback) {
      return new Promise(resolve => {
        let i = 0;
        const typing = setInterval(() => {
          if (i < message.length) {
            consoleContent.innerHTML += message[i];
            i++;
          } else {
            clearInterval(typing);
            if (callback) callback();
            resolve();
          }
        }, 20);
      });
    }
    
    // Add progress bar
    function addProgressBar(id, duration) {
      const progressContainer = document.createElement('div');
      progressContainer.className = 'progress-container';
      const progressBar = document.createElement('div');
      progressBar.className = 'progress-bar';
      progressBar.id = id;
      progressContainer.appendChild(progressBar);
      consoleContent.appendChild(progressContainer);
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += (100 / (duration / 50));
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
        }
        progressBar.style.width = progress + '%';
      }, 50);
      
      return new Promise(resolve => {
        setTimeout(resolve, duration);
      });
    }
    
    // Console messages sequence
    async function runConsoleSequence() {
      await typeMessage('<span class="terminal-title">Initializing Recycled Cosmos Systems...</span>\n\n');
      await typeMessage('>> Loading multidimensional rendering engine... ');
      await typeMessage('<span class="highlight">COMPLETE</span>\n');
      
      await typeMessage('>> Connecting to cosmic database... ');
      await addProgressBar('db-progress', 1200);
      await typeMessage('<span class="highlight">CONNECTED</span>\n\n');
      
      await typeMessage('<span class="system">SYSTEM: Recycling protocols activated</span>\n');
      await typeMessage('>> <span class="data">Computers are recyclable. Desktops reborn as routers, servers, or art.</span>\n');
      await typeMessage('>> <span class="data">Plastic casings melted into 3D filament or compressed for reuse.</span>\n');
      
      await typeMessage('\n<span class="system">SCANNING COSMIC ANOMALIES...</span>\n');
      await addProgressBar('scan-progress', 1500);
      
      await typeMessage('\n>> <span class="highlight">@designmiii</span> — visionary content on recycled tech found on Instagram.\n');
      await typeMessage('>> Check the video on our site: watch desktops transform into <span class="highlight">alien relics</span>.\n');
      
      await typeMessage('\n<span class="system">SYSTEM: Initiating quantum observation protocols</span>\n');
      await typeMessage('>> Language minds at the frontier: <span class="data">GPT, Claude, Gemini</span>.\n');
      await typeMessage('>> Gamecraft magic via: <span class="highlight">Upit Games</span> — pixel worlds built from trash to treasure.\n\n');
      
      await typeMessage('<span class="warning">⚠ WARNING: Stardust anomalies detected. Organic intelligence suspected.</span>\n');
      await typeMessage('<span class="warning">⚠ Anomaly signature analysis indicates non-human patterns.</span>\n\n');
      
      // Loop messages to create ongoing effect
      setInterval(async () => {
        const messages = [
          '<span class="system">SYSTEM: Monitoring quantum fluctuations in sector 7...</span>\n',
          '<span class="data">Recycling efficiency at 94.3%</span>\n',
          '<span class="warning">Minor anomaly detected in quadrant 3</span>\n',
          '<span class="highlight">Energy signature indicates artificial origin</span>\n',
          '<span class="system">SYSTEM: Cosmic debris collection rate: optimal</span>\n'
        ];
        
        // Pick random message
        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        await typeMessage(randomMessage);
        
        // Update stats occasionally
        const newAnomalyCount = Math.floor(Math.random() * 5) + parseInt(anomalyCount.textContent);
        anomalyCount.textContent = newAnomalyCount;
        
        const newEnergy = Math.floor(85 + Math.random() * 15);
        energyLevel.textContent = newEnergy + '%';
        
        if (newEnergy < 90) {
          systemStatus.textContent = 'STABLE';
          systemStatus.style.color = '#ffaa00';
        } else {
          systemStatus.textContent = 'OPTIMAL';
          systemStatus.style.color = '#00ffaa';
        }
        
        // Keep scroll at bottom
        consoleContent.scrollTop = consoleContent.scrollHeight;
        
        // Remove old messages if too long
        if (consoleContent.childNodes.length > 30) {
          consoleContent.removeChild(consoleContent.childNodes[0]);
        }
      }, 5000);
    }
    
    // Enhanced Three.js setup
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    // Generate random anomalies
    const anomalyCount = 5;
    const anomalyPositions = [];
    const anomalySizes = [];
    const anomalyColors = [];
    
    for (let i = 0; i < anomalyCount; i++) {
      // Random position but not too close to edges
      const x = (Math.random() * 1.6 - 0.8) * 0.8;
      const y = (Math.random() * 1.6 - 0.8) * 0.8;
      anomalyPositions.push(new THREE.Vector2(x, y));
      
      // Random size
      anomalySizes.push(0.05 + Math.random() * 0.15);
      
      // Random color
      const hue = Math.random();
      const color = new THREE.Color().setHSL(hue, 0.8, 0.6);
      anomalyColors.push(new THREE.Vector3(color.r, color.g, color.b));
    }
    
    // Enhanced uniforms
    const uniforms = {
      time: { value: 0.0 },
      resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      intensity: { value: 1.0 },
      anomalyPositions: { value: anomalyPositions },
      anomalySizes: { value: anomalySizes },
      anomalyColors: { value: anomalyColors }
    };
    
    // Create shader material
    const material = new THREE.ShaderMaterial({
      fragmentShader: document.getElementById("fragmentShader").textContent,
      uniforms: uniforms
    });
    
    // Create mesh
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);
    
    // Handle window resize
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
    });
    
    // Animation loop
    function animate(time) {
      uniforms.time.value = time * 0.001;
      
      // Pulse the intensity
      uniforms.intensity.value = 1.0 + 0.2 * Math.sin(time * 0.0005);
      
      // Slowly move anomalies
      for (let i = 0; i < anomalyCount; i++) {
        const t = time * 0.0001 + i * 1.5;
        const x = anomalyPositions[i].x + Math.sin(t) * 0.0005;
        const y = anomalyPositions[i].y + Math.cos(t * 1.3) * 0.0005;
        uniforms.anomalyPositions.value[i].set(x, y);
        
        // Pulse size
        const basePulse = Math.sin(time * 0.001 + i * 0.7) * 0.1;
        uniforms.anomalySizes.value[i] = anomalySizes[i] * (1.0 + basePulse * 0.2);
      }
      
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    
    // Start everything
    runConsoleSequence();
    animate(0);
  </script>
</body>
</html>
