<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Piano</title>
</head>
<body>

<div id="piano-container">
    <div class="piano-header">
        <h1>🎹 Ultimate Piano Studio</h1>
        <div class="status-bar">
            <span id="note-display">♪ Play a note ♪</span>
            <span id="chord-display">Chord: ---</span>
        </div>
    </div>
    
    <div class="control-panel">
        <div class="control-group">
            <label>Instrument</label>
            <select id="instrument-select">
                <option value="piano">Grand Piano</option>
                <option value="electric">Electric Piano</option>
                <option value="organ">Church Organ</option>
                <option value="synth">Analog Synth</option>
                <option value="bells">Crystal Bells</option>
                <option value="pad">Ambient Pad</option>
                <option value="strings">Strings</option>
                <option value="brass">Brass</option>
                <option value="guitar">Guitar</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Octave: <span id="octave-display">4</span></label>
            <input type="range" id="octave-slider" min="0" max="8" value="4" step="1">
        </div>
        
        <div class="control-group">
            <label>Reverb</label>
            <input type="range" id="reverb-slider" min="0" max="100" value="20">
        </div>
        
        <div class="control-group">
            <label>Volume</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70">
        </div>
        
        <div class="control-group">
            <button id="sustain-btn" class="sustain-btn">Sustain OFF</button>
            <button id="record-btn" class="record-btn">● REC</button>
        </div>

        <div class="control-group">
            <label>Arpeggiator</label>
            <button id="arp-btn" class="control-btn">OFF</button>
            <input type="range" id="arp-speed-slider" min="50" max="500" value="150">
        </div>

        <div class="control-group">
            <label>Metronome</label>
            <button id="metro-btn" class="control-btn">OFF</button>
            <input type="range" id="metro-tempo-slider" min="60" max="180" value="120">
        </div>

        <div class="control-group">
            <label>Theme</label>
            <button id="theme-btn" class="control-btn">Light</button>
        </div>

        <div class="control-group">
            <label>Panic</label>
            <button id="panic-btn" class="control-btn">STOP ALL</button>
        </div>

        <div class="control-group">
            <label>AI</label>
            <button id="inspire-btn" class="control-btn">Inspire Me</button>
        </div>

        <div class="control-group">
            <label>Automated Song</label>
            <button id="automated-song-btn" class="control-btn">Play</button>
        </div>

        <div class="control-group">
            <label>Song</label>
            <select id="song-select">
                <option value="0">Song 1</option>
                <option value="1">Song 2</option>
                <option value="2">Song 3</option>
            </select>
        </div>

        <div class="control-group">
            <label>Loop</label>
            <button id="loop-btn" class="control-btn">OFF</button>
        </div>
    </div>
    
    <div class="piano-wrapper">
        <div class="piano-keyboard" id="piano-keyboard"></div>
    </div>
    
    <div class="visual-feedback">
        <canvas id="visualizer" width="800" height="100"></canvas>
    </div>
    
    <div class="info-panel">
        <p><strong>Controls:</strong> Q-P keys for white notes, 2-0 for black notes | Space: Sustain | R: Record</p>
        <p id="performance-stats">Polyphony: 0 voices active</p>
        <div id="key-mapping"></div>
    </div>
</div>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 50%, #2d2d2d 100%);
    min-height: 100vh;
    color: white;
    overflow-x: auto;
}

#piano-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.piano-header {
    text-align: center;
    margin-bottom: 20px;
}

.piano-header h1 {
    font-size: 2.5rem;
    background: linear-gradient(45deg, #ffd700, #ffed4a, #f39c12);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 20px;
    border-radius: 25px;
    backdrop-filter: blur(10px);
}

.control-panel {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.control-group label {
    font-size: 0.9rem;
    font-weight: 600;
    color: #ccc;
}

select, input[type="range"] {
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    outline: none;
}

.sustain-btn, .record-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}

.sustain-btn {
    background: #2ecc71;
    color: white;
}

.sustain-btn.active {
    background: #e74c3c;
}

.record-btn {
    background: #e74c3c;
    color: white;
}

.record-btn.recording {
    animation: pulse 1s infinite;
}

.control-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    background: #3498db;
    color: white;
}

.control-btn.active {
    background: #e74c3c;
}

    0%, 100% { opacity: 1; }

}

.piano-wrapper {

}

.piano-keyboard {
    position: relative;

    justify-content: center;
    height: 220px;
    background: #1a1a1a;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);

}

.key {
    position: relative;
    cursor: pointer;
    transition: all 0.05s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    padding-bottom: 8px;
    transform-origin: bottom;
}

.white-key {
    width: 48px;
    height: 180px;
    background: linear-gradient(to bottom, #ffffff 0%, #f8f8f8 100%);
    border: 1px solid #ddd;
    border-radius: 0 0 8px 8px;
    color: #666;
    margin: 0 1px;
    z-index: 1;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.black-key {
    width: 28px;
    height: 120px;
    background: linear-gradient(to bottom, #2c2c2c 0%, #1a1a1a 100%);
    border: 1px solid #000;
    border-radius: 0 0 6px 6px;
    color: #ccc;
    position: absolute;
    z-index: 2;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
}

.key:hover {
    transform: scale(1.02) translateY(2px);
    filter: brightness(1.1);
}

.key.active {
    transform: scale(0.98) translateY(6px);

}

.white-key.active {
    background: linear-gradient(to bottom, #e0e0e0 0%, #d0d0d0 100%);
}

.black-key.active {
    background: linear-gradient(to bottom, #1a1a1a 0%, #0d0d0d 100%);
}

.visual-feedback {
    margin: 20px 0;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    padding: 10px;
}

#visualizer {
    width: 100%;
    height: 100px;
    border-radius: 8px;
}

.info-panel {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    line-height: 1.5;
}

.note-particle {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
    font-weight: bold;
    animation: float-up 2s ease-out forwards;
}

@keyframes float-up {
    0% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
    }
    100% { 
        opacity: 0; 
        transform: translateY(-100px) scale(1.5); 
    }
}

@media (max-width: 768px) {
    .control-panel { flex-direction: column; gap: 10px; }
    .white-key { width: 35px; height: 140px; }
    .black-key { width: 22px; height: 90px; }
    .piano-header h1 { font-size: 1.8rem; }
    .status-bar { flex-direction: column; gap: 5px; }
}

#key-mapping {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.key-mapping-item {

    margin: 0 10px;

}

.key-mapping-item .key-char {

.light-theme {

}

.light-theme .piano-header h1 {
    background: linear-gradient(45deg, #333, #555, #777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.light-theme .status-bar {
    background: rgba(0, 0, 0, 0.1);
}

.light-theme .control-panel {
    background: rgba(255, 255, 255, 0.3);
}

.light-theme .control-group label {
    color: #333;
}

.light-theme select, .light-theme input[type="range"] {
    background: rgba(0, 0, 0, 0.1);
    color: #333;
}

.light-theme .white-key {
    background: linear-gradient(to bottom, #f8f8f8 0%, #e8e8e8 100%);
    color: #333;
}

.light-theme .black-key {
    background: linear-gradient(to bottom, #555 0%, #333 100%);
    color: #ccc;
}

.light-theme .visual-feedback {
    background: rgba(255, 255, 255, 0.5);
}

.light-theme .info-panel {
    color: #555;
}

</style>

<script>
class UltimatePiano {
    constructor() {
        this.audioContext = null;
        this.masterGain = null;
        this.reverbNode = null;
        this.compressor = null;
        this.activeNotes = new Map();
        this.sustainPedal = false;
        this.sustainedNotes = new Set();
        this.currentOctave = 4;
        this.currentInstrument = 'piano';
        this.recording = false;
        this.recordedNotes = [];
        this.visualizerContext = null;
        this.analyser = null;
        this.dataArray = null;

        this.arpeggiator = { on: false, speed: 150, interval: null, notes: [], index: 0 };
        this.metronome = { on: false, tempo: 120, interval: null };

        this.ai = {
            songs: [
                {
                    melody: [
                        { note: 'C', octave: 5, duration: 0.5 },
                        { note: 'D', octave: 5, duration: 0.5 },
                        { note: 'E', octave: 5, duration: 0.5 },
                        { note: 'C', octave: 5, duration: 0.5 },
                        { note: 'E', octave: 5, duration: 0.5 },
                        { note: 'F', octave: 5, duration: 1 },
                        { note: 'G', octave: 5, duration: 1 },
                    ],
                    chordProgression: ['C', 'G', 'Am', 'F'],
                },
                {
                    melody: [
                        { note: 'G', octave: 4, duration: 0.5 },
                        { note: 'A', octave: 4, duration: 0.5 },
                        { note: 'B', octave: 4, duration: 0.5 },
                        { note: 'G', octave: 4, duration: 0.5 },
                        { note: 'B', octave: 4, duration: 0.5 },
                        { note: 'C', octave: 5, duration: 1 },
                        { note: 'D', octave: 5, duration: 1 },
                    ],
                    chordProgression: ['G', 'D', 'Em', 'C'],
                },
                {
                    melody: [
                        { note: 'E', octave: 5, duration: 0.5 },
                        { note: 'F#', octave: 5, duration: 0.5 },
                        { note: 'G#', octave: 5, duration: 0.5 },
                        { note: 'E', octave: 5, duration: 0.5 },
                        { note: 'G#', octave: 5, duration: 0.5 },
                        { note: 'A', octave: 5, duration: 1 },
                        { note: 'B', octave: 5, duration: 1 },
                    ],
                    chordProgression: ['E', 'B', 'C#m', 'A'],
                },
            ],
            markovChain: {},
        };

        this.currentSong = 0;
        this.loop = false;

        this.noteOrder = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        this.chordLibrary = {
            'Major': [0, 4, 7],
            'Minor': [0, 3, 7],
            'Diminished': [0, 3, 6],
            'Augmented': [0, 4, 8],
            'Major 7th': [0, 4, 7, 11],
            'Minor 7th': [0, 3, 7, 10],
            'Dominant 7th': [0, 4, 7, 10],
        };
        
        this.noteFrequencies = {
            'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13,
            'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G': 392.00,
            'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
        };
        
        this.keyboardMap = {
            'q': 'C', '2': 'C#', 'w': 'D', '3': 'D#', 'e': 'E', 'r': 'F',
            '5': 'F#', 't': 'G', '6': 'G#', 'y': 'A', '7': 'A#', 'u': 'B',
            'i': 'C', '9': 'C#', 'o': 'D', '0': 'D#', 'p': 'E'
        };
        
        this.init();
    }
    
    async init() {
        this.setupAudioContext();
        this.createKeyboard();
        this.setupControls();
        this.setupKeyboardEvents();
        this.setupVisualizer();
        this.startVisualization();
        this.createKeyMapping();
        this.trainMarkovChain();
    }
    
    setupAudioContext() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Master gain
        this.masterGain = this.audioContext.createGain();
        this.masterGain.gain.value = 0.7;
        
        // Compressor
        this.compressor = this.audioContext.createDynamicsCompressor();
        this.compressor.threshold.value = -24;
        this.compressor.knee.value = 30;
        this.compressor.ratio.value = 12;
        this.compressor.attack.value = 0.003;
        this.compressor.release.value = 0.25;
        
        // Reverb (impulse response simulation)
        this.reverbNode = this.audioContext.createConvolver();
        this.createReverbIR();
        
        const reverbGain = this.audioContext.createGain();
        reverbGain.gain.value = 0.2;
        
        // Analyser for visualizer
        this.analyser = this.audioContext.createAnalyser();
        this.analyser.fftSize = 256;
        this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        
        // Connect nodes
        this.masterGain.connect(this.compressor);
        this.compressor.connect(this.analyser);
        this.analyser.connect(this.audioContext.destination);
        
        // Reverb send
        this.masterGain.connect(this.reverbNode);
        this.reverbNode.connect(reverbGain);
        reverbGain.connect(this.compressor);
    }
    
    createReverbIR() {
        const length = this.audioContext.sampleRate * 2;
        const impulse = this.audioContext.createBuffer(2, length, this.audioContext.sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
            const channelData = impulse.getChannelData(channel);
            for (let i = 0; i < length; i++) {
                const decay = Math.pow(1 - i / length, 2);
                channelData[i] = (Math.random() * 2 - 1) * decay * 0.3;
            }
        }
        
        this.reverbNode.buffer = impulse;
    }
    
    createKeyboard() {
        const keyboard = document.getElementById('piano-keyboard');
        const whiteKeys = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const blackKeys = ['C#', 'D#', null, 'F#', 'G#', 'A#', null];
        
        // Create two octaves
        for (let octave = 0; octave < 2; octave++) {
            whiteKeys.forEach((note, index) => {
                const key = this.createKey(note, 'white-key', octave);
                keyboard.appendChild(key);
            });
        }
        
        for (let octave = 0; octave < 2; octave++) {
            blackKeys.forEach((note, index) => {
                if (note) {
                    const key = this.createKey(note, 'black-key', octave);
                    key.style.left = `${(octave * 7 + index) * 49 + 35}px`;
                    keyboard.appendChild(key);
                }
            });
        }
    }
    
    createKey(note, className, octaveOffset = 0) {
        const key = document.createElement('div');
        key.className = `key ${className}`;
        key.dataset.note = note;
        key.dataset.octaveOffset = octaveOffset;
        key.textContent = note;
        
        const events = ['mousedown', 'touchstart'];
        const endEvents = ['mouseup', 'mouseleave', 'touchend'];
        
        events.forEach(event => {
            key.addEventListener(event, (e) => {
                e.preventDefault();
                this.playNote(note, this.currentOctave + octaveOffset);
                this.activateKey(key);
            });
        });
        
        endEvents.forEach(event => {
            key.addEventListener(event, (e) => {
                e.preventDefault();
                this.stopNote(note, this.currentOctave + octaveOffset);
                this.deactivateKey(key);
            });
        });
        
        return key;
    }
    
    playNote(note, octave) {
        if (this.audioContext.state === 'suspended') {
            this.audioContext.resume();
        }

        if (this.arpeggiator.on) {
            const noteKey = `${note}-${octave}`;
            if (!this.arpeggiator.notes.includes(noteKey)) {
                this.arpeggiator.notes.push(noteKey);
            }
            if (!this.arpeggiator.interval) {
                this.startArpeggiator();
            }
            return;
        }
        
        const frequency = this.noteFrequencies[note] * Math.pow(2, octave - 4);
        const noteKey = `${note}-${octave}`;
        
        if (this.activeNotes.has(noteKey)) return;
        
        const voices = this.createVoices(frequency);
        this.activeNotes.set(noteKey, voices);
        
        voices.forEach(voice => {
            voice.oscillator.start();
        });
        
        this.updateDisplay(note, octave);
        this.createNoteParticle(note);
        
        if (this.recording) {
            this.recordedNotes.push({ note, octave, time: Date.now() });
        }
        
        this.updatePolyphonyStats();
        this.detectChord();
    }
    
    createVoices(frequency) {
        const voices = [];
        const now = this.audioContext.currentTime;
        
        // Main voice
        const mainOsc = this.audioContext.createOscillator();
        const mainGain = this.audioContext.createGain();
        const mainFilter = this.audioContext.createBiquadFilter();
        
        this.configureInstrument(mainOsc, mainGain, mainFilter, frequency, true);
        
        mainOsc.connect(mainFilter);
        mainFilter.connect(mainGain);
        mainGain.connect(this.masterGain);
        
        // Attack envelope
        mainGain.gain.setValueAtTime(0, now);
        mainGain.gain.linearRampToValueAtTime(0.8, now + 0.01);
        mainGain.gain.exponentialRampToValueAtTime(0.6, now + 0.1);
        
        voices.push({ oscillator: mainOsc, gain: mainGain, filter: mainFilter });
        
        // Add harmonics for richer sound
        if (this.currentInstrument !== 'bells') {
            const harmonic = this.audioContext.createOscillator();
            const harmonicGain = this.audioContext.createGain();
            
            harmonic.frequency.value = frequency * 2;
            harmonic.type = 'sine';
            harmonicGain.gain.setValueAtTime(0, now);
            harmonicGain.gain.linearRampToValueAtTime(0.15, now + 0.01);
            harmonicGain.gain.exponentialRampToValueAtTime(0.1, now + 0.1);
            
            harmonic.connect(harmonicGain);
            harmonicGain.connect(this.masterGain);
            
            voices.push({ oscillator: harmonic, gain: harmonicGain });
        }
        
        return voices;
    }
    
    configureInstrument(oscillator, gain, filter, frequency, isMain) {
        switch (this.currentInstrument) {
            case 'piano':
                oscillator.type = 'triangle';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 4;
                    filter.Q.value = 1;
                }
                break;
            case 'electric':
                oscillator.type = 'square';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 3;
                    filter.Q.value = 2;
                }
                break;
            case 'organ':
                oscillator.type = 'square';
                if (filter) {
                    filter.type = 'highpass';
                    filter.frequency.value = frequency * 0.5;
                }
                break;
            case 'synth':
                oscillator.type = 'sawtooth';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 6;
                    filter.Q.value = 5;
                }
                break;
            case 'bells':
                oscillator.type = 'sine';
                if (filter) {
                    filter.type = 'bandpass';
                    filter.frequency.value = frequency * 2;
                    filter.Q.value = 10;
                }
                break;
            case 'pad':
                oscillator.type = 'triangle';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 2;
                    filter.Q.value = 0.5;
                }
                break;
            case 'strings':
                oscillator.type = 'sawtooth';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 2;
                    filter.Q.value = 0.5;
                }
                break;
            case 'brass':
                oscillator.type = 'square';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 2;
                    filter.Q.value = 2;
                }
                break;
            case 'guitar':
                oscillator.type = 'square';
                if (filter) {
                    filter.type = 'lowpass';
                    filter.frequency.value = frequency * 5;
                    filter.Q.value = 1;
                }
                break;
        }
        
        oscillator.frequency.value = frequency;
    }
    
    stopNote(note, octave) {
        const noteKey = `${note}-${octave}`;

        if (this.arpeggiator.on) {
            this.arpeggiator.notes = this.arpeggiator.notes.filter(n => n !== noteKey);
            if (this.arpeggiator.notes.length === 0) {
                this.stopArpeggiator();
            }
            return;
        }

        const voices = this.activeNotes.get(noteKey);
        
        if (!voices) return;
        
        if (this.sustainPedal) {
            this.sustainedNotes.add(noteKey);
            return;
        }
        
        this.releaseVoices(voices);
        this.activeNotes.delete(noteKey);
        this.updatePolyphonyStats();
        this.detectChord();
    }
    
    releaseVoices(voices) {
        const now = this.audioContext.currentTime;
        
        voices.forEach(voice => {
            const releaseTime = this.currentInstrument === 'bells' ? 2.0 : 0.5;
            voice.gain.gain.exponentialRampToValueAtTime(0.001, now + releaseTime);
            voice.oscillator.stop(now + releaseTime + 0.1);
        });
    }
    
    setupControls() {
        // Instrument selector
        document.getElementById('instrument-select').addEventListener('change', (e) => {
            this.currentInstrument = e.target.value;
        });
        
        // Octave slider
        const octaveSlider = document.getElementById('octave-slider');
        octaveSlider.addEventListener('input', (e) => {
            this.currentOctave = parseInt(e.target.value);
            document.getElementById('octave-display').textContent = this.currentOctave;
        });
        
        // Reverb control
        document.getElementById('reverb-slider').addEventListener('input', (e) => {
            const reverbGain = this.audioContext.createGain();
            reverbGain.gain.value = e.target.value / 500;
        });
        
        // Volume control
        document.getElementById('volume-slider').addEventListener('input', (e) => {
            this.masterGain.gain.value = e.target.value / 100;
        });
        
        // Sustain pedal
        document.getElementById('sustain-btn').addEventListener('click', (e) => {
            this.sustainPedal = !this.sustainPedal;
            e.target.textContent = `Sustain ${this.sustainPedal ? 'ON' : 'OFF'}`;
            e.target.classList.toggle('active', this.sustainPedal);
            
            if (!this.sustainPedal) {
                this.sustainedNotes.forEach(noteKey => {
                    const voices = this.activeNotes.get(noteKey);
                    if (voices) {
                        this.releaseVoices(voices);
                        this.activeNotes.delete(noteKey);
                    }
                });
                this.sustainedNotes.clear();
                this.updatePolyphonyStats();
            }
        });
        
        // Record button
        document.getElementById('record-btn').addEventListener('click', (e) => {
            this.recording = !this.recording;
            e.target.classList.toggle('recording', this.recording);
            
            if (this.recording) {
                this.recordedNotes = [];
                e.target.textContent = '⏹ STOP';
            } else {
                e.target.textContent = '● REC';
                if (this.recordedNotes.length > 0) {
                    this.playbackRecording();
                }
            }
        });

        // Arpeggiator button
        document.getElementById('arp-btn').addEventListener('click', (e) => {
            this.arpeggiator.on = !this.arpeggiator.on;
            e.target.textContent = this.arpeggiator.on ? 'ON' : 'OFF';
            e.target.classList.toggle('active', this.arpeggiator.on);
            if (!this.arpeggiator.on) {
                this.stopArpeggiator();
            }
        });

        // Arpeggiator speed
        document.getElementById('arp-speed-slider').addEventListener('input', (e) => {
            this.arpeggiator.speed = parseInt(e.target.value);
            if (this.arpeggiator.interval) {
                this.stopArpeggiator();
                this.startArpeggiator();
            }
        });

        // Metronome button
        document.getElementById('metro-btn').addEventListener('click', (e) => {
            this.metronome.on = !this.metronome.on;
            e.target.textContent = this.metronome.on ? 'ON' : 'OFF';
            e.target.classList.toggle('active', this.metronome.on);
            if (this.metronome.on) {
                this.startMetronome();
            } else {
                this.stopMetronome();
            }
        });

        // Metronome tempo
        document.getElementById('metro-tempo-slider').addEventListener('input', (e) => {
            this.metronome.tempo = parseInt(e.target.value);
            if (this.metronome.interval) {
                this.stopMetronome();
                this.startMetronome();
            }
        });

        // Theme button
        document.getElementById('theme-btn').addEventListener('click', (e) => {
            document.body.classList.toggle('light-theme');
            e.target.textContent = document.body.classList.contains('light-theme') ? 'Dark' : 'Light';
        });

        // Panic button
        document.getElementById('panic-btn').addEventListener('click', () => {
            this.panic();
        });

        // Inspire Me button
        document.getElementById('inspire-btn').addEventListener('click', () => {
            this.inspireMe();
        });

        // Automated Song button
        document.getElementById('automated-song-btn').addEventListener('click', () => {
            this.playAutomatedSong();
        });

        // Song select
        document.getElementById('song-select').addEventListener('change', (e) => {
            this.currentSong = parseInt(e.target.value);
        });

        // Loop button
        document.getElementById('loop-btn').addEventListener('click', (e) => {
            this.loop = !this.loop;
            e.target.textContent = this.loop ? 'ON' : 'OFF';
            e.target.classList.toggle('active', this.loop);
        });
    }
    
    setupKeyboardEvents() {
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            
            const note = this.keyboardMap[e.key.toLowerCase()];
            if (note) {
                this.playNote(note, this.currentOctave);
                const keyElement = document.querySelector(`[data-note="${note}"][data-octave-offset="0"]`);
                if (keyElement) this.activateKey(keyElement);
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('sustain-btn').click();
            } else if (e.key.toLowerCase() === 'r') {
                document.getElementById('record-btn').click();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            const note = this.keyboardMap[e.key.toLowerCase()];
            if (note) {
                this.stopNote(note, this.currentOctave);
                const keyElement = document.querySelector(`[data-note="${note}"][data-octave-offset="0"]`);
                if (keyElement) this.deactivateKey(keyElement);
            }
        });
    }
    
    setupVisualizer() {
        const canvas = document.getElementById('visualizer');
        this.visualizerContext = canvas.getContext('2d');
    }
    
    startVisualization() {
        const draw = () => {
            requestAnimationFrame(draw);
            
            if (!this.analyser || !this.dataArray) return;
            
            this.analyser.getByteFrequencyData(this.dataArray);
            
            const canvas = document.getElementById('visualizer');
            const ctx = this.visualizerContext;
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.fillStyle = 'rgba(12, 12, 12, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            const barWidth = width / this.dataArray.length * 2;
            let x = 0;
            
            for (let i = 0; i < this.dataArray.length; i++) {
                const barHeight = (this.dataArray[i] / 255) * height * 0.8;
                
                const hue = (i / this.dataArray.length) * 360;
                ctx.fillStyle = `hsla(${hue}, 70%, 60%, 0.8)`;
                
                ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        };
        
        draw();
    }
    
    activateKey(keyElement) {
        keyElement.classList.add('active');
    }
    
    deactivateKey(keyElement) {
        keyElement.classList.remove('active');
    }
    
    updateDisplay(note, octave) {
        document.getElementById('note-display').textContent = `${note}${octave}`;
    }
    
    updatePolyphonyStats() {
        document.getElementById('performance-stats').textContent = 
            `Polyphony: ${this.activeNotes.size} voices active`;
    }

    detectChord() {
        const notes = Array.from(this.activeNotes.keys()).map(key => key.split('-')[0]);
        const uniqueNotes = [...new Set(notes)];

        if (uniqueNotes.length < 2) {
            document.getElementById('chord-display').textContent = 'Chord: ---';
            return;
        }

        const noteIndexes = uniqueNotes.map(note => this.noteOrder.indexOf(note)).sort((a, b) => a - b);

        for (let i = 0; i < noteIndexes.length; i++) {
            const rootNote = this.noteOrder[noteIndexes[i]];
            const intervals = noteIndexes.map(index => (index - noteIndexes[i] + 12) % 12).sort((a, b) => a - b);

            for (const chordName in this.chordLibrary) {
                const chordIntervals = this.chordLibrary[chordName];
                if (chordIntervals.length === intervals.length && chordIntervals.every((val, index) => val === intervals[index])) {
                    document.getElementById('chord-display').textContent = `Chord: ${rootNote} ${chordName}`;
                    return;
                }
            }
        }

        document.getElementById('chord-display').textContent = 'Chord: ---';
    }

    startArpeggiator() {
        this.arpeggiator.interval = setInterval(() => {
            if (this.arpeggiator.notes.length === 0) return;

            const noteKey = this.arpeggiator.notes[this.arpeggiator.index % this.arpeggiator.notes.length];
            const [note, octave] = noteKey.split('-');

            this.playSingleNote(note, parseInt(octave));

            this.arpeggiator.index++;
        }, this.arpeggiator.speed);
    }

    stopArpeggiator() {
        clearInterval(this.arpeggiator.interval);
        this.arpeggiator.interval = null;
        this.arpeggiator.notes = [];
        this.arpeggiator.index = 0;
    }

    playSingleNote(note, octave) {
        const frequency = this.noteFrequencies[note] * Math.pow(2, octave - 4);
        const voices = this.createVoices(frequency);
        voices.forEach(voice => {
            voice.oscillator.start();
            const releaseTime = this.currentInstrument === 'bells' ? 2.0 : 0.5;
            voice.gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + releaseTime);
            voice.oscillator.stop(this.audioContext.currentTime + releaseTime + 0.1);
        });
        this.updateDisplay(note, octave);
        this.createNoteParticle(note);
    }

    startMetronome() {
        const tempo = 60000 / this.metronome.tempo;
        this.metronome.interval = setInterval(() => this.playMetronomeTick(), tempo);
    }

    stopMetronome() {
        clearInterval(this.metronome.interval);
        this.metronome.interval = null;
    }

    playMetronomeTick() {
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.frequency.value = 1000;
        gain.gain.setValueAtTime(1, this.audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.audioContext.currentTime + 0.05);
    }
    
    createNoteParticle(note) {
        const particle = document.createElement('div');
        particle.className = 'note-particle';
        particle.textContent = note;
        particle.style.left = Math.random() * window.innerWidth + 'px';
        particle.style.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        
        document.body.appendChild(particle);
        
        setTimeout(() => {
            particle.remove();
        }, 2000);
    }
    
    playbackRecording() {
        if (this.recordedNotes.length === 0) return;

        let lastTime = this.recordedNotes[0].time;

        this.recordedNotes.forEach(({ note, octave, time }) => {
            const delay = time - lastTime;
            setTimeout(() => {
                this.playNote(note, octave);
                setTimeout(() => this.stopNote(note, octave), 300);
            }, delay);
            lastTime = time;
        });
    }

    createKeyMapping() {
        const keyMappingContainer = document.getElementById('key-mapping');
        for (const key in this.keyboardMap) {
            const note = this.keyboardMap[key];
            const keyMappingItem = document.createElement('div');
            keyMappingItem.className = 'key-mapping-item';
            keyMappingItem.innerHTML = `<span class="key-char">${key.toUpperCase()}</span><span>${note}</span>`;
            keyMappingContainer.appendChild(keyMappingItem);
        }
    }

    panic() {
        this.activeNotes.forEach((voices, noteKey) => {
            this.releaseVoices(voices);
        });
        this.activeNotes.clear();

        this.sustainedNotes.forEach(noteKey => {
            const voices = this.activeNotes.get(noteKey);
            if (voices) {
                this.releaseVoices(voices);
            }
        });
        this.sustainedNotes.clear();

        this.stopArpeggiator();
        this.stopMetronome();
        this.updatePolyphonyStats();
    }

    trainMarkovChain() {
        for (const song of this.ai.songs) {
            const progression = song.chordProgression;
            for (let i = 0; i < progression.length - 1; i++) {
                const currentChord = progression[i];
                const nextChord = progression[i + 1];
                if (!this.ai.markovChain[currentChord]) {
                    this.ai.markovChain[currentChord] = [];
                }
                this.ai.markovChain[currentChord].push(nextChord);
            }
        }
    }

    generateChordProgression() {
        const chords = Object.keys(this.ai.markovChain);
        let currentChord = chords[Math.floor(Math.random() * chords.length)];
        const progression = [currentChord];
        for (let i = 0; i < 3; i++) {
            const nextChords = this.ai.markovChain[currentChord];
            currentChord = nextChords[Math.floor(Math.random() * nextChords.length)];
            progression.push(currentChord);
        }
        return progression;
    }

    playChordProgression(progression) {
        progression.forEach((chord, index) => {
            setTimeout(() => {
                const notes = this.getNotesInChord(chord, 4);
                notes.forEach(note => {
                    this.playNote(note.note, note.octave);
                    setTimeout(() => this.stopNote(note.note, note.octave), 500);
                });
            }, index * 600);
        });
    }

    getNotesInChord(chord, octave) {
        const rootNote = chord.replace('m', '').replace('#', '');
        const isMinor = chord.includes('m');
        const rootNoteIndex = this.noteOrder.indexOf(rootNote);
        const intervals = isMinor ? this.chordLibrary['Minor'] : this.chordLibrary['Major'];
        const notes = [];
        for (const interval of intervals) {
            const noteIndex = (rootNoteIndex + interval) % 12;
            notes.push({ note: this.noteOrder[noteIndex], octave });
        }
        return notes;
    }

    inspireMe() {
        const progression = this.generateChordProgression();
        this.playChordProgression(progression);
    }

    playAutomatedSong() {
        const song = this.ai.songs[this.currentSong];
        this.playChordProgression(song.chordProgression);

        let time = 0;
        const playNextNote = () => {
            if (!this.loop && time >= song.melody.length) {
                return;
            }
            const note = song.melody[time % song.melody.length];
            this.playNote(note.note, note.octave);
            setTimeout(() => this.stopNote(note.note, note.octave), note.duration * 1000 - 50);
            time++;
            setTimeout(playNextNote, note.duration * 1000);
        };

        playNextNote();
    }
}

// Initialize the piano when the page loads
document.addEventListener('DOMContentLoaded', () => {
    new UltimatePiano();
});
</script>
