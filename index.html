      font-weight: 400;

      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .button:hover::before {
      transform: translateX(100%);
    }

      z-index: 100;

      pointer-events: none;

    @keyframes warpEffect {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.5);
      }
      100% {

      50% {
        filter: drop-shadow(0 0 10px rgba(255, 0, 170, 0.5));
      }
      75% {

      }

      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--secondary);
      opacity: 0.5;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.2;
      }
      100% {

// Ultra-Advanced WebGL 2.0 Shader System
#version 300 es
precision highp float;

uniform float u_time;
uniform vec2 u_resolution;
uniform sampler2D u_previousFrame;
uniform int u_frameCount;
out vec4 fragColor;

// GPU-Computed Fluid Dynamics Parameters
uniform float u_vorticity;
uniform float u_density;
uniform float u_temperature;

// Advanced Noise Library
#define NUM_OCTAVES 8
const mat3 m = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);

float hash(float n) { return fract(sin(n)*1e4); }
float hash(vec2 p) { return fract(1e4*sin(17.0*p.x + p.y*0.1)); }

float simplex(vec3 p) {
    const float K1 = 0.333333333;
    const float K2 = 0.166666667;
    
    vec3 i = floor(p + (p.x + p.y + p.z)*K1);
    vec3 d0 = p - (i - (i.x + i.y + i.z)*K2);
    vec3 e = step(vec3(0.0), d0 - d0.yzx);
    vec3 i1 = e*(1.0 - e.zxy);
    vec3 i2 = 1.0 - e.zxy*(1.0 - e);
    vec3 d1 = d0 - (i1 - 1.0*K2);
    vec3 d2 = d0 - (i2 - 2.0*K2);
    vec3 d3 = d0 - (1.0 - 3.0*K2);
    vec4 h = max(0.6 - vec4(dot(d0,d0), dot(d1,d1), dot(d2,d2), dot(d3,d3)), 0.0);
    vec4 n = h*h*h*h*vec4(dot(d0,hash(i+0.0)), dot(d1,hash(i+i1+0.0)), dot(d2,hash(i+i2+0.0)), dot(d3,hash(i+1.0)));
    return dot(n, vec4(70.0));
}

// Quantum-Inspired Wave Functions
vec3 waveField(vec2 uv) {
    vec3 acc = vec3(0.0);
    for(int i=0; i<6; i++) {
        float fi = float(i);
        vec2 p = uv + vec2(fi*0.1, fi*0.2);
        float t = u_time * (0.5 + 0.5*sin(fi));
        acc += 0.5*sin(2.0*p.x*sin(t) + p.y*cos(t) + t) * 
               vec3(sin(fi*0.7), sin(fi*1.1+2.0), sin(fi*1.3+4.0));
    }
    return normalize(acc);
}

// Fractal Quantum Entanglement Simulation
vec4 quantumState(vec2 uv) {
    vec3 q = vec3(uv, u_time*0.1);
    for(int i=0; i<NUM_OCTAVES; i++) {
        q = abs(q)/dot(q,q) - 0.9;
        q = q*m;
    }
    return vec4(0.5 + 0.5*sin(q*3.0), 1.0);
}

// Hypercomplex Raymarching
float sdfSphere(vec3 p, float r) { return length(p) - r; }

vec2 map(vec3 p) {
    float d = sdfSphere(p, 0.5);
    return vec2(d, 1.0);
}

vec3 calculateNormal(vec3 p) {
    const float eps = 0.001;
    return normalize(vec3(
        map(p + vec3(eps,0,0)).x - map(p - vec3(eps,0,0)).x,
        map(p + vec3(0,eps,0)).x - map(p - vec3(0,eps,0)).x,
        map(p + vec3(0,0,eps)).x - map(p - vec3(0,0,eps)).x
    ));
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5*u_resolution.xy)/u_resolution.y;
    vec3 col = vec3(0.0);
    
    // Quantum Field Rendering
    vec4 qs = quantumState(uv * 2.0);
    vec3 wf = waveField(uv * 3.0);
    
    // Temporal Accumulation Anti-Aliasing
    vec3 prev = texture(u_previousFrame, gl_FragCoord.xy/u_resolution).rgb;
    
    // Hyperdimensional Raymarching
    vec3 ro = vec3(0,0,3);
    vec3 rd = normalize(vec3(uv, -1));
    float t = 0.0;
    for(int i=0; i<128; i++) {
        vec3 p = ro + rd*t;
        vec2 d = map(p);
        if(d.x < 0.001 || t > 100.0) break;
        t += d.x;
    }
    
    // Neural Style Transfer-inspired Color Mapping
    vec3 albedo = mix(vec3(0.2,0.5,1.0), vec3(1.0,0.3,0.5), qs.r);
    vec3 normal = calculateNormal(ro + rd*t);
    vec3 lighting = vec3(0.5) + dot(normal, normalize(vec3(1)))*0.5;
    
    // Fluid Dynamics Integration
    float vort = u_vorticity * simplex(vec3(uv*10.0, u_time));
    vec2 fluidUV = uv + vort * 0.1 * vec2(sin(u_time), cos(u_time));
    
    // Multi-Domain Compositing
    col = mix(
        qs.rgb * wf,
        albedo * lighting,
        smoothstep(0.0, 1.0, length(uv))
    );
    
    // Quantum Entanglement Effects
    col = mix(col, prev, 0.9);
    
    // HDR Tone Mapping
    col = col / (col + vec3(1.0));
    
    // Temporal Super-Sampling
    if(u_frameCount < 1) {
        fragColor = vec4(col, 1.0);
    } else {
        vec3 avg = mix(prev, col, 1.0/float(u_frameCount+1));
        fragColor = vec4(avg, 1.0);
    }
    
    // Non-Linear Optical Effects
    col *= 0.6 + 0.4*sin(uv.x*u_resolution.x*0.5 + u_time*5.0);
    col = pow(col, vec3(1.0/2.2));
}
