<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Forest Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas {
            display: block;
            cursor: crosshair;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 280px;
        }
        #ui h2 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #7fdb8a;
        }
        #ui p {
            margin: 5px 0;
            opacity: 0.9;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #controls button {
            background: rgba(127, 219, 138, 0.3);
            border: 1px solid rgba(127, 219, 138, 0.5);
            color: #fff;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        #controls button:hover {
            background: rgba(127, 219, 138, 0.5);
            transform: translateY(-2px);
        }
        #controls button.active {
            background: rgba(127, 219, 138, 0.7);
            box-shadow: 0 0 15px rgba(127, 219, 138, 0.5);
        }
        .stat-label {
            color: #7fdb8a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <h2>🌲 Forest Ecosystem</h2>
        <p><span class="stat-label">Time:</span> <span id="timeDisplay">Dawn</span></p>
        <p><span class="stat-label">Trees:</span> <span id="treeCount">0</span></p>
        <p><span class="stat-label">Animals:</span> <span id="animalCount">0</span></p>
        <p><span class="stat-label">Particles:</span> <span id="particleCount">0</span></p>
        <p><span class="stat-label">Weather:</span> <span id="weatherDisplay">Clear</span></p>
        <p><span class="stat-label">Season:</span> <span id="seasonDisplay">Spring</span></p>
        <p style="margin-top: 10px; font-size: 11px; opacity: 0.7;">Click to plant trees • Mouse movement affects wind</p>
    </div>
    
    <div id="controls">
        <button id="rainBtn" onclick="toggleRain()">🌧️ Rain</button>
        <button id="fogBtn" onclick="toggleFog()">🌫️ Fog</button>
        <button id="windBtn" onclick="toggleWind()">💨 Wind</button>
        <button id="seasonBtn" onclick="cycleSeason()">🍂 Season</button>
        <button id="spawnBtn" onclick="spawnAnimal()">🦌 Add Animal</button>
        <button id="resetBtn" onclick="resetForest()">🔄 Reset</button>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Simulation State
        const state = {
            time: 0, // 0-1 (0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk)
            timeSpeed: 0.0001,
            weather: {
                rain: false,
                fog: false,
                wind: 0.5,
                windDirection: 1
            },
            season: 0, // 0=spring, 1=summer, 2=fall, 3=winter
            mouse: { x: canvas.width / 2, y: canvas.height / 2 },
            temperature: 20,
            humidity: 60
        };

        // Color Palettes for different times and seasons
        const palettes = {
            sky: {
                night: ['#0a0a1a', '#1a1a3a', '#0f0f2f'],
                dawn: ['#1a1a3a', '#ff6b6b', '#feca57', '#48dbfb'],
                day: ['#87ceeb', '#b8e6ff', '#e0f4ff'],
                dusk: ['#2d1b4e', '#8b4d8b', '#ff6b6b', '#feca57']
            },
            seasons: {
                spring: { leaf: ['#2d5a27', '#3d7a37', '#4d9a47', '#5dba57'], ground: '#2d4a2d' },
                summer: { leaf: ['#1a4a1a', '#2a6a2a', '#3a8a3a', '#4aaa4a'], ground: '#2a5a2a' },
                fall: { leaf: ['#8b4513', '#cd853f', '#daa520', '#b22222', '#ff6347'], ground: '#4a3a2a' },
                winter: { leaf: ['#3a3a3a', '#5a5a5a', '#7a7a7a'], ground: '#f0f0f0' }
            }
        };

        // Entity Collections
        const trees = [];
        const animals = [];
        const particles = [];
        const fireflies = [];
        const raindrops = [];
        const clouds = [];
        const grass = [];
        const flowers = [];

        // Tree Class
        class Tree {
            constructor(x, groundY, isSapling = false) {
                this.x = x;
                this.groundY = groundY;
                this.baseY = groundY;
                this.height = isSapling ? 30 + Math.random() * 20 : 80 + Math.random() * 120;
                this.maxHeight = isSapling ? 200 : this.height;
                this.trunkWidth = this.height * 0.08;
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swayAmount = 0.02 + Math.random() * 0.02;
                this.type = Math.floor(Math.random() * 4); // 0=oak, 1=pine, 2=birch, 3=willow
                this.branches = this.generateBranches();
                this.leaves = this.generateLeaves();
                this.age = isSapling ? 0 : 1;
                this.growthRate = 0.0001 + Math.random() * 0.0002;
                this.health = 1;
                this.hasFlowers = this.type === 0 && Math.random() > 0.5;
            }

            generateBranches() {
                const branches = [];
                const numBranches = Math.floor(3 + Math.random() * 5);
                for (let i = 0; i < numBranches; i++) {
                    const heightPercent = 0.3 + (i / numBranches) * 0.6;
                    branches.push({
                        heightPercent,
                        length: this.height * (0.2 + Math.random() * 0.3),
                        angle: (Math.random() - 0.5) * Math.PI * 0.8,
                        thickness: this.trunkWidth * (0.3 + Math.random() * 0.3)
                    });
                }
                return branches;
            }

            generateLeaves() {
                const leaves = [];
                const numLeaves = this.type === 1 ? 50 : 80;
                for (let i = 0; i < numLeaves; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * this.height * 0.4;
                    const heightPercent = 0.4 + Math.random() * 0.5;
                    leaves.push({
                        offsetX: Math.cos(angle) * radius,
                        offsetY: -heightPercent * this.height,
                        size: 5 + Math.random() * 10,
                        colorIndex: Math.floor(Math.random() * 4),
                        swayOffset: Math.random() * Math.PI * 2,
                        fallProgress: 0,
                        falling: false
                    });
                }
                return leaves;
            }

            update(deltaTime) {
                // Growth
                if (this.age < 1 && this.height < this.maxHeight) {
                    this.age += this.growthRate * deltaTime;
                    this.height = Math.min(this.maxHeight, this.height * (1 + this.growthRate * deltaTime));
                }

                // Leaf falling in fall/winter
                if (state.season >= 2) {
                    const fallChance = state.season === 2 ? 0.001 : 0.005;
                    this.leaves.forEach(leaf => {
                        if (!leaf.falling && Math.random() < fallChance * deltaTime * 0.1) {
                            leaf.falling = true;
                        }
                        if (leaf.falling) {
                            leaf.fallProgress += 0.01 * deltaTime;
                            if (leaf.fallProgress > 1) {
                                leaf.fallProgress = 0;
                                leaf.falling = false;
                            }
                        }
                    });
                }
            }

            draw(ctx, time) {
                const windSway = Math.sin(time * 0.001 + this.swayOffset) * state.weather.wind * this.swayAmount * this.height;
                
                ctx.save();
                ctx.translate(this.x, this.groundY);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(windSway * 0.3, 5, this.height * 0.3, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Trunk
                const trunkGradient = ctx.createLinearGradient(-this.trunkWidth, 0, this.trunkWidth, 0);
                trunkGradient.addColorStop(0, '#2d1810');
                trunkGradient.addColorStop(0.5, '#5a3a25');
                trunkGradient.addColorStop(1, '#3d2815');
                
                ctx.fillStyle = trunkGradient;
                ctx.beginPath();
                ctx.moveTo(-this.trunkWidth, 0);
                ctx.quadraticCurveTo(-this.trunkWidth * 0.8 + windSway * 0.1, -this.height * 0.5, -this.trunkWidth * 0.3 + windSway * 0.2, -this.height);
                ctx.lineTo(this.trunkWidth * 0.3 + windSway * 0.2, -this.height);
                ctx.quadraticCurveTo(this.trunkWidth * 0.8 + windSway * 0.1, -this.height * 0.5, this.trunkWidth, 0);
                ctx.closePath();
                ctx.fill();

                // Bark texture
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                for (let i = 0; i < this.height; i += 15) {
                    ctx.beginPath();
                    ctx.moveTo(-this.trunkWidth * 0.5 + windSway * (i / this.height) * 0.15, -i);
                    ctx.lineTo(this.trunkWidth * 0.5 + windSway * (i / this.height) * 0.15, -i);
                    ctx.stroke();
                }

                // Branches
                this.branches.forEach(branch => {
                    const branchY = -this.height * branch.heightPercent;
                    const branchSway = windSway * branch.heightPercent * 0.5;
                    
                    ctx.strokeStyle = '#4a3020';
                    ctx.lineWidth = branch.thickness;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(windSway * branch.heightPercent * 0.2, branchY);
                    ctx.quadraticCurveTo(
                        branch.length * 0.5 * Math.cos(branch.angle) + branchSway,
                        branchY + branch.length * 0.3 * Math.sin(branch.angle),
                        branch.length * Math.cos(branch.angle) + branchSway * 2,
                        branchY + branch.length * 0.5 * Math.sin(branch.angle)
                    );
                    ctx.stroke();
                });

                // Leaves
                const seasonPalette = palettes.seasons[['spring', 'summer', 'fall', 'winter'][state.season]].leaf;
                
                this.leaves.forEach(leaf => {
                    if (leaf.falling) return;
                    
                    const leafSway = Math.sin(time * 0.002 + leaf.swayOffset) * 3;
                    const x = leaf.offsetX + windSway * (1 - leaf.offsetY / -this.height) + leafSway;
                    const y = leaf.offsetY;
                    
                    const leafColor = seasonPalette[leaf.colorIndex % seasonPalette.length];
                    
                    ctx.fillStyle = leafColor;
                    ctx.globalAlpha = state.season === 3 ? 0.3 : 0.9;
                    
                    if (this.type === 1) { // Pine needle
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x - leaf.size * 0.3, y + leaf.size);
                        ctx.lineTo(x + leaf.size * 0.3, y + leaf.size);
                        ctx.closePath();
                        ctx.fill();
                    } else { // Regular leaf
                        ctx.beginPath();
                        ctx.ellipse(x, y, leaf.size * 0.6, leaf.size, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                ctx.globalAlpha = 1;

                // Flowers in spring
                if (this.hasFlowers && state.season === 0 && this.age > 0.5) {
                    const flowerLeaves = this.leaves.slice(0, 10);
                    flowerLeaves.forEach(leaf => {
                        const x = leaf.offsetX + windSway * 0.8;
                        const y = leaf.offsetY;
                        ctx.fillStyle = ['#ffb6c1', '#ffc0cb', '#fff0f5', '#ffe4e1'][Math.floor(Math.random() * 4)];
                        ctx.beginPath();
                        for (let p = 0; p < 5; p++) {
                            const angle = (p / 5) * Math.PI * 2;
                            ctx.ellipse(
                                x + Math.cos(angle) * 3,
                                y + Math.sin(angle) * 3,
                                3, 3, angle, 0, Math.PI * 2
                            );
                        }
                        ctx.fill();
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                ctx.restore();
            }
        }

        // Animal Class
        class Animal {
            constructor(x, y, type = 'deer') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.state = 'idle';
                this.stateTime = 0;
                this.targetX = x;
                this.targetY = y;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.animationFrame = 0;
                this.animationSpeed = 0.1;
                this.size = type === 'deer' ? 30 : type === 'rabbit' ? 12 : type === 'bird' ? 8 : 15;
                this.speed = type === 'deer' ? 1.5 : type === 'rabbit' ? 2 : type === 'bird' ? 3 : 1;
                this.jumpForce = 0;
                this.grounded = true;
                this.fearLevel = 0;
                this.wingFlap = 0;
            }

            update(deltaTime, trees) {
                this.stateTime += deltaTime;
                this.animationFrame += this.animationSpeed * deltaTime;

                // State machine
                if (this.state === 'idle') {
                    if (this.stateTime > 2000 + Math.random() * 3000) {
                        this.state = Math.random() > 0.5 ? 'walking' : 'eating';
                        this.stateTime = 0;
                        if (this.state === 'walking') {
                            this.targetX = this.x + (Math.random() - 0.5) * 400;
                            this.direction = this.targetX > this.x ? 1 : -1;
                        }
                    }
                } else if (this.state === 'walking') {
                    const dx = this.targetX - this.x;
                    if (Math.abs(dx) < 5) {
                        this.state = 'idle';
                        this.stateTime = 0;
                    } else {
                        this.x += Math.sign(dx) * this.speed * deltaTime * 0.1;
                    }
                } else if (this.state === 'eating') {
                    if (this.stateTime > 3000) {
                        this.state = 'idle';
                        this.stateTime = 0;
                    }
                }

                // Flee from mouse if close
                const distToMouse = Math.hypot(state.mouse.x - this.x, state.mouse.y - this.y);
                if (distToMouse < 100) {
                    this.fearLevel = 1;
                    this.state = 'fleeing';
                    this.targetX = this.x + (this.x - state.mouse.x) * 2;
                    this.direction = this.targetX > this.x ? 1 : -1;
                } else {
                    this.fearLevel *= 0.95;
                }

                if (this.state === 'fleeing') {
                    const dx = this.targetX - this.x;
                    this.x += Math.sign(dx) * this.speed * 2 * deltaTime * 0.1;
                    if (Math.abs(dx) < 5 || this.fearLevel < 0.1) {
                        this.state = 'idle';
                        this.stateTime = 0;
                    }
                }

                // Physics for birds
                if (this.type === 'bird') {
                    this.wingFlap += 0.3 * deltaTime;
                    this.y += Math.sin(this.wingFlap) * 0.5;
                    if (this.state === 'walking') {
                        this.y = Math.min(this.y, canvas.height * 0.4);
                    }
                }

                // Keep in bounds
                this.x = Math.max(50, Math.min(canvas.width - 50, this.x));
                this.y = Math.max(canvas.height * 0.4, Math.min(canvas.height * 0.85, this.y));
            }

            draw(ctx, time) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);

                const bounce = Math.sin(this.animationFrame * 0.3) * 3;
                const isMoving = this.state === 'walking' || this.state === 'fleeing';

                if (this.type === 'deer') {
                    // Body
                    ctx.fillStyle = '#8b6914';
                    ctx.beginPath();
                    ctx.ellipse(0, -this.size * 0.5 + (isMoving ? bounce : 0), this.size * 1.2, this.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Legs
                    ctx.strokeStyle = '#6b4914';
                    ctx.lineWidth = 4;
                    const legOffset = isMoving ? Math.sin(this.animationFrame * 0.5) * 10 : 0;
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.5, -this.size * 0.2);
                    ctx.lineTo(-this.size * 0.5 + legOffset, this.size * 0.3);
                    ctx.moveTo(this.size * 0.5, -this.size * 0.2);
                    ctx.lineTo(this.size * 0.5 - legOffset, this.size * 0.3);
                    ctx.stroke();

                    // Head
                    ctx.fillStyle = '#8b6914';
                    ctx.beginPath();
                    ctx.ellipse(this.size * 0.9, -this.size * 0.7 + (this.state === 'eating' ? 10 : 0), this.size * 0.4, this.size * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Antlers
                    ctx.strokeStyle = '#5a4020';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.size * 0.8, -this.size * 0.9);
                    ctx.lineTo(this.size * 0.6, -this.size * 1.3);
                    ctx.lineTo(this.size * 0.4, -this.size * 1.1);
                    ctx.moveTo(this.size * 1, -this.size * 0.9);
                    ctx.lineTo(this.size * 1.2, -this.size * 1.3);
                    ctx.lineTo(this.size * 1.4, -this.size * 1.1);
                    ctx.stroke();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(this.size * 1.1, -this.size * 0.7, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#f5f5dc';
                    ctx.beginPath();
                    ctx.ellipse(-this.size * 1.1, -this.size * 0.5, 6, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'rabbit') {
                    // Body
                    ctx.fillStyle = '#d4a574';
                    ctx.beginPath();
                    ctx.ellipse(0, -this.size * 0.3 + (isMoving ? bounce * 0.5 : 0), this.size * 0.8, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Ears
                    ctx.fillStyle = '#d4a574';
                    ctx.beginPath();
                    ctx.ellipse(this.size * 0.2, -this.size * 1.2, 4, 12, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(-this.size * 0.2, -this.size * 1.2, 4, 12, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner ears
                    ctx.fillStyle = '#ffb6c1';
                    ctx.beginPath();
                    ctx.ellipse(this.size * 0.2, -this.size * 1.2, 2, 8, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(-this.size * 0.2, -this.size * 1.2, 2, 8, 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Head
                    ctx.fillStyle = '#d4a574';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.5, -this.size * 0.5, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.7, -this.size * 0.5, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-this.size * 0.7, -this.size * 0.3, 5, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'bird') {
                    // Body
                    ctx.fillStyle = '#4169e1';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.8, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Wings
                    const wingAngle = Math.sin(this.wingFlap) * 0.5;
                    ctx.fillStyle = '#3159c1';
                    ctx.save();
                    ctx.rotate(wingAngle);
                    ctx.beginPath();
                    ctx.ellipse(0, -this.size * 0.3, this.size * 0.6, this.size * 0.2, -0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Head
                    ctx.fillStyle = '#4169e1';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.5, -this.size * 0.1, this.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();

                    // Beak
                    ctx.fillStyle = '#ffa500';
                    ctx.beginPath();
                    ctx.moveTo(this.size * 0.8, -this.size * 0.1);
                    ctx.lineTo(this.size * 1.2, 0);
                    ctx.lineTo(this.size * 0.8, this.size * 0.1);
                    ctx.closePath();
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.6, -this.size * 0.15, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#3159c1';
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.5, 0);
                    ctx.lineTo(-this.size * 1.2, -this.size * 0.2);
                    ctx.lineTo(-this.size * 1.2, this.size * 0.2);
                    ctx.closePath();
                    ctx.fill();

                } else if (this.type === 'fox') {
                    // Body
                    ctx.fillStyle = '#d2691e';
                    ctx.beginPath();
                    ctx.ellipse(0, -this.size * 0.4 + (isMoving ? bounce : 0), this.size * 1.1, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Legs
                    ctx.strokeStyle = '#b2590e';
                    ctx.lineWidth = 3;
                    const legOff = isMoving ? Math.sin(this.animationFrame * 0.5) * 8 : 0;
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.4, -this.size * 0.1);
                    ctx.lineTo(-this.size * 0.4 + legOff, this.size * 0.25);
                    ctx.moveTo(this.size * 0.4, -this.size * 0.1);
                    ctx.lineTo(this.size * 0.4 - legOff, this.size * 0.25);
                    ctx.stroke();

                    // Head
                    ctx.fillStyle = '#d2691e';
                    ctx.beginPath();
                    ctx.ellipse(this.size * 0.8, -this.size * 0.6, this.size * 0.45, this.size * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Snout
                    ctx.fillStyle = '#f5deb3';
                    ctx.beginPath();
                    ctx.ellipse(this.size * 1.1, -this.size * 0.5, this.size * 0.2, this.size * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Ears
                    ctx.fillStyle = '#d2691e';
                    ctx.beginPath();
                    ctx.moveTo(this.size * 0.6, -this.size * 0.8);
                    ctx.lineTo(this.size * 0.5, -this.size * 1.2);
                    ctx.lineTo(this.size * 0.8, -this.size * 0.9);
                    ctx.closePath();
                    ctx.fill();

                    // Eye
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(this.size * 0.95, -this.size * 0.65, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Tail
                    ctx.fillStyle = '#d2691e';
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.8, -this.size * 0.4);
                    ctx.quadraticCurveTo(-this.size * 1.5, -this.size * 0.8, -this.size * 1.3, -this.size * 0.2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-this.size * 1.3, -this.size * 0.3, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Particle Class (for leaves, pollen, etc.)
        class Particle {
            constructor(x, y, type = 'leaf') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2 + 1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.size = type === 'leaf' ? 8 + Math.random() * 8 : 3 + Math.random() * 3;
                this.color = palettes.seasons[['spring', 'summer', 'fall', 'winter'][state.season]].leaf[Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.002;
            }

            update(deltaTime) {
                const windEffect = state.weather.wind * state.weather.windDirection * 3;
                this.vx += windEffect * 0.01;
                this.x += this.vx * deltaTime * 0.1;
                this.y += this.vy * deltaTime * 0.1;
                this.rotation += this.rotationSpeed * deltaTime * 0.1;
                this.vx *= 0.99;
                this.vy *= 0.99;

                if (this.y > canvas.height * 0.9) {
                    this.life -= 0.02;
                }

                return this.life > 0 && this.y < canvas.height;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;

                if (this.type === 'leaf') {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Firefly Class
        class Firefly {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height * 0.4 + Math.random() * canvas.height * 0.4;
                this.targetX = this.x;
                this.targetY = this.y;
                this.brightness = 0;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.3 + Math.random() * 0.3;
                this.size = 2 + Math.random() * 2;
            }

            update(deltaTime, time) {
                // Glow phase
                this.brightness = (Math.sin(time * 0.003 + this.phase) + 1) / 2;

                // Movement
                if (Math.random() < 0.01) {
                    this.targetX = Math.random() * canvas.width;
                    this.targetY = canvas.height * 0.4 + Math.random() * canvas.height * 0.4;
                }

                this.x += (this.targetX - this.x) * 0.01;
                this.y += (this.targetY - this.y) * 0.01;
            }

            draw(ctx) {
                const glow = this.brightness;
                
                // Outer glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 8);
                gradient.addColorStop(0, `rgba(255, 255, 150, ${glow * 0.8})`);
                gradient.addColorStop(0.5, `rgba(255, 255, 100, ${glow * 0.3})`);
                gradient.addColorStop(1, 'rgba(255, 255, 100, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 8, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `rgba(255, 255, 200, ${glow})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Raindrop Class
        class Raindrop {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.length = 10 + Math.random() * 20;
                this.speed = 15 + Math.random() * 10;
                this.wind = state.weather.wind * state.weather.windDirection * 2;
            }

            update(deltaTime) {
                this.y += this.speed * deltaTime * 0.1;
                this.x += this.wind * deltaTime * 0.1;

                if (this.y > canvas.height) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.wind, this.y + this.length);
                ctx.stroke();
            }
        }

        // Cloud Class
        class Cloud {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = 50 + Math.random() * 150;
                this.width = 100 + Math.random() * 200;
                this.height = 40 + Math.random() * 60;
                this.speed = 0.1 + Math.random() * 0.3;
                this.opacity = 0.3 + Math.random() * 0.4;
                this.puffs = this.generatePuffs();
            }

            generatePuffs() {
                const puffs = [];
                const numPuffs = 5 + Math.floor(Math.random() * 5);
                for (let i = 0; i < numPuffs; i++) {
                    puffs.push({
                        offsetX: (Math.random() - 0.5) * this.width * 0.8,
                        offsetY: (Math.random() - 0.5) * this.height * 0.5,
                        radius: 20 + Math.random() * 40
                    });
                }
                return puffs;
            }

            update(deltaTime) {
                this.x += this.speed * state.weather.wind * deltaTime * 0.1;
                if (this.x > canvas.width + this.width) {
                    this.x = -this.width;
                } else if (this.x < -this.width) {
                    this.x = canvas.width + this.width;
                }
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                this.puffs.forEach(puff => {
                    ctx.beginPath();
                    ctx.arc(this.x + puff.offsetX, this.y + puff.offsetY, puff.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // Grass Class
        class GrassBlade {
            constructor(x, groundY) {
                this.x = x;
                this.baseY = groundY;
                this.height = 15 + Math.random() * 25;
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = 0.002 + Math.random() * 0.002;
                this.width = 2 + Math.random() * 2;
                this.color = ['#2d5a27', '#3d7a37', '#4d9a47'][Math.floor(Math.random() * 3)];
            }

            draw(ctx, time) {
                const sway = Math.sin(time * this.swaySpeed + this.swayOffset) * state.weather.wind * 5;
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x, this.baseY);
                ctx.quadraticCurveTo(
                    this.x + sway,
                    this.baseY - this.height * 0.5,
                    this.x + sway * 2,
                    this.baseY - this.height
                );
                ctx.stroke();
            }
        }

        // Flower Class
        class Flower {
            constructor(x, groundY) {
                this.x = x;
                this.baseY = groundY;
                this.height = 10 + Math.random() * 15;
                this.petalColor = ['#ff6b6b', '#feca57', '#ff9ff3', '#48dbfb', '#1dd1a1'][Math.floor(Math.random() * 5)];
                this.centerColor = '#f1c40f';
                this.petalCount = 5 + Math.floor(Math.random() * 3);
                this.size = 3 + Math.random() * 3;
                this.swayOffset = Math.random() * Math.PI * 2;
            }

            draw(ctx, time) {
                const sway = Math.sin(time * 0.002 + this.swayOffset) * state.weather.wind * 3;
                
                // Stem
                ctx.strokeStyle = '#2d5a27';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.baseY);
                ctx.quadraticCurveTo(this.x + sway * 0.5, this.baseY - this.height * 0.5, this.x + sway, this.baseY - this.height);
                ctx.stroke();

                // Petals
                ctx.fillStyle = this.petalColor;
                for (let i = 0; i < this.petalCount; i++) {
                    const angle = (i / this.petalCount) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.ellipse(
                        this.x + sway + Math.cos(angle) * this.size,
                        this.baseY - this.height + Math.sin(angle) * this.size,
                        this.size, this.size * 0.6,
                        angle, 0, Math.PI * 2
                    );
                    ctx.fill();
                }

                // Center
                ctx.fillStyle = this.centerColor;
                ctx.beginPath();
                ctx.arc(this.x + sway, this.baseY - this.height, this.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize the forest
        function initForest() {
            // Clear existing entities
            trees.length = 0;
            animals.length = 0;
            particles.length = 0;
            fireflies.length = 0;
            raindrops.length = 0;
            clouds.length = 0;
            grass.length = 0;
            flowers.length = 0;

            const groundY = canvas.height * 0.85;

            // Generate trees with varying depths
            for (let i = 0; i < 25; i++) {
                const x = Math.random() * canvas.width;
                const depth = Math.random();
                const adjustedY = groundY - depth * 100;
                trees.push(new Tree(x, adjustedY));
            }

            // Add some saplings
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * canvas.width;
                trees.push(new Tree(x, groundY, true));
            }

            // Sort trees by Y for depth
            trees.sort((a, b) => a.groundY - b.groundY);

            // Generate grass
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * canvas.width;
                grass.push(new GrassBlade(x, groundY + Math.random() * 20));
            }

            // Generate flowers
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * canvas.width;
                flowers.push(new Flower(x, groundY + Math.random() * 15));
            }

            // Generate clouds
            for (let i = 0; i < 8; i++) {
                clouds.push(new Cloud());
            }

            // Generate fireflies
            for (let i = 0; i < 20; i++) {
                fireflies.push(new Firefly());
            }

            // Add initial animals
            spawnAnimal('deer');
            spawnAnimal('rabbit');
            spawnAnimal('rabbit');
            spawnAnimal('bird');
            spawnAnimal('bird');
            spawnAnimal('fox');
        }

        // Draw sky with time-based colors
        function drawSky(ctx, time) {
            const timeOfDay = state.time;
            let colors;

            if (timeOfDay < 0.2) { // Night
                colors = palettes.sky.night;
            } else if (timeOfDay < 0.3) { // Dawn
                colors = palettes.sky.dawn;
            } else if (timeOfDay < 0.7) { // Day
                colors = palettes.sky.day;
            } else if (timeOfDay < 0.8) { // Dusk
                colors = palettes.sky.dusk;
            } else { // Night
                colors = palettes.sky.night;
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
            colors.forEach((color, i) => {
                gradient.addColorStop(i / (colors.length - 1), color);
            });

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars at night
            if (timeOfDay < 0.2 || timeOfDay > 0.8) {
                const starOpacity = timeOfDay < 0.2 ? 1 : (timeOfDay - 0.8) * 5;
                ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity})`;
                for (let i = 0; i < 100; i++) {
                    const x = (Math.sin(i * 123.456) * 0.5 + 0.5) * canvas.width;
                    const y = (Math.cos(i * 789.012) * 0.5 + 0.5) * canvas.height * 0.5;
                    const size = 1 + Math.random();
                    const twinkle = Math.sin(time * 0.005 + i) * 0.5 + 0.5;
                    ctx.globalAlpha = twinkle * starOpacity;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Moon
                ctx.fillStyle = '#f5f5dc';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8, canvas.height * 0.15, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8 - 10, canvas.height * 0.15 - 5, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(canvas.width * 0.8 + 15, canvas.height * 0.15 + 10, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Sun during day
            if (timeOfDay > 0.25 && timeOfDay < 0.75) {
                const sunProgress = (timeOfDay - 0.25) / 0.5;
                const sunX = canvas.width * 0.2 + sunProgress * canvas.width * 0.6;
                const sunY = canvas.height * 0.3 - Math.sin(sunProgress * Math.PI) * canvas.height * 0.2;

                // Sun glow
                const sunGlow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 80);
                sunGlow.addColorStop(0, 'rgba(255, 200, 100, 1)');
                sunGlow.addColorStop(0.3, 'rgba(255, 150, 50, 0.5)');
                sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = sunGlow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
                ctx.fill();

                // Sun
                ctx.fillStyle = '#feca57';
                ctx.beginPath();
                ctx.arc(sunX, sunY, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw ground
        function drawGround(ctx) {
            const groundY = canvas.height * 0.85;
            const seasonColors = {
                0: ['#2d5a27', '#3d7a37', '#4a8a40'], // Spring
                1: ['#1a4a1a', '#2a6a2a', '#3a7a30'], // Summer
                2: ['#4a6a2a', '#5a7a30', '#6a8a3a'], // Fall
                3: ['#e8e8e8', '#f0f0f0', '#f8f8f8']  // Winter
            };

            const colors = seasonColors[state.season];
            const gradient = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(0.5, colors[1]);
            gradient.addColorStop(1, colors[2]);

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            
            // Rolling hills
            for (let x = 0; x <= canvas.width; x += 50) {
                const y = groundY + Math.sin(x * 0.01) * 10 + Math.sin(x * 0.02) * 5;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Snow patches in winter
            if (state.season === 3) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 20; i++) {
                    const x = Math.random() * canvas.width;
                    const y = groundY + Math.random() * 30;
                    ctx.beginPath();
                    ctx.ellipse(x, y, 20 + Math.random() * 30, 5 + Math.random() * 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Draw fog effect
        function drawFog(ctx) {
            if (!state.weather.fog) return;

            const fogGradient = ctx.createLinearGradient(0, canvas.height * 0.5, 0, canvas.height);
            fogGradient.addColorStop(0, 'rgba(200, 200, 200, 0)');
            fogGradient.addColorStop(0.5, 'rgba(200, 200, 200, 0.3)');
            fogGradient.addColorStop(1, 'rgba(200, 200, 200, 0.6)');

            ctx.fillStyle = fogGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Main animation loop
        let lastTime = 0;
        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // Update time of day
            state.time = (state.time + state.timeSpeed * deltaTime) % 1;

            // Update wind based on mouse position
            const targetWind = (state.mouse.x / canvas.width - 0.5) * 2;
            state.weather.wind += (targetWind - state.weather.wind) * 0.001;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw sky
            drawSky(ctx, currentTime);

            // Draw and update clouds
            clouds.forEach(cloud => {
                cloud.update(deltaTime);
                cloud.draw(ctx);
            });

            // Draw ground
            drawGround(ctx);

            // Draw grass (behind everything else)
            grass.forEach(blade => blade.draw(ctx, currentTime));

            // Draw flowers
            if (state.season === 0 || state.season === 1) {
                flowers.forEach(flower => flower.draw(ctx, currentTime));
            }

            // Update and draw trees
            trees.forEach(tree => {
                tree.update(deltaTime);
                tree.draw(ctx, currentTime);
            });

            // Update and draw animals
            animals.forEach(animal => {
                animal.update(deltaTime, trees);
                animal.draw(ctx, currentTime);
            });

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update(deltaTime)) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw(ctx);
                }
            }

            // Add ambient particles
            if (Math.random() < 0.02 && particles.length < 100) {
                const x = Math.random() * canvas.width;
                const y = -10;
                particles.push(new Particle(x, y, 'leaf'));
            }

            // Draw fireflies at night
            if (state.time < 0.25 || state.time > 0.75) {
                fireflies.forEach(firefly => {
                    firefly.update(deltaTime, currentTime);
                    firefly.draw(ctx);
                });
            }

            // Draw rain
            if (state.weather.rain) {
                if (raindrops.length < 200) {
                    raindrops.push(new Raindrop());
                }
                raindrops.forEach(drop => {
                    drop.update(deltaTime);
                    drop.draw(ctx);
                });
            } else {
                raindrops.length = 0;
            }

            // Draw fog overlay
            drawFog(ctx);

            // Update UI
            updateUI();

            requestAnimationFrame(animate);
        }

        // UI Updates
        function updateUI() {
            const timeNames = ['Midnight', 'Dawn', 'Morning', 'Noon', 'Afternoon', 'Dusk', 'Evening', 'Night'];
            const timeIndex = Math.floor(state.time * 8) % 8;
            document.getElementById('timeDisplay').textContent = timeNames[timeIndex];
            document.getElementById('treeCount').textContent = trees.length;
            document.getElementById('animalCount').textContent = animals.length;
            document.getElementById('particleCount').textContent = particles.length + raindrops.length;
            document.getElementById('weatherDisplay').textContent = 
                (state.weather.rain ? 'Rainy' : 'Clear') + (state.weather.fog ? ' & Foggy' : '');
            document.getElementById('seasonDisplay').textContent = ['Spring', 'Summer', 'Fall', 'Winter'][state.season];
        }

        // Control Functions
        function toggleRain() {
            state.weather.rain = !state.weather.rain;
            document.getElementById('rainBtn').classList.toggle('active', state.weather.rain);
        }

        function toggleFog() {
            state.weather.fog = !state.weather.fog;
            document.getElementById('fogBtn').classList.toggle('active', state.weather.fog);
        }

        function toggleWind() {
            state.weather.wind = state.weather.wind > 0.5 ? 0.2 : 1;
            document.getElementById('windBtn').classList.toggle('active', state.weather.wind > 0.5);
        }

        function cycleSeason() {
            state.season = (state.season + 1) % 4;
            // Regenerate leaves for trees when season changes
            trees.forEach(tree => {
                tree.leaves = tree.generateLeaves();
            });
        }

        function spawnAnimal(type) {
            const types = ['deer', 'rabbit', 'bird', 'fox'];
            const animalType = type || types[Math.floor(Math.random() * types.length)];
            const x = Math.random() * canvas.width;
            const y = canvas.height * 0.7 + Math.random() * canvas.height * 0.15;
            animals.push(new Animal(x, y, animalType));
        }

        function resetForest() {
            initForest();
            state.time = 0.3;
            state.season = 0;
            state.weather.rain = false;
            state.weather.fog = false;
            state.weather.wind = 0.5;
            document.querySelectorAll('#controls button').forEach(btn => btn.classList.remove('active'));
        }

        // Event Listeners
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Plant a tree where clicked
            const groundY = canvas.height * 0.85;
            if (y > canvas.height * 0.5) {
                const newTree = new Tree(x, Math.min(y, groundY), true);
                trees.push(newTree);
                trees.sort((a, b) => a.groundY - b.groundY);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            state.mouse.x = e.clientX - rect.left;
            state.mouse.y = e.clientY - rect.top;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'r': toggleRain(); break;
                case 'f': toggleFog(); break;
                case 'w': toggleWind(); break;
                case 's': cycleSeason(); break;
                case 'a': spawnAnimal(); break;
                case ' ': resetForest(); break;
            }
        });

        // Start the simulation
        initForest();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
