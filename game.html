<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Core Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Axiom Core Palette */
            --hue-axiom-cyan: 195;
            --hue-quantum-violet: 260;
            --hue-warning-amber: 35;
            --hue-sentinel-green: 140;

            --bg-deep-space: hsl(var(--hue-quantum-violet), 45%, 4%);
            --bg-grid: hsla(var(--hue-quantum-violet), 35%, 10%, 0.5);
            --accent-primary: hsl(var(--hue-axiom-cyan), 90%, 60%);
            --accent-secondary: hsl(var(--hue-warning-amber), 95%, 65%);
            
            --glow-primary: hsla(var(--hue-axiom-cyan), 90%, 60%, 0.7);
            --glow-secondary: hsla(var(--hue-warning-amber), 85%, 60%, 0.6);
            --glow-tertiary: hsla(var(--hue-sentinel-green), 85%, 55%, 0.5);
            
            --scan-line: hsla(var(--hue-axiom-cyan), 50%, 80%, 0.07);
            --text-primary: hsla(var(--hue-axiom-cyan), 90%, 85%, 0.95);
            --text-secondary: hsla(var(--hue-axiom-cyan), 70%, 70%, 0.8);
            
            --hologram-glow: 0 0 25px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.6), 0 0 40px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.3);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* --- KEYFRAME ANIMATIONS --- */
        @keyframes interfaceBoot {
            0% { opacity: 0; transform: scale(0.96); filter: blur(3px); }
            80% { opacity: 1; filter: blur(0); }
            100% { transform: scale(1); }
        }
        @keyframes scanLine {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--glow-primary); }
            50% { opacity: 0.85; text-shadow: 0 0 8px var(--glow-primary); }
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulseBorder {
            0%, 100% { border-color: hsla(var(--hue-axiom-cyan), 80%, 70%, 0.3); }
            50% { border-color: hsla(var(--hue-axiom-cyan), 90%, 80%, 0.6); }
        }
        @keyframes glitchAppear {
            0% { opacity: 0; clip-path: inset(50% 0 50% 0); }
            40% { opacity: 0.8; clip-path: inset(50% 0 50% 0); }
            50% { clip-path: inset(20% 0 60% 0); }
            70% { clip-path: inset(40% 0 10% 0); }
            100% { opacity: 1; clip-path: inset(0 0 0 0); }
        }
        @keyframes drawCorner { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }

        /* --- CORE LAYOUT & BACKGROUND --- */
        body {
            background-color: var(--bg-deep-space);
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow: auto; /* Allow scrolling */
            position: relative;
            text-shadow: 0 0 5px var(--glow-primary);
        }
        
        #shader-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Sits behind UI but in front of body bg */
            display: block;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: 2; /* Sits on top of shader */
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 15% 85%, hsla(var(--hue-quantum-violet), 50%, 30%, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 15%, hsla(var(--hue-axiom-cyan), 60%, 25%, 0.35) 0%, transparent 60%);
            opacity: 0.7;
            animation: textFlicker 20s infinite alternate;
        }

        body::before { /* Grid */
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(20, 80, 120, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(20, 80, 120, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: 0;
        }

        body::after { /* Scanline */
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: var(--scan-line);
            z-index: 12;
            box-shadow: 0 0 15px var(--glow-primary);
            animation: scanLine 7s linear infinite;
            opacity: 0.8;
            pointer-events: none;
        }

        /* --- MAIN UI WRAPPER --- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            animation: interfaceBoot 1.5s ease-out forwards;
        }

        /* --- MAIN INTERFACE FRAME --- */
        .interface-container {
            position: relative;
            padding: 2rem;
            background-color: hsla(var(--hue-quantum-violet), 30%, 8%, 0.85);
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 70%, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 40px hsla(var(--hue-axiom-cyan), 70%, 40%, 0.25), inset 0 0 25px hsla(var(--hue-quantum-violet), 70%, 5%, 0.9);
            backdrop-filter: blur(8px);
            animation: pulseBorder 6s infinite;
            max-width: 1000px;
            width: 100%;
            display: flex;
            gap: 2rem;
        }

        /* Decorative Corner Brackets */
        .corner-bracket {
            position: absolute;
            width: 25px;
            height: 25px;
            stroke: var(--accent-primary);
            stroke-width: 2px;
            fill: none;
            stroke-dasharray: 200;
            animation: drawCorner 2s ease-out 0.5s forwards;
        }
        .corner-bracket.top-left { top: -2px; left: -2px; }
        .corner-bracket.top-right { top: -2px; right: -2px; transform: rotate(90deg); }
        .corner-bracket.bottom-left { bottom: -2px; left: -2px; transform: rotate(-90deg); }
        .corner-bracket.bottom-right { bottom: -2px; right: -2px; transform: rotate(180deg); }

        /* --- HEADER & STATUS --- */
        .interface-header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 1rem;
            border-bottom: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            animation: textFlicker 8s infinite;
        }
        .interface-header h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--text-primary);
            text-transform: uppercase;
        }
        .interface-header .subtitle {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        /* --- LAUNCHER & BRIEFING COLUMNS --- */
        .launcher-column { flex: 0 0 300px; }
        .briefing-column { flex: 1; }

        /* --- GAME ORBS --- */
        .game-launchers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        .game-orb {
            width: 110px; height: 125px;
            background: linear-gradient(160deg, hsla(var(--hue-quantum-violet), 70%, 12%, 0.8), hsla(var(--hue-axiom-cyan), 70%, 18%, 0.7));
            position: relative;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Oxanium', sans-serif;
            text-align: center;
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.3);
            box-shadow: 0 0 10px hsla(var(--hue-axiom-cyan), 80%, 50%, 0.1), inset 0 0 15px hsla(var(--hue-quantum-violet), 70%, 10%, 0.9);
            will-change: transform, box-shadow;
        }
        .game-orb:hover, .game-orb:focus-visible {
            outline: none;
            transform: translateY(-10px) scale(1.1);
            background: linear-gradient(160deg, hsla(var(--hue-quantum-violet), 80%, 18%, 0.9), hsla(var(--hue-axiom-cyan), 80%, 25%, 0.8));
            box-shadow: 0 0 20px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.5), 0 0 35px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.3), inset 0 0 20px hsla(var(--hue-axiom-cyan), 80%, 30%, 0.3);
            border-color: hsla(var(--hue-axiom-cyan), 90%, 75%, 0.6);
        }
        .game-orb:active {
            transform: translateY(-5px) scale(1.05);
            transition-duration: 0.1s;
        }
        .game-orb .orb-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 6px var(--glow-primary));
            transition: transform 0.3s ease;
            color: var(--accent-primary);
        }
        .game-orb .orb-icon svg {
            width: 100%;
            height: 100%;
        }
        .game-orb:hover .orb-icon { 
            transform: scale(1.15); 
            color: white;
        }
        .orb-label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-primary); font-weight: 600;
            transition: color 0.3s ease;
            padding: 0 5px;
        }
        .orb-label .core-id {
            display: block; font-size: 0.55rem; color: var(--text-secondary);
            opacity: 0; transition: opacity 0.3s ease; margin-top: 4px;
        }
        .game-orb:hover .orb-label .core-id { opacity: 1; }

        /* --- MISSION BRIEFING PANEL --- */
        .mission-briefing {
            background: hsla(var(--hue-quantum-violet), 25%, 10%, 0.5);
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            height: 100%;
            position: relative;
        }
        #briefing-title {
            color: var(--accent-secondary);
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 0 8px var(--glow-secondary);
        }
        #briefing-text, #briefing-data {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        #briefing-data {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            font-size: 0.8rem;
            white-space: pre;
        }
        .typewriter-cursor {
            display: inline-block;
            width: 10px;
            background-color: var(--accent-primary);
            animation: textFlicker 1s infinite;
        }

        /* --- SYSTEM STATUS FOOTER --- */
        .system-status {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        #status-text::before {
            content: 'SYS_STATUS::';
            color: hsla(var(--hue-sentinel-green), 90%, 70%, 0.8);
            margin-right: 8px;
        }
        
        /* --- OVERLAYS & MODALS --- */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(10, 10, 25, 0.98);
            z-index: 200;
            transition: opacity 0.5s ease;
        }
        #play-button {
            background: linear-gradient(45deg, var(--accent-primary), hsl(var(--hue-axiom-cyan), 95%, 70%));
            color: var(--bg-deep-space);
            font-family: 'Oxanium', sans-serif;
            font-size: 2rem;
            padding: 1rem 3rem;
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 25px var(--glow-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--glow-primary);
        }
        #play-overlay .prompt-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        /* Alien Transmission Overlay */
        #alien-transmission {
            color: hsl(var(--hue-sentinel-green), 90%, 60%);
            text-shadow: 0 0 10px var(--glow-tertiary);
            font-size: 1.5rem;
            line-height: 1.2;
            text-align: center;
            padding: 2rem;
            font-family: monospace;
            animation: glitchAppear 1s forwards, textFlicker 2s infinite;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 850px) {
            .main-wrapper {
                align-items: flex-start;
                padding-top: 5vh;
                padding-bottom: 5vh;
            }
            .interface-container {
                flex-direction: column;
            }
            .launcher-column { flex: 1; }
        }
        @media (max-width: 480px) {
            .main-wrapper { padding: 1rem; }
            .interface-container { padding: 1rem; }
            .game-launchers { gap: 15px; }
            .game-orb { width: 90px; height: 105px; }
            .game-orb .orb-icon { width: 40px; height: 40px; }
            .orb-label { font-size: 0.65rem; }
            .interface-header h1 { font-size: 1rem; }
            #briefing-title { font-size: 1rem; }
            #briefing-text, #briefing-data { font-size: 0.8rem; }
            .system-status { font-size: 0.65rem; }
        }
    </style>
</head>










    
<body>
    <canvas id="shader-canvas"></canvas>

    <div class="background-overlay"></div>

    <div id="play-overlay" class="overlay">
        <button id="play-button">Engage</button>
        <div class="prompt-text">Initialize Axiom Core</div>
    </div>

    <div id="boot-overlay" class="overlay" style="opacity: 0; pointer-events: none;">
        <div id="boot-message" style="font-size: 1.2rem; letter-spacing: 2px;">Establishing Quantum Link...</div>
    </div>

    <div id="alien-transmission" class="overlay" style="display: none;"></div>
    
    <main class="main-wrapper" style="visibility: hidden;">
        <div class="interface-container">
            <svg class="corner-bracket top-left" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket top-right" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket bottom-left" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket bottom-right" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>

            <section class="launcher-column">
                <header class="interface-header">
                    <h1>AXIOM CORE</h1>
                    <div class="subtitle">Simulation & Strategy Interface</div>
                    





   

































<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
    // 1. Basic Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Define Uniforms
    // These variables pass data from our JavaScript (like time) to the shader.
    const uniforms = {
        iTime: { value: 0.0 },
        iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    // 3. Create a plane that fills the screen to draw our shader on.
    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        // The vertex shader is minimal; it just positions the plane.
        vertexShader: `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `,
        // --- YOUR SHADER CODE GOES HERE ---
        // I've copied your shader and adapted it to work with Three.js.
        fragmentShader: `
            uniform vec2 iResolution;
            uniform float iTime;

            // PASTE YOUR SHADER TOY CODE BELOW THIS LINE

            // BACKROOMS: ALIEN ENCOUNTER - Extended Horror Experience
            // Ultra-realistic liminal nightmare with cinematic alien encounters

            #define MAX_STEPS 150
            #define MAX_DIST 200.0
            #define SURF_DIST 0.005
            #define PI 3.14159265359

            // Advanced noise functions
            float hash(float n) {
                return fract(sin(n) * 1e4);
            }

            float hash(vec2 p) {
                return fract(1e4 * sin(17.0 * p.x + p.y * 0.1) * (0.1 + abs(sin(p.y * 13.0 + p.x))));
            }

            float noise3D(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(
                    mix(
                        mix(hash(i.x + i.y * 37.0 + i.z * 521.0),
                            hash(i.x + 1.0 + i.y * 37.0 + i.z * 521.0), f.x),
                        mix(hash(i.x + (i.y + 1.0) * 37.0 + i.z * 521.0),
                            hash(i.x + 1.0 + (i.y + 1.0) * 37.0 + i.z * 521.0), f.x), f.y),
                    mix(
                        mix(hash(i.x + i.y * 37.0 + (i.z + 1.0) * 521.0),
                            hash(i.x + 1.0 + i.y * 37.0 + (i.z + 1.0) * 521.0), f.x),
                        mix(hash(i.x + (i.y + 1.0) * 37.0 + (i.z + 1.0) * 521.0),
                            hash(i.x + 1.0 + (i.y + 1.0) * 37.0 + (i.z + 1.0) * 521.0), f.x), f.y), f.z);
            }

            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            // Advanced SDF operations
            float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
            }

            float sdSphere(vec3 p, float s) {
                return length(p) - s;
            }

            float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
                vec3 pa = p - a, ba = b - a;
                float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
                return length(pa - ba * h) - r;
            }

            float smin(float a, float b, float k) {
                float h = max(k - abs(a - b), 0.0) / k;
                return min(a, b) - h * h * h * k * (1.0 / 6.0);
            }

            // Story timeline management
            float getStoryPhase(float t) {
                return mod(t, 120.0); // 2-minute story cycles
            }

            vec3 getAlienPosition(float t) {
                float phase = getStoryPhase(t);

                if (phase < 20.0) {
                    // Hidden, far away
                    return vec3(100.0, 2.0, 100.0);
                } else if (phase < 40.0) {
                    // First sighting - distant but visible
                    float p = (phase - 20.0) / 20.0;
                    return vec3(15.0 + sin(t * 0.1) * 2.0, 2.5, 25.0 + p * 5.0);
                } else if (phase < 60.0) {
                    // Chase - following player
                    return vec3(
                        sin(t * 0.5) * 8.0 - 8.0,
                        2.0 + sin(t * 0.8) * 0.5,
                        t * 1.5 - 10.0
                    );
                } else if (phase < 80.0) {
                    // Stalking - moving around player
                    float angle = t * 0.2;
                    return vec3(
                        cos(angle) * 12.0 + sin(t * 0.1) * 3.0,
                        2.5 + sin(t * 0.1),
                        sin(angle) * 12.0 + t * 0.8
                    );
                } else {
                    // Final encounter - aggressive approach
                    float p = (phase - 80.0) / 40.0;
                    float dist = 20.0 * (1.0 - p * 0.8);
                    return vec3(
                        sin(t * 0.3) * 3.0,
                        2.0 + sin(t * 0.7) * 0.5,
                        t * 1.2 + dist
                    );
                }
            }

            vec3 getCameraPosition(float t) {
                float phase = getStoryPhase(t);

                if (phase < 20.0) {
                    // Phase 1: Slow exploration
                    return vec3(sin(t * 0.1) * 2.0, 1.6 + sin(t * 0.05) * 0.1, t * 0.8);
                } else if (phase < 40.0) {
                    // Phase 2: First alien encounter - static fear
                    float p = (phase - 20.0) / 20.0;
                    return vec3(5.0 + sin(t * 0.02) * 0.2, 1.6, 16.0 + p * 2.0);
                } else if (phase < 60.0) {
                    // Phase 3: Chase sequence
                    float panic = 2.0 + sin(t * 0.5);
                    return vec3(sin(t * 0.3 * panic) * 4.0, 1.4 + sin(t * 0.8) * 0.3, t * panic);
                } else if (phase < 80.0) {
                    // Phase 4: Hiding/stealth
                    float p = (phase - 60.0) / 20.0;
                    return vec3(8.0 + sin(t * 0.05) * 0.1, 1.2, 80.0 + p * 5.0);
                } else {
                    // Phase 5: Final encounter
                    float p = (phase - 80.0) / 40.0;
                    return vec3(sin(t * 0.15) * 6.0, 1.6 + p * 0.5, 90.0 + p * 10.0);
                }
            }

            vec3 getCameraDirection(float t, vec3 ro) {
                float phase = getStoryPhase(t);
                vec3 target;

                if (phase < 20.0) {
                    // Normal exploration
                    target = ro + vec3(0.0, 0.0, 1.0);
                } else if (phase < 40.0) {
                    // Looking at first alien sighting
                    vec3 alienPos = getAlienPosition(t);
                    target = alienPos;
                } else if (phase < 60.0) {
                    // Panicked looking around while running
                    target = ro + vec3(sin(t * 2.0) * 0.5, sin(t * 1.5) * 0.3, 1.0);
                } else if (phase < 80.0) {
                    // Careful looking around while hiding
                    target = ro + vec3(sin(t * 0.1) * 0.3, 0.0, 1.0);
                } else {
                    // Final confrontation
                    vec3 alienPos = getAlienPosition(t);
                    target = mix(ro + vec3(0.0, 0.0, 1.0), alienPos, 0.7);
                }

                return normalize(target - ro);
            }

            // Enhanced alien entity with multiple forms
            float getAlienEntity(vec3 p, float t) {
                vec3 alienPos = getAlienPosition(t);
                float phase = getStoryPhase(t);

                vec3 ap = p - alienPos;

                // Core alien body
                float core = sdSphere(ap, 0.8 + sin(t * 2.0) * 0.2);

                // Tentacles/appendages
                float tentacle1 = sdCapsule(ap,
                    vec3(0.0),
                    vec3(sin(t * 1.5) * 3.0, cos(t * 1.2) * 2.0, sin(t * 0.8) * 2.5),
                    0.15 + sin(t * 3.0) * 0.05);

                float tentacle2 = sdCapsule(ap,
                    vec3(0.0),
                    vec3(cos(t * 1.8) * 2.5, sin(t * 1.6) * 1.5, cos(t * 1.1) * 3.0),
                    0.12 + sin(t * 4.0) * 0.03);

                float tentacle3 = sdCapsule(ap,
                    vec3(0.0),
                    vec3(sin(t * 2.2) * 2.0, cos(t * 0.9) * 2.5, sin(t * 1.4) * 2.8),
                    0.18 + sin(t * 2.5) * 0.07);

                // Alien gets more aggressive and larger in later phases
                float sizeMultiplier = 1.0;
                if (phase > 60.0) {
                    sizeMultiplier = 1.0 + (phase - 60.0) * 0.02;
                }

                core *= sizeMultiplier;
                tentacle1 *= sizeMultiplier;
                tentacle2 *= sizeMultiplier;
                tentacle3 *= sizeMultiplier;

                float alien = smin(core, smin(tentacle1, smin(tentacle2, tentacle3, 0.3), 0.2), 0.1);

                // Add pulsing distortion
                alien += sin(t * 8.0 + length(ap) * 2.0) * 0.1;

                return alien;
            }

            // Realistic backrooms with wear and damage
            float getBackroomsStructure(vec3 p, float t) {
                // Floor with realistic wear patterns
                float floorHeight = p.y + 1.0;
                floorHeight += noise3D(p * 5.0) * 0.02; // Surface imperfections
                floorHeight += sin(p.x * 0.5) * sin(p.z * 0.3) * 0.01; // Slight warping

                // Ceiling with sagging and stains
                float ceilingHeight = -(p.y - 4.2 + sin(p.x * 0.2) * sin(p.z * 0.15) * 0.3);
                ceilingHeight += noise3D(p * 3.0) * 0.03;

                // Room generation with irregularities
                vec3 roomPos = p;
                vec2 roomCoord = floor((p.xz + 6.0) / 12.0);
                roomPos.x = mod(roomPos.x + 6.0, 12.0) - 6.0;
                roomPos.z = mod(roomPos.z + 6.0, 12.0) - 6.0;

                // Add room variations
                float roomVariation = hash(roomCoord);
                roomPos += vec3(sin(roomVariation * 100.0) * 0.5, 0.0, cos(roomVariation * 100.0) * 0.5);

                float wallThickness = 0.25 + roomVariation * 0.1;

                // Walls with damage and irregularities
                float wall1 = sdBox(roomPos - vec3(5.5, 1.8, 0.0), vec3(wallThickness, 2.8, 6.0));
                float wall2 = sdBox(roomPos - vec3(-5.5, 1.8, 0.0), vec3(wallThickness, 2.8, 6.0));
                float wall3 = sdBox(roomPos - vec3(0.0, 1.8, 5.5), vec3(6.0, 2.8, wallThickness));
                float wall4 = sdBox(roomPos - vec3(0.0, 1.8, -5.5), vec3(6.0, 2.8, wallThickness));

                // Add wall damage
                wall1 += noise3D(roomPos * 8.0 + vec3(t * 0.1, 0.0, 0.0)) * 0.05;
                wall2 += noise3D(roomPos * 8.0 + vec3(0.0, t * 0.1, 0.0)) * 0.05;
                wall3 += noise3D(roomPos * 8.0 + vec3(0.0, 0.0, t * 0.1)) * 0.05;
                wall4 += noise3D(roomPos * 8.0 + vec3(t * 0.1, t * 0.1, 0.0)) * 0.05;

                // Random openings based on room
                if (roomVariation > 0.3) {
                    float opening1 = sdBox(roomPos - vec3(5.5, 1.2, 0.0), vec3(wallThickness + 0.1, 1.2, 2.0));
                    wall1 = max(wall1, -opening1);
                }
                if (roomVariation > 0.6) {
                    float opening2 = sdBox(roomPos - vec3(0.0, 1.2, 5.5), vec3(2.0, 1.2, wallThickness + 0.1));
                    wall3 = max(wall3, -opening2);
                }

                float walls = min(min(wall1, wall2), min(wall3, wall4));

                // Add some debris and objects
                float debris1 = sdBox(roomPos - vec3(2.0 + sin(roomVariation * 20.0), -0.8, 3.0), vec3(0.3, 0.2, 0.8));
                float debris2 = sdSphere(roomPos - vec3(-3.0, -0.7, -2.0 + cos(roomVariation * 15.0)), 0.4);

                float room = min(min(floorHeight, ceilingHeight), walls);
                room = min(room, min(debris1, debris2));

                return room;
            }

            float getDist(vec3 p, float t) {
                float rooms = getBackroomsStructure(p, t);
                float alien = getAlienEntity(p, t);

                return min(rooms, alien);
            }

            float rayMarch(vec3 ro, vec3 rd, float t) {
                float dO = 0.0;

                for(int i = 0; i < MAX_STEPS; i++) {
                    vec3 p = ro + rd * dO;
                    float dS = getDist(p, t);
                    dO += dS;
                    if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
                }

                return dO;
            }

            vec3 getNormal(vec3 p, float t) {
                float d = getDist(p, t);
                vec2 e = vec2(SURF_DIST, 0.0);

                vec3 n = d - vec3(
                    getDist(p - e.xyy, t),
                    getDist(p - e.yxy, t),
                    getDist(p - e.yyx, t));

                return normalize(n);
            }

            // Advanced lighting system
            float getLight(vec3 p, float t) {
                float phase = getStoryPhase(t);

                // Fluorescent lights with realistic flickering
                float baseFlicker = 0.7 + 0.3 * sin(t * 23.7 + p.x * 0.3) * sin(t * 17.3 + p.z * 0.2);

                // Power issues during alien encounters
                float powerFluctuation = 1.0;
                if (phase > 20.0 && phase < 80.0) {
                    powerFluctuation = 0.4 + 0.6 * noise3D(vec3(t * 2.0, 0.0, 0.0));
                }

                // Multiple light sources
                vec3 lightGrid = vec3(
                    floor(p.x / 12.0) * 12.0,
                    3.8,
                    floor(p.z / 12.0) * 12.0
                );

                vec3 l = normalize(lightGrid - p);
                vec3 n = getNormal(p, t);

                float dif = clamp(dot(n, l), 0.0, 1.0);

                // Shadow casting
                float shadow = 1.0;
                float d = rayMarch(p + n * SURF_DIST * 3.0, l, t);
                if(d < length(lightGrid - p)) shadow = 0.1;

                // Alien influence on lighting
                vec3 alienPos = getAlienPosition(t);
                float alienDist = length(p - alienPos);
                float alienInfluence = exp(-alienDist * 0.1);

                return dif * shadow * baseFlicker * powerFluctuation * (1.0 - alienInfluence * 0.7);
            }

            // Material identification
            int getMaterial(vec3 p, float t) {
                vec3 alienPos = getAlienPosition(t);
                if (length(p - alienPos) < 4.0 && getDist(p, t) < SURF_DIST) {
                    return 1; // Alien material
                }

                if (p.y < -0.5) return 2; // Floor
                if (p.y > 3.5) return 3; // Ceiling
                return 0; // Walls
            }

            void mainImage(out vec4 fragColor, in vec2 fragCoord) {
                vec2 uv = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
                float t = iTime;
                float phase = getStoryPhase(t);

                // Cinematic camera system
                vec3 ro = getCameraPosition(t);
                vec3 forward = getCameraDirection(t, ro);
                vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
                vec3 up = cross(right, forward);

                vec3 rd = normalize(forward + uv.x * right + uv.y * up);

                // Camera shake based on story phase
                float shake = 0.0;
                if (phase > 20.0 && phase < 60.0) {
                    shake = (phase > 40.0 ? 0.02 : 0.005) * sin(t * 15.0);
                    rd.xy += shake;
                    rd = normalize(rd);
                }

                float d = rayMarch(ro, rd, t);
                vec3 p = ro + rd * d;

                vec3 color = vec3(0.02, 0.02, 0.01); // Deep ambient darkness

                if(d < MAX_DIST) {
                    float light = getLight(p, t);
                    vec3 n = getNormal(p, t);
                    int mat = getMaterial(p, t);

                    vec3 albedo;
                    if (mat == 1) {
                        // Alien material - shifting colors
                        albedo = vec3(0.6, 0.1, 0.2) + vec3(0.4, 0.2, 0.6) * sin(t * 3.0 + length(p) * 0.5);
                        light += 0.8 * (0.5 + 0.5 * sin(t * 4.0)); // Pulsing glow
                    } else if (mat == 2) {
                        // Floor - stained carpet
                        albedo = vec3(0.4, 0.35, 0.2) * (0.8 + 0.2 * noise3D(p * 10.0));
                    } else if (mat == 3) {
                        // Ceiling - water damage
                        albedo = vec3(0.6, 0.55, 0.4) * (0.7 + 0.3 * noise3D(p * 8.0));
                    } else {
                        // Walls - yellowed wallpaper
                        albedo = vec3(0.7, 0.6, 0.35) * (0.9 + 0.1 * noise3D(p * 12.0));
                    }

                    // Apply lighting
                    color = albedo * light;

                    // Subsurface scattering for alien
                    if (mat == 1) {
                        vec3 alienPos = getAlienPosition(t);
                        float subsurface = exp(-length(p - alienPos) * 0.5);
                        color += vec3(0.8, 0.2, 0.4) * subsurface * 0.3;
                    }

                    // Atmospheric fog with alien influence
                    float fog = 1.0 - exp(-d * 0.015);
                    vec3 fogColor = vec3(0.05, 0.04, 0.02);

                    if (phase > 20.0) {
                        vec3 alienPos = getAlienPosition(t);
                        float alienFogInfluence = exp(-length(ro - alienPos) * 0.02);
                        fogColor = mix(fogColor, vec3(0.1, 0.02, 0.05), alienFogInfluence * 0.5);
                    }

                    color = mix(color, fogColor, fog);
                }

                // Post-processing effects

                // Film grain (more intense during encounters)
                float grainIntensity = phase > 20.0 ? 0.15 : 0.08;
                float grain = (hash(fragCoord.x + fragCoord.y * 1000.0 + t) - 0.5) * grainIntensity;
                color += grain;

                // Chromatic aberration during alien encounters
                if (phase > 40.0 && phase < 80.0) {
                    color.r *= (1.0 + sin(t * 5.0 + length(uv)) * 0.1);
                    color.b *= (1.0 + cos(t * 4.0 + length(uv)) * 0.1);
                }

                // Vignette (stronger during tense moments)
                float vignetteStrength = phase > 20.0 ? 0.6 : 0.3;
                float vignette = 1.0 - length(uv) * vignetteStrength;
                color *= vignette;

                // Color grading
                color = pow(color, vec3(0.8)); // Slight gamma correction
                color = mix(color, vec3(dot(color, vec3(0.299, 0.587, 0.114))), -0.1); // Slight saturation boost

                // Exposure adjustment based on phase
                float exposure = phase > 60.0 ? 0.8 : 1.0;
                color *= exposure;

                fragColor = vec4(color, 1.0);
            }

            // This is the new main function that connects your shader to Three.js
            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
        `
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 4. Animation Loop
    // This function runs every frame, updating the iTime uniform and rendering the scene.
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        uniforms.iTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
    }
    animate();

    // 5. Handle window resizing
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.iResolution.value.x = window.innerWidth;
        uniforms.iResolution.value.y = window.innerHeight;
    });

</script>

        function startDataStream(data) {
            const lines = data.split('\n');

                if (currentLine < lines.length) {
                    briefingData.innerHTML += lines[currentLine] + '\n';

        // --- SHADER SCENE LOGIC ---
        function startShaderScene() {
            const canvas = document.getElementById('shader-canvas');
            if (!canvas) return;
            const gl = canvas.getContext('webgl');
            if (!gl) { console.error("WebGL not supported!"); return; }

            const vsSource = `attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;
            const fsSource = `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_res;
                
                float random (in vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
                float noise (in vec2 st) {
                    vec2 i = floor(st);
                    vec2 f = fract(st);
                    float a = random(i);
                    float b = random(i + vec2(1.0, 0.0));
                    float c = random(i + vec2(0.0, 1.0));
                    float d = random(i + vec2(1.0, 1.0));
                    vec2 u = f*f*(3.0-2.0*f);
                    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
                }
                #define OCTAVES 6
                float fbm (in vec2 st) {
                    float value = 0.0;
                    float amplitude = .5;
                    float frequency = 0.;
                    for (int i = 0; i < OCTAVES; i++) {
                        value += amplitude * noise(st);
                        st *= 2.;
                        amplitude *= .5;
                    }
                    return value;
                }

                void main() {
                    vec2 st = gl_FragCoord.xy/u_res.xy;
                    st.x *= u_res.x/u_res.y;
                    vec3 color = vec3(0.0);
                    vec2 q = vec2(0.);
                    q.x = fbm( st + 0.00*u_time);
                    q.y = fbm( st + vec2(1.0));
                    vec2 r = vec2(0.);
                    r.x = fbm( st + 1.0*q + vec2(1.7,9.2)+ 0.15*u_time );
                    r.y = fbm( st + 1.0*q + vec2(8.3,2.8)+ 0.126*u_time);
                    float f = fbm(st+r);
                    color = mix(vec3(0.101961,0.619608,0.666667),
                                vec3(0.666667,0.666667,0.498039),
                                clamp((f*f)*4.0,0.0,1.0));
                    color = mix(color,
                                vec3(0,0,0.164706),
                                clamp(length(q),0.0,1.0));
                    color = mix(color,
                                vec3(0.666667,1,1),
                                clamp(length(r.x),0.0,1.0));
                    gl_FragColor = vec4((f*f*f+.6*f*f+.5*f)*color,1.);
                }`;
            
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, vsSource);
            gl.compileShader(vs);
            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fsSource);
            gl.compileShader(fs);
            const prog = gl.createProgram();
            gl.attachShader(prog, vs);
            gl.attachShader(prog, fs);
            gl.linkProgram(prog);
            gl.useProgram(prog);
            
            const u_time = gl.getUniformLocation(prog, 'u_time');
            const u_res = gl.getUniformLocation(prog, 'u_res');
            
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            const a_pos = gl.getAttribLocation(prog, 'a_position');
            gl.vertexAttribPointer(a_pos, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(a_pos);

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            window.addEventListener('resize', resize);
            resize();

            let startTime = 0;
            function render(timestamp) {
                if(!startTime) startTime = timestamp;
                const t = (timestamp - startTime) * 0.0001; // Slow down time for a more subtle effect
                gl.uniform1f(u_time, t);
                gl.uniform2f(u_res, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
    });
    </script>
