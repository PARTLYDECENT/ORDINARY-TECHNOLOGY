<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Launch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Liquid Cool Palette (Cyan/Indigo focus) */
            --hue1: 190; /* Cyan */
            --hue2: 240; /* Indigo */
            --hue3: 280; /* Violet */

            --bg-deep: hsl(var(--hue2), 40%, 5%);   /* Deep Indigo */
            --bg-mid: hsl(var(--hue2), 35%, 12%);  /* Dark Indigo */

            --liquid-glow1: hsla(var(--hue1), 90%, 60%, 0.7);
            --liquid-glow2: hsla(var(--hue3), 80%, 65%, 0.6);
            --liquid-highlight: hsla(var(--hue1), 100%, 80%, 1);

            --text-color: hsla(var(--hue1), 80%, 85%, 0.9);

            --glow-soft1: 0 0 25px hsla(var(--hue1), 90%, 60%, 0.5);
            --glow-soft2: 0 0 20px hsla(var(--hue3), 80%, 65%, 0.4);

            --transition-speed: 0.4s;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-color);
            font-family: 'Oxanium', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Noise Overlay (Subtle) */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.02"/></svg>');
            opacity: 0.5;
            pointer-events: none;
            z-index: 1; /* Above background, below content */
            animation: subtleNoiseShift 30s linear infinite alternate;
        }
        @keyframes subtleNoiseShift {
            from { background-position: 0% 0%; } to { background-position: 5% 10%; }
        }

        /* Liquid Background Layer */
        .background-layer {
            position: fixed; inset: -50%; /* Extend beyond viewport */
            z-index: 0;
            background: radial-gradient(ellipse at 20% 80%, hsla(var(--hue1), 50%, 20%, 0.6) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 30%, hsla(var(--hue3), 40%, 25%, 0.5) 0%, transparent 55%),
                        radial-gradient(ellipse at 50% 50%, hsla(var(--hue2), 30%, 15%, 0.7) 0%, transparent 70%);
            background-size: 150% 150%; /* Make gradients larger */
            opacity: 0.8;
            animation: liquidFlow 45s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
            will-change: transform;
        }

        @keyframes liquidFlow {
            0% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
            100% { transform: translate(5%, -5%) rotate(10deg) scale(1.15); }
        }

        /* Game Launchers Container */
        .game-launchers {
            position: relative; /* Ensure it's above background */
            z-index: 10;
            display: flex;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            justify-content: center;
            align-items: center;
            gap: 35px; /* Spacing between orbs */
            padding: 20px;
            max-width: 800px; /* Limit width */
        }

        /* Individual Game Orb */
        .game-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%; /* Perfect circle */
            background: radial-gradient(ellipse at 30% 30%, hsla(var(--hue1), 70%, 40%, 0.6), var(--bg-mid) 75%);
            border: 1px solid hsla(var(--hue1), 80%, 70%, 0.15);
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.5),
                        0 0 10px hsla(var(--hue1), 80%, 50%, 0.2),
                        0 0 15px hsla(var(--hue3), 70%, 55%, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform var(--transition-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275), /* Overshoot */
                        box-shadow var(--transition-speed) ease,
                        background var(--transition-speed) ease;
            font-size: 0.65rem; /* Smaller text */
            font-weight: 600;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden; /* For pseudo-element effects */
            will-change: transform, box-shadow;
        }

        /* Orb Icon/Glyph */
        .game-orb span {
            font-size: 1.8rem; /* Larger icon */
            margin-bottom: 4px;
            line-height: 1;
            display: block;
            filter: drop-shadow(0 0 5px var(--liquid-glow1));
            transition: transform 0.3s ease;
        }

        /* Liquid Ripple/Glow Effect on Hover */
        .game-orb::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 5px; height: 5px;
            background: var(--liquid-highlight);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform calc(var(--transition-speed) * 1.5) ease-out,
                        opacity calc(var(--transition-speed) * 1.5) ease-out;
            filter: blur(3px);
            z-index: 0; /* Behind text/icon */
        }

        .game-orb:hover,
        .game-orb:focus-visible { /* Combine states */
            outline: none;
            transform: scale(1.15) translateY(-5px); /* Pop up */
            background: radial-gradient(ellipse at 30% 30%, hsla(var(--hue1), 80%, 50%, 0.7), var(--bg-mid) 80%);
            box-shadow: inset 0 1px 10px rgba(0,0,0,0.4), var(--glow-soft1), var(--glow-soft2);
            border-color: hsla(var(--hue1), 90%, 75%, 0.3);
        }

        .game-orb:hover span,
        .game-orb:focus-visible span {
            transform: scale(1.05); /* Icon reacts */
        }

        .game-orb:hover::after,
        .game-orb:focus-visible::after {
            transform: translate(-50%, -50%) scale(30); /* Expand ripple */
            opacity: 0.6;
        }

        /* Click effect */
        .game-orb:active {
            transform: scale(1.05) translateY(-2px); /* Slight press down */
            transition-duration: 0.1s;
        }

        /* Orb Text (below icon) */
        .orb-label {
            font-size: 0.6rem;
            opacity: 0.8;
            position: relative; /* Ensure text is above ripple */
            z-index: 1;
            margin-top: 2px;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .game-launchers {
                gap: 25px;
                padding: 15px;
            }
            .game-orb {
                width: 80px;
                height: 80px;
            }
            .game-orb span { font-size: 1.6rem; }
            .orb-label { font-size: 0.55rem; }
        }
         @media (max-width: 400px) {
             .game-launchers {
                 gap: 20px;
             }
             .game-orb {
                 width: 70px;
                 height: 70px;
             }
             .game-orb span { font-size: 1.4rem; }
             .orb-label { font-size: 0.5rem; }
         }

    </style>
</head>
<body>
    <div class="background-layer"></div>

    <div class="game-launchers">
        <button class="game-orb" data-url="./ordinary-recycling/index.html" aria-label="Launch Containment Scenario">
            <span>☣️</span>
            <div class="orb-label">Contain</div>
        </button>

        <button class="game-orb" data-url="https://upit.com/up/OrdinaryDefense1" aria-label="Launch Defense Grid Scenario">
            <span>🛡️</span>
            <div class="orb-label">Defense</div>
        </button>

        <button class="game-orb" data-url="./game/index.html" aria-label="Launch Hive Prediction Scenario">
            <span>🐝</span>
            <div class="orb-label">Predict</div>
        </button>

        <button class="game-orb" data-url="./game2/index.html" aria-label="Launch Void Navigation Scenario">
            <span>🌌</span>
            <div class="orb-label">Navigate</div>
        </button>

        <button class="game-orb" data-url="./new_game_1/index.html" aria-label="Launch Hydro Flux Scenario">
            <span>💧</span>
            <div class="orb-label">HydroFlux</div>
        </button>

        <button class="game-orb" data-url="./new_game_2/index.html" aria-label="Launch Crystal Rift Scenario">
            <span>💎</span>
            <div class="orb-label">RiftRun</div>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const launchersContainer = document.querySelector('.game-launchers');

            if (launchersContainer) {
                launchersContainer.addEventListener('click', (e) => {
                    // Find the button element that was clicked, even if the click was on its child (span/div)
                    const targetOrb = e.target.closest('.game-orb');

                    if (targetOrb) {
                        const url = targetOrb.getAttribute('data-url');
                        if (url) {
                            console.log(`Opening: ${url}`);
                            // Open the URL in a new tab/window
                            window.open(url, '_blank', 'noopener,noreferrer');
                        } else {
                            console.warn('Game orb clicked, but no data-url found:', targetOrb);
                        }
                    }
                });
            } else {
                console.error('Game launchers container not found!');
            }
        });
    </script>
</body>
</html>
