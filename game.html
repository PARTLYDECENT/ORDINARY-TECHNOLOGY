<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom Core Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Axiom Core Palette */
            --hue-axiom-cyan: 195;
            --hue-quantum-violet: 260;
            --hue-warning-amber: 35;
            --hue-sentinel-green: 140;

            --bg-deep-space: hsl(var(--hue-quantum-violet), 45%, 4%);
            --bg-grid: hsla(var(--hue-quantum-violet), 35%, 10%, 0.5);
            --accent-primary: hsl(var(--hue-axiom-cyan), 90%, 60%);
            --accent-secondary: hsl(var(--hue-warning-amber), 95%, 65%);
            
            --glow-primary: hsla(var(--hue-axiom-cyan), 90%, 60%, 0.7);
            --glow-secondary: hsla(var(--hue-warning-amber), 85%, 60%, 0.6);
            --glow-tertiary: hsla(var(--hue-sentinel-green), 85%, 55%, 0.5);
            
            --scan-line: hsla(var(--hue-axiom-cyan), 50%, 80%, 0.07);
            --text-primary: hsla(var(--hue-axiom-cyan), 90%, 85%, 0.95);
            --text-secondary: hsla(var(--hue-axiom-cyan), 70%, 70%, 0.8);
            
            --hologram-glow: 0 0 25px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.6), 0 0 40px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.3);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* --- KEYFRAME ANIMATIONS --- */
        @keyframes interfaceBoot {
            0% { opacity: 0; transform: scale(0.96); filter: blur(3px); }
            80% { opacity: 1; filter: blur(0); }
            100% { transform: scale(1); }
        }
        @keyframes scanLine {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes textFlicker {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--glow-primary); }
            50% { opacity: 0.85; text-shadow: 0 0 8px var(--glow-primary); }
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulseBorder {
            0%, 100% { border-color: hsla(var(--hue-axiom-cyan), 80%, 70%, 0.3); }
            50% { border-color: hsla(var(--hue-axiom-cyan), 90%, 80%, 0.6); }
        }
        @keyframes glitchAppear {
            0% { opacity: 0; clip-path: inset(50% 0 50% 0); }
            40% { opacity: 0.8; clip-path: inset(50% 0 50% 0); }
            50% { clip-path: inset(20% 0 60% 0); }
            70% { clip-path: inset(40% 0 10% 0); }
            100% { opacity: 1; clip-path: inset(0 0 0 0); }
        }
        @keyframes drawCorner { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }

        /* --- CORE LAYOUT & BACKGROUND --- */
        body {
            background-color: var(--bg-deep-space);
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow: auto; /* Allow scrolling */
            position: relative;
            text-shadow: 0 0 5px var(--glow-primary);
        }
        
        #shader-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Sits behind UI but in front of body bg */
            display: block;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: 2; /* Sits on top of shader */
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 15% 85%, hsla(var(--hue-quantum-violet), 50%, 30%, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 15%, hsla(var(--hue-axiom-cyan), 60%, 25%, 0.35) 0%, transparent 60%);
            opacity: 0.7;
            animation: textFlicker 20s infinite alternate;
        }

        body::before { /* Grid */
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(20, 80, 120, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(20, 80, 120, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: 0;
        }

        body::after { /* Scanline */
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: var(--scan-line);
            z-index: 12;
            box-shadow: 0 0 15px var(--glow-primary);
            animation: scanLine 7s linear infinite;
            opacity: 0.8;
            pointer-events: none;
        }

        /* --- MAIN UI WRAPPER --- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            animation: interfaceBoot 1.5s ease-out forwards;
        }

        /* --- MAIN INTERFACE FRAME --- */
        .interface-container {
            position: relative;
            padding: 2rem;
            background-color: hsla(var(--hue-quantum-violet), 30%, 8%, 0.85);
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 70%, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 40px hsla(var(--hue-axiom-cyan), 70%, 40%, 0.25), inset 0 0 25px hsla(var(--hue-quantum-violet), 70%, 5%, 0.9);
            backdrop-filter: blur(8px);
            animation: pulseBorder 6s infinite;
            max-width: 1000px;
            width: 100%;
            display: flex;
            gap: 2rem;
        }

        /* Decorative Corner Brackets */
        .corner-bracket {
            position: absolute;
            width: 25px;
            height: 25px;
            stroke: var(--accent-primary);
            stroke-width: 2px;
            fill: none;
            stroke-dasharray: 200;
            animation: drawCorner 2s ease-out 0.5s forwards;
        }
        .corner-bracket.top-left { top: -2px; left: -2px; }
        .corner-bracket.top-right { top: -2px; right: -2px; transform: rotate(90deg); }
        .corner-bracket.bottom-left { bottom: -2px; left: -2px; transform: rotate(-90deg); }
        .corner-bracket.bottom-right { bottom: -2px; right: -2px; transform: rotate(180deg); }

        /* --- HEADER & STATUS --- */
        .interface-header {
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 1rem;
            border-bottom: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            animation: textFlicker 8s infinite;
        }
        .interface-header h1 {
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--text-primary);
            text-transform: uppercase;
        }
        .interface-header .subtitle {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        /* --- LAUNCHER & BRIEFING COLUMNS --- */
        .launcher-column { flex: 0 0 300px; }
        .briefing-column { flex: 1; }

        /* --- GAME ORBS --- */
        .game-launchers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        .game-orb {
            width: 110px; height: 125px;
            background: linear-gradient(160deg, hsla(var(--hue-quantum-violet), 70%, 12%, 0.8), hsla(var(--hue-axiom-cyan), 70%, 18%, 0.7));
            position: relative;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Oxanium', sans-serif;
            text-align: center;
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.3);
            box-shadow: 0 0 10px hsla(var(--hue-axiom-cyan), 80%, 50%, 0.1), inset 0 0 15px hsla(var(--hue-quantum-violet), 70%, 10%, 0.9);
            will-change: transform, box-shadow;
        }
        .game-orb:hover, .game-orb:focus-visible {
            outline: none;
            transform: translateY(-10px) scale(1.1);
            background: linear-gradient(160deg, hsla(var(--hue-quantum-violet), 80%, 18%, 0.9), hsla(var(--hue-axiom-cyan), 80%, 25%, 0.8));
            box-shadow: 0 0 20px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.5), 0 0 35px hsla(var(--hue-axiom-cyan), 90%, 60%, 0.3), inset 0 0 20px hsla(var(--hue-axiom-cyan), 80%, 30%, 0.3);
            border-color: hsla(var(--hue-axiom-cyan), 90%, 75%, 0.6);
        }
        .game-orb:active {
            transform: translateY(-5px) scale(1.05);
            transition-duration: 0.1s;
        }
        .game-orb .orb-icon {
            font-size: 2.5rem; line-height: 1; margin-bottom: 12px;
            filter: drop-shadow(0 0 6px var(--glow-primary));
            transition: transform 0.3s ease;
        }
        .game-orb:hover .orb-icon { transform: scale(1.15); }
        .orb-label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-primary); font-weight: 600;
            transition: color 0.3s ease;
            padding: 0 5px;
        }
        .orb-label .core-id {
            display: block; font-size: 0.55rem; color: var(--text-secondary);
            opacity: 0; transition: opacity 0.3s ease; margin-top: 4px;
        }
        .game-orb:hover .orb-label .core-id { opacity: 1; }

        /* --- MISSION BRIEFING PANEL --- */
        .mission-briefing {
            background: hsla(var(--hue-quantum-violet), 25%, 10%, 0.5);
            border: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            height: 100%;
            position: relative;
        }
        #briefing-title {
            color: var(--accent-secondary);
            font-family: 'Oxanium', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 0 8px var(--glow-secondary);
        }
        #briefing-text, #briefing-data {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        #briefing-data {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            font-size: 0.8rem;
            white-space: pre;
        }
        .typewriter-cursor {
            display: inline-block;
            width: 10px;
            background-color: var(--accent-primary);
            animation: textFlicker 1s infinite;
        }

        /* --- SYSTEM STATUS FOOTER --- */
        .system-status {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid hsla(var(--hue-axiom-cyan), 80%, 60%, 0.15);
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        #status-text::before {
            content: 'SYS_STATUS::';
            color: hsla(var(--hue-sentinel-green), 90%, 70%, 0.8);
            margin-right: 8px;
        }
        
        /* --- OVERLAYS & MODALS --- */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(10, 10, 25, 0.98);
            z-index: 200;
            transition: opacity 0.5s ease;
        }
        #play-button {
            background: linear-gradient(45deg, var(--accent-primary), hsl(var(--hue-axiom-cyan), 95%, 70%));
            color: var(--bg-deep-space);
            font-family: 'Oxanium', sans-serif;
            font-size: 2rem;
            padding: 1rem 3rem;
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 25px var(--glow-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--glow-primary);
        }
        #play-overlay .prompt-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        /* Alien Transmission Overlay */
        #alien-transmission {
            color: hsl(var(--hue-sentinel-green), 90%, 60%);
            text-shadow: 0 0 10px var(--glow-tertiary);
            font-size: 1.5rem;
            line-height: 1.2;
            text-align: center;
            padding: 2rem;
            font-family: monospace;
            animation: glitchAppear 1s forwards, textFlicker 2s infinite;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 850px) {
            .main-wrapper {
                align-items: flex-start;
                padding-top: 5vh;
                padding-bottom: 5vh;
            }
            .interface-container {
                flex-direction: column;
            }
            .launcher-column { flex: 1; }
        }
        @media (max-width: 480px) {
            .main-wrapper { padding: 1rem; }
            .interface-container { padding: 1rem; }
            .game-launchers { gap: 15px; }
            .game-orb { width: 90px; height: 105px; }
            .game-orb .orb-icon { font-size: 2rem; }
            .orb-label { font-size: 0.65rem; }
            .interface-header h1 { font-size: 1rem; }
            #briefing-title { font-size: 1rem; }
            #briefing-text, #briefing-data { font-size: 0.8rem; }
            .system-status { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <canvas id="shader-canvas"></canvas>

    <div class="background-overlay"></div>

    <div id="play-overlay" class="overlay">
        <button id="play-button">Engage</button>
        <div class="prompt-text">Initialize Axiom Core</div>
    </div>

    <div id="boot-overlay" class="overlay" style="opacity: 0; pointer-events: none;">
        <div id="boot-message" style="font-size: 1.2rem; letter-spacing: 2px;">Establishing Quantum Link...</div>
    </div>

    <div id="alien-transmission" class="overlay" style="display: none;"></div>
    
    <main class="main-wrapper" style="visibility: hidden;">
        <div class="interface-container">
            <svg class="corner-bracket top-left" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket top-right" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket bottom-left" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>
            <svg class="corner-bracket bottom-right" viewBox="0 0 100 100"><polyline points="0,100 0,0 100,0"></polyline></svg>

            <section class="launcher-column">
                <header class="interface-header">
                    <h1>AXIOM CORE</h1>
                    <div class="subtitle">Simulation & Strategy Interface</div>
                </header>

                <div class="game-launchers">
                    </div>

                <footer class="system-status">
                    <div id="status-text">SYSTEM NOMINAL</div>
                    <div id="system-clock"></div>
                </footer>
            </section>

            <section class="briefing-column">
                <div class="mission-briefing">
                    <svg class="corner-bracket top-left" style="width:20px;height:20px;stroke-width:1px;"><polyline points="0,100 0,0 100,0"></polyline></svg>
                    <svg class="corner-bracket top-right" style="width:20px;height:20px;stroke-width:1px;"><polyline points="0,100 0,0 100,0"></polyline></svg>
                    
                    <h2 id="briefing-title">SELECT SCENARIO</h2>
                    <p id="briefing-text">Awaiting directive... Hover over a simulation orb to view mission parameters.<span class="typewriter-cursor">&nbsp;</span></p>
                    <div id="briefing-data"></div>
                </div>
            </section>
        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- CORE ELEMENTS ---
        const playButton = document.getElementById('play-button');
        const playOverlay = document.getElementById('play-overlay');
        const bootOverlay = document.getElementById('boot-overlay');
        const mainWrapper = document.querySelector('.main-wrapper');
        const gameLaunchersContainer = document.querySelector('.game-launchers');
        const briefingTitle = document.getElementById('briefing-title');
        const briefingText = document.getElementById('briefing-text');
        const briefingData = document.getElementById('briefing-data');
        const statusText = document.getElementById('status-text');
        const systemClock = document.getElementById('system-clock');

        // --- AUDIO ASSETS (placeholders) ---
        const sfx = {
            boot: new Audio('./sfx/boot_sequence.mp3'),
            hover: new Audio('./sfx/ui_hover.mp3'),
            launch: new Audio('./sfx/sim_launch.mp3'),
            glitch: new Audio('./sfx/transmission_glitch.mp3'),
        };
        Object.values(sfx).forEach(sound => { sound.volume = 0.3; });
        sfx.hover.volume = 0.1;
        sfx.launch.volume = 0.4;
        
        // --- DATA (WITH ORIGINAL LINKS RESTORED) ---
        const gameData = [
            { id: 'CTN-6382', name: 'ORDINARY RECYCLING', icon: '☣️', url: './ordinary-recycling/index.html', brief: 'A critical radiation leak has been detected in Sector-Gamma. Deploy containment fields to isolate and neutralize the anomaly before a cascading failure occurs.', dataStream: 'STATUS: CRITICAL\nTHREAT: Unstable Particle Decay\nOBJECTIVE: Deploy & Maintain Fields' },
            { id: 'DEF-9104', name: 'ORDINARY DEFENSE', icon: '🛡️', url: 'https://upit.com/up/OrdinaryDefense1', brief: 'Hostile signatures detected on approach vector. Man the Aegis Defense Grid, manage power distribution, and repel all incoming threats. Station integrity is paramount.', dataStream: 'STATUS: HIGH-ALERT\nTHREAT: Unknown Hostiles\nOBJECTIVE: Repel All Waves' },
            { id: 'HIV-3571', name: 'ORD-TECH MARS BETA', icon: '🐝', url: './game/index.html', brief: 'The Swarm exhibits complex, coordinated behavior. Interface with the Hive-Mind Prediction engine to analyze their patterns and anticipate their next strategic move.', dataStream: 'STATUS: ANALYTICAL\nTHREAT: Bio-Mechanical Swarm\nOBJECTIVE: Forecast Swarm Trajectory' },
            { id: 'VID-7294', name: 'Navigate', icon: '🌌', url: './game2/index.html', brief: 'Navigate your scout vessel through the treacherous asteroid field of the Kepler-Abyss. Use sensor data to plot a safe course, manage fuel, and reach the extraction point.', dataStream: 'STATUS: HAZARDOUS\nTHREAT: Gravitational Anomalies\nOBJECTIVE: Navigate to Beacon' },
            { id: 'HYD-1853', name: 'HydroFlux', icon: '💧', url: './new_game_1/index.html', brief: 'The station\'s primary life support cooler is failing. Reroute cryo-fluid through auxiliary conduits to prevent a core meltdown. Every second counts.', dataStream: 'STATUS: URGENT\nTHREAT: Core Overheating\nOBJECTIVE: Stabilize Coolant Flow' },
            { id: 'RFT-4276', name: 'RiftRun', icon: '💎', url: './new_game_2/index.html', brief: 'A rare crystalline formation has been detected in an unstable subspace rift. Pilot a mining drone, extract the maximum yield, and escape before the rift collapses.', dataStream: 'STATUS: UNSTABLE\nTHREAT: Rift Collapse Imminent\nOBJECTIVE: Extract Resources & Escape' },
        ];

        let typeWriterTimeout, dataStreamInterval;

        // --- UI INITIALIZATION ---
        function initInterface() {
            playOverlay.style.opacity = '0';
            playOverlay.style.pointerEvents = 'none';
            bootOverlay.style.opacity = '1';
            bootOverlay.style.pointerEvents = 'auto';

            playSound(sfx.boot);
            startShaderScene(); // Start the shader when the interface initializes

            setTimeout(() => {
                bootOverlay.style.opacity = '0';
                bootOverlay.style.pointerEvents = 'none';
                mainWrapper.style.visibility = 'visible';
                populateLaunchers();
                startSystemMonitors();
            }, 2500);
        }

        function populateLaunchers() {
            gameData.forEach(game => {
                const orb = document.createElement('button');
                orb.className = 'game-orb';
                orb.dataset.id = game.id;
                orb.innerHTML = `
                    <div class="orb-icon">${game.icon}</div>
                    <div class="orb-label">
                        ${game.name}
                        <span class="core-id">CORE ID: ${game.id}</span>
                    </div>
                `;
                gameLaunchersContainer.appendChild(orb);
            });
            addEventListeners();
        }

        // --- DYNAMIC CONTENT & EFFECTS ---
        function updateBriefing(gameId) {
            const game = gameData.find(g => g.id === gameId);
            if (!game) return;
            briefingTitle.textContent = game.name;
            clearTimeout(typeWriterTimeout);
            clearInterval(dataStreamInterval);
            briefingText.innerHTML = '';
            let i = 0;
            function typeWriter() {
                if (i < game.brief.length) {
                    briefingText.innerHTML += game.brief.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(typeWriter, 15);
                } else {
                    briefingText.innerHTML = game.brief;
                    startDataStream(game.dataStream);
                }
            }
            typeWriter();
        }

        function startDataStream(data) {
            const lines = data.split('\n');
            let currentLine = 0;
            briefingData.innerHTML = '';
            dataStreamInterval = setInterval(() => {
                if (currentLine < lines.length) {
                    briefingData.innerHTML += lines[currentLine] + '\n';
                    currentLine++;
                } else { clearInterval(dataStreamInterval); }
            }, 400);
        }

        function resetBriefing() {
            clearTimeout(typeWriterTimeout);
            clearInterval(dataStreamInterval);
            briefingTitle.textContent = 'SELECT SCENARIO';
            briefingText.innerHTML = 'Awaiting directive... Hover over a simulation orb to view mission parameters.<span class="typewriter-cursor">&nbsp;</span>';
            briefingData.textContent = '';
        }

        // --- SYSTEM MONITORS & RANDOM EVENTS ---
        function startSystemMonitors() {
            setInterval(() => {
                const now = new Date();
                systemClock.textContent = `UTC ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            }, 1000);
            const statuses = ['SYSTEM NOMINAL', 'QUANTUM LINK STABLE', 'ALL CHANNELS OPEN', 'MONITORING FOR ANOMALIES', 'WARNING: ENERGY FLUX DETECTED'];
            let statusIndex = 0;
            setInterval(() => {
                statusIndex = (statusIndex + 1) % statuses.length;
                const newStatus = statuses[statusIndex];
                statusText.textContent = newStatus;
                statusText.style.color = newStatus.includes('WARNING') ? 'var(--accent-secondary)' : 'hsla(var(--hue-sentinel-green), 90%, 70%, 0.8)';
            }, 7000);
            setInterval(() => {
                if (Math.random() < 0.1) { triggerAlienTransmission(); }
            }, 20000);
        }
        
        function triggerAlienTransmission() {
            const transmissionOverlay = document.getElementById('alien-transmission');
            const messages = ['⏁⊑⟒ ⎐⍜⟟⎅ ⌇⏁⏃⍀⟒⌇ ⏚⏃☊☍', 'WE SEE YOU', 'THEY ARE COMING', 'SIGNAL LOST... ORIGIN UNKNOWN', '...IS ANYONE THERE...?'];
            transmissionOverlay.textContent = messages[Math.floor(Math.random() * messages.length)];
            transmissionOverlay.style.display = 'flex';
            playSound(sfx.glitch);
            setTimeout(() => { transmissionOverlay.style.display = 'none'; }, 3000 + Math.random() * 2000);
        }

        // --- EVENT HANDLERS ---
        function addEventListeners() {
            playButton.addEventListener('click', initInterface);
            document.querySelectorAll('.game-orb').forEach(orb => {
                orb.addEventListener('mouseenter', () => { playSound(sfx.hover); updateBriefing(orb.dataset.id); });
                orb.addEventListener('click', () => {
                    const game = gameData.find(g => g.id === orb.dataset.id);
                    if (game && game.url) { playSound(sfx.launch); window.open(game.url, '_blank', 'noopener,noreferrer'); }
                });
            });
            gameLaunchersContainer.addEventListener('mouseleave', resetBriefing);
        }

        function playSound(audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        addEventListeners();

        // --- SHADER SCENE LOGIC (RESTORED) ---
        const fragShaders = [
            `precision mediump float;
            uniform float u_time;
            uniform vec2 u_res;
            uniform vec2 u_mouse;
            float random(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
            float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 uu = f * f * (3.0 - 2.0 * f); return mix(a, b, uu.x) + (c - a) * uu.y * (1.0 - uu.x) + (d - b) * uu.x * uu.y; }
            float fbm(vec2 p) { float f = 0.0; float amp = 0.5; for(int i=0;i<6;i++) { f += amp * noise(p); p *= 2.0; amp *= 0.55; } return f; }
            vec2 curl(vec2 p, float t) { float eps = 0.01; float n1 = fbm(p + vec2(0.0, eps) + t); float n2 = fbm(p - vec2(0.0, eps) + t); float a = (n1 - n2) / (2.0 * eps); n1 = fbm(p + vec2(eps, 0.0) + t); n2 = fbm(p - vec2(eps, 0.0) + t); float b = (n1 - n2) / (2.0 * eps); return vec2(a, -b); }
            void main() { vec2 uv = gl_FragCoord.xy / u_res.xy; uv = uv * 2.0 - 1.0; uv.x *= u_res.x / u_res.y; vec2 mouse = (u_mouse / u_res) * 2.0 - 1.0; mouse.y = -mouse.y; uv += mouse * 0.13; float r = length(uv); float vignette = smoothstep(0.95, 0.7, 1.0 - r); float rim = smoothstep(0.98, 0.95, 1.0 - r) - smoothstep(1.0, 0.98, 1.0 - r); float glass = smoothstep(0.99, 0.97, 1.0 - r); float cycle = mod(u_time, 60.0); float speed = 0.08 + 0.18 * pow(sin(3.14159 * cycle / 60.0), 2.0); float t = u_time * speed; vec2 flow = curl(uv * 1.2, t * 0.25); vec2 flow2 = curl(uv * 2.5 + flow * 0.5, t * 0.4); vec2 adv_uv = uv + flow * 0.18 + flow2 * 0.09; float fog = fbm(adv_uv * 2.7 + t * 0.18) * 0.7 + fbm(adv_uv * 7.0 - t * 0.12) * 0.3; float fog2 = fbm(adv_uv * 1.2 - t * 0.09 + 10.0) * 0.5; float deep = pow(fog, 2.0) * 1.2 + pow(fog2, 1.5) * 0.7; vec3 fogCol = mix(vec3(0.04,0.05,0.08), vec3(0.18,0.22,0.28), deep); fogCol = mix(fogCol, vec3(0.45,0.48,0.55), pow(deep,1.7)); fogCol = mix(fogCol, vec3(0.7,0.8,0.95), pow(deep,3.5)); float streaks = sin(adv_uv.y * 18.0 + t * 1.2) * 0.12 + sin(adv_uv.x * 24.0 - t * 0.7) * 0.08; fogCol += streaks * vec3(0.18,0.22,0.35); vec2 planetPos = vec2(-0.38 + 0.09*sin(t*0.18), -0.22 + 0.07*cos(t*0.13)); float planetR = 0.33; float d = length(uv - planetPos); float planet = smoothstep(planetR, planetR-0.03, d); float atmo = smoothstep(planetR+0.04, planetR, d); vec3 planetCol = mix(vec3(0.08,0.09,0.13), vec3(0.18,0.19,0.22), 0.7 + 0.3*sin(t*0.2)); planetCol += atmo * vec3(0.18,0.22,0.35) * 0.3; fogCol = mix(fogCol, planetCol, planet); fogCol += atmo * 0.08; vec3 rimCol = mix(vec3(0.18,0.19,0.22), vec3(0.38,0.41,0.45), 0.5 + 0.5*sin(u_time*0.1)); fogCol = mix(fogCol, rimCol, rim); fogCol += glass * vec3(0.7,0.8,0.95) * 0.04 * (0.7 + 0.3*sin(u_time)); fogCol *= vignette; fogCol *= 0.98 + 0.02*sin(gl_FragCoord.y*2.0 + u_time*2.0); gl_FragColor = vec4(fogCol, 1.0); }`,
            `precision mediump float;
            uniform float u_time;
            uniform vec2 u_res;
            float random(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
            float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
            float fbm(vec2 p) { float f = 0.0; float amp = 0.5; for(int i=0;i<5;i++) { f += amp * noise(p); p *= 2.0; amp *= 0.5; } return f; }
            void main() { vec2 uv = gl_FragCoord.xy / u_res.xy; uv = uv * 2.0 - 1.0; uv.x *= u_res.x / u_res.y; float t = u_time * 0.12; float n = fbm(uv * 2.5 + t); float n2 = fbm(uv * 6.0 - t * 0.7); float neb = n * 0.7 + n2 * 0.3; float colorShift = 0.5 + 0.5 * sin(u_time * 0.1); vec3 col = mix(vec3(0.08,0.09,0.13), vec3(0.2,0.3,0.5), neb); col = mix(col, vec3(0.7,0.4,0.9), pow(neb,2.0) * colorShift); col = mix(col, vec3(0.9,0.8,0.5), pow(neb,3.0) * (1.0-colorShift)); float stars = 0.0; for (int i = 0; i < 30; i++) { float a = float(i) * 12.0; float r = 0.5 + float(i) * 0.022; vec2 pos = vec2(cos(a + t * float(i)), sin(a + t * float(i))) * r; float d = length(uv - pos); stars += smoothstep(0.01, 0.0, d); } col += stars * vec3(1.0,1.0,1.0); float vign = smoothstep(1.0, 0.7, 1.0 - length(uv)); col *= vign; gl_FragColor = vec4(col, 1.0); }`
        ];

        function startShaderScene() {
            const canvas = document.getElementById('shader-canvas');
            if (!canvas) return;
            const gl = canvas.getContext('webgl');
            if (!gl) { console.error("WebGL not supported!"); return; }

            let currentShaderIdx = 0;
            let shaderSwitchTime = 60; // seconds
            let lastSwitch = 0;
            let prog, u_time, u_res, u_mouse;
            let mouse = [0, 0];

            function createShader(type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            function compileProgram(idx) {
                if (prog) gl.deleteProgram(prog);
                const vsSource = `attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;
                const fsSource = fragShaders[idx];
                const vs = createShader(gl.VERTEX_SHADER, vsSource);
                const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
                if (!vs || !fs) return false;
                
                prog = gl.createProgram();
                gl.attachShader(prog, vs);
                gl.attachShader(prog, fs);
                gl.linkProgram(prog);

                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
                    console.error('Program link error:', gl.getProgramInfoLog(prog));
                    return false;
                }
                
                gl.useProgram(prog);
                const posBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                const posLoc = gl.getAttribLocation(prog, 'a_position');
                gl.enableVertexAttribArray(posLoc);
                gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

                u_time = gl.getUniformLocation(prog, 'u_time');
                u_res = gl.getUniformLocation(prog, 'u_res');
                u_mouse = gl.getUniformLocation(prog, 'u_mouse');
                return true;
            }
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }

            window.addEventListener('resize', resize);
            document.addEventListener('mousemove', e => {
                mouse = [e.clientX, canvas.height - e.clientY];
            });
            
            resize();
            compileProgram(currentShaderIdx);

            let startTime = 0;
            function render(timestamp) {
                if(!startTime) startTime = timestamp;
                const t = (timestamp - startTime) * 0.001;
                
                if (t - lastSwitch > shaderSwitchTime) {
                    currentShaderIdx = (currentShaderIdx + 1) % fragShaders.length;
                    compileProgram(currentShaderIdx);
                    lastSwitch = t;
                }
                
                gl.uniform1f(u_time, t);
                gl.uniform2f(u_res, canvas.width, canvas.height);
                if(u_mouse) gl.uniform2fv(u_mouse, mouse);
                
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
    });
    </script>
