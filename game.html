<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimension // SteamCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Future Steam Palette (Dark base, Neon Accents) */
            --bg-deep: #030508;
            --bg-mid: #0a0e14;
            --ui-base: hsla(220, 30%, 10%, 0.7); /* Semi-transparent dark blue */
            --border-dim: hsla(180, 70%, 30%, 0.4); /* Dim cyan */
            --border-glow: hsla(180, 95%, 65%, 0.9); /* Bright cyan */
            --accent-glow: hsla(300, 90%, 60%, 0.8); /* Magenta */
            --text-color: hsla(210, 50%, 85%, 0.9);
            --text-title: hsla(0, 0%, 100%, 1);
            --text-accent: var(--border-glow);

            /* Uncanny Geometry & Timing */
            --card-skew: -3deg;
            --perspective-val: 1200px;
            --transition-fast: 0.2s;
            --transition-med: 0.4s;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-color);
            font-family: 'Oxanium', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Background Grid/Data Effect */
        .background-grid {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(var(--bg-mid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-mid) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: bgGridPulse 15s linear infinite;
        }
        .background-grid::before { /* Faint diagonal lines */
            content: ''; position: absolute; inset: 0;
            background-image: repeating-linear-gradient(
                45deg,
                hsla(220, 20%, 15%, 0.1) 0,
                hsla(220, 20%, 15%, 0.1) 1px,
                transparent 1px,
                transparent 10px
            );
             opacity: 0.5;
        }

        @keyframes bgGridPulse {
            0% { background-position: 0 0; opacity: 0.8; }
            50% { background-position: 10px 10px; opacity: 1; }
            100% { background-position: 0 0; opacity: 0.8; }
        }

        /* Main Container with Perspective */
        .dimension-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 1000px; /* Wider layout */
            perspective: var(--perspective-val);
        }

        /* Game Card Grid - Uncanny Layout via Grid + Transforms */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* Responsive grid */
            gap: 25px;
            transform-style: preserve-3d; /* Needed for child transforms */
            transform: rotateX(10deg) rotateY(-5deg); /* Slight tilt to container */
        }

        /* Individual Game Card */
        .game-card {
            background: var(--ui-base);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-dim);
            border-radius: 4px; /* Sharp corners */
            padding: 15px;
            text-decoration: none; /* Remove underline from link */
            color: var(--text-color);
            display: block; /* Make the <a> a block */
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform var(--transition-med) ease-out,
                        box-shadow var(--transition-med) ease-out,
                        border-color var(--transition-med) ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0, 0.3);
            cursor: pointer;
            outline: none;
        }

        /* Assign slightly different transforms for uncanniness */
        .game-card:nth-child(1) { transform: translateZ(10px) rotateY(2deg) skewX(var(--card-skew)); }
        .game-card:nth-child(2) { transform: translateZ(-5px) rotateY(-1deg) skewX(var(--card-skew)); }
        .game-card:nth-child(3) { transform: translateZ(5px) rotateY(1deg) skewX(var(--card-skew)); }
        .game-card:nth-child(4) { transform: translateZ(-10px) rotateY(-2deg) skewX(var(--card-skew)); }
        .game-card:nth-child(5) { transform: translateZ(0px) rotateY(0deg) skewX(var(--card-skew)); }
        .game-card:nth-child(6) { transform: translateZ(8px) rotateY(1.5deg) skewX(var(--card-skew)); }

        /* Hover/Focus Effect */
        .game-card:hover,
        .game-card:focus-visible {
            border-color: var(--border-glow);
            transform: translateZ(40px) scale(1.03); /* Lift forward and scale slightly */
            box-shadow: 0 15px 35px rgba(0,0,0, 0.4), 0 0 20px var(--border-glow);
        }
        .game-card:focus-visible {
             box-shadow: 0 15px 35px rgba(0,0,0, 0.4), 0 0 20px var(--border-glow), 0 0 0 2px var(--border-glow); /* Extra focus ring */
        }


        /* Card Glow Effect (Pseudo-element) */
        .game-card::before {
            content: '';
            position: absolute;
            inset: -1px; /* Cover border */
            background: radial-gradient(ellipse at center, hsla(180, 95%, 65%, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-med) ease-out;
            z-index: 0; /* Behind content */
            transform: translateZ(-1px); /* Ensure it's behind */
        }
        .game-card:hover::before,
        .game-card:focus-visible::before {
            opacity: 1;
        }

        /* Card Content Area */
        .card-content {
             position: relative; z-index: 1; /* Above pseudo-element */
        }

        /* Game Title */
        .card-title {
            font-family: 'Orbitron', sans-serif; /* More blocky/tech font */
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-title);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--accent-glow);
            white-space: nowrap; /* Prevent wrapping */
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Placeholder for Game Image/Visual */
        .card-visual {
            height: 100px; /* Fixed height for visual area */
            background-color: hsla(220, 20%, 15%, 0.5); /* Placeholder color */
            margin-bottom: 12px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem; /* Icon size */
            color: var(--border-dim);
            transition: color var(--transition-med) ease;
            border: 1px dashed hsla(220, 20%, 30%, 0.3);
        }
        .game-card:hover .card-visual,
        .game-card:focus-visible .card-visual {
            color: var(--border-glow);
            border-color: hsla(180, 95%, 65%, 0.2);
        }


        /* Launch Text */
        .card-launch {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-accent);
            opacity: 0.8;
            transition: opacity var(--transition-fast) ease, color var(--transition-fast) ease;
            letter-spacing: 0.5px;
            text-align: right; /* Align to the right */
        }
         .card-launch::after {
             content: ' »'; /* Arrow indicator */
             display: inline-block;
             transition: transform var(--transition-fast) ease;
         }

        .game-card:hover .card-launch,
        .game-card:focus-visible .card-launch {
            opacity: 1;
            color: var(--text-title);
        }
         .game-card:hover .card-launch::after,
         .game-card:focus-visible .card-launch::after {
            transform: translateX(3px);
         }

        /* Responsive */
        @media (max-width: 768px) {
            .game-grid {
                 grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                 gap: 20px;
                 transform: rotateX(5deg) rotateY(-2deg); /* Less tilt on mobile */
            }
             .card-title { font-size: 1rem; }
             .card-visual { height: 80px; font-size: 2rem; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
             .game-grid {
                  grid-template-columns: 1fr; /* Single column */
                  gap: 15px;
                  transform: none; /* No tilt on very small screens */
             }
             .dimension-container { perspective: none; } /* No perspective needed */
             .game-card { transform: skewX(var(--card-skew)); } /* Keep skew, remove Z/Y */
             .game-card:hover,
             .game-card:focus-visible {
                 transform: translateZ(0px) scale(1.03) skewX(var(--card-skew)); /* Adjust hover */
             }
        }

    </style>
</head>
<body>
