<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Arcade Site Test</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .game-wrapper { margin: 40px auto; max-width: 800px; }
        iframe { border: 4px solid #334155; border-radius: 12px; background: black; }
    </style>
</head>
<body>

    <h1>Arcade Live Test Room</h1>
    <p>If these load up, your server can host them using this exact code.</p>

    <div class="game-wrapper">
        <h3>Minecraft Classic (WebGL)</h3>
        <iframe 
            src="https://classic.minecraft.net/" 
            width="800" 
            height="500" 
            allow="autoplay; keyboard; pointer-lock" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="game-wrapper">
        <h3>Slope 3D</h3>
        <iframe 
            src="https://interstellar-6x.github.io/g7/slope/" 
            width="800" 
            height="500" 
            allow="autoplay; keyboard" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
