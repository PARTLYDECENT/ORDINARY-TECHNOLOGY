<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEROSPACE HAPTIC PIANO - // MISSION CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050914;
            --panel-bg: rgba(15, 20, 35, 0.85);
            --accent-neon: #00e5ff;
            --accent-alert: #ff2a2a;
            --accent-warn: #ffaa00;
            --text-main: #e0e6ed;
            --text-muted: #6b7c93;
            --grid-color: rgba(0, 229, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* Scanline Effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%,
                    rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.3;
        }

        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .hud-title {
            font-size: 1.2rem;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 8px 15px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            z-index: 10;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .main-container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-top: 60px;
        }

        /* Target Panel Styling */
        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 4px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Corner reticles for panels */
        .panel::before,
        .panel::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--accent-neon);
            pointer-events: none;
        }

        .panel::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .panel::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .piano-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .instrument-label {
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: rgba(0, 255, 170, 0.2);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            border-radius: 2px;
        }

        /* The Keyboard */
        .piano-keyboard {
            position: relative;
            display: flex;
            justify-content: center;
            height: 250px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            user-select: none;
            overflow-x: auto;
        }

        .key {
            position: relative;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 10px;
            font-family: 'Share Tech Mono', monospace;
            padding-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .white-key {
            width: 55px;
            height: 220px;
            background: #e0e6ed;
            border: 1px solid #999;
            color: #333;
            margin: 0 2px;
            z-index: 1;
            border-radius: 0 0 4px 4px;
        }

        .black-key {
            width: 35px;
            height: 140px;
            background: #111;
            border: 1px solid #444;
            color: #888;
            position: absolute;
            z-index: 2;
            border-radius: 0 0 4px 4px;
        }

        .key:hover {
            box-shadow: 0 0 15px var(--accent-neon);
        }

        .key.active {
            transform: translateY(4px);
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-neon);
        }

        .white-key.active {
            background: #fff;
            border-color: var(--accent-neon);
            color: var(--accent-neon);
        }

        .black-key.active {
            background: #222;
            border-color: var(--accent-neon);
            color: var(--accent-neon);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .aero-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 10px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .aero-btn:hover {
            background: rgba(0, 229, 255, 0.2);
        }

        .aero-btn.alert {
            border-color: var(--accent-alert);
            color: var(--accent-alert);
        }

        .aero-btn.alert:hover {
            background: rgba(255, 42, 42, 0.2);
        }

        .aero-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
            color: var(--text-main);
            padding: 10px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .aero-select:focus {
            border-color: var(--accent-neon);
        }

        /* Telemetry Panel */
        .telemetry-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            font-size: 0.85rem;
        }

        .data-value {
            color: var(--accent-neon);
        }

        .waveform-visualizer {
            height: 100px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .sine-wave {
            width: 100%;
            height: 2px;
            background: var(--accent-neon);
            position: absolute;
            box-shadow: 0 0 10px var(--accent-neon);
            transition: all 0.1s;
        }

        .sine-wave.active {
            animation: wave-pulse 0.1s infinite alternate;
        }

        @keyframes wave-pulse {
            0% {
                transform: scaleY(1);
                opacity: 0.5;
            }

            100% {
                transform: scaleY(15);
                opacity: 1;
                filter: hue-rotate(45deg);
            }
        }

        /* Alien Mode Styles */
        @keyframes rainbow-border {
            0% {
                border-color: #ff0000;
                box-shadow: 0 0 15px #ff0000;
            }

            33% {
                border-color: #00ff00;
                box-shadow: 0 0 15px #00ff00;
            }

            66% {
                border-color: #0000ff;
                box-shadow: 0 0 15px #0000ff;
            }

            100% {
                border-color: #ff0000;
                box-shadow: 0 0 15px #ff0000;
            }
        }

        .alien-mode .panel {
            animation: rainbow-border 3s linear infinite;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .white-key {
                width: 45px;
                height: 180px;
            }

            .black-key {
                width: 30px;
                height: 110px;
            }
        }
    </style>
</head>

<body>

    <div class="hud-header">
        <div class="hud-title">AEROSPACE HAPTIC PIANO</div>
        <div class="hud-subtitle">SYS.VER: 4.8.2 // STATUS: NOMINAL</div>
    </div>

    <a href="../index.html" class="back-btn">EXIT TERMINAL</a>

    <div class="main-container">

        <!-- PIANO INTERFACE -->
        <div class="panel piano-section">
            <div class="instrument-label">
                <span>PRIMARY INPUT MATRIX</span>
                <span class="status-badge" id="conn-status">LINK ACTIVE</span>
            </div>

            <div class="piano-keyboard" id="piano-keyboard">
                <!-- Keys generated by JS -->
            </div>

            <div class="controls-grid">
                <div class="control-group">
                    <span class="control-label">Tactile Feedback Array</span>
                    <button id="haptic-toggle" class="aero-btn">HAPTICS: ENGAGED</button>
                </div>
                <div class="control-group">
                    <span class="control-label">Frequency Modulation Band</span>
                    <select id="octave-select" class="aero-select">
                        <option value="0.5">LF - Quantum Void</option>
                        <option value="1">LF - Martian Deep</option>
                        <option value="2">LF - Venusian Low</option>
                        <option value="3">MF - Earth Standard</option>
                        <option value="4" selected>MF - Jupiter Core</option>
                        <option value="5">HF - Saturn Rings</option>
                        <option value="6">HF - Uranus Ultra</option>
                        <option value="7">UHF - Neptune</option>
                        <option value="8">UHF - Pluto Cosmic</option>
                        <option value="12">SHF - Andromeda</option>
                        <option value="15">EHF - Galactic Warp</option>
                        <option value="alien">??? - CLASSIFIED</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- TELEMETRY PANEL -->
        <div class="panel telemetry-panel">
            <div class="instrument-label" style="font-size: 1.1rem;">
                <span>TELEMETRY</span>
            </div>

            <div class="waveform-visualizer">
                <div class="sine-wave" id="visualizer-wave"></div>
            </div>

            <div class="data-row">
                <span>LAST SIGNAL:</span>
                <span class="data-value" id="disp-note">NONE</span>
            </div>
            <div class="data-row">
                <span>FREQUENCY:</span>
                <span class="data-value" id="disp-freq">0.00 Hz</span>
            </div>
            <div class="data-row">
                <span>AMPLITUDE:</span>
                <span class="data-value" id="disp-amp">0.00%</span>
            </div>
            <div class="data-row">
                <span>HAPTIC PWR:</span>
                <span class="data-value" id="disp-haptic">N/A</span>
            </div>

            <div style="margin-top: auto;">
                <div class="control-group">
                    <span class="control-label">System Diagnostics</span>
                    <button id="vibrateBtn" class="aero-btn alert">TEST MAX VIBRATION</button>
                    <div id="vibrateStatus"
                        style="font-size: 0.7rem; color: var(--accent-warn); margin-top: 5px; text-align: right; min-height: 12px;">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function () {
            'use strict';

            // Audio context and state
            let audioContext;
            let hapticEnabled = true;
            let currentOctave = 4;
            let alienMode = false;
            let isMobileDevice = false;
            let hapticInitialized = false;

            // Note frequencies (C4 = 261.63 Hz)
            const noteFrequencies = {
                'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13,
                'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G': 392.00,
                'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
            };

            const whiteKeys = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const blackKeys = ['C#', 'D#', null, 'F#', 'G#', 'A#', null];

            // UI Elements
            const dispNote = document.getElementById('disp-note');
            const dispFreq = document.getElementById('disp-freq');
            const dispAmp = document.getElementById('disp-amp');
            const visWave = document.getElementById('visualizer-wave');

            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (!hapticInitialized) {
                    isMobileDevice = 'maxTouchPoints' in navigator && navigator.maxTouchPoints > 0;
                    hapticInitialized = true;
                    const hapticToggle = document.getElementById('haptic-toggle');
                    if (!navigator.vibrate) {
                        hapticToggle.textContent = 'HAPTICS: N/A';
                        hapticToggle.disabled = true;
                        hapticEnabled = false;
                        document.getElementById('disp-haptic').textContent = 'UNAVAILABLE';
                    } else {
                        document.getElementById('disp-haptic').textContent = 'STANDBY';
                    }
                }
                return audioContext;
            }

            function playNote(note, octave = currentOctave) {
                const ctx = initAudio();
                let freq = noteFrequencies[note] * Math.pow(2, octave - 4);

                if (alienMode || octave === 'alien') {
                    freq *= (Math.random() * 0.5 + 0.75);
                    freq += Math.sin(Date.now() * 0.01) * 50;
                }

                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                // Waveform selection
                if (alienMode || octave === 'alien') {
                    const waveforms = ['square', 'sawtooth', 'triangle'];
                    oscillator.type = waveforms[Math.floor(Math.random() * waveforms.length)];
                } else if (octave >= 8) {
                    oscillator.type = 'square';
                } else {
                    oscillator.type = 'triangle';
                }

                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = freq;

                // Envelope
                const now = ctx.currentTime;
                const baseVolume = alienMode ? 0.2 : 0.3;
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(baseVolume, now + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                oscillator.start(now);
                oscillator.stop(now + 0.5);

                // UI Updates
                dispNote.textContent = `${note}${octave === 'alien' ? 'X' : octave}`;
                dispFreq.textContent = `${freq.toFixed(2)} Hz`;
                dispAmp.textContent = `${(baseVolume * 100).toFixed(0)}%`;
                visWave.classList.add('active');
                setTimeout(() => visWave.classList.remove('active'), 150);

                // Haptic execution
                if (hapticEnabled && navigator.vibrate) {
                    let pattern;
                    if (alienMode || octave === 'alien') {
                        pattern = [15, 8, 25, 8, 35];
                        document.getElementById('disp-haptic').textContent = 'ERRATIC';
                    } else if (octave >= 10) {
                        pattern = [8, 4, 8];
                        document.getElementById('disp-haptic').textContent = 'HIGH FREQ';
                    } else if (octave <= 1) {
                        pattern = [120];
                        document.getElementById('disp-haptic').textContent = 'DEEP RUMBLE';
                    } else {
                        pattern = note.includes('#') ? [25] : [40];
                        document.getElementById('disp-haptic').textContent = 'STD PULSE';
                    }
                    try { navigator.vibrate(pattern); } catch (e) { }
                }
            }

            function createKeyboard() {
                const keyboard = document.getElementById('piano-keyboard');
                keyboard.innerHTML = '';

                whiteKeys.forEach((note, index) => {
                    const key = document.createElement('div');
                    key.className = 'key white-key';
                    key.textContent = note;
                    key.dataset.note = note;
                    attachKeyEvents(key);
                    keyboard.appendChild(key);
                });

                blackKeys.forEach((note, index) => {
                    if (note) {
                        const key = document.createElement('div');
                        key.className = 'key black-key';
                        key.textContent = note;
                        key.dataset.note = note;

                        // Positioning for responsiveness needs manual calculation, base off 55px + margin
                        // Approximating based on CSS widths
                        key.style.left = `calc(${index * (100 / 7)}% + ${(100 / 7) / 1.5}%)`;
                        attachKeyEvents(key);
                        keyboard.appendChild(key);
                    }
                });
            }

            function attachKeyEvents(key) {
                key.addEventListener('mousedown', () => activateKey(key));
                key.addEventListener('mouseup', () => deactivateKey(key));
                key.addEventListener('mouseleave', () => deactivateKey(key));
                key.addEventListener('touchstart', (e) => { e.preventDefault(); activateKey(key); });
                key.addEventListener('touchend', (e) => { e.preventDefault(); deactivateKey(key); });
            }

            function activateKey(key) {
                key.classList.add('active');
                playNote(key.dataset.note);
            }
            function deactivateKey(key) {
                key.classList.remove('active');
            }

            function setupControls() {
                const hapticToggle = document.getElementById('haptic-toggle');
                hapticToggle.addEventListener('click', () => {
                    if (!navigator.vibrate) return;
                    hapticEnabled = !hapticEnabled;
                    hapticToggle.textContent = `HAPTICS: ${hapticEnabled ? 'ENGAGED' : 'DISENGAGED'}`;
                    hapticToggle.style.borderColor = hapticEnabled ? 'var(--accent-neon)' : '#666';
                    hapticToggle.style.color = hapticEnabled ? 'var(--accent-neon)' : '#666';
                });

                const octaveSelect = document.getElementById('octave-select');
                octaveSelect.addEventListener('change', (e) => {
                    const val = e.target.value;
                    if (val === 'alien') {
                        alienMode = true;
                        currentOctave = 4;
                        document.body.classList.add('alien-mode');
                        document.getElementById('conn-status').textContent = 'ANOMALY DETECTED';
                        document.getElementById('conn-status').style.color = 'var(--accent-alert)';
                        document.getElementById('conn-status').style.borderColor = 'var(--accent-alert)';
                        document.getElementById('conn-status').style.background = 'rgba(255,42,42,0.2)';
                    } else {
                        alienMode = false;
                        currentOctave = parseFloat(val);
                        document.body.classList.remove('alien-mode');
                        document.getElementById('conn-status').textContent = 'LINK ACTIVE';
                        document.getElementById('conn-status').style.color = '#00ffaa';
                        document.getElementById('conn-status').style.borderColor = '#00ffaa';
                        document.getElementById('conn-status').style.background = 'rgba(0,255,170,0.2)';
                    }
                });
            }

            function setupKeyboard() {
                const keyMap = {
                    'q': 'C', '2': 'C#', 'w': 'D', '3': 'D#', 'e': 'E',
                    'r': 'F', '5': 'F#', 't': 'G', '6': 'G#', 'y': 'A', '7': 'A#', 'u': 'B'
                };
                document.addEventListener('keydown', (e) => {
                    if (e.repeat) return;
                    const note = keyMap[e.key.toLowerCase()];
                    if (note) {
                        const el = document.querySelector(`[data-note="${note}"]`);
                        if (el) activateKey(el);
                    }
                });
                document.addEventListener('keyup', (e) => {
                    const note = keyMap[e.key.toLowerCase()];
                    if (note) {
                        const el = document.querySelector(`[data-note="${note}"]`);
                        if (el) deactivateKey(el);
                    }
                });
            }

            // Max Vibration Test (from old code)
            function setupVibrationTest() {
                const btn = document.getElementById('vibrateBtn');
                const status = document.getElementById('vibrateStatus');
                let isVibing = false;
                let vibTimer;
                const pattern = [800, 200, 1000, 300, 1200, 200, 800, 400, 1500, 300, 1000, 200, 900, 350];

                btn.addEventListener('click', () => {
                    if (!navigator.vibrate) {
                        status.textContent = 'SYS.ERR: HAPTIC HARDWARE NOT FOUND';
                        return;
                    }
                    if (isVibing) {
                        navigator.vibrate(0);
                        clearTimeout(vibTimer);
                        isVibing = false;
                        btn.textContent = 'TEST MAX VIBRATION';
                        btn.style.background = 'rgba(0,0,0,0.5)';
                        status.textContent = 'TEST ABORTED';
                    } else {
                        isVibing = true;
                        btn.textContent = 'ABORT TEST';
                        btn.style.background = 'rgba(255,42,42,0.3)';
                        status.textContent = 'WARNING: MAX POWER ENGAGED';

                        const startTime = Date.now();
                        const tick = () => {
                            if (isVibing && Date.now() - startTime < 30000) {
                                navigator.vibrate(pattern);
                                vibTimer = setTimeout(tick, pattern.reduce((a, b) => a + b, 0));
                            } else {
                                navigator.vibrate(0);
                                isVibing = false;
                                btn.textContent = 'TEST MAX VIBRATION';
                                btn.style.background = 'rgba(0,0,0,0.5)';
                                status.textContent = 'TEST COMPLETE';
                            }
                        };
                        tick();
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', () => {
                createKeyboard();
                setupControls();
                setupKeyboard();
                setupVibrationTest();

                // Morse Code Drop-In equivalent directly added to touch interaction
                let firstTouch = false;
                document.body.addEventListener('pointerdown', () => {
                    if (!firstTouch && navigator.vibrate) {
                        firstTouch = true;
                        console.log("INITIALIZING AUDIO/HAPTIC MATRICES...");
                    }
                }, { once: true });
            });
        })();
    </script>
</body>

</html>
