  <style>

    :root {
      --primary: #ff4b00;
      --secondary: #00ffd0;
      --bg-dark: #0a0b0c;
      --bg-light: #121416;
      --text: #e0e0e0;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    
    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      position: relative;
      text-transform: uppercase;
      color: var(--primary);
    }
    
    header::after {
      content: 'PLAYER';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--secondary);
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }
    
    .player-container {
      width: 90%;
      max-width: 800px;
      background: var(--bg-light);
      border-radius: 2px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .player-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }
    
    .track-info {
      display: grid;
      grid-template-columns: 1fr auto;
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .track-title {
      font-weight: bold;
      color: var(--primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .track-number { color: var(--secondary); }
    
    .progress-container {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
    }
    
    .time-display {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0.5rem 1rem;
    }
    
    .controls button {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      padding: 0.5rem;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }
    
    .controls button:hover { color: var(--primary); }
    
    canvas {
      width: 100%;
      height: 200px;
      display: block;
    }
    
    .visualizer-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      pointer-events: none;
    }
    
    .visualizer-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(0, 0, 0, 0.2);
    }
    
    .visualizer-controls button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 0.6rem;
      padding: 0.25rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    
    .visualizer-controls button.active { color: var(--secondary); }
    
    .playlist-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 0.75rem;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
    }
    
    .playlist-container {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
    }
    
    .playlist-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .playlist-item:hover { background: rgba(255, 255, 255, 0.05); }
    .playlist-item.active { background: rgba(255, 75, 0, 0.1); }
    .playlist-item.active span:last-child { color: var(--primary); }
  </style>
</head>

// ======= NEURON CLASS =======
class Neuron {
  constructor(x, y, layer, size, speed) {
    this.x = x;
    this.y = y;
    this.layer = layer;
    this.size = size;
    this.speed = speed;
    this.pulse = 0;
  }

  update(audioValue, reactivityFactor) {
    // Map the audio value to a pulse effect
    this.pulse = (audioValue / 255) * 3 * reactivityFactor;
  }
}

// ======= CONNECTION CLASS =======
class Connection {
  constructor(from, to, weight) {
    this.from = from;
    this.to = to;
    this.weight = weight;
    this.signal = Math.random(); // start at a random phase for extra dynamism
  }

  update(reactivityFactor) {
    // Move the signal along the connection based on the reactivity factor
    this.signal = (this.signal + reactivityFactor * 0.05) % 1;
  }
}

// ======= NEURAL NETWORK CLASS =======
class NeuralNetwork {
  constructor(layerCount, canvas) {
    this.layerCount = layerCount;
    this.canvas = canvas;
    this.neurons = [];
    this.connections = [];
    this.initNeurons();
    this.initConnections();
  }

  initNeurons() {
    this.neurons = [];
    for (let layer = 0; layer < this.layerCount; layer++) {
      // Use fewer neurons in the input and output layers
      const neuronsInLayer = layer === 0 || layer === this.layerCount - 1 ? 10 : 20;
      const layerX = (this.canvas.width / (this.layerCount - 1)) * layer;
      for (let i = 0; i < neuronsInLayer; i++) {
        const ySpread = layer === 0 || layer === this.layerCount - 1 ? 0.6 : 0.8;
        const y = this.canvas.height * (0.5 - ySpread / 2 + ySpread * (i / (neuronsInLayer - 1)));
        const size = Math.random() * 3 + 2;
        const speed = Math.random() * 0.02 + 0.01;
        this.neurons.push(new Neuron(layerX, y, layer, size, speed));
      }
    }
  }

  initConnections() {
    this.connections = [];
    // For each neuron, connect it to some neurons in the next layer
    this.neurons.forEach(from => {
      if (from.layer < this.layerCount - 1) {
        const nextLayerNeurons = this.neurons.filter(n => n.layer === from.layer + 1);
        for (let j = 0; j < nextLayerNeurons.length; j += 2) {
          const weight = Math.random();
          this.connections.push(new Connection(from, nextLayerNeurons[j], weight));
        }
      }
    });
  }

  update(audioData, bufferLength, reactivityFactor) {
    // Update neurons with audio data
    this.neurons.forEach((neuron, index) => {
      const freqIndex = Math.floor((index / this.neurons.length) * bufferLength);
      neuron.update(audioData[freqIndex], reactivityFactor);
    });
    // Update connections based on reactivity
    this.connections.forEach(conn => conn.update(reactivityFactor));
  }

  render(ctx, colorSchemes, currentColorScheme, reactivityFactor) {
    // Draw neurons with a subtle oscillation
    this.neurons.forEach(neuron => {
      const oscillation = Math.sin(performance.now() * neuron.speed) * 0.5;
      const finalSize = neuron.size + neuron.pulse + oscillation;
      const colors = colorSchemes[currentColorScheme];
      ctx.fillStyle = colors.neuron;
      ctx.beginPath();
      ctx.arc(neuron.x, neuron.y, finalSize, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw connections between neurons
    this.connections.forEach(conn => {
      const dx = conn.to.x - conn.from.x;
      const dy = conn.to.y - conn.from.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      // Draw only connections within a reasonable distance
      if (distance < this.canvas.width / 2) {
        const signalX = conn.from.x + dx * conn.signal;
        const signalY = conn.from.y + dy * conn.signal;

        // Draw the base connection line
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.05 + conn.weight * 0.1})`;
        ctx.beginPath();
        ctx.moveTo(conn.from.x, conn.from.y);
        ctx.lineTo(conn.to.x, conn.to.y);
        ctx.stroke();

        // Draw the moving signal along the connection
        const colors = colorSchemes[currentColorScheme];
        ctx.fillStyle = colors.connection;
        ctx.beginPath();
        ctx.arc(signalX, signalY, 2 * reactivityFactor + 1, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
}

// ======= MAIN RENDERING FUNCTION =======
function renderNeuralBackground() {
  if (!audioContext) {
    bgAnimationId = requestAnimationFrame(renderNeuralBackground);
    return;
  }

  bgAnimationId = requestAnimationFrame(renderNeuralBackground);
  analyser.getByteFrequencyData(dataArray);

  // Calculate overall audio reactivity
  let sum = 0;
  for (let i = 0; i < bufferLength; i++) {
    sum += dataArray[i];
  }
  const reactivityFactor = sum / (bufferLength * 255);

  // Create a dynamic gradient background for smooth trails
  const gradient = bgCtx.createLinearGradient(0, 0, bgCanvas.width, bgCanvas.height);
  gradient.addColorStop(0, `rgba(10, 11, 12, ${0.08 + reactivityFactor * 0.05})`);
  gradient.addColorStop(1, `rgba(10, 11, 12, ${0.08 + reactivityFactor * 0.05})`);
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  // Update the neural network
  neuralNetwork.update(dataArray, bufferLength, reactivityFactor);

  // Render the neural network
  neuralNetwork.render(bgCtx, colorSchemes, currentColorScheme, reactivityFactor);

  // Occasionally change the color scheme for an extra vibe
  if (Math.random() < 0.001 + reactivityFactor * 0.01) {
    currentColorScheme = (currentColorScheme + 1) % colorSchemes.length;
  }
}

// === 2D Canvas Visualizer Functions (REVISED & ENHANCED) ===

// Helper: Get average amplitude for a frequency range
function getAverageAmplitude(dataArray, start, end) {
    let sum = 0;
    start = Math.max(0, Math.floor(start));
    end = Math.min(bufferLength, Math.ceil(end));
    if (start >= end) return 0;
    for (let i = start; i < end; i++) {
        sum += dataArray[i];
    }
    return sum / (end - start) / 255.0; // Normalize [0, 1]
}

// Helper: Simple pseudo-random for visual variety without class instances
function visualRand(seed) {
    // Simple LCG-like generator - good enough for visuals
    let state = Math.floor(seed * 1000);
    state = (1103515245 * state + 12345) % 2147483648;
    return state / 2147483648;
}

// Main render loop – calls the specific visualizer function
function renderVisualizer() {
    // Ensure audio context and data array are ready
    if (!audioContext || !dataArray || !analyser || !visualizerCanvas) {
        visualizerAnimationId = requestAnimationFrame(renderVisualizer); // Keep trying
        return;
    }

    visualizerAnimationId = requestAnimationFrame(renderVisualizer);
    analyser.getByteFrequencyData(dataArray); // Get data FOR THIS FRAME

    // --- Dynamic Background Clearing ---
    // Instead of hard clearRect, use a fading overlay for trails/motion blur effect
    // Adjust alpha (last value) for trail length (lower = longer trails)
    const fadeAlpha = 0.25; // Adjust this (0.1 to 0.5 is usually good)
    vizCtx.fillStyle = `rgba(10, 11, 12, ${fadeAlpha})`; // Use dark background color from CSS ideally
    vizCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

    // Reset composite operation before drawing new frame elements
    vizCtx.globalCompositeOperation = 'source-over';
    vizCtx.globalAlpha = 1.0; // Reset global alpha

    // Select and call the current visualizer function
    const visualizers = [
        drawEnhancedBars,      // Replaced original function names
        drawEnhancedCircles,
        drawEnhancedWave,
        drawEnhancedNebula,
        drawEnhancedSpectrum
    ];
    const index = (currentVisualizer - 1); // 0-based index
    if (index >= 0 && index < visualizers.length) {
         try {
             visualizers[index](); // Call the selected enhanced function
         } catch (e) {
              console.error(`Error rendering visualizer ${currentVisualizer}:`, e);
         }
    } else {
        // Fallback to the first enhanced visualizer
        try { drawEnhancedBars(); } catch(e) { console.error("Error rendering fallback viz:", e); }
    }
}


/* 1. Enhanced Bars: "Liquid Metal" Bars with Energy Sparks & Glitch */
function drawEnhancedBars() {
    const barWidth = Math.max(2, (visualizerCanvas.width / bufferLength) * 1.5); // Slightly wider, min width 2px
    const t = performance.now() * 0.001; // Time in seconds
    const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1) * 1.2; // Emphasize bass

    for (let i = 0; i < bufferLength; i++) {
        const amplitude = dataArray[i] / 255.0;
        const barHeight = Math.max(1, amplitude * visualizerCanvas.height * (0.8 + bass * 0.2)); // Height boosted by bass, min height 1px
        const x = i * (barWidth + 1); // Add 1px spacing

        // --- Liquid Top Shape ---
        const topY = visualizerCanvas.height - barHeight;
        const liquidOffset = Math.sin(t * 5 + i * 0.3) * amplitude * 10; // Wobble effect
        const controlPointY = topY - amplitude * 30 * Math.cos(t * 3 + i * 0.2); // Dynamic control point

        // --- Color Gradient & Glow ---
        const hue = (i / bufferLength) * 180 + 240 + Math.sin(t * 0.5) * 30; // Shift hue range (Purple-Blue-Cyan focus)
        const gradient = vizCtx.createLinearGradient(x, visualizerCanvas.height, x, topY);
        gradient.addColorStop(0, `hsla(${hue % 360}, 100%, 30%, 0.8)`); // Darker base
        gradient.addColorStop(0.5, `hsla(${(hue + 20) % 360}, 95%, 55%, 0.9)`);
        gradient.addColorStop(1, `hsla(${(hue + 50) % 360}, 90%, 75%, 1.0)`); // Bright top

        vizCtx.save();
        vizCtx.fillStyle = gradient;
        vizCtx.shadowColor = `hsla(${(hue + 50) % 360}, 100%, 70%, 0.7)`;
        vizCtx.shadowBlur = clamp(10 * amplitude + 5 * bass, 0, 25); // More reactive shadow blur

        // Draw the liquid bar shape
        vizCtx.beginPath();
        vizCtx.moveTo(x, visualizerCanvas.height);
        vizCtx.lineTo(x, topY + liquidOffset); // Start edge with wobble
        // Bezier curve for a more organic top edge
        vizCtx.bezierCurveTo(
            x + barWidth * 0.3, controlPointY, // Control point 1
            x + barWidth * 0.7, controlPointY, // Control point 2
            x + barWidth, topY - liquidOffset  // End edge with opposite wobble
        );
        vizCtx.lineTo(x + barWidth, visualizerCanvas.height);
        vizCtx.closePath();
        vizCtx.fill();
        vizCtx.restore();

        // --- Energy Sparks ---
        if (amplitude > 0.8 && Math.random() < 0.1) {
            const sparkX = x + barWidth * 0.5;
            const sparkY = topY;
            const sparkCount = Math.floor(1 + Math.random() * 3);
            for (let j = 0; j < sparkCount; j++) {
                 vizCtx.fillStyle = `hsla(${hue + Math.random() * 60 - 30}, 100%, 85%, ${0.5 + Math.random() * 0.5})`;
                 vizCtx.fillRect(
                     sparkX + (Math.random() - 0.5) * 10, // Slight horizontal spread
                     sparkY - Math.random() * 15,        // Start near top
                     1 + Math.random(), 1 + Math.random() * 2 // Tiny sparks
                 );
            }
        }

        // --- Glitch Effect (Displacement) ---
        if (Math.random() < 0.01 + bass * 0.05) { // More glitch on bass hits
            const glitchHeight = 5 + Math.random() * 15;
            const glitchY = Math.random() * (visualizerCanvas.height - glitchHeight);
            const glitchOffset = (Math.random() - 0.5) * 10;
            try { // Add try/catch for getImageData
                const imageData = vizCtx.getImageData(x + glitchOffset, glitchY, barWidth, glitchHeight);
                vizCtx.putImageData(imageData, x - glitchOffset, glitchY);
            } catch(e) {
                // Ignore potential security errors if canvas is tainted
            }
        }
    }
}


/* 2. Enhanced Circles: "Orbital Decay" with Trails and Connections */
function drawEnhancedCircles() {
    const t = performance.now() * 0.0005; // Slower time base
    const centerX = visualizerCanvas.width / 2;
    const centerY = visualizerCanvas.height / 2;
    const maxRadius = Math.min(centerX, centerY) * 0.9;
    const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
    const mid = getAverageAmplitude(dataArray, bufferLength * 0.3, bufferLength * 0.6);

    // Global Rotation based on bass
    vizCtx.save();
    vizCtx.translate(centerX, centerY);
    vizCtx.rotate(t * 0.1 + bass * 0.5); // Slow base rotation + bass boost
    vizCtx.translate(-centerX, -centerY);

    // Store particle positions for trails and connections
    if (!window.circleParticles) window.circleParticles = []; // Initialize if needed

    const currentParticles = [];

    for (let i = 0; i < bufferLength; i += 3) { // Fewer particles for performance
        const amplitude = dataArray[i] / 255.0;
        if (amplitude < 0.1) continue; // Skip quiet frequencies

        const angle = (i / bufferLength) * Math.PI * 4 + t * 0.5; // Double angle range, slow rotation
        const baseRadius = amplitude * maxRadius * (0.5 + mid * 0.5); // Radius influenced by mids
        const pulsate = 1 + 0.15 * Math.sin(t * 10 + i * 0.1); // Faster, smaller pulse
        const orbitRadius = Math.max(10, baseRadius * pulsate); // Minimum radius
        const particleSize = 1.0 + amplitude * 5.0;

        const x = centerX + Math.cos(angle) * orbitRadius;
        const y = centerY + Math.sin(angle) * orbitRadius;

        // Store current position
        currentParticles.push({ x, y, size: particleSize, intensity: amplitude, id: i });

        // Draw the main particle
        const hue = (i * 360 / bufferLength + 180 + t * 30) % 360; // Shifted hue range
        const gradient = vizCtx.createRadialGradient(x, y, 0, x, y, particleSize * 1.5);
        gradient.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.95)`); // Bright core
        gradient.addColorStop(0.5, `hsla(${(hue + 30) % 360}, 90%, 60%, 0.5)`);
        gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 80%, 50%, 0)`);

        vizCtx.fillStyle = gradient;
        vizCtx.beginPath();
        vizCtx.arc(x, y, particleSize, 0, Math.PI * 2);
        vizCtx.fill();
    }

    // --- Draw Trails ---
    // Add current particles to history, limit history length
     window.circleParticles.push(currentParticles);
     if (window.circleParticles.length > 15) { // Adjust trail length (frames)
         window.circleParticles.shift();
     }
     // Draw historical points with decreasing opacity/size
     vizCtx.globalCompositeOperation = 'lighter'; // Additive blending for trails
     for (let frame = 0; frame < window.circleParticles.length - 1; frame++) {
         const alpha = (frame / window.circleParticles.length) * 0.3; // Fade out older trails
         const frameParticles = window.circleParticles[frame];
         for (const p of frameParticles) {
             const trailSize = p.size * (frame / window.circleParticles.length);
             if (trailSize < 0.5) continue;
             const hue = (p.id * 360 / bufferLength + 180 + t * 30) % 360;
             vizCtx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
             vizCtx.beginPath();
             vizCtx.arc(p.x, p.y, trailSize, 0, Math.PI * 2);
             vizCtx.fill();
         }
     }
     vizCtx.globalCompositeOperation = 'source-over'; // Reset blend mode

    // --- Draw Connections (Optional, can be heavy) ---
     const connectDistance = visualizerCanvas.width * 0.15 * (1 + mid); // Connect distance reacts to mids
     vizCtx.strokeStyle = `rgba(200, 220, 255, 0.1)`; // Dim connection color
     vizCtx.lineWidth = 0.5;
     for (let i = 0; i < currentParticles.length; i++) {
         for (let j = i + 1; j < currentParticles.length; j++) {
             const p1 = currentParticles[i];
             const p2 = currentParticles[j];
             const dx = p1.x - p2.x;
             const dy = p1.y - p2.y;
             const dist = Math.sqrt(dx * dx + dy * dy);
             if (dist < connectDistance) {
                 vizCtx.globalAlpha = (1.0 - dist / connectDistance) * 0.5 * (p1.intensity + p2.intensity); // Fade connection by distance/intensity
                 vizCtx.beginPath();
                 vizCtx.moveTo(p1.x, p1.y);
                 vizCtx.lineTo(p2.x, p2.y);
                 vizCtx.stroke();
             }
         }
     }
     vizCtx.globalAlpha = 1.0; // Reset alpha

    vizCtx.restore(); // Restore context after rotation
}


/* 3. Enhanced Wave: "Plasma Conduit" with Layered Waves and Particles */
function drawEnhancedWave() {
    const t = performance.now() * 0.001;
    const sliceWidth = visualizerCanvas.width / (bufferLength - 1);
    const midY = visualizerCanvas.height / 2;

    // Layer 1: Bass Wave (Thick, slow, glow)
    const bassAvg = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
    vizCtx.save();
    vizCtx.lineWidth = 4 + bassAvg * 8; // Thickness based on bass
    vizCtx.strokeStyle = `hsla(190, 100%, 60%, ${0.4 + bassAvg * 0.4})`; // Cyan base
    vizCtx.shadowColor = 'var(--secondary)'; // Cyan glow
    vizCtx.shadowBlur = 15 * bassAvg;
    vizCtx.beginPath();
    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 255.0;
        const x = i * sliceWidth;
        const y = midY + (v - 0.5) * visualizerCanvas.height * 0.4 * Math.sin(i * 0.02 + t * 1.5); // Slower, wider oscillation
        if (i === 0) vizCtx.moveTo(x, y); else vizCtx.lineTo(x, y);
    }
    vizCtx.stroke();
    vizCtx.restore();

    // Layer 2: Mid Freq Wave (Thinner, faster, primary color)
    const midAvg = getAverageAmplitude(dataArray, bufferLength * 0.2, bufferLength * 0.7);
    vizCtx.lineWidth = 1.5 + midAvg * 2;
    vizCtx.strokeStyle = `hsla(37, 100%, 55%, ${0.6 + midAvg * 0.3})`; // Orange base (from --primary)
    vizCtx.beginPath();
    for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 255.0;
        const x = i * sliceWidth;
        const y = midY + (v - 0.5) * visualizerCanvas.height * 0.6 * Math.sin(i * 0.04 + t * 3); // Faster, tighter oscillation
        if (i === 0) vizCtx.moveTo(x, y); else vizCtx.lineTo(x, y);
    }
    vizCtx.stroke();

    // Layer 3: High Freq Particles/Sparks
    vizCtx.fillStyle = `rgba(255, 255, 255, 0.7)`; // White sparks
     vizCtx.shadowColor = '#FFF';
     vizCtx.shadowBlur = 5;
    for (let i = Math.floor(bufferLength * 0.6); i < bufferLength; i++) { // Focus on high frequencies
        const v = dataArray[i] / 255.0;
        if (v > 0.7 && Math.random() < 0.1) { // Only for high amplitude highs
            const x = i * sliceWidth;
            const yBase = midY + (v - 0.5) * visualizerCanvas.height * 0.7 * Math.sin(i * 0.04 + t * 3); // Position near mid wave
            vizCtx.beginPath();
            vizCtx.arc(x, yBase + (Math.random() - 0.5) * 20, // Random Y offset
                      0.5 + Math.random() * 1.5, // Random size
                      0, Math.PI * 2);
            vizCtx.fill();
        }
    }
     vizCtx.shadowBlur = 0; // Reset shadow
}


/* 4. Enhanced Nebula: "Living Constellation" with Physics Particles */
function drawEnhancedNebula() {
    const t = performance.now() * 0.0005;
    const centerX = visualizerCanvas.width / 2;
    const centerY = visualizerCanvas.height / 2;
    const baseParticleCount = 80; // Keep particle count reasonable

    // Simple physics particles setup (initialize once)
    if (!window.nebulaParticles || window.nebulaParticles.length !== baseParticleCount) {
        window.nebulaParticles = [];
        for (let i = 0; i < baseParticleCount; i++) {
            window.nebulaParticles.push({
                x: centerX + (Math.random() - 0.5) * visualizerCanvas.width * 0.8,
                y: centerY + (Math.random() - 0.5) * visualizerCanvas.height * 0.8,
                vx: 0,
                vy: 0,
                seed: Math.random() * 100, // For unique behavior
                hue: Math.random() * 360,
                life: 1.0 // Start fully alive
            });
        }
    }

    // --- Update and Draw Particles ---
    vizCtx.globalCompositeOperation = 'lighter';
    const overallIntensity = getAverageAmplitude(dataArray, 0, bufferLength);
    const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);

    window.nebulaParticles.forEach((p, i) => {
        // --- Physics Update ---
        // Force towards center (gravity well)
        const dx = centerX - p.x;
        const dy = centerY - p.y;
        const distSq = dx * dx + dy * dy;
        const gravityForce = 15 / Math.max(50, distSq); // Weaker gravity further out
        p.vx += dx * gravityForce * 0.01; // Apply force (adjust multiplier for strength)
        p.vy += dy * gravityForce * 0.01;

        // Random swirling force based on time and seed
        const swirlAngle = t * 1.5 + p.seed;
        p.vx += Math.cos(swirlAngle) * 0.03;
        p.vy += Math.sin(swirlAngle) * 0.03;

        // Audio impulse force (push outwards on bass hits)
        const impulseStrength = bass * bass * 1.5; // Stronger impulse on heavy bass
        if (impulseStrength > 0.1) {
             const impulseAngle = Math.atan2(dy, dx); // Angle away from center
             p.vx -= Math.cos(impulseAngle) * impulseStrength * 0.1;
             p.vy -= Math.sin(impulseAngle) * impulseStrength * 0.1;
        }


        // Damping / Friction
        p.vx *= 0.96;
        p.vy *= 0.96;

        // Update position
        p.x += p.vx;
        p.y += p.vy;

        // Age particle and reset if it gets too old or goes off-screen
        p.life -= 0.002; // Fade over time
        if (p.life <= 0 || p.x < -50 || p.x > visualizerCanvas.width + 50 || p.y < -50 || p.y > visualizerCanvas.height + 50) {
            // Reset particle near center
            p.x = centerX + (Math.random() - 0.5) * 50;
            p.y = centerY + (Math.random() - 0.5) * 50;
            p.vx = (Math.random() - 0.5) * 0.5;
            p.vy = (Math.random() - 0.5) * 0.5;
            p.life = 1.0;
            p.hue = Math.random() * 360; // Reset hue as well
        }

        // --- Drawing ---
        const dataIndex = Math.min(bufferLength - 1, Math.floor((i / baseParticleCount) * bufferLength));
        const amplitude = dataArray[dataIndex] / 255.0;
        const particleSize = (1.5 + amplitude * 10 + bass * 5) * p.life; // Size reacts to audio and life
        if (particleSize < 0.5) return; // Skip drawing if too small

        const alpha = amplitude * 0.3 + p.life * 0.4; // Opacity based on audio and life

        try {
            const gradient = vizCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, particleSize);
            gradient.addColorStop(0, `hsla(${p.hue}, 90%, 80%, ${alpha * 0.8})`); // Core bright
            gradient.addColorStop(0.4, `hsla(${(p.hue + 40) % 360}, 80%, 60%, ${alpha * 0.5})`);
            gradient.addColorStop(1, `hsla(${(p.hue + 80) % 360}, 70%, 50%, 0)`); // Fade out
            vizCtx.fillStyle = gradient;
            vizCtx.beginPath();
            vizCtx.arc(p.x, p.y, particleSize, 0, Math.PI * 2);
            vizCtx.fill();
        } catch (e) { console.warn("Nebula gradient error:", e); }
    });

    vizCtx.globalCompositeOperation = 'source-over'; // Reset
}


/* 5. Enhanced Spectrum: "Data Stream" with Perspective & Peaks */
function drawEnhancedSpectrum() {
    const t = performance.now() * 0.001;
    const perspectiveFactor = 0.6; // How much perspective (0 to 1)
    const floorY = visualizerCanvas.height * 0.95; // Where the base of the bars sits

    // Store peak values
    if (!window.spectrumPeaks) window.spectrumPeaks = new Array(bufferLength).fill(0);
    const peakFalloff = 0.99; // How fast peaks fall (closer to 1 = slower)

    for (let i = 0; i < bufferLength; i++) {
        const amplitude = dataArray[i] / 255.0;
        const barHeightRaw = amplitude * visualizerCanvas.height * 1.2; // Allow bars to go higher

        // --- Peak Hold ---
        window.spectrumPeaks[i] = Math.max(window.spectrumPeaks[i] * peakFalloff, barHeightRaw);
        const peakHeight = window.spectrumPeaks[i];

        // --- Perspective Calculation ---
        // Map i to a range like -1 to 1 for perspective
        const perspectiveX = (i / (bufferLength - 1)) * 2.0 - 1.0;
        // Calculate width and x-position based on perspective
        const perspectiveScale = 1.0 - perspectiveFactor * Math.abs(perspectiveX); // Bars narrower at edges
        const barWidth = Math.max(1, (visualizerCanvas.width / bufferLength) * 1.5 * perspectiveScale);
        // Calculate x position, compressing towards center based on perspective
        const x = visualizerCanvas.width * 0.5 + perspectiveX * (visualizerCanvas.width * 0.5 * (1.0 - perspectiveFactor * 0.5)) - barWidth * 0.5;

        // --- Drawing Main Bar ---
        const barHeight = barHeightRaw * perspectiveScale; // Height also affected by perspective
        const hue = (i / bufferLength) * 240 + 120; // Cyan-Green-Yellow-Orange range

        const gradient = vizCtx.createLinearGradient(x, floorY, x, floorY - barHeight);
        gradient.addColorStop(0, `hsla(${hue}, 90%, 40%, 0.7)`); // Base color
        gradient.addColorStop(1, `hsla(${(hue + 40) % 360}, 100%, 70%, 0.9)`); // Top color

        vizCtx.fillStyle = gradient;
        vizCtx.fillRect(x, floorY - barHeight, barWidth, barHeight);

        // --- Drawing Peak Line ---
        if (peakHeight > barHeight + 2) { // Only draw if peak is noticeably above current bar
             const peakY = floorY - peakHeight * perspectiveScale;
             vizCtx.fillStyle = `hsla(${(hue + 60) % 360}, 100%, 85%, 0.8)`; // Bright peak color
             vizCtx.fillRect(x, peakY - 1, barWidth, 2); // Thin peak line
        }

        // --- Floor Reflection (Optional) ---
        // vizCtx.save();
        // vizCtx.translate(0, floorY + (visualizerCanvas.height - floorY)); // Move origin to reflection plane
        // vizCtx.scale(1, -0.5); // Scale vertically for reflection fade
        // vizCtx.globalAlpha = 0.2 * amplitude; // Fade reflection
        // vizCtx.fillStyle = gradient; // Reuse gradient
        // vizCtx.fillRect(x, 0, barWidth, -barHeight); // Draw reflected bar upside down
        // vizCtx.restore();

        // --- Data Glitch Effect ---
        if (amplitude > 0.8 && Math.random() < 0.05) {
             vizCtx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.random() * 0.4})`;
             const glitchHeight = Math.random() * barHeight * 0.2 + 2;
             const glitchY = floorY - barHeight + Math.random() * (barHeight - glitchHeight);
             vizCtx.fillRect(x, glitchY, barWidth, glitchHeight);
         }
    }
}


// Helper: Clamp function
function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

    function updateVisualizerButtons() {
      document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === currentVisualizer);
      });
    }

    // Event listeners
    playPauseBtn.addEventListener('click', () => musicPlayer.paused ? playTrack() : pauseTrack());

    $('nextTrack').addEventListener('click', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('ended', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('timeupdate', updateProgress);
    musicPlayer.addEventListener('durationchange', () => { $('totalTime').textContent = formatTime(musicPlayer.duration); });
    
    progressContainer.addEventListener('click', e => {
      musicPlayer.currentTime = (e.offsetX / progressContainer.offsetWidth) * musicPlayer.duration;
    });
    
    $('playlistToggle').addEventListener('click', () => {
      const playlist = $('playlist');
      const isHidden = playlist.style.display === 'none';
      playlist.style.display = isHidden ? 'block' : 'none';
      $('playlistToggle').textContent = isHidden ? 'Hide Playlist' : 'Playlist';
    });
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

    document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        currentVisualizer = i + 1;
        updateVisualizerButtons();
      });
    });

    window.addEventListener('resize', () => {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      initNeuralNetwork();
    });

    // Initialize
    loadTrack(currentTrackIndex);
    createPlaylist();
    initNeuralNetwork();
    renderNeuralBackground();
