<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuromantic Bloom X26</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --primary-accent: #e91e63;   /* Vibrant Pink/Magenta */
            --secondary-accent: #00bcd4; /* Luminous Cyan */
            --tertiary-accent: #7c4dff;  /* Energetic Purple */

            --bg-deep-space: #030105;
            --bg-interface: #0c0a12;
            --text-color: #e8eaf6;      /* Cool light lavender */
            --text-muted: #a0a0c0;

            --glass-ink-bg: rgba(12, 10, 18, 0.8); /* Darker, more saturated glass */
            --glass-ink-border: rgba(124, 77, 255, 0.25); /* Purple energetic border */
            --glass-ink-shadow: 0 0 25px rgba(124, 77, 255, 0.15);

            --glow-primary: 0 0 8px var(--primary-accent), 0 0 16px var(--primary-accent), 0 0 24px rgba(233, 30, 99, 0.4);
            --glow-secondary: 0 0 8px var(--secondary-accent), 0 0 16px var(--secondary-accent), 0 0 24px rgba(0, 188, 212, 0.4);
            --glow-tertiary: 0 0 10px var(--tertiary-accent), 0 0 20px var(--tertiary-accent), 0 0 30px rgba(124, 77, 255, 0.3);

            --radius-main: 20px; /* Softer, more organic radius */
            --radius-small: 10px;
            --transition-main: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-fast: 0.2s ease-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep-space);
            color: var(--text-color);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
            position: relative; /* For pseudo-element overlays if needed */
        }

        /* Subtle animated grain/static for depth */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            animation: grain 8s steps(10) infinite;
            z-index: -2; /* Below main background canvas */
        }
        @keyframes grain {
          0%, 100% { transform: translate(0, 0); }
          10% { transform: translate(-1%, -1%); } 20% { transform: translate(1%, -2%); }
          30% { transform: translate(-2%, 1%); }  40% { transform: translate(2%, 2%); }
          50% { transform: translate(-1%, 2%); }  60% { transform: translate(1%, -1%); }
          70% { transform: translate(-2%, -2%); } 80% { transform: translate(2%, 1%); }
          90% { transform: translate(-1%, 1%); }
        }


        #background-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.7; /* Background canvas more prominent */
        }

        header {
            font-size: 2rem; /* Larger header */
            font-weight: 700;
            margin-bottom: 2.5rem; /* More space */
            position: relative;
            text-transform: uppercase;
            color: var(--primary-accent);
            z-index: 1;
            letter-spacing: 1px;
            text-shadow: var(--glow-primary);
            animation: headerPulse 5s infinite alternate ease-in-out;
        }

        @keyframes headerPulse {
            0% { text-shadow: 0 0 8px var(--primary-accent), 0 0 16px rgba(233, 30, 99, 0.3); opacity: 0.9; }
            100% { text-shadow: var(--glow-primary), 0 0 40px rgba(233, 30, 99, 0.2); opacity: 1; }
        }

        header::after {
            content: 'PLAYER X26'; /* Updated content */
            position: absolute;
            left: 0; top: 0;
            color: var(--secondary-accent);
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            text-shadow: var(--glow-secondary);
            filter: blur(0.5px); /* Slight blur for ethereal effect */
        }

        .player-container {
            width: 95%; max-width: 700px; /* Slightly narrower for a more "focused core" feel */
            border-radius: var(--radius-main); /* Softer, organic shape */
            position: relative; z-index: 1;
            overflow: hidden;
            background: var(--glass-ink-bg);
            backdrop-filter: blur(15px) saturate(120%); /* More intense glass */
            -webkit-backdrop-filter: blur(15px) saturate(120%);
            border: 1px solid var(--glass-ink-border);
            box-shadow: var(--glass-ink-shadow), 0 15px 50px rgba(0,0,0,0.5);
            display: grid;
            grid-template-areas:
                "visualizer visualizer"
                "info info"
                "progress progress"
                "time time"
                "controls controls"
                "viz-controls viz-controls"
                "playlist-toggle playlist-toggle"
                "playlist playlist";
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            animation: float 8s ease-in-out infinite alternate; /* Subtle floating animation */
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(-0.2deg); }
            50% { transform: translateY(-5px) rotate(0.2deg); }
            100% { transform: translateY(0px) rotate(-0.2deg); }
        }

        /* Animated Energetic Border */
        .player-container::before {
            content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; /* Cover border */
            width: calc(100% + 2px); height: calc(100% + 2px);
            border-radius: var(--radius-main); /* Match parent */
            padding: 2px; /* Create space for the border gradient */
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent), var(--tertiary-accent), var(--primary-accent));
            background-size: 400% 400%;
            animation: borderFlowEnergetic 6s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            z-index: -1; /* Behind content but on top of background */
        }
        @keyframes borderFlowEnergetic {
            0% { background-position: 0% 50%; filter: hue-rotate(0deg) brightness(1.0); }
            50% { background-position: 100% 50%; filter: hue-rotate(45deg) brightness(1.2); }
            100% { background-position: 0% 50%; filter: hue-rotate(0deg) brightness(1.0); }
        }

        .visualizer-canvas-container { grid-area: visualizer; }
        .track-info-wrapper { grid-area: info; }
        .progress-container { grid-area: progress; }
        .time-display { grid-area: time; }
        .controls { grid-area: controls; }
        .visualizer-controls { grid-area: viz-controls; }
        .playlist-toggle { grid-area: playlist-toggle; }
        .playlist-container { grid-area: playlist; }

        .visualizer-canvas-container {
            height: 180px; /* Slightly taller */
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--glass-ink-border); /* Separator */
            background: radial-gradient(ellipse at center, rgba(12,10,18,0.1) 0%, transparent 70%);
        }
        #visualizer { width: 100%; height: 100%; display: block; opacity: 0.9; }

        .track-info-wrapper {
            padding: 1rem 1.5rem; /* More horizontal padding */
            border-bottom: 1px solid var(--glass-ink-border);
            display: flex; /* Changed to flex for better alignment */
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            min-height: 60px; /* Ensure consistent height */
        }
        .track-title {
            font-weight: 700; /* Bolder */
            font-size: 1.1rem;
            color: var(--primary-accent);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 0 5px var(--primary-accent);
            flex-grow: 1;
        }
        .track-number { color: var(--secondary-accent); font-size: 0.9rem; text-shadow: 0 0 3px var(--secondary-accent); }

        .progress-container {
            height: 8px; /* Thicker progress bar */
            background: rgba(255, 255, 255, 0.05); /* Darker, less visible track */
            cursor: pointer;
            overflow: hidden;
            margin: 0.5rem 1.5rem; /* Consistent padding */
            border-radius: var(--radius-small);
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-accent), var(--secondary-accent));
            width: 0%;
            transition: width 0.1s linear;
            border-radius: var(--radius-small);
            box-shadow: 0 0 8px var(--secondary-accent);
            animation: progressBarPulse 2s infinite alternate;
        }
        @keyframes progressBarPulse {
            from { filter: brightness(0.9) saturate(0.9); box-shadow: 0 0 6px var(--secondary-accent); }
            to { filter: brightness(1.1) saturate(1.1); box-shadow: 0 0 12px var(--secondary-accent); }
        }


        .time-display {
            display: flex; justify-content: space-between;
            padding: 0.5rem 1.5rem 0.75rem; /* Consistent padding */
            font-size: 0.8rem; color: var(--text-muted); font-weight: 700;
        }

        .controls {
            display: grid; grid-template-columns: repeat(3, 1fr);
            padding: 0.75rem 1.5rem; /* Consistent padding */
            border-top: 1px solid var(--glass-ink-border);
            border-bottom: 1px solid var(--glass-ink-border);
        }
        .controls button {
            background: transparent; border: none;
            color: var(--text-color); font-family: inherit;
            padding: 0.85rem 0.5rem; cursor: pointer;
            text-transform: uppercase; font-weight: 700; font-size: 0.9rem;
            transition: var(--transition-main);
            text-shadow: 0 0 3px rgba(255,255,255,0.3);
            position: relative;
        }
        .controls button::after { /* Underline effect */
            content: ''; position: absolute; bottom: 5px; left: 50%;
            transform: translateX(-50%); width: 0; height: 2px;
            background-color: var(--primary-accent);
            transition: width var(--transition-fast);
        }
        .controls button:hover, .controls button:focus-visible {
            color: var(--primary-accent);
            transform: translateY(-3px);
            text-shadow: var(--glow-primary);
        }
        .controls button:hover::after, .controls button:focus-visible::after { width: 60%; }
        .controls button:active { transform: translateY(0px) scale(0.98); color: var(--secondary-accent); }


        /* Visualizer Controls - Evolved into "Synaptic Pips" */
        .visualizer-controls {
            display: flex; /* Changed to flex for a more unusual layout */
            flex-wrap: wrap; /* Allow wrapping */
            justify-content: center; /* Center the pips */
            align-items: center;
            gap: 8px; /* Gap between pips */
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--glass-ink-border);
            min-height: 60px; /* Give it some space */
        }
        .visualizer-controls button {
            background: transparent;
            border: 1px solid var(--glass-ink-border);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.6rem;
            width: 28px; height: 28px; /* Circular pips */
            border-radius: 50%; /* Make them circles */
            cursor: pointer;
            transition: var(--transition-main);
            display: flex; align-items: center; justify-content: center;
            text-shadow: none;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .visualizer-controls button.active {
            color: var(--bg-interface);
            font-weight: bold;
            background-color: var(--secondary-accent);
            border-color: var(--secondary-accent);
            box-shadow: var(--glow-secondary), inset 0 0 5px rgba(0,0,0,0.3);
            transform: scale(1.15);
        }
        .visualizer-controls button:hover:not(.active),
        .visualizer-controls button:focus-visible:not(.active) {
            color: var(--primary-accent);
            border-color: var(--primary-accent);
            background-color: rgba(233, 30, 99, 0.1);
            transform: scale(1.1);
            box-shadow: 0 0 8px var(--primary-accent);
        }


        .playlist-toggle {
            width: 100%; background: transparent; border: none;
            padding: 1rem; color: var(--text-color);
            font-family: inherit; cursor: pointer;
            text-transform: uppercase; font-weight: 700;
            transition: var(--transition-fast);
            letter-spacing: 1px;
            border-top: 1px solid var(--glass-ink-border); /* Add if viz controls removed border */
        }
        .playlist-toggle:hover, .playlist-toggle:focus-visible {
            background-color: rgba(124, 77, 255, 0.1); /* Tertiary accent hover */
            color: var(--tertiary-accent);
            text-shadow: 0 0 5px var(--tertiary-accent);
        }

        .playlist-container {
            max-height: 180px; /* Slightly less height */
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.15);
            border-top: 1px solid var(--glass-ink-border); /* Ensure separator */
        }
        /* Modern scrollbar for playlist */
        .playlist-container::-webkit-scrollbar { width: 8px; }
        .playlist-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .playlist-container::-webkit-scrollbar-thumb {
            background-color: var(--tertiary-accent);
            border-radius: 4px;
            border: 2px solid rgba(0,0,0,0.3);
            transition: background-color var(--transition-fast);
        }
        .playlist-container::-webkit-scrollbar-thumb:hover { background-color: var(--primary-accent); }


        .playlist-item {
            display: grid; grid-template-columns: auto auto 1fr; gap: 0.8rem;
            align-items: center; padding: 0.85rem 1.5rem; cursor: pointer;
            border-bottom: 1px solid rgba(124, 77, 255, 0.1); /* Softer separator */
            font-size: 0.85rem;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item:hover, .playlist-item:focus-visible {
            background: rgba(124, 77, 255, 0.1);
            color: var(--secondary-accent);
        }
        .playlist-item.active {
            background: linear-gradient(90deg, rgba(0, 188, 212, 0.15), rgba(0, 188, 212, 0.05));
            border-left: 3px solid var(--secondary-accent); /* Active indicator line */
            padding-left: calc(1.5rem - 3px);
        }
        .playlist-item span:first-child { color: var(--text-muted); width: 2em; text-align: right; }
        .playlist-item span:last-child { color: var(--text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .playlist-item:hover span:last-child,
        .playlist-item:focus-visible span:last-child { color: var(--secondary-accent); }
        .playlist-item.active span { color: var(--secondary-accent); font-weight: bold; text-shadow: 0 0 5px var(--secondary-accent); }

        /* Evolved Playlist Item Indicator (more fluid) */
        .playlist-item-indicator {
            display: flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; opacity: 0;
            transition: opacity var(--transition-main);
            position: relative; /* For potential future absolute positioned elements */
        }
        .playlist-item.active .playlist-item-indicator { opacity: 1; }
        .wave-bar {
            width: 2.5px; margin: 0 0.5px;
            height: 100%; background-color: var(--secondary-accent);
            animation: soundwaveFluid 1.2s ease-in-out infinite alternate;
            border-radius: 1px;
            box-shadow: 0 0 3px var(--secondary-accent);
        }
        .wave-bar:nth-child(1) { animation-delay: -0.4s; }
        .wave-bar:nth-child(2) { animation-delay: -0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0s; }
        @keyframes soundwaveFluid {
            0% { transform: scaleY(0.15); opacity: 0.5; }
            50% { opacity: 0.75; }
            100% { transform: scaleY(0.9); opacity: 1; }
        }


        @media (max-width: 700px) { /* Adjusted breakpoint */
            body { padding: 0.5rem; }
            header { font-size: 1.5rem; margin-bottom: 1.5rem; }
            .player-container { width: calc(100% - 1rem); max-width: none; }
            .track-info-wrapper { padding: 0.8rem 1rem; min-height: 50px; }
            .track-title { font-size: 1rem; }
            .progress-container { margin: 0.5rem 1rem; height: 6px; }
            .controls button { padding: 0.7rem 0.4rem; font-size: 0.8rem; }
            .visualizer-controls {
                grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); /* More adaptive grid */
                gap: 6px; padding: 0.75rem 1rem;
            }
            .visualizer-controls button { width: 26px; height: 26px; font-size: 0.55rem; }
            .playlist-toggle { padding: 0.85rem; }
            .playlist-item { padding: 0.7rem 1rem; gap: 0.7rem; font-size: 0.8rem;}
            .playlist-item span:first-child { width: 1.8em; }
            .playlist-item-indicator { width: 15px; height: 15px;}
            .wave-bar { width: 2px; }
        }
         @media (max-width: 400px) { /* Very small screens */
            header {font-size: 1.2rem; margin-bottom: 1rem;}
            .visualizer-canvas-container { height: 150px; }
            .visualizer-controls { gap: 4px; padding: 0.5rem; }
            .visualizer-controls button { width: 24px; height: 24px; font-size: 0.5rem; }
            .playlist-item { font-size: 0.75rem; padding: 0.6rem 0.8rem; }
         }

    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <header>Neuromantic</header> <div class="player-container">

        <div class="visualizer-canvas-container">
            <canvas id="visualizer"></canvas>
        </div>

        <audio id="musicPlayer" crossorigin="anonymous"></audio>
        <div class="track-info-wrapper">
            <div class="track-title" id="trackTitle">-- Stream Intercepted --</div>
            <div class="track-number">
                <span id="currentTrackNum">00</span>/<span id="totalTracks">00</span>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>

        <div class="controls">
            <button id="prevTrack" title="Previous Signal (Left Arrow)">Prev</button>
            <button id="playPause" title="Engage/Disengage (Spacebar)">Engage</button>
            <button id="nextTrack" title="Next Signal (Right Arrow)">Next</button>
        </div>

        <div class="visualizer-controls">
            <button id="viz1" class="active">1</button> <button id="viz2">2</button> <button id="viz3">3</button>
            <button id="viz4">4</button> <button id="viz5">5</button> <button id="viz6">6</button>
            <button id="viz7">7</button> <button id="viz8">8</button> <button id="viz9">9</button>
            <button id="viz10">10</button><button id="viz11">11</button><button id="viz12">12</button>
            <button id="viz13">13</button><button id="viz14">14</button><button id="viz15">15</button>
            <button id="viz16">16</button><button id="viz17">17</button><button id="viz18">18</button>
            <button id="viz19">19</button><button id="viz20">20</button>
        </div>

        <button class="playlist-toggle" id="playlistToggle">Data Streams</button>

        <div class="playlist-container" id="playlist" style="display:none;">
            </div>

    </div>

    <script>
        // --- DOM Element Selection Helper ---
        const $ = id => document.getElementById(id);

        // --- Get DOM Elements ---
        const musicPlayer = $('musicPlayer');
        const playPauseBtn = $('playPause');
        const visualizerCanvas = $('visualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        const progressBar = $('progressBar');
        const progressContainer = $('progressContainer');
        const bgCanvas = $('background-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const trackTitleEl = $('trackTitle');
        const currentTrackNumEl = $('currentTrackNum');
        const totalTracksEl = $('totalTracks');
        const currentTimeEl = $('currentTime');
        const totalTimeEl = $('totalTime');
        const playlistEl = $('playlist');
        const playlistToggleBtn = $('playlistToggle');

        // --- State variables ---
        let currentTrackIndex = 0;
        let currentVisualizer = 1; // 1-based index for foreground
        let visualizerAnimationId = null;
        let bgAnimationId = null;
        let audioContext, analyser, source, dataArray, bufferLength;
        let isAudioInitialized = false;

        // --- Background State ---
        let neuralNetwork = null;
        let currentBackgroundIndex = 0;
        let backgroundSwitchIntervalId = null;
        const BACKGROUND_SWITCH_INTERVAL = 25000; // Faster switch: 25 seconds
        let bgParticles = [];

        const layerCount = 5; // For NN
        const nnColorSchemes = [ // More vibrant schemes
            { neuron: getComputedStyle(document.documentElement).getPropertyValue('--primary-accent').trim(), connection: getComputedStyle(document.documentElement).getPropertyValue('--secondary-accent').trim() },
            { neuron: getComputedStyle(document.documentElement).getPropertyValue('--secondary-accent').trim(), connection: getComputedStyle(document.documentElement).getPropertyValue('--primary-accent').trim() },
            { neuron: '#ff00ff', connection: '#00ffff' },
            { neuron: getComputedStyle(document.documentElement).getPropertyValue('--tertiary-accent').trim(), connection: '#ff8800' }, // Purple/Orange
            { neuron: '#f0f0ff', connection: '#c0c0ff' } // Bright Ethereal White
        ];
        let nnCurrentColorScheme = 0;

        // --- Track List (using placeholder paths, update with actual paths) ---
        const tracks = [
            { src: 'track1.wav', title: 'Cryo Sleep' }, { src: 'track2.wav', title: 'Neon Synapse' },
            { src: 'track3.wav', title: 'Quantum Echo' }, { src: 'track4.wav', title: 'Star Bloom' },
            { src: 'track5.wav', title: 'Void Weaver' }, { src: 'track6.wav', title: 'Cypher Stream' },
            { src: 'track7.wav', title: 'Neural Lace' }, { src: 'track8.wav', title: 'Binary Aurora' },
            { src: 'track9.wav', title: 'Virtual Drift' }, { src: 'track10.wav', title: 'Holographic Heart' },
            { src: 'track11.wav', title: 'Singularity Bloom' }, { src: 'track12.wav', title: 'Aether Dreams' },
            { src: 'track13.wav', title: 'Exo-Journey' }, { src: 'track14.wav', title: 'Chrono Pulse' },
            { src: 'track15.wav', title: 'Nebula Dawn' }, { src: 'track16.wav', title: 'Ethereal Matrix' },
            { src: 'track17.mp3', title: 'Ghost in the Machine' }, { src: 'track18.wav', title: 'Astral Codex' },
            { src: 'track19.wav', title: 'Plasma Bloom' }, { src: 'track20.wav', title: 'Zero Point Field' }
        ];
        totalTracksEl.textContent = tracks.length.toString().padStart(2, '0');

        // --- Canvas Resizing Function ---
        function resizeCanvases() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
            if (neuralNetwork) {
                neuralNetwork.canvas = bgCanvas;
                neuralNetwork.initNeurons(); // Re-init might be too heavy, consider just updating bounds
                neuralNetwork.initConnections();
            }
            bgParticles = [];
            console.log("Synaptic Canvases Resized");
        }

        const formatTime = s => {
            if (isNaN(s) || !isFinite(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        function initAudio() {
            if (!isAudioInitialized && !audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 1024;
                    analyser.smoothingTimeConstant = 0.75; // slightly more responsive

        class NeuralNetwork { constructor(layers, canvas) { this.lCount=layers; this.canvas=canvas; this.neurons=[]; this.connections=[]; this.initNeurons(); this.initConnections(); } initNeurons() { this.neurons=[]; const ratios=[0.6,0.8,1,0.8,0.6]; for(let l=0;l<this.lCount;l++){ const ratio=ratios[l]||1; const baseCount=Math.floor(20*(this.canvas.width/1200)); const num=Math.max(5,Math.floor(baseCount*ratio)); const padX=this.canvas.width*0.1; const availW=this.canvas.width-2*padX; const lx=padX+(this.lCount>1?availW/(this.lCount-1)*l:availW/2); for(let i=0;i<num;i++){ const padY=this.canvas.height*0.15; const availH=this.canvas.height-2*padY; const randY=(Math.random()-0.5)*availH*0.1; const y=padY+(num>1?availH*i/(num-1):availH/2)+randY; const size=Math.random()*1.5+1; const speed=(Math.random()*0.01+0.005)*(0.5+Math.random()); this.neurons.push(new Neuron(lx,y,l,size,speed)); } } } initConnections() { this.connections=[]; this.neurons.forEach(fromN=>{ if(fromN.layer<this.lCount-1){ const nextLayerNs=this.neurons.filter(n=>n.layer===fromN.layer+1); const count=Math.max(1,Math.floor(nextLayerNs.length*(0.3+Math.random()*0.3))); const targets=nextLayerNs.sort(()=>0.5-Math.random()); for(let i=0;i<count&&i<targets.length;i++){ this.connections.push(new Connection(fromN,targets[i],Math.random())); } } }); } update(audioData, bufLen, reactivity) { this.neurons.forEach((neuron,idx)=>{ const freqIdx=Math.floor(Math.pow(idx/this.neurons.length,1.5)*(bufLen*0.8)); neuron.update(audioData[freqIdx]||0,reactivity); }); this.connections.forEach(conn=>conn.update(reactivity)); } render(ctx, colors, reactivity) { this.connections.forEach(conn=>conn.render(ctx,colors.connection,reactivity)); this.neurons.forEach(neuron=>neuron.render(ctx,colors.neuron)); } }

        function initNeuralNetwork() {

        function drawShaderBackground1(ctx, canvas, audioData, bufLen, reactivity) { /* Code unchanged */ const time=performance.now()/1000;const w=canvas.width;const h=canvas.height;ctx.fillStyle='rgba(3,1,5,0.08)';ctx.fillRect(0,0,w,h);ctx.lineWidth=1+reactivity*2;const lines=50;for(let i=0;i<lines;i++){const progress=i/lines;const x=progress*w;const freqIndex=Math.floor(progress*bufLen*0.8);const amp=(audioData[freqIndex]||0)/255;const hue=(progress*120+time*15+240)%360;const saturation=70+reactivity*30;const lightness=40+amp*30;const alpha=0.1+amp*0.6+reactivity*0.2;ctx.strokeStyle=`hsla(${hue},${saturation}%,${lightness}%,${alpha})`;ctx.beginPath();ctx.moveTo(x,0);const yOffset=Math.sin(progress*10+time*2+amp*5)*h*0.4*reactivity;ctx.lineTo(x+yOffset*0.2,h);ctx.stroke();}}
        function drawShaderBackground2(ctx, canvas, audioData, bufLen, reactivity) { /* Code unchanged */ const time=performance.now()/2000;const w=canvas.width;const h=canvas.height;ctx.fillStyle='rgba(3,1,5,0.03)';ctx.fillRect(0,0,w,h);const avgLow=getAverageAmplitude(audioData,0,bufLen*0.1);const avgMid=getAverageAmplitude(audioData,bufLen*0.2,bufLen*0.6);const numWaves=3;ctx.globalCompositeOperation='lighter';for(let i=0;i<numWaves;i++){const grad=ctx.createLinearGradient(0,0,w,h);const hue1=(time*10+i*120)%360;const hue2=(hue1+60+avgMid*60)%360;grad.addColorStop(0,`hsla(${hue1},90%,50%,${0.01+avgLow*0.05})`);grad.addColorStop(0.5,`hsla(${hue2},90%,50%,${0.02+reactivity*0.1})`);grad.addColorStop(1,`hsla(${hue1},90%,50%,${0.01+avgLow*0.05})`);ctx.fillStyle=grad;const waveAmp=h*0.2*(1+avgMid);const waveFreq=2+i*2;const yOffset=Math.sin(time*0.5+i)*h*0.1;ctx.beginPath();ctx.moveTo(0,h/2+yOffset);for(let x=0;x<w;x+=10){const waveY=Math.sin(x/w*Math.PI*waveFreq+time+i)*waveAmp;ctx.lineTo(x,h/2+waveY+yOffset);}ctx.lineTo(w,h/2+yOffset);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();}ctx.globalCompositeOperation='source-over';}
        function drawParticleBackground(ctx, canvas, audioData, bufLen, reactivity) { /* Code unchanged */ const w=canvas.width;const h=canvas.height;ctx.fillStyle='rgba(3,1,5,0.1)';ctx.fillRect(0,0,w,h);const maxParticles=150;const bass=getAverageAmplitude(audioData,0,bufLen*0.05);const high=getAverageAmplitude(audioData,bufLen*0.7,bufLen);if(bass>0.5&&bgParticles.length<maxParticles&&Math.random()<0.5){for(let i=0;i<5;i++){bgParticles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*2*(1+reactivity),vy:(Math.random()-0.5)*2*(1+reactivity),size:1+Math.random()*2,hue:(Math.random()*60+(bass>0.7?300:200))%360,life:1.0});}}ctx.globalCompositeOperation='lighter';for(let i=bgParticles.length-1;i>=0;i--){const p=bgParticles[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.005+high*0.01;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;if(p.life<=0){bgParticles.splice(i,1);continue;}const size=p.size*(1+reactivity*2)*p.life;ctx.fillStyle=`hsla(${p.hue},90%,${60+reactivity*20}%,${p.life*0.7})`;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.5,size),0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}

        const backgroundVisualizers = [ renderNeuralBackground, drawShaderBackground1, drawParticleBackground, drawShaderBackground2 ];

        function switchBackgroundRandomly() {
            if (backgroundVisualizers.length <= 1) return;
            let newIndex;
            do { newIndex = Math.floor(Math.random() * backgroundVisualizers.length); } while (newIndex === currentBackgroundIndex);
            currentBackgroundIndex = newIndex;
            console.log(`Synaptic Field Shift: BG Index ${currentBackgroundIndex} (${backgroundVisualizers[currentBackgroundIndex].name})`);
            if (backgroundVisualizers[currentBackgroundIndex] === renderNeuralBackground) { initNeuralNetwork(); }
            else if (backgroundVisualizers[currentBackgroundIndex] === drawParticleBackground) { bgParticles = []; }
        }

        function renderCurrentBackground() {
            if (!isAudioInitialized || !analyser) {
                bgCtx.fillStyle = 'rgb(3, 1, 5)'; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            analyser.getByteFrequencyData(dataArray); // Single fetch per frame

            else { console.error("Invalid background renderer:", currentBackgroundIndex); }

        // --- MUSIC PLAYER CORE FUNCTIONS (Mostly Unchanged Logic) ---
        function loadTrack(index) {
            index = (index + tracks.length) % tracks.length;
            currentTrackIndex = index;
            const track = tracks[index];
            musicPlayer.src = track.src;

            currentTrackNumEl.textContent = (index + 1).toString().padStart(2, '0');

            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00'; totalTimeEl.textContent = '0:00';
            console.log("Loading Signal:", track.title);
            if (!musicPlayer.paused) { setTimeout(playTrack, 50); }
        }

        function createPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item'; item.dataset.index = i;
                item.innerHTML = `<span>${(i+1).toString().padStart(2,'0')}</span><div class="playlist-item-indicator"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><span>${track.title}</span>`;
                item.addEventListener('click', () => {
                    if (currentTrackIndex !== i) { loadTrack(i); playTrack(); }
                    else { if (musicPlayer.paused) playTrack(); else pauseTrack(); }
                });
                playlistEl.appendChild(item);
            });
            updatePlaylistActiveState();
        }

        function updatePlaylistActiveState() {
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.index) === currentTrackIndex);
            });
            const activeItem = playlistEl.querySelector('.playlist-item.active');
            if (activeItem && playlistEl.style.display !== 'none') {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function playTrack() {
            if (!isAudioInitialized) { initAudio(); setTimeout(() => { if (isAudioInitialized) playTrackInternal(); }, 50); return; }
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => playTrackInternal()).catch(e => {
                    console.error("Resume AC failed:", e); playPauseBtn.textContent = 'Engage';
                });
            } else if (audioContext.state === 'running') { playTrackInternal(); }
            else { playPauseBtn.textContent = 'Engage'; }
        }

        function playTrackInternal() {
            if (!musicPlayer.src) { loadTrack(currentTrackIndex); setTimeout(() => { if (musicPlayer.readyState >= 2) playTrackInternal(); }, 100); return; }
            const playPromise = musicPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    playPauseBtn.textContent = 'Disengage'; startVisualizer(); startBackgroundAnimation();
                }).catch(error => {
                    console.error(`Sig. Playback Failure: ${error.name} - ${error.message}`);
                    if (error.name === 'NotAllowedError') alert('Autoplay protocol denied. Re-engage manually.');
                    else if (error.name === 'NotSupportedError') { alert('Signal format unsupported or corrupt.'); trackTitleEl.textContent = 'Error: Signal Corrupt'; }
                    pauseTrack();
                });
            } else { playPauseBtn.textContent = 'Disengage'; startVisualizer(); startBackgroundAnimation(); }
        }

        function pauseTrack() {
            musicPlayer.pause(); playPauseBtn.textContent = 'Engage';
        }

        function updateProgress() {
            if (!musicPlayer.duration || !isFinite(musicPlayer.duration) || musicPlayer.duration <= 0) {
                progressBar.style.width='0%'; currentTimeEl.textContent=formatTime(0); totalTimeEl.textContent=formatTime(0); return;
            }
            const progressPercent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
            totalTimeEl.textContent = formatTime(musicPlayer.duration);
        }

        function drawViz1() { /* NeonHolographicBars - Code from your player */ const barW=(W()/bufferLength)*1.5;const space=0.5;const time=t();visualizerCtx.save();for(let i=0,x=0;i<bufferLength;i++){const amp=dataArray[i]/255;const h=Math.max(1,amp*H()*0.9);const pulse=0.8+0.2*Math.sin(time*5+i*0.2);const hue=(i/bufferLength)*200+time*20;const grad=visualizerCtx.createLinearGradient(x,H(),x,H()-h*pulse);grad.addColorStop(0,`hsla(${hue%360},100%,60%,0.8)`);grad.addColorStop(0.5,`hsla(${(hue+30)%360},90%,65%,0.6)`);grad.addColorStop(1,`hsla(${(hue+60)%360},80%,70%,0.3)`);visualizerCtx.shadowColor=`hsla(${hue%360},100%,70%,0.6)`;visualizerCtx.shadowBlur=8*amp;visualizerCtx.fillStyle=grad;const r=barW*0.3;visualizerCtx.beginPath();visualizerCtx.moveTo(x+r,H());visualizerCtx.lineTo(x+barW-r,H());visualizerCtx.arcTo(x+barW,H(),x+barW,H()-r,r);visualizerCtx.lineTo(x+barW,H()-h*pulse+r);visualizerCtx.arcTo(x+barW,H()-h*pulse,x+barW-r,H()-h*pulse,r);visualizerCtx.lineTo(x+r,H()-h*pulse);visualizerCtx.arcTo(x,H()-h*pulse,x,H()-h*pulse+r,r);visualizerCtx.lineTo(x,H()-r);visualizerCtx.arcTo(x,H(),x+r,H(),r);visualizerCtx.closePath();visualizerCtx.fill();if(amp>0.6&&Math.random()<0.05){visualizerCtx.save();visualizerCtx.globalCompositeOperation='lighter';visualizerCtx.fillStyle=`rgba(255,255,255,${0.4+Math.random()*0.4})`;const gy=H()-h*(0.2+Math.random()*0.6);const gh=1+Math.random()*3;visualizerCtx.fillRect(x,gy,barW,gh);visualizerCtx.restore();}x+=barW+space;}visualizerCtx.restore();}
        // ... assume drawViz2 through drawViz20 are defined here as per your original player ...
        function drawViz20() { /* DNA Helix Wave - Code from your player */ const amplitude=H()*0.3;const frequency=5;const points=100;const rotationSpeed=t()*0.5;const bass=getAverageAmplitude(dataArray,0,bufferLength*0.1);const mid=getAverageAmplitude(dataArray,bufferLength*0.1,bufferLength*0.6);visualizerCtx.save();visualizerCtx.lineWidth=1+bass*3;function drawStrand(offset){visualizerCtx.beginPath();for(let i=0;i<=points;i++){const progress=i/points;const x=W()*progress;const angle=progress*Math.PI*frequency+rotationSpeed+offset;const dataIndex=Math.floor(progress*bufferLength);const ampMod=(dataArray[dataIndex]||0)/255*0.5+0.5;const y=CY()+Math.sin(angle)*amplitude*ampMod;if(i===0)visualizerCtx.moveTo(x,y);else visualizerCtx.lineTo(x,y);}const hue=(offset===0)?(t()*20)%360:(t()*20+180)%360;visualizerCtx.strokeStyle=`hsla(${hue},100%,60%,0.8)`;visualizerCtx.stroke();if(offset===0){visualizerCtx.lineWidth=0.5+mid*1.5;visualizerCtx.strokeStyle='rgba(200,200,200,0.4)';for(let i=0;i<=points;i+=5){const progress=i/points;const x=W()*progress;const angle1=progress*Math.PI*frequency+rotationSpeed;const angle2=progress*Math.PI*frequency+rotationSpeed+Math.PI;const dataIndex=Math.floor(progress*bufferLength);const ampMod=(dataArray[dataIndex]||0)/255*0.5+0.5;const y1=CY()+Math.sin(angle1)*amplitude*ampMod;const y2=CY()+Math.sin(angle2)*amplitude*ampMod;visualizerCtx.beginPath();visualizerCtx.moveTo(x,y1);visualizerCtx.lineTo(x,y2);visualizerCtx.stroke();}}}drawStrand(0);drawStrand(Math.PI);visualizerCtx.restore();}

             if (isAudioInitialized && audioContext.state==='suspended') audioContext.resume().then(()=>loadTrack(currentTrackIndex+1)); else loadTrack(currentTrackIndex+1);

        }
