<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuromantic Player</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    
    :root {
      --primary: #00e5ff;
      --secondary: #3bff00;
      --accent: #ff4b00;
      --bg-dark: #050607;
      --bg-medium: #0a0c0e;
      --bg-light: #10171f; 
      --text: #e0e0e0;
      --grid-color: rgba(0, 229, 255, 0.1);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at top right, rgba(0, 229, 255, 0.05), transparent 60%),
        radial-gradient(circle at bottom left, rgba(59, 255, 0, 0.05), transparent 60%);
      z-index: -2;
    }
    
    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.8;
    }
    
    .grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -1;
      opacity: 0.3;
      perspective: 1000px;
      transform-style: preserve-3d;
      animation: gridPulse 8s infinite linear;
    }
    
    @keyframes gridPulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.4; }
      100% { opacity: 0.2; }
    }
    
    header {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      animation: glitch 5s infinite;
    }
    
    @keyframes glitch {
      0% { transform: translate(0); }
      2% { transform: translate(-3px, 2px); filter: hue-rotate(0deg); }
      3% { transform: translate(0); }
      10% { transform: translate(0); }
      12% { transform: translate(5px, -2px); filter: hue-rotate(45deg); }
      13% { transform: translate(0); }
      100% { transform: translate(0); }
    }
    
    header::after {
      content: 'PLAYER';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--secondary);
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
      animation: flicker 4s infinite;
    }
    
    @keyframes flicker {
      0% { opacity: 1; }
      5% { opacity: 0.8; }
      10% { opacity: 1; }
      15% { opacity: 0.3; }
      20% { opacity: 1; }
      55% { opacity: 1; }
      60% { opacity: 0.3; }
      65% { opacity: 1; }
      100% { opacity: 1; }
    }
    
    .player-container {
      width: 90%;
      max-width: 800px;
      background: var(--bg-light);
      border-radius: 0;
      position: relative;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(0, 229, 255, 0.1),
        0 0 30px rgba(0, 229, 255, 0.2);
      overflow: hidden;
    }
    
    .player-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      z-index: 10;
      box-shadow: 0 0 15px var(--primary);
    }
    
    .player-container::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 0%, rgba(0, 229, 255, 0.05) 50%, transparent 100%);
      pointer-events: none;
    }
    
    .track-info {
      display: grid;
      grid-template-columns: 1fr auto;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      position: relative;
    }
    
    .track-title {
      font-weight: bold;
      color: var(--primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.2rem;
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
      letter-spacing: 1px;
    }
    
    .track-number { 
      color: var(--secondary);
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 5px rgba(59, 255, 0, 0.5);
    }
    
    .track-info::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }
    
    .progress-container {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      box-shadow: 0 0 15px var(--primary);
      position: relative;
    }
    
    .progress-bar::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 8px;
      background: var(--text);
      box-shadow: 0 0 10px white;
    }
    
    .time-display {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 1rem 1.5rem;
      border-top: 1px solid rgba(0, 229, 255, 0.1);
    }
    
    .controls button {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      padding: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    
    .controls button:hover {
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
    }
    
    .controls button::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s;
    }
    
    .controls button:hover::after {
      width: 80%;
      box-shadow: 0 0 10px var(--primary);
    }
    
    canvas {
      width: 100%;
      height: 200px;
      display: block;
    }
    
    .visualizer-container {
      position: relative;
      width: 100%;
      height: 200px;
      pointer-events: none;
      overflow: hidden;
      background: var(--bg-medium);
    }
    
    .visualizer-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%),
        linear-gradient(0deg, var(--bg-medium), transparent 80%);
      z-index: 1;
      pointer-events: none;
    }
    
    .visualizer-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--bg-medium);
      border-top: 1px solid rgba(0, 229, 255, 0.2);
    }
    
    .visualizer-controls button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.75rem 0.25rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
      position: relative;
    }
    
    .visualizer-controls button::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--secondary);
      transition: width 0.3s;
    }
    
    .visualizer-controls button:hover::after {
      width: 100%;
    }
    
    .visualizer-controls button.active { 
      color: var(--secondary);
      text-shadow: 0 0 5px var(--secondary);
    }
    
    .visualizer-controls button.active::after {
      width: 100%;
      box-shadow: 0 0 10px var(--secondary);
    }
    
    .playlist-toggle {
      width: 100%;
      background: var(--bg-medium);
      border: none;
      padding: 1rem;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      position: relative;
      border-top: 1px solid rgba(0, 229, 255, 0.2);
    }
    
    .playlist-toggle:hover {
      color: var(--primary);
    }
    
    .playlist-toggle::after {
      content: "▼";
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      transition: transform 0.3s;
    }
    
    .playlist-toggle.active::after {
      transform: translateY(-50%) rotate(180deg);
    }
    
    .playlist-container {
      max-height: 300px;
      overflow-y: auto;
      background: var(--bg-medium);
      border-top: 1px solid rgba(0, 229, 255, 0.1);
      scrollbar-width: thin;
      scrollbar-color: var(--primary) var(--bg-medium);
    }
    
    .playlist-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .playlist-container::-webkit-scrollbar-track {
      background: var(--bg-medium);
    }
    
    .playlist-container::-webkit-scrollbar-thumb {
      background-color: var(--primary);
    }
    
    .playlist-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(0, 229, 255, 0.05);
      transition: all 0.3s;
    }
    
    .playlist-item:hover { 
      background: rgba(0, 229, 255, 0.1);
      transform: translateX(5px);
    }
    
    .playlist-item.active { 
      background: rgba(0, 229, 255, 0.15);
      border-left: 3px solid var(--primary);
    }
    
    .playlist-item.active span:last-child { 
      color: var(--primary);
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
    }
    
    /* Volume control */
    .volume-control {
      position: relative;
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: var(--bg-medium);
      border-top: 1px solid rgba(0, 229, 255, 0.1);
    }
    
    .volume-icon {
      margin-right: 10px;
      color: var(--text);
      font-size: 1.2rem;
    }
    
    .volume-slider {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    
    .volume-level {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      border-radius: 2px;
      width: 75%;
    }
    
    .volume-knob {
      position: absolute;
      top: 50%;
      left: 75%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: var(--text);
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }
    
    /* Equalizer toggle */
    .eq-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.75rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(10, 12, 14, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    
    .eq-toggle:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    
    /* Equalizer panel */
    .equalizer {
      display: none;
      padding: 1rem;
      background: var(--bg-medium);
      border-top: 1px solid rgba(0, 229, 255, 0.1);
    }
    
    .equalizer.active {
      display: block;
    }
    
    .eq-sliders {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
    }
    
    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .eq-slider {
      height: 100px;
      width: 4px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      margin: 0 10px;
    }
    
    .eq-level {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(0deg, var(--primary), var(--secondary));
    }
    
    .eq-knob {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 6px;
      background: var(--text);
      cursor: pointer;
    }
    
    .eq-label {
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
    }
    
    /* Now playing indicator */
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    
    .now-playing {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      animation: pulse 2s infinite;
    }
    
    .now-playing::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 5px var(--accent);
    }
    
    /* Audio spectrum animation */
    .spectrum-animation {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      z-index: 5;
      animation: spectrumPulse 2s infinite;
    }
    
    @keyframes spectrumPulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    
    /* Dark mode toggle */
    .dark-mode-toggle {
      position: absolute;
      top: 10px;
      right: 120px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 0.5rem 1rem;
      background: rgba(10, 12, 14, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    
    .dark-mode-toggle:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    
    /* Cyberpunk effects */
    .glitch-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      background: rgba(0, 229, 255, 0.05);
      mix-blend-mode: overlay;
    }
    
    .glitch-active {
      animation: glitchEffect 0.5s;
    }
    
    @keyframes glitchEffect {
      0% { opacity: 0; }
      10% { opacity: 0.8; transform: translate(10px, 0); }
      20% { opacity: 0; }
      30% { opacity: 0.6; transform: translate(-15px, 0); }
      40% { opacity: 0; }
      50% { opacity: 0.9; transform: translate(5px, 0); }
      60% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <canvas id="background-canvas"></canvas>
  
  <header>Neuromantic</header>
  <div class="player-container">
    <div class="now-playing">Now Playing</div>
    <button class="eq-toggle">EQ</button>
    <button class="dark-mode-toggle">HDMI</button>
    
    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
      <div class="spectrum-animation"></div>
    </div>
  
    <audio id="musicPlayer" src="track1.mp3"></audio>
    <div class="track-info">
      <div class="track-title" id="trackTitle">Liquid Dreams</div>
      <div class="track-number"><span id="currentTrackNum">1</span>/20</div>
    </div>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    
    <div class="volume-control">
      <div class="volume-icon">◄</div>
      <div class="volume-slider">
        <div class="volume-level"></div>
        <div class="volume-knob"></div>
      </div>
    </div>
    
    <div class="controls">
      <button id="prevTrack">Prev</button>
      <button id="playPause">Play</button>
      <button id="nextTrack">Next</button>
    </div>
    
    <div class="visualizer-controls">
      <button id="viz1" class="active">Bars</button>
      <button id="viz2">Circles</button>
      <button id="viz3">Wave</button>
      <button id="viz4">Grid</button>
      <button id="viz5">Plasma</button>
    </div>
    
    <div class="equalizer">
      <div class="eq-sliders">
        <div class="eq-band">
          <div class="eq-slider">
            <div class="eq-level" style="height: 70%;"></div>
            <div class="eq-knob" style="top: 30%;"></div>
          </div>
          <div class="eq-label">60Hz</div>
        </div>
        <div class="eq-band">
          <div class="eq-slider">
            <div class="eq-level" style="height: 50%;"></div>
            <div class="eq-knob" style="top: 50%;"></div>
          </div>
          <div class="eq-label">250Hz</div>
        </div>
        <div class="eq-band">
          <div class="eq-slider">
            <div class="eq-level" style="height: 60%;"></div>
            <div class="eq-knob" style="top: 40%;"></div>
          </div>
          <div class="eq-label">1kHz</div>
        </div>
        <div class="eq-band">
          <div class="eq-slider">
            <div class="eq-level" style="height: 80%;"></div>
            <div class="eq-knob" style="top: 20%;"></div>
          </div>
          <div class="eq-label">4kHz</div>
        </div>
        <div class="eq-band">
          <div class="eq-slider">
            <div class="eq-level" style="height: 40%;"></div>
            <div class="eq-knob" style="top: 60%;"></div>
          </div>
          <div class="eq-label">16kHz</div>
        </div>
      </div>
    </div>
    
    <button class="playlist-toggle" id="playlistToggle">Playlist</button>
    <div class="playlist-container" id="playlist" style="display:none;">
      <div class="playlist-item active">
        <span>01</span>
        <span>Liquid Dreams</span>
      </div>
      <div class="playlist-item">
        <span>02</span>
        <span>Binary Sunset</span>
      </div>
      <div class="playlist-item">
        <span>03</span>
        <span>Neon Rainfall</span>
      </div>
      <div class="playlist-item">
        <span>04</span>
        <span>Digital Wasteland</span>
      </div>
      <div class="playlist-item">
        <span>05</span>
        <span>Chrome Hearts</span>
      </div>
      <div class="playlist-item">
        <span>06</span>
        <span>Neural Network</span>
      </div>
      <div class="playlist-item">
        <span>07</span>
        <span>Electric Dreams</span>
      </div>
    </div>
    
    <div class="glitch-effect"></div>
  </div>
  
  <script>
    // Initialize background canvas
    const backgroundCanvas = document.getElementById('background-canvas');
    const bgCtx = backgroundCanvas.getContext('2d');
    
    // Set canvas dimensions
    backgroundCanvas.width = window.innerWidth;
    backgroundCanvas.height = window.innerHeight;
    
    // Hexagon grid background
    function drawHexagonGrid() {
      bgCtx.clearRect(0, 0, backgroundCanvas.width, backgroundCanvas.height);
      
      const hexSize = 30;
      const hexHeight = hexSize * Math.sqrt(3);
      const hexWidth = hexSize * 2;
      
      for (let y = -hexHeight; y < backgroundCanvas.height + hexHeight; y += hexHeight) {
        for (let x = -hexWidth; x < backgroundCanvas.width + hexWidth; x += hexWidth * 0.75) {
          const offsetY = (Math.floor(x / (hexWidth * 0.75)) % 2) * (hexHeight / 2);
          
          bgCtx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = 2 * Math.PI / 6 * i;
            const xPos = x + hexSize * Math.cos(angle);
            const yPos = y + offsetY + hexSize * Math.sin(angle);
            
            if (i === 0) {
              bgCtx.moveTo(xPos, yPos);
            } else {
              bgCtx.lineTo(xPos, yPos);
            }
          }
          bgCtx.closePath();
          
          // Random opacity and color variations
          const opacity = 0.05 + Math.random() * 0.08;
          const colorVariation = Math.floor(Math.random() * 40);
          
          if (Math.random() > 0.97) {
            // Occasionally make a hexagon glow
            bgCtx.fillStyle = `rgba(0, ${180 + colorVariation}, ${230 + colorVariation}, ${opacity * 3})`;
            bgCtx.shadowColor = 'rgba(0, 229, 255, 0.5)';
            bgCtx.shadowBlur = 10;
          } else {
            bgCtx.fillStyle = `rgba(0, ${200 + colorVariation}, 255, ${opacity})`;
            bgCtx.shadowBlur = 0;
          }
          
          bgCtx.strokeStyle = `rgba(0, ${200 + colorVariation}, 255, ${opacity * 1.5})`;
          bgCtx.lineWidth = 1;
          bgCtx.stroke();
          
          if (Math.random() > 0.8) {
            bgCtx.fill();
          }
        }
      }
      
      // Add some floating particles
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * backgroundCanvas.width;
        const y = Math.random() * backgroundCanvas.height;
        const size = Math.random() * 2 + 1;
        
        bgCtx.beginPath();
        bgCtx.arc(x, y, size, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(${Math.random() > 0.5 ? '0, 229, 255' : '59, 255, 0'}, ${Math.random() * 0.5 + 0.2})`;
        bgCtx.fill();
      }
      
      requestAnimationFrame(drawHexagonGrid);
    }

// ======= NEURON CLASS =======
class Neuron {
  constructor(x, y, layer, size, speed) {
    this.x = x;
    this.y = y;
    this.layer = layer;
    this.size = size;
    this.speed = speed;
    this.pulse = 0;
  }

  update(audioValue, reactivityFactor) {
    // Map the audio value to a pulse effect
    this.pulse = (audioValue / 255) * 3 * reactivityFactor;
  }
}

// ======= CONNECTION CLASS =======
class Connection {
  constructor(from, to, weight) {
    this.from = from;
    this.to = to;
    this.weight = weight;
    this.signal = Math.random(); // start at a random phase for extra dynamism
  }

  update(reactivityFactor) {
    // Move the signal along the connection based on the reactivity factor
    this.signal = (this.signal + reactivityFactor * 0.05) % 1;
  }
}

// ======= NEURAL NETWORK CLASS =======
class NeuralNetwork {
  constructor(layerCount, canvas) {
    this.layerCount = layerCount;
    this.canvas = canvas;
    this.neurons = [];
    this.connections = [];
    this.initNeurons();
    this.initConnections();
  }

  initNeurons() {
    this.neurons = [];
    for (let layer = 0; layer < this.layerCount; layer++) {
      // Use fewer neurons in the input and output layers
      const neuronsInLayer = layer === 0 || layer === this.layerCount - 1 ? 10 : 20;
      const layerX = (this.canvas.width / (this.layerCount - 1)) * layer;
      for (let i = 0; i < neuronsInLayer; i++) {
        const ySpread = layer === 0 || layer === this.layerCount - 1 ? 0.6 : 0.8;
        const y = this.canvas.height * (0.5 - ySpread / 2 + ySpread * (i / (neuronsInLayer - 1)));
        const size = Math.random() * 3 + 2;
        const speed = Math.random() * 0.02 + 0.01;
        this.neurons.push(new Neuron(layerX, y, layer, size, speed));
      }
    }
  }

  initConnections() {
    this.connections = [];
    // For each neuron, connect it to some neurons in the next layer
    this.neurons.forEach(from => {
      if (from.layer < this.layerCount - 1) {
        const nextLayerNeurons = this.neurons.filter(n => n.layer === from.layer + 1);
        for (let j = 0; j < nextLayerNeurons.length; j += 2) {
          const weight = Math.random();
          this.connections.push(new Connection(from, nextLayerNeurons[j], weight));
        }
      }
    });
  }

  update(audioData, bufferLength, reactivityFactor) {
    // Update neurons with audio data
    this.neurons.forEach((neuron, index) => {
      const freqIndex = Math.floor((index / this.neurons.length) * bufferLength);
      neuron.update(audioData[freqIndex], reactivityFactor);
    });
    // Update connections based on reactivity
    this.connections.forEach(conn => conn.update(reactivityFactor));
  }

  render(ctx, colorSchemes, currentColorScheme, reactivityFactor) {
    // Draw neurons with a subtle oscillation
    this.neurons.forEach(neuron => {
      const oscillation = Math.sin(performance.now() * neuron.speed) * 0.5;
      const finalSize = neuron.size + neuron.pulse + oscillation;
      const colors = colorSchemes[currentColorScheme];
      ctx.fillStyle = colors.neuron;
      ctx.beginPath();
      ctx.arc(neuron.x, neuron.y, finalSize, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw connections between neurons
    this.connections.forEach(conn => {
      const dx = conn.to.x - conn.from.x;
      const dy = conn.to.y - conn.from.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      // Draw only connections within a reasonable distance
      if (distance < this.canvas.width / 2) {
        const signalX = conn.from.x + dx * conn.signal;
        const signalY = conn.from.y + dy * conn.signal;

        // Draw the base connection line
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.05 + conn.weight * 0.1})`;
        ctx.beginPath();
        ctx.moveTo(conn.from.x, conn.from.y);
        ctx.lineTo(conn.to.x, conn.to.y);
        ctx.stroke();

        // Draw the moving signal along the connection
        const colors = colorSchemes[currentColorScheme];
        ctx.fillStyle = colors.connection;
        ctx.beginPath();
        ctx.arc(signalX, signalY, 2 * reactivityFactor + 1, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
}

// ======= MAIN RENDERING FUNCTION =======
function renderNeuralBackground() {
  if (!audioContext) {
    bgAnimationId = requestAnimationFrame(renderNeuralBackground);
    return;
  }

  bgAnimationId = requestAnimationFrame(renderNeuralBackground);
  analyser.getByteFrequencyData(dataArray);

  // Calculate overall audio reactivity
  let sum = 0;
  for (let i = 0; i < bufferLength; i++) {
    sum += dataArray[i];
  }
  const reactivityFactor = sum / (bufferLength * 255);

  // Create a dynamic gradient background for smooth trails
  const gradient = bgCtx.createLinearGradient(0, 0, bgCanvas.width, bgCanvas.height);
  gradient.addColorStop(0, `rgba(10, 11, 12, ${0.08 + reactivityFactor * 0.05})`);
  gradient.addColorStop(1, `rgba(10, 11, 12, ${0.08 + reactivityFactor * 0.05})`);
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  // Update the neural network
  neuralNetwork.update(dataArray, bufferLength, reactivityFactor);

  // Render the neural network
  neuralNetwork.render(bgCtx, colorSchemes, currentColorScheme, reactivityFactor);

  // Occasionally change the color scheme for an extra vibe
  if (Math.random() < 0.001 + reactivityFactor * 0.01) {
    currentColorScheme = (currentColorScheme + 1) % colorSchemes.length;
  }
}

/* 1. Neon Holographic Bars – With Particle Glitch Overlays */
function drawNeonHolographicBars() {
  const barWidth = (canvas.width / bufferLength) * 1.8;
  const t = Date.now() * 0.002;
  
  for (let i = 0, x = 0; i < bufferLength; i++, x += barWidth + 1) {
    const amplitude = dataArray[i] / 255;
    const barHeight = amplitude * canvas.height * 0.8;
    const pulse = 0.5 + 0.5 * Math.sin(t + i * 0.3);
    
    // Create a neon gradient
    const hue = (i / bufferLength) * 360 + t * 30;
    const gradient = ctx.createLinearGradient(x, canvas.height, x, canvas.height - barHeight * pulse);
    gradient.addColorStop(0, `hsla(${hue % 360}, 100%, 70%, 0.9)`);
    gradient.addColorStop(0.5, `hsla(${(hue + 40) % 360}, 100%, 60%, 0.7)`);
    gradient.addColorStop(1, `hsla(${(hue + 100) % 360}, 100%, 50%, 0.3)`);
    
    ctx.save();
    ctx.shadowColor = `hsla(${hue % 360}, 100%, 70%, 0.8)`;
    ctx.shadowBlur = 20 * amplitude;
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(x, canvas.height);
    ctx.lineTo(x, canvas.height - barHeight * 0.6);
    ctx.quadraticCurveTo(x + barWidth / 2, canvas.height - barHeight, x + barWidth, canvas.height - barHeight * 0.6);
    ctx.lineTo(x + barWidth, canvas.height);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    
    // Glitch overlay: occasional horizontal slices of bright noise
    if (Math.random() < 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * Math.random()})`;
      const glitchY = canvas.height - barHeight * Math.random();
      ctx.fillRect(x, glitchY, barWidth, 2 + Math.random() * 4);
      ctx.restore();
    }
  }
}

/* 2. Quantum Circles X – Orbiting Pulses and Laser Lines */
function drawQuantumCirclesX() {
  const t = performance.now() / 1000;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  
  for (let i = 0; i < bufferLength; i++) {
    const angle = (Math.PI * 2 * i / bufferLength) + (0.1 * Math.sin(t + i * 0.15));
    const baseRadius = (dataArray[i] / 255) * (Math.min(canvas.width, canvas.height) / 3);
    const pulsate = 1 + 0.3 * Math.sin(t * 4 + i);
    const orbitRadius = baseRadius * pulsate;
    
    const x = centerX + Math.cos(angle) * orbitRadius;
    const y = centerY + Math.sin(angle) * orbitRadius;
    
    const hue = ((i * 360 / bufferLength) + t * 50) % 360;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, orbitRadius * 0.1);
    gradient.addColorStop(0, `hsla(${hue}, 100%, 65%, 1)`);
    gradient.addColorStop(1, `hsla(${(hue + 50) % 360}, 100%, 50%, 0)`);
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, orbitRadius * 0.1, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + 0.7 * Math.abs(Math.sin(t + i))})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(centerX, centerY);
    ctx.stroke();
    
    ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.5)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, orbitRadius * 0.12, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/* 3. Neural Wave V2 – Futuristic, Fluid Audio Oscillations */
function drawNeuralWaveV2() {
  ctx.lineWidth = 3;

  ctx.beginPath();
  
  const sliceWidth = canvas.width / (bufferLength - 1);
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i] / 255;
    const x = i * sliceWidth;
    // Oscillate the y position for a fluid effect
    const y = canvas.height / 2 + (v - 0.5) * canvas.height * 0.9 * Math.sin(i * 0.03 + performance.now() * 0.005);
    
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    
    // Draw small flickering micro-circles along the wave
    ctx.fillStyle = `rgba(${200 + v * 55}, ${100 + v * 155}, 255, 0.8)`;
    ctx.beginPath();
    ctx.arc(x, y, 2 + v * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.stroke();
}

/* 5. Hyper 4D Spectrum – Multilayer Frequency Bars with Depth & Glitch FX */
function drawHyper4DSpectrum() {
  const barWidth = canvas.width / bufferLength;
  const t = Date.now() / 1000;
  
  for (let i = 0; i < bufferLength; i++) {
    const amplitude = dataArray[i] / 255;
    const barHeight = amplitude * canvas.height;
    const x = i * barWidth;
    const hue = (i / bufferLength) * 360;
    
    const gradient1 = ctx.createLinearGradient(x, canvas.height, x, canvas.height - barHeight);
    gradient1.addColorStop(0, `hsla(${hue}, 100%, 55%, 1)`);
    gradient1.addColorStop(1, `hsla(${hue}, 100%, 75%, 0.2)`);
    ctx.fillStyle = gradient1;
    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
    
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5 + i);
    const gradient2 = ctx.createLinearGradient(x, canvas.height, x, canvas.height - barHeight * 0.5);
    gradient2.addColorStop(0, `hsla(${(hue + 180) % 360}, 100%, 60%, 0.7)`);
    gradient2.addColorStop(1, `hsla(${(hue + 180) % 360}, 100%, 80%, 0.1)`);
    ctx.fillStyle = gradient2;
    ctx.fillRect(x, canvas.height - barHeight * 0.5, barWidth, barHeight * 0.5);
    
    ctx.globalAlpha = 1;
    
    if (Math.random() < 0.015) {
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.random() * 0.5})`;
      ctx.lineWidth = 1;
      const glitchX = x + barWidth * Math.random();
      ctx.beginPath();
      ctx.moveTo(glitchX, canvas.height - barHeight * Math.random());
      ctx.lineTo(glitchX, canvas.height - barHeight * Math.random());
      ctx.stroke();
      ctx.restore();
    }
  }
}

// Helper: Calculate average bass amplitude from a slice of the data array
function getAverageBass(dataArray, start, end) {
  let sum = 0;
  for (let i = start; i < end; i++) {
    sum += dataArray[i];
  }
  return sum / (end - start) / 255;
}
