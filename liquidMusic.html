<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuromantic Cryo-Signal X26 (Audio Mod)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --primary-accent: #00ffc3;  /* Vibrant Mint/Teal */
            --secondary-accent: #00bcd4; /* Luminous Cyan */
            --tertiary-accent: #7c4dff;  /* Energetic Purple */

            --bg-deep-space: #020305;
            --bg-interface: #0a0c10;
            --text-color: #e0f0f8;
            --text-muted: #9cb0c0;

            --glass-ink-bg: rgba(10, 12, 16, 0.82); /* Slightly more opaque */
            --glass-ink-border: rgba(0, 255, 195, 0.25);
            --glass-ink-shadow: 0 0 25px rgba(0, 255, 195, 0.1);

            --glow-primary: 0 0 8px var(--primary-accent), 0 0 16px var(--primary-accent), 0 0 24px rgba(0, 255, 195, 0.4);
            --glow-secondary: 0 0 8px var(--secondary-accent), 0 0 16px var(--secondary-accent), 0 0 24px rgba(0, 188, 212, 0.4);
            --glow-tertiary: 0 0 10px var(--tertiary-accent), 0 0 20px var(--tertiary-accent), 0 0 30px rgba(124, 77, 255, 0.3);

            --radius-main: 20px;
            --radius-small: 10px;
            --transition-main: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-fast: 0.2s ease-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep-space); color: var(--text-color); font-family: 'Space Mono', monospace;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow: hidden; position: relative;
        }

        body::before { /* Grain unchanged */
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.025; animation: grain 7s steps(10) infinite; z-index: -2;
        }
        @keyframes grain {0%,100%{transform:translate(0,0)}10%{transform:translate(-1%,-1%)}20%{transform:translate(1%,-2%)}30%{transform:translate(-2%,1%)}40%{transform:translate(2%,2%)}50%{transform:translate(-1%,2%)}60%{transform:translate(1%,-1%)}70%{transform:translate(-2%,-2%)}80%{transform:translate(2%,1%)}90%{transform:translate(-1%,1%)}}

        #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.75; }

        header { font-size: 2rem; font-weight: 700; margin-bottom: 2.5rem; position: relative; text-transform: uppercase; color: var(--primary-accent); z-index: 1; letter-spacing: 1px; text-shadow: var(--glow-primary); animation: headerPulse 5s infinite alternate ease-in-out; }
        @keyframes headerPulse {0%{text-shadow:0 0 8px var(--primary-accent),0 0 16px rgba(0,255,195,0.3);opacity:.9}100%{text-shadow:var(--glow-primary),0 0 40px rgba(0,255,195,0.2);opacity:1}}
        header::after { content:'PLAYER X26'; position:absolute; left:0; top:0; color:var(--secondary-accent); clip-path:polygon(0 0,100% 0,100% 50%,0 50%); text-shadow:var(--glow-secondary); filter:blur(.5px); }

        .player-container {
            width: 95%; max-width: 700px; border-radius: var(--radius-main); position: relative; z-index: 1;
            overflow: hidden; background: var(--glass-ink-bg); backdrop-filter: blur(16px) saturate(110%);
            -webkit-backdrop-filter: blur(16px) saturate(110%); border: 1px solid var(--glass-ink-border);
            box-shadow: var(--glass-ink-shadow), 0 15px 50px rgba(0,0,0,0.5);
            display: grid;
            grid-template-areas:
                "visualizer visualizer"
                "info info"
                "progress progress"
                "time time"
                "controls controls"
                "filter-modulator filter-modulator"
                "viz-controls viz-controls"
                "playlist-toggle playlist-toggle"
                "playlist playlist";
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            animation: float 8s ease-in-out infinite alternate;
        }
        @keyframes float {0%{transform:translateY(0px) rotate(-.2deg)}50%{transform:translateY(-5px) rotate(.2deg)}100%{transform:translateY(0px) rotate(-.2deg)}}

        .player-container::before { /* Animated Border */
            content:'';position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;width:calc(100% + 2px);height:calc(100% + 2px);
            border-radius:var(--radius-main);padding:2px;background:linear-gradient(135deg,var(--primary-accent),var(--secondary-accent),var(--tertiary-accent),var(--primary-accent));
            background-size:400% 400%;animation:borderFlowEnergetic 6s linear infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;z-index:-1;
        }
        @keyframes borderFlowEnergetic {0%{background-position:0% 50%;filter:hue-rotate(0deg) brightness(1.0)}50%{background-position:100% 50%;filter:hue-rotate(45deg) brightness(1.2)}100%{background-position:0% 50%;filter:hue-rotate(0deg) brightness(1.0)}}

        /* Grid Area Assignments */
        .visualizer-canvas-container { grid-area: visualizer; }
        .track-info-wrapper { grid-area: info; }
        .progress-container { grid-area: progress; }
        .time-display { grid-area: time; }
        .controls { grid-area: controls; }
        .filter-modulator { grid-area: filter-modulator; }
        .visualizer-controls { grid-area: viz-controls; }
        .playlist-toggle { grid-area: playlist-toggle; }
        .playlist-container { grid-area: playlist; }

        .visualizer-canvas-container { height:180px;position:relative;overflow:hidden;border-bottom:1px solid var(--glass-ink-border);background:radial-gradient(ellipse at center,rgba(10,12,16,0.1) 0%,transparent 70%); }
        #visualizer { width:100%;height:100%;display:block;opacity:.9; }
        .track-info-wrapper { padding:1rem 1.5rem;border-bottom:1px solid var(--glass-ink-border);display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:60px; }
        .track-title { font-weight:700;font-size:1.1rem;color:var(--primary-accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 5px var(--primary-accent);flex-grow:1; }
        .track-number { color:var(--secondary-accent);font-size:.9rem;text-shadow:0 0 3px var(--secondary-accent); }
        .progress-container { height:8px;background:rgba(255,255,255,0.05);cursor:pointer;overflow:hidden;margin:.5rem 1.5rem;border-radius:var(--radius-small);position:relative; }
        .progress-bar { height:100%;background:linear-gradient(90deg,var(--primary-accent),var(--secondary-accent));width:0%;transition:width .1s linear;border-radius:var(--radius-small);box-shadow:0 0 8px var(--secondary-accent);animation:progressBarPulse 2s infinite alternate; }
        @keyframes progressBarPulse { from{filter:brightness(.9) saturate(.9);box-shadow:0 0 6px var(--secondary-accent)} to{filter:brightness(1.1) saturate(1.1);box-shadow:0 0 12px var(--secondary-accent)} }
        .time-display { display:flex;justify-content:space-between;padding:.5rem 1.5rem .75rem;font-size:.8rem;color:var(--text-muted);font-weight:700; }
        .controls { display:grid;grid-template-columns:repeat(3,1fr);padding:.75rem 1.5rem;border-top:1px solid var(--glass-ink-border);border-bottom:1px solid var(--glass-ink-border); }
        .controls button { background:transparent;border:none;color:var(--text-color);font-family:inherit;padding:.85rem .5rem;cursor:pointer;text-transform:uppercase;font-weight:700;font-size:.9rem;transition:var(--transition-main);text-shadow:0 0 3px rgba(224,240,248,0.3);position:relative; }
        .controls button::after { content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:0;height:2px;background-color:var(--primary-accent);transition:width var(--transition-fast); }
        .controls button:hover, .controls button:focus-visible { color:var(--primary-accent);transform:translateY(-3px);text-shadow:var(--glow-primary); }
        .controls button:hover::after, .controls button:focus-visible::after { width:60%; }
        .controls button:active { transform:translateY(0px) scale(.98);color:var(--secondary-accent); }

        /* --- Filter Modulator Styles --- */
        .filter-modulator {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-ink-border);
            background: rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        .filter-modulator-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: -0.25rem;
            text-align: center;
        }
        .filter-type-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 0.5rem;
        }
        .filter-type-selector button {
            background: transparent;
            border: 1px solid var(--glass-ink-border);
            color: var(--text-muted);
            font-family: inherit; font-size: 0.65rem; font-weight: 700;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-small);
            cursor: pointer;
            transition: var(--transition-fast);
            min-width: 40px;
        }
        .filter-type-selector button.active {
            background-color: var(--tertiary-accent);
            border-color: var(--tertiary-accent);
            color: var(--bg-interface);
            box-shadow: var(--glow-tertiary);
            transform: scale(1.05);
        }
        .filter-type-selector button:hover:not(.active),
        .filter-type-selector button:focus-visible:not(.active) {
            border-color: var(--tertiary-accent);
            color: var(--tertiary-accent);
            background-color: rgba(124, 77, 255, 0.1);
        }
        .filter-slider-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .filter-slider-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            width: 70px;
            text-align: right;
            white-space: nowrap;
        }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; cursor: pointer; background: transparent; }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; }
        input[type="range"]::-moz-range-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -4px; width: 14px; height: 14px; background: var(--tertiary-accent); border: 2px solid var(--bg-interface); border-radius: 50%; box-shadow: 0 0 6px var(--tertiary-accent); transition: background-color var(--transition-fast), box-shadow var(--transition-fast); }
        input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: var(--tertiary-accent); border: 2px solid var(--bg-interface); border-radius: 50%; box-shadow: 0 0 6px var(--tertiary-accent); transition: background-color var(--transition-fast), box-shadow var(--transition-fast); }
        input[type="range"]:hover::-webkit-slider-thumb,
        input[type="range"]:focus-visible::-webkit-slider-thumb { background: var(--primary-accent); box-shadow: 0 0 8px var(--primary-accent); }
        input[type="range"]:hover::-moz-range-thumb,
        input[type="range"]:focus-visible::-moz-range-thumb { background: var(--primary-accent); box-shadow: 0 0 8px var(--primary-accent); }

        .filter-value-display {
            font-size: 0.7rem;
            color: var(--secondary-accent);
            min-width: 40px;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .visualizer-controls { display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:1rem 1.5rem;background:rgba(0,0,0,0.25);border-bottom:1px solid var(--glass-ink-border);min-height:60px; }
        .visualizer-controls button { background:transparent;border:1px solid var(--glass-ink-border);color:var(--text-muted);font-family:inherit;font-size:.6rem;width:28px;height:28px;border-radius:50%;cursor:pointer;transition:var(--transition-main);display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:inset 0 0 5px rgba(0,0,0,0.3); }
        .visualizer-controls button.active { color:var(--bg-interface);font-weight:bold;background-color:var(--secondary-accent);border-color:var(--secondary-accent);box-shadow:var(--glow-secondary),inset 0 0 5px rgba(0,0,0,0.3);transform:scale(1.15); }
        .visualizer-controls button:hover:not(.active), .visualizer-controls button:focus-visible:not(.active) { color:var(--primary-accent);border-color:var(--primary-accent);background-color:rgba(0,255,195,0.1);transform:scale(1.1);box-shadow:0 0 8px var(--primary-accent); }

        .playlist-toggle { width:100%;background:transparent;border:none;padding:1rem;color:var(--text-color);font-family:inherit;cursor:pointer;text-transform:uppercase;font-weight:700;transition:var(--transition-fast);letter-spacing:1px;border-top:1px solid var(--glass-ink-border); }
        .playlist-toggle:hover, .playlist-toggle:focus-visible { background-color:rgba(124,77,255,0.1);color:var(--tertiary-accent);text-shadow:0 0 5px var(--tertiary-accent); }

        .playlist-container { max-height:180px;overflow-y:auto;background:rgba(0,0,0,0.15);border-top:1px solid var(--glass-ink-border); }
        .playlist-container::-webkit-scrollbar { width:8px; } .playlist-container::-webkit-scrollbar-track { background:rgba(0,0,0,0.3);border-radius:4px; } .playlist-container::-webkit-scrollbar-thumb { background-color:var(--tertiary-accent);border-radius:4px;border:2px solid rgba(0,0,0,0.3);transition:background-color var(--transition-fast); } .playlist-container::-webkit-scrollbar-thumb:hover { background-color:var(--primary-accent); }
        .playlist-item { display:grid;grid-template-columns:auto auto 1fr;gap:.8rem;align-items:center;padding:.85rem 1.5rem;cursor:pointer;border-bottom:1px solid rgba(124,77,255,0.1);font-size:.85rem;transition:background-color var(--transition-fast),color var(--transition-fast); }
        .playlist-item:last-child { border-bottom:none; } .playlist-item:hover, .playlist-item:focus-visible { background:rgba(0,255,195,0.1);color:var(--primary-accent); }
        .playlist-item.active { background:linear-gradient(90deg,rgba(0,188,212,0.15),rgba(0,188,212,0.05));border-left:3px solid var(--secondary-accent);padding-left:calc(1.5rem - 3px); }
        .playlist-item span:first-child { color:var(--text-muted);width:2em;text-align:right; } .playlist-item span:last-child { color:var(--text-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
        .playlist-item:hover span:last-child, .playlist-item:focus-visible span:last-child { color:var(--primary-accent); } .playlist-item.active span { color:var(--secondary-accent);font-weight:bold;text-shadow:0 0 5px var(--secondary-accent); }
        .playlist-item-indicator { display:flex;align-items:center;justify-content:center;width:18px;height:18px;opacity:0;transition:opacity var(--transition-main);position:relative; }
        .playlist-item.active .playlist-item-indicator { opacity:1; }
        .wave-bar { width:2.5px;margin:0 .5px;height:100%;background-color:var(--secondary-accent);animation:soundwaveFluid 1.2s ease-in-out infinite alternate;border-radius:1px;box-shadow:0 0 3px var(--secondary-accent); }
        .wave-bar:nth-child(1){animation-delay:-.4s} .wave-bar:nth-child(2){animation-delay:-.2s} .wave-bar:nth-child(3){animation-delay:0s}
        @keyframes soundwaveFluid {0%{transform:scaleY(.15);opacity:.5}50%{opacity:.75}100%{transform:scaleY(.9);opacity:1}}

        @media(max-width:700px){body{padding:.5rem}header{font-size:1.5rem;margin-bottom:1.5rem}.player-container{width:calc(100% - 1rem);max-width:none}.track-info-wrapper{padding:.8rem 1rem;min-height:50px}.track-title{font-size:1rem}.progress-container{margin:.5rem 1rem;height:6px}.controls button{padding:.7rem .4rem;font-size:.8rem}.filter-modulator{padding:.75rem 1rem}.filter-slider-group label{width:60px;font-size:.65rem}.filter-value-display{min-width:35px;font-size:.65rem}.visualizer-controls{grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px;padding:.75rem 1rem}.visualizer-controls button{width:26px;height:26px;font-size:.55rem}.playlist-toggle{padding:.85rem}.playlist-item{padding:.7rem 1rem;gap:.7rem;font-size:.8rem}.playlist-item span:first-child{width:1.8em}.playlist-item-indicator{width:15px;height:15px}.wave-bar{width:2px}}
        @media(max-width:400px){header{font-size:1.2rem;margin-bottom:1rem}.visualizer-canvas-container{height:150px}.filter-type-selector{flex-wrap:wrap;gap:4px}.filter-type-selector button{min-width:35px;padding:.25rem .5rem}.filter-slider-group{flex-direction:column;align-items:stretch;gap:.25rem}.filter-slider-group label{text-align:left;margin-bottom:.1rem}.filter-value-display{text-align:right}.visualizer-controls{gap:4px;padding:.5rem}.visualizer-controls button{width:24px;height:24px;font-size:.5rem}.playlist-item{font-size:.75rem;padding:.6rem .8rem}}
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <header>Neuromantic</header>

    <div class="player-container">

        <div class="visualizer-canvas-container">
            <canvas id="visualizer"></canvas>
        </div>

        <audio id="musicPlayer" crossorigin="anonymous"></audio>
        <div class="track-info-wrapper">
            <div class="track-title" id="trackTitle">-- Cryo-Signal Locked --</div>
            <div class="track-number">
                <span id="currentTrackNum">00</span>/<span id="totalTracks">00</span>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>

        <div class="controls">
            <button id="prevTrack" title="Previous Signal (Left Arrow)">Prev</button>
            <button id="playPause" title="Engage/Disengage (Spacebar)">Engage</button>
            <button id="nextTrack" title="Next Signal (Right Arrow)">Next</button>
        </div>

        <div class="filter-modulator">
            <div class="filter-modulator-header">Signal Path Modulator</div>
            <div class="filter-type-selector">
                <button data-filtertype="off" class="active" aria-pressed="true" title="Bypass Filter">Off</button>
                <button data-filtertype="lowpass" aria-pressed="false" title="Low-Pass Filter">LPF</button>
                <button data-filtertype="highpass" aria-pressed="false" title="High-Pass Filter">HPF</button>
                <button data-filtertype="bandpass" aria-pressed="false" title="Band-Pass Filter">BPF</button>
                <button data-filtertype="notch" aria-pressed="false" title="Notch Filter">Notch</button>
            </div>
            <div class="filter-slider-group">
                <label for="filterFreq">Freq. Tune:</label>
                <input type="range" id="filterFreq" min="0" max="100" value="100" aria-label="Filter Cutoff Frequency">
                <span id="filterFreqValue" class="filter-value-display">20kHz</span>
            </div>
            <div class="filter-slider-group">
                <label for="filterQ">Res. Peak:</label>
                <input type="range" id="filterQ" min="0" max="100" value="10" aria-label="Filter Resonance Q">
                <span id="filterQValue" class="filter-value-display">1.0</span>
            </div>
        </div>

        <div class="visualizer-controls">
            <button id="viz1" class="active">1</button> <button id="viz2">2</button> <button id="viz3">3</button>
            <button id="viz4">4</button> <button id="viz5">5</button> <button id="viz6">6</button>
            <button id="viz7">7</button> <button id="viz8">8</button> <button id="viz9">9</button>
            <button id="viz10">10</button><button id="viz11">11</button><button id="viz12">12</button>
            <button id="viz13">13</button><button id="viz14">14</button><button id="viz15">15</button>
            <button id="viz16">16</button><button id="viz17">17</button><button id="viz18">18</button>
            <button id="viz19">19</button><button id="viz20">20</button>
        </div>

        <button class="playlist-toggle" id="playlistToggle">Cryo-Streams</button>

        <div class="playlist-container" id="playlist" style="display:none;">
        </div>
    </div>

    <script type="module">
        import { initAudioContext, applyFilterSettings } from './js/music/equalizer.js';
        import { tracks, formatTime, loadTrack } from './js/music/features.js';
        import { initWebGLBackground, renderCurrentBackground } from './js/music/translator.js';
        import { createVisualizers, getAverageAmplitude } from './js/music/visualizer.js';

        const $ = id => document.getElementById(id);
        const musicPlayer = $('musicPlayer');
        const playPauseBtn = $('playPause');
        const prevTrackBtn = $('prevTrack');
        const nextTrackBtn = $('nextTrack');
        const visualizerCanvas = $('visualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        const bgCanvas = $('background-canvas');
        const progressBar = $('progressBar');
        const progressContainer = $('progressContainer');
        const trackTitleEl = $('trackTitle');
        const currentTrackNumEl = $('currentTrackNum');
        const totalTracksEl = $('totalTracks');
        const currentTimeEl = $('currentTime');
        const totalTimeEl = $('totalTime');
        const playlistEl = $('playlist');
        const playlistToggleBtn = $('playlistToggle');
        const filterTypeButtons = document.querySelectorAll('.filter-type-selector button');
        const filterFreqSlider = $('filterFreq');
        const filterQSlider = $('filterQ');
        const filterFreqValueDisplay = $('filterFreqValue');
        const filterQValueDisplay = $('filterQValue');

        let audioCtx, analyser, dataArray, bufferLength, filterNode;
        let isAudioContextInitialized = false;
        let currentTrackIndex = 0;
        let currentVisualizer = 1;
        let visualizers = [];
        let visualizerAnimationId = null;
        let bgAnimationId = null;

        function initPlayer() {
            totalTracksEl.textContent = tracks.length.toString().padStart(2, '0');
            createPlaylist();
            loadTrack(0, musicPlayer, trackTitleEl, currentTrackNumEl, updatePlaylistActiveState);
            initWebGLBackground(bgCanvas);
            resizeCanvas();
        }

        function handleInitAudio() {
            if (isAudioContextInitialized) return;
            try {
                const audioInfo = initAudioContext(musicPlayer);
                audioCtx = audioInfo.audioContext;
                analyser = audioInfo.analyser;
                dataArray = audioInfo.dataArray;
                bufferLength = audioInfo.bufferLength;
                filterNode = audioInfo.filterNode;
                isAudioContextInitialized = true;

                visualizers = createVisualizers(visualizerCtx, () => visualizerCanvas.width, () => visualizerCanvas.height, () => visualizerCanvas.width/2, () => visualizerCanvas.height/2, dataArray, bufferLength);
                
                loadFilterSettings();
                startAllAnimations();
            } catch (e) {
                console.error("Initialization failed", e);
            }
        }

        function playTrack() {
            handleInitAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            musicPlayer.play().then(() => {
                playPauseBtn.textContent = 'Disengage';
            }).catch(err => console.error("Play error:", err));
        }

        function pauseTrack() {
            musicPlayer.pause();
            playPauseBtn.textContent = 'Engage';
        }

        function createPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.dataset.index = i;
                item.innerHTML = `<span>${(i+1).toString().padStart(2,'0')}</span><div class="playlist-item-indicator"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><span>${track.title}</span>`;
                item.addEventListener('click', () => {
                    if (currentTrackIndex !== i) {
                        currentTrackIndex = loadTrack(i, musicPlayer, trackTitleEl, currentTrackNumEl, updatePlaylistActiveState);
                        hasSpokenEasterEgg = false;
                        playTrack();
                    } else {
                        musicPlayer.paused ? playTrack() : pauseTrack();
                    }
                });
                playlistEl.appendChild(item);
            });
        }

        function updatePlaylistActiveState(index) {
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.index) === index);
            });
            const active = playlistEl.querySelector('.playlist-item.active');
            if (active && playlistEl.style.display !== 'none') active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        let hasSpokenEasterEgg = false;
        function startAllAnimations() {
            if (!visualizerAnimationId) {
                const loopVis = () => {
                    visualizerAnimationId = requestAnimationFrame(loopVis);
                    if (!isAudioContextInitialized || musicPlayer.paused) return;
                    analyser.getByteFrequencyData(dataArray);
                    visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                    if (visualizers[currentVisualizer - 1]) visualizers[currentVisualizer - 1]();

                    // --- Easter Egg Trigger ---
                    if (currentTrackIndex === 7 && currentVisualizer === 14) {
                        const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
                        const heartSize = 40 + bass * 60;
                        import('./js/music/visualizer.js').then(module => {
                            module.drawHeart(visualizerCtx, visualizerCanvas.width / 2, visualizerCanvas.height / 2, heartSize, 0.8 + bass * 0.2);
                        });

                        if (!hasSpokenEasterEgg) {
                            hasSpokenEasterEgg = true;
                            const utterance = new SpeechSynthesisUtterance("Thank you so much, you're awesome dude");
                            const voices = window.speechSynthesis.getVoices();
                            utterance.voice = voices.find(v => v.name.includes('Aria') || v.name.includes('Female')) || voices[0];
                            utterance.pitch = 1.1; 
                            utterance.rate = 0.95;
                            window.speechSynthesis.speak(utterance);
                        }
                    }
                };
                loopVis();
            }
            if (!bgAnimationId) {
                const loopBg = () => {
                    bgAnimationId = requestAnimationFrame(loopBg);
                    let reactivity = 0, bass = 0;
                    if (isAudioContextInitialized && !musicPlayer.paused) {
                        reactivity = getAverageAmplitude(dataArray, 0, bufferLength);
                        bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
                    }
                    renderCurrentBackground(bgCanvas, reactivity, bass);
                };
                loopBg();
            }
        }

        function loadFilterSettings() {
            const saved = localStorage.getItem('neuromanticFilterSettingsV3');
            if (saved) {
                const settings = JSON.parse(saved);
                filterFreqSlider.value = settings.freqSlider || "100";
                filterQSlider.value = settings.qSlider || "10";
                filterTypeButtons.forEach(btn => {
                    const isActive = btn.dataset.filtertype === settings.type;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive);
                });
            }
            syncFilters();
        }

        function syncFilters() {
            const activeBtn = document.querySelector('.filter-type-selector button.active');
            const type = activeBtn ? activeBtn.dataset.filtertype : 'off';
            applyFilterSettings(type, filterFreqSlider.value, filterQSlider.value);
            
            const freq = Math.exp(Math.log(20) + (Math.log(20000) - Math.log(20)) / 100 * parseFloat(filterFreqSlider.value));
            filterFreqValueDisplay.textContent = freq < 1000 ? `${freq.toFixed(0)}Hz` : `${(freq/1000).toFixed(1)}kHz`;
            const q = Math.exp(Math.log(0.1) + (Math.log(30) - Math.log(0.1)) / 100 * parseFloat(filterQSlider.value));
            filterQValueDisplay.textContent = q.toFixed(1);

            localStorage.setItem('neuromanticFilterSettingsV3', JSON.stringify({
                type, freqSlider: filterFreqSlider.value, qSlider: filterQSlider.value
            }));
        }

        function resizeCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        playPauseBtn.addEventListener('click', () => musicPlayer.paused ? playTrack() : pauseTrack());
        nextTrackBtn.addEventListener('click', () => { currentTrackIndex = loadTrack(currentTrackIndex + 1, musicPlayer, trackTitleEl, currentTrackNumEl, updatePlaylistActiveState); hasSpokenEasterEgg = false; playTrack(); });
        prevTrackBtn.addEventListener('click', () => { currentTrackIndex = loadTrack(currentTrackIndex - 1, musicPlayer, trackTitleEl, currentTrackNumEl, updatePlaylistActiveState); hasSpokenEasterEgg = false; playTrack(); });
        musicPlayer.addEventListener('timeupdate', () => {
            if (!musicPlayer.duration) return;
            progressBar.style.width = `${(musicPlayer.currentTime / musicPlayer.duration) * 100}%`;
            currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
            totalTimeEl.textContent = formatTime(musicPlayer.duration);
        });
        musicPlayer.addEventListener('ended', () => nextTrackBtn.click());
        progressContainer.addEventListener('click', e => {
            if (!musicPlayer.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            musicPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * musicPlayer.duration;
        });
        playlistToggleBtn.addEventListener('click', () => {
            const show = playlistEl.style.display === 'none';
            playlistEl.style.display = show ? 'block' : 'none';
            playlistToggleBtn.textContent = show ? 'Hide Streams' : 'Cryo-Streams';
            if (show) updatePlaylistActiveState(currentTrackIndex);
        });
        filterFreqSlider.addEventListener('input', syncFilters);
        filterQSlider.addEventListener('input', syncFilters);
        filterTypeButtons.forEach(btn => btn.addEventListener('click', () => {
            filterTypeButtons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
            btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
            syncFilters();
        }));
        [...Array(20)].forEach((_, i) => {
            const btn = $(`viz${i+1}`);
            if (btn) btn.addEventListener('click', () => {
                document.querySelectorAll('.visualizer-controls button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentVisualizer = i + 1;
            });
        });

        initPlayer();
    </script>
</body>
</html>
