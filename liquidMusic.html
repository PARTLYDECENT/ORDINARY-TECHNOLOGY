<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuromantic Player (30 Visualizers)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    /* CSS Variables for Theming */
    :root {
      --primary: #ff4b00;    /* Bright Orange */
      --secondary: #00ffd0; /* Bright Cyan */
      --bg-dark: #0a0b0c;    /* Very Dark Blue/Black (RGB: 10, 11, 12) */
      --bg-light: #121416;   /* Slightly Lighter Dark */
      --text: #e0e0e0;      /* Light Gray Text */
      --glass-bg: rgba(18, 20, 22, 0.65); /* Slightly less transparent glass */
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    /* Global Reset and Box Sizing */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body Styling */
    body {
      background-color: var(--bg-dark); color: var(--text); font-family: 'Space Mono', monospace;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 1rem; overflow: hidden;
    }

    /* Background Canvas Styling */
    #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

    /* Header Styling */
    header { font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; position: relative; text-transform: uppercase; color: var(--primary); z-index: 1; }
    header::after { content: 'PLAYER'; position: absolute; left: 0; top: 0; color: var(--secondary); clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }

    /* Player Container Styling */
    .player-container {
      width: 90%; max-width: 800px; border-radius: 4px; position: relative; z-index: 1;
      overflow: hidden; background: var(--glass-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-areas:
        "visualizer visualizer"
        "info info"
        "progress progress"
        "time time"
        "controls controls"
        "viz-controls viz-controls"
        "playlist-toggle playlist-toggle"
        "playlist playlist";
      grid-template-columns: 1fr; grid-template-rows: auto;
    }

    /* Top Border Gradient - Animated */
    .player-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary)); background-size: 200% 100%; animation: borderFlow 4s linear infinite; }
    @keyframes borderFlow { 0% { background-position: 200% 50%; } 100% { background-position: 0% 50%; } }

     /* Grid Area Assignments */
    .visualizer-canvas-container { grid-area: visualizer; }
    .track-info-wrapper { grid-area: info; }
    .progress-container { grid-area: progress; }
    .time-display { grid-area: time; }
    .controls { grid-area: controls; }
    .visualizer-controls { grid-area: viz-controls; }
    .playlist-toggle { grid-area: playlist-toggle; }
    .playlist-container { grid-area: playlist; }

     /* Visualizer Canvas Container */
     .visualizer-canvas-container { height: 150px; position: relative; overflow: hidden; }
    #visualizer { width: 100%; height: 100%; display: block; }

    /* Track Info Wrapper */
    .track-info-wrapper { padding: 1rem; border-bottom: 1px solid var(--glass-border); display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; }
    .track-title { font-weight: bold; color: var(--primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-number { color: var(--secondary); }

    /* Progress Bar Area */
    .progress-container { height: 5px; background: rgba(255, 255, 255, 0.1); cursor: pointer; overflow: hidden; margin: 0 1rem; border-radius: 3px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.1s linear; border-radius: 3px; }

    /* Time Display Area */
    .time-display { display: flex; justify-content: space-between; padding: 0.5rem 1rem; font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); }

    /* Controls Area (Prev/Play/Next) */
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0.5rem 1rem; border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }
    .controls button { background: none; border: none; color: var(--text); font-family: inherit; padding: 0.75rem 0.5rem; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .controls button:hover { color: var(--primary); transform: translateY(-2px) scale(1.05); text-shadow: 0 0 8px var(--primary); }
    .controls button:active { transform: translateY(0px) scale(1.0); }

    /* Visualizer Controls Area - Updated for 30 buttons */
    .visualizer-controls {
      display: grid;
      grid-template-columns: repeat(10, 1fr); /* 10 columns */
      grid-template-rows: auto auto auto; /* 3 rows */
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--glass-border);
    }
    .visualizer-controls button {
      background: none; border: none; color: rgba(255, 255, 255, 0.5); font-family: inherit;
      font-size: 0.55rem; padding: 0.4rem 0.1rem; cursor: pointer; text-transform: uppercase;
      transition: color 0.2s ease, background-color 0.2s ease; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .visualizer-controls button.active { color: var(--secondary); font-weight: bold; background-color: rgba(0, 255, 208, 0.1); }
    .visualizer-controls button:hover:not(.active) { color: var(--primary); background-color: rgba(255, 75, 0, 0.1); }

    /* Playlist Toggle Button */
    .playlist-toggle { width: 100%; background: none; border: none; padding: 0.85rem; color: var(--text); font-family: inherit; cursor: pointer; text-transform: uppercase; transition: background-color 0.2s ease, color 0.2s ease; }
    .playlist-toggle:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--secondary); }

    /* Playlist Container */
    .playlist-container { max-height: 200px; overflow-y: auto; background: rgba(0, 0, 0, 0.1); }
    .playlist-container::-webkit-scrollbar { width: 6px; }
    .playlist-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    .playlist-container::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }
    .playlist-container::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* Individual Playlist Item */
    .playlist-item { display: grid; grid-template-columns: auto auto 1fr; gap: 0.8rem; align-items: center; padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid var(--glass-border); font-size: 0.8rem; transition: background-color 0.2s ease; }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: rgba(255, 255, 255, 0.05); }
    .playlist-item.active { background: rgba(0, 255, 208, 0.1); }
    .playlist-item span:first-child { color: rgba(255, 255, 255, 0.5); width: 2em; text-align: right;}
    .playlist-item span:last-child { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-item.active span { color: var(--secondary); font-weight: bold; }
    .playlist-item-indicator { display: flex; align-items: flex-end; justify-content: center; gap: 1px; width: 15px; height: 15px; opacity: 0; transition: opacity 0.3s ease; }
    .playlist-item.active .playlist-item-indicator { opacity: 1; }
    .wave-bar { width: 2px; height: 100%; background-color: var(--secondary); animation: soundwave 0.8s ease-in-out infinite alternate; }
    .wave-bar:nth-child(1) { animation-delay: 0s; } .wave-bar:nth-child(2) { animation-delay: 0.2s; } .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes soundwave { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1.0); } }

    /* Responsive Adjustments */
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      header { font-size: 1.2rem; margin-bottom: 1rem; }
      .player-container { width: 100%; }
      .track-info-wrapper { padding: 0.75rem; }
      .progress-container { margin: 0 0.75rem; }
      .controls button { padding: 0.6rem 0.4rem; }
      /* Adjust viz controls grid for mobile */
      .visualizer-controls { grid-template-columns: repeat(5, 1fr); grid-template-rows: auto; } /* Let them wrap over more rows if needed */
      .visualizer-controls button { font-size: 0.5rem; padding: 0.3rem 0.1rem; }
      .playlist-toggle { padding: 0.75rem; }
      .playlist-item { padding: 0.6rem 0.75rem; gap: 0.6rem; font-size: 0.75rem;}
      .playlist-item span:first-child { width: 1.8em; }
      .playlist-item-indicator { width: 12px; height: 12px;}
      .wave-bar { width: 1.5px; }
    }

  </style>
</head>

    const formatTime = s => { if (isNaN(s) || !isFinite(s)) return '0:00'; const m = Math.floor(s / 60); const sec = Math.floor(s % 60).toString().padStart(2, '0'); return `${m}:${sec}`; }

    function initNeuralNetwork() { if (!neuralNetwork) { neuralNetwork = new NeuralNetwork(layerCount, bgCanvas); } else { neuralNetwork.canvas=bgCanvas; neuralNetwork.initNeurons(); neuralNetwork.initConnections(); } console.log(`NN Init/Reinit: ${neuralNetwork?.neurons?.length} neurons, ${neuralNetwork?.connections?.length} connections.`); }
    function renderNeuralBackground() { if (!isAudioInitialized || !neuralNetwork || !analyser) { bgAnimationId = requestAnimationFrame(renderNeuralBackground); return; } analyser.getByteFrequencyData(dataArray); let sum=0; const relBufLen=Math.floor(bufferLength*0.7); for(let i=0;i<relBufLen;i++){ sum+=dataArray[i]; } const avg=sum/relBufLen||0; const reactivity=Math.min(1,Math.pow(avg/128,1.5)); const trailAlpha=0.08+reactivity*0.07; bgCtx.fillStyle=`rgba(10,11,12,${trailAlpha})`; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height); const colors=colorSchemes[currentColorScheme]; neuralNetwork.update(dataArray,bufferLength,reactivity); neuralNetwork.render(bgCtx,colors,reactivity); if(Math.random()<0.0005+reactivity*0.005){ currentColorScheme=(currentColorScheme+1)%colorSchemes.length; } bgAnimationId = requestAnimationFrame(renderNeuralBackground); }

    function getAverageAmplitude(arr, start, end) { let sum=0; start=Math.max(0,Math.floor(start)); end=Math.min(arr.length,Math.ceil(end)); if(start>=end)return 0; for(let i=start;i<end;i++){ sum+=arr[i]; } return sum/(end-start)/255; }

        analyser.getByteFrequencyData(dataArray);
        visualizerCtx.clearRect(0, 0, W(), H());

        // Array mapping index to function - NOW WITH 30 VISUALIZERS!
        const visualizers = [
            drawViz1, drawViz2, drawViz3, drawViz4, drawViz5, drawViz6, drawViz7, drawViz8, drawViz9, drawViz10,
            drawViz11, drawViz12, drawViz13, drawViz14, drawViz15, drawViz16, drawViz17, drawViz18, drawViz19, drawViz20,
            drawViz21, drawViz22, drawViz23, drawViz24, drawViz25, drawViz26, drawViz27, drawViz28, drawViz29, drawViz30 // Added Viz 21-30
        ];

        const index = currentVisualizer - 1;
        if (index >= 0 && index < visualizers.length) {
            visualizers[index]();
        } else {
            drawViz1(); // Default fallback
        }
    }
    function startVisualizer() { if (!visualizerAnimationId && isAudioInitialized) { console.log("Starting visualizer animation."); renderVisualizer(); } }
    function stopVisualizer() { if (visualizerAnimationId) { cancelAnimationFrame(visualizerAnimationId); visualizerAnimationId=null; console.log("Stopping visualizer animation."); visualizerCtx.clearRect(0,0,W(),H()); } }

    // ===============================================================
    // ======= EVENT LISTENERS & INITIALIZATION =======
    // ===============================================================
    function updateVisualizerButtons() { document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => { btn.classList.toggle('active', i + 1 === currentVisualizer); }); }
    playPauseBtn.addEventListener('click', () => { if (musicPlayer.paused) playTrack(); else pauseTrack(); });
    $('prevTrack').addEventListener('click', () => { loadTrack(currentTrackIndex - 1); playTrack(); });
    $('nextTrack').addEventListener('click', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('ended', () => { console.log("Track ended, loading next."); loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('timeupdate', updateProgress);
    musicPlayer.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(musicPlayer.duration); console.log("Metadata loaded, duration:", formatTime(musicPlayer.duration)); });
    progressContainer.addEventListener('click', e => { if (!musicPlayer.duration || !isFinite(musicPlayer.duration)) return; const pos = e.offsetX / progressContainer.offsetWidth; musicPlayer.currentTime = pos * musicPlayer.duration; updateProgress(); });
    playlistToggleBtn.addEventListener('click', () => { const isHidden = playlistEl.style.display === 'none'; playlistEl.style.display = isHidden ? 'block' : 'none'; playlistToggleBtn.textContent = isHidden ? 'Hide Playlist' : 'Playlist'; if (isHidden) updatePlaylistActiveState(); });

    // Update listener for 30 buttons
    document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => { btn.addEventListener('click', () => { const vizIdx = i + 1; if (currentVisualizer !== vizIdx) { currentVisualizer = vizIdx; updateVisualizerButtons(); console.log("Switched to visualizer:", currentVisualizer); } }); });

    let resizeTimeout; window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { console.log("Window resized."); resizeCanvases(); }, 250); });
    musicPlayer.addEventListener('error', (e) => { console.error('Audio Player Error:', musicPlayer.error); trackTitleEl.textContent = 'Error loading track'; if (!musicPlayer.error) return; switch (musicPlayer.error.code) { case MediaError.MEDIA_ERR_ABORTED: console.error('Load aborted.'); break; case MediaError.MEDIA_ERR_NETWORK: console.error('Network error.'); break; case MediaError.MEDIA_ERR_DECODE: console.error('Decoding error.'); break; case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: console.error('Source not supported / File not found (404?).'); break; default: console.error('Unknown audio error.'); break; } });

    function initializePlayer() { console.log("Initializing player..."); resizeCanvases(); createPlaylist(); loadTrack(currentTrackIndex); updateVisualizerButtons(); initNeuralNetwork(); startBackgroundAnimation(); console.log("Player initialization complete."); }
    document.addEventListener('DOMContentLoaded', initializePlayer);
  </script>
</body>
