<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuromantic Player (Guide Enhanced)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    /* CSS Variables for Theming */
    :root {
      --primary: #ff4b00;    /* Bright Orange */
      --secondary: #00ffd0; /* Bright Cyan */
      --bg-dark: #0a0b0c;    /* Very Dark Blue/Black (RGB: 10, 11, 12) */
      --bg-light: #121416;   /* Slightly Lighter Dark */
      --text: #e0e0e0;      /* Light Gray Text */
      --glass-bg: rgba(18, 20, 22, 0.65); /* Slightly less transparent glass */
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    /* Global Reset and Box Sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body Styling */
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem; /* Add padding for smaller screens */
      overflow: hidden; /* Prevent scrollbars from background canvas */
    }

    /* Background Canvas Styling */
    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Behind all other content */
    }

    /* Header Styling */
    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      position: relative; /* For pseudo-element positioning */
      text-transform: uppercase;
      color: var(--primary);
      z-index: 1; /* Above background */
    }

    /* Header Glitch Effect */
    header::after {
      content: 'PLAYER';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--secondary);
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); /* Clips the 'PLAYER' text */
    }

    /* Player Container Styling */
    .player-container {
      width: 90%;
      max-width: 800px;
      border-radius: 4px; /* Slightly more rounded */
      position: relative;
      z-index: 1; /* Above background */
      overflow: hidden; /* Keep inner elements contained */

      /* --- Guide Enhancements --- */
      /* Glassmorphism */
      background: var(--glass-bg);
      backdrop-filter: blur(12px); /* [cite: 6] */
      border: 1px solid var(--glass-border); /* [cite: 6] */
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4); /* Enhanced shadow */

      /* CSS Grid Layout */
      display: grid;
      /* Define grid areas [cite: 11, 12] */
      grid-template-areas:
        "visualizer visualizer"
        "info info"
        "progress progress"
        "time time"
        "controls controls"
        "viz-controls viz-controls"
        "playlist-toggle playlist-toggle"
        "playlist playlist";
      grid-template-columns: 1fr; /* Single column by default */
      grid-template-rows: auto; /* Rows adjust to content */
    }

    /* Top Border Gradient - Animated */
    .player-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary)); /* Ensure gradient repeats for flow */
      background-size: 200% 100%; /* Needs size > 100% for animation [cite: 10] */
      animation: borderFlow 4s linear infinite; /* [cite: 9] */
    }

    /* Border Flow Animation [cite: 10] */
    @keyframes borderFlow {
      0% { background-position: 200% 50%; }
      100% { background-position: 0% 50%; }
    }


     /* --- Grid Area Assignments --- */
    .visualizer-canvas-container { grid-area: visualizer; }
    .track-info-wrapper { grid-area: info; } /* Wrapper for track info */
    .progress-container { grid-area: progress; }
    .time-display { grid-area: time; }
    .controls { grid-area: controls; }
    .visualizer-controls { grid-area: viz-controls; }
    .playlist-toggle { grid-area: playlist-toggle; }
    .playlist-container { grid-area: playlist; }
    /* --- End Grid Area Assignments --- */


     /* Container for the visualizer canvas */
     .visualizer-canvas-container {
       height: 150px;
       position: relative;
       overflow: hidden;
       /* Remove background, let glassmorphism show */
    }

     /* Visualizer Canvas Styling */
    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Wrapper for Track Info */
    .track-info-wrapper {
        padding: 1rem;
        border-bottom: 1px solid var(--glass-border);
        display: grid; /* Use grid within the wrapper too */
        grid-template-columns: 1fr auto;
        gap: 1rem;
        align-items: center;
    }

    .track-title {
      font-weight: bold;
      color: var(--primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-number { color: var(--secondary); }

    /* Progress Bar Area */
    .progress-container {
      height: 5px; /* Slightly thicker */
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      overflow: hidden;
      margin: 0 1rem; /* Add horizontal margin */
      border-radius: 3px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 3px;
    }

    /* Time Display Area */
    .time-display {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.6); /* Slightly brighter */
    }

    /* Controls Area (Prev/Play/Next) */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
    }

    /* Control Button Styling & Micro-interaction */
    .controls button {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      padding: 0.75rem 0.5rem; /* More padding */
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* [cite: 7] */
    }

    .controls button:hover {
      color: var(--primary);
      transform: translateY(-2px) scale(1.05); /* [cite: 8] */
      text-shadow: 0 0 8px var(--primary); /* [cite: 8] */
    }
     .controls button:active {
        transform: translateY(0px) scale(1.0); /* Press down effect */
     }


    /* Visualizer Controls Area */
    .visualizer-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(0, 0, 0, 0.2); /* Keep slight bg */
      border-bottom: 1px solid var(--glass-border);
    }

    .visualizer-controls button {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 0.6rem;
      padding: 0.5rem 0.25rem; /* More padding */
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .visualizer-controls button.active {
        color: var(--secondary);
        font-weight: bold;
        background-color: rgba(0, 255, 208, 0.1); /* Highlight active */
    }
    .visualizer-controls button:hover:not(.active) {
        color: var(--primary);
        background-color: rgba(255, 75, 0, 0.1);
     }

    /* Playlist Toggle Button */
    .playlist-toggle {
      width: 100%;
      background: none;
      border: none; /* Remove toggle border, rely on container grid */
      padding: 0.85rem; /* More padding */
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .playlist-toggle:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--secondary);
    }

    /* Playlist Container */
    .playlist-container {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.1); /* Slightly less contrast */
      /* border-top: 1px solid var(--glass-border); Already separated by grid */
    }
     /* Custom Scrollbar for Playlist (Webkit browsers) */
    .playlist-container::-webkit-scrollbar { width: 6px; }
    .playlist-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    .playlist-container::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }
    .playlist-container::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* Individual Playlist Item */
    .playlist-item {
      display: grid;
      /* Add area for indicator */
      grid-template-columns: auto auto 1fr; /* Number, Indicator, Title */
      gap: 0.8rem; /* Adjust gap */
      align-items: center; /* Vertically align items */
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.8rem;
      transition: background-color 0.2s ease;
    }
    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: rgba(255, 255, 255, 0.05); }
    .playlist-item.active { background: rgba(0, 255, 208, 0.1); }
    .playlist-item span:first-child { color: rgba(255, 255, 255, 0.5); width: 2em; text-align: right;} /* Track number */
    .playlist-item span:last-child { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* Track title */
    .playlist-item.active span { color: var(--secondary); font-weight: bold; }

    /* Now Playing Indicator Styling [cite: 17] */
    .playlist-item-indicator {
      display: flex;
      align-items: flex-end; /* Align bars to bottom */
      justify-content: center;
      gap: 1px; /* Tighter gap */
      width: 15px; /* Fixed width for the indicator area */
      height: 15px;
      opacity: 0; /* Hidden by default */
      transition: opacity 0.3s ease;
    }
    .playlist-item.active .playlist-item-indicator {
        opacity: 1; /* Visible when active */
    }
    .wave-bar {
      width: 2px;
      height: 100%; /* Start at full height */
      background-color: var(--secondary);
      animation: soundwave 0.8s ease-in-out infinite alternate; /* [cite: 18] */
    }
    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; } /* [cite: 18] */
    .wave-bar:nth-child(3) { animation-delay: 0.4s; } /* [cite: 18] */

    /* Soundwave Animation [cite: 19] */
    @keyframes soundwave {
      0% { transform: scaleY(0.2); } /* Start short */
      100% { transform: scaleY(1.0); } /* Grow tall */
    }

    /* --- Responsive Adjustments --- */
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      header { font-size: 1.2rem; margin-bottom: 1rem; }
      .player-container { width: 100%; }
      .track-info-wrapper { padding: 0.75rem; }
      .progress-container { margin: 0 0.75rem; }
      .controls button { padding: 0.6rem 0.4rem; }
      .visualizer-controls button { padding: 0.4rem 0.2rem; font-size: 0.55rem; }
      .playlist-toggle { padding: 0.75rem; }
      .playlist-item { padding: 0.6rem 0.75rem; gap: 0.6rem; font-size: 0.75rem;}
      .playlist-item span:first-child { width: 1.8em; }
      .playlist-item-indicator { width: 12px; height: 12px;}
      .wave-bar { width: 1.5px; }

       /* Adjust Grid for mobile [cite: 13] */
       /* Already single column by default, no change needed unless specific overrides */
    }

  </style>
</head>
<body>
  <canvas id="background-canvas"></canvas>

  <header>Neuromantic</header>

  <div class="player-container">

     <div class="visualizer-canvas-container">
      <canvas id="visualizer"></canvas>
    </div>

    <audio id="musicPlayer"></audio>

     <div class="track-info-wrapper">
        <div class="track-title" id="trackTitle">--</div>
        <div class="track-number">
            <span id="currentTrackNum">--</span>/<span id="totalTracks">--</span>
        </div>
     </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button id="prevTrack" title="Previous Track (Left Arrow)">Prev</button>
      <button id="playPause" title="Play/Pause (Spacebar)">Play</button>
      <button id="nextTrack" title="Next Track (Right Arrow)">Next</button>
    </div>

    <div class="visualizer-controls">
      <button id="viz1" class="active" title="Visualizer 1: Bars">Bars</button>
      <button id="viz2" title="Visualizer 2: Circles">Circles</button>
      <button id="viz3" title="Visualizer 3: Wave">Wave</button>
      <button id="viz4" title="Visualizer 4: Nebula">Nebula</button>
      <button id="viz5" title="Visualizer 5: Spectrum">Spectrum</button>
    </div>

    <button class="playlist-toggle" id="playlistToggle">Playlist</button>

    <div class="playlist-container" id="playlist" style="display:none;">
        </div>

  </div> <script>
    // --- DOM Element Selection Helper ---
    const $ = id => document.getElementById(id);

    // --- Get DOM Elements ---
    const musicPlayer = $('musicPlayer');
    const playPauseBtn = $('playPause');
    const visualizerCanvas = $('visualizer');
    const visualizerCtx = visualizerCanvas.getContext('2d');
    const progressBar = $('progressBar');
    const progressContainer = $('progressContainer');
    const bgCanvas = $('background-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const trackTitleEl = $('trackTitle');
    const currentTrackNumEl = $('currentTrackNum');
    const totalTracksEl = $('totalTracks');
    const currentTimeEl = $('currentTime');
    const totalTimeEl = $('totalTime');
    const playlistEl = $('playlist');
    const playlistToggleBtn = $('playlistToggle');


    // --- State variables ---
    let currentTrackIndex = 0;
    let currentVisualizer = 1; // 1-based index for visualizers
    let visualizerAnimationId = null;
    let bgAnimationId = null;
    let audioContext, analyser, source, dataArray, bufferLength;
    let isAudioInitialized = false; // Flag to track audio context setup
    let neuralNetwork = null; // Holds the NeuralNetwork instance (declared early!)


    // --- Background Neural Network Configuration ---
    const layerCount = 5; // Number of layers in the network
    const colorSchemes = [
         { neuron: '#ff4b00', connection: '#00ffd0' }, // Original Primary/Secondary
         { neuron: '#00ffd0', connection: '#ff4b00' }, // Swapped
         { neuron: '#ff00ff', connection: '#00ffff' }, // Magenta/Cyan
         { neuron: '#ffff00', connection: '#0088ff' }, // Yellow/Blue
         { neuron: '#ffffff', connection: '#cccccc' }  // White/Gray
     ];
    let currentColorScheme = 0;


    // --- Track List ---
    // IMPORTANT: Ensure these file paths are correct relative to your HTML file's location
    //            on your server (e.g., GitHub Pages). Check filenames and extensions (.mp3 vs .wav)!
    const tracks = [
         { src: 'track1.wav', title: 'Liquid Dreams' },
         { src: 'track2.wav', title: 'Neon Flow' },
         { src: 'track3.wav', title: 'Cosmic Wave' },
         { src: 'track4.wav', title: 'Digital Sunrise' },
         { src: 'track5.wav', title: 'Quantum Beat' },
         { src: 'track6.wav', title: 'Cyberspace Odyssey' },
         { src: 'track7.wav', title: 'Neural Network' },
         { src: 'track8.wav', title: 'Binary Echoes' },
         { src: 'track9.wav', title: 'Virtual Reality' },
         { src: 'track10.wav', title: 'Holographic Memory' },
         { src: 'track11.wav', title: 'Singularity' },
         { src: 'track12.wav', title: 'Electric Dreams' },
         { src: 'track13.wav', title: 'Synthwave Journey' },
         { src: 'track14.wav', title: 'Galactic Pulse' },
         { src: 'track15.wav', title: 'Cyber Dawn' },
         { src: 'track16.wav', title: 'Ethereal Code' },
         { src: 'track17.mp3', title: 'Alternatives' }, // Example MP3
         { src: 'track18.wav', title: 'Astral Projection' },
         { src: 'track19.wav', title: 'Plasma Field' },
         { src: 'track20.wav', title: 'Quantum Resonance' }
     ];
     totalTracksEl.textContent = tracks.length; // Update total tracks display


    // --- Canvas Resizing Function ---
    function resizeCanvases() {
        // Background Canvas fills window
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;

        // Visualizer Canvas fills its container
        visualizerCanvas.width = visualizerCanvas.offsetWidth;
        visualizerCanvas.height = visualizerCanvas.offsetHeight;

        // Reinitialize background network layout if dimensions change
        if (neuralNetwork) {
             neuralNetwork.canvas = bgCanvas; // Update canvas ref
             neuralNetwork.initNeurons();    // Recalculate neuron positions
             neuralNetwork.initConnections(); // Reconnect based on new positions
        }
    }


    // --- Helper Function: Format Time (Seconds to M:SS) ---
    const formatTime = s => {
        if (isNaN(s) || !isFinite(s)) return '0:00'; // Handle invalid input
        const minutes = Math.floor(s / 60);
        const seconds = Math.floor(s % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
    }


    // --- Audio Context Initialization ---
    function initAudio() {
      if (!isAudioInitialized && !audioContext) {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            source = audioContext.createMediaElementSource(musicPlayer);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            isAudioInitialized = true;
            console.log("AudioContext Initialized, state:", audioContext.state);
            startVisualizer();
            startBackgroundAnimation();
        } catch (e) {
            console.error("Error initializing AudioContext:", e);
            alert("Could not initialize audio playback. Your browser might not support the Web Audio API or have restrictions.");
        }
      } else if (isAudioInitialized) {
          console.log("initAudio called but already initialized. Context state:", audioContext.state);
      }
    }


    // ===============================================================
    // ======= NEURAL NETWORK BACKGROUND ANIMATION CLASSES & LOGIC =======
    // ===============================================================
    // (Using the minified versions for brevity)
    class Neuron { constructor(x, y, layer, size, speed) { this.x=x; this.y=y; this.layer=layer; this.baseSize=size; this.speed=speed; this.pulse=0; this.oscillation=Math.random()*Math.PI*2; } update(audioValue, reactivity) { this.pulse=(audioValue/255)*4*reactivity; this.oscillation+=this.speed; } render(ctx, color) { const osc=Math.sin(this.oscillation)*0.5; const size=this.baseSize+this.pulse+osc; ctx.shadowColor=color; ctx.shadowBlur=5+this.pulse*5; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(this.x,this.y,Math.max(1,size),0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; } }
    class Connection { constructor(from, to, weight) { this.from=from; this.to=to; this.weight=weight; this.signal=Math.random(); } update(reactivity) { const speed=0.005+reactivity*0.05; this.signal=(this.signal+speed)%1; } render(ctx, color, reactivity) { const dx=this.to.x-this.from.x; const dy=this.to.y-this.from.y; ctx.strokeStyle=`rgba(255,255,255,${0.02+this.weight*0.05})`; ctx.lineWidth=0.5; ctx.beginPath(); ctx.moveTo(this.from.x,this.from.y); ctx.lineTo(this.to.x,this.to.y); ctx.stroke(); const sigX=this.from.x+dx*this.signal; const sigY=this.from.y+dy*this.signal; const size=1+reactivity*2.5; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(sigX,sigY,size,0,Math.PI*2); ctx.fill(); } }
    class NeuralNetwork { constructor(layers, canvas) { this.lCount=layers; this.canvas=canvas; this.neurons=[]; this.connections=[]; this.initNeurons(); this.initConnections(); } initNeurons() { this.neurons=[]; const ratios=[0.6,0.8,1,0.8,0.6]; for(let l=0;l<this.lCount;l++){ const ratio=ratios[l]||1; const baseCount=Math.floor(20*(this.canvas.width/1200)); const num=Math.max(5,Math.floor(baseCount*ratio)); const padX=this.canvas.width*0.1; const availW=this.canvas.width-2*padX; const lx=padX+(this.lCount>1?availW/(this.lCount-1)*l:availW/2); for(let i=0;i<num;i++){ const padY=this.canvas.height*0.15; const availH=this.canvas.height-2*padY; const randY=(Math.random()-0.5)*availH*0.1; const y=padY+(num>1?availH*i/(num-1):availH/2)+randY; const size=Math.random()*1.5+1; const speed=(Math.random()*0.01+0.005)*(0.5+Math.random()); this.neurons.push(new Neuron(lx,y,l,size,speed)); } } } initConnections() { this.connections=[]; this.neurons.forEach(fromN=>{ if(fromN.layer<this.lCount-1){ const nextLayerNs=this.neurons.filter(n=>n.layer===fromN.layer+1); const count=Math.max(1,Math.floor(nextLayerNs.length*(0.3+Math.random()*0.3))); const targets=nextLayerNs.sort(()=>0.5-Math.random()); for(let i=0;i<count&&i<targets.length;i++){ this.connections.push(new Connection(fromN,targets[i],Math.random())); } } }); } update(audioData, bufLen, reactivity) { this.neurons.forEach((neuron,idx)=>{ const freqIdx=Math.floor(Math.pow(idx/this.neurons.length,1.5)*(bufLen*0.8)); neuron.update(audioData[freqIdx]||0,reactivity); }); this.connections.forEach(conn=>conn.update(reactivity)); } render(ctx, colors, reactivity) { this.connections.forEach(conn=>conn.render(ctx,colors.connection,reactivity)); this.neurons.forEach(neuron=>neuron.render(ctx,colors.neuron)); } }

    function initNeuralNetwork() { if (!neuralNetwork) { neuralNetwork = new NeuralNetwork(layerCount, bgCanvas); } else { neuralNetwork.canvas=bgCanvas; neuralNetwork.initNeurons(); neuralNetwork.initConnections(); } console.log(`Neural Network Initialized/Reinitialized with ${neuralNetwork?.neurons?.length} neurons and ${neuralNetwork?.connections?.length} connections.`); }
    function renderNeuralBackground() { if (!isAudioInitialized || !neuralNetwork || !analyser) { bgAnimationId = requestAnimationFrame(renderNeuralBackground); return; } analyser.getByteFrequencyData(dataArray); let sum=0; const relBufLen=Math.floor(bufferLength*0.7); for(let i=0;i<relBufLen;i++){ sum+=dataArray[i]; } const avg=sum/relBufLen||0; const reactivity=Math.min(1,Math.pow(avg/128,1.5)); const trailAlpha=0.08+reactivity*0.07; bgCtx.fillStyle=`rgba(10,11,12,${trailAlpha})`; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height); const colors=colorSchemes[currentColorScheme]; neuralNetwork.update(dataArray,bufferLength,reactivity); neuralNetwork.render(bgCtx,colors,reactivity); if(Math.random()<0.0005+reactivity*0.005){ currentColorScheme=(currentColorScheme+1)%colorSchemes.length; } bgAnimationId = requestAnimationFrame(renderNeuralBackground); }
    function startBackgroundAnimation() { if (!bgAnimationId) { console.log("Starting background animation."); renderNeuralBackground(); } }
    function stopBackgroundAnimation() { if (bgAnimationId) { cancelAnimationFrame(bgAnimationId); bgAnimationId=null; console.log("Stopping background animation."); } }


    // ===============================================================
    // ======= MUSIC PLAYER CORE FUNCTIONS =======
    // ===============================================================

    function loadTrack(index) {
      index = (index + tracks.length) % tracks.length;
      currentTrackIndex = index;
      const track = tracks[index];
      musicPlayer.src = track.src;
      trackTitleEl.textContent = track.title;
      currentTrackNumEl.textContent = index + 1;
      updatePlaylistActiveState(); // Update indicator visibility
      progressBar.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      totalTimeEl.textContent = '0:00';
      musicPlayer.load();
      console.log("Loading track:", track.title, "| Source:", musicPlayer.src);
    }

    function createPlaylist() {
      playlistEl.innerHTML = '';
      tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.dataset.index = i;
        // Add structure for indicator
        item.innerHTML = `
            <span>${(i + 1).toString().padStart(2, '0')}</span>
            <div class="playlist-item-indicator">
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
            </div>
            <span>${track.title}</span>`;
        item.addEventListener('click', () => {
          if (currentTrackIndex !== i) loadTrack(i);
          playTrack();
        });
        playlistEl.appendChild(item);
      });
      updatePlaylistActiveState(); // Mark initial track
    }

    function updatePlaylistActiveState() {
         document.querySelectorAll('.playlist-item').forEach(item => {
             const isActive = parseInt(item.dataset.index) === currentTrackIndex;
             item.classList.toggle('active', isActive);
         });
         // Scroll active item into view if playlist is visible
         const activeItem = playlistEl.querySelector('.playlist-item.active');
          if (activeItem && playlistEl.style.display !== 'none') {
               activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
    }

    // --- REVISED playTrack Function (from previous step) ---
    function playTrack() {
        if (!isAudioInitialized) { console.log("Audio not initialized. Initializing..."); initAudio(); return; }
        if (audioContext) { console.log(`Attempting play. Context: ${audioContext.state}`); audioContext.resume().then(() => { console.log("Context resumed/running. Trying .play()"); if (musicPlayer.paused) { const playP = musicPlayer.play(); if (playP !== undefined) { playP.then(_ => { playPauseBtn.textContent = 'Pause'; startVisualizer(); startBackgroundAnimation(); console.log("Playback started (promise)."); }).catch(e => { console.error(`Play error: ${e.name} - ${e.message}`); playPauseBtn.textContent = 'Play'; }); } else { console.warn(".play() no promise. Assume started."); playPauseBtn.textContent = 'Pause'; startVisualizer(); startBackgroundAnimation(); } } else { console.log("Already playing."); playPauseBtn.textContent = 'Pause'; } }).catch(e => { console.error("Resume error:", e); playPauseBtn.textContent = 'Play'; }); } else { console.error("Cannot play: No AudioContext."); playPauseBtn.textContent = 'Play'; }
    }

    function pauseTrack() {
      musicPlayer.pause();
      playPauseBtn.textContent = 'Play';
      console.log("Playback paused.");
    }

    function updateProgress() {
       if (!musicPlayer.duration || !isFinite(musicPlayer.duration)) return;
       const progressPercent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
       progressBar.style.width = `${progressPercent}%`;
       currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
    }


    // ===============================================================
    // ======= VISUALIZER DRAWING FUNCTIONS =======
    // ===============================================================
    // (Using minified versions)
    function getAverageAmplitude(arr, start, end) { let sum=0; start=Math.max(0,Math.floor(start)); end=Math.min(arr.length,Math.ceil(end)); if(start>=end)return 0; for(let i=start;i<end;i++){ sum+=arr[i]; } return sum/(end-start)/255; }
    function renderVisualizer() { if (!isAudioInitialized || !analyser) return; visualizerAnimationId = requestAnimationFrame(renderVisualizer); analyser.getByteFrequencyData(dataArray); visualizerCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height); const visualizers = [ drawNeonHolographicBars, drawQuantumCirclesX, drawNeuralWaveV2, drawGalacticNebulaeX, drawHyper4DSpectrum ]; const index = currentVisualizer - 1; if (index >= 0 && index < visualizers.length) visualizers[index](); }
    function startVisualizer() { if (!visualizerAnimationId && isAudioInitialized) { console.log("Starting visualizer animation."); renderVisualizer(); } }
    function stopVisualizer() { if (visualizerAnimationId) { cancelAnimationFrame(visualizerAnimationId); visualizerAnimationId=null; console.log("Stopping visualizer animation."); visualizerCtx.clearRect(0,0,visualizerCanvas.width,visualizerCanvas.height); } }
    function drawNeonHolographicBars(){const barW=(visualizerCanvas.width/bufferLength)*1.5;const space=0.5;const t=performance.now()*0.001;visualizerCtx.save();for(let i=0,x=0;i<bufferLength;i++){const amp=dataArray[i]/255;const h=Math.max(1,amp*visualizerCanvas.height*0.9);const pulse=0.8+0.2*Math.sin(t*5+i*0.2);const hue=(i/bufferLength)*200+t*20;const grad=visualizerCtx.createLinearGradient(x,visualizerCanvas.height,x,visualizerCanvas.height-h*pulse);grad.addColorStop(0,`hsla(${hue%360},100%,60%,0.8)`);grad.addColorStop(0.5,`hsla(${(hue+30)%360},90%,65%,0.6)`);grad.addColorStop(1,`hsla(${(hue+60)%360},80%,70%,0.3)`);visualizerCtx.shadowColor=`hsla(${hue%360},100%,70%,0.6)`;visualizerCtx.shadowBlur=8*amp;visualizerCtx.fillStyle=grad;const r=barW*0.3;visualizerCtx.beginPath();visualizerCtx.moveTo(x+r,visualizerCanvas.height);visualizerCtx.lineTo(x+barW-r,visualizerCanvas.height);visualizerCtx.arcTo(x+barW,visualizerCanvas.height,x+barW,visualizerCanvas.height-r,r);visualizerCtx.lineTo(x+barW,visualizerCanvas.height-h*pulse+r);visualizerCtx.arcTo(x+barW,visualizerCanvas.height-h*pulse,x+barW-r,visualizerCanvas.height-h*pulse,r);visualizerCtx.lineTo(x+r,visualizerCanvas.height-h*pulse);visualizerCtx.arcTo(x,visualizerCanvas.height-h*pulse,x,visualizerCanvas.height-h*pulse+r,r);visualizerCtx.lineTo(x,visualizerCanvas.height-r);visualizerCtx.arcTo(x,visualizerCanvas.height,x+r,visualizerCanvas.height,r);visualizerCtx.closePath();visualizerCtx.fill();if(amp>0.6&&Math.random()<0.05){visualizerCtx.save();visualizerCtx.globalCompositeOperation='lighter';visualizerCtx.fillStyle=`rgba(255,255,255,${0.4+Math.random()*0.4})`;const gy=visualizerCanvas.height-h*(0.2+Math.random()*0.6);const gh=1+Math.random()*3;visualizerCtx.fillRect(x,gy,barW,gh);visualizerCtx.restore();}x+=barW+space;}visualizerCtx.restore();}
    function drawQuantumCirclesX(){const t=performance.now()*0.0005;const cx=visualizerCanvas.width/2;const cy=visualizerCanvas.height/2;const maxR=Math.min(cx,cy)*0.7;visualizerCtx.save();visualizerCtx.lineWidth=1.5;for(let i=0;i<bufferLength;i+=2){const amp=dataArray[i]/255;const ang=(Math.PI*2*i/bufferLength)+t*(i%5+1)*0.1;const baseR=amp*maxR;const pulse=1+0.2*Math.sin(t*8+i*0.5);const orbitR=baseR*pulse;const x=cx+Math.cos(ang)*orbitR;const y=cy+Math.sin(ang)*orbitR;const pSize=1+amp*5;const hue=((i*360/bufferLength)+t*60)%360;const grad=visualizerCtx.createRadialGradient(x,y,0,x,y,pSize*1.5);grad.addColorStop(0,`hsla(${hue},100%,75%,${0.8+amp*0.2})`);grad.addColorStop(0.5,`hsla(${(hue+40)%360},90%,65%,${0.5*amp})`);grad.addColorStop(1,`hsla(${(hue+80)%360},80%,55%,0)`);visualizerCtx.fillStyle=grad;visualizerCtx.beginPath();visualizerCtx.arc(x,y,pSize*1.5,0,Math.PI*2);visualizerCtx.fill();if(amp>0.1){visualizerCtx.strokeStyle=`hsla(${hue},100%,70%,${0.1+amp*0.5})`;visualizerCtx.beginPath();visualizerCtx.moveTo(cx,cy);visualizerCtx.lineTo(x,y);visualizerCtx.stroke();}}visualizerCtx.restore();}
    function drawNeuralWaveV2(){const sliceW=visualizerCanvas.width/(bufferLength-1);const t=performance.now()*0.0015;const waveH=visualizerCanvas.height*0.6;visualizerCtx.save();visualizerCtx.lineWidth=2;visualizerCtx.strokeStyle='rgba(0,255,208,0.7)';visualizerCtx.beginPath();let startX=0,startY=visualizerCanvas.height/2;visualizerCtx.moveTo(startX,startY);for(let i=0;i<bufferLength;i++){const v=dataArray[i]/255;const x=i*sliceW;const yOff=(v-0.5)*waveH;const sine=Math.sin(i*0.1+t)*waveH*0.2;const y=visualizerCanvas.height/2+yOff+sine;const xc=(x+startX)/2;const yc=(y+startY)/2;visualizerCtx.quadraticCurveTo(startX,startY,xc,yc);startX=x;startY=y;if(i%4===0&&v>0.1){visualizerCtx.fillStyle=`hsla(${(180+v*100)%360},100%,${60+v*30}%,${0.5+v*0.5})`;visualizerCtx.beginPath();visualizerCtx.arc(x,y,1+v*3,0,Math.PI*2);visualizerCtx.fill();}}visualizerCtx.lineTo(startX,startY);visualizerCtx.stroke();visualizerCtx.lineWidth=1;visualizerCtx.strokeStyle='rgba(255,75,0,0.4)';visualizerCtx.beginPath();startX=0;startY=visualizerCanvas.height/2;visualizerCtx.moveTo(startX,startY);for(let i=0;i<bufferLength;i++){const v=dataArray[i]/255;const x=i*sliceW;const yOff=(v-0.5)*waveH*0.7;const sine=Math.sin(i*0.12+t+Math.PI/2)*waveH*0.15;const y=visualizerCanvas.height/2+yOff+sine;const xc=(x+startX)/2;const yc=(y+startY)/2;visualizerCtx.quadraticCurveTo(startX,startY,xc,yc);startX=x;startY=y;}visualizerCtx.lineTo(startX,startY);visualizerCtx.stroke();visualizerCtx.restore();}
    function drawGalacticNebulaeX(){const cx=visualizerCanvas.width/2;const cy=visualizerCanvas.height/2;const t=performance.now()/5000;visualizerCtx.save();visualizerCtx.fillStyle='rgba(10,11,12,0.1)';visualizerCtx.fillRect(0,0,visualizerCanvas.width,visualizerCanvas.height);visualizerCtx.globalCompositeOperation='lighter';const numP=60;for(let i=0;i<numP;i++){const ang=(i/numP)*Math.PI*5+t;const frac=Math.pow(i/numP,0.8);const dist=frac*(visualizerCanvas.width/2.5);const x=cx+Math.cos(ang)*dist*(1+Math.sin(t*2+i*0.2)*0.1);const y=cy+Math.sin(ang)*dist*(1+Math.cos(t*2+i*0.2)*0.1);const dataIdx=Math.floor(Math.pow(i/numP,1.2)*(bufferLength*0.6));const inten=(dataArray[dataIdx]||0)/255;const baseR=5+frac*20;const r=Math.max(2,baseR*(0.5+inten*1.5));const hue=(frac*100+t*30+180)%360;const grad=visualizerCtx.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,`hsla(${hue},90%,70%,${inten*0.8})`);grad.addColorStop(0.4,`hsla(${(hue+30)%360},80%,60%,${inten*0.4})`);grad.addColorStop(1,`hsla(${(hue+60)%360},70%,50%,0)`);visualizerCtx.fillStyle=grad;visualizerCtx.beginPath();visualizerCtx.arc(x,y,r,0,Math.PI*2);visualizerCtx.fill();}const bassAvg=getAverageAmplitude(dataArray,0,bufferLength*0.1);const coreR=Math.max(10,bassAvg*visualizerCanvas.height*0.5);const coreHue=(10+t*20)%360;const coreGrad=visualizerCtx.createRadialGradient(cx,cy,0,cx,cy,coreR);coreGrad.addColorStop(0,`hsla(${coreHue},100%,65%,${bassAvg*0.7})`);coreGrad.addColorStop(0.7,`hsla(${(coreHue+20)%360},90%,55%,${bassAvg*0.3})`);coreGrad.addColorStop(1,`hsla(${(coreHue+40)%360},80%,50%,0)`);visualizerCtx.fillStyle=coreGrad;visualizerCtx.beginPath();visualizerCtx.arc(cx,cy,coreR,0,Math.PI*2);visualizerCtx.fill();visualizerCtx.restore();}
    function drawHyper4DSpectrum(){const barW=visualizerCanvas.width/bufferLength;const t=performance.now()/1000;visualizerCtx.save();for(let i=0;i<bufferLength;i++){const amp=dataArray[i]/255;const h=Math.max(1,amp*visualizerCanvas.height);const x=i*barW;const hue=(i/bufferLength)*300;const grad1=visualizerCtx.createLinearGradient(x,visualizerCanvas.height,x,visualizerCanvas.height-h);grad1.addColorStop(0,`hsla(${hue},100%,40%,0.7)`);grad1.addColorStop(0.8,`hsla(${hue},100%,60%,0.9)`);grad1.addColorStop(1,`hsla(${hue},100%,75%,1.0)`);visualizerCtx.fillStyle=grad1;visualizerCtx.fillRect(x,visualizerCanvas.height-h,barW,h);const hlH=h*(0.4+Math.sin(t*3+i*0.1)*0.1);const hlO=barW*0.1;visualizerCtx.fillStyle=`hsla(${(hue+30)%360},100%,85%,${0.3+amp*0.4})`;visualizerCtx.fillRect(x+hlO,visualizerCanvas.height-hlH,barW-2*hlO,hlH);if(amp>0.7){visualizerCtx.fillStyle=`hsla(${(hue+60)%360},100%,95%,${0.5+Math.random()*0.5})`;visualizerCtx.fillRect(x,visualizerCanvas.height-h-2,barW,2+Math.random()*2);}if(Math.random()<0.008){visualizerCtx.save();const gA=(Math.random()-0.5)*barW*1.5;const gY=visualizerCanvas.height-Math.random()*h;const gH=1+Math.random()*4;visualizerCtx.globalCompositeOperation=Math.random()<0.5?'lighter':'difference';visualizerCtx.fillStyle=`rgba(255,${Math.random()*150},${Math.random()*150},0.7)`;visualizerCtx.fillRect(x+gA,gY,barW,gH);visualizerCtx.restore();}}visualizerCtx.restore();}


    // ===============================================================
    // ======= EVENT LISTENERS & INITIALIZATION =======
    // ===============================================================

    function updateVisualizerButtons() {
      document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === currentVisualizer);
      });
    }

    // --- Attach Event Listeners ---
    playPauseBtn.addEventListener('click', () => { if (musicPlayer.paused) playTrack(); else pauseTrack(); });
    $('prevTrack').addEventListener('click', () => { loadTrack(currentTrackIndex - 1); playTrack(); });
    $('nextTrack').addEventListener('click', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('ended', () => { console.log("Track ended, loading next."); loadTrack(currentTrackIndex + 1); playTrack(); });
    musicPlayer.addEventListener('timeupdate', updateProgress);
    musicPlayer.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(musicPlayer.duration); console.log("Metadata loaded, duration:", formatTime(musicPlayer.duration)); });
    progressContainer.addEventListener('click', e => { if (!musicPlayer.duration || !isFinite(musicPlayer.duration)) return; const pos = e.offsetX / progressContainer.offsetWidth; musicPlayer.currentTime = pos * musicPlayer.duration; updateProgress(); });
    playlistToggleBtn.addEventListener('click', () => { const isHidden = playlistEl.style.display === 'none'; playlistEl.style.display = isHidden ? 'block' : 'none'; playlistToggleBtn.textContent = isHidden ? 'Hide Playlist' : 'Playlist'; if (isHidden) updatePlaylistActiveState(); /* Scroll happens in update function */ });
    document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => { btn.addEventListener('click', () => { const vizIdx = i + 1; if (currentVisualizer !== vizIdx) { currentVisualizer = vizIdx; updateVisualizerButtons(); console.log("Switched to visualizer:", currentVisualizer); } }); });

    let resizeTimeout;
    window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { console.log("Window resized, recalculating canvas sizes."); resizeCanvases(); }, 250); });

    musicPlayer.addEventListener('error', (e) => { console.error('Audio Player Error:', musicPlayer.error); trackTitleEl.textContent = 'Error loading track'; if (!musicPlayer.error) return; switch (musicPlayer.error.code) { case MediaError.MEDIA_ERR_ABORTED: console.error('Load aborted.'); break; case MediaError.MEDIA_ERR_NETWORK: console.error('Network error.'); break; case MediaError.MEDIA_ERR_DECODE: console.error('Decoding error.'); break; case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: console.error('Source not supported / File not found (404?). Check path/URL.'); break; default: console.error('An unknown audio error occurred.'); break; } });


    // --- Initial Setup on Page Load ---
    function initializePlayer() {
        console.log("Initializing player...");
        resizeCanvases();           // Set initial canvas sizes
        createPlaylist();           // Build the playlist HTML
        loadTrack(currentTrackIndex); // Load info for the first track (does NOT play)
        updateVisualizerButtons();  // Set initial active visualizer button
        initNeuralNetwork();        // Setup the background network structure
        startBackgroundAnimation(); // Start background animation (waits for audio init)
        console.log("Player initialization complete. Ready for user interaction.");
    }

    // Run initialization when the DOM is fully loaded
    document.addEventListener('DOMContentLoaded', initializePlayer);

  </script>
