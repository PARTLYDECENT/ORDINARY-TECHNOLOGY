<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuromantic Player Enhanced</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    :root {
      --primary: #ff4b00;
      --secondary: #00ffd0;
      --bg-dark: #0a0b0c;
      --bg-light: #121416;
      --text: #e0e0e0;
      --glitch1: rgba(255, 75, 0, 0.7);
      --glitch2: rgba(0, 255, 208, 0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Changed from overflow-x */
    }

    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
      position: relative;
      text-transform: uppercase;
      color: var(--primary);
      z-index: 1; /* Ensure header is above background */
    }

    header::after {
      content: 'PLAYER';
      position: absolute;
      left: 2px; /* Offset for glitch effect */
      top: 2px;  /* Offset for glitch effect */
      color: var(--secondary);
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
      text-shadow: -2px -2px 0 var(--glitch1), 2px 2px 0 var(--glitch2); /* Glitch text shadow */
      opacity: 0.8;
    }

    .player-container {
      width: 90%;
      max-width: 600px; /* Slightly smaller for focus */
      background: var(--bg-light);
      border-radius: 2px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 15px var(--primary), 0 0 25px var(--secondary); /* Added neon glow */
      border: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1; /* Ensure player is above background */
    }

    .player-container::before {
      content: '';
      position: absolute;
      top: -1px; /* Adjusted position */
      left: -1px; /* Adjusted position */
      right: -1px; /* Adjusted position */
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      filter: blur(2px); /* Soft glow for the top border */
      z-index: -1;
    }

    .track-info {
      display: grid;
      grid-template-columns: 1fr auto;
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .track-title {
      font-weight: bold;
      color: var(--primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-number { color: var(--secondary); }

    .progress-container {
      height: 5px; /* Slightly thicker */
      background: rgba(255, 255, 255, 0.05); /* Darker background */
      cursor: pointer;
      position: relative;
    }
     /* Add a subtle glow to progress bar */
    .progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        filter: blur(3px);
        opacity: 0.6;
        transform-origin: left;
        transform: scaleX(var(--progress-scale, 0)); /* Use CSS variable */
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%; /* Controlled by JS */
      position: relative;
       transform-origin: left;
    }


    .time-display {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0.5rem 1rem;
    }

    .controls button {
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      padding: 0.5rem;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: color 0.2s ease, text-shadow 0.2s ease; /* Smooth transition */
    }

    .controls button:hover {
      color: var(--primary);
      text-shadow: 0 0 5px var(--primary); /* Add hover glow */
    }
    .controls button:active {
        color: var(--secondary);
        text-shadow: 0 0 5px var(--secondary);
    }

    #visualizer { /* Renamed from canvas */
      width: 100%;
      height: 150px; /* Adjusted height */
      display: block;
      background: linear-gradient(180deg, rgba(10, 11, 12, 0.1) 0%, rgba(18, 20, 22, 0.5) 100%); /* Subtle gradient */
    }

    /* Removed .visualizer-container as canvas is directly inside player-container now */

    .visualizer-controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(0, 0, 0, 0.3); /* Slightly darker */
    }

    .visualizer-controls button {
      background: none;
      border: 1px solid transparent; /* Add border for better click feedback */
      color: rgba(255, 255, 255, 0.5);
      font-family: inherit;
      font-size: 0.6rem;
      padding: 0.35rem; /* Increased padding */
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s, border-color 0.2s;
    }
    .visualizer-controls button:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .visualizer-controls button.active {
        color: var(--secondary);
        border-color: var(--secondary);
        text-shadow: 0 0 4px var(--secondary);
    }

    .playlist-toggle {
      width: 100%;
      background: rgba(255,255,255, 0.02); /* Subtle background */
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.75rem;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.2s;
    }
    .playlist-toggle:hover {
        background: rgba(255,255,255, 0.05);
    }

    .playlist-container {
      max-height: 180px; /* Adjusted height */
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      scrollbar-width: thin; /* For Firefox */
      scrollbar-color: var(--primary) rgba(0,0,0,0.3); /* For Firefox */
    }
    /* Basic scrollbar styling for Webkit browsers */
     .playlist-container::-webkit-scrollbar { width: 6px; }
     .playlist-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
     .playlist-container::-webkit-scrollbar-thumb { background-color: var(--primary); border-radius: 3px; }


    .playlist-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.15s ease;
    }

    .playlist-item:hover { background: rgba(255, 255, 255, 0.05); }
    .playlist-item.active { background: rgba(255, 75, 0, 0.15); } /* Slightly stronger active background */
    .playlist-item.active span:last-child { color: var(--primary); font-weight: bold; }
    .playlist-item span:first-child { color: var(--secondary); } /* Track number color */
  </style>
</head>
<body>
  <canvas id="background-canvas"></canvas>

  <header>Neuromantic</header>
  <div class="player-container">
    <canvas id="visualizer"></canvas>

    <audio id="musicPlayer" src="track1.mp3"></audio> <div class="track-info">
      <div class="track-title" id="trackTitle">Select Track</div>
      <div class="track-number"><span id="currentTrackNum">--</span>/<span id="totalTracks">--</span></div>
    </div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <div class="controls">
      <button id="prevTrack">Prev</button>
      <button id="playPause">Play</button>
      <button id="nextTrack">Next</button>
    </div>

    <div class="visualizer-controls">
      <button id="viz1" class="active">Bars</button>
      <button id="viz2">Circles</button>
      <button id="viz3">Wave</button>
      <button id="viz4">Nebula</button>
      <button id="viz5">Spectrum</button>
    </div>
    <button class="playlist-toggle" id="playlistToggle">Playlist</button>
    <div class="playlist-container" id="playlist" style="display:none;"></div>
  </div>

  <script>
    // DOM elements
    const $ = id => document.getElementById(id);
    const musicPlayer = $('musicPlayer');
    const playPauseBtn = $('playPause');
    const canvas = $('visualizer'); // Renamed reference
    const ctx = canvas.getContext('2d');
    const progressBar = $('progressBar');
    const progressContainer = $('progressContainer');
    const bgCanvas = $('background-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    // Constants for visualizers
    const VIZ_BAR_GLITCH_CHANCE = 0.018;
    const VIZ_WAVE_SECONDARY_ALPHA = 0.4;
    const VIZ_NEBULA_STAR_COUNT = 100;
    const VIZ_NEBULA_STAR_TREBLE_THRESHOLD = 160; // Higher frequencies needed to make stars bright
    const VIZ_SPECTRUM_BASS_JITTER_FACTOR = 0.1;

    // Set initial canvas dimensions
    function resizeCanvases() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
         // Reinitialize background network on resize if needed
         if (neuralNetwork) {
            neuralNetwork.canvasWidth = bgCanvas.width;
            neuralNetwork.canvasHeight = bgCanvas.height;
            // neuralNetwork.initNeurons(); // Recalculate positions based on new size
            // neuralNetwork.initConnections();
         }
    }
    resizeCanvases(); // Initial size set


    // Track list (Ensure these files exist or use valid URLs)
    const tracks = [
        { src: 'https://cdn.pixabay.com/download/audio/2024/02/08/audio_796c654b7f.mp3', title: 'Synthwave Drive' },
        { src: 'https://cdn.pixabay.com/download/audio/2022/08/03/audio_eb1c377914.mp3', title: 'Cyberpunk Bar' },
        { src: 'https://cdn.pixabay.com/download/audio/2023/01/17/audio_716100e52e.mp3', title: 'Neon Nights' },
        { src: 'https://cdn.pixabay.com/download/audio/2024/03/26/audio_b08f8f07f6.mp3', title: 'Tech Dreams' },
        { src: 'https://cdn.pixabay.com/download/audio/2023/12/20/audio_971fad7f3f.mp3', title: 'Digital Escape' },
        { src: 'https://cdn.pixabay.com/download/audio/2022/06/08/audio_a8553e8c4e.mp3', title: 'Retro Chip' },
        { src: 'https://cdn.pixabay.com/download/audio/2023/04/05/audio_a433d0999e.mp3', title: 'Lo-fi Glitch' },
        { src: 'https://cdn.pixabay.com/download/audio/2024/01/15/audio_77d25e7655.mp3', title: 'Dark Ambient' }, // Existing ambient
        // Add more valid URLs or local paths
    ];
     $('totalTracks').textContent = tracks.length;

    // State variables
    let currentTrackIndex = 0;
    let currentVisualizer = 1;
    let animationId = null;
    let bgAnimationId = null;
    let audioContext, analyser, source, dataArray, bufferLength;

    // Neural network background state
    const neurons = []; // Keep these arrays if class isn't used or modify class usage
    const connections = [];
    const neuronCount = 70; // Reduced slightly
    const layerCount = 5;
    const colorSchemes = [
      { neuron: '#ff4b00', connection: 'rgba(0, 255, 208, 0.5)' }, // Base opacity for connections
      { neuron: '#00ffd0', connection: 'rgba(255, 75, 0, 0.5)' },
      { neuron: '#ff00ff', connection: 'rgba(0, 255, 255, 0.5)' },
      { neuron: '#ffff00', connection: 'rgba(0, 136, 255, 0.5)' }
    ];
    let currentColorScheme = 0;
    let reactivityFactor = 0; // Global reactivity

    // Helper functions
    const formatTime = s => s ? `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}` : '0:00'; // Handle NaN/undefined

    // Audio context initialization
    function initAudio() {
      if (!audioContext) {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            // Important: Ensure source is created only ONCE per audio element
            if (!source) {
                 source = audioContext.createMediaElementSource(musicPlayer);
            } else {
                 // If source exists, disconnect old connections IF NECESSARY - usually not needed
                 // if source is always the same element, just reconnecting analyser is fine
            }

            source.connect(analyser);
            // Connect analyser to destination ONLY if not already connected
            // This requires checking the analyser's connections, simpler to just connect once.
            // If analyser is always the same, this is fine.
            analyser.connect(audioContext.destination);

            analyser.fftSize = 512; // Powers of 2
            analyser.smoothingTimeConstant = 0.8; // Smoother transitions
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            console.log("AudioContext Initialized");
        } catch (e) {
            console.error("Error initializing AudioContext:", e);
            alert("Could not initialize audio. Your browser might not support the Web Audio API.");
        }
      }
    }


    // ==================================
    // NEURAL NETWORK BACKGROUND CLASSES
    // ==================================
    class Neuron {
      constructor(x, y, layer, size, speed, canvasWidth, canvasHeight) {
        this.baseX = x; // Store relative position if needed for resize
        this.baseY = y;
        this.layer = layer;
        this.size = size;
        this.speed = speed;
        this.pulse = 0;
        // Calculate initial absolute position
        this.updatePosition(canvasWidth, canvasHeight);
      }

      updatePosition(canvasWidth, canvasHeight) {
          // Example: Position based on layer and index within layer
          const neuronsInLayer = this.layer === 0 || this.layer === layerCount - 1 ? 10 : 20;
          const layerIndex = neuralNetwork.neurons.filter(n => n.layer === this.layer).indexOf(this); // Find index in layer
          const layerXRatio = this.layer / (layerCount - 1);
          const layerX = layerXRatio * (canvasWidth - 100) + 50; // Add some padding

          const ySpread = this.layer === 0 || this.layer === layerCount - 1 ? 0.6 : 0.8;
          const yRatio = neuronsInLayer <= 1 ? 0.5 : layerIndex / (neuronsInLayer - 1);
          const y = canvasHeight * (0.5 - ySpread / 2 + ySpread * yRatio);

          this.x = layerX;
          this.y = y;
      }


      update(audioValue, reactivityFactor) {
        // Enhanced pulse effect - make size react more
        this.pulse = (audioValue / 255) * (4 + 3 * reactivityFactor); // Increased base and multiplier
      }
    }

    class Connection {
      constructor(from, to, weight) {
        this.from = from; this.to = to; this.weight = weight;
        this.signal = Math.random();
        this.opacity = 0.1; // Base opacity
      }

      update(reactivityFactor) {
        this.signal = (this.signal + reactivityFactor * 0.06) % 1; // Slightly faster signal
        // Make opacity reactive
        this.opacity = 0.05 + this.weight * 0.1 + reactivityFactor * 0.3; // Base + weight + reactivity boost
      }
    }

    class NeuralNetwork {
      constructor(layerCount, canvasWidth, canvasHeight) {
        this.layerCount = layerCount;
        this.canvasWidth = canvasWidth;
        this.canvasHeight = canvasHeight;
        this.neurons = [];
        this.connections = [];
        this.initNeurons();
        this.initConnections();
      }

      initNeurons() {
        this.neurons = [];
        for (let layer = 0; layer < this.layerCount; layer++) {
          const neuronsInLayer = layer === 0 || layer === this.layerCount - 1 ? 10 : 20;
          for (let i = 0; i < neuronsInLayer; i++) {
            const size = Math.random() * 2.5 + 1.5; // Slightly smaller base size
            const speed = Math.random() * 0.02 + 0.01;
             // Pass dimensions for initial position calculation
            this.neurons.push(new Neuron(0, 0, layer, size, speed, this.canvasWidth, this.canvasHeight));
          }
        }
         // Update positions after all neurons are created
         this.neurons.forEach(n => n.updatePosition(this.canvasWidth, this.canvasHeight));
      }

      initConnections() {
        this.connections = [];
        this.neurons.forEach(from => {
          if (from.layer < this.layerCount - 1) {
            const nextLayerNeurons = this.neurons.filter(n => n.layer === from.layer + 1);
            // Connect more sparsely or based on proximity? For now, simple skipping.
            for (let j = 0; j < nextLayerNeurons.length; j += (Math.random() < 0.6 ? 1 : 2)) { // Connect to ~70%
              const weight = Math.random();
              this.connections.push(new Connection(from, nextLayerNeurons[j], weight));
            }
          }
        });
      }

      update(audioData, bufferLength, reactivityFactor) {
        this.neurons.forEach((neuron, index) => {
          const freqIndex = Math.floor((index / this.neurons.length) * bufferLength * 0.8); // Focus on lower/mid frequencies
          neuron.update(audioData[freqIndex] || 0, reactivityFactor); // Use || 0 fallback
        });
        this.connections.forEach(conn => conn.update(reactivityFactor));
      }

      render(ctx, colorSchemes, currentColorScheme, reactivityFactor) {
         ctx.lineCap = 'round'; // Smoother lines
        const colors = colorSchemes[currentColorScheme];

        // Draw connections first (behind neurons)
        this.connections.forEach(conn => {
          const dx = conn.to.x - conn.from.x; const dy = conn.to.y - conn.from.y; const distance = Math.sqrt(dx*dx + dy*dy);
          if (distance < this.canvasWidth / (this.layerCount -1) * 1.5 ) { // Connect only nearby layers
            const signalX = conn.from.x + dx * conn.signal; const signalY = conn.from.y + dy * conn.signal;

            // Draw base line with reactive opacity
            ctx.strokeStyle = colors.connection.replace(/[\d\.]+\)$/g, `${Math.min(0.8, conn.opacity)})`); // Update alpha in rgba string
            ctx.lineWidth = 0.5 + conn.weight; // Thicker lines for stronger weights
            ctx.beginPath(); ctx.moveTo(conn.from.x, conn.from.y); ctx.lineTo(conn.to.x, conn.to.y); ctx.stroke();

            // Draw signal dot with reactive size
            ctx.fillStyle = colors.neuron; // Use neuron color for signal for contrast
            ctx.beginPath(); ctx.arc(signalX, signalY, 1 + reactivityFactor * 2.5, 0, Math.PI * 2); ctx.fill(); // Size reacts
          }
        });

         // Draw neurons
        this.neurons.forEach(neuron => {
          const oscillation = Math.sin(performance.now() * neuron.speed + neuron.layer) * 0.5; // Added layer offset
          const finalSize = neuron.size + neuron.pulse + oscillation;
          ctx.fillStyle = colors.neuron;
          ctx.shadowColor = colors.neuron; // Add glow
          ctx.shadowBlur = finalSize * 1.5; // Glow size based on neuron size
          ctx.beginPath(); ctx.arc(neuron.x, neuron.y, Math.max(1, finalSize), 0, Math.PI * 2); ctx.fill(); // Ensure minimum size
        });
        ctx.shadowBlur = 0; // Reset shadow
      }
    }

    // ==================================
    // BACKGROUND RENDER LOOP
    // ==================================
    function renderNeuralBackground() {
      bgAnimationId = requestAnimationFrame(renderNeuralBackground); // Continue loop

      // Only analyze if audio context is ready
      let currentReactivity = 0;
      if (audioContext && analyser && dataArray) {
          try {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) { sum += dataArray[i]; }
            currentReactivity = sum / (bufferLength * 128); // Normalize differently for more sensitivity maybe?
            reactivityFactor = reactivityFactor * 0.9 + currentReactivity * 0.1; // Smooth reactivity factor
          } catch (e) {
              console.warn("Analyser error:", e); // Catch potential errors if node disconnected
              // Maybe stop background animation if audio fails permanently?
          }

      } else {
          reactivityFactor *= 0.95; // Decay if no audio
      }


      // Fading background effect
       bgCtx.fillStyle = `rgba(10, 11, 12, ${0.1 + reactivityFactor * 0.05})`; // Slower fade with less reactivity
       bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Update & Render the neural network
      if (neuralNetwork) {
          neuralNetwork.update(dataArray || [], bufferLength || 0, reactivityFactor);
          neuralNetwork.render(bgCtx, colorSchemes, currentColorScheme, reactivityFactor);
      }


      // Change color scheme occasionally
      if (Math.random() < 0.0005 + reactivityFactor * 0.005) { // Less frequent base change
        currentColorScheme = (currentColorScheme + 1) % colorSchemes.length;
      }
    }

    // ==================================
    // VISUALIZER DRAWING FUNCTIONS
    // ==================================

    /* 1. Neon Holographic Bars – With Particle Glitch Overlays */
    function drawNeonHolographicBars() {
        const barWidth = (canvas.width / bufferLength) * 1.8;
        const t = Date.now() * 0.002;

        for (let i = 0, x = 0; i < bufferLength; i++, x += barWidth + 1) {
            const amplitude = dataArray[i] / 255.0;
            const barHeight = amplitude * canvas.height * 0.8;
            const pulse = 0.5 + 0.5 * Math.sin(t + i * 0.3);

            const hue = (i / bufferLength) * 360 + t * 30;
            const gradient = ctx.createLinearGradient(x, canvas.height, x, canvas.height - barHeight * pulse);
            gradient.addColorStop(0, `hsla(${hue % 360}, 100%, 70%, 0.9)`);
            gradient.addColorStop(0.5, `hsla(${(hue + 40) % 360}, 100%, 60%, 0.7)`);
            gradient.addColorStop(1, `hsla(${(hue + 100) % 360}, 100%, 50%, 0.3)`);

            ctx.save();
            ctx.shadowColor = `hsla(${hue % 360}, 100%, 70%, 0.8)`;
            ctx.shadowBlur = 10 + 15 * amplitude; // Adjusted shadow blur

            ctx.fillStyle = gradient;
            // Curved top bars
            const curveHeight = barHeight * (0.8 + pulse * 0.2); // Make curve more dynamic
            ctx.beginPath();
            ctx.moveTo(x, canvas.height);
            ctx.lineTo(x, canvas.height - curveHeight * 0.6);
            ctx.quadraticCurveTo(x + barWidth / 2, canvas.height - curveHeight, x + barWidth, canvas.height - curveHeight * 0.6);
            ctx.lineTo(x + barWidth, canvas.height);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Glitch overlay
            if (Math.random() < VIZ_BAR_GLITCH_CHANCE) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + 0.4 * Math.random()})`;
                const glitchY = canvas.height - barHeight * Math.random();
                ctx.fillRect(x - Math.random() * 5, glitchY, barWidth + Math.random() * 10, 1 + Math.random() * 3); // Add horizontal offset
                ctx.restore();
            }
        }
    }

    /* 2. Quantum Circles X – Orbiting Pulses and Laser Lines */
    function drawQuantumCirclesX() {
        const t = performance.now() / 1000.0;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadius = Math.min(canvas.width, canvas.height) / 2.5; // Increase max radius slightly

         // Get average mid-range frequency for line intensity
         const midStart = Math.floor(bufferLength * 0.2);
         const midEnd = Math.floor(bufferLength * 0.6);
         let midSum = 0;
         for (let i = midStart; i < midEnd; i++) midSum += dataArray[i];
         const midAvg = midSum / (midEnd - midStart) / 255.0;


        for (let i = 0; i < bufferLength; i+=2) { // Draw fewer circles for performance/clarity
            const angle = (Math.PI * 2 * i / bufferLength) + (0.1 * Math.sin(t * 0.5 + i * 0.15)); // Slower global rotation
            const amplitude = dataArray[i] / 255.0;
            const baseRadius = amplitude * maxRadius;
            const pulsate = 1 + 0.2 * Math.sin(t * 5 + i * 0.1); // Slower pulse
            const orbitRadius = baseRadius * pulsate;

            const x = centerX + Math.cos(angle) * orbitRadius;
            const y = centerY + Math.sin(angle) * orbitRadius;

            const hue = ((i * 360 / bufferLength) + t * 40) % 360; // Slower color shift
            const radius = Math.max(1, orbitRadius * 0.08 + amplitude * 2); // Base size + amplitude size

            // Outer glow
            const outerGradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 2.5);
            outerGradient.addColorStop(0, `hsla(${hue}, 100%, 70%, ${0.3 * amplitude})`); // Fainter glow
            outerGradient.addColorStop(1, `hsla(${hue}, 100%, 70%, 0)`);
            ctx.fillStyle = outerGradient;
            ctx.beginPath(); ctx.arc(x, y, radius * 2.5, 0, Math.PI * 2); ctx.fill();

            // Inner core
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, `hsla(${hue}, 100%, 80%, 1)`); // Brighter core
            gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 50%, 0.5)`);
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();

            // ** Enhanced Laser Line **
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + 0.8 * midAvg * midAvg})`; // Brightness based on mid-range avg (squared for emphasis)
            ctx.lineWidth = 0.5 + 2.0 * midAvg; // Width based on mid-range avg
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(centerX, centerY); ctx.stroke();
        }
    }

    /* 3. Neural Wave V2 – Futuristic, Fluid Audio Oscillations */
    function drawNeuralWaveV2() {
        const sliceWidth = canvas.width / (bufferLength - 1);
        const t = performance.now() * 0.004; // Slightly slower oscillation

        // Primary Wave
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0, 255, 208, 0.9)'; // --secondary color
        ctx.shadowColor = 'rgba(0, 255, 208, 0.7)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 255.0; // 0 to 1
            const x = i * sliceWidth;
            const y = canvas.height / 2 + (v - 0.5) * canvas.height * 0.8 * Math.sin(i * 0.04 + t);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

         // ** Secondary Wave (Fainter, Different Frequency Range/Offset) **
         ctx.lineWidth = 1.5;
         ctx.strokeStyle = `rgba(255, 75, 0, ${VIZ_WAVE_SECONDARY_ALPHA})`; // --primary color, lower alpha
         ctx.shadowColor = `rgba(255, 75, 0, ${VIZ_WAVE_SECONDARY_ALPHA * 0.8})`;
         ctx.shadowBlur = 6;
         ctx.beginPath();
         const offset = Math.floor(bufferLength * 0.1); // Use slightly different part of spectrum
         for (let i = 0; i < bufferLength; i++) {
             const v = (dataArray[(i + offset) % bufferLength] || 0) / 255.0; // Use offset index
             const x = i * sliceWidth;
             // Slightly different oscillation phase/frequency
             const y = canvas.height / 2 + (v - 0.5) * canvas.height * 0.6 * Math.sin(i * 0.05 - t * 0.8);
             if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
         }
         ctx.stroke();

         ctx.shadowBlur = 0; // Reset shadow
    }


    /* 4. Galactic Nebulae X – Swirling, Interactive Cosmic Clouds */
    function drawGalacticNebulaeX() {
        ctx.fillStyle = 'rgba(0,0,0,0.07)'; // Slightly slower fade
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'lighter';

        const centerX = canvas.width / 2; const centerY = canvas.height / 2; const t = performance.now() / 1000.0;

        // Nebula clouds
        const cloudCount = 60; // Fewer main clouds
        for (let i = 0; i < cloudCount; i++) {
            const angle = (i / cloudCount) * Math.PI * 4 + t * 0.1; // Spiral motion
            const distance = (i / cloudCount) * (canvas.width / 2.2) * (1 + 0.2 * Math.sin(t * 0.3 + i)); // Pulsating distance
            const x = centerX + Math.cos(angle) * distance; const y = centerY + Math.sin(angle) * distance;

            const dataIndex = Math.floor((i / cloudCount) * bufferLength * 0.7); // Focus on lower/mids
            const intensity = (dataArray[dataIndex] || 0) / 255.0;
            const hue = (i * 8 + t * 25) % 360; // Color shift
            const radius = intensity * 35 + 8; // Size based on intensity

            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, `hsla(${hue}, 90%, 70%, ${intensity * 0.8})`); // Slightly less opaque core
            gradient.addColorStop(0.6, `hsla(${(hue + 40) % 360}, 80%, 60%, ${intensity * 0.3})`);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        }

        // ** Twinkling Stars based on Treble **
        const trebleStart = Math.floor(bufferLength * 0.7);
        for (let i = 0; i < VIZ_NEBULA_STAR_COUNT; i++) {
             const starAngle = Math.random() * Math.PI * 2;
             const starDist = Math.random() * Math.min(canvas.width, canvas.height) * 0.6; // Spread stars
             const starX = centerX + Math.cos(starAngle) * starDist;
             const starY = centerY + Math.sin(starAngle) * starDist;

             // Get a high frequency value
             const trebleIndex = trebleStart + Math.floor(Math.random() * (bufferLength - trebleStart));
             const trebleValue = (dataArray[trebleIndex] || 0);

             if (trebleValue > VIZ_NEBULA_STAR_TREBLE_THRESHOLD) {
                 const brightness = (trebleValue - VIZ_NEBULA_STAR_TREBLE_THRESHOLD) / (255 - VIZ_NEBULA_STAR_TREBLE_THRESHOLD); // Normalize brightness
                 ctx.fillStyle = `rgba(255, 255, 220, ${0.3 + brightness * 0.7})`; // Yellowish white
                 ctx.beginPath();
                 ctx.arc(starX, starY, 0.5 + brightness * 1.5, 0, Math.PI * 2); // Size based on brightness
                 ctx.fill();
             }
        }


        // Core Pulse (Bass)
        const bassValue = getAverageBass(dataArray, 0, Math.floor(bufferLength * 0.1));
        const coreRadius = bassValue * 120 + 40; // Adjusted size
        const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
        coreGradient.addColorStop(0, `rgba(255, 180, 120, ${bassValue * 0.8})`);
        coreGradient.addColorStop(0.4, `rgba(200, 100, 160, ${bassValue * 0.5})`);
        coreGradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = coreGradient;
        ctx.beginPath(); ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2); ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
    }


    /* 5. Hyper 4D Spectrum – Multilayer Frequency Bars with Depth & Glitch FX */
    function drawHyper4DSpectrum() {
        const barWidth = canvas.width / bufferLength;
        const t = Date.now() / 1000.0;
        const bassAvg = getAverageBass(dataArray, 0, Math.floor(bufferLength * 0.1)); // Get bass for jitter

        for (let i = 0; i < bufferLength; i++) {
            const amplitude = dataArray[i] / 255.0;
            const barHeight = amplitude * canvas.height;
            const x = i * barWidth;
            const hue = (i / bufferLength) * 360;

            // ** Bass Jitter **
            const jitter = (Math.random() - 0.5) * barWidth * bassAvg * VIZ_SPECTRUM_BASS_JITTER_FACTOR;

            // Layer 1 (Back) - Slightly darker, wider
            const gradient1 = ctx.createLinearGradient(x + jitter, canvas.height, x + jitter, canvas.height - barHeight);
            gradient1.addColorStop(0, `hsla(${hue}, 90%, 45%, 0.8)`); // Darker base
            gradient1.addColorStop(1, `hsla(${hue}, 90%, 65%, 0.1)`);
            ctx.fillStyle = gradient1;
            ctx.fillRect(x + jitter - barWidth * 0.1, canvas.height - barHeight, barWidth * 1.2, barHeight); // Slightly wider

            // Layer 2 (Middle) - Main color
            ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 5 + i * 0.2); // Pulsing alpha
            const gradient2 = ctx.createLinearGradient(x + jitter, canvas.height, x + jitter, canvas.height - barHeight * 0.8);
            gradient2.addColorStop(0, `hsla(${(hue + 30) % 360}, 100%, 60%, 0.9)`);
            gradient2.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 75%, 0.2)`);
            ctx.fillStyle = gradient2;
            ctx.fillRect(x + jitter, canvas.height - barHeight * 0.8, barWidth, barHeight * 0.8);

            // Layer 3 (Front) - Bright highlight
            ctx.globalAlpha = 0.8;
             const gradient3 = ctx.createLinearGradient(x + jitter, canvas.height, x + jitter, canvas.height - barHeight * 0.4);
             gradient3.addColorStop(0, `hsla(${(hue + 60) % 360}, 100%, 80%, 1.0)`); // Brightest
             gradient3.addColorStop(1, `hsla(${(hue + 90) % 360}, 100%, 90%, 0.1)`);
             ctx.fillStyle = gradient3;
             ctx.fillRect(x + jitter + barWidth * 0.2, canvas.height - barHeight * 0.4, barWidth * 0.6, barHeight * 0.4); // Narrower highlight


            ctx.globalAlpha = 1; // Reset alpha

            // Glitch Lines (Subtler)
            if (Math.random() < 0.008) { // Less frequent
                ctx.strokeStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.3})`;
                ctx.lineWidth = 0.5;
                const glitchX = x + barWidth * Math.random();
                ctx.beginPath(); ctx.moveTo(glitchX, canvas.height - barHeight * Math.random()); ctx.lineTo(glitchX + (Math.random()-0.5)*5, canvas.height - barHeight * Math.random()); ctx.stroke(); // Short horizontal glitch
            }
        }
    }

    // Helper: Calculate average bass amplitude
    function getAverageBass(dataArray, start, end) {
      if (!dataArray) return 0;
      let sum = 0;
      const count = Math.max(1, end - start); // Avoid division by zero
      const safeEnd = Math.min(end, dataArray.length); // Ensure end is within bounds
      for (let i = start; i < safeEnd; i++) {
        sum += dataArray[i];
      }
      return sum / count / 255.0; // Normalize
    }


    // ==================================
    // MAIN VISUALIZER RENDER LOOP
    // ==================================
    function renderVisualizer() {
      if (!audioContext || !analyser || !dataArray) {
           // Don't start loop if audio isn't ready
           if (animationId) cancelAnimationFrame(animationId);
           animationId = null;
           // Optionally clear canvas
           ctx.clearRect(0, 0, canvas.width, canvas.height);
           return;
      }

      animationId = requestAnimationFrame(renderVisualizer); // Continue loop
      analyser.getByteFrequencyData(dataArray); // Get data

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Choose visualizer function
      const visualizers = [ drawNeonHolographicBars, drawQuantumCirclesX, drawNeuralWaveV2, drawGalacticNebulaeX, drawHyper4DSpectrum ];
      const index = (currentVisualizer - 1); // currentVisualizer is 1-based
      if (index >= 0 && index < visualizers.length) {
          visualizers[index](); // Call the selected drawing function
      } else {
          drawNeonHolographicBars(); // Default fallback
      }
    }


    // ==================================
    // EVENT HANDLERS & INITIALIZATION
    // ==================================

    // Track management
    function loadTrack(index) {
      index = (index + tracks.length) % tracks.length; // Wrap around playlist
      currentTrackIndex = index;
      musicPlayer.src = tracks[index].src;
      $('trackTitle').textContent = tracks[index].title;
      $('currentTrackNum').textContent = index + 1;

      document.querySelectorAll('.playlist-item').forEach(item => {
        item.classList.toggle('active', parseInt(item.dataset.index) === index);
      });

      const activeItem = document.querySelector(`.playlist-item[data-index="${index}"]`);
      if (activeItem && $('playlist').style.display !== 'none') { // Only scroll if playlist visible
           activeItem.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      }

      musicPlayer.load(); // Load the new source
       $('currentTime').textContent = '0:00'; // Reset time display
       $('totalTime').textContent = '0:00'; // Reset time display
       progressBar.style.width = '0%'; // Reset progress bar
       if (progressBar.style) progressBar.style.setProperty('--progress-scale', 0); // Reset CSS variable for glow
    }

    function createPlaylist() {
      const playlist = $('playlist'); playlist.innerHTML = ''; // Clear existing items
      tracks.forEach((track, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item' + (i === currentTrackIndex ? ' active' : '');
        item.dataset.index = i;
        item.innerHTML = `<span>${(i + 1).toString().padStart(2, '0')}</span><span>${track.title}</span>`;
        item.addEventListener('click', () => { loadTrack(i); playTrack(); });
        playlist.appendChild(item);
      });
    }

    // Playback controls
    function playTrack() {
      if (!audioContext) initAudio(); // Ensure audio context is ready
      if (!audioContext) return; // Stop if context failed

      audioContext.resume().then(() => { // Resume context if suspended
        musicPlayer.play().then(() => { // Play audio
            playPauseBtn.textContent = 'Pause';
            if (!animationId) renderVisualizer(); // Start visualizer if not running
            if (!bgAnimationId) renderNeuralBackground(); // Start background if not running
        }).catch(e => console.error("Play failed:", e)); // Catch play errors
      });
    }

    function pauseTrack() {
      musicPlayer.pause();
      playPauseBtn.textContent = 'Play';
      // Stop visualizer rendering when paused to save resources
      if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
      // Optionally stop background animation too, or let it run idle
      // if (bgAnimationId) { cancelAnimationFrame(bgAnimationId); bgAnimationId = null; }
    }

    // Progress bar update
    function updateProgress() {
      const duration = musicPlayer.duration;
      const currentTime = musicPlayer.currentTime;
      if (!isFinite(duration) || !isFinite(currentTime)) return; // Check for valid numbers

      const progressPercent = (currentTime / duration) * 100;
      progressBar.style.width = `${progressPercent}%`;
      // Update CSS variable for glow effect efficiently
       if (progressBar.style) progressBar.style.setProperty('--progress-scale', progressPercent / 100);

      $('currentTime').textContent = formatTime(currentTime);
      // Update total time only if it hasn't been set correctly yet by durationchange
      if ($('totalTime').textContent === '0:00' || $('totalTime').textContent === 'NaN:NaN') {
           $('totalTime').textContent = formatTime(duration);
      }
    }

    // Visualizer button state update
    function updateVisualizerButtons() {
      document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === currentVisualizer);
      });
    }

    // Event listeners setup function
    function setupEventListeners() {
        playPauseBtn.addEventListener('click', () => {
            if (!audioContext) initAudio(); // Ensure context on first play
            if (musicPlayer.paused) playTrack(); else pauseTrack();
        });
        $('prevTrack').addEventListener('click', () => { loadTrack(currentTrackIndex - 1); playTrack(); });
        $('nextTrack').addEventListener('click', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
        musicPlayer.addEventListener('ended', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
        musicPlayer.addEventListener('timeupdate', updateProgress);
        musicPlayer.addEventListener('loadedmetadata', () => { // Use loadedmetadata for duration
             $('totalTime').textContent = formatTime(musicPlayer.duration);
             updateProgress(); // Update progress in case time is 0
        });

        progressContainer.addEventListener('click', e => {
             if (!musicPlayer.duration || !isFinite(musicPlayer.duration)) return;
             const clickPosition = e.offsetX / progressContainer.offsetWidth;
             musicPlayer.currentTime = clickPosition * musicPlayer.duration;
             updateProgress(); // Immediately update UI after seeking
        });

        $('playlistToggle').addEventListener('click', () => {
            const playlist = $('playlist'); const isHidden = playlist.style.display === 'none';
            playlist.style.display = isHidden ? 'block' : 'none';
            $('playlistToggle').textContent = isHidden ? 'Hide Playlist' : 'Playlist';
            if(isHidden) { // Scroll active item into view when opening
                const activeItem = document.querySelector(`.playlist-item[data-index="${currentTrackIndex}"]`);
                 if (activeItem) activeItem.scrollIntoView({behavior: 'smooth', block: 'nearest'});
            }
        });

        document.querySelectorAll('.visualizer-controls button').forEach((btn, i) => {
            btn.addEventListener('click', () => { currentVisualizer = i + 1; updateVisualizerButtons(); });
        });

        window.addEventListener('resize', resizeCanvases); // Use resize function
    }


    // --- INITIALIZE ---
    loadTrack(currentTrackIndex); // Load initial track data
    createPlaylist(); // Build playlist HTML
    const neuralNetwork = new NeuralNetwork(layerCount, bgCanvas.width, bgCanvas.height); // Create neural network instance
    renderNeuralBackground(); // Start background rendering loop (will wait for audioContext)
    setupEventListeners(); // Attach all event listeners


  </script>
</body>
