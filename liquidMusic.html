<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuromantic Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --primary: #ff4b00; /* Orange */
            --secondary: #00ffd0; /* Cyan */
            --tertiary: #ff00ff; /* Magenta */
            --quaternary: #ffff00; /* Yellow */
            --bg-dark: #0a0b0c;
            --bg-light: #121416;
            --text: #e0e0e0;
            --text-dim: rgba(224, 224, 224, 0.5);

            /* RGB versions for potential use */
            --rgb-primary: 255, 75, 0;
            --rgb-secondary: 0, 255, 208;
            --rgb-tertiary: 255, 0, 255;
            --rgb-quaternary: 255, 255, 0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            font-size: 16px; /* Base font size */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden; /* Prevent body scroll */
            /* Subtle animated gradient background */
            background: linear-gradient(45deg, var(--bg-dark) 0%, #100f18 50%, var(--bg-dark) 100%);
            background-size: 400% 400%;
            animation: gradientBG 25s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Removed #background-canvas styling - No WebGL BG in this version */

        header {
            font-size: clamp(1.2rem, 5vw, 1.8rem); /* Slightly larger max size */
            font-weight: 700;
            margin-bottom: 2rem;
            position: relative;
            text-transform: uppercase;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary), 0 0 15px rgba(var(--rgb-primary), 0.5); /* Stronger glow */
            letter-spacing: 1px;
        }

        /* Header glitch effect */
        header::before, /* Use ::before and ::after for more complex glitch */
        header::after {
            content: 'Neuromantic'; /* Match text content */
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark); /* Cover original text */
            overflow: hidden;
        }
        header::before { /* Top half, primary color */
             color: var(--primary);
             text-shadow: -1px 0 var(--secondary); /* Offset shadow */
             clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
             animation: glitchTop 2.5s infinite linear alternate-reverse;
        }
        header::after { /* Bottom half, secondary color */
             color: var(--secondary);
             text-shadow: 1px 0 var(--primary); /* Offset shadow */
             clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
             animation: glitchBottom 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitchTop {
            0%, 100% { transform: translate(0,0); }
            5% { transform: translate(2px, -1px); }
            10% { transform: translate(-2px, 1px); }
            15%, 30% { transform: translate(0,0); }
            35% { transform: translate(1px, -0.5px); }
            40% { transform: translate(-1px, 0.5px); }
            45% { transform: translate(0,0); }
        }
        @keyframes glitchBottom {
             0%, 100% { transform: translate(0,0); }
             7% { transform: translate(-2px, 1px); }
             14% { transform: translate(2px, -1px); }
             21%, 35% { transform: translate(0,0); }
             42% { transform: translate(-1px, 0.5px); }
             49% { transform: translate(1px, -0.5px); }
             56% { transform: translate(0,0); }
        }


        .player-container {
            width: 90%;
            max-width: 650px;
            background: rgba(var(--bg-light), 0.85); /* Slightly transparent */
            backdrop-filter: blur(5px); /* Frosted glass effect */
            border-radius: 4px; /* Slightly rounder */
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); /* Stronger shadow */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Brighter border */
            z-index: 10;
            overflow: hidden;
        }

        /* Top border gradient */
        .player-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--tertiary)); /* Added tertiary */
            animation: borderShine 4s linear infinite;
            background-size: 300% 100%;
        }

        @keyframes borderShine {
            0% { background-position: 200% 0; }
            100% { background-position: -100% 0; }
        }


        .visualizer-container {
            width: 100%;
            height: 180px; /* Adjusted height */
            position: relative;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%); /* Darker gradient */
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #visualizer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            /* mix-blend-mode: lighten; */ /* Optional blend mode */
        }


        .track-info {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-title {
            font-weight: bold;
            color: var(--primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 1rem; /* Larger title */
        }

        .track-number {
            color: var(--secondary);
            font-size: 1rem; /* Match title */
            font-weight: bold;
         }

        .progress-container {
            height: 8px; /* Thicker bar */
            background: rgba(0, 0, 0, 0.3); /* Darker bg */
            cursor: pointer;
            width: 100%;
            border-radius: 0px; /* Sharp edges */
            overflow: hidden; /* Ensure bar stays within */
            position: relative; /* For pseudo-element */
        }
         /* Add a subtle inset shadow */
        .progress-container::before {
            content:'';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
            z-index: 2;
        }


        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
             transition: width 0.1s linear; /* Smooth progress updates */
             border-radius: 0px;
             box-shadow: 0 0 5px var(--secondary), 0 0 10px var(--primary); /* Glow for the bar */
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            font-size: 0.8rem; /* Adjusted size */
            color: var(--text-dim);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 0.5rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
             border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .controls button {
            background: none;
            border: none;
            color: var(--text);
            font-family: inherit;
            padding: 0.8rem 0.5rem; /* Adjusted padding */
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9rem; /* Larger control text */
            transition: color 0.2s ease, text-shadow 0.2s ease, transform 0.1s ease;
        }

        .controls button:hover {
             color: var(--primary);
             text-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary);
        }
         .controls button:active {
             transform: scale(0.95);
             color: var(--secondary);
             text-shadow: 0 0 5px var(--secondary);
        }

        .visualizer-controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: rgba(0, 0, 0, 0.3); /* Darker control bar */
        }

        .visualizer-controls button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.75rem; /* Adjusted size */
            padding: 0.6rem 0.25rem; /* Adjusted padding */
            cursor: pointer;
            text-transform: uppercase;
             transition: all 0.2s ease;
             border-bottom: 3px solid transparent; /* Thicker indicator */
             font-weight: 400;
        }

        .visualizer-controls button:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .visualizer-controls button.active {
             color: var(--secondary);
             border-bottom-color: var(--secondary);
             background: rgba(var(--rgb-secondary), 0.1);
             font-weight: bold;
             text-shadow: 0 0 5px var(--secondary);
        }

        .playlist-toggle {
            width: 100%;
            background: var(--bg-light);
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.9rem; /* More padding */
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem; /* Larger */
            font-weight: bold;
            transition: background-color 0.2s ease;
            letter-spacing: 1px;
        }
         .playlist-toggle:hover {
            background: rgba(var(--rgb-primary), 0.1);
            color: var(--primary);
         }


        .playlist-container {
            max-height: 0; /* Start hidden */
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            transition: max-height 0.4s ease-in-out; /* Adjusted transition */
        }

        .playlist-container.visible {
             max-height: 250px; /* More height */
             border-top: 1px solid rgba(255, 255, 255, 0.08);
        }


        .playlist-item {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            padding: 0.8rem 1rem; /* Adjusted padding */
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem; /* Adjusted size */
            transition: background-color 0.15s ease, color 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item:last-child { border-bottom: none; }
        .playlist-item span:first-child { color: var(--text-dim); } /* Track number */

        .playlist-item:hover { background: rgba(var(--rgb-secondary), 0.1); }
        .playlist-item.active { background: rgba(var(--rgb-primary), 0.2); }
        .playlist-item.active span:last-child { color: var(--primary); font-weight: bold; } /* Track title */

        /* Custom Scrollbar */
        .playlist-container::-webkit-scrollbar { width: 8px; }
        .playlist-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        .playlist-container::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        .playlist-container::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

    </style>
</head>
<body>
    <header>Neuromantic</header>

    <div class="player-container">
        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>

        <audio id="musicPlayer"></audio>

        <div class="track-info">
            <div class="track-title" id="trackTitle">No Track Loaded</div>
            <div class="track-number"><span id="currentTrackNum">--</span>/<span id="totalTracks">--</span></div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>

        <div class="controls">
            <button id="prevTrack" title="Previous Track">PREV</button>
            <button id="playPause" title="Play/Pause">PLAY</button>
            <button id="nextTrack" title="Next Track">NEXT</button>
        </div>

        <div class="visualizer-controls">
            <button id="viz1" data-viz="1" class="active" title="Enhanced Bars">Bars</button>
            <button id="viz2" data-viz="2" title="Orbital Decay">Circles</button>
            <button id="viz3" data-viz="3" title="Plasma Conduit">Wave</button>
            <button id="viz4" data-viz="4" title="Living Constellation">Nebula</button>
            <button id="viz5" data-viz="5" title="Data Stream">Spectrum</button>
        </div>

        <button class="playlist-toggle" id="playlistToggle">Show Playlist</button>
        <div class="playlist-container" id="playlist">
            </div>
    </div>

    <script>
        // === DOM Element References ===
        const $ = id => document.getElementById(id);
        const musicPlayer = $('musicPlayer');
        const playPauseBtn = $('playPause');
        const visualizerCanvas = $('visualizer');
        const vizCtx = visualizerCanvas.getContext('2d');
        const progressBar = $('progressBar');
        const progressContainer = $('progressContainer');
        // Removed backgroundCanvas refs - no WebGL BG in this version
        const playlistContainer = $('playlist');
        const playlistToggleBtn = $('playlistToggle');
        const trackTitleEl = $('trackTitle');
        const currentTrackNumEl = $('currentTrackNum');
        const totalTracksEl = $('totalTracks');
        const currentTimeEl = $('currentTime');
        const totalTimeEl = $('totalTime');

        // === Track Data ===
        // ====================================================================
        // !! CRITICAL !!
        // REPLACE these src paths with YOUR actual audio file paths/URLs!
        // Player WILL NOT WORK without valid audio sources.
        // Using .mp3 is recommended for broad browser compatibility.
        // ====================================================================
        const tracks = [
            { src: 'track1.mp3', title: 'Liquid Dreams v2' },
            { src: 'track2.mp3', title: 'Neon Flow Remix' },
            { src: 'track3.mp3', title: 'Cosmic Wave Echo' },
            { src: 'track4.mp3', title: 'Digital Sunrise Flare' },
            { src: 'track5.mp3', title: 'Quantum Beat Shift' },
            { src: 'track6.mp3', title: 'Cyberspace Drive' },
            { src: 'track7.mp3', title: 'Neural Net Alpha' },
            { src: 'track8.mp3', title: 'Binary Echoes Lost' },
            { src: 'track9.mp3', title: 'Virtual Grid' },
            { src: 'track10.mp3', title: 'Holographic Glitch' },
            { src: 'track11.mp3', title: 'Singularity Point' },
            { src: 'track12.mp3', title: 'Electric Dreams Redux' },
            { src: 'track13.mp3', title: 'Synthwave Terminal' },
            { src: 'track14.mp3', title: 'Galactic Overdrive' },
            { src: 'track15.mp3', title: 'Cyber Dawn Protocol' },
            { src: 'track16.mp3', title: 'Ethereal Datastream' },
            { src: 'track17.mp3', title: 'Alternate Reality' },
            { src: 'track18.mp3', title: 'Astral Interface' },
            { src: 'track19.mp3', title: 'Plasma Core Breach' },
            { src: 'track20.mp3', title: 'Quantum Entanglement' }
        ];
        totalTracksEl.textContent = tracks.length || '--';

        // === State Variables ===
        let currentTrackIndex = 0;
        let currentVisualizer = 1; // 1-based index
        let visualizerAnimationId = null;
        // Removed backgroundAnimationId
        let audioContext = null;
        let analyser = null;
        let source = null;
        let dataArray = null;
        let bufferLength = 0;
        let hasAudioLoadError = false;
        // Removed WebGL Background State Variables

        // === Helper Functions ===
        const formatTime = (seconds) => {
             if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        };

        function showPlayerNotification(message, isError = false) {
             console.log(`Notification (${isError ? 'ERROR' : 'INFO'}): ${message}`);
             // Basic alert for now, replace with a nicer UI element if desired
             if (isError) {
                 // Avoid spamming alerts, maybe just update title?
                 // alert(message);
                 trackTitleEl.textContent = message;
                 trackTitleEl.style.color = 'red'; // Indicate error in title
             }
        }

        // Clamp function
        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        // Simple pseudo-random for visual variety without class instances
        function visualRand(seed) {
            let state = Math.floor(seed * 1000 + performance.now() * 0.01); // Add time variance
            state = (1103515245 * state + 12345) % 2147483648;
            return state / 2147483648;
        }

        // === Audio Setup ===
        function initAudio() {
            if (!audioContext) {
                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!window.AudioContext) throw new Error("Web Audio API not supported");
                    audioContext = new AudioContext();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512; // Lower latency, less frequency resolution
                    analyser.smoothingTimeConstant = 0.75; // Smoother transitions
                    bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);
                    console.log("AudioContext Initialized. Buffer length:", bufferLength);
                } catch (e) {
                    console.error("Error initializing AudioContext:", e);
                    showPlayerNotification("Web Audio API not supported or failed.", true);
                    audioContext = null;
                }
            }
            return audioContext !== null;
        }

        // === Track Management ===
        function loadTrack(index) {
            hasAudioLoadError = false;
            trackTitleEl.style.color = 'var(--primary)'; // Reset title color
            index = (index + tracks.length) % tracks.length;
            currentTrackIndex = index;

            if (tracks[index] && tracks[index].src) {
                 musicPlayer.src = tracks[index].src;
                 trackTitleEl.textContent = tracks[index].title;
                 currentTrackNumEl.textContent = index + 1;
                 document.querySelectorAll('.playlist-item').forEach(item => {
                     item.classList.toggle('active', parseInt(item.dataset.index) === index);
                 });
                 const activeItem = document.querySelector(`.playlist-item[data-index="${index}"]`);
                 if (activeItem && playlistContainer.classList.contains('visible')) {
                     activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                 }
                 progressBar.style.width = '0%';
                 currentTimeEl.textContent = '0:00';
                 totalTimeEl.textContent = '0:00';
                 musicPlayer.load();
                 console.log(`Loading track ${index + 1}: ${tracks[index].title} (Source: ${musicPlayer.src})`);
            } else {
                 console.error(`Invalid track data for index ${index}.`);
                 trackTitleEl.textContent = "Error: Invalid Track";
                 hasAudioLoadError = true;
            }
        }

        // === Playlist ===
        function createPlaylist() {
             playlistContainer.innerHTML = '';
             tracks.forEach((track, i) => {
                 const item = document.createElement('div');
                 item.className = 'playlist-item' + (i === currentTrackIndex ? ' active' : '');
                 item.dataset.index = i;
                 item.innerHTML = `<span>${(i + 1).toString().padStart(2, '0')}</span><span>${track.title}</span>`;
                 item.addEventListener('click', () => {
                     loadTrack(i);
                     playTrack();
                 });
                 playlistContainer.appendChild(item);
             });
        }

        // === Playback ===
        function playTrack() {
             if (!initAudio()) {
                 showPlayerNotification("Audio system failed.", true);
                 return;
             }
             if (hasAudioLoadError) {
                 showPlayerNotification(`Cannot play: Load failed for '${tracks[currentTrackIndex]?.title || 'track'}'.`, true);
                 return;
             }

             audioContext.resume().then(() => {
                 if (!source || source.mediaElement !== musicPlayer) {
                      try {
                          if (source) source.disconnect();
                          source = audioContext.createMediaElementSource(musicPlayer);
                          source.connect(analyser);
                          analyser.connect(audioContext.destination);
                          console.log("Audio source connected.");
                      } catch (e) {
                           console.error("Error connecting audio source:", e);
                           showPlayerNotification("Error setting up audio node.", true);
                           hasAudioLoadError = true;
                           pauseTrack();
                           return;
                      }
                 }

                 musicPlayer.play()
                     .then(() => {
                         playPauseBtn.textContent = 'Pause';
                         hasAudioLoadError = false;
                         if (!visualizerAnimationId) renderVisualizer(); // Start visualizer loop
                         // No background shader loop to start
                     })
                     .catch(error => {
                         console.error("Error during musicPlayer.play():", error);
                         showPlayerNotification(`Playback error: ${error.message}`, true);
                         hasAudioLoadError = true;
                         pauseTrack();
                     });
             }).catch(resumeError => {
                  console.error("AudioContext resume failed:", resumeError);
                  showPlayerNotification("Audio playback failed (context resume).", true);
             });
         }

        function pauseTrack() {
            musicPlayer.pause();
            playPauseBtn.textContent = 'Play';
            // Optionally stop visualizer on pause
             if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
             }
        }

        // === Progress & Time ===
        function updateProgress() {
             if (!musicPlayer.duration || !isFinite(musicPlayer.duration) || hasAudioLoadError) return;
             const progressPercent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
             progressBar.style.width = `${progressPercent}%`;
             currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
             if (totalTimeEl.textContent === '0:00' && musicPlayer.duration > 0) {
                 totalTimeEl.textContent = formatTime(musicPlayer.duration);
             }
        }

        function seek(event) {
             if (!musicPlayer.duration || !isFinite(musicPlayer.duration) || hasAudioLoadError) return;
             const containerWidth = progressContainer.offsetWidth;
             if (containerWidth > 0) {
                 const clickX = event.offsetX;
                 const seekTime = (clickX / containerWidth) * musicPlayer.duration;
                 // Limit seekTime to valid range
                 musicPlayer.currentTime = clamp(seekTime, 0, musicPlayer.duration);
                 updateProgress();
             }
         }

        // === ENHANCED 2D Canvas Visualizer Functions ===

        // Helper: Get average amplitude for a frequency range
        function getAverageAmplitude(dataArray, start, end) {
            let sum = 0;
            start = Math.max(0, Math.floor(start));
            end = Math.min(bufferLength, Math.ceil(end));
            if (start >= end || !dataArray) return 0; // Added check for dataArray
            for (let i = start; i < end; i++) {
                sum += dataArray[i];
            }
            return sum / (end - start) / 255.0; // Normalize [0, 1]
        }

        /* 1. Enhanced Bars: "Liquid Metal" Bars with Energy Sparks & Glitch */
        function drawEnhancedBars() {
            const barWidth = Math.max(2, (visualizerCanvas.width / bufferLength) * 1.5);
            const t = performance.now() * 0.001;
            const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1) * 1.2;

            for (let i = 0; i < bufferLength; i++) {
                const amplitude = dataArray[i] / 255.0;
                const barHeight = Math.max(1, amplitude * visualizerCanvas.height * (0.8 + bass * 0.2));
                const x = i * (barWidth + 1); // Add 1px spacing

                const topY = visualizerCanvas.height - barHeight;
                const liquidOffset = Math.sin(t * 5 + i * 0.3) * amplitude * 10;
                const controlPointY = topY - amplitude * 30 * Math.cos(t * 3 + i * 0.2);

                const hue = (i / bufferLength) * 180 + 240 + Math.sin(t * 0.5) * 30;
                const gradient = vizCtx.createLinearGradient(x, visualizerCanvas.height, x, topY);
                gradient.addColorStop(0, `hsla(${hue % 360}, 100%, 30%, 0.8)`);
                gradient.addColorStop(0.5, `hsla(${(hue + 20) % 360}, 95%, 55%, 0.9)`);
                gradient.addColorStop(1, `hsla(${(hue + 50) % 360}, 90%, 75%, 1.0)`);

                vizCtx.save();
                vizCtx.fillStyle = gradient;
                vizCtx.shadowColor = `hsla(${(hue + 50) % 360}, 100%, 70%, 0.7)`;
                vizCtx.shadowBlur = clamp(10 * amplitude + 5 * bass, 0, 25);

                vizCtx.beginPath();
                vizCtx.moveTo(x, visualizerCanvas.height);
                vizCtx.lineTo(x, topY + liquidOffset);
                vizCtx.bezierCurveTo(
                    x + barWidth * 0.3, controlPointY,
                    x + barWidth * 0.7, controlPointY,
                    x + barWidth, topY - liquidOffset
                );
                vizCtx.lineTo(x + barWidth, visualizerCanvas.height);
                vizCtx.closePath();
                vizCtx.fill();
                vizCtx.restore();

                if (amplitude > 0.8 && Math.random() < 0.1) {
                    const sparkX = x + barWidth * 0.5;
                    const sparkY = topY;
                    const sparkCount = Math.floor(1 + Math.random() * 3);
                    for (let j = 0; j < sparkCount; j++) {
                         vizCtx.fillStyle = `hsla(${hue + Math.random() * 60 - 30}, 100%, 85%, ${0.5 + Math.random() * 0.5})`;
                         vizCtx.fillRect(
                             sparkX + (Math.random() - 0.5) * 10,
                             sparkY - Math.random() * 15,
                             1 + Math.random(), 1 + Math.random() * 2
                         );
                    }
                }

                if (Math.random() < 0.01 + bass * 0.05) {
                    const glitchHeight = 5 + Math.random() * 15;
                    const glitchY = Math.random() * (visualizerCanvas.height - glitchHeight);
                    const glitchOffset = (Math.random() - 0.5) * 10;
                    try {
                        const imageData = vizCtx.getImageData(clamp(x + glitchOffset, 0, visualizerCanvas.width-barWidth), clamp(glitchY, 0, visualizerCanvas.height-glitchHeight), Math.max(1,barWidth), Math.max(1,glitchHeight));
                        if (imageData) vizCtx.putImageData(imageData, clamp(x - glitchOffset, 0, visualizerCanvas.width-barWidth), clamp(glitchY, 0, visualizerCanvas.height-glitchHeight));
                    } catch(e) { /* Ignore */ }
                }
            }
        }

        /* 2. Enhanced Circles: "Orbital Decay" with Trails and Connections */
        function drawEnhancedCircles() {
            const t = performance.now() * 0.0005;
            const centerX = visualizerCanvas.width / 2;
            const centerY = visualizerCanvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) * 0.9;
            const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
            const mid = getAverageAmplitude(dataArray, bufferLength * 0.3, bufferLength * 0.6);

            vizCtx.save();
            vizCtx.translate(centerX, centerY);
            vizCtx.rotate(t * 0.1 + bass * 0.5);
            vizCtx.translate(-centerX, -centerY);

            if (!window.circleParticles_Enh) window.circleParticles_Enh = [];
            const currentParticles = [];

            for (let i = 0; i < bufferLength; i += 3) {
                const amplitude = dataArray[i] / 255.0;
                if (amplitude < 0.05) continue; // Increased threshold

                const angle = (i / bufferLength) * Math.PI * 4 + t * 0.5;
                const baseRadius = amplitude * maxRadius * (0.5 + mid * 0.5);
                const pulsate = 1 + 0.15 * Math.sin(t * 10 + i * 0.1);
                const orbitRadius = Math.max(10, baseRadius * pulsate);
                const particleSize = clamp(1.0 + amplitude * 5.0, 1.0, 8.0); // Clamped size

                const x = centerX + Math.cos(angle) * orbitRadius;
                const y = centerY + Math.sin(angle) * orbitRadius;

                currentParticles.push({ x, y, size: particleSize, intensity: amplitude, id: i });

                const hue = (i * 360 / bufferLength + 180 + t * 30) % 360;
                const gradient = vizCtx.createRadialGradient(x, y, 0, x, y, particleSize * 1.5);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 80%, 0.95)`);
                gradient.addColorStop(0.5, `hsla(${(hue + 30) % 360}, 90%, 60%, 0.5)`);
                gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 80%, 50%, 0)`);

                vizCtx.fillStyle = gradient;
                vizCtx.beginPath();
                vizCtx.arc(x, y, particleSize, 0, Math.PI * 2);
                vizCtx.fill();
            }

             window.circleParticles_Enh.push(currentParticles);
             if (window.circleParticles_Enh.length > 12) { // Shorter trails
                 window.circleParticles_Enh.shift();
             }

             vizCtx.globalCompositeOperation = 'lighter';
             for (let frame = 0; frame < window.circleParticles_Enh.length - 1; frame++) {
                 const alpha = (frame / window.circleParticles_Enh.length) * 0.25; // Dimmer trails
                 const frameParticles = window.circleParticles_Enh[frame];
                 for (const p of frameParticles) {
                     const trailSize = p.size * (frame / window.circleParticles_Enh.length);
                     if (trailSize < 0.5) continue;
                     const hue = (p.id * 360 / bufferLength + 180 + t * 30) % 360;
                     vizCtx.fillStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
                     vizCtx.beginPath();
                     vizCtx.arc(p.x, p.y, trailSize, 0, Math.PI * 2);
                     vizCtx.fill();
                 }
             }
             vizCtx.globalCompositeOperation = 'source-over';

             const connectDistance = visualizerCanvas.width * 0.12 * (1 + mid); // Slightly shorter connect distance
             vizCtx.strokeStyle = `rgba(200, 220, 255, 0.08)`; // Dimmer connection
             vizCtx.lineWidth = 0.5;
             for (let i = 0; i < currentParticles.length; i++) {
                 for (let j = i + 1; j < currentParticles.length; j++) {
                     const p1 = currentParticles[i];
                     const p2 = currentParticles[j];
                     const dx = p1.x - p2.x;
                     const dy = p1.y - p2.y;
                     const distSq = dx * dx + dy * dy; // Use squared distance
                     if (distSq < connectDistance * connectDistance) {
                         vizCtx.globalAlpha = (1.0 - Math.sqrt(distSq) / connectDistance) * 0.4 * (p1.intensity + p2.intensity);
                         vizCtx.beginPath();
                         vizCtx.moveTo(p1.x, p1.y);
                         vizCtx.lineTo(p2.x, p2.y);
                         vizCtx.stroke();
                     }
                 }
             }
             vizCtx.globalAlpha = 1.0;

            vizCtx.restore();
        }


        /* 3. Enhanced Wave: "Plasma Conduit" with Layered Waves and Particles */
        function drawEnhancedWave() {
            const t = performance.now() * 0.001; // Consistent time
            const sliceWidth = visualizerCanvas.width / (bufferLength - 1);
            const midY = visualizerCanvas.height / 2;

            // Layer 1: Bass Wave (Thick, slow, glow)
            const bassAvg = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);
            vizCtx.save();
            vizCtx.lineWidth = clamp(4 + bassAvg * 12, 2, 10); // Clamped thickness
            const bassHue = 190 + Math.sin(t * 0.5) * 20; // Subtle hue shift
            vizCtx.strokeStyle = `hsla(${bassHue}, 100%, 60%, ${clamp(0.3 + bassAvg * 0.6, 0.2, 0.7)})`;
            vizCtx.shadowColor = `hsla(${bassHue}, 100%, 70%, 0.8)`;
            vizCtx.shadowBlur = clamp(20 * bassAvg, 5, 25);
            vizCtx.beginPath();
            let lastX = 0, lastY = midY;
            vizCtx.moveTo(0, midY);
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 255.0;
                const x = i * sliceWidth;
                const y = midY + (v - 0.5) * visualizerCanvas.height * 0.4 * Math.sin(i * 0.02 + t * 1.5);
                 // Smooth curve using quadratic Bézier
                 const xc = (lastX + x) / 2;
                 const yc = (lastY + y) / 2;
                 vizCtx.quadraticCurveTo(lastX, lastY, xc, yc);
                 lastX = x; lastY = y;
            }
             vizCtx.lineTo(visualizerCanvas.width, midY); // End smoothly
            vizCtx.stroke();
            vizCtx.restore();

            // Layer 2: Mid Freq Wave (Thinner, faster, primary color)
            const midAvg = getAverageAmplitude(dataArray, bufferLength * 0.2, bufferLength * 0.7);
            vizCtx.lineWidth = clamp(1.5 + midAvg * 3, 1, 4);
            const midHue = 37 + Math.cos(t * 1.2) * 15; // Orange hue shift
            vizCtx.strokeStyle = `hsla(${midHue}, 100%, 55%, ${clamp(0.5 + midAvg * 0.4, 0.4, 0.9)})`;
            vizCtx.beginPath();
            lastX = 0; lastY = midY;
            vizCtx.moveTo(0, midY);
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 255.0;
                const x = i * sliceWidth;
                const y = midY + (v - 0.5) * visualizerCanvas.height * 0.6 * Math.sin(i * 0.04 + t * 3);
                 const xc = (lastX + x) / 2;
                 const yc = (lastY + y) / 2;
                 vizCtx.quadraticCurveTo(lastX, lastY, xc, yc);
                 lastX = x; lastY = y;
            }
             vizCtx.lineTo(visualizerCanvas.width, midY);
            vizCtx.stroke();

            // Layer 3: High Freq Particles/Sparks (Improved look)
            vizCtx.save();
            vizCtx.shadowColor = '#FFF';
            vizCtx.shadowBlur = 6;
            for (let i = Math.floor(bufferLength * 0.6); i < bufferLength; i++) {
                const v = dataArray[i] / 255.0;
                if (v > 0.75 && Math.random() < 0.15) { // More sparks on louder highs
                    const x = i * sliceWidth;
                    const yMidWave = midY + (v - 0.5) * visualizerCanvas.height * 0.6 * Math.sin(i * 0.04 + t * 3); // Position near mid wave
                    const sparkSize = 0.5 + Math.random() * 1.5;
                    const sparkHue = 60 + Math.random() * 60; // Yellow/Green sparks
                    vizCtx.fillStyle = `hsla(${sparkHue}, 100%, 80%, ${0.6 + Math.random() * 0.4})`;
                    vizCtx.beginPath();
                    vizCtx.arc(x, yMidWave + (Math.random() - 0.5) * 25, sparkSize, 0, Math.PI * 2);
                    vizCtx.fill();
                }
            }
            vizCtx.restore();
        }


        /* 4. Enhanced Nebula: "Living Constellation" with Physics Particles */
        function drawEnhancedNebula() {
            const t = performance.now() * 0.0005; // Slower time
            const centerX = visualizerCanvas.width / 2;
            const centerY = visualizerCanvas.height / 2;
            const particleCount = 70; // Adjusted count

            // Initialize particles if needed
            if (!window.nebulaParticles_Enh || window.nebulaParticles_Enh.length !== particleCount) {
                window.nebulaParticles_Enh = [];
                for (let i = 0; i < particleCount; i++) {
                    window.nebulaParticles_Enh.push({
                        x: centerX + (Math.random() - 0.5) * visualizerCanvas.width * 0.9, // Start more spread out
                        y: centerY + (Math.random() - 0.5) * visualizerCanvas.height * 0.9,
                        vx: (Math.random() - 0.5) * 0.5, // Initial velocity
                        vy: (Math.random() - 0.5) * 0.5,
                        seed: Math.random() * 100,
                        hue: Math.random() * 60 + 180, // Blue/Cyan/Purple range initially
                        life: 0.5 + Math.random() * 0.5 // Random start life
                    });
                }
            }

            vizCtx.globalCompositeOperation = 'lighter';
            const overallIntensity = getAverageAmplitude(dataArray, 0, bufferLength);
            const bass = getAverageAmplitude(dataArray, 0, bufferLength * 0.1);

            window.nebulaParticles_Enh.forEach((p, i) => {
                // --- Physics Update ---
                const dx = centerX - p.x;
                const dy = centerY - p.y;
                const distSq = dx * dx + dy * dy;
                const gravityForce = 30 / Math.max(100, distSq); // Adjusted gravity
                p.vx += dx * gravityForce * 0.015;
                p.vy += dy * gravityForce * 0.015;

                const swirlAngle = t * 1.8 + p.seed * 2.0; // Faster swirl
                const swirlStrength = 0.04 + bass * 0.03; // Swirl strength reacts to bass
                p.vx += Math.cos(swirlAngle) * swirlStrength;
                p.vy += Math.sin(swirlAngle) * swirlStrength;

                const impulseStrength = bass * bass * 1.8; // Stronger impulse
                if (impulseStrength > 0.15) {
                     const impulseAngle = Math.atan2(dy, dx);
                     p.vx -= Math.cos(impulseAngle) * impulseStrength * 0.15;
                     p.vy -= Math.sin(impulseAngle) * impulseStrength * 0.15;
                }

                p.vx *= 0.95; // Stronger damping
                p.vy *= 0.95;
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.0015; // Slower fade

                if (p.life <= 0 || Math.abs(dx) > centerX * 1.5 || Math.abs(dy) > centerY * 1.5) { // Reset further out
                    p.x = centerX + (Math.random() - 0.5) * 80;
                    p.y = centerY + (Math.random() - 0.5) * 80;
                    p.vx = (Math.random() - 0.5) * 0.6;
                    p.vy = (Math.random() - 0.5) * 0.6;
                    p.life = 1.0;
                    p.hue = Math.random() * 60 + 180; // Reset hue in range
                }

                // --- Drawing ---
                const dataIndex = Math.min(bufferLength - 1, Math.floor((i / particleCount) * bufferLength));
                const amplitude = dataArray[dataIndex] / 255.0;
                const particleSize = clamp((1.0 + amplitude * 12 + bass * 6) * p.life, 0.5, 15.0); // Adjusted size reactivity
                if (particleSize < 0.5) return;

                const alpha = clamp(amplitude * 0.4 + p.life * 0.5, 0.1, 0.8); // Adjusted alpha
                const currentHue = (p.hue + t * 20 + amplitude * 30) % 360; // Hue shifts with time and amplitude

                try {
                    const gradient = vizCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, particleSize);
                    gradient.addColorStop(0, `hsla(${currentHue}, 95%, 85%, ${alpha})`);
                    gradient.addColorStop(0.3, `hsla(${(currentHue + 30) % 360}, 85%, 70%, ${alpha * 0.7})`);
                    gradient.addColorStop(1, `hsla(${(currentHue + 60) % 360}, 75%, 50%, 0)`);
                    vizCtx.fillStyle = gradient;
                    vizCtx.beginPath();
                    vizCtx.arc(p.x, p.y, particleSize, 0, Math.PI * 2);
                    vizCtx.fill();
                } catch (e) { /* Ignore gradient errors */ }
            });

            vizCtx.globalCompositeOperation = 'source-over';
        }


        /* 5. Enhanced Spectrum: "Data Stream" with Perspective & Peaks */
        function drawEnhancedSpectrum() {
            const t = performance.now() * 0.001;
            const perspectiveFactor = 0.5; // Less extreme perspective
            const floorY = visualizerCanvas.height * 0.98; // Closer to bottom
            const ceilingY = visualizerCanvas.height * 0.05; // Top margin

            if (!window.spectrumPeaks_Enh) window.spectrumPeaks_Enh = new Array(bufferLength).fill(0);
            const peakFalloff = 0.985; // Slower falloff

            for (let i = 0; i < bufferLength; i++) {
                const amplitude = dataArray[i] / 255.0;
                // Smooth amplitude slightly over time
                const smoothAmplitude = window.spectrumPeaks_Enh[i] * 0.2 + amplitude * 0.8; // Simple smoothing
                const barHeightRaw = smoothAmplitude * (floorY - ceilingY); // Height relative to floor/ceiling

                window.spectrumPeaks_Enh[i] = Math.max(window.spectrumPeaks_Enh[i] * peakFalloff, barHeightRaw);
                const peakHeight = window.spectrumPeaks_Enh[i];

                const perspectiveX = (i / (bufferLength - 1)) * 2.0 - 1.0;
                const perspectiveScale = 1.0 - perspectiveFactor * Math.abs(perspectiveX);
                const barWidth = Math.max(1, (visualizerCanvas.width / bufferLength) * 1.8 * perspectiveScale); // Wider base bars
                const x = visualizerCanvas.width * 0.5 + perspectiveX * (visualizerCanvas.width * 0.5 * (1.0 - perspectiveFactor * 0.4)) - barWidth * 0.5; // Adjusted perspective spacing

                // --- Main Bar ---
                const barHeight = clamp(barHeightRaw * perspectiveScale, 1, floorY - ceilingY); // Clamp height
                const hue = 120 + (1.0 - smoothAmplitude) * 180 + Math.sin(t + i * 0.1) * 15; // Color shifts from green (low) to magenta (high) + time shift

                const gradient = vizCtx.createLinearGradient(x, floorY, x, floorY - barHeight);
                gradient.addColorStop(0, `hsla(${hue}, 85%, 50%, 0.7)`);
                gradient.addColorStop(0.8, `hsla(${(hue + 40) % 360}, 95%, 65%, 0.8)`);
                gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 80%, 0.9)`); // Bright top edge

                vizCtx.fillStyle = gradient;
                vizCtx.fillRect(x, floorY - barHeight, barWidth, barHeight);

                // --- Peak Line ---
                if (peakHeight > barHeight + 1) {
                     const peakY = floorY - clamp(peakHeight * perspectiveScale, 1, floorY - ceilingY);
                     vizCtx.fillStyle = `hsla(${(hue + 80) % 360}, 100%, 90%, 0.9)`; // Very bright peak
                     vizCtx.fillRect(x, peakY - 1, barWidth, 2);
                }

                 // --- Subtle Underglow ---
                 const underGlowHeight = barHeight * 0.2;
                 const underGlowGradient = vizCtx.createLinearGradient(x, floorY, x, floorY + underGlowHeight);
                 underGlowGradient.addColorStop(0, `hsla(${hue}, 85%, 50%, 0.3)`);
                 underGlowGradient.addColorStop(1, `hsla(${hue}, 85%, 50%, 0.0)`);
                 vizCtx.fillStyle = underGlowGradient;
                 vizCtx.fillRect(x, floorY, barWidth, underGlowHeight);


                 // --- Data Glitch Blocks (more subtle) ---
                 if (amplitude > 0.85 && Math.random() < 0.03) {
                     vizCtx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.2})`;
                     const glitchHeight = Math.random() * barHeight * 0.1 + 1;
                     const glitchY = floorY - barHeight + Math.random() * (barHeight - glitchHeight);
                     vizCtx.fillRect(x, glitchY, barWidth, glitchHeight);
                 }
            }
        }

        // === Visualizer Render Loop === (Identical to previous version, calls enhanced functions)
        function renderVisualizer() {
            if (!audioContext || !dataArray || !analyser || !visualizerCanvas) {
                visualizerAnimationId = requestAnimationFrame(renderVisualizer); return;
            }
            visualizerAnimationId = requestAnimationFrame(renderVisualizer);
            analyser.getByteFrequencyData(dataArray);

            const fadeAlpha = 0.25; // Keep the fade effect
            vizCtx.fillStyle = `rgba(10, 11, 12, ${fadeAlpha})`;
            vizCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            vizCtx.globalCompositeOperation = 'source-over';
            vizCtx.globalAlpha = 1.0;

            const visualizers = [ drawEnhancedBars, drawEnhancedCircles, drawEnhancedWave, drawEnhancedNebula, drawEnhancedSpectrum ];
            const index = (currentVisualizer - 1);
            if (index >= 0 && index < visualizers.length) {
                 try { visualizers[index](); } catch (e) { console.error(`Error rendering visualizer ${currentVisualizer}:`, e); }
            } else {
                try { drawEnhancedBars(); } catch(e) { console.error("Error rendering fallback viz:", e); }
            }
        }

        // === Visualizer Button Handling ===
        function updateVisualizerButtons() {
            document.querySelectorAll('.visualizer-controls button').forEach(btn => {
                 const vizIndex = parseInt(btn.dataset.viz);
                 btn.classList.toggle('active', vizIndex === currentVisualizer);
             });
         }

        // === Resize Handling === (Only Visualizer Canvas needed now)
        function handleResize() {
            if (visualizerCanvas && visualizerCanvas.parentElement) {
                 const containerWidth = visualizerCanvas.parentElement.offsetWidth;
                 visualizerCanvas.width = containerWidth;
                 visualizerCanvas.height = 180; // Keep fixed height
                 console.log("Resized visualizer canvas to:", visualizerCanvas.width, "x", visualizerCanvas.height);
            }
            // No background canvas resize needed
        }

        // === Audio Error Handling ===
         function handleAudioError(e) {
             console.error("Audio Element Error:", e);
             const trackInfo = tracks[currentTrackIndex];
             let errorMsg = `Error loading: ${trackInfo?.title || 'track'}.`;
             if (musicPlayer.error) {
                 switch (musicPlayer.error.code) {
                     case MediaError.MEDIA_ERR_NETWORK: errorMsg += ' Network error.'; break;
                     case MediaError.MEDIA_ERR_DECODE: errorMsg += ' Decode error.'; break;
                     case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED: errorMsg += ' Format not supported or file not found (404).'; break; // Combine 404 here
                     default: errorMsg += ' Unknown media error.';
                 }
             } else { errorMsg += ' Check file path/URL.' }
             showPlayerNotification(errorMsg, true);
             hasAudioLoadError = true;
             pauseTrack();
         }


        // === Event Listeners (Setup remains largely the same) ===
        playPauseBtn.addEventListener('click', () => {
             if (!audioContext) initAudio();
             if (!audioContext) return;
             if (musicPlayer.paused) { playTrack(); } else { pauseTrack(); }
         });
        $('prevTrack').addEventListener('click', () => { loadTrack(currentTrackIndex - 1); playTrack(); });
        $('nextTrack').addEventListener('click', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
        musicPlayer.addEventListener('ended', () => { loadTrack(currentTrackIndex + 1); playTrack(); });
        musicPlayer.addEventListener('timeupdate', updateProgress);
        musicPlayer.addEventListener('loadedmetadata', () => {
             if (musicPlayer.duration && isFinite(musicPlayer.duration)) {
                 totalTimeEl.textContent = formatTime(musicPlayer.duration);
                 updateProgress();
             }
        });
         musicPlayer.addEventListener('error', handleAudioError);
        progressContainer.addEventListener('click', seek);

        playlistToggleBtn.addEventListener('click', () => {
            playlistContainer.classList.toggle('visible');
            const isVisible = playlistContainer.classList.contains('visible');
            playlistToggleBtn.textContent = isVisible ? 'Hide Playlist' : 'Show Playlist';
             if (isVisible) {
                 const activeItem = document.querySelector(`.playlist-item.active`);
                 if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
             }
        });

        document.querySelectorAll('.visualizer-controls button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const vizIndex = parseInt(e.target.dataset.viz);
                 if (!isNaN(vizIndex)) {
                     currentVisualizer = vizIndex;
                     updateVisualizerButtons();
                     console.log("Switched to visualizer:", currentVisualizer);
                 }
            });
        });

        window.addEventListener('resize', handleResize);

        // === Initialization ===
        document.addEventListener('DOMContentLoaded', () => {
             createPlaylist();
             loadTrack(currentTrackIndex);
             updateVisualizerButtons();
             handleResize(); // Initial visualizer canvas size
             // No background shader init needed
             console.log("Neuromantic Player Initialized (Enhanced 2D Viz).");
        });

    </script>
