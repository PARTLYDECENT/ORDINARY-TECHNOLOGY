<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuromantic Cryo-Signal X26 (Audio Mod)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --primary-accent: #00ffc3;  /* Vibrant Mint/Teal */
            --secondary-accent: #00bcd4; /* Luminous Cyan */
            --tertiary-accent: #7c4dff;  /* Energetic Purple */

            --bg-deep-space: #020305;
            --bg-interface: #0a0c10;
            --text-color: #e0f0f8;
            --text-muted: #9cb0c0;

            --glass-ink-bg: rgba(10, 12, 16, 0.82); /* Slightly more opaque */
            --glass-ink-border: rgba(0, 255, 195, 0.25);
            --glass-ink-shadow: 0 0 25px rgba(0, 255, 195, 0.1);

            --glow-primary: 0 0 8px var(--primary-accent), 0 0 16px var(--primary-accent), 0 0 24px rgba(0, 255, 195, 0.4);
            --glow-secondary: 0 0 8px var(--secondary-accent), 0 0 16px var(--secondary-accent), 0 0 24px rgba(0, 188, 212, 0.4);
            --glow-tertiary: 0 0 10px var(--tertiary-accent), 0 0 20px var(--tertiary-accent), 0 0 30px rgba(124, 77, 255, 0.3);

            --radius-main: 20px;
            --radius-small: 10px;
            --transition-main: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-fast: 0.2s ease-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep-space); color: var(--text-color); font-family: 'Space Mono', monospace;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 1rem; overflow: hidden; position: relative;
        }

        body::before { /* Grain unchanged */
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.025; animation: grain 7s steps(10) infinite; z-index: -2;
        }
        @keyframes grain {0%,100%{transform:translate(0,0)}10%{transform:translate(-1%,-1%)}20%{transform:translate(1%,-2%)}30%{transform:translate(-2%,1%)}40%{transform:translate(2%,2%)}50%{transform:translate(-1%,2%)}60%{transform:translate(1%,-1%)}70%{transform:translate(-2%,-2%)}80%{transform:translate(2%,1%)}90%{transform:translate(-1%,1%)}}

        #background-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.75; }

        header { font-size: 2rem; font-weight: 700; margin-bottom: 2.5rem; position: relative; text-transform: uppercase; color: var(--primary-accent); z-index: 1; letter-spacing: 1px; text-shadow: var(--glow-primary); animation: headerPulse 5s infinite alternate ease-in-out; }
        @keyframes headerPulse {0%{text-shadow:0 0 8px var(--primary-accent),0 0 16px rgba(0,255,195,0.3);opacity:.9}100%{text-shadow:var(--glow-primary),0 0 40px rgba(0,255,195,0.2);opacity:1}}
        header::after { content:'PLAYER X26'; position:absolute; left:0; top:0; color:var(--secondary-accent); clip-path:polygon(0 0,100% 0,100% 50%,0 50%); text-shadow:var(--glow-secondary); filter:blur(.5px); }

        .player-container {
            width: 95%; max-width: 700px; border-radius: var(--radius-main); position: relative; z-index: 1;
            overflow: hidden; background: var(--glass-ink-bg); backdrop-filter: blur(16px) saturate(110%);
            -webkit-backdrop-filter: blur(16px) saturate(110%); border: 1px solid var(--glass-ink-border);
            box-shadow: var(--glass-ink-shadow), 0 15px 50px rgba(0,0,0,0.5);
            display: grid;
            grid-template-areas:
                "visualizer visualizer"
                "info info"
                "progress progress"
                "time time"
                "controls controls"
                "filter-modulator filter-modulator"
                "viz-controls viz-controls"
                "playlist-toggle playlist-toggle"
                "playlist playlist";
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            animation: float 8s ease-in-out infinite alternate;
        }
        @keyframes float {0%{transform:translateY(0px) rotate(-.2deg)}50%{transform:translateY(-5px) rotate(.2deg)}100%{transform:translateY(0px) rotate(-.2deg)}}

        .player-container::before { /* Animated Border */
            content:'';position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;width:calc(100% + 2px);height:calc(100% + 2px);
            border-radius:var(--radius-main);padding:2px;background:linear-gradient(135deg,var(--primary-accent),var(--secondary-accent),var(--tertiary-accent),var(--primary-accent));
            background-size:400% 400%;animation:borderFlowEnergetic 6s linear infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;z-index:-1;
        }
        @keyframes borderFlowEnergetic {0%{background-position:0% 50%;filter:hue-rotate(0deg) brightness(1.0)}50%{background-position:100% 50%;filter:hue-rotate(45deg) brightness(1.2)}100%{background-position:0% 50%;filter:hue-rotate(0deg) brightness(1.0)}}

        /* Grid Area Assignments */
        .visualizer-canvas-container { grid-area: visualizer; }
        .track-info-wrapper { grid-area: info; }
        .progress-container { grid-area: progress; }
        .time-display { grid-area: time; }
        .controls { grid-area: controls; }
        .filter-modulator { grid-area: filter-modulator; }
        .visualizer-controls { grid-area: viz-controls; }
        .playlist-toggle { grid-area: playlist-toggle; }
        .playlist-container { grid-area: playlist; }

        .visualizer-canvas-container { height:180px;position:relative;overflow:hidden;border-bottom:1px solid var(--glass-ink-border);background:radial-gradient(ellipse at center,rgba(10,12,16,0.1) 0%,transparent 70%); }
        #visualizer { width:100%;height:100%;display:block;opacity:.9; }
        .track-info-wrapper { padding:1rem 1.5rem;border-bottom:1px solid var(--glass-ink-border);display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:60px; }
        .track-title { font-weight:700;font-size:1.1rem;color:var(--primary-accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 5px var(--primary-accent);flex-grow:1; }
        .track-number { color:var(--secondary-accent);font-size:.9rem;text-shadow:0 0 3px var(--secondary-accent); }
        .progress-container { height:8px;background:rgba(255,255,255,0.05);cursor:pointer;overflow:hidden;margin:.5rem 1.5rem;border-radius:var(--radius-small);position:relative; }
        .progress-bar { height:100%;background:linear-gradient(90deg,var(--primary-accent),var(--secondary-accent));width:0%;transition:width .1s linear;border-radius:var(--radius-small);box-shadow:0 0 8px var(--secondary-accent);animation:progressBarPulse 2s infinite alternate; }
        @keyframes progressBarPulse { from{filter:brightness(.9) saturate(.9);box-shadow:0 0 6px var(--secondary-accent)} to{filter:brightness(1.1) saturate(1.1);box-shadow:0 0 12px var(--secondary-accent)} }
        .time-display { display:flex;justify-content:space-between;padding:.5rem 1.5rem .75rem;font-size:.8rem;color:var(--text-muted);font-weight:700; }
        .controls { display:grid;grid-template-columns:repeat(3,1fr);padding:.75rem 1.5rem;border-top:1px solid var(--glass-ink-border);border-bottom:1px solid var(--glass-ink-border); }
        .controls button { background:transparent;border:none;color:var(--text-color);font-family:inherit;padding:.85rem .5rem;cursor:pointer;text-transform:uppercase;font-weight:700;font-size:.9rem;transition:var(--transition-main);text-shadow:0 0 3px rgba(224,240,248,0.3);position:relative; }
        .controls button::after { content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:0;height:2px;background-color:var(--primary-accent);transition:width var(--transition-fast); }
        .controls button:hover, .controls button:focus-visible { color:var(--primary-accent);transform:translateY(-3px);text-shadow:var(--glow-primary); }
        .controls button:hover::after, .controls button:focus-visible::after { width:60%; }
        .controls button:active { transform:translateY(0px) scale(.98);color:var(--secondary-accent); }

        /* --- Filter Modulator Styles --- */
        .filter-modulator {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-ink-border);
            background: rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        .filter-modulator-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: -0.25rem;
            text-align: center;
        }
        .filter-type-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 0.5rem;
        }
        .filter-type-selector button {
            background: transparent;
            border: 1px solid var(--glass-ink-border);
            color: var(--text-muted);
            font-family: inherit; font-size: 0.65rem; font-weight: 700;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-small);
            cursor: pointer;
            transition: var(--transition-fast);
            min-width: 40px;
        }
        .filter-type-selector button.active {
            background-color: var(--tertiary-accent);
            border-color: var(--tertiary-accent);
            color: var(--bg-interface);
            box-shadow: var(--glow-tertiary);
            transform: scale(1.05);
        }
        .filter-type-selector button:hover:not(.active),
        .filter-type-selector button:focus-visible:not(.active) {
            border-color: var(--tertiary-accent);
            color: var(--tertiary-accent);
            background-color: rgba(124, 77, 255, 0.1);
        }
        .filter-slider-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .filter-slider-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            width: 70px;
            text-align: right;
            white-space: nowrap;
        }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; cursor: pointer; background: transparent; }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; }
        input[type="range"]::-moz-range-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; margin-top: -4px; width: 14px; height: 14px; background: var(--tertiary-accent); border: 2px solid var(--bg-interface); border-radius: 50%; box-shadow: 0 0 6px var(--tertiary-accent); transition: background-color var(--transition-fast), box-shadow var(--transition-fast); }
        input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: var(--tertiary-accent); border: 2px solid var(--bg-interface); border-radius: 50%; box-shadow: 0 0 6px var(--tertiary-accent); transition: background-color var(--transition-fast), box-shadow var(--transition-fast); }
        input[type="range"]:hover::-webkit-slider-thumb,
        input[type="range"]:focus-visible::-webkit-slider-thumb { background: var(--primary-accent); box-shadow: 0 0 8px var(--primary-accent); }
        input[type="range"]:hover::-moz-range-thumb,
        input[type="range"]:focus-visible::-moz-range-thumb { background: var(--primary-accent); box-shadow: 0 0 8px var(--primary-accent); }

        .filter-value-display {
            font-size: 0.7rem;
            color: var(--secondary-accent);
            min-width: 40px;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .visualizer-controls { display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:1rem 1.5rem;background:rgba(0,0,0,0.25);border-bottom:1px solid var(--glass-ink-border);min-height:60px; }
        .visualizer-controls button { background:transparent;border:1px solid var(--glass-ink-border);color:var(--text-muted);font-family:inherit;font-size:.6rem;width:28px;height:28px;border-radius:50%;cursor:pointer;transition:var(--transition-main);display:flex;align-items:center;justify-content:center;text-shadow:none;box-shadow:inset 0 0 5px rgba(0,0,0,0.3); }
        .visualizer-controls button.active { color:var(--bg-interface);font-weight:bold;background-color:var(--secondary-accent);border-color:var(--secondary-accent);box-shadow:var(--glow-secondary),inset 0 0 5px rgba(0,0,0,0.3);transform:scale(1.15); }
        .visualizer-controls button:hover:not(.active), .visualizer-controls button:focus-visible:not(.active) { color:var(--primary-accent);border-color:var(--primary-accent);background-color:rgba(0,255,195,0.1);transform:scale(1.1);box-shadow:0 0 8px var(--primary-accent); }

        .playlist-toggle { width:100%;background:transparent;border:none;padding:1rem;color:var(--text-color);font-family:inherit;cursor:pointer;text-transform:uppercase;font-weight:700;transition:var(--transition-fast);letter-spacing:1px;border-top:1px solid var(--glass-ink-border); }
        .playlist-toggle:hover, .playlist-toggle:focus-visible { background-color:rgba(124,77,255,0.1);color:var(--tertiary-accent);text-shadow:0 0 5px var(--tertiary-accent); }

        .playlist-container { max-height:180px;overflow-y:auto;background:rgba(0,0,0,0.15);border-top:1px solid var(--glass-ink-border); }
        .playlist-container::-webkit-scrollbar { width:8px; } .playlist-container::-webkit-scrollbar-track { background:rgba(0,0,0,0.3);border-radius:4px; } .playlist-container::-webkit-scrollbar-thumb { background-color:var(--tertiary-accent);border-radius:4px;border:2px solid rgba(0,0,0,0.3);transition:background-color var(--transition-fast); } .playlist-container::-webkit-scrollbar-thumb:hover { background-color:var(--primary-accent); }
        .playlist-item { display:grid;grid-template-columns:auto auto 1fr;gap:.8rem;align-items:center;padding:.85rem 1.5rem;cursor:pointer;border-bottom:1px solid rgba(124,77,255,0.1);font-size:.85rem;transition:background-color var(--transition-fast),color var(--transition-fast); }
        .playlist-item:last-child { border-bottom:none; } .playlist-item:hover, .playlist-item:focus-visible { background:rgba(0,255,195,0.1);color:var(--primary-accent); }
        .playlist-item.active { background:linear-gradient(90deg,rgba(0,188,212,0.15),rgba(0,188,212,0.05));border-left:3px solid var(--secondary-accent);padding-left:calc(1.5rem - 3px); }
        .playlist-item span:first-child { color:var(--text-muted);width:2em;text-align:right; } .playlist-item span:last-child { color:var(--text-color);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
        .playlist-item:hover span:last-child, .playlist-item:focus-visible span:last-child { color:var(--primary-accent); } .playlist-item.active span { color:var(--secondary-accent);font-weight:bold;text-shadow:0 0 5px var(--secondary-accent); }
        .playlist-item-indicator { display:flex;align-items:center;justify-content:center;width:18px;height:18px;opacity:0;transition:opacity var(--transition-main);position:relative; }
        .playlist-item.active .playlist-item-indicator { opacity:1; }
        .wave-bar { width:2.5px;margin:0 .5px;height:100%;background-color:var(--secondary-accent);animation:soundwaveFluid 1.2s ease-in-out infinite alternate;border-radius:1px;box-shadow:0 0 3px var(--secondary-accent); }
        .wave-bar:nth-child(1){animation-delay:-.4s} .wave-bar:nth-child(2){animation-delay:-.2s} .wave-bar:nth-child(3){animation-delay:0s}
        @keyframes soundwaveFluid {0%{transform:scaleY(.15);opacity:.5}50%{opacity:.75}100%{transform:scaleY(.9);opacity:1}}

        @media(max-width:700px){body{padding:.5rem}header{font-size:1.5rem;margin-bottom:1.5rem}.player-container{width:calc(100% - 1rem);max-width:none}.track-info-wrapper{padding:.8rem 1rem;min-height:50px}.track-title{font-size:1rem}.progress-container{margin:.5rem 1rem;height:6px}.controls button{padding:.7rem .4rem;font-size:.8rem}.filter-modulator{padding:.75rem 1rem}.filter-slider-group label{width:60px;font-size:.65rem}.filter-value-display{min-width:35px;font-size:.65rem}.visualizer-controls{grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px;padding:.75rem 1rem}.visualizer-controls button{width:26px;height:26px;font-size:.55rem}.playlist-toggle{padding:.85rem}.playlist-item{padding:.7rem 1rem;gap:.7rem;font-size:.8rem}.playlist-item span:first-child{width:1.8em}.playlist-item-indicator{width:15px;height:15px}.wave-bar{width:2px}}
        @media(max-width:400px){header{font-size:1.2rem;margin-bottom:1rem}.visualizer-canvas-container{height:150px}.filter-type-selector{flex-wrap:wrap;gap:4px}.filter-type-selector button{min-width:35px;padding:.25rem .5rem}.filter-slider-group{flex-direction:column;align-items:stretch;gap:.25rem}.filter-slider-group label{text-align:left;margin-bottom:.1rem}.filter-value-display{text-align:right}.visualizer-controls{gap:4px;padding:.5rem}.visualizer-controls button{width:24px;height:24px;font-size:.5rem}.playlist-item{font-size:.75rem;padding:.6rem .8rem}}
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <header>Neuromantic</header>

    <div class="player-container">

        <div class="visualizer-canvas-container">
            <canvas id="visualizer"></canvas>
        </div>

        <audio id="musicPlayer" crossorigin="anonymous"></audio>
        <div class="track-info-wrapper">
            <div class="track-title" id="trackTitle">-- Cryo-Signal Locked --</div>
            <div class="track-number">
                <span id="currentTrackNum">00</span>/<span id="totalTracks">00</span>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>

        <div class="controls">
            <button id="prevTrack" title="Previous Signal (Left Arrow)">Prev</button>
            <button id="playPause" title="Engage/Disengage (Spacebar)">Engage</button>
            <button id="nextTrack" title="Next Signal (Right Arrow)">Next</button>
        </div>

        <div class="filter-modulator">
            <div class="filter-modulator-header">Signal Path Modulator</div>
            <div class="filter-type-selector">
                <button data-filtertype="off" class="active" aria-pressed="true" title="Bypass Filter">Off</button>
                <button data-filtertype="lowpass" aria-pressed="false" title="Low-Pass Filter">LPF</button>
                <button data-filtertype="highpass" aria-pressed="false" title="High-Pass Filter">HPF</button>
                <button data-filtertype="bandpass" aria-pressed="false" title="Band-Pass Filter">BPF</button>
                <button data-filtertype="notch" aria-pressed="false" title="Notch Filter">Notch</button>
            </div>
            <div class="filter-slider-group">
                <label for="filterFreq">Freq. Tune:</label>
                <input type="range" id="filterFreq" min="0" max="100" value="100" aria-label="Filter Cutoff Frequency">
                <span id="filterFreqValue" class="filter-value-display">20kHz</span>
            </div>
            <div class="filter-slider-group">
                <label for="filterQ">Res. Peak:</label>
                <input type="range" id="filterQ" min="0" max="100" value="10" aria-label="Filter Resonance Q">
                <span id="filterQValue" class="filter-value-display">1.0</span>
            </div>
        </div>

        <div class="visualizer-controls">
            <button id="viz1" class="active">1</button> <button id="viz2">2</button> <button id="viz3">3</button>
            <button id="viz4">4</button> <button id="viz5">5</button> <button id="viz6">6</button>
            <button id="viz7">7</button> <button id="viz8">8</button> <button id="viz9">9</button>
            <button id="viz10">10</button><button id="viz11">11</button><button id="viz12">12</button>
            <button id="viz13">13</button><button id="viz14">14</button><button id="viz15">15</button>
            <button id="viz16">16</button><button id="viz17">17</button><button id="viz18">18</button>
            <button id="viz19">19</button><button id="viz20">20</button>
        </div>

        <button class="playlist-toggle" id="playlistToggle">Cryo-Streams</button>

        <div class="playlist-container" id="playlist" style="display:none;">
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- SECTION: YOUR PLAYLIST ---
        // Just edit this list! Make sure the 'src' matches the file name in your root folder.
        const tracks = [
            { src: 'assets/music/1.mp3',  title: 'Signal 01' },
            { src: 'assets/music/2.mp3',  title: 'Signal 02' },
            { src: 'assets/music/3.mp3',  title: 'Signal 03' },
            { src: 'assets/music/4.mp3',  title: 'Signal 04' },
            { src: 'assets/music/5.mp3',  title: 'Signal 05' },
            { src: 'assets/music/6.mp3',  title: 'Signal 06' },
            { src: 'assets/music/7.mp3',  title: 'Signal 07' },
            { src: 'assets/music/8.mp3',  title: 'Signal 08' },
            { src: 'assets/music/9.mp3',  title: 'Signal 09' },
            { src: 'assets/music/10.mp3', title: 'Signal 10' }
        ];

        // --- SECTION: ELEMENT SELECTORS ---
        const $ = id => document.getElementById(id);
        const musicPlayer = $('musicPlayer');
        const playPauseBtn = $('playPause');
        const prevTrackBtn = $('prevTrack');
        const nextTrackBtn = $('nextTrack');
        const visualizerCanvas = $('visualizer');
        const visualizerCtx = visualizerCanvas.getContext('2d');
        const bgCanvas = $('background-canvas');
        const progressBar = $('progressBar');
        const progressContainer = $('progressContainer');
        const trackTitleEl = $('trackTitle');
        const currentTrackNumEl = $('currentTrackNum');
        const totalTracksEl = $('totalTracks');
        const currentTimeEl = $('currentTime');
        const totalTimeEl = $('totalTime');
        const playlistEl = $('playlist');
        const playlistToggleBtn = $('playlistToggle');
        const filterTypeButtons = document.querySelectorAll('.filter-type-selector button');
        const filterFreqSlider = $('filterFreq');
        const filterQSlider = $('filterQ');
        const filterFreqValueDisplay = $('filterFreqValue');
        const filterQValueDisplay = $('filterQValue');
        const vizControls = document.querySelector('.visualizer-controls');

        // --- SECTION: STATE VARIABLES ---
        let audioContext, analyser, source, filterNode;
        let dataArray, bufferLength;
        let isAudioContextInitialized = false;
        let currentTrackIndex = 0;
        let currentVisualizer = 1;
        let visualizerAnimationId = null;
        let bgAnimationId = null;

        // --- SECTION: AUDIO INITIALIZATION ---
        function initAudioContext() {
            if (isAudioContextInitialized) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create the audio graph nodes
                source = audioContext.createMediaElementSource(musicPlayer);
                analyser = audioContext.createAnalyser();
                filterNode = audioContext.createBiquadFilter();

                // Configure nodes
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.75;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                // Connect the graph: source -> filter -> analyser -> speakers
                source.connect(filterNode);
                filterNode.connect(analyser);
                analyser.connect(audioContext.destination);

                isAudioContextInitialized = true;
                console.log("Cryo-Audio Core Online (with Modulator). State:", audioContext.state);
                
                // Load saved filter settings now that the node exists
                loadFilterSettings();
            } catch (e) {
                console.error("Audio Core Init Failure:", e);
                alert("Your browser does not support the Web Audio API. Player cannot start.");
                playPauseBtn.textContent = 'Error';
                playPauseBtn.disabled = true;
            }
        }

        // --- SECTION: PLAYER LOGIC ---
        function loadTrack(index) {
            currentTrackIndex = (index + tracks.length) % tracks.length;
            const track = tracks[currentTrackIndex];
            musicPlayer.src = track.src;
            trackTitleEl.textContent = track.title;
            currentTrackNumEl.textContent = (currentTrackIndex + 1).toString().padStart(2, '0');
            updatePlaylistActiveState();
        }

        function playTrack() {
            // The magic happens here: if the context is suspended, resume it. This is required by browsers.
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const playPromise = musicPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playPauseBtn.textContent = 'Disengage';
                    startAllAnimations();
                }).catch(error => {
                    console.error("Playback failed:", error);
                    // If it fails, reset the button so the user can try again.
                    playPauseBtn.textContent = 'Engage';
                });
            }
        }

        function pauseTrack() {
            musicPlayer.pause();
            playPauseBtn.textContent = 'Engage';
        }

        function handlePlayPause() {
            // FIRST CLICK EVER: Initialize the entire audio system.
            if (!isAudioContextInitialized) {
                initAudioContext();
            }
            
            // If initialization failed, do nothing.
            if (!isAudioContextInitialized) return;

            // Toggle play/pause
            if (musicPlayer.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        }

        // --- SECTION: UI & UPDATES ---
        function updateProgress() {
            if (!musicPlayer.duration || !isFinite(musicPlayer.duration) || musicPlayer.duration <= 0) return;
            const progressPercent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
        }

        function createPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, i) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.dataset.index = i;
                item.innerHTML = `<span>${(i+1).toString().padStart(2,'0')}</span><div class="playlist-item-indicator"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div><span>${track.title}</span>`;
                item.addEventListener('click', () => {
                    if (!isAudioContextInitialized) {
                        initAudioContext();
                    }
                    if (currentTrackIndex !== i) {
                        loadTrack(i);
                        playTrack();
                    } else {
                        handlePlayPause();
                    }
                });
                playlistEl.appendChild(item);
            });
            updatePlaylistActiveState();
        }

        function updatePlaylistActiveState() {
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.index) === currentTrackIndex);
            });
            const activeItem = playlistEl.querySelector('.playlist-item.active');
            if (activeItem && playlistEl.style.display !== 'none') {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        
        function formatTime(s) {
            if (isNaN(s) || !isFinite(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        // --- SECTION: FILTER MODULATOR ---
        const MIN_FREQ = 20, MAX_FREQ = 20000;
        const MIN_LOG_FREQ = Math.log(MIN_FREQ), MAX_LOG_FREQ = Math.log(MAX_FREQ);
        const LOG_FREQ_SCALE = (MAX_LOG_FREQ - MIN_LOG_FREQ) / 100;
        const MIN_Q = 0.1, MAX_Q = 30;
        const MIN_LOG_Q = Math.log(MIN_Q), MAX_LOG_Q = Math.log(MAX_Q);
        const LOG_Q_SCALE = (MAX_LOG_Q - MIN_LOG_Q) / 100;

        function sliderToFreq(val) { return Math.exp(MIN_LOG_FREQ + LOG_FREQ_SCALE * parseFloat(val)); }
        function sliderToQ(val) { return Math.exp(MIN_LOG_Q + LOG_Q_SCALE * parseFloat(val)); }

        function applyFilterSettings() {
            if (!isAudioContextInitialized) return;
            const activeTypeButton = document.querySelector('.filter-type-selector button.active');
            const type = activeTypeButton ? activeTypeButton.dataset.filtertype : 'off';

            if (type === 'off') {
                filterNode.type = "allpass";
                filterNode.frequency.setTargetAtTime(audioContext.sampleRate / 2, audioContext.currentTime, 0.01);
                filterNode.Q.setTargetAtTime(1, audioContext.currentTime, 0.01);
            } else {
                filterNode.type = type;
                const freq = sliderToFreq(filterFreqSlider.value);
                const q = sliderToQ(filterQSlider.value);
                filterNode.frequency.setTargetAtTime(freq, audioContext.currentTime, 0.01);
                filterNode.Q.setTargetAtTime(q, audioContext.currentTime, 0.01);
            }
            updateFilterValueDisplays();
            saveCurrentFilterSettings();
        }
        
        function updateFilterValueDisplays() {
            const freq = sliderToFreq(filterFreqSlider.value);
            const q = sliderToQ(filterQSlider.value);
            filterFreqValueDisplay.textContent = freq < 1000 ? `${freq.toFixed(0)}Hz` : `${(freq/1000).toFixed(1)}kHz`;
            filterQValueDisplay.textContent = q.toFixed(1);
        }

        function saveCurrentFilterSettings() {
            const activeTypeButton = document.querySelector('.filter-type-selector button.active');
            const settings = {
                type: activeTypeButton ? activeTypeButton.dataset.filtertype : 'off',
                freqSlider: filterFreqSlider.value,
                qSlider: filterQSlider.value
            };
            localStorage.setItem('neuromanticFilterSettingsV2', JSON.stringify(settings));
        }

        function loadFilterSettings() {
            const saved = localStorage.getItem('neuromanticFilterSettingsV2');
            if (saved) {
                const settings = JSON.parse(saved);
                filterFreqSlider.value = settings.freqSlider || "100";
                filterQSlider.value = settings.qSlider || "10";
                filterTypeButtons.forEach(btn => {
                    const isActive = btn.dataset.filtertype === settings.type;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', isActive);
                });
            }
            applyFilterSettings();
        }

        // --- SECTION: VISUALIZERS & ANIMATIONS ---

        const H = () => visualizerCanvas.height;

        function getAverageAmplitude(arr, start, end) {
            let sum = 0;
            start = Math.max(0, Math.floor(start));
            end = Math.min(arr.length, Math.ceil(end));
            if (start >= end) return 0;
            for (let i = start; i < end; i++) { sum += arr[i]; }
            return sum / (end - start) / 255;
        }

            if (!visualizerAnimationId) { renderVisualizer(); }

            }

        function drawViz14(){const radius=Math.min(CX(),CY())*0.5;const angleStep=(Math.PI*2)/bufferLength;visualizerCtx.save();visualizerCtx.translate(CX(),CY());visualizerCtx.strokeStyle=`hsl(${t()*15%360+120},90%,65%)`;visualizerCtx.lineWidth=2;visualizerCtx.beginPath();for(let i=0;i<=bufferLength;i++){const index=i%bufferLength;const amp=dataArray[index]/255;const r=radius+amp*(radius*0.8);const angle=i*angleStep+t()*0.1;const x=Math.cos(angle)*r;const y=Math.sin(angle)*r;if(i===0)visualizerCtx.moveTo(x,y);else visualizerCtx.lineTo(x,y);}visualizerCtx.closePath();visualizerCtx.stroke();visualizerCtx.restore();}
        function drawViz15(){const lines=10;visualizerCtx.save();visualizerCtx.lineWidth=1.5;for(let i=0;i<lines;i++){const y=(H()/(lines+1))*(i+1);const dataIndex=Math.floor((i/lines)*bufferLength);const amp=(dataArray[dataIndex]||0)/255;const freq=5+amp*20;const magnitude=amp*30;const hue=(i/lines)*240+100;visualizerCtx.strokeStyle=`hsla(${hue%360},100%,60%,${0.5+amp*0.5})`;visualizerCtx.beginPath();visualizerCtx.moveTo(0,y);for(let x=0;x<W();x+=5){const yOffset=Math.sin(x*0.01*freq+t()*3)*magnitude;visualizerCtx.lineTo(x,y+yOffset);}visualizerCtx.stroke();}visualizerCtx.restore();}
        function drawViz16(){const barW=W()/(bufferLength*0.5);const maxH=H()*0.45;visualizerCtx.save();for(let i=0;i<bufferLength/2;i++){const amp=dataArray[i]/255.0;const h=Math.max(1,amp*maxH);const x=i*barW;const hue=(i/(bufferLength/2))*240+60;visualizerCtx.fillStyle=`hsl(${hue},100%,${50+amp*25}%)`;visualizerCtx.fillRect(x,0,barW-1,h);visualizerCtx.fillRect(W()-x-barW,H()-h,barW-1,h);visualizerCtx.fillStyle=`hsl(${(hue+90)%360},80%,${50+amp*25}%)`;visualizerCtx.fillRect(W()-x-barW,0,barW-1,h);visualizerCtx.fillRect(x,H()-h,barW-1,h);}visualizerCtx.restore();}
        function drawViz17(){const bass=getAverageAmplitude(dataArray,0,bufferLength*0.1);const mid=getAverageAmplitude(dataArray,bufferLength*0.1,bufferLength*0.6);const high=getAverageAmplitude(dataArray,bufferLength*0.6,bufferLength);const baseRadius=Math.min(CX(),CY())*0.1;const pulseRadius=baseRadius+bass*Math.min(CX(),CY())*0.6;const rings=3+Math.floor(mid*5);visualizerCtx.save();visualizerCtx.lineWidth=1+high*3;for(let i=0;i<rings;i++){const radius=pulseRadius*(i/rings);const hue=(i*40+t()*30+120)%360;const alpha=0.1+(1-i/rings)*0.7;visualizerCtx.strokeStyle=`hsla(${hue},100%,60%,${alpha})`;visualizerCtx.beginPath();visualizerCtx.arc(CX(),CY(),radius,0,Math.PI*2);visualizerCtx.stroke();}visualizerCtx.restore();}
        function drawViz18(){const cols=24;const rows=16;const cellW=W()/cols;const cellH=H()/rows;const maxDotSize=Math.min(cellW,cellH)*0.4;visualizerCtx.save();for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const dataIndex=Math.floor(((r*cols+c)/(rows*cols))*bufferLength);const amp=dataArray[dataIndex]/255;const dotSize=amp*maxDotSize;if(dotSize<0.5)continue;const hue=(c/cols)*200+100;const lightness=40+amp*50;visualizerCtx.fillStyle=`hsl(${hue},100%,${lightness}%)`;visualizerCtx.beginPath();visualizerCtx.arc(c*cellW+cellW/2,r*cellH+cellH/2,dotSize,0,Math.PI*2);visualizerCtx.fill();}}visualizerCtx.restore();}
        drawViz19.stars=[];function drawViz19(){visualizerCtx.fillStyle='rgba(2,3,5,0.15)';visualizerCtx.fillRect(0,0,W(),H());visualizerCtx.save();const numStars=100;const overallAmp=getAverageAmplitude(dataArray,0,bufferLength);const speed=0.5+overallAmp*10;if(drawViz19.stars.length===0){for(let i=0;i<numStars;i++){drawViz19.stars.push({x:(Math.random()-0.5)*W(),y:(Math.random()-0.5)*H(),z:Math.random()*W()});}}visualizerCtx.translate(CX(),CY());drawViz19.stars.forEach(star=>{star.z-=speed;if(star.z<=0){star.z=W();star.x=(Math.random()-0.5)*W();star.y=(Math.random()-0.5)*H();}const k=128/star.z;const px=star.x*k;const py=star.y*k;const size=(1-star.z/W())*2.5+0.5;visualizerCtx.fillStyle=`rgba(224,240,248,${1-star.z/W()})`;visualizerCtx.beginPath();visualizerCtx.arc(px,py,size,0,Math.PI*2);visualizerCtx.fill();});visualizerCtx.restore();}
        function drawViz20(){const amplitude=H()*0.3;const frequency=5;const points=100;const rotationSpeed=t()*0.5;const bass=getAverageAmplitude(dataArray,0,bufferLength*0.1);const mid=getAverageAmplitude(dataArray,bufferLength*0.1,bufferLength*0.6);visualizerCtx.save();visualizerCtx.lineWidth=1+bass*3;function drawStrand(offset){visualizerCtx.beginPath();for(let i=0;i<=points;i++){const progress=i/points;const x=W()*progress;const angle=progress*Math.PI*frequency+rotationSpeed+offset;const dataIndex=Math.floor(progress*bufferLength);const ampMod=(dataArray[dataIndex]||0)/255*0.5+0.5;const y=CY()+Math.sin(angle)*amplitude*ampMod;if(i===0)visualizerCtx.moveTo(x,y);else visualizerCtx.lineTo(x,y);}const hue=(offset===0)?(t()*20+120)%360:(t()*20+300)%360;visualizerCtx.strokeStyle=`hsla(${hue},100%,60%,0.8)`;visualizerCtx.stroke();if(offset===0){visualizerCtx.lineWidth=0.5+mid*1.5;visualizerCtx.strokeStyle='rgba(200,220,240,0.4)';for(let i=0;i<=points;i+=5){const progress=i/points;const x=W()*progress;const angle1=progress*Math.PI*frequency+rotationSpeed;const angle2=progress*Math.PI*frequency+rotationSpeed+Math.PI;const dataIndex=Math.floor(progress*bufferLength);const ampMod=(dataArray[dataIndex]||0)/255*0.5+0.5;const y1=CY()+Math.sin(angle1)*amplitude*ampMod;const y2=CY()+Math.sin(angle2)*amplitude*ampMod;visualizerCtx.beginPath();visualizerCtx.moveTo(x,y1);visualizerCtx.lineTo(x,y2);visualizerCtx.stroke();}}}drawStrand(0);drawStrand(Math.PI);visualizerCtx.restore();}
        
        const visualizers = [drawViz1, drawViz2, drawViz3, drawViz4, drawViz5, drawViz6, drawViz7, drawViz8, drawViz9, drawViz10, drawViz11, drawViz12, drawViz13, drawViz14, drawViz15, drawViz16, drawViz17, drawViz18, drawViz19, drawViz20];
        
        // --- All Background Effect functions are below ---
        // --- SDF Wireframe Grid Background (WebGL) ---
        let glBgProgram = null, glBgGL = null, glBgTimeUniform = null, glBgResUniform = null, glBgReactUniform = null, glBgBassUniform = null;
        let bgReactivity = 0, bgBassLevel = 0;

        const sdfVertexShader = `attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;
        const sdfFragmentShader = `
        precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        uniform float u_reactivity;
        uniform float u_bass;

        mat2 rot(float a) { float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

        float sdGrid(vec2 p, float s) {
            p = abs(fract(p * s) - 0.5);
            return min(p.x, p.y);
        }

        // --- Sakura Tree SDF & Splat Logic ---
        float sdLine(vec2 p, vec2 a, vec2 b) {
            vec2 pa = p - a, ba = b - a;
            float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
            return length(pa - ba * h);
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
            float t = u_time * 0.3;
            float react = u_reactivity;
            float bass = u_bass;

            // Perspective base
            float horizon = 0.3 + bass * 0.1;
            float planeDist = 1.0 / (uv.y + horizon + 0.001);
            vec2 planeUV = vec2(uv.x * planeDist, planeDist);

            // Morph/warp grid
            float warp1 = sin(planeUV.y * 0.5 + t * 2.0) * (0.15 + react * 0.4);
            float warp2 = cos(planeUV.x * 0.8 + t * 1.5) * (0.1 + react * 0.3);
            vec2 warpedPlaneUV = planeUV + vec2(warp1, warp2);
            warpedPlaneUV *= rot(t * 0.1 + bass * 0.3);

            // Grid rendering
            float gridScale1 = 0.8 + react * 0.5;
            float gridScale2 = gridScale1 * 3.0;
            float line1 = smoothstep(0.02, 0.0, sdGrid(warpedPlaneUV, gridScale1));
            float line2 = smoothstep(0.03, 0.01, sdGrid(warpedPlaneUV, gridScale2)) * 0.4;
            float grid = (line1 + line2) * (1.0 / (1.0 + planeDist * planeDist * 0.01));

            // --- Sakura Tree Layer ---
            float treeLayer = 0.0;
            vec3 splatColor = vec3(0.0);
            
            // Tree positioning in "3D" space
            // We place trees periodically on the grid
            vec2 treeID = floor(planeUV * 0.2);
            vec2 localTreeUV = fract(planeUV * 0.2) - 0.5;
            
            // Random variation per tree
            float h = hash(treeID);
            if (h > 0.6) { // Only render some trees
                float sway = sin(t * 2.0 + h * 10.0) * 0.1;
                vec2 trunkBase = vec2(0.0, -0.4); // Local base
                vec2 trunkTip = vec2(sway, 0.4 + h * 0.2);
                
                // Project 3D-ish local coordinates back to screen space for the tree
                // This is a simplified "billboard" trick for the trees in perspective
                float treeDist = planeDist;
                float treeFade = smoothstep(20.0, 5.0, treeDist) * smoothstep(-0.2, 0.2, uv.y + horizon);
                
                if (treeFade > 0.0) {
                    // Normalize uv for the specific tree's screen pos
                    vec2 treeScreenPos = vec2(treeID.x * 5.0, treeID.y * 5.0); // Rough world pos
                    // Instead of full projection, we use the local grid tile logic
                    vec2 p = localTreeUV * 10.0; // Scale up for tree detail
                    
                    // Main Trunk (Wireframed)
                    float trunk = sdLine(p, trunkBase, trunkTip);
                    float trunkWire = smoothstep(0.08, 0.04, trunk) * (0.5 + 0.5 * sin(p.y * 10.0 - t * 5.0));
                    treeLayer += trunkWire * treeFade;

                    // Branches
                    for(int i=0; i<3; i++) {
                        float fi = float(i);
                        float bAngle = fi * 2.1 + h;
                        vec2 bDir = vec2(sin(bAngle), cos(bAngle)) * 0.4;
                        vec2 bStart = mix(trunkBase, trunkTip, 0.4 + fi * 0.2);
                        vec2 bEnd = bStart + bDir + vec2(sway * 1.5, sway);
                        
                        float br = sdLine(p, bStart, bEnd);
                        treeLayer += smoothstep(0.06, 0.02, br) * 0.6 * treeFade;
                        
                        // Gaussian Splats (Leaves/Sakura Petals)
                        // Soft blobs at branch tips
                        float splatDist = length(p - bEnd);
                        float splat = exp(-pow(splatDist * 4.0, 2.0)); // Gaussian falloff
                        float pulseSplat = splat * (0.8 + react * 0.6 + 0.2 * sin(t * 5.0 + fi));
                        
                        vec3 pCol = mix(vec3(1.0, 0.4, 0.7), vec3(1.0, 0.8, 0.9), h); // Pink colors
                        splatColor += pCol * pulseSplat * treeFade;
                    }
                }
            }

            // Colors
            vec3 colBase = vec3(0.0, 1.0, 0.76); // --primary-accent
            vec3 colEnergy = vec3(0.49, 0.3, 1.0); // --tertiary-accent
            vec3 colCyan = vec3(0.0, 0.74, 0.82); // --secondary-accent

            float pulse = sin(warpedPlaneUV.y * 2.0 - t * 4.0) * 0.5 + 0.5;
            pulse = pow(pulse, 2.0) * react;
            vec3 gridCol = mix(colBase, colEnergy, pulse);
            gridCol = mix(gridCol, colCyan, sin(warpedPlaneUV.x * 3.0 + t) * 0.3 + 0.3);

            // Bass glow at horizon
            float horizonGlow = exp(-pow((uv.y + horizon) * 8.0, 2.0)) * bass * 2.0;
            
            // Composition
            vec3 bgColor = vec3(0.008, 0.012, 0.02);
            vec3 finalColor = bgColor + gridCol * grid + colBase * treeLayer * 0.8;
            finalColor += splatColor * 0.9;
            finalColor += colEnergy * horizonGlow;

            // Vignette & Scanline
            float scanline = sin(gl_FragCoord.y * 1.5 + t * 10.0) * 0.03;
            float vig = 1.0 - dot(uv * 0.8, uv * 0.8);
            finalColor = (finalColor + scanline) * vig;

            gl_FragColor = vec4(finalColor, 1.0);
        }
        `;

        function initWebGLBackground() {
            const gl = bgCanvas.getContext('webgl', { alpha: false, antialias: false });
            if (!gl) { console.error('WebGL not supported for background'); return; }
            glBgGL = gl;

            // Compile shaders
            function compileShader(src, type) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(s));
                    gl.deleteShader(s); return null;
                }
                return s;
            }
            const vs = compileShader(sdfVertexShader, gl.VERTEX_SHADER);
            const fs = compileShader(sdfFragmentShader, gl.FRAGMENT_SHADER);
            if (!vs || !fs) return;

            glBgProgram = gl.createProgram();
            gl.attachShader(glBgProgram, vs);
            gl.attachShader(glBgProgram, fs);
            gl.linkProgram(glBgProgram);
            if (!gl.getProgramParameter(glBgProgram, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(glBgProgram)); return;
            }
            gl.useProgram(glBgProgram);

            // Fullscreen quad
            const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            const posLoc = gl.getAttribLocation(glBgProgram, 'a_position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

            // Uniforms
            glBgTimeUniform = gl.getUniformLocation(glBgProgram, 'u_time');
            glBgResUniform = gl.getUniformLocation(glBgProgram, 'u_resolution');
            glBgReactUniform = gl.getUniformLocation(glBgProgram, 'u_reactivity');
            glBgBassUniform = gl.getUniformLocation(glBgProgram, 'u_bass');

            console.log('SDF Wireframe Grid background initialized (WebGL)');
        }

        function renderCurrentBackground() {
            bgAnimationId = requestAnimationFrame(renderCurrentBackground);

            // Compute reactivity from audio
            if (isAudioContextInitialized && !musicPlayer.paused && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                const relevantBufferLength = Math.floor(bufferLength * 0.8);
                for (let i = 0; i < relevantBufferLength; i++) { sum += dataArray[i]; }
                const avg = sum / relevantBufferLength || 0;
                bgReactivity += (Math.min(1, Math.pow(avg / 128, 1.2)) - bgReactivity) * 0.15;
                bgBassLevel += (getAverageAmplitude(dataArray, 0, bufferLength * 0.08) - bgBassLevel) * 0.2;
            } else {
                bgReactivity *= 0.95;
                bgBassLevel *= 0.95;
            }

            if (!glBgGL || !glBgProgram) return;
            const gl = glBgGL;
            gl.viewport(0, 0, bgCanvas.width, bgCanvas.height);
            gl.uniform1f(glBgTimeUniform, performance.now() / 1000);
            gl.uniform2f(glBgResUniform, bgCanvas.width, bgCanvas.height);
            gl.uniform1f(glBgReactUniform, bgReactivity);
            gl.uniform1f(glBgBassUniform, bgBassLevel);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        // --- SECTION: EVENT LISTENERS ---
        playPauseBtn.addEventListener('click', handlePlayPause);
        prevTrackBtn.addEventListener('click', () => { loadTrack(currentTrackIndex - 1); if (!musicPlayer.paused) playTrack(); });
        nextTrackBtn.addEventListener('click', () => { loadTrack(currentTrackIndex + 1); if (!musicPlayer.paused) playTrack(); });
        musicPlayer.addEventListener('ended', () => { nextTrackBtn.click(); });
        musicPlayer.addEventListener('timeupdate', updateProgress);
        musicPlayer.addEventListener('loadedmetadata', () => { totalTimeEl.textContent = formatTime(musicPlayer.duration); updateProgress(); });
        musicPlayer.addEventListener('error', () => { trackTitleEl.textContent = 'Signal Lost'; pauseTrack(); });
        progressContainer.addEventListener('click', e => {
            if (!musicPlayer.duration || !isAudioContextInitialized) return;
            const rect = progressContainer.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            musicPlayer.currentTime = pos * musicPlayer.duration;
        });
        playlistToggleBtn.addEventListener('click', () => {
            const isHidden = playlistEl.style.display === 'none';
            playlistEl.style.display = isHidden ? 'block' : 'none';
            playlistToggleBtn.textContent = isHidden ? 'Hide Streams' : 'Cryo-Streams';
            if (isHidden) { updatePlaylistActiveState(); }
        });
        filterTypeButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterTypeButtons.forEach(btn => {btn.classList.remove('active'); btn.setAttribute('aria-pressed', 'false');});
                button.classList.add('active');
                button.setAttribute('aria-pressed', 'true');
                applyFilterSettings();
            });
        });
        filterFreqSlider.addEventListener('input', applyFilterSettings);
        filterQSlider.addEventListener('input', applyFilterSettings);
        vizControls.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON') {
                const vizIdx = parseInt(e.target.textContent);
                if (currentVisualizer !== vizIdx) {
                    currentVisualizer = vizIdx;
                    vizControls.querySelector('.active').classList.remove('active');
                    e.target.classList.add('active');
                    if (currentVisualizer === 19) drawViz19.stars = [];
                }
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); playPauseBtn.click(); break;
                case 'ArrowLeft': e.preventDefault(); prevTrackBtn.click(); break;
                case 'ArrowRight': e.preventDefault(); nextTrackBtn.click(); break;
            }
        });
        window.addEventListener('resize', () => {
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        });

        function initializePlayer() {
            console.log("Neuromantic Cryo-Signal X26 (AudioMod) Initializing...");
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            
            totalTracksEl.textContent = tracks.length.toString().padStart(2, '0');
            createPlaylist();
            loadTrack(0);
            
            initWebGLBackground();
            startAllAnimations();
            
            console.log("Interface active. Awaiting user cryo-link (interaction).");
        }

        initializePlayer();
    });
