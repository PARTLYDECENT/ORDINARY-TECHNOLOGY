<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Mobile Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #speedometer {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            pointer-events: auto;
        }
        
        /* MODIFIED: Added a zone for the joystick */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
        }

        .control-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #667eea, #764ba2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            user-select: none;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
        }

        .control-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        #gasBtn {
            right: 30px;
            bottom: 120px; /* MODIFIED: Moved up */
            background: linear-gradient(145deg, #4CAF50, #45a049);
        }

        #brakeBtn {
            right: 30px; /* MODIFIED: Moved to same column as gas */
            bottom: 30px;
            background: linear-gradient(145deg, #f44336, #d32f2f);
        }
        
        /* MODIFIED: No longer need left/right buttons */
        #leftBtn, #rightBtn {
            display: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #restartBtn {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 200;
        }

        #startBtn {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="speedometer">Speed: 0 mph</div>
            <div id="score">Distance: 0m</div>
            
            <div id="controls">
                <div id="joystick-zone"></div>
                <button class="control-btn" id="brakeBtn">🛑</button>
                <button class="control-btn" id="gasBtn">⚡</button>
            </div>
            
            <div id="gameOver">
                <h2>Game Over!</h2>
                <p>Final Distance: <span id="finalScore">0</span>m</p>
                <button id="restartBtn">Restart Game</button>
            </div>
            
            <div id="instructions">
                <h2>🏎️ 3D Racing Game</h2>
                <p>Use the joystick to steer left/right.</p>
                <p>⚡ Accelerate</p>
                <p>🛑 Brake</p>
                <p><strong>Avoid the obstacles and drive as far as you can!</strong></p>
                <button id="startBtn">Start Game</button>
            </div>
        </div>
    </div>
    
    <audio id="engineSound" src="engine.mp3" loop></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
        class MobileRacingGame {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.car = null;
                this.carModel = null;
                this.wheels = [];
                this.road = [];
                this.obstacles = [];
                this.trees = [];
                
                this.gameRunning = false;
                this.gameSpeed = 0;
                this.carSpeed = 0;
                this.carPosition = 0;
                this.distance = 0;
                this.maxSpeed = 4; // MODIFIED: Halved from 8 to 4
                this.wheelRotation = 0;
                
                // ADDED: Property for engine sound
                this.engineSound = null;

                this.controls = {
                    left: false,
                    right: false,
                    gas: false,
                    brake: false
                };
                
                this.gltfLoader = new THREE.GLTFLoader();
                this.rgbeLoader = new THREE.RGBELoader();
                
                this.init();
                this.setupControls();
                this.setupUI();
            }
            
            init() {
                // Create scene
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x87ceeb, 50, 300);
                
                // Create camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 8, 12);
                this.camera.lookAt(0, 0, 0);
                
                // Create renderer
                const canvas = document.getElementById('gameCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87ceeb);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 0.6;
                
                // Load HDR skybox
                this.loadSkybox();
                
                // Add lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                this.scene.add(directionalLight);
                
                this.loadCarModel();
                this.createRoad();
                this.createEnvironment();
                
                window.addEventListener('resize', () => this.onWindowResize(), false);
            }
            
            loadSkybox() {
                this.rgbeLoader.load(
                    'sky.hdr',
                    (texture) => {
                        texture.mapping = THREE.EquirectangularReflectionMapping;
                        this.scene.background = texture;
                        this.scene.environment = texture;
                    },
                    undefined,
                    (error) => {
                        console.log('HDR skybox not found, using default sky');
                        const skyGeometry = new THREE.SphereGeometry(500, 32, 15);
                        const skyMaterial = new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide });
                        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
                        this.scene.add(sky);
                    }
                );
            }
            
            loadCarModel() {
                this.gltfLoader.load(
                    'car.glb',
                    (gltf) => {
                        this.carModel = gltf.scene;
                        this.carModel.scale.setScalar(1);
                        this.carModel.position.set(0, 0, 0);
                        this.carModel.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        this.createCarWithWheels();
                    },
                    undefined,
                    (error) => {
                        console.log('GLB car model not found, using default car');
                        this.createBasicCar();
                    }
                );
            }
            
            createCarWithWheels() {
                const carGroup = new THREE.Group();
                carGroup.add(this.carModel);
                
                const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
                
                const wheelPositions = [
                    [-1.2, 0, 1.5], [1.2, 0, 1.5],
                    [-1.2, 0, -1.5], [1.2, 0, -1.5]
                ];
                
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    this.wheels.push(wheel);
                    carGroup.add(wheel);
                });
                
                carGroup.position.set(0, 0.2, 0);
                this.car = carGroup;
                this.scene.add(carGroup);
            }
            
            createBasicCar() {
                const carGroup = new THREE.Group();
                const bodyGeometry = new THREE.BoxGeometry(2, 0.8, 4);
                const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xff4444 });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 0.4;
                body.castShadow = true;
                carGroup.add(body);
                
                const roofGeometry = new THREE.BoxGeometry(1.8, 0.6, 2);
                const roofMaterial = new THREE.MeshLambertMaterial({ color: 0xcc3333 });
                const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                roof.position.y = 1;
                roof.position.z = -0.5;
                roof.castShadow = true;
                carGroup.add(roof);
                
                const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
                
                const wheelPositions = [
                    [-1.2, 0, 1.5], [1.2, 0, 1.5],
                    [-1.2, 0, -1.5], [1.2, 0, -1.5]
                ];
                
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    this.wheels.push(wheel);
                    carGroup.add(wheel);
                });
                
                carGroup.position.set(0, 0.2, 0);
                this.car = carGroup;
                this.scene.add(carGroup);
            }
            
            createRoad() {
                const roadGeometry = new THREE.PlaneGeometry(12, 400);
                const roadMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });
                
                for (let i = 0; i < 3; i++) {
                    const roadSegment = new THREE.Mesh(roadGeometry, roadMaterial);
                    roadSegment.rotation.x = -Math.PI / 2;
                    roadSegment.position.z = i * 400 - 200;
                    roadSegment.receiveShadow = true;
                    this.road.push(roadSegment);
                    this.scene.add(roadSegment);
                }
                
                for (let i = 0; i < 20; i++) {
                    const lineGeometry = new THREE.PlaneGeometry(0.2, 4);
                    const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const line = new THREE.Mesh(lineGeometry, lineMaterial);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(0, 0.01, i * 20 - 200);
                    this.scene.add(line);
                }
            }
            
            createEnvironment() {
                for (let i = 0; i < 50; i++) {
                    const treeGroup = new THREE.Group();
                    const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, 3);
                    const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                    const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                    trunk.position.y = 1.5;
                    treeGroup.add(trunk);
                    
                    const leavesGeometry = new THREE.SphereGeometry(1.5, 8, 6);
                    const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                    const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                    leaves.position.y = 3.5;
                    treeGroup.add(leaves);
                    
                    const side = Math.random() < 0.5 ? -1 : 1;
                    treeGroup.position.set(
                        side * (8 + Math.random() * 5), 0, (Math.random() - 0.5) * 400
                    );
                    
                    this.trees.push(treeGroup);
                    this.scene.add(treeGroup);
                }
                this.createObstacles();
            }
            
            createObstacles() {
                for (let i = 0; i < 15; i++) {
                    const obstacleGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                    const obstacleMaterial = new THREE.MeshLambertMaterial({ color: 0xff6600 });
                    const obstacle = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
                    
                    obstacle.position.set((Math.random() - 0.5) * 8, 0.75, -50 - i * 25);
                    obstacle.castShadow = true;
                    
                    this.obstacles.push(obstacle);
                    this.scene.add(obstacle);
                }
            }
            
            setupControls() {
                // MODIFIED: This function now sets up the joystick and buttons
                
                // --- Joystick Setup ---
                const joystickZone = document.getElementById('joystick-zone');
                const joystickOptions = {
                    zone: joystickZone,
                    mode: 'static',
                    position: { left: '50%', top: '50%' },
                    color: 'rgba(255, 255, 255, 0.5)',
                    size: 100,
                    lockX: false, // Allow horizontal movement
                    lockY: true   // Lock vertical movement
                };
                const manager = nipplejs.create(joystickOptions);

                manager.on('move', (evt, data) => {
                    if (data.direction) {
                        if (data.direction.x === 'left') {
                            this.controls.left = true;
                            this.controls.right = false;
                        } else if (data.direction.x === 'right') {
                            this.controls.left = false;
                            this.controls.right = true;
                        }
                    }
                });

                manager.on('end', () => {
                    this.controls.left = false;
                    this.controls.right = false;
                });

                // --- Button Setup ---
                const addTouchListeners = (element, onStart, onEnd) => {
                    element.addEventListener('touchstart', onStart, { passive: false });
                    element.addEventListener('touchend', onEnd, { passive: false });
                    element.addEventListener('mousedown', onStart);
                    element.addEventListener('mouseup', onEnd);
                };
                
                addTouchListeners(
                    document.getElementById('gasBtn'),
                    (e) => { e.preventDefault(); this.controls.gas = true; },
                    (e) => { e.preventDefault(); this.controls.gas = false; }
                );
                
                addTouchListeners(
                    document.getElementById('brakeBtn'),
                    (e) => { e.preventDefault(); this.controls.brake = true; },
                    (e) => { e.preventDefault(); this.controls.brake = false; }
                );
            }
            
            setupUI() {
                document.getElementById('startBtn').onclick = () => {
                    document.getElementById('instructions').style.display = 'none';
                    
                    // ADDED: Initialize and play engine sound on game start
                    this.engineSound = document.getElementById('engineSound');
                    this.engineSound.play().catch(e => console.log("Audio play failed, user needs to interact first."));

                    this.startGame();
                };
                
                document.getElementById('restartBtn').onclick = () => {
                    this.restartGame();
                };
            }
            
            startGame() {
                this.gameRunning = true;
                this.animate();
            }
            
            restartGame() {
                this.gameRunning = true;
                this.carSpeed = 0;
                this.carPosition = 0;
                this.distance = 0;
                this.car.position.set(0, 0.2, 0);
                
                // ADDED: Play sound again on restart
                if(this.engineSound) this.engineSound.play();

                this.obstacles.forEach((obstacle, i) => {
                    obstacle.position.z = -50 - i * 25;
                });
                
                document.getElementById('gameOver').style.display = 'none';
                this.animate();
            }
            
            update() {
                if (!this.gameRunning) return;
                
                // MODIFIED: All speed/movement values are halved for slower gameplay
                if (this.controls.gas) {
                    this.carSpeed = Math.min(this.carSpeed + 0.05, this.maxSpeed);
                } else if (this.controls.brake) {
                    this.carSpeed = Math.max(this.carSpeed - 0.15, 0);
                } else {
                    this.carSpeed = Math.max(this.carSpeed - 0.025, 0);
                }
                
                if (this.controls.left) {
                    this.carPosition = Math.max(this.carPosition - 0.075, -4);
                    this.car.rotation.z = 0.1;
                } else if (this.controls.right) {
                    this.carPosition = Math.min(this.carPosition + 0.075, 4);
                    this.car.rotation.z = -0.1;
                } else {
                    this.car.rotation.z *= 0.9;
                }
                
                this.car.position.x = this.carPosition;
                this.distance += this.carSpeed * 0.5;
                
                // ADDED: Update engine sound volume based on car speed
                if (this.engineSound) {
                    // Set volume between 20% (idle) and 100% (max speed)
                    this.engineSound.volume = Math.max(0.2, this.carSpeed / this.maxSpeed);
                }

                if (this.carSpeed > 0) {
                    this.wheelRotation += this.carSpeed * 0.1;
                    this.wheels.forEach(wheel => {
                        wheel.rotation.x = this.wheelRotation;
                    });
                }
                
                this.road.forEach(segment => {
                    segment.position.z += this.carSpeed;
                    if (segment.position.z > 200) segment.position.z -= 1200;
                });
                
                this.obstacles.forEach(obstacle => {
                    obstacle.position.z += this.carSpeed;
                    obstacle.rotation.y += 0.05;
                    
                    if (obstacle.position.z > 50) {
                        obstacle.position.z -= 400;
                        obstacle.position.x = (Math.random() - 0.5) * 8;
                    }
                    
                    const distance = Math.sqrt(
                        Math.pow(this.car.position.x - obstacle.position.x, 2) +
                        Math.pow(this.car.position.z - obstacle.position.z, 2)
                    );
                    
                    if (distance < 2) {
                        this.gameOver();
                    }
                });
                
                this.trees.forEach(tree => {
                    tree.position.z += this.carSpeed;
                    if (tree.position.z > 200) tree.position.z -= 400;
                });
                
                this.camera.position.x = this.car.position.x * 0.3;
                
                document.getElementById('speedometer').textContent = `Speed: ${Math.floor(this.carSpeed * 10)} mph`;
                document.getElementById('score').textContent = `Distance: ${Math.floor(this.distance)}m`;
            }
            
            gameOver() {
                this.gameRunning = false;

                // ADDED: Pause engine sound on game over
                if(this.engineSound) this.engineSound.pause();

                document.getElementById('finalScore').textContent = Math.floor(this.distance);
                document.getElementById('gameOver').style.display = 'block';
            }
            
            animate() {
                if (!this.gameRunning) return;
                
                requestAnimationFrame(() => this.animate());
                this.update();
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        window.addEventListener('load', () => {
            new MobileRacingGame();
        });
    </script>
</body>
</html>
