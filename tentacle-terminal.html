<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brisk Getaway - Ultimate Mobile Racing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: saturate(1.2) contrast(1.1);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud-element {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.2), rgba(0, 100, 255, 0.2));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 
                0 8px 32px rgba(0, 255, 157, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: hudGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hudGlow {
            0% { box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
            100% { box-shadow: 0 12px 40px rgba(0, 255, 157, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
        }

        #speedometer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff9d;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.8);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #boostMeter {
            position: absolute;
            top: 90px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        #boostFill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e, #00ff9d);
            width: 100%;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.6);
        }

        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 160px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 10px;
            margin-top: 60px;
        }

        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 220px;
            pointer-events: auto;
        }

        .control-btn {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.3), rgba(0, 100, 255, 0.3));
            backdrop-filter: blur(20px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(0, 255, 157, 0.3);
            touch-action: manipulation;
            user-select: none;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:active {
            transform: scale(0.9) translateY(2px);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(0, 255, 157, 0.6);
        }

        #leftBtn, #rightBtn {
            width: 85px;
            height: 85px;
        }

        #leftBtn {
            left: 30px;
            bottom: 40px;
        }

        #rightBtn {
            left: 130px;
            bottom: 40px;
        }

        #gasBtn, #brakeBtn {
            width: 90px;
            height: 90px;
        }

        #gasBtn {
            right: 30px;
            bottom: 130px;
            background: linear-gradient(145deg, rgba(76, 175, 80, 0.4), rgba(139, 195, 74, 0.4));
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(76, 175, 80, 0.4);
        }

        #gasBtn:active {
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(76, 175, 80, 0.8);
        }

        #brakeBtn {
            right: 30px;
            bottom: 30px;
            background: linear-gradient(145deg, rgba(244, 67, 54, 0.4), rgba(211, 47, 47, 0.4));
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(244, 67, 54, 0.4);
        }

        #brakeBtn:active {
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(244, 67, 54, 0.8);
        }

        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 50%;
            transform: translateX(50%);
            width: 60px;
            height: 60px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.3), rgba(50, 50, 50, 0.3));
            backdrop-filter: blur(20px);
            color: white;
            font-size: 24px;
            pointer-events: auto;
            transition: all 0.2s ease;
        }

        #pauseBtn:active {
            transform: translateX(50%) scale(0.9);
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.3), rgba(0, 100, 255, 0.3));
        }
        
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(20, 20, 40, 0.9));
            backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .menu-title {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff9d, #64b5f6, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(0, 255, 157, 0.5);
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .menu-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .menu-btn {
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.2), rgba(0, 100, 255, 0.2));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 25px;
            color: white;
            padding: 18px 40px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(0, 255, 157, 0.2);
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:active {
            transform: scale(0.95) translateY(2px);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(0, 255, 157, 0.4);
        }

        .primary-btn {
            background: linear-gradient(145deg, rgba(76, 175, 80, 0.3), rgba(139, 195, 74, 0.3));
            border-color: rgba(76, 175, 80, 0.7);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(76, 175, 80, 0.3);
        }

        .danger-btn {
            background: linear-gradient(145deg, rgba(244, 67, 54, 0.3), rgba(211, 47, 47, 0.3));
            border-color: rgba(244, 67, 54, 0.7);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(244, 67, 54, 0.3);
        }

        #gameOver, #instructions, #pauseMenu {
            display: none;
        }

        .stats-container {
            margin: 20px 0;
            text-align: center;
        }

        .stat-item {
            margin: 10px 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            color: #00ff9d;
            font-weight: 700;
            font-size: 20px;
        }

        .combo-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 150;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff9d;
            border-radius: 50%;
            animation: sparkle 1s ease-out forwards;
            box-shadow: 0 0 10px #00ff9d;
        }

        .road-particles {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="particles"></div>
        <div class="road-particles"></div>
        
        <div id="ui">
            <div id="speedometer" class="hud-element">Speed: 0 mph</div>
            <div id="score" class="hud-element">Distance: 0m</div>
            
            <div id="boostMeter" class="hud-element">
                <div id="boostFill"></div>
            </div>
            
            <button id="pauseBtn">⏸</button>
            
            <div id="controls">
                <button class="control-btn" id="leftBtn">⬅</button>
                <button class="control-btn" id="rightBtn">➡</button>
                <button class="control-btn" id="brakeBtn">🛑</button>
                <button class="control-btn" id="gasBtn">🚀</button>
            </div>
            
            <div id="comboIndicator" class="combo-indicator"></div>
            
            <div id="gameOver" class="menu-overlay">
                <h2 class="menu-title">Game Over!</h2>
                <div class="stats-container">
                    <div class="stat-item">Final Distance: <span id="finalScore" class="stat-value">0m</span></div>
                    <div class="stat-item">Max Speed: <span id="maxSpeedStat" class="stat-value">0 mph</span></div>
                    <div class="stat-item">Near Misses: <span id="nearMissesStat" class="stat-value">0</span></div>
                </div>
                <button class="menu-btn primary-btn" id="restartBtn">Race Again</button>
                <button class="menu-btn" id="mainMenuBtn">Main Menu</button>
            </div>
            
            <div id="pauseMenu" class="menu-overlay">
                <h2 class="menu-title">Paused</h2>
                <button class="menu-btn primary-btn" id="resumeBtn">Resume Race</button>
                <button class="menu-btn" id="pauseRestartBtn">Restart</button>
                <button class="menu-btn danger-btn" id="pauseMainMenuBtn">Main Menu</button>
            </div>
            
            <div id="instructions" class="menu-overlay">
                <h1 class="menu-title">BRISK GETAWAY</h1>
                <p class="menu-subtitle">Ultimate high-speed racing experience</p>
                <div class="stats-container">
                    <div class="stat-item">🏎️ Dodge obstacles at blazing speeds</div>
                    <div class="stat-item">⚡ Build boost meter for maximum speed</div>
                    <div class="stat-item">🎯 Master near-miss combos for bonus points</div>
                </div>
                <button class="menu-btn primary-btn" id="startBtn">Start Race</button>
            </div>
        </div>
    </div>
    
    <audio id="engineSound" src="engine.mp3" loop></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        class BriskGetawayGame {
            constructor() {
                this.scene = null; this.camera = null; this.renderer = null; this.car = null;
                this.wheels = []; this.roadSegments = []; this.obstacles = [];
                
                this.gameRunning = false; this.gamePaused = false;
                this.carSpeed = 0; this.carPosition = 0; this.distance = 0;
                this.maxSpeed = 5; this.wheelRotation = 0;
                this.boostMeter = 0; this.maxBoostMeter = 100;
                this.nearMisses = 0; this.maxSpeedReached = 0;
                this.comboMultiplier = 1;
                
                this.engineSound = document.getElementById('engineSound');
                this.controls = { left: false, right: false, gas: false, brake: false };
                
                this.gltfLoader = new THREE.GLTFLoader();
                this.rgbeLoader = new THREE.RGBELoader();
                
                this.sparkleParticles = [];
                this.roadParticles = [];
                
                this.init();
                this.setupControls();
                this.setupUI();
                this.createParticleSystems();
            }
            
            init() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x000510, 30, 200);
                
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 8, 12);
                this.camera.lookAt(0, 0, 0);
                
                const canvas = document.getElementById('gameCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000510);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                
                this.loadSkybox();
                this.setupLighting();
                this.loadCarModel();
                this.createEnhancedRoad();
                this.createEnvironment();
                
                window.addEventListener('resize', () => this.onWindowResize(), false);
            }
            
            loadSkybox() {
                this.rgbeLoader.load('sky.hdr', (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    this.scene.background = texture;
                    this.scene.environment = texture;
                }, undefined, (error) => {
                    // Fallback enhanced skybox
                    const skyGeometry = new THREE.SphereGeometry(500, 32, 15);
                    const skyMaterial = new THREE.ShaderMaterial({
                        uniforms: {
                            topColor: { value: new THREE.Color(0x0077ff) },
                            bottomColor: { value: new THREE.Color(0x000510) },
                            offset: { value: 33 },
                            exponent: { value: 0.6 }
                        },
                        vertexShader: `
                            varying vec3 vWorldPosition;
                            void main() {
                                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                                vWorldPosition = worldPosition.xyz;
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            uniform vec3 topColor;
                            uniform vec3 bottomColor;
                            uniform float offset;
                            uniform float exponent;
                            varying vec3 vWorldPosition;
                            void main() {
                                float h = normalize(vWorldPosition + offset).y;
                                gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                            }
                        `,
                        side: THREE.BackSide
                    });
                    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
                    this.scene.add(sky);
                });
            }
            
            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x404080, 0.4);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
                directionalLight.position.set(10, 30, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                directionalLight.shadow.camera.near = 0.5;
                directionalLight.shadow.camera.far = 100;
                this.scene.add(directionalLight);
                
                // Neon glow lights
                const neonLight1 = new THREE.PointLight(0x00ff9d, 1, 50);
                neonLight1.position.set(-10, 5, -20);
                this.scene.add(neonLight1);
                
                const neonLight2 = new THREE.PointLight(0xff6b35, 1, 50);
                neonLight2.position.set(10, 5, -40);
                this.scene.add(neonLight2);
            }
            
            loadCarModel() {
                this.gltfLoader.load('car.glb', (gltf) => {
                    this.carModel = gltf.scene;
                    this.carModel.scale.setScalar(1);
                    this.carModel.position.set(0, 0, 0);
                    this.carModel.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            // Enhanced materials with neon glow
                            if (node.material) {
                                node.material.emissive = new THREE.Color(0x001122);
                                node.material.emissiveIntensity = 0.2;
                            }
                        }
                    });
                    this.createCarWithWheels();
                }, undefined, (error) => {
                    console.log("GLB car model not found, creating basic car");
                    this.createBasicCar();
                });
            }
            
            createCarWithWheels() {
                const carGroup = new THREE.Group();
                carGroup.add(this.carModel);
                
                // Enhanced wheels with glow
                const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                const wheelMaterial = new THREE.MeshPhongMaterial({
                    color: 0x333333,
                    emissive: 0x002200,
                    emissiveIntensity: 0.1
                });
                
                const wheelPositions = [[-1.2, 0, 1.5], [1.2, 0, 1.5], [-1.2, 0, -1.5], [1.2, 0, -1.5]];
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    this.wheels.push(wheel);
                    carGroup.add(wheel);
                });
                
                carGroup.position.set(0, 0.2, 0);
                this.car = carGroup;
                this.scene.add(carGroup);
                
                // Add car exhaust particles
                this.exhaustParticles = new ExhaustParticles(this.scene, this.car);
            }
            
            createEnhancedRoad() {
                // Create multiple road segments with neon lighting
                for (let i = 0; i < 4; i++) {
                    const roadGroup = new THREE.Group();
                    
                    // Main road surface with improved texture
                    const roadGeometry = new THREE.PlaneGeometry(15, 300);
                    const roadMaterial = new THREE.MeshPhongMaterial({
                        color: 0x1a1a1a,
                        emissive: 0x000510,
                        emissiveIntensity: 0.1
                    });
                    const road = new THREE.Mesh(roadGeometry, roadMaterial);
                    road.rotation.x = -Math.PI / 2;
                    road.position.z = 300 * i - 150;
                    road.receiveShadow = true;
                    roadGroup.add(road);
                    
                    // Neon road edges
                    const edgeGeometry = new THREE.PlaneGeometry(0.5, 300);
                    const edgeMaterial = new THREE.MeshBasicMaterial({
                        color: 0x00ff9d,
                        transparent: true,
                        opacity: 0.6
                    });
                    
                    const leftEdge = new THREE.Mesh(edgeGeometry, edgeMaterial);
                    leftEdge.rotation.x = -Math.PI / 2;
                    leftEdge.position.set(-7.5, 0.02, 300 * i - 150);
                    roadGroup.add(leftEdge);
                    
                    const rightEdge = new THREE.Mesh(edgeGeometry, edgeMaterial);
                    rightEdge.rotation.x = -Math.PI / 2;
                    rightEdge.position.set(7.5, 0.02, 300 * i - 150);
                    roadGroup.add(rightEdge);
                    
                    // Enhanced lane markers with glow
                    for (let j = 0; j < 15; j++) {
                        const markerGeometry = new THREE.PlaneGeometry(0.3, 6);
                        const markerMaterial = new THREE.MeshBasicMaterial({
                            color: 0xffffff,
                            transparent: true,
                            opacity: 0.9
                        });
                        const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                        marker.rotation.x = -Math.PI / 2;
                        marker.position.set(0, 0.01, (300 * i - 150) + (j * 20) - 140);
                        roadGroup.add(marker);
                    }
                    
                    this.roadSegments.push(roadGroup);
                    this.scene.add(roadGroup);
                }
            }
            
            createEnvironment() {
                this.shaderMist = new EnhancedShaderMist(this.scene);
                this.createEnhancedObstacles();
                this.createRoadSideElements();
            }
            
            createEnhancedObstacles() {
                this.gltfLoader.load('obstacle.glb', (gltf) => {
                    const obstacleModel = gltf.scene;
                    obstacleModel.scale.setScalar(0.6);
                    obstacleModel.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            // Add neon glow to obstacles
                            if (node.material) {
                                node.material.emissive = new THREE.Color(0x330000);
                                node.material.emissiveIntensity = 0.3;
                            }
                        }
                    });

                    for (let i = 0; i < 20; i++) {
                        const obstacle = obstacleModel.clone();
                        obstacle.position.set((Math.random() - 0.5) * 10, 0.75, -80 - i * 30);
                        
                        // Add warning light to obstacles
                        const warningLight = new THREE.PointLight(0xff0000, 1, 15);
                        warningLight.position.set(0, 2, 0);
                        obstacle.add(warningLight);
                        
                        this.obstacles.push(obstacle);
                        this.scene.add(obstacle);
                    }
                }, undefined, (error) => {

            setupControls() {
                const addTouchListeners = (element, onStart, onEnd) => {
                    element.addEventListener('touchstart', onStart, { passive: false });
                    element.addEventListener('touchend', onEnd, { passive: false });
                    element.addEventListener('mousedown', onStart);
                    element.addEventListener('mouseup', onEnd);
                };
                
                addTouchListeners(
                    document.getElementById('leftBtn'),
                    (e) => { e.preventDefault(); this.controls.left = true; },
                    (e) => { e.preventDefault(); this.controls.left = false; }
                );

                addTouchListeners(
                    document.getElementById('rightBtn'),

                addTouchListeners(
                    document.getElementById('gasBtn'),
                    (e) => { 
                        e.preventDefault();

                        if (this.engineSound.paused) {
                            this.engineSound.play().catch(e => console.error("Audio play failed:", e));
                        }
                    },
                    (e) => { 
                        e.preventDefault();

                        if (this.carSpeed < 0.5) {
                            this.engineSound.pause();
                        }
                    }
                );
                
                addTouchListeners(
                    document.getElementById('brakeBtn'),

                };
                
                document.getElementById('mainMenuBtn').onclick = () => {
                    this.showMainMenu();
                };
                
                document.getElementById('pauseBtn').onclick = () => {
                    this.pauseGame();
                };
                
                document.getElementById('resumeBtn').onclick = () => {

                };
                
                document.getElementById('pauseRestartBtn').onclick = () => {

            startGame() {
                this.gameRunning = true;
                this.gamePaused = false;
                this.resetStats();
                this.animate();
            }
            
            pauseGame() {
                if (this.gameRunning && !this.gamePaused) {
                    this.gamePaused = true;
                    document.getElementById('pauseMenu').style.display = 'flex';
                    this.engineSound.pause();
                }
            }
            
            resumeGame() {
                if (this.gameRunning && this.gamePaused) {
                    this.gamePaused = false;
                    document.getElementById('pauseMenu').style.display = 'none';
                    this.animate();
                }
            }
            
            restartGame() {
                this.gameRunning = true;
                this.gamePaused = false;
                this.resetStats();
                this.resetCarPosition();
                this.resetObstacles();
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('pauseMenu').style.display = 'none';
                this.animate();
            }
            
            showMainMenu() {
                this.gameRunning = false;
                this.gamePaused = false;
                this.engineSound.pause();
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('pauseMenu').style.display = 'none';
                document.getElementById('instructions').style.display = 'flex';
            }
            
            resetStats() {
                this.carSpeed = 0;
                this.carPosition = 0;
                this.distance = 0;
                this.boostMeter = 0;
                this.nearMisses = 0;
                this.maxSpeedReached = 0;
                this.comboMultiplier = 1;
            }
            
            resetCarPosition() {
                this.car.position.set(0, 0.2, 0);
                this.car.rotation.set(0, 0, 0);
            }
            
            resetObstacles() {
                this.obstacles.forEach((obstacle, i) => {
                    obstacle.position.z = -80 - i * 30;
                    obstacle.position.x = (Math.random() - 0.5) * 10;
                });
            }
            
            update() {
                if (!this.gameRunning || this.gamePaused) return;
                
                // Enhanced car physics
                const acceleration = 0.08;
                const deceleration = 0.04;
                const brakeForce = 0.20;
                const maxSpeedBonus = this.boostMeter > 80 ? 1.5 : 1.0;
                
                if (this.controls.gas) {
                    this.carSpeed = Math.min(this.carSpeed + acceleration, this.maxSpeed * maxSpeedBonus);
                    this.boostMeter = Math.min(this.boostMeter + 0.5, this.maxBoostMeter);
                } else if (this.controls.brake) {
                    this.carSpeed = Math.max(this.carSpeed - brakeForce, 0);
                    this.boostMeter = Math.max(this.boostMeter - 1, 0);
                } else {
                    this.carSpeed = Math.max(this.carSpeed - deceleration, 0);
                    this.boostMeter = Math.max(this.boostMeter - 0.2, 0);
                }
                
                // Enhanced steering with momentum
                const steerForce = 0.12;
                const maxSteerPosition = 6;
                
                if (this.controls.left) {
                    this.carPosition = Math.max(this.carPosition - steerForce, -maxSteerPosition);
                    this.car.rotation.z = Math.min(this.car.rotation.z + 0.02, 0.15);
                    this.car.rotation.y = Math.min(this.car.rotation.y + 0.01, 0.1);
                } else if (this.controls.right) {
                    this.carPosition = Math.min(this.carPosition + steerForce, maxSteerPosition);
                    this.car.rotation.z = Math.max(this.car.rotation.z - 0.02, -0.15);
                    this.car.rotation.y = Math.max(this.car.rotation.y - 0.01, -0.1);
                } else {
                    this.car.rotation.z *= 0.92;
                    this.car.rotation.y *= 0.92;
                }
                
                this.car.position.x = this.carPosition;
                this.distance += this.carSpeed * 0.6;
                this.maxSpeedReached = Math.max(this.maxSpeedReached, this.carSpeed * 10);
                
                // Enhanced wheel animation
                if (this.carSpeed > 0) {
                    this.wheelRotation += this.carSpeed * 0.15;
                    this.wheels.forEach(wheel => {
                        wheel.rotation.x = this.wheelRotation;
                    });
                }
                
                // Enhanced road movement with curve effects
                this.roadSegments.forEach(segment => {
                    segment.position.z += this.carSpeed;
                    if (segment.position.z > 300) {
                        segment.position.z -= 1200;
                    }
                });
                
                // Enhanced obstacle management with near-miss detection
                this.obstacles.forEach(obstacle => {
                    obstacle.position.z += this.carSpeed;
                    obstacle.rotation.y += 0.08;
                    
                    if (obstacle.position.z > 80) {
                        obstacle.position.z -= 600;
                        obstacle.position.x = (Math.random() - 0.5) * 10;
                    }
                    
                    const distance = this.car.position.distanceTo(obstacle.position);
                    
                    // Near miss detection (exciting close calls)
                    if (distance < 4 && distance > 2.5 && obstacle.position.z > -5 && obstacle.position.z < 5) {
                        if (!obstacle.nearMissTriggered) {
                            this.triggerNearMiss();
                            obstacle.nearMissTriggered = true;
                        }
                    } else if (distance > 8) {
                        obstacle.nearMissTriggered = false;
                    }
                    
                    // Collision detection
                    if (distance < 2.2) {
                        this.gameOver();
                        return;
                    }
                });
                
                // Enhanced camera movement with dynamic effects
                this.camera.position.x = this.car.position.x * 0.4;
                const speedIntensity = this.carSpeed / this.maxSpeed;
                this.camera.position.y = 8 + speedIntensity * 2;
                this.camera.position.z = 12 - speedIntensity * 3;
                
                // Update particle systems
                if (this.shaderMist) {
                    this.shaderMist.update(this.carSpeed);
                }
                
                if (this.particleTrail) {
                    this.particleTrail.update(this.carSpeed);
                }
                
                if (this.exhaustParticles) {
                    this.exhaustParticles.update(this.carSpeed, this.controls.gas);
                }
                
                this.roadEffects.update(this.carSpeed);
                this.updateSparkles();
                this.updateUI();
            }
            
            triggerNearMiss() {
                this.nearMisses++;
                this.comboMultiplier = Math.min(this.comboMultiplier + 0.1, 3.0);
                this.boostMeter = Math.min(this.boostMeter + 10, this.maxBoostMeter);
                
                // Show combo indicator
                const comboEl = document.getElementById('comboIndicator');
                comboEl.textContent = `NEAR MISS! x${this.comboMultiplier.toFixed(1)}`;
                comboEl.style.opacity = '1';
                comboEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
                
                setTimeout(() => {
                    comboEl.style.opacity = '0';
                    comboEl.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 1000);
                
                // Create sparkle effect
                this.createSparkles(this.car.position);
            }
            
            createSparkles(position) {
                const particlesContainer = document.querySelector('.particles');
                for (let i = 0; i < 8; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * window.innerWidth + 'px';
                    sparkle.style.top = Math.random() * window.innerHeight + 'px';
                    particlesContainer.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 1000);
                }
            }
            
            updateSparkles() {
                // Implementation for continuous sparkle effects during high speed
                if (this.carSpeed > this.maxSpeed * 0.8 && Math.random() > 0.95) {
                    this.createSparkles(this.car.position);
                }
            }
            
            updateUI() {
                document.getElementById('speedometer').textContent = `Speed: ${Math.floor(this.carSpeed * 10)} mph`;
                document.getElementById('score').textContent = `Distance: ${Math.floor(this.distance)}m`;
                
                // Update boost meter
                const boostFill = document.getElementById('boostFill');
                const boostPercentage = (this.boostMeter / this.maxBoostMeter);
                boostFill.style.transform = `scaleX(${boostPercentage})`;
                
                // Change boost color based on level
                if (boostPercentage > 0.8) {
                    boostFill.style.background = 'linear-gradient(90deg, #ff6b35, #00ff9d)';
                } else if (boostPercentage > 0.5) {
                    boostFill.style.background = 'linear-gradient(90deg, #f7931e, #ff6b35)';
                } else {
                    boostFill.style.background = 'linear-gradient(90deg, #ff6b35, #f7931e)';
                }
            }
            
            gameOver() {
                this.gameRunning = false;
                this.gamePaused = false;
                this.engineSound.pause();
                
                document.getElementById('finalScore').textContent = Math.floor(this.distance) + 'm';
                document.getElementById('maxSpeedStat').textContent = Math.floor(this.maxSpeedReached) + ' mph';
                document.getElementById('nearMissesStat').textContent = this.nearMisses;
                document.getElementById('gameOver').style.display = 'flex';
            }
            
            animate() {
                if (!this.gameRunning || this.gamePaused) return;
                requestAnimationFrame(() => this.animate());
                this.update();
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Enhanced Particle Systems
        class EnhancedParticleTrail {
            constructor(scene, vehicle) {
                this.scene = scene;
                this.vehicle = vehicle;
                this.particles = [];
                this.particleCount = 150;
                
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.particleCount * 3);
                const colors = new Float32Array(this.particleCount * 3);
                const sizes = new Float32Array(this.particleCount);
                
                for (let i = 0; i < this.particleCount; i++) {
                    positions[i * 3] = 0;
                    positions[i * 3 + 1] = 0;
                    positions[i * 3 + 2] = 0;
                    
                    colors[i * 3] = Math.random();
                    colors[i * 3 + 1] = Math.random() * 0.5 + 0.5;
                    colors[i * 3 + 2] = 1;
                    
                    sizes[i] = Math.random() * 5 + 2;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
                
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 }
                    },
                    vertexShader: `
                        attribute float size;
                        attribute vec3 color;
                        varying vec3 vColor;
                        uniform float time;
                        
                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            gl_PointSize = size * (300.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vColor;
                        
                        void main() {
                            float d = distance(gl_PointCoord, vec2(0.5));
                            if (d > 0.5) discard;
                            float alpha = 1.0 - d * 2.0;
                            gl_FragColor = vec4(vColor, alpha);
                        }
                    `,
                    transparent: true,
                    depthWrite: false,
                    vertexColors: true
                });
                
                this.points = new THREE.Points(geometry, material);
                this.scene.add(this.points);
                
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        life: 0,
                        velocity: new THREE.Vector3()
                    });
                }
            }
            
            update(carSpeed) {
                const positions = this.points.geometry.attributes.position.array;
                const time = performance.now() * 0.001;
                this.points.material.uniforms.time.value = time;
                
                for (let i = 0; i < this.particleCount; i++) {
                    const particle = this.particles[i];
                    
                    if (particle.life > 0) {
                        positions[i * 3] += particle.velocity.x;
                        positions[i * 3 + 1] += particle.velocity.y;
                        positions[i * 3 + 2] += particle.velocity.z;
                        particle.life -= 0.02;
                    }
                    
                    if (particle.life <= 0 && carSpeed > 1) {
                        positions[i * 3] = this.vehicle.position.x + (Math.random() - 0.5) * 2;
                        positions[i * 3 + 1] = this.vehicle.position.y - 0.5;
                        positions[i * 3 + 2] = this.vehicle.position.z - 2;
                        
                        particle.velocity.set(
                            (Math.random() - 0.5) * 0.2,
                            -Math.random() * 0.1,
                            carSpeed * 0.3 + Math.random() * 0.2
                        );
                        particle.life = 1.0;
                    }
                }
                
                this.points.geometry.attributes.position.needsUpdate = true;
            }
        }

        class ExhaustParticles {
            constructor(scene, vehicle) {
                this.scene = scene;
                this.vehicle = vehicle;
                this.particles = [];
                this.particleCount = 50;
                
                for (let i = 0; i < this.particleCount; i++) {
                    const geometry = new THREE.SphereGeometry(0.1, 8, 8);
                    const material = new THREE.MeshBasicMaterial({
                        color: 0x555555,
                        transparent: true,
                        opacity: 0.3
                    });
                    const particle = new THREE.Mesh(geometry, material);
                    particle.visible = false;
                    this.scene.add(particle);
                    
                    this.particles.push({
                        mesh: particle,
                        life: 0,
                        velocity: new THREE.Vector3()
                    });
                }
            }
            
            update(carSpeed, isAccelerating) {
                this.particles.forEach(particle => {
                    if (particle.life > 0) {
                        particle.mesh.position.add(particle.velocity);
                        particle.life -= 0.03;
                        particle.mesh.material.opacity = particle.life * 0.3;
                        particle.mesh.scale.multiplyScalar(1.02);
                        
                        if (particle.life <= 0) {
                            particle.mesh.visible = false;
                        }
                    }
                });
                
                if (isAccelerating && carSpeed > 0.5 && Math.random() > 0.7) {
                    const inactiveParticle = this.particles.find(p => !p.mesh.visible);
                    if (inactiveParticle) {
                        inactiveParticle.mesh.position.copy(this.vehicle.position);
                        inactiveParticle.mesh.position.y -= 0.3;
                        inactiveParticle.mesh.position.z += 2;
                        inactiveParticle.mesh.scale.set(1, 1, 1);
                        inactiveParticle.life = 1;
                        inactiveParticle.mesh.visible = true;
                        inactiveParticle.velocity.set(
                            (Math.random() - 0.5) * 0.3,
                            Math.random() * 0.2,
                            Math.random() * 0.5 + carSpeed * 0.5
                        );
                    }
                }
            }
        }

        class EnhancedShaderMist {
            constructor(scene) {
                this.scene = scene;
                const particleCount = 3000;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 80;
                    positions[i + 1] = Math.random() * 30;
                    positions[i + 2] = (Math.random() - 0.5) * 500;
                    
                    colors[i] = 0.2 + Math.random() * 0.3;     // R
                    colors[i + 1] = 0.4 + Math.random() * 0.4; // G  
                    colors[i + 2] = 0.8 + Math.random() * 0.2; // B
                }

                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 },
                        speed: { value: 0.0 }
                    },
                    vertexShader: `
                        uniform float time;
                        uniform float speed;
                        attribute vec3 color;
                        varying vec3 vColor;
                        
                        void main() {
                            vColor = color;
                            vec3 p = position;
                            p.z += sin(p.x * 5.0 + time) * 2.0;
                            p.y += cos(p.z * 3.0 + time) * 1.0;
                            p.x += sin(time * 0.5) * 1.0;
                            
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                            gl_PointSize = 3.0 + speed * 2.0;
                        }
                    `,
                
                // Add car exhaust particles
                this.exhaustParticles = new ExhaustParticles(this.scene, this.car);
            }
            
            createBasicCar() {
                const carGroup = new THREE.Group();
                
                // Enhanced car body with neon accents
                const bodyGeometry = new THREE.BoxGeometry(2, 0.8, 4);
                const bodyMaterial = new THREE.MeshPhongMaterial({
                    color: 0xff4444,
                    emissive: 0x220000,
                    emissiveIntensity: 0.3,
                    shininess: 100
                });
                const carBody = new THREE.Mesh(bodyGeometry, bodyMaterial);
                carBody.position.y = 0.4;
                carBody.castShadow = true;
                carGroup.add(carBody);
                
                // Neon accent strips
                const accentGeometry = new THREE.BoxGeometry(2.1, 0.1, 4.1);
                const accentMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff9d,
                    transparent: true,
                    opacity: 0.8
                });
                const accent = new THREE.Mesh(accentGeometry, accentMaterial);
                accent.position.y = 0.45;
                carGroup.add(accent);
                
                // Car cabin
                const cabinGeometry = new THREE.BoxGeometry(1.8, 0.6, 2);
                const cabinMaterial = new THREE.MeshPhongMaterial({
                    color: 0x004444,
                    emissive: 0x001122,
                    emissiveIntensity: 0.2,
                    transparent: true,
                    opacity: 0.8
                });
                const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
                cabin.position.y = 1;
                cabin.position.z = -0.5;
                cabin.castShadow = true;
                carGroup.add(cabin);
                
                // Enhanced wheels
                const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                const wheelMaterial = new THREE.MeshPhongMaterial({
                    color: 0x333333,
                    emissive: 0x002200,
                    emissiveIntensity: 0.1
                });
                
                const wheelPositions = [[-1.2, 0, 1.5], [1.2, 0, 1.5], [-1.2, 0, -1.5], [1.2, 0, -1.5]];
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(...pos);
                    wheel.castShadow = true;
                    this.wheels.push(wheel);
                    carGroup.add(wheel);
                });
                
                carGroup.position.set(0, 0.2, 0);
                this.car = carGroup;
                this.scene.add(carGroup);
