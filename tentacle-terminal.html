<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brisk Getaway - Ultimate Mobile Racing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: saturate(1.2) contrast(1.1);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud-element {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.2), rgba(0, 100, 255, 0.2));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: hudGlow 3s ease-in-out infinite alternate;
        }

        @keyframes hudGlow {
            0% { box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
            100% { box-shadow: 0 12px 40px rgba(0, 255, 157, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
        }

        #speedometer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff9d;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.8);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        #boostMeter {
            position: absolute;
            top: 90px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        #boostFill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e, #00ff9d);
            width: 100%;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.6);
        }

        #pauseBtn {
            position: absolute;
            top: 20px;
            right: 50%;
            transform: translateX(50%);
            width: 60px;
            height: 60px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.3), rgba(50, 50, 50, 0.3));
            backdrop-filter: blur(20px);
            color: white;
            font-size: 24px;
            pointer-events: auto;
            transition: all 0.2s ease;
        }

        #pauseBtn:active {
            transform: translateX(50%) scale(0.9);
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.3), rgba(0, 100, 255, 0.3));
        }

        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 220px;
            pointer-events: auto;
        }

        .control-btn {
            position: absolute;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.3), rgba(0, 100, 255, 0.3));
            backdrop-filter: blur(20px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(0, 255, 157, 0.3);
            touch-action: manipulation;
            user-select: none;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:active {
            transform: scale(0.9) translateY(2px);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(0, 255, 157, 0.6);
        }

        #leftBtn, #rightBtn {
            width: 85px;
            height: 85px;
        }

        #leftBtn {
            left: 30px;
            bottom: 40px;
        }

        #rightBtn {
            left: 130px;
            bottom: 40px;
        }

        #gasBtn, #brakeBtn {
            width: 90px;
            height: 90px;
        }

        #gasBtn {
            right: 30px;
            bottom: 130px;
            background: linear-gradient(145deg, rgba(76, 175, 80, 0.4), rgba(139, 195, 74, 0.4));
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(76, 175, 80, 0.4);
        }

        #brakeBtn {
            right: 30px;
            bottom: 30px;
            background: linear-gradient(145deg, rgba(244, 67, 54, 0.4), rgba(211, 47, 47, 0.4));
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(244, 67, 54, 0.4);
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(20, 20, 40, 0.9));
            backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .menu-title {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ff9d, #64b5f6, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(0, 255, 157, 0.5);
            animation: titlePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .menu-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .menu-btn {
            background: linear-gradient(145deg, rgba(0, 255, 157, 0.2), rgba(0, 100, 255, 0.2));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 157, 0.5);
            border-radius: 25px;
            color: white;
            padding: 18px 40px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(0, 255, 157, 0.2);
            position: relative;
            overflow: hidden;
        }

        .menu-btn:active {
            transform: scale(0.95) translateY(2px);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(0, 255, 157, 0.4);
        }

        .primary-btn {
            background: linear-gradient(145deg, rgba(76, 175, 80, 0.3), rgba(139, 195, 74, 0.3));
            border-color: rgba(76, 175, 80, 0.7);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(76, 175, 80, 0.3);
        }

        .danger-btn {
            background: linear-gradient(145deg, rgba(244, 67, 54, 0.3), rgba(211, 47, 47, 0.3));
            border-color: rgba(244, 67, 54, 0.7);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(244, 67, 54, 0.3);
        }

        #gameOver, #instructions, #pauseMenu {
            display: none;
        }

        .stats-container {
            margin: 20px 0;
            text-align: center;
        }

        .stat-item {
            margin: 10px 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            color: #00ff9d;
            font-weight: 700;
            font-size: 20px;
        }

        .combo-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 150;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="speedometer" class="hud-element">Speed: 0 mph</div>
            <div id="score" class="hud-element">Distance: 0m</div>
            
            <div id="boostMeter" class="hud-element">
                <div id="boostFill"></div>
            </div>
            
            <button id="pauseBtn">⏸</button>
            
            <div id="controls">
                <button class="control-btn" id="leftBtn">⬅</button>
                <button class="control-btn" id="rightBtn">➡</button>
                <button class="control-btn" id="brakeBtn">🛑</button>
                <button class="control-btn" id="gasBtn">🚀</button>
            </div>
            
            <div id="comboIndicator" class="combo-indicator"></div>
            
            <div id="gameOver" class="menu-overlay">
                <h2 class="menu-title">Game Over!</h2>
                <div class="stats-container">
                    <div class="stat-item">Final Distance: <span id="finalScore" class="stat-value">0m</span></div>
                    <div class="stat-item">Max Speed: <span id="maxSpeedStat" class="stat-value">0 mph</span></div>
                    <div class="stat-item">Near Misses: <span id="nearMissesStat" class="stat-value">0</span></div>
                </div>
                <button class="menu-btn primary-btn" id="restartBtn">Race Again</button>
                <button class="menu-btn" id="mainMenuBtn">Main Menu</button>
            </div>
            
            <div id="pauseMenu" class="menu-overlay">
                <h2 class="menu-title">Paused</h2>
                <button class="menu-btn primary-btn" id="resumeBtn">Resume Race</button>
                <button class="menu-btn" id="pauseRestartBtn">Restart</button>
                <button class="menu-btn danger-btn" id="pauseMainMenuBtn">Main Menu</button>
            </div>
            
            <div id="instructions" class="menu-overlay">
                <h1 class="menu-title">BRISK GETAWAY</h1>
                <p class="menu-subtitle">Ultimate high-speed racing experience</p>
                <div class="stats-container">
                    <div class="stat-item">🏎️ Dodge obstacles at blazing speeds</div>
                    <div class="stat-item">⚡ Build boost meter for maximum speed</div>
                    <div class="stat-item">🎯 Master near-miss combos for bonus points</div>
                </div>
                <button class="menu-btn primary-btn" id="startBtn">Start Race</button>
            </div>
        </div>
    </div>
    
    <audio id="engineSound" src="engine.mp3" loop></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        class MobileRacingGame {
            constructor() {
                this.scene = null; this.camera = null; this.renderer = null; this.car = null;
                this.wheels = []; this.road = []; this.obstacles = [];
                
                this.gameRunning = false; this.gamePaused = false;
                this.carSpeed = 0; this.carPosition = 0; this.distance = 0;
                this.maxSpeed = 4; this.wheelRotation = 0;
                this.boostMeter = 0; this.nearMisses = 0; this.maxSpeedReached = 0;
                
                this.engineSound = document.getElementById('engineSound');
                this.controls = { left: false, right: false, gas: false, brake: false };
                
                this.gltfLoader = new THREE.GLTFLoader();
                this.rgbeLoader = new THREE.RGBELoader();
                
                this.init();
                this.setupControls();
                this.setupUI();
            }
            
            init() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x87ceeb, 50, 300);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 8, 12);
                this.camera.lookAt(0, 0, 0);
                const canvas = document.getElementById('gameCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87ceeb);
                this.renderer.shadowMap.enabled = true;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 0.6;
                this.loadSkybox();
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 5);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                this.loadCarModel();
                this.createRoad();
                this.createEnvironment();
                window.addEventListener('resize', () => this.onWindowResize(), false);
            }
            
            loadSkybox() {
                this.rgbeLoader.load('sky.hdr', (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    this.scene.background = texture;
                    this.scene.environment = texture;
                }, undefined, (error) => {
                    console.log("HDR skybox not found, using fallback");
                    const skyGeometry = new THREE.SphereGeometry(500, 32, 15);
                    const skyMaterial = new THREE.MeshBasicMaterial({
                        color: 0xa2a2d0,
                        side: THREE.BackSide
                    });
                    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
                    this.scene.add(sky);
                });
            }
            
            loadCarModel() {
                this.gltfLoader.load('car.glb', (gltf) => {
                    this.carModel = gltf.scene;
                    this.carModel.scale.setScalar(1);
                    this.carModel.position.set(0, 0, 0);
                    this.carModel.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    this.createCarWithWheels();
                }, undefined, (error) => {
                    console.log("GLB car model not found, creating basic car");
                    this.createBasicCar();
                });
            }
            
            createCarWithWheels() {
                const t = new THREE.Group();
                t.add(this.carModel);
                const e = new THREE.CylinderGeometry(.4, .4, .3, 16);
                const o = new THREE.MeshLambertMaterial({ color: 0x333333 });
                [[-1.2, 0, 1.5], [1.2, 0, 1.5], [-1.2, 0, -1.5], [1.2, 0, -1.5]].forEach(s => {
                    const i = new THREE.Mesh(e, o);
                    i.rotation.z = Math.PI / 2;
                    i.position.set(...s);
                    i.castShadow = true;
                    this.wheels.push(i);
                    t.add(i);
                });
                t.position.set(0, .2, 0);
                this.car = t;
                this.scene.add(t);
            }
            
            createBasicCar() {
                const t = new THREE.Group();
                const e = new THREE.Mesh(new THREE.BoxGeometry(2, .8, 4), new THREE.MeshLambertMaterial({ color: 0xff4444 }));
                e.position.y = .4;
                e.castShadow = true;
                t.add(e);
                const o = new THREE.Mesh(new THREE.BoxGeometry(1.8, .6, 2), new THREE.MeshLambertMaterial({ color: 0xcccccc }));
                o.position.y = 1;
                o.position.z = -.5;
                o.castShadow = true;
                t.add(o);
                const s = new THREE.CylinderGeometry(.4, .4, .3, 16);
                const i = new THREE.MeshLambertMaterial({ color: 0x333333 });
                [[-1.2, 0, 1.5], [1.2, 0, 1.5], [-1.2, 0, -1.5], [1.2, 0, -1.5]].forEach(e => {
                    const o = new THREE.Mesh(s, i);
                    o.rotation.z = Math.PI / 2;
                    o.position.set(...e);
                    o.castShadow = true;
                    this.wheels.push(o);
                    t.add(o);
                });
                t.position.set(0, .2, 0);
                this.car = t;
                this.scene.add(t);
            }
            
            createRoad() {
                for (let t = 0; t < 3; t++) {
                    const e = new THREE.Mesh(new THREE.PlaneGeometry(12, 400), new THREE.MeshLambertMaterial({ color: 0x444444 }));
                    e.rotation.x = -Math.PI / 2;
                    e.position.z = 400 * t - 200;
                    e.receiveShadow = true;
                    this.road.push(e);
                    this.scene.add(e);
                }
                for (let t = 0; t < 20; t++) {
                    const e = new THREE.Mesh(new THREE.PlaneGeometry(.2, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                    e.rotation.x = -Math.PI / 2;
                    e.position.set(0, .01, 20 * t - 200);
                    this.scene.add(e);
                }
            }
            
            createEnvironment() {
                this.shaderMist = new ShaderMist(this.scene);
                this.createObstacles();
            }
            
            createObstacles() {
                this.gltfLoader.load('obstacle.glb', (gltf) => {
                    const obstacleModel = gltf.scene;
                    obstacleModel.scale.setScalar(0.5);
                    obstacleModel.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                        }
                    });

                    for (let i = 0; i < 15; i++) {
                        const obstacle = obstacleModel.clone();
                        obstacle.position.set((Math.random() - 0.5) * 8, 0.75, -50 - i * 25);
                        this.obstacles.push(obstacle);
                        this.scene.add(obstacle);
                    }
                }, undefined, (error) => {
                    console.log('Obstacle model not found, creating basic obstacles');
                    for (let i = 0; i < 15; i++) {
                        const obstacle = new THREE.Mesh(
                            new THREE.BoxGeometry(1.5, 1.5, 1.5),
                            new THREE.MeshLambertMaterial({ color: 0xff0000 })
                        );
                        obstacle.position.set((Math.random() - 0.5) * 8, 0.75, -50 - i * 25);
                        obstacle.castShadow = true;
                        this.obstacles.push(obstacle);
                        this.scene.add(obstacle);
                    }
                });
            }
            
            setupControls() {
                const addTouchListeners = (element, onStart, onEnd) => {
                    element.addEventListener('touchstart', onStart, { passive: false });
                    element.addEventListener('touchend', onEnd, { passive: false });
                    element.addEventListener('mousedown', onStart);
                    element.addEventListener('mouseup', onEnd);
                };
                
                addTouchListeners(
                    document.getElementById('leftBtn'),
                    (e) => { e.preventDefault(); this.controls.left = true; },
                    (e) => { e.preventDefault(); this.controls.left = false; }
                );

                addTouchListeners(
                    document.getElementById('rightBtn'),
                    (e) => { e.preventDefault(); this.controls.right = true; },
                    (e) => { e.preventDefault(); this.controls.right = false; }
                );

                addTouchListeners(
                    document.getElementById('gasBtn'),
                    (e) => { 
                        e.preventDefault(); 
                        this.controls.gas = true; 
                        if (this.engineSound.paused) {
                            this.engineSound.play().catch(e => console.error("Audio play failed:", e));
                        }
                    },
                    (e) => { 
                        e.preventDefault(); 
                        this.controls.gas = false; 
                        this.engineSound.pause();
                    }
                );
                
                addTouchListeners(
                    document.getElementById('brakeBtn'),
                    (e) => { e.preventDefault(); this.controls.brake = true; },
                    (e) => { e.preventDefault(); this.controls.brake = false; }
                );
            }
            
            setupUI() {
                document.getElementById('startBtn').onclick = () => {
                    document.getElementById('instructions').style.display = 'none';
                    this.startGame();
                };
                
                document.getElementById('restartBtn').onclick = () => {
                    this.restartGame();
                };
                
                document.getElementById('mainMenuBtn').onclick = () => {
                    this.showMainMenu();
                };
                
                document.getElementById('pauseBtn').onclick = () => {
                    this.pauseGame();
                };
                
                document.getElementById('resumeBtn').onclick = () => {
                    this.resumeGame();
                };
                
                document.getElementById('pauseRestartBtn').onclick = () => {
                    this.restartGame();
                };
                
                document.getElementById('pauseMainMenuBtn').onclick = () => {
                    this.showMainMenu();
                };
            }
            
            startGame() {
                this.gameRunning = true;
                this.gamePaused = false;
                this.particleTrail = new ParticleTrail(this.scene, this.car);
                this.animate();
            }
            
            pauseGame() {
                if (this.gameRunning && !this.gamePaused) {
                    this.gamePaused = true;
                    document.getElementById('pauseMenu').style.display = 'flex';
                    this.engineSound.pause();
                }
            }
            
            resumeGame() {
                if (this.gameRunning && this.gamePaused) {
                    this.gamePaused = false;
                    document.getElementById('pauseMenu').style.display = 'none';
                    this.animate();
                }
            }
            
            restartGame() {
                this.gameRunning = true;
                this.gamePaused = false;
                this.carSpeed = 0;
                this.carPosition = 0;
                this.distance = 0;
                this.boostMeter = 0;
                this.nearMisses = 0;
                this.maxSpeedReached = 0;
                this.car.position.set(0, 0.2, 0);
                this.obstacles.forEach((o, i) => { o.position.z = -50 - i * 25; });
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('pauseMenu').style.display = 'none';
                this.animate();
            }
            
            showMainMenu() {
                this.gameRunning = false;
                this.gamePaused = false;
                this.engineSound.pause();
                document.getElementById('gameOver').style.display = 'none';
                document.getElementById('pauseMenu').style.display = 'none';
                document.getElementById('instructions').style.display = 'flex';
            }
            
            update() {
                if (!this.gameRunning || this.gamePaused) return;
                
                if (this.controls.gas) { 
                    this.carSpeed = Math.min(this.carSpeed + 0.05, this.maxSpeed);
                    this.boostMeter = Math.min(this.boostMeter + 0.3, 100);
                } else if (this.controls.brake) { 
                    this.carSpeed = Math.max(this.carSpeed - 0.15, 0); 
                } else { 
                    this.carSpeed = Math.max(this.carSpeed - 0.025, 0); 
                }
                
                if (this.controls.left) { 
                    this.carPosition = Math.max(this.carPosition - 0.075, -4); 
                    this.car.rotation.z = 0.1; 
                } else if (this.controls.right) { 
                    this.carPosition = Math.min(this.carPosition + 0.075, 4); 
                    this.car.rotation.z = -0.1; 
                } else { 
                    this.car.rotation.z *= 0.9; 
                }
                
                this.car.position.x = this.carPosition;
                this.distance += this.carSpeed * 0.5;
                this.maxSpeedReached = Math.max(this.maxSpeedReached, this.carSpeed * 10);
                
                if (this.carSpeed > 0) {
                    this.wheelRotation += this.carSpeed * 0.1;
                    this.wheels.forEach(w => { w.rotation.x = this.wheelRotation; });
                }
                
                this.road.forEach(s => { 
                    s.position.z += this.carSpeed; 
                    if (s.position.z > 200) s.position.z -= 1200; 
                });
                
                this.obstacles.forEach(o => {
                    o.position.z += this.carSpeed; 
                    o.rotation.y += 0.05;
                    if (o.position.z > 50) { 
                        o.position.z -= 400; 
                        o.position.x = (Math.random() - 0.5) * 8; 
                    }
                    
                    const dist = this.car.position.distanceTo(o.position);
                    
                    // Near miss detection
                    if (dist < 3.5 && dist > 2.5 && o.position.z > -5 && o.position.z < 5) {
                        if (!o.nearMissTriggered) {
                            this.triggerNearMiss();
                            o.nearMissTriggered = true;
                        }
                    } else if (dist > 8) {
                        o.nearMissTriggered = false;
                    }
                    
                    if (dist < 2) { 
                        this.gameOver(); 
                    }
                });
                
                if (this.shaderMist) {
                    this.shaderMist.update(this.carSpeed);
                }
                
                this.camera.position.x = this.car.position.x * 0.3;
                
                this.updateUI();

                if (this.particleTrail) {
                    this.particleTrail.update();
                }
            }
            
            triggerNearMiss() {
                this.nearMisses++;
                this.boostMeter = Math.min(this.boostMeter + 20, 100);
                
                const comboEl = document.getElementById('comboIndicator');
                comboEl.textContent = `NEAR MISS! +${this.nearMisses}`;
                comboEl.style.opacity = '1';
                comboEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
                
                setTimeout(() => {
                    comboEl.style.opacity = '0';
                    comboEl.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 1000);
            }
            
            updateUI() {
                document.getElementById('speedometer').textContent = `Speed: ${Math.floor(this.carSpeed * 10)} mph`;
                document.getElementById('score').textContent = `Distance: ${Math.floor(this.distance)}m`;
                
                // Update boost meter
                const boostFill = document.getElementById('boostFill');
                const boostPercentage = this.boostMeter / 100;
                boostFill.style.transform = `scaleX(${boostPercentage})`;
            }
            
            gameOver() {
                this.gameRunning = false;
                this.engineSound.pause();
                document.getElementById('finalScore').textContent = Math.floor(this.distance);
                document.getElementById('maxSpeedStat').textContent = Math.floor(this.maxSpeedReached);
                document.getElementById('nearMissesStat').textContent = this.nearMisses;
                document.getElementById('gameOver').style.display = 'flex';
            }
            
            animate() {
                if (!this.gameRunning || this.gamePaused) return;
                requestAnimationFrame(() => this.animate());
                this.update();
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        class ParticleTrail {
            constructor(scene, vehicle) {
                this.scene = scene;
                this.vehicle = vehicle;
                this.particles = [];
                this.particleCount = 100;
                this.particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                this.particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });

                for (let i = 0; i < this.particleCount; i++) {
                    const particle = new THREE.Mesh(this.particleGeometry, this.particleMaterial.clone());
                    particle.visible = false;
                    this.scene.add(particle);
                    this.particles.push({
                        mesh: particle,
                        life: 0,
                        velocity: new THREE.Vector3()
                    });
                }
            }

            update() {
                this.particles.forEach(p => {
                    if (p.life > 0) {
                        p.mesh.position.add(p.velocity);
                        p.life -= 0.01;
                        p.mesh.material.opacity = p.life;
                        if (p.life <= 0) {
                            p.mesh.visible = false;
                        }
                    }
                });

                if (Math.random() > 0.5) {
                    this.emitParticle();
                }
            }

            emitParticle() {
                const inactiveParticle = this.particles.find(p => !p.mesh.visible);
                if (inactiveParticle) {
                    inactiveParticle.mesh.position.copy(this.vehicle.position);
                    inactiveParticle.mesh.position.y -= 0.2;
                    inactiveParticle.life = 1;
                    inactiveParticle.mesh.visible = true;
                    inactiveParticle.mesh.material.opacity = 1;
                    inactiveParticle.velocity.set(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    );
                }
            }
        }

        class ShaderMist {
            constructor(scene) {
                this.scene = scene;
                const particleCount = 2000;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 50;
                    positions[i+1] = Math.random() * 20;
                    positions[i+2] = (Math.random() - 0.5) * 400;
                }

                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 },
                        color: { value: new THREE.Color(0xcccccc) }
                    },
                    vertexShader: `
                        uniform float time;
                        void main() {
                            vec3 p = position;
                            p.z += sin(p.x * 10.0 + time) * 0.5;
                            p.y += cos(p.z * 5.0 + time) * 0.5;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                            gl_PointSize = 5.0;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float time;

                        float random (vec2 st) {
                            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                        }

                        void main() {
                            float d = distance(gl_PointCoord, vec2(0.5));
                            if (d > 0.5) discard;
                            float alpha = 1.0 - d;
                            alpha *= (sin(time * 0.1) + 1.0) / 2.0;
                            gl_FragColor = vec4(color, alpha * 0.2);
                        }
                    `,
                    transparent: true,
                    depthWrite: false
                });

                this.points = new THREE.Points(particles, material);
                this.scene.add(this.points);
            }

            update(carSpeed) {
                this.points.material.uniforms.time.value += carSpeed * 0.05;
            }
        }
        
        window.addEventListener('load', () => { new MobileRacingGame(); });
    </script>
</body>
