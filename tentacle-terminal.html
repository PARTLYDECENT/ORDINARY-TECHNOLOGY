<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Mobile Racing</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #speedometer {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        #controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            pointer-events: auto;
        }

        .control-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #667eea, #764ba2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            user-select: none;
            backdrop-filter: blur(10px);
            transition: all 0.1s ease;
        }

        .control-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        #leftBtn {
            left: 30px;
            bottom: 30px;
        }

        #rightBtn {
            left: 120px;
            bottom: 30px;
        }

        #gasBtn {
            right: 30px;
            bottom: 120px;
            background: linear-gradient(145deg, #4CAF50, #45a049);
        }

        #brakeBtn {
            right: 30px;
            bottom: 30px;
            background: linear-gradient(145deg, #f44336, #d32f2f);
        }
        
        #gameOver, #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #gameOver { display: none; }
        #instructions { z-index: 200; }

        #restartBtn, #startBtn {
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }

        #startBtn { background: linear-gradient(145deg, #4CAF50, #45a049); }
        #restartBtn { background: linear-gradient(145deg, #667eea, #764ba2); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="speedometer">Speed: 0 mph</div>
            <div id="score">Distance: 0m</div>
            
            <div id="controls">
                <button class="control-btn" id="leftBtn">⬅️</button>
                <button class="control-btn" id="rightBtn">➡️</button>
                <button class="control-btn" id="brakeBtn">🛑</button>
                <button class="control-btn" id="gasBtn">⚡</button>
            </div>
            
            <div id="gameOver">
                <h2>Game Over!</h2>
                <p>Final Distance: <span id="finalScore">0</span>m</p>
                <button id="restartBtn">Restart</button>
            </div>
            
            <div id="instructions">
                <h2>🏎️ 3D Racing Game</h2>
                <p>Use the buttons to steer, accelerate and brake.</p>
                <p><strong>Avoid the obstacles and drive as far as you can!</strong></p>
                <button id="startBtn">Start Game</button>
            </div>
        </div>
    </div>
    
    <audio id="engineSound" src="engine.mp3" loop></audio>
    <audio src="track3.mp3" autoplay loop></audio>
    <audio id="warpSound1" src="warp_sound.mp3"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

    <script>
        class MobileRacingGame {
            constructor() {
                this.scene = null; this.camera = null; this.renderer = null; this.car = null;
                this.wheels = []; this.road = []; this.obstacles = [];
                
                this.gameRunning = false; this.carSpeed = 0; this.carPosition = 0; this.distance = 0;
                this.maxSpeed = 1; this.wheelRotation = 0;
                
                this.engineSound = document.getElementById('engineSound');
                this.warpSounds = [
                    document.getElementById('warpSound1')
                ];
                this.warpInterval = null;

                this.controls = { left: false, right: false, gas: false, brake: false };
                
                this.gltfLoader = new THREE.GLTFLoader();
                this.rgbeLoader = new THREE.RGBELoader();
                
                this.init();
                this.setupControls();
                this.setupUI();
            }
            
            init() {
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x87ceeb, 50, 300);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 8, 12);
                this.camera.lookAt(0, 0, 0);
                const canvas = document.getElementById('gameCanvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87ceeb);
                this.renderer.shadowMap.enabled = true;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 0.6;

                // Load road texture
                this.textureLoader = new THREE.TextureLoader();
                this.roadTexture = this.textureLoader.load('advert1.jpg', (texture) => {
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;
                    texture.repeat.set(1, 10); // Adjust these values for desired tiling
                    this.createRoad(); // <--- Move createRoad here
                }, undefined, (error) => {
                    console.error("Error loading road texture:", error);
                    // Fallback: create road with default material if texture fails to load
                    this.createRoad(true); // Pass a flag to indicate fallback
                });

                this.loadSkybox();
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 20, 5);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                this.loadCarModel();
                // this.createRoad(); // <--- Remove this call
                this.createEnvironment();
                window.addEventListener('resize', () => this.onWindowResize(), false);
            }
            
            loadSkybox(){ /* ... code unchanged ... */ this.rgbeLoader.load('sky.hdr',t=>{t.mapping=THREE.EquirectangularReflectionMapping,this.scene.background=t,this.scene.environment=t},void 0,e=>{console.log("HDR skybox not found"),this.scene.add(new THREE.Mesh(new THREE.SphereGeometry(500,32,15),new THREE.MeshBasicMaterial({color:10672365,side:THREE.BackSide})))})}
            loadCarModel() {
                this.gltfLoader.load('car.glb',
                    (gltf) => {
                        this.carModel = gltf.scene;
                        this.carModel.scale.setScalar(1);
                        this.carModel.position.set(0, 0, 0);
                        this.carModel.traverse(node => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });
                        this.createCarWithWheels();
                        const startBtn = document.getElementById('startBtn');
                        startBtn.disabled = false;
                        startBtn.textContent = 'Start Game';
                    },
                    undefined,
                    (error) => {
                        console.log("GLB car model not found");
                        this.createBasicCar();
                        const startBtn = document.getElementById('startBtn');
                        startBtn.disabled = false;
                        startBtn.textContent = 'Start Game';
                    }
                );
            }
            createCarWithWheels(){const t=new THREE.Group;t.add(this.carModel);const e=new THREE.CylinderGeometry(.4,.4,.3,16),o=new THREE.MeshLambertMaterial({color:3355443});[[-1.2,0,1.5],[1.2,0,1.5],[-1.2,0,-1.5],[1.2,0,-1.5]].forEach(s=>{const i=new THREE.Mesh(e,o);i.rotation.z=Math.PI/2,i.position.set(...s),i.castShadow=!0,this.wheels.push(i),t.add(i)}),t.position.set(0,.2,0),this.car=t,this.scene.add(t)}
            createBasicCar(){/* ... code unchanged ... */ const t=new THREE.Group,e=new THREE.Mesh(new THREE.BoxGeometry(2,.8,4),new THREE.MeshLambertMaterial({color:16729156}));e.position.y=.4,e.castShadow=!0,t.add(e);const o=new THREE.Mesh(new THREE.BoxGeometry(1.8,.6,2),new THREE.MeshLambertMaterial({color:13382451}));o.position.y=1,o.position.z=-.5,o.castShadow=!0,t.add(o);const s=new THREE.CylinderGeometry(.4,.4,.3,16),i=new THREE.MeshLambertMaterial({color:3355443});[[-1.2,0,1.5],[1.2,0,1.5],[-1.2,0,-1.5],[1.2,0,-1.5]].forEach(e=>{const o=new THREE.Mesh(s,i);o.rotation.z=Math.PI/2,o.position.set(...e),o.castShadow=!0,this.wheels.push(o),t.add(o)}),t.position.set(0,.2,0),this.car=t,this.scene.add(t)}
            createRoad(useFallback = false) {
                let roadMaterial;
                if (useFallback || !this.roadTexture) {
                    roadMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 }); // Default color
                } else {
                    roadMaterial = new THREE.MeshLambertMaterial({ map: this.roadTexture });
                }

                for (let t = 0; t < 3; t++) {
                    const e = new THREE.Mesh(
                        new THREE.PlaneGeometry(12, 400),
                        roadMaterial
                    );
                    e.rotation.x = -Math.PI / 2;
                    e.position.z = 400 * t - 200;
                    e.receiveShadow = true;
                    this.road.push(e);
                    this.scene.add(e);
                }
                for (let t = 0; t < 20; t++) {
                    const e = new THREE.Mesh(
                        new THREE.PlaneGeometry(.2, 4),
                        new THREE.MeshBasicMaterial({ color: 16777215 })
                    );
                    e.rotation.x = -Math.PI / 2;
                    e.position.set(0, .01, 20 * t - 200);
                    this.scene.add(e);
                }
            }
            createEnvironment(){
                this.shaderMist = new ShaderMist(this.scene);
                this.createObstacles();
            }
            createObstacles() {
                this.gltfLoader.load('obstacle.glb', (gltf) => {
                    const obstacleModel = gltf.scene;
                    obstacleModel.scale.setScalar(0.5); // Adjust scale if needed
                    obstacleModel.traverse(node => {
                        if (node.isMesh) {
                            node.castShadow = true;
                        }
                    });

                    for (let i = 0; i < 15; i++) {
                        const obstacle = obstacleModel.clone();
                        obstacle.position.set((Math.random() - 0.5) * 8, 0.75, -50 - i * 25);
                        this.obstacles.push(obstacle);
                        this.scene.add(obstacle);
                    }
                }, undefined, (error) => {
                    console.error('An error happened while loading the obstacle model:', error);
                    // Fallback to basic cubes if the model fails to load
                    for (let i = 0; i < 15; i++) {
                        const obstacle = new THREE.Mesh(
                            new THREE.BoxGeometry(1.5, 1.5, 1.5),
                            new THREE.MeshLambertMaterial({ color: 0xff0000 })
                        );
                        obstacle.position.set((Math.random() - 0.5) * 8, 0.75, -50 - i * 25);
                        obstacle.castShadow = true;
                        this.obstacles.push(obstacle);
                        this.scene.add(obstacle);
                    }
                });
            }
            
            setupControls() {
                const addTouchListeners = (element, onStart, onEnd) => {
                    element.addEventListener('touchstart', onStart, { passive: false });
                    element.addEventListener('touchend', onEnd, { passive: false });
                    element.addEventListener('mousedown', onStart);
                    element.addEventListener('mouseup', onEnd);
                };
                
                addTouchListeners(
                    document.getElementById('leftBtn'),
                    (e) => { e.preventDefault(); this.controls.left = true; },
                    (e) => { e.preventDefault(); this.controls.left = false; }
                );

                addTouchListeners(
                    document.getElementById('rightBtn'),
                    (e) => { e.preventDefault(); this.controls.right = true; },
                    (e) => { e.preventDefault(); this.controls.right = false; }
                );

                addTouchListeners(
                    document.getElementById('gasBtn'),
                    (e) => { 
                        e.preventDefault(); 
                        this.controls.gas = true; 
                        if (this.engineSound.paused) {
                            this.engineSound.play().catch(e => console.error("Audio play failed:", e));
                        }
                    },
                    (e) => { 
                        e.preventDefault(); 
                        this.controls.gas = false; 
                        this.engineSound.pause();
                    }
                );
                
                addTouchListeners(
                    document.getElementById('brakeBtn'),
                    (e) => { e.preventDefault(); this.controls.brake = true; },
                    (e) => { e.preventDefault(); this.controls.brake = false; }
                );
            }
            
            setupUI() {
                document.getElementById('startBtn').onclick = () => {
                    document.getElementById('instructions').style.display = 'none';
                    this.startGame();
                };
                document.getElementById('restartBtn').onclick = () => {
                    this.restartGame();
                };
            }
            
            startGame() {
                this.gameRunning = true;
                if (this.backgroundMusic && this.backgroundMusic.paused) {
                    this.backgroundMusic.play().catch(e => console.error("BG Music play failed:", e));
                }
                this.particleTrail = new ParticleTrail(this.scene, this.car);
                this.warpInterval = setInterval(() => this.playRandomWarpSound(), 30000);
                this.animate();
            }
            
            restartGame() {
                this.gameRunning = true; this.carSpeed = 0; this.carPosition = 0; this.distance = 0;
                this.car.position.set(0, 0.2, 0);
                this.obstacles.forEach((o, i) => { o.position.z = -50 - i * 25; });
                document.getElementById('gameOver').style.display = 'none';
                this.warpInterval = setInterval(() => this.playRandomWarpSound(), 30000);
                this.animate();
            }
            
            update() {
                if (!this.gameRunning) return;
                
                if (this.controls.gas) { this.carSpeed = Math.min(this.carSpeed + 0.05, this.maxSpeed); }
                else if (this.controls.brake) { this.carSpeed = Math.max(this.carSpeed - 0.15, 0); }
                else { this.carSpeed = Math.max(this.carSpeed - 0.025, 0); }
                
                if (this.controls.left) { this.carPosition = Math.max(this.carPosition - 0.075, -4); this.car.rotation.z = 0.1; }
                else if (this.controls.right) { this.carPosition = Math.min(this.carPosition + 0.075, 4); this.car.rotation.z = -0.1; }
                else { this.car.rotation.z *= 0.9; }
                
                this.car.position.x = this.carPosition;
                this.distance += this.carSpeed * 0.5;
                
                if (this.carSpeed > 0) {
                    this.wheelRotation += this.carSpeed * 0.1;
                    this.wheels.forEach(w => { w.rotation.x = this.wheelRotation; });
                }
                
                this.road.forEach(s => { s.position.z += this.carSpeed; if (s.position.z > 200) s.position.z -= 1200; });
                
                this.obstacles.forEach(o => {
                    o.position.z += this.carSpeed; o.rotation.y += 0.05;
                    if (o.position.z > 50) { o.position.z -= 400; o.position.x = (Math.random() - 0.5) * 8; }
                    const dist = this.car.position.distanceTo(o.position);
                    if (dist < 2) { this.gameOver(); }
                });
                
                if (this.shaderMist) {
                    this.shaderMist.update(this.carSpeed);
                }
                
                this.camera.position.x = this.car.position.x * 0.3;
                
                document.getElementById('speedometer').textContent = `Speed: ${Math.floor(this.carSpeed * 10)} mph`;
                document.getElementById('score').textContent = `Distance: ${Math.floor(this.distance)}m`;

                if (this.particleTrail) {
                    this.particleTrail.update();
                }
            }
            
            gameOver() {
                this.gameRunning = false;
                this.engineSound.pause();
                clearInterval(this.warpInterval);
                document.getElementById('finalScore').textContent = Math.floor(this.distance);
                document.getElementById('gameOver').style.display = 'block';
            }
            
            animate() {
                if (!this.gameRunning) return;
                requestAnimationFrame(() => this.animate());
                this.update();
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            playRandomWarpSound() {
                const randomIndex = Math.floor(Math.random() * this.warpSounds.length);
                this.warpSounds[randomIndex].play().catch(e => console.error("Audio play failed:", e));
            }
        }

        class ParticleTrail {
            constructor(scene, vehicle) {
                this.scene = scene;
                this.vehicle = vehicle;
                this.particles = [];
                this.particleCount = 100;
                this.particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                this.particleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });

                for (let i = 0; i < this.particleCount; i++) {
                    const particle = new THREE.Mesh(this.particleGeometry, this.particleMaterial.clone());
                    particle.visible = false;
                    this.scene.add(particle);
                    this.particles.push({
                        mesh: particle,
                        life: 0,
                        velocity: new THREE.Vector3()
                    });
                }
            }

            update() {
                const now = performance.now();
                this.particles.forEach(p => {
                    if (p.life > 0) {
                        p.mesh.position.add(p.velocity);
                        p.life -= 0.01;
                        p.mesh.material.opacity = p.life;
                        if (p.life <= 0) {
                            p.mesh.visible = false;
                        }
                    }
                });

                if (Math.random() > 0.5) { // Emit particles intermittently
                    this.emitParticle();
                }
            }

            emitParticle() {
                const inactiveParticle = this.particles.find(p => !p.mesh.visible);
                if (inactiveParticle) {
                    inactiveParticle.mesh.position.copy(this.vehicle.position);
                    inactiveParticle.mesh.position.y -= 0.2; // Start below the car
                    inactiveParticle.life = 1;
                    inactiveParticle.mesh.visible = true;
                    inactiveParticle.mesh.material.opacity = 1;
                    inactiveParticle.velocity.set(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    );
                }
            }
        }

        class ShaderMist {
            constructor(scene) {
                this.scene = scene;
                const particleCount = 2000;
                const particles = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 50;
                    positions[i+1] = Math.random() * 20;
                    positions[i+2] = (Math.random() - 0.5) * 400;
                }

                particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0.0 },
                        color: { value: new THREE.Color(0xcccccc) }
                    },
                    vertexShader: `
                        uniform float time;
                        void main() {
                            vec3 p = position;
                            p.z += sin(p.x * 10.0 + time) * 0.5;
                            p.y += cos(p.z * 5.0 + time) * 0.5;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                            gl_PointSize = 5.0;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float time;

                        // 2D Random function
                        float random (vec2 st) {
                            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                        }

                        void main() {
                            float d = distance(gl_PointCoord, vec2(0.5));
                            if (d > 0.5) discard;
                            float alpha = 1.0 - d;
                            alpha *= (sin(time * 0.1) + 1.0) / 2.0; // Fade in and out
                            gl_FragColor = vec4(color, alpha * 0.2);
                        }
                    `,
                    transparent: true,
                    depthWrite: false
                });

                this.points = new THREE.Points(particles, material);
                this.scene.add(this.points);
            }

            update(carSpeed) {
                this.points.material.uniforms.time.value += carSpeed * 0.05;
            }
        }
        
        window.addEventListener('load', () => { new MobileRacingGame(); });
    </script>
</body>
</html>
